    // mouse path used to rely on Potree's hoveredElements raycast, but the
    // sphere geometry is only ~15 px on screen so a click that's even a few
    // pixels off misses entirely. Touch dragging worked because it bypassed
    // the raycast; mouse dragging stopped working after the touch session
    // because the same forgiving lookup wasn't wired for mouse. This restores
    // parity by giving mouse-driven sphere drag the same 18 px tolerance.
    function findNearestMeasurementSphere(mousePixel) {
      if (!viewer.scene.measurements || viewer.scene.measurements.length === 0) return null;
      var camera = viewer.scene.getActiveCamera();
      if (!camera) return null;
      var rect = renderArea.getBoundingClientRect();
      var best = null;
      var bestPxSq = 196; // 14 px — matches the node's on-screen size
      var meas = viewer.scene.measurements;
      for (var mi = 0; mi < meas.length; mi++) {
        var m = meas[mi];
        if (m.visible === false) continue;
        var sph = m.spheres;
        if (!sph) continue;
        for (var si = 0; si < sph.length; si++) {
          var s = sph[si];
          if (!s.visible || !s._listeners || !s._listeners.drag) continue;
          var wp = s.getWorldPosition(new THREE.Vector3());
          var ndc = wp.project(camera);
          if (ndc.z < -1 || ndc.z > 1) continue;
          var sx = (ndc.x + 1) * 0.5 * rect.width;
          var sy = (1 - (ndc.y + 1) * 0.5) * rect.height;
          var dx = sx - mousePixel.x;
          var dy = sy - mousePixel.y;
          var dsq = dx * dx + dy * dy;
          if (dsq < bestPxSq) { bestPxSq = dsq; best = s; }
        }
      }
      return best;
    }

    var markerDragActive = false;
    var markerDragInfo = null;

    // -- Find nearest snap target (member endpoints, constraint points, measurement points) --
    function findSnapTarget(mousePixel, threshold) {
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = threshold;
      var bestResult = null;

      function check(worldPos, label) {
        var pt = worldPos.clone().project(camera);
        var screenX = (pt.x * 0.5 + 0.5) * rect.width;
        var screenY = (1 - (pt.y * 0.5 + 0.5)) * rect.height;
        var dx = screenX - mousePixel.x;
        var dy = screenY - mousePixel.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < bestDist) {
          bestDist = dist;
          bestResult = { position: worldPos.clone(), label: label };
        }
      }

      // Member endpoints
      for (var mi = 0; mi < members.length; mi++) {
        var m = members[mi];
        if (!m.visible) continue;
        check(m.points[0], m.name + ' start');
        check(m.points[1], m.name + ' end');
      }

      // Constraint definition points
      for (var ci = 0; ci < constraints.length; ci++) {
        var c = constraints[ci];
        if (!c.visible) continue;
        for (var pi = 0; pi < c.points.length; pi++) {
          check(c.points[pi], c.name + ' pt' + (pi + 1));
        }
      }

      // Measurement points — but NOT the point currently being placed (the
      // dragged sphere of an in-progress measurement), or it would "snap to
      // itself" and refuse to move onto a model feature under the cursor.
      var measurements = viewer.scene.measurements || [];
      var draggedObj = (viewer.inputHandler && viewer.inputHandler.drag) ? viewer.inputHandler.drag.object : null;
      for (var i = 0; i < measurements.length; i++) {
        var meas = measurements[i];
        var nums = measurePointNumbers.get(meas);
        for (var j = 0; j < meas.points.length; j++) {
          if (draggedObj && meas.spheres && meas.spheres[j] === draggedObj) continue;
          var pos = meas.points[j].position || meas.points[j];
          var pLabel = nums && j < nums.length ? 'D' + nums[j] : 'D?';
          check(pos, pLabel);
        }
      }

      // (Model vertex/edge snapping is handled in the picker, which shares the one
      // model raycast it already does for surface-follow — see modelFeatureNear.)

      return bestResult;
    }

    // -- Export members as DXF --
    function exportMembersDXF() {
      if (members.length === 0) {
        showToast('No members to export');
        return;
      }
      var lines = [];
      lines.push('0', 'SECTION', '2', 'TABLES');
      lines.push('0', 'TABLE', '2', 'LAYER', '70', '' + members.length);
      for (var i = 0; i < members.length; i++) {
        lines.push('0', 'LAYER', '2', members[i].name, '70', '0', '62', '7', '6', 'CONTINUOUS');
      }
      lines.push('0', 'ENDTAB');
      lines.push('0', 'ENDSEC');
      lines.push('0', 'SECTION', '2', 'ENTITIES');
      for (var j = 0; j < members.length; j++) {
        var m = members[j];
        lines.push('0', 'LINE', '8', m.name);
        lines.push('10', '' + m.points[0].x, '20', '' + m.points[0].y, '30', '' + m.points[0].z);
        lines.push('11', '' + m.points[1].x, '21', '' + m.points[1].y, '31', '' + m.points[1].z);
      }
      lines.push('0', 'ENDSEC');
      lines.push('0', 'EOF');
      var content = lines.join('\n');
      var blob = new Blob([content], { type: 'application/dxf' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'members.dxf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Exported ' + members.length + ' member(s) to DXF');
    }

    // -- Render constraint + member visuals in overlay pass --
    viewer.addEventListener("render.pass.perspective_overlay", function(e) {
      var camera = viewer.scene.getActiveCamera();

      // Constraint visuals
      if (constraintScene.children.length > 0) {
        var _defRSize = viewer.renderer.getSize(new THREE.Vector2());
        for (var ci = 0; ci < constraints.length; ci++) {
          var c = constraints[ci];
          if (!c.visual) continue;
          c.visual.traverse(function(obj) {
            if (obj.userData && obj.userData.isDefinitionPoint) {
              obj.quaternion.copy(camera.quaternion);
            }
            if (obj.userData && obj.userData.isMarkerSphere) {
              _scaleMarkerSphere(obj, camera, _defRSize);
            }
          });
        }
        // Temporary pick markers also walk their tree for isMarkerSphere.
        for (var pmi = 0; pmi < constraintPickMarkers.length; pmi++) {
          constraintPickMarkers[pmi].traverse(function (obj) {
            if (obj.userData && obj.userData.isMarkerSphere) {
              _scaleMarkerSphere(obj, camera, _defRSize);
            }
          });
        }
        // Hover-preview sphere lives as a direct child of constraintScene.
        if (_constraintPreviewSphere && _constraintPreviewSphere.userData.isMarkerSphere) {
          _scaleMarkerSphere(_constraintPreviewSphere, camera, _defRSize);
        }
        // Keep the rubber-band line's endpoints synced to any markers that
        // exist (final positions after second pick is placed, etc.).
        if (_xAxisRubberLine && constraintPickMarkers.length >= 1) {
          var _rbPos = _xAxisRubberLine.geometry.attributes.position;
          var _rbA = constraintPickMarkers[0].position;
          _rbPos.setXYZ(0, _rbA.x, _rbA.y, _rbA.z);
          if (constraintPickMarkers.length >= 2) {
            var _rbB = constraintPickMarkers[1].position;
            _rbPos.setXYZ(1, _rbB.x, _rbB.y, _rbB.z);
          }
          _rbPos.needsUpdate = true;
        }
        viewer.renderer.render(constraintScene, camera);
      }

      // Member visuals
      if (memberScene.children.length > 0) {
        var _mbRSize = viewer.renderer.getSize(new THREE.Vector2());
        for (var mi = 0; mi < members.length; mi++) {
          var m = members[mi];
          if (!m.visual) continue;
          m.visual.traverse(function(obj) {
            if (obj.userData && obj.userData.isMemberEndpoint) {
              obj.quaternion.copy(camera.quaternion);
            }
            if (obj.userData && obj.userData.isMarkerSphere) {
              _scaleMarkerSphere(obj, camera, _mbRSize);
            }
          });
        }
        // Pick markers (temporary, during member-pick session)
        for (var pi = 0; pi < memberPickMarkers.length; pi++) {
          memberPickMarkers[pi].quaternion.copy(camera.quaternion);
          memberPickMarkers[pi].traverse(function (obj) {
            if (obj.userData && obj.userData.isMarkerSphere) {
              _scaleMarkerSphere(obj, camera, _mbRSize);
            }
          });
        }
        // Cursor preview sphere (direct child of memberScene during a pick)
        if (_memberPreviewSphere && _memberPreviewSphere.userData.isMarkerSphere) {
          _scaleMarkerSphere(_memberPreviewSphere, camera, _mbRSize);
        }
        viewer.renderer.render(memberScene, camera);
      }

      // Elevation contours moved to render.pass.depth_overlay (depth-tested against point cloud)

      // Measurement point labels — push outward along the segment so the D#
      // label is on the OPPOSITE side of the endpoint from the segment midpoint
      // (where Potree's edge/height/area dimension labels sit). Guarantees the
      // D# label never sits on top of the dimension value.
      // Iterate the measurePointLabels Map directly. Was gated on
      // measureLabelScene.children.length, but the Dev2 chrome reparents the
      // labels out of that scene into its own depth-tested scene — so the
      // legacy check now always fails and per-frame scaling+offset never ran,
      // leaving labels at their default (huge) sprite scale, centered on the
      // measurement point.
      if (measurePointLabels && measurePointLabels.size > 0) {
        measurePointLabels.forEach(function(_labels, measure) {
          repositionMeasureLabels(measure, camera);
          // Reassert model/cloud colours every frame: Potree's Measure.update()
          // resets spheres+edges to the shared measure.color on each geometry
          // change (and fires marker_moved before update()), so event-time
          // colouring alone won't stick.
          applyMeasureColors(measure, _labels);
        });
        viewer.renderer.render(measureLabelScene, camera);
      }
    });

    // -- Render elevation contours + labels with depth testing against point cloud --
    viewer.addEventListener("render.pass.depth_overlay", function(e) {
      if (elevationContoursVisible && elevationScene.children.length > 0) {
        var camera = viewer.scene.getActiveCamera();
        try { viewer.renderer.render(elevationScene, camera); } catch(e) { console.warn('Elevation scene render error:', e); }
      }
    });

    // -- Elevation: re-color newly streamed nodes each frame --
    viewer.addEventListener('update', elevationFrameUpdate);

    // -- Toggle mark mode --
    var _markPreviewSphere = null;
    function toggleMarkMode(forceOff) {
      if (forceOff) {
        MARK_MODE = false;
      } else {
        MARK_MODE = !MARK_MODE;
      }
      if (MARK_MODE && constraintPickMode) cancelConstraintPick();
      if (MARK_MODE && memberPickMode) cancelMemberPick();
      // Red hover-preview sphere — same pattern as notes / constraint picks.
      // No crosshair body class: the floating red sphere IS the visual cue.
      if (MARK_MODE) {
        if (!_markPreviewSphere) {
          _markPreviewSphere = _makePreviewSphere(0xff2020);
          markerScene.add(_markPreviewSphere);
        }
      } else if (_markPreviewSphere) {
        _disposePreviewSphere(_markPreviewSphere, markerScene);
        _markPreviewSphere = null;
      }
      showToast(MARK_MODE ? "Mark mode ON — hover and click to mark (X or ESC to exit)" : "Mark mode OFF");
      // Update button state
      const btn = document.getElementById('btn-mark-mode');
      if (btn) btn.classList.toggle('active', MARK_MODE);
    }

    // ===== MEASUREMENT POINT LABEL FUNCTIONS =====

    // -- Create a Potree TextSprite label for measurement points --
    function createMeasurePointLabel(text, position, onModel) {
      var label = new Potree.TextSprite(text);
      label.setTextColor(onModel ? {r: 0, g: 229, b: 255, a: 1.0} : {r: 255, g: 0, b: 0, a: 1.0});
      label.setBorderColor({r: 0, g: 0, b: 0, a: 0.0});
      label.setBackgroundColor({r: 0, g: 0, b: 0, a: 0.0});
      // TextSprite generates its texture in its constructor at the default fontsize (28).
      // Setting .fontsize alone does NOT regenerate the texture; we must call update()
      // to re-render the canvas at the new size so D# matches Potree's edge labels (16).
      label.fontsize = 16;
      label.update();
      label.material.depthTest = false;
      label.material.depthWrite = false;
      label.material.transparent = true;
      label.position.copy(position);
      label.userData.isMeasureLabel = true;
      label.userData._onModel = !!onModel;
      return label;
    }

    // -- Get the D-name for a given point index within a measure --
    function getPointName(measure, idx) {
      var nums = measurePointNumbers.get(measure);
      if (nums && idx < nums.length) return 'D' + nums[idx];
      return 'D?';
    }

    // -- Reposition a single measure's D# labels with screen-space outward offset.
    // Shared by per-frame render and post-add sync so newly-placed labels land
    // at their final offset position immediately (no one-frame "jump").
    function repositionMeasureLabels(measure, camera) {
      var labels = measurePointLabels.get(measure);
      if (!labels || labels.length === 0) return;
      if (!camera) camera = viewer.scene.getActiveCamera();
      if (!camera) return;
      var size = viewer.renderer.getSize(new THREE.Vector2());
      var cw = size.width, ch = size.height;
      if (!cw || !ch) return;
      var isOrtho = camera instanceof THREE.OrthographicCamera;
      var OFFSET_PX = 26;
      var pts = measure.points;
      // While an insertion is in progress, Potree keeps the last point as a
      // trailing cursor-follow. Right after a click, that trailing point sits
      // exactly on top of the just-placed point — showing its label there is
      // a confusing duplicate. Hide it until the cursor has moved away.
      var isPending = (pendingMeasurement === measure);
      var TRAIL_HIDE_PX_SQ = 100; // 10 px
      var projected = new Array(pts.length);
      for (var pi = 0; pi < pts.length; pi++) {
        var pp = pts[pi].position ? pts[pi].position : pts[pi];
        if (!pp) { projected[pi] = null; continue; }
        var sp = pp.clone().project(camera);
        projected[pi] = {
          x: (sp.x + 1) * cw / 2,
          y: (-sp.y + 1) * ch / 2,
          z: sp.z
        };
      }
      for (var li = 0; li < labels.length; li++) {
        var lbl = labels[li];
        var pt = pts[li];
        if (!pt) continue;
        var worldPos = pt.position ? pt.position : pt;
        var dist = camera.position.distanceTo(worldPos);
        var pr = Potree.Utils.projectedRadius(1, camera, dist, cw, ch);
        if (!pr || !isFinite(pr) || pr < 0.001) pr = 1;
        var s = (70 / pr);
        lbl.scale.set(s, s, s);

        var thisScr = projected[li];
        if (!thisScr) continue;

        // Outward direction = sum of unit vectors pointing AWAY from each neighbour.
        var outX = 0, outY = 0, contributors = 0;
        var neighborIdxs = [li - 1, li + 1];
        for (var ni = 0; ni < neighborIdxs.length; ni++) {
          var nIdx = neighborIdxs[ni];
          if (nIdx < 0 || nIdx >= pts.length) continue;
          var nScr = projected[nIdx];
          if (!nScr) continue;
          var dxs = thisScr.x - nScr.x;
          var dys = thisScr.y - nScr.y;
          var slen = Math.sqrt(dxs * dxs + dys * dys);
          if (slen > 0.5) {
            outX += dxs / slen;
            outY += dys / slen;
            contributors++;
          }
        }
        if (contributors === 0) {
          outY = -1;
        } else {
          var olen = Math.sqrt(outX * outX + outY * outY);
          if (olen < 0.001) { outX = 0; outY = -1; }
          else { outX /= olen; outY /= olen; }
        }

        var screenX = thisScr.x + outX * OFFSET_PX;
        var screenY = thisScr.y + outY * OFFSET_PX;

        var ndcX = (screenX / cw) * 2 - 1;
        var ndcY = -(screenY / ch) * 2 + 1;
        var nearPoint = new THREE.Vector3(ndcX, ndcY, thisScr.z).unproject(camera);

        if (isOrtho) {
          lbl.position.copy(nearPoint);
        } else {
          var dir = nearPoint.sub(camera.position).normalize();
          lbl.position.copy(camera.position.clone().add(dir.multiplyScalar(dist)));
        }

        // Trailing-label suppression: during an in-progress insertion, the
        // last point follows the cursor. Hide its label whenever it sits on
        // top of the previous (just-placed) point — it'll reveal as soon as
        // the cursor moves away. measure.visible still acts as the master
        // toggle from the sidebar.
        if (isPending && li === labels.length - 1 && li > 0) {
          var prevScr = projected[li - 1];
          if (prevScr) {
            var pdx = thisScr.x - prevScr.x;
            var pdy = thisScr.y - prevScr.y;
            var tooClose = (pdx * pdx + pdy * pdy) < TRAIL_HIDE_PX_SQ;
            lbl.visible = measure.visible && !tooClose;
          } else {
            lbl.visible = measure.visible;
          }
        } else {
          lbl.visible = measure.visible;
        }
      }
    }

    // -- Sync labels for a measurement (create/remove/update) --
    function syncMeasurePointLabels(measure) {
      var labels = measurePointLabels.get(measure);
      if (!labels) { labels = []; measurePointLabels.set(measure, labels); }
      var nums = measurePointNumbers.get(measure);
      if (!nums) { nums = []; measurePointNumbers.set(measure, nums); }

      var pts = measure.points;

      // Reclaim P-numbers for removed ghost points (e.g. ESC during measurement)
      while (nums.length > pts.length) {
        var removed = nums.pop();
        // Reclaim if it was the very latest assigned number
        if (removed === nextPointNumber - 1) {
          nextPointNumber--;
        }
      }

      // Assign global P-numbers to any new points
      while (nums.length < pts.length) {
        nums.push(nextPointNumber++);
      }

      // Remove excess labels
      while (labels.length > pts.length) {
        var old = labels.pop();
        measureLabelScene.remove(old);
        old.traverse(function(obj) {
          if (obj.material) {
            if (obj.material.map) obj.material.map.dispose();
            obj.material.dispose();
          }
        });
      }
      // Create missing labels
      while (labels.length < pts.length) {
        var idx = labels.length;
        var pos = pts[idx].position ? pts[idx].position.clone() : pts[idx].clone();
        var onMC = isPositionOnModel(pos);
        var lbl = createMeasurePointLabel('D' + nums[idx], pos, onMC);
        lbl.userData._lastCheckedPos = pos.clone();
        lbl.visible = measure.visible;
        measureLabelScene.add(lbl);
        labels.push(lbl);
      }
      // Update positions, and re-evaluate model/cloud colour for points that moved.
      for (var i = 0; i < labels.length; i++) {
        var p = pts[i].position ? pts[i].position : pts[i];
        var lc = labels[i].userData._lastCheckedPos;
        if (!lc || lc.distanceToSquared(p) > 1e-6) {
          var onM = isPositionOnModel(p);
          labels[i].userData._lastCheckedPos = p.clone();
          if (labels[i].userData._onModel !== onM) {
            measureLabelScene.remove(labels[i]);
            labels[i].traverse(function(o) { if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
            labels[i] = createMeasurePointLabel('D' + nums[i], p, onM);
            labels[i].userData._lastCheckedPos = p.clone();
            measureLabelScene.add(labels[i]);
          }
        }
        labels[i].position.copy(p);
        labels[i].visible = measure.visible;
      }
      // Colour spheres + connecting edges by on-model state (also reasserted
      // every frame — see applyMeasureColors for why that's required).
      applyMeasureColors(measure, labels);
      // Apply final screen-space offset/scale now so labels don't visibly jump
      // on the next frame when the per-frame reposition pass runs.
      repositionMeasureLabels(measure);
    }

    // -- Colour a measurement's spheres + edges by on-model state. --
    // A point ON the model is teal; on the cloud, red. An edge is teal ONLY when
    // BOTH its endpoints are on the model — any edge touching a cloud point
    // (including a model→cloud span) stays red.
    //
    // Two non-obvious reasons each element gets its OWN Color object (rather than
    // the obvious sph.material.color.setHex()), re-applied every frame:
    //   1. Potree's Measure.update() runs on every geometry change and sets
    //      sphere.material.color / edge.material.color = the single shared
    //      measure.color object. setHex() on that would bleed one point's colour
    //      onto the whole measurement.
    //   2. setMarker/setPosition dispatch 'marker_moved' BEFORE calling update(),
    //      so colouring inside the event handler is immediately clobbered. Hence
    //      this is ALSO called every frame from the perspective_overlay pass.
    // Each sphere/edge gets its OWN persistent Color (created once, mutated in
    // place via setHex) so there's no per-frame allocation and no shared object
    // a stray setHex elsewhere could bleed through.
    function _measColorFor(obj, teal) {
      if (!obj.userData._measColor) obj.userData._measColor = new THREE.Color();
      obj.userData._measColor.setHex(teal ? MODEL_TEAL : 0xff0000);
      return obj.userData._measColor;
    }
    function applyMeasureColors(measure, labels) {
      if (!measure || !labels) return;
      var n = labels.length;
      for (var i = 0; i < n; i++) {
        var onM = !!(labels[i] && labels[i].userData && labels[i].userData._onModel);
        var sph = measure.spheres && measure.spheres[i];
        if (sph && sph.material) sph.material.color = _measColorFor(sph, onM);
      }
      if (measure.edges && n > 1) {
        for (var e = 0; e < measure.edges.length; e++) {
          var aOn = !!(labels[e] && labels[e].userData && labels[e].userData._onModel);
          var bIdx = (e + 1) % n;
          var bOn = !!(labels[bIdx] && labels[bIdx].userData && labels[bIdx].userData._onModel);
          var edg = measure.edges[e];
          if (edg && edg.material) edg.material.color = _measColorFor(edg, (aOn && bOn));
        }
      }
    }

    // -- Remove all labels for a measurement --
    function removeMeasurePointLabels(measure) {
      var labels = measurePointLabels.get(measure);
      if (labels) {
        for (var i = 0; i < labels.length; i++) {
          measureLabelScene.remove(labels[i]);
          labels[i].traverse(function(obj) {
            if (obj.material) {
              if (obj.material.map) obj.material.map.dispose();
              obj.material.dispose();
            }
          });
        }
        measurePointLabels.delete(measure);
      }
      measurePointNumbers.delete(measure);
    }

    // -- Hook measurement events for labels + sidebar --
    var _measListTimer = null;
    function debouncedRebuildMeasList() {
      clearTimeout(_measListTimer);
      _measListTimer = setTimeout(rebuildAllMeasurementLists, 80);
    }

    // ===== INSERTION-STATE TRACKING =====
    // Potree's MeasuringTool/VolumeTool startInsertion does not auto-cancel a
    // previously started insertion, and `cancel_insertions` only removes its
    // mouseup listeners — it leaves the dangling cursor-follow sphere in scene
    // and the InputHandler still mid-drag. So we track which measurement is
    // currently being inserted and provide a hard "cancel + cleanup" routine.
    var pendingMeasurement = null;
    var pendingVolume = null;             // volume currently mid-insertion (cleared on drop)
    var lastMeasurementToolArgs = null;   // last viewer.measuringTool.startInsertion args
    var lastVolumeToolArgs = null;        // last viewer.volumeTool.startInsertion args

    function _measureMinPoints(m) {
      if (!m) return 2;
      if (m.showArea || m.showAngles) return 3;
      return 2;
    }

    function cleanupOrphanMeasurements() {
      var meas = (viewer.scene.measurements || []).slice();
      for (var i = 0; i < meas.length; i++) {
        var m = meas[i];
        if (m.points.length < _measureMinPoints(m)) {
          viewer.scene.removeMeasurement(m);
        }
      }
    }

    function cancelPotreeInsertion() {
      // Null pendingMeasurement BEFORE dispatching cancel_insertions.
      // Potree's cancel handler removes the trailing marker (for infinite-
      // marker tools), which fires marker_removed → syncMeasurePointLabels.
      // If pendingMeasurement is still set at sync time, the new last label
      // (which was the second-to-last and IS a committed point) would be
      // misclassified as a trailing and hidden by repositionMeasureLabels.
      pendingMeasurement = null;
      try { viewer.dispatchEvent({ type: 'cancel_insertions' }); } catch (_) {}
      try {
        if (viewer.inputHandler) {
          viewer.inputHandler.drag = null;
          // Some insertion paths (clipping/profile) disable the InputHandler and
          // only re-enable it from their own cancel callback — which isn't
          // registered for every tool/state. If that callback didn't fire, the
          // handler stays disabled and the user is stuck ("can't escape the
          // tool"). Force it back on so Esc always returns camera control.
          viewer.inputHandler.enabled = true;
        }
      } catch (_) {}
      // The volume tool leaves its half-placed box in the scene when cancelled;
      // drop any volume that was still mid-insertion when Esc was pressed.
      if (pendingVolume) {
        try { viewer.scene.removeVolume(pendingVolume); } catch (_) {}
        pendingVolume = null;
      }
      cleanupOrphanMeasurements();
    }

    function setupMeasurementLabelEvents() {
      // Track in-progress measurement & remember last tool args so Enter can
      // restart the same tool. Wrap startInsertion on both tools.
      try {
        if (viewer.measuringTool && !viewer.measuringTool._enableWrapped) {
          var origMS = viewer.measuringTool.startInsertion.bind(viewer.measuringTool);
          viewer.measuringTool.startInsertion = function(args) {
            // Cancel any previous insertion first to avoid orphan cursor spheres
            cancelPotreeInsertion();
            lastMeasurementToolArgs = args || {};
            var m = origMS(args);
            pendingMeasurement = m;
            return m;
          };
          viewer.measuringTool._enableWrapped = true;
        }
        if (viewer.volumeTool && !viewer.volumeTool._enableWrapped) {
          var origVS = viewer.volumeTool.startInsertion.bind(viewer.volumeTool);
          viewer.volumeTool.startInsertion = function(args) {
            // Don't cancel prior measurement when starting volume — different tool family
            lastVolumeToolArgs = args || {};
            var v = origVS(args);
            pendingVolume = v;   // mid-insertion until 'drop' (or cancelled by Esc)
            // After the user finishes dragging out the box, Potree fires 'drop'
            // on the volume itself. Without explicit cleanup the just-placed
            // volume stays in InputHandler.selection/hoveredElements and its
            // wireframe wins subsequent hit-tests — blocking drags on
            // pre-existing measurement spheres, marker dots, etc.
            if (v && typeof v.addEventListener === 'function') {
              v.addEventListener('drop', function() {
                pendingVolume = null;   // box committed — no longer mid-insertion
                try {
                  var ih = viewer.inputHandler;
                  if (!ih) return;
                  if (ih.drag) ih.drag = null;
                  if (ih.selection && ih.selection.indexOf(v) >= 0) {
                    try { ih.toggleSelection(v); } catch (_) {}
                  }
                  if (Array.isArray(ih.hoveredElements)) {
                    ih.hoveredElements = ih.hoveredElements.filter(function(h) {
                      var o = h && h.object;
                      while (o) { if (o === v) return false; o = o.parent; }
                      return true;
                    });
                  }
                } catch (_) {}
              });
            }
            return v;
          };
          viewer.volumeTool._enableWrapped = true;
        }
      } catch (e) { console.warn('Tool wrapping failed:', e); }

      viewer.scene.addEventListener('measurement_added', function(e) {
        var m = e.measurement;
        _ensureMid(m);   // stable id so saved-view visibility snapshots can reference it
        syncMeasurePointLabels(m);
        rebuildAllMeasurementLists();
        m.addEventListener('marker_added', function() {
          syncMeasurePointLabels(m);
          debouncedRebuildMeasList();
          undoStack.push({ type: 'measurement-point', measure: m });
          // If the in-progress measurement reaches its maxMarkers, the Potree
          // tool ends insertion automatically; clear our pending tracker and
          // re-sync so the (now-committed) last label appears immediately.
          // Without the re-sync, repositionMeasureLabels above ran while
          // pendingMeasurement was still set and hid the last label as a
          // trailing — but it isn't anymore once insertion has finished.
          if (pendingMeasurement === m && m.maxMarkers && m.points.length >= m.maxMarkers) {
            pendingMeasurement = null;
            syncMeasurePointLabels(m);
          }
        });
        m.addEventListener('marker_moved', function() {
          syncMeasurePointLabels(m);
          debouncedRebuildMeasList();
        });
        m.addEventListener('marker_removed', function() {
          syncMeasurePointLabels(m);
          debouncedRebuildMeasList();
        });
      });
      viewer.scene.addEventListener('measurement_removed', function(e) {
        removeMeasurePointLabels(e.measurement);
        if (pendingMeasurement === e.measurement) pendingMeasurement = null;
        rebuildAllMeasurementLists();
      });
      // Volume add/remove (Potree's volume tool) — refresh the volume list,
      // and keep it live during drag/scale of user-created measurement volumes
      viewer.scene.addEventListener('volume_added', function(e) {
        debouncedRebuildMeasList();
        var vol = e.volume;
        if (!vol || !isUserVolumeMeasurement(vol)) return;
        vol.addEventListener('scale_changed', debouncedRebuildMeasList);
        vol.addEventListener('position_changed', debouncedRebuildMeasList);
        vol.addEventListener('orientation_changed', debouncedRebuildMeasList);
      });
      viewer.scene.addEventListener('volume_removed', function() {
        debouncedRebuildMeasList();
      });
    }

    // Restart the most-recently-used measurement (or volume) tool. Used by Enter.
    function restartLastMeasurementTool() {
      if (lastMeasurementToolArgs && viewer.measuringTool) {
        viewer.measuringTool.startInsertion(lastMeasurementToolArgs);
        return true;
      }
      if (lastVolumeToolArgs && viewer.volumeTool) {
        viewer.volumeTool.startInsertion(lastVolumeToolArgs);
        return true;
      }
      return false;
    }

    // Delete a single point from a measurement; if the measurement would drop
    // below its required minimum, remove the whole measurement.
    function deleteMeasurementPoint(measure, idx) {
      if (!measure || !measure.points || idx < 0 || idx >= measure.points.length) return;
      var minReq = _measureMinPoints(measure);
      if (measure.points.length - 1 < minReq) {
        viewer.scene.removeMeasurement(measure);
        showToast('Removed measurement (would have too few points)');
      } else {
        measure.removeMarker(idx);
        showToast('Removed point');
      }
    }

    // ===== TRUE 3D POLYGON AREA (Newell's method) =====
    // Potree's getArea() uses an XY-only shoelace formula, so any polygon on
    // a vertical or angled surface returns 0 m². Newell's method computes the
    // best-fit-plane normal and gives the true 3D surface area regardless of
    // polygon orientation.
    function compute3DPolygonArea(pts) {
      if (!pts || pts.length < 3) return 0;
      var nx = 0, ny = 0, nz = 0;
      for (var i = 0; i < pts.length; i++) {
        var a = pts[i].position ? pts[i].position : pts[i];
        var b = pts[(i + 1) % pts.length].position ? pts[(i + 1) % pts.length].position : pts[(i + 1) % pts.length];
        nx += (a.y - b.y) * (a.z + b.z);
        ny += (a.z - b.z) * (a.x + b.x);
        nz += (a.x - b.x) * (a.y + b.y);
      }
      return 0.5 * Math.sqrt(nx * nx + ny * ny + nz * nz);
    }

    // ===== USER-CREATED VOLUMES (excludes our internally managed boxes) =====
    function isUserVolumeMeasurement(vol) {
      if (!vol) return false;
      if (typeof initialClipBox !== 'undefined' && vol === initialClipBox) return false;
      if (typeof planeOrthoSlab !== 'undefined' && vol === planeOrthoSlab) return false;
      if (typeof cutoutBoxes !== 'undefined' && cutoutBoxes.indexOf(vol) >= 0) return false;
      if (typeof elevationCropVolumes !== 'undefined' && elevationCropVolumes.indexOf(vol) >= 0) return false;
      return true;
    }

    function rebuildAllMeasurementLists() {
      rebuildMeasurementList();
      rebuildAreaList();
      rebuildAngleList();
      rebuildVolumeList();
    }

    // ===== PERSISTENT MEASUREMENT SIDEBAR LIST =====

    function rebuildMeasurementList() {
      var listEl = document.getElementById('enable-measurement-list');
      if (!listEl) return;
      var measurements = viewer.scene.measurements || [];
      // Show distance and vertical-height measurements (skip area/angle/coord-only)
      var distMeasures = [];
      for (var i = 0; i < measurements.length; i++) {
        var m = measurements[i];
        if ((m.showDistances || m.showHeight) && !m.showArea && !m.showAngles) distMeasures.push(m);
      }

      if (distMeasures.length === 0) {
        listEl.innerHTML = '';
        return;
      }

      var html = '<div class="enable-list-section-label">Distance &amp; Height' +
        '<button id="btn-clear-dist-meas" title="Delete all distance/height measurements" style="float:right;background:none;border:none;color:var(--muted,#9aa3b2);cursor:pointer;font:11px sans-serif">Delete all</button>' +
        '</div>';
      for (var mi = 0; mi < distMeasures.length; mi++) {
        var measure = distMeasures[mi];
        var nums = measurePointNumbers.get(measure);
        var pts = measure.points;
        if (!nums || pts.length < 2) {
          // Show placeholder for incomplete measurement
          var pName = (nums && nums.length > 0) ? 'D' + nums[0] : '...';
          html += '<div class="enable-meas-item">' +
            '<div class="meas-header"><span class="meas-title">' + pName + '... (picking)</span></div>' +
            '</div>';
          continue;
        }

        var firstName = 'D' + nums[0];
        var lastName = 'D' + nums[nums.length - 1];
        html += '<div class="enable-meas-item">' +
          '<div class="meas-header">' +
          '<span class="meas-title">' + firstName + ' \u2192 ' + lastName + '</span>' +
          '<button class="btn-vis meas-vis' + (measure.visible === false ? ' hidden' : '') + '" data-meas-idx="' + mi + '" title="Show/hide this dimension">\ud83d\udc41</button>' +
          '<button class="meas-delete" data-meas-idx="' + mi + '" title="Delete measurement">\u00d7</button>' +
          '</div>';

        // Per-point delete chips
        var chipsHtml = '<div class="enable-meas-points">';
        for (var ci = 0; ci < pts.length; ci++) {
          var cName = ci < nums.length ? 'D' + nums[ci] : ('P' + (ci + 1));
          chipsHtml += '<span class="point-chip">' + cName +
            '<button data-pt-list="dist" data-pt-mi="' + mi + '" data-pt-idx="' + ci + '" title="Delete this point">\u00d7</button>' +
            '</span>';
        }
        chipsHtml += '</div>';
        html += chipsHtml;

        var isHeight = measure.showHeight && !measure.showDistances;
        var total3D = 0, totalXY = 0, totalZ = 0;
        for (var si = 0; si < pts.length - 1; si++) {
          var a = pts[si].position ? pts[si].position : pts[si];
          var b = pts[si + 1].position ? pts[si + 1].position : pts[si + 1];
          var dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
          var d3d = Math.sqrt(dx * dx + dy * dy + dz * dz);
          var dxy = Math.sqrt(dx * dx + dy * dy);
          var absZ = Math.abs(dz);
          var zSign = dz >= 0 ? '+' : '-';
          total3D += d3d; totalXY += dxy; totalZ += absZ;

          var segVals = isHeight
            ? 'Vert:' + fmtLen(absZ) + '(' + zSign + ')'
            : '3D:' + fmtLen(d3d) + ' XY:' + fmtLen(dxy) + ' Z:' + fmtLen(absZ) + '(' + zSign + ')';
          html += '<div class="enable-meas-seg">' +
            '<span class="seg-name">D' + nums[si] + '\u2192D' + nums[si + 1] + '</span>' +
            '<span class="seg-vals">' + segVals + '</span>' +
            '</div>';
        }
        // Total row if multi-segment
        if (pts.length > 2) {
          var totalVals = isHeight
            ? 'Vert:' + fmtLen(totalZ)
            : '3D:' + fmtLen(total3D) + ' XY:' + fmtLen(totalXY) + ' Z:' + fmtLen(totalZ);
          html += '<div class="enable-meas-seg seg-total">' +
            '<span class="seg-name">Total</span>' +
            '<span class="seg-vals">' + totalVals + '</span>' +
            '</div>';
        }
        html += '</div>';
      }
      listEl.innerHTML = html;

      // Bind delete buttons
      listEl.querySelectorAll('.meas-delete').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var idx = parseInt(btn.getAttribute('data-meas-idx'));
          if (distMeasures[idx]) {
            viewer.scene.removeMeasurement(distMeasures[idx]);
          }
        });
      });
      // Per-measurement show/hide toggle (flip these, then Save View to capture)
      listEl.querySelectorAll('.meas-vis').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var m = distMeasures[parseInt(btn.getAttribute('data-meas-idx'))];
          if (!m) return;
          _setMeasureVisible(m, m.visible === false);     // toggle
          btn.classList.toggle('hidden', m.visible === false);
        });
      });
      var _cda = listEl.querySelector('#btn-clear-dist-meas');
      if (_cda) _cda.addEventListener('click', clearAllDistMeasurements);
      // Per-point delete chips
      listEl.querySelectorAll('.point-chip button').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var mi = parseInt(btn.getAttribute('data-pt-mi'));
          var pi = parseInt(btn.getAttribute('data-pt-idx'));
          if (distMeasures[mi]) deleteMeasurementPoint(distMeasures[mi], pi);
        });
      });
    }

    // ===== AREA LIST =====
    function rebuildAreaList() {
      var listEl = document.getElementById('enable-area-list');
      if (!listEl) return;
      var measurements = viewer.scene.measurements || [];
      var areaMeasures = [];
      for (var i = 0; i < measurements.length; i++) {
        if (measurements[i].showArea) areaMeasures.push(measurements[i]);
      }
      if (areaMeasures.length === 0) { listEl.innerHTML = ''; return; }

      var html = '<div class="enable-list-section-label">Areas</div>';
      for (var mi = 0; mi < areaMeasures.length; mi++) {
        var measure = areaMeasures[mi];
        var nums = measurePointNumbers.get(measure);
        var pts = measure.points;
        if (!pts || pts.length < 3) {
          var pName = (nums && nums.length > 0) ? 'D' + nums[0] : '...';

            '<div class="meas-header"><span class="meas-title">' + pName + '... (picking, need 3+)</span></div>' +
            '</div>';

        }
        var firstName = nums && nums.length > 0 ? 'D' + nums[0] : 'D?';
        var lastName  = nums && nums.length > 0 ? 'D' + nums[nums.length - 1] : 'D?';
        var area3D = compute3DPolygonArea(pts);
        // XY plan area for reference (Potree's native shoelace)
        var areaXY = (typeof measure.getArea === 'function') ? measure.getArea() : 0;
        var perim = 0;
        for (var pi = 0; pi < pts.length; pi++) {
          var a = pts[pi].position ? pts[pi].position : pts[pi];
          var b = pts[(pi + 1) % pts.length].position ? pts[(pi + 1) % pts.length].position : pts[(pi + 1) % pts.length];
          var dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
          perim += Math.sqrt(dx * dx + dy * dy + dz * dz);
        }
        var aChips = '<div class="enable-meas-points">';
        for (var aci = 0; aci < pts.length; aci++) {
          var acName = nums && aci < nums.length ? 'D' + nums[aci] : ('P' + (aci + 1));
          aChips += '<span class="point-chip">' + acName +
            '<button data-pt-list="area" data-pt-mi="' + mi + '" data-pt-idx="' + aci + '" title="Delete this point">\u00d7</button>' +
            '</span>';
        }
        aChips += '</div>';
        html += '<div class="enable-meas-item">' +
          '<div class="meas-header">' +
          '<span class="meas-title">' + firstName + ' \u2192 ' + lastName + ' (' + pts.length + ' pts)</span>' +
          '<button class="meas-delete" data-area-idx="' + mi + '" title="Delete area">\u00d7</button>' +
          '</div>' +
          aChips +
          '<div class="enable-meas-seg">' +
            '<span class="seg-name">Surface</span>' +
            '<span class="seg-vals">' + fmtArea(area3D) + '</span>' +
          '</div>' +
          '<div class="enable-meas-seg">' +
            '<span class="seg-name">Plan (XY)</span>' +
            '<span class="seg-vals">' + fmtArea(areaXY) + '</span>' +
          '</div>' +
          '<div class="enable-meas-seg">' +
            '<span class="seg-name">Perimeter</span>' +
            '<span class="seg-vals">' + fmtLen(perim) + '</span>' +
          '</div>' +
          '</div>';
      }
      listEl.innerHTML = html;
      listEl.querySelectorAll('.meas-delete').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var idx = parseInt(btn.getAttribute('data-area-idx'));
          if (areaMeasures[idx]) viewer.scene.removeMeasurement(areaMeasures[idx]);
        });
      });
      listEl.querySelectorAll('.point-chip button').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var mi = parseInt(btn.getAttribute('data-pt-mi'));
          var pi = parseInt(btn.getAttribute('data-pt-idx'));
          if (areaMeasures[mi]) deleteMeasurementPoint(areaMeasures[mi], pi);
        });
      });

    // ===== ANGLE LIST =====
    function rebuildAngleList() {
      var listEl = document.getElementById('enable-angle-list');
      if (!listEl) return;
      var measurements = viewer.scene.measurements || [];
      var angleMeasures = [];
      for (var i = 0; i < measurements.length; i++) {

      var html = '<div class="enable-list-section-label">Angles</div>';
      for (var mi = 0; mi < angleMeasures.length; mi++) {
        var measure = angleMeasures[mi];

          var pName = (nums && nums.length > 0) ? 'D' + nums[0] : '...';

            '<div class="meas-header"><span class="meas-title">' + pName + '... (picking, need 3+)</span></div>' +
            '</div>';
          continue;
        }
        var firstName = nums && nums.length > 0 ? 'D' + nums[0] : 'D?';
        var lastName  = nums && nums.length > 0 ? 'D' + nums[nums.length - 1] : 'D?';
        html += '<div class="enable-meas-item">' +
          '<div class="meas-header">' +
          '<span class="meas-title">' + firstName + ' \u2192 ' + lastName + ' (' + pts.length + ' pts)</span>' +
          '<button class="meas-delete" data-ang-idx="' + mi + '" title="Delete angle">\u00d7</button>' +
          '</div>';
        var gChips = '<div class="enable-meas-points">';
        for (var gci = 0; gci < pts.length; gci++) {
          var gcName = nums && gci < nums.length ? 'D' + nums[gci] : ('P' + (gci + 1));
          gChips += '<span class="point-chip">' + gcName +
            '<button data-pt-list="angle" data-pt-mi="' + mi + '" data-pt-idx="' + gci + '" title="Delete this point">\u00d7</button>' +
            '</span>';
        }
        gChips += '</div>';
        html += gChips;
        // For each interior corner, compute the angle
        var lastIdx = pts.length - 1;
        var loop = !!measure.closed;
        for (var ai = 0; ai < pts.length; ai++) {
          if (!loop && (ai === 0 || ai === lastIdx)) continue;
          var rad = (typeof measure.getAngle === 'function') ? measure.getAngle(ai) : 0;
          if (!isFinite(rad)) rad = 0;
          var deg = rad * (180 / Math.PI);
          var nm = nums && ai < nums.length ? 'D' + nums[ai] : ('P' + (ai + 1));
          html += '<div class="enable-meas-seg">' +
            '<span class="seg-name">' + nm + '</span>' +
            '<span class="seg-vals">' + deg.toFixed(2) + '\u00b0</span>' +

      listEl.innerHTML = html;
      listEl.querySelectorAll('.meas-delete').forEach(function(btn) {

        btn.addEventListener('click', function() {
          var mi = parseInt(btn.getAttribute('data-pt-mi'));
          var pi = parseInt(btn.getAttribute('data-pt-idx'));
          if (angleMeasures[mi]) deleteMeasurementPoint(angleMeasures[mi], pi);
        });
      });

    // ===== EXPORT ALL MEASUREMENTS TO TXT =====
    function exportAllMeasurements() {
      var measurements = viewer.scene.measurements || [];
      var distMeasures = [], areaMeasures = [], angleMeasures = [];
      for (var i = 0; i < measurements.length; i++) {
        var m = measurements[i];
        if (m.showArea && m.points.length >= 3) areaMeasures.push(m);
        else if (m.showAngles && m.points.length >= 3) angleMeasures.push(m);
        else if ((m.showDistances || m.showHeight) && m.points.length >= 2) distMeasures.push(m);
      }
      var allVolumes = (viewer.scene.volumes || []);
      var userVolumes = [];
      for (var vi = 0; vi < allVolumes.length; vi++) {
        if (isUserVolumeMeasurement(allVolumes[vi])) userVolumes.push(allVolumes[vi]);
      }
      var totalCount = distMeasures.length + areaMeasures.length + angleMeasures.length + userVolumes.length;
      if (totalCount === 0) { showToast('No measurements to export'); return; }

      var lines = [];
      lines.push('Measurements Export');
      lines.push('Units: ' + (UNIT_MODE === 'mm' ? 'metres (to the mm)' : UNIT_MODE === 'imp-dec' ? 'feet-inches (decimal, 0.05")' : 'feet-inches (fractional, 1/16")'));
      lines.push('Distances/Heights: ' + distMeasures.length + ' | Areas: ' + areaMeasures.length +
                 ' | Angles: ' + angleMeasures.length + ' | Volumes: ' + userVolumes.length);
      lines.push('');

      for (var mi = 0; mi < distMeasures.length; mi++) {
        var measure = distMeasures[mi];
        var nums = measurePointNumbers.get(measure) || [];
        var pts = measure.points;
        var isHeight = measure.showHeight && !measure.showDistances;
        var typeLabel = isHeight ? ' [Vertical]' : '';

        var firstName = nums.length > 0 ? 'D' + nums[0] : 'D?';
        var lastName = nums.length > 0 ? 'D' + nums[nums.length - 1] : 'D?';
        lines.push('=== Measurement ' + (mi + 1) + typeLabel + ': ' + firstName + ' -> ' + lastName + ' ===');
        lines.push('');

        lines.push('Point Coordinates:');
        for (var pi = 0; pi < pts.length; pi++) {
          var p = pts[pi].position ? pts[pi].position : pts[pi];
          var pn = pi < nums.length ? 'D' + nums[pi] : 'D?';
          lines.push('  ' + pn + ': X=' + fmtLenVal(p.x) + ', Y=' + fmtLenVal(p.y) + ', Z=' + fmtLenVal(p.z));
        }
        lines.push('');

        lines.push('Segment Distances:');
        var total3D = 0, totalXY = 0, totalZ = 0;
        for (var si = 0; si < pts.length - 1; si++) {
          var a = pts[si].position ? pts[si].position : pts[si];
          var b = pts[si + 1].position ? pts[si + 1].position : pts[si + 1];
          var dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
          var d3d = Math.sqrt(dx * dx + dy * dy + dz * dz);
          var dxy = Math.sqrt(dx * dx + dy * dy);
          var absZ = Math.abs(dz);
          var zSign = dz >= 0 ? '(+)' : '(-)';
          total3D += d3d; totalXY += dxy; totalZ += absZ;
          var sn1 = si < nums.length ? 'D' + nums[si] : 'D?';
          var sn2 = (si + 1) < nums.length ? 'D' + nums[si + 1] : 'D?';
          if (isHeight) {
            lines.push('  ' + sn1 + ' -> ' + sn2 + ':  Vertical: ' + fmtLen(absZ) + ' ' + zSign);
          } else {
            lines.push('  ' + sn1 + ' -> ' + sn2 + ':  3D: ' + fmtLen(d3d) + '  XY: ' + fmtLen(dxy) + '  Z: ' + fmtLen(absZ) + ' ' + zSign);
          }
        }
        lines.push('');
        if (isHeight) {
          lines.push('Totals:  Vertical: ' + fmtLen(totalZ));
        } else {
          lines.push('Totals:  3D: ' + fmtLen(total3D) + '  XY: ' + fmtLen(totalXY) + '  Z: ' + fmtLen(totalZ));
        }
        lines.push('');
      }

      // Areas
      for (var ai = 0; ai < areaMeasures.length; ai++) {
        var measure = areaMeasures[ai];
        var nums = measurePointNumbers.get(measure) || [];
        var pts = measure.points;
        var firstName = nums.length > 0 ? 'D' + nums[0] : 'D?';
        var lastName = nums.length > 0 ? 'D' + nums[nums.length - 1] : 'D?';
        lines.push('=== Area ' + (ai + 1) + ': ' + firstName + ' -> ' + lastName + ' (' + pts.length + ' pts) ===');
        lines.push('');
        lines.push('Point Coordinates:');
        for (var pi = 0; pi < pts.length; pi++) {
          var p = pts[pi].position ? pts[pi].position : pts[pi];
          var pn = pi < nums.length ? 'D' + nums[pi] : 'D?';
          lines.push('  ' + pn + ': X=' + fmtLenVal(p.x) + ', Y=' + fmtLenVal(p.y) + ', Z=' + fmtLenVal(p.z));
        }
        var area3D = compute3DPolygonArea(pts);
        var areaXY = (typeof measure.getArea === 'function') ? measure.getArea() : 0;
        var perim = 0;
        for (var pj = 0; pj < pts.length; pj++) {
          var ap = pts[pj].position ? pts[pj].position : pts[pj];
          var bp = pts[(pj + 1) % pts.length].position ? pts[(pj + 1) % pts.length].position : pts[(pj + 1) % pts.length];
          perim += Math.sqrt((bp.x - ap.x) * (bp.x - ap.x) + (bp.y - ap.y) * (bp.y - ap.y) + (bp.z - ap.z) * (bp.z - ap.z));
        }
        lines.push('');
        lines.push('Surface area (3D): ' + fmtArea(area3D));
        lines.push('Plan area (XY):    ' + fmtArea(areaXY));
        lines.push('Perimeter:         ' + fmtLen(perim));
        lines.push('');
      }

      // Angles
      for (var gi = 0; gi < angleMeasures.length; gi++) {
        var measure = angleMeasures[gi];
        var nums = measurePointNumbers.get(measure) || [];
        var pts = measure.points;
        var firstName = nums.length > 0 ? 'D' + nums[0] : 'D?';
        var lastName = nums.length > 0 ? 'D' + nums[nums.length - 1] : 'D?';
        lines.push('=== Angle ' + (gi + 1) + ': ' + firstName + ' -> ' + lastName + ' (' + pts.length + ' pts) ===');
        lines.push('');
        var lastIdx = pts.length - 1;
        var loop = !!measure.closed;
        for (var aii = 0; aii < pts.length; aii++) {
          if (!loop && (aii === 0 || aii === lastIdx)) continue;
          var rad = (typeof measure.getAngle === 'function') ? measure.getAngle(aii) : 0;
          if (!isFinite(rad)) rad = 0;
          var deg = rad * (180 / Math.PI);
          var nm = nums && aii < nums.length ? 'D' + nums[aii] : ('P' + (aii + 1));
          lines.push('  ' + nm + ': ' + deg.toFixed(2) + ' deg');
        }
        lines.push('');
      }

      // Volumes
      for (var vi2 = 0; vi2 < userVolumes.length; vi2++) {
        var vol = userVolumes[vi2];
        var name = vol.name || ('Volume ' + (vi2 + 1));
        var sx = Math.abs(vol.scale.x), sy = Math.abs(vol.scale.y), sz = Math.abs(vol.scale.z);
        var v3 = (typeof vol.getVolume === 'function') ? vol.getVolume() : (sx * sy * sz);
        lines.push('=== Volume ' + (vi2 + 1) + ': ' + name + ' ===');
        lines.push('  Volume: ' + fmtVol(v3));
        lines.push('  Size:   ' + fmtLen(sx) + ' x ' + fmtLen(sy) + ' x ' + fmtLen(sz));
        lines.push('  Center: X=' + fmtLenVal(vol.position.x) + ', Y=' + fmtLenVal(vol.position.y) + ', Z=' + fmtLenVal(vol.position.z));
        lines.push('');
      }

      var content = lines.join('\n');
      var blob = new Blob([content], { type: 'text/plain' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'measurements.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Exported ' + totalCount + ' measurement(s) to .txt');
    }

    // ===== SAVE / LOAD SESSION =====

    function v3toObj(v) { return { x: v.x, y: v.y, z: v.z }; }
    function serializeVolume(vol) {
      return {
        position: v3toObj(vol.position),
        rotation: { x: vol.rotation.x, y: vol.rotation.y, z: vol.rotation.z },
        scale: v3toObj(vol.scale),
        name: vol.name || '',
        disabled: !!vol._disabled
      };
    }
    function restoreVolume(sv) {
      var vol = new Potree.BoxVolume();
      vol.clip = false;
      vol.position.set(sv.position.x, sv.position.y, sv.position.z);
      if (sv.rotation) vol.rotation.set(sv.rotation.x, sv.rotation.y, sv.rotation.z);
      vol.scale.set(sv.scale.x, sv.scale.y, sv.scale.z);
      vol.name = sv.name || '';
      vol._disabled = !!sv.disabled;
      vol.visible = !vol._disabled;
      viewer.scene.addVolume(vol);
      return vol;
    }

    function serializeSession() {
      var data = {
        version: 1,
        pointCloudID: pointCloudID,
        constraints: constraints.map(function(c) {
          var out = {
            id: c.id, type: c.type, name: c.name,
            points: c.points.map(v3toObj),
            visible: c.visible, locked: !!c.locked
          };
          if (c.type === 'plane' && c.xAxisAnchorA && c.xAxisAnchorB) {
            out.xAxisAnchorA = v3toObj(c.xAxisAnchorA);
            out.xAxisAnchorB = v3toObj(c.xAxisAnchorB);
            if (c.xAxisCamUp) out.xAxisCamUp = v3toObj(c.xAxisCamUp);
          }
          return out;
        }),
        activeConstraintId: activeConstraintId,
        nextConstraintId: nextConstraintId,
        members: members.map(function(m) {
          return {
            id: m.id, name: m.name,
            points: m.points.map(v3toObj),
            visible: m.visible
          };
        }),
        nextMemberId: nextMemberId,
        measurements: (function() {
          var arr = [];
          var allMeas = viewer.scene.measurements || [];
          for (var i = 0; i < allMeas.length; i++) {
            var m = allMeas[i];
            if (!(m.showDistances || m.showHeight) || m.showArea || m.showAngles) continue;
            var pts = [];
            for (var j = 0; j < m.points.length; j++) {
              var p = m.points[j].position || m.points[j];
              pts.push(v3toObj(p));
            }
            var nums = measurePointNumbers.get(m) || [];
            arr.push({
              id: (m.userData && m.userData._mid != null) ? m.userData._mid : null,
              points: pts,
              pointNumbers: nums.slice(),
              showDistances: !!m.showDistances,
              showHeight: !!m.showHeight
            });
          }
          return arr;
        })(),
        nextPointNumber: nextPointNumber,
        nextMarkId: nextMarkId,
        initialClipBox: initialClipBox ? serializeVolume(initialClipBox) : null,
        marks: markedPoints.map(function(m) {
          return { id: m.id, name: m.name, locked: m.locked, visible: m.visible, position: v3toObj(m.visual.position) };
        }),
        notes: notes.map(function(n) {
          return { id: n.id, name: n.name, text: n.text || '', visible: !!n.visible, position: v3toObj(n.position) };
        }),
        nextNoteId: nextNoteId,
        savedViews: savedViews.map(function(v) { return { id: v.id, name: v.name, cam: v.cam, vis: v.vis, clip: v.clip }; }),
        nextViewId: nextViewId,
        // Elevation map state
        elevationMap: (function() {
          if (elevationCropVolumes.length === 0 && !elevationActive) return null;
          return {
            active: elevationActive,
            zMin: elevationZMin,
            zMax: elevationZMax,
            contoursVisible: elevationContoursVisible,
            elevationBoxes: elevationCropVolumes.map(function(vol) {
              var sv = serializeVolume(vol);
              var cfg = getBoxConfig(vol);
              sv.config = {
                mode: cfg.mode,
                refConstraintIdx: cfg.refConstraintIdx,
                refSide: cfg.refSide,
                sideSet: cfg.sideSet,
                zBaseMarkId: cfg.zBaseMarkId,
                thicknessExpectedMin: cfg.thicknessExpectedMin,
                thicknessExpectedMax: cfg.thicknessExpectedMax,
                thicknessGapTol: cfg.thicknessGapTol,
                zMin: cfg.zMin,
                zMax: cfg.zMax,
                contourStep: cfg.contourStep,
                active: cfg.active
              };
              return sv;
            }),
            exclusionBoxes: exclusionBoxes.map(serializeVolume),
            cutoutBoxes: cutoutBoxes.map(serializeVolume)
          };
        })()
      };
      return data;
    }

    // ===== CLOUD SESSIONS (Firebase / Firestore) =====
    // Private per-user cloud storage layered on top of the existing local-file
    // save/load. Reuses serializeSession() / loadSession() verbatim.
    function _cloudReady() {
      return !!(window.EnableCloud && window.EnableAuth && EnableAuth.currentUser());
    }
    function saveCloudSession() {
      if (!_cloudReady()) { showToast('Sign in to save to the cloud'); return; }
      var name = prompt('Name this cloud session:', 'Session ' + new Date().toLocaleDateString());
      if (!name) return;
      EnableCloud.saveSession(pointCloudID, name, serializeSession()).then(function() {
        showToast('Saved to cloud');
        refreshCloudSessions();
      }).catch(function(err) {
        console.error('[cloud] save failed', err);
        showToast('Cloud save failed');
      });
    }
    function refreshCloudSessions() {
      var listEl = document.getElementById('enable-cloud-list');
      if (!listEl) return;
      if (!_cloudReady()) { listEl.innerHTML = ''; return; }
      listEl.innerHTML = '<div class="enable-cloud-empty">Loading…</div>';
      EnableCloud.listSessions(pointCloudID).then(function(items) {
        if (!items.length) { listEl.innerHTML = '<div class="enable-cloud-empty">No cloud sessions yet.</div>'; return; }
        listEl.innerHTML = '';
        items.forEach(function(it) {
          var row = document.createElement('div');
          row.className = 'enable-cloud-row';
          var label = document.createElement('span');
          label.className = 'enable-cloud-name';
          label.textContent = it.name;
          label.title = it.updatedAt ? new Date(it.updatedAt).toLocaleString() : it.name;
          var load = document.createElement('button');
          load.textContent = 'Load'; load.title = 'Load this cloud session';
          load.onclick = function() {
            if (it.data) { loadSession(it.data); showToast('Loaded "' + it.name + '"'); }
            else showToast('Session data is missing');
          };
          var del = document.createElement('button');
          del.textContent = '✕'; del.title = 'Delete this cloud session';
          del.className = 'enable-cloud-del';
          del.onclick = function() {
            if (!confirm('Delete cloud session "' + it.name + '"?')) return;
            EnableCloud.deleteSession(pointCloudID, it.id).then(function() {
              showToast('Deleted'); refreshCloudSessions();
            }).catch(function(err) { console.error('[cloud] delete failed', err); showToast('Delete failed'); });
          };
          row.appendChild(label); row.appendChild(load); row.appendChild(del);
          listEl.appendChild(row);
        });
      }).catch(function(err) {
        console.error('[cloud] list failed', err);
        listEl.innerHTML = '<div class="enable-cloud-empty">Could not load cloud sessions.</div>';
      });
    }
    function updateUserBar(user) {
      var em = document.getElementById('enable-user-email');
      if (em) em.textContent = (user && user.email) ? user.email : '';
      var so = document.getElementById('enable-signout');
      if (so) so.onclick = function() { EnableAuth.signOut().then(function() { location.reload(); }); };
    }

    function saveSessionToFile() {
      var data = serializeSession();
      var json = JSON.stringify(data, null, 2);
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      var date = new Date().toISOString().slice(0, 10);
      a.download = 'session_' + pointCloudID + '_' + date + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Session saved');
    }

    function loadSession(data) {
      // Validate
      if (!data || data.version !== 1) {
        showToast('Invalid session file');
        return;
      }
      if (data.pointCloudID && data.pointCloudID !== pointCloudID) {
        showToast('Warning: session is for "' + data.pointCloudID + '", current is "' + pointCloudID + '"', 4000);
      }

      // Clear existing state
      clearAllMarkers();
      clearAllNotes();
      while (constraints.length > 0) {
        deleteConstraint(constraints[constraints.length - 1].id);
      }
      while (members.length > 0) {
        deleteMember(members[members.length - 1].id);
      }
      var existingMeas = (viewer.scene.measurements || []).slice();
      for (var i = 0; i < existingMeas.length; i++) {
        viewer.scene.removeMeasurement(existingMeas[i]);
      }
      // Clear elevation state
      if (elevationActive) onClearElevation();
      clearAllElevationBoxes();
      clearAllCutoutBoxes();
      for (var exi = 0; exi < exclusionBoxes.length; exi++) viewer.scene.removeVolume(exclusionBoxes[exi]);
      exclusionBoxes = [];
      rebuildExclusionList();
      undoStack.length = 0;
      redoStack.length = 0;

      // Restore constraints
      if (data.constraints) {
        for (var ci = 0; ci < data.constraints.length; ci++) {
          var sc = data.constraints[ci];
          var pts = sc.points.map(function(p) { return new THREE.Vector3(p.x, p.y, p.z); });
          var c = {
            id: sc.id, type: sc.type, name: sc.name,
            points: pts, visual: null,
            visible: sc.visible !== false,
            locked: !!sc.locked
          };
          if (sc.xAxisAnchorA && sc.xAxisAnchorB) {
            c.xAxisAnchorA = new THREE.Vector3(sc.xAxisAnchorA.x, sc.xAxisAnchorA.y, sc.xAxisAnchorA.z);
            c.xAxisAnchorB = new THREE.Vector3(sc.xAxisAnchorB.x, sc.xAxisAnchorB.y, sc.xAxisAnchorB.z);
            if (sc.xAxisCamUp) {
              c.xAxisCamUp = new THREE.Vector3(sc.xAxisCamUp.x, sc.xAxisCamUp.y, sc.xAxisCamUp.z);
            } else {
              // Old session without camUp — synthesize from world Z so basis is consistent.
              c.xAxisCamUp = new THREE.Vector3(0, 0, 1);
            }
          }
          recomputeConstraint(c);
          buildConstraintVisual(c);
          constraints.push(c);
        }
      }
      activeConstraintId = data.activeConstraintId || null;
      nextConstraintId = data.nextConstraintId || (constraints.length + 1);
      rebuildConstraintList();
      updateConstraintVisuals();

      // Restore members
      if (data.members) {
        for (var mi = 0; mi < data.members.length; mi++) {
          var sm = data.members[mi];
          var m = {
            id: sm.id, name: sm.name,
            points: sm.points.map(function(p) { return new THREE.Vector3(p.x, p.y, p.z); }),
            visual: null,
            visible: sm.visible !== false
          };
          buildMemberVisual(m);
          members.push(m);
        }
      }
      nextMemberId = data.nextMemberId || (members.length + 1);
      rebuildMemberList();

      // Restore measurements
      nextPointNumber = data.nextPointNumber || 1;
      if (data.measurements) {
        for (var mi2 = 0; mi2 < data.measurements.length; mi2++) {
          var sm2 = data.measurements[mi2];
          if (!sm2.points || sm2.points.length < 2) continue;
          var measure = new Potree.Measure();
          // Default to a distance measurement; honor saved type if present
          var savedShowH = !!sm2.showHeight;
          var savedShowD = sm2.showDistances !== false && !savedShowH;
          measure.showDistances = savedShowD;
          measure.showHeight = savedShowH;
          measure.showArea = false;
          measure.showAngles = false;
          measure.closed = false;
          for (var pi = 0; pi < sm2.points.length; pi++) {
            var pp = sm2.points[pi];
            measure.addMarker(new THREE.Vector3(pp.x, pp.y, pp.z));
          }
          viewer.scene.addMeasurement(measure);
          // Preserve the saved stable id so saved-view visibility snapshots still match
          if (sm2.id != null) { measure.userData._mid = sm2.id; if (sm2.id >= _nextMeasureMid) _nextMeasureMid = sm2.id + 1; }
          // Override auto-assigned P-numbers with saved ones
          if (sm2.pointNumbers && sm2.pointNumbers.length > 0) {
            measurePointNumbers.set(measure, sm2.pointNumbers.slice());
            syncMeasurePointLabels(measure);
          }
        }
      }
      rebuildAllMeasurementLists();

      // Restore saved views (camera + visibility snapshots). Safe to restore
      // before marks/members are recreated — views are only applied on recall.
      savedViews = [];
      _activeViewId = null;
      if (data.savedViews && data.savedViews.length) {
        savedViews = data.savedViews.map(function(v) { return { id: v.id, name: v.name, cam: v.cam, vis: v.vis, clip: v.clip }; });
        nextViewId = data.nextViewId || (savedViews.reduce(function(mx, v) { return Math.max(mx, v.id); }, 0) + 1);
      } else {
        nextViewId = data.nextViewId || 1;
      }
      rebuildViewsList();

      // Restore marks
      if (data.marks) {
        for (var mk = 0; mk < data.marks.length; mk++) {
          var sm = data.marks[mk];
          // Support both old format (just {x,y,z}) and new format ({id, name, position, ...})
          var pos = sm.position ? sm.position : sm;
          placeMarker(new THREE.Vector3(pos.x, pos.y, pos.z));
          // Override auto-assigned properties with saved ones
          var placed = markedPoints[markedPoints.length - 1];
          if (sm.id) placed.id = sm.id;
          if (sm.name) {
            placed.name = sm.name;
            // Update the label sprite text
            updateMarkLabel(placed);
          }
          if (sm.locked !== undefined) placed.locked = sm.locked;
          if (sm.visible !== undefined) { placed.visible = sm.visible; placed.visual.visible = sm.visible; }
        }
      }
      if (data.nextMarkId) nextMarkId = data.nextMarkId;
      rebuildMarkList();

      // Restore notes
      clearAllNotes();
      if (data.notes) {
        for (var nk = 0; nk < data.notes.length; nk++) {
          var sn = data.notes[nk];
          var npos = new THREE.Vector3(sn.position.x, sn.position.y, sn.position.z);
          var placedNote = placeNote(npos, sn.text || '', sn.name || null, sn.id);
          if (placedNote && sn.visible === false) setNoteVisible(placedNote.id, false);
        }
        // The placeNote call auto-opens the popover for each one; close the last
        // one so loading doesn't leave a popover hanging.
        _closeNotePopover();
      }
      if (data.nextNoteId) nextNoteId = Math.max(nextNoteId, data.nextNoteId);
      rebuildNoteList();

      // Restore initial clip box transform
      if (data.initialClipBox && initialClipBox) {
        var cb = data.initialClipBox;
        initialClipBox.position.set(cb.position.x, cb.position.y, cb.position.z);
        if (cb.rotation) initialClipBox.rotation.set(cb.rotation.x, cb.rotation.y, cb.rotation.z);
        initialClipBox.scale.set(cb.scale.x, cb.scale.y, cb.scale.z);
      }

      // Restore elevation map state
      if (data.elevationMap) {
        var em = data.elevationMap;

        // Clear any existing elevation state first
        if (elevationActive) onClearElevation();
        clearAllElevationBoxes();
        for (var ei = 0; ei < exclusionBoxes.length; ei++) viewer.scene.removeVolume(exclusionBoxes[ei]);
        exclusionBoxes = [];
        clearAllCutoutBoxes();

        // Restore cut-out boxes
        if (em.cutoutBoxes) {
          for (var ci2 = 0; ci2 < em.cutoutBoxes.length; ci2++) {
            var vol = restoreVolume(em.cutoutBoxes[ci2]);
            styleCutoutBox(vol);
            setTimeout((function(v) { return function() { styleCutoutBox(v); }; })(vol), 500);
            cutoutBoxes.push(vol);
            trackVolumeUndo(vol);
            trackCutoutForElevation(vol);
          }
          _cutoutCounter = cutoutBoxes.length;
          syncExclusionBoxes();
          rebuildCutoutList();
        }

        // Restore elevation boxes with per-box config
        var hasActiveBox = false;
        if (em.elevationBoxes) {
          for (var ei2 = 0; ei2 < em.elevationBoxes.length; ei2++) {
            var sv = em.elevationBoxes[ei2];
            var vol = restoreVolume(sv);
            styleElevationBox(vol);
            setTimeout((function(v) { return function() { styleElevationBox(v); }; })(vol), 500);
            elevationCropVolumes.push(vol);
            trackVolumeUndo(vol);
            // Restore per-box config
            if (sv.config) {
              var cfg = getBoxConfig(vol);
              cfg.mode = sv.config.mode || 'z';
              cfg.refConstraintIdx = sv.config.refConstraintIdx;
              cfg.refSide = sv.config.refSide || 1;
              cfg.sideSet = !!sv.config.sideSet;
              cfg.zBaseMarkId = (sv.config.zBaseMarkId != null) ? sv.config.zBaseMarkId : null;
              if (sv.config.thicknessExpectedMin != null) cfg.thicknessExpectedMin = sv.config.thicknessExpectedMin;
              if (sv.config.thicknessExpectedMax != null) cfg.thicknessExpectedMax = sv.config.thicknessExpectedMax;
              if (sv.config.thicknessGapTol != null) cfg.thicknessGapTol = sv.config.thicknessGapTol;
              cfg.zMin = sv.config.zMin;
              cfg.zMax = sv.config.zMax;
              cfg.contourStep = sv.config.contourStep || 0.05;
              cfg.active = !!sv.config.active;
              // Restore reference plane from constraint index
              if (cfg.mode === 'plane' && cfg.refConstraintIdx >= 0 && cfg.refConstraintIdx < constraints.length) {
                var refC = constraints[cfg.refConstraintIdx];
                cfg.refPlane = { normal: refC.normal.clone(), centroid: refC.centroid.clone() };
              }
              if (cfg.active) hasActiveBox = true;
            }
          }
          _elevBoxCounter = elevationCropVolumes.length;
          syncHighlightBoxes();
          rebuildElevationBoxList();
        }

        // Restore exclusion boxes
        if (em.exclusionBoxes) {
          for (var xi = 0; xi < em.exclusionBoxes.length; xi++) {
            var vol = restoreVolume(em.exclusionBoxes[xi]);
            if (vol.box) { vol.box.material.color.setHex(0x000000); vol.box.material.opacity = 0.03; vol.box.material.transparent = true; vol.box.material.needsUpdate = true; }
            if (vol.frame) { vol.frame.material.color.setHex(0x000000); vol.frame.material.needsUpdate = true; }
            if (vol.label) vol.label.visible = false;
            exclusionBoxes.push(vol);
            trackVolumeUndo(vol);
          }
          rebuildExclusionList();
        }

        // Trigger recompute for each active box
        if (hasActiveBox && elevationCropVolumes.length > 0) {
          setTimeout(function() {
            // Find first active box and compute
            for (var bi2 = 0; bi2 < elevationCropVolumes.length; bi2++) {
              var boxCfg = getBoxConfig(elevationCropVolumes[bi2]);
              if (boxCfg.active) {
                _selectedElevBox = elevationCropVolumes[bi2];
                syncElevGlobals();
                onComputeElevation();
                break;
              }
            }
          }, 300);
        }
      }

      // Clear undo stack from restore operations
      undoStack.length = 0;
      redoStack.length = 0;

      showToast('Session loaded');
    }

    function loadSessionFromFile() {
      var input = document.getElementById('session-file-input');
      if (!input) return;
      input.click();
    }

    // -- Inject sidebar buttons once GUI is ready --
    // ===== ELEVATION MAP — UTILITY FUNCTIONS =====

    // Force-load octree nodes. If filterAABB is provided, ONLY load nodes
    // whose bounding box intersects that AABB — critical for large clouds
    // (otherwise we load 26M+ points to compute a heat map on a small region).

    function updateElevationLegend(zMin, zMax) {
      var canvas = document.getElementById('heatmap-legend-canvas');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      var w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      var barX = 100, barW = 40, barTop = 60, barBot = h - 20;
      var barH = barBot - barTop;

      // Draw gradient bar: top = high (red), bottom = low (blue)

        var t = 1 - (y / barH); // top=1, bottom=0

        ctx.fillStyle = 'rgb(' + color[0] + ',' + color[1] + ',' + color[2] + ')';
        ctx.fillRect(barX, barTop + y, barW, 1);

      ctx.strokeStyle = '#aaa';
      ctx.lineWidth = 1;
      ctx.strokeRect(barX, barTop, barW, barH);

      // Use the contour step for legend ticks so they match contour lines

      var step = elevationContourStep;
      // If step would give too many ticks on the legend, use multiples
      var nTicks = Math.floor(range / step);
      var legendStep = step;
      if (nTicks > 12) {
        var mult = Math.ceil(nTicks / 8);
        legendStep = step * mult;
      }

      // Determine decimal places from step
      var decimals = 0;
      if (legendStep < 0.01) decimals = 3;
      else if (legendStep < 0.1) decimals = 2;
      else if (legendStep < 1) decimals = 1;

      var tickLen = 6;
      var labelRight = barX - 8;

      // Draw ticks with labels on the LEFT side of the bar, right-justified
      ctx.font = '16px sans-serif';
      ctx.textBaseline = 'middle';

      var firstTick = Math.ceil(zMin / legendStep) * legendStep;
      for (var v = firstTick; v <= zMax + legendStep * 0.01; v += legendStep) {
        if (v < zMin || v > zMax) continue;
        var t = (v - zMin) / range;
        var yPos = barTop + barH * (1 - t);

        // Tick line
        ctx.strokeStyle = '#ccc';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(barX - tickLen, yPos);
        ctx.lineTo(barX, yPos);
        ctx.stroke();

        // Label
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'right';
        ctx.fillText(fmtLenVal(v), labelRight, yPos);
      }

      // Title

      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      var centerX = (labelRight + barX + barW) / 2;
      if (elevationMode === 'plane') {

        ctx.font = 'bold 18px sans-serif';
        ctx.fillText(unitTitle(), centerX, 40);

        ctx.font = 'bold 18px sans-serif';
        ctx.fillText(unitTitle(), centerX, 40);
      }

      document.getElementById('heatmap-legend').style.display = 'block';
    }
