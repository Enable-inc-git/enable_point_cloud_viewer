    // Build a surface grid in the reference plane's UV space
    // Projects from the chosen side to find the "top" surface
    function buildPlaneSurfaceGrid(positions, cropBounds, gridRes, refPlane, side, precomputedBounds) {
      gridRes = gridRes || 200;
      var N = refPlane.normal;
      var C = refPlane.centroid;

      // Build U, V axes on the plane
      var worldUp = Math.abs(N.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
      var U = new THREE.Vector3().crossVectors(worldUp, N).normalize();
      var V = new THREE.Vector3().crossVectors(N, U).normalize();

      // Project all points into plane UV space, find UV bounds. Caller can
      // pre-compute these in onComputeElevation Pass A and pass them in to
      // skip this whole pass.
      var count = positions.length / 3;
      var uMin, uMax, vMin, vMax;
      if (precomputedBounds) {
        uMin = precomputedBounds.uMin; uMax = precomputedBounds.uMax;
        vMin = precomputedBounds.vMin; vMax = precomputedBounds.vMax;
      } else {
        uMin = Infinity; uMax = -Infinity; vMin = Infinity; vMax = -Infinity;
        for (var i = 0; i < count; i++) {
          var px = positions[i * 3], py = positions[i * 3 + 1], pz = positions[i * 3 + 2];
          if (cropBounds) {
            if (px < cropBounds.min[0] || px > cropBounds.max[0] ||
                py < cropBounds.min[1] || py > cropBounds.max[1] ||
                pz < cropBounds.min[2] || pz > cropBounds.max[2]) continue;
          }
          var dx = px - C.x, dy = py - C.y, dz = pz - C.z;
          var u = dx * U.x + dy * U.y + dz * U.z;
          var v = dx * V.x + dy * V.y + dz * V.z;
          if (u < uMin) uMin = u; if (u > uMax) uMax = u;
          if (v < vMin) vMin = v; if (v > vMax) vMax = v;
        }
      }

      var uRange = uMax - uMin, vRange = vMax - vMin;
      if (uRange < 1e-6 || vRange < 1e-6) return null;
      var cellU = uRange / gridRes, cellV = vRange / gridRes;

      // For each UV cell, find the extremal signed distance (max if side=+1, min if side=-1)
      // This is the "top surface" as seen from the chosen side
      var gridSurf = new Float32Array(gridRes * gridRes);
      for (var i = 0; i < gridSurf.length; i++) gridSurf[i] = side > 0 ? -Infinity : Infinity;

      for (var i = 0; i < count; i++) {
        var px = positions[i * 3], py = positions[i * 3 + 1], pz = positions[i * 3 + 2];
        if (cropBounds) {
          if (px < cropBounds.min[0] || px > cropBounds.max[0] ||
              py < cropBounds.min[1] || py > cropBounds.max[1] ||
              pz < cropBounds.min[2] || pz > cropBounds.max[2]) continue;
        }
        var dx = px - C.x, dy = py - C.y, dz = pz - C.z;
        var u = dx * U.x + dy * U.y + dz * U.z;
        var v = dx * V.x + dy * V.y + dz * V.z;
        var nDist = dx * N.x + dy * N.y + dz * N.z; // signed distance from plane

        var iu = Math.floor((u - uMin) / cellU);
        var iv = Math.floor((v - vMin) / cellV);
        if (iu >= gridRes) iu = gridRes - 1;
        if (iv >= gridRes) iv = gridRes - 1;
        if (iu < 0) iu = 0; if (iv < 0) iv = 0;
        var idx = iv * gridRes + iu;
        if (side > 0) {
          if (nDist > gridSurf[idx]) gridSurf[idx] = nDist;
        } else {
          if (nDist < gridSurf[idx]) gridSurf[idx] = nDist;
        }
      }

      return {
        gridSurf: gridSurf, gridRes: gridRes,
        uMin: uMin, vMin: vMin, cellU: cellU, cellV: cellV,
        U: U, V: V, N: N, C: C, side: side
      };
    }

    // Check if a point is on the "top surface" from the chosen side of the plane
    function isPlaneTopSurface(px, py, pz, planeSurfGrid, tolerance) {
      if (!planeSurfGrid) return true;
      var dx = px - planeSurfGrid.C.x, dy = py - planeSurfGrid.C.y, dz = pz - planeSurfGrid.C.z;
      var u = dx * planeSurfGrid.U.x + dy * planeSurfGrid.U.y + dz * planeSurfGrid.U.z;
      var v = dx * planeSurfGrid.V.x + dy * planeSurfGrid.V.y + dz * planeSurfGrid.V.z;
      var nDist = dx * planeSurfGrid.N.x + dy * planeSurfGrid.N.y + dz * planeSurfGrid.N.z;

      var iu = Math.floor((u - planeSurfGrid.uMin) / planeSurfGrid.cellU);
      var iv = Math.floor((v - planeSurfGrid.vMin) / planeSurfGrid.cellV);
      if (iu < 0 || iv < 0 || iu >= planeSurfGrid.gridRes || iv >= planeSurfGrid.gridRes) return false;
      var surfDist = planeSurfGrid.gridSurf[iv * planeSurfGrid.gridRes + iu];
      if (surfDist === -Infinity || surfDist === Infinity) return false;

      if (planeSurfGrid.side > 0) {
        return nDist >= surfDist - tolerance;
      } else {
        return nDist <= surfDist + tolerance;
      }
    }

    // ===== THICKNESS GRID (slab thickness heatmap) =====
    // Build a 2D grid of slab thickness over a box. Memory-conscious: typed
    // arrays throughout, all temp buffers freed before return; persistent
    // output is ~520 KB at gridRes=200 (5 Float32/Uint8 grids).
    //
    // Algorithm passes (per docs):
    //   A: Top-surface band detection per cell (densest contiguous bins
    //      starting from highest depth bin)
    //   B: Downward region-grow to find slab bottom, stopping at first gap
    //      larger than gapTolerance — ignores air-gapped fixtures
    //   C: Sanity filter — reject cells outside [expectedMin, expectedMax]
    //   D: 3×3 median filter — kill isolated outliers
    //   E: Connected-component footprint — reject "fat" components below
    //      minComponentArea (handles flush-mounted small fixtures)
    function buildThicknessGrid(positions, count, boxInv, refPlane, refSide, opts) {
      opts = opts || {};
      var gridRes        = opts.gridRes        || 100;
      var binSize        = opts.binSize        || 0.005;
      var gapTol         = opts.gapTolerance   || 0.025;
      var expectedMin    = opts.expectedMin    || 0.05;
      var expectedMax    = opts.expectedMax    || 1.0;
      var minCellPoints  = opts.minCellPoints  || 3;
      var minComponentM2 = opts.minComponentArea || 0.1;

      // Build U, V, N basis. With a refPlane the slab is measured along that
      // plane's normal; without one we fall back to world Z (good for level
      // slabs in surveyed clouds).
      var U, V, N, C;
      if (refPlane) {
        N = refPlane.normal.clone();
        if (refSide && refSide < 0) N.negate();
        var worldUp = Math.abs(N.y) < 0.9 ? new THREE.Vector3(0, 1, 0)
                                          : new THREE.Vector3(1, 0, 0);
        U = new THREE.Vector3().crossVectors(worldUp, N).normalize();
        V = new THREE.Vector3().crossVectors(N, U).normalize();
        C = refPlane.centroid.clone();
      } else {
        U = new THREE.Vector3(1, 0, 0);
        V = new THREE.Vector3(0, 1, 0);
        N = new THREE.Vector3(0, 0, 1);
        C = new THREE.Vector3(0, 0, 0);
      }

      var v3 = new THREE.Vector3();

      // Pass 1 — scan in-box points; find UV / depth ranges. Caller can
      // pre-compute these in onComputeElevation Pass A and pass them via
      // opts.precomputedBounds to skip this entire pass.
      var uMin, uMax, vMin, vMax, dMin, dMax, inBoxTotal;
      if (opts.precomputedBounds) {
        uMin = opts.precomputedBounds.uMin; uMax = opts.precomputedBounds.uMax;
        vMin = opts.precomputedBounds.vMin; vMax = opts.precomputedBounds.vMax;
        dMin = opts.precomputedBounds.dMin; dMax = opts.precomputedBounds.dMax;
        inBoxTotal = opts.precomputedBounds.inBoxTotal != null ? opts.precomputedBounds.inBoxTotal : 1;
      } else {
        uMin = Infinity; uMax = -Infinity;
        vMin = Infinity; vMax = -Infinity;
        dMin = Infinity; dMax = -Infinity;
        inBoxTotal = 0;
        for (var i = 0; i < count; i++) {
          var px = positions[i * 3], py = positions[i * 3 + 1], pz = positions[i * 3 + 2];
          v3.set(px, py, pz).applyMatrix4(boxInv);
          if (v3.x < -0.5 || v3.x > 0.5 || v3.y < -0.5 || v3.y > 0.5 || v3.z < -0.5 || v3.z > 0.5) continue;
          var dx = px - C.x, dy = py - C.y, dz = pz - C.z;
          var u = dx * U.x + dy * U.y + dz * U.z;
          var vv = dx * V.x + dy * V.y + dz * V.z;
          var d = dx * N.x + dy * N.y + dz * N.z;
          if (u < uMin) uMin = u; if (u > uMax) uMax = u;
          if (vv < vMin) vMin = vv; if (vv > vMax) vMax = vv;
          if (d < dMin) dMin = d; if (d > dMax) dMax = d;
          inBoxTotal++;
        }
      }
      if (inBoxTotal === 0 || uMax - uMin < 1e-6 || vMax - vMin < 1e-6) return null;

      var uRange = uMax - uMin, vRange = vMax - vMin;
      var cellU = uRange / gridRes, cellV = vRange / gridRes;

      // Pass 2 — count per cell
      var cellCount = new Uint32Array(gridRes * gridRes);
      for (var i = 0; i < count; i++) {
        var px = positions[i * 3], py = positions[i * 3 + 1], pz = positions[i * 3 + 2];
        v3.set(px, py, pz).applyMatrix4(boxInv);
        if (v3.x < -0.5 || v3.x > 0.5 || v3.y < -0.5 || v3.y > 0.5 || v3.z < -0.5 || v3.z > 0.5) continue;
        var dx = px - C.x, dy = py - C.y, dz = pz - C.z;
        var u = dx * U.x + dy * U.y + dz * U.z;
        var vv = dx * V.x + dy * V.y + dz * V.z;
        var iu = Math.floor((u - uMin) / cellU);
        var iv = Math.floor((vv - vMin) / cellV);
        if (iu >= gridRes) iu = gridRes - 1; if (iu < 0) iu = 0;
        if (iv >= gridRes) iv = gridRes - 1; if (iv < 0) iv = 0;

      // Pass 3 — fill per-cell depth slices into one packed Float32Array
      var depths = new Float32Array(s);
      var cursor = new Uint32Array(nCells);
      for (var i = 0; i < count; i++) {
        var px = positions[i * 3], py = positions[i * 3 + 1], pz = positions[i * 3 + 2];
        v3.set(px, py, pz).applyMatrix4(boxInv);
        if (v3.x < -0.5 || v3.x > 0.5 || v3.y < -0.5 || v3.y > 0.5 || v3.z < -0.5 || v3.z > 0.5) continue;
        var dx = px - C.x, dy = py - C.y, dz = pz - C.z;
        var u = dx * U.x + dy * U.y + dz * U.z;
        var vv = dx * V.x + dy * V.y + dz * V.z;
        var d = dx * N.x + dy * N.y + dz * N.z;
        var iu = Math.floor((u - uMin) / cellU);
        var iv = Math.floor((vv - vMin) / cellV);
        if (iu >= gridRes) iu = gridRes - 1; if (iu < 0) iu = 0;
        if (iv >= gridRes) iv = gridRes - 1; if (iv < 0) iv = 0;
        var idx = iv * gridRes + iu;
        depths[cellOffset[idx] + cursor[idx]] = d;
        cursor[idx]++;
      }
      // Phase 1 — simple per-cell top/bottom from min/max with constraint.
      // The top surface is "the topmost point in the cell". The bottom is
      // "the deepest point in [topD - expectedMax, topD - expectedMin]".
      // This mirrors how Z mode's surfaceGrid works.
      var topAll      = new Float32Array(nCells);
      var hasTop      = new Uint8Array(nCells);
      var bottomAll   = new Float32Array(nCells);
      var hasBottom   = new Uint8Array(nCells);

      // Also compute a GLOBAL bottom — the deepest depth across the whole
      // box that's at least expectedMin below dMax and within expectedMax.
      // We use this as a fallback for hasTop cells that have no local
      // bottom-scan data, so a single underside-scan-coverage gap doesn't
      // wipe out the entire heat map.
      var globalBottomD = Infinity;
      var globalLowerB = dMax - expectedMax;
      var globalUpperB = dMax - expectedMin;

      for (var ci = 0; ci < nCells; ci++) {
        var cnt = cellCount[ci];
        if (cnt < minCellPoints) continue;

        var off = cellOffset[ci];
        // Pass A: topD = max depth in cell
        var localMax = -Infinity;
        for (var k = 0; k < cnt; k++) {
          var d = depths[off + k];
          if (d > localMax) localMax = d;
        }
        topAll[ci] = localMax;
        hasTop[ci] = 1;

        // Pass B: bottomD = min depth in [topD - expectedMax, topD - expectedMin]
        var bottomThresh = localMax - expectedMin;
        var farthestThresh = localMax - expectedMax;
        var localMinBot = Infinity;
        for (var k = 0; k < cnt; k++) {
          var d = depths[off + k];
          if (d > bottomThresh) continue;
          if (d < farthestThresh) continue;
          if (d < localMinBot) localMinBot = d;
          // Track the global slab-bottom too.
          if (d >= globalLowerB && d <= globalUpperB && d < globalBottomD) {

          }
        }
        if (localMinBot === Infinity) continue;
        bottomAll[ci] = localMinBot;
        hasBottom[ci] = 1;
      }

      // Fallback seeding: any hasTop cell still without a local bottom gets
      // the global bottom value. Ensures cells in regions with no underside
      // scan still get a thickness reading (assuming any underside was
      // scanned anywhere in the box). Per-cell measurements take priority.
      if (globalBottomD < Infinity) {
        for (var ci = 0; ci < nCells; ci++) {
          if (hasTop[ci] && !hasBottom[ci]) {
            bottomAll[ci] = globalBottomD;
            hasBottom[ci] = 1;
          }
        }
      }

      depths = null;
      cellOffset = null;
      cellCount = null;

      // Phase 2 — bottom-surface infill via iterative neighbor averaging.
      // The slab underside is mostly continuous, so cells with a top scan
      // but no detected bottom can borrow a bottom estimate from valid
      // neighbors. Drop panels and slab steps survive because their cells
      // have their own measured bottom that overrides the infill.
      var bottomFilled = new Float32Array(bottomAll);
      var hasBottomF = new Uint8Array(hasBottom);
      var pending = new Float32Array(nCells);
      var pendingMask = new Uint8Array(nCells);
      var maxIters = Math.max(gridRes, 50); // enough to cross the box
      for (var iter = 0; iter < maxIters; iter++) {
        var changed = false;
        for (var iy = 0; iy < gridRes; iy++) {
          for (var ix = 0; ix < gridRes; ix++) {
            var ci = iy * gridRes + ix;
            if (hasBottomF[ci]) continue;
            if (!hasTop[ci]) continue; // only fill cells that have a top
            var sum = 0, n = 0;
            if (ix > 0)            { var nci = ci - 1;       if (hasBottomF[nci]) { sum += bottomFilled[nci]; n++; } }
            if (ix < gridRes - 1)  { var nci = ci + 1;       if (hasBottomF[nci]) { sum += bottomFilled[nci]; n++; } }
            if (iy > 0)            { var nci = ci - gridRes; if (hasBottomF[nci]) { sum += bottomFilled[nci]; n++; } }
            if (iy < gridRes - 1)  { var nci = ci + gridRes; if (hasBottomF[nci]) { sum += bottomFilled[nci]; n++; } }
            if (n > 0) {
              pending[ci] = sum / n;
              pendingMask[ci] = 1;
              changed = true;
            }

        for (var i = 0; i < nCells; i++) {

            hasBottomF[i] = 1;
            pendingMask[i] = 0;

      pending = null; pendingMask = null;

      // Phase 3 — Pass C sanity filter on (top, infilled-bottom) pairs.
      // Free originals once we've used them for infill seeding.
      var thickness = new Float32Array(nCells);
      var topD      = new Float32Array(nCells);
      var bottomD   = new Float32Array(nCells);
      var valid     = new Uint8Array(nCells);
      for (var ci = 0; ci < nCells; ci++) {
        if (!hasTop[ci] || !hasBottomF[ci]) continue;
        var t = topAll[ci] - bottomFilled[ci];
        if (t < expectedMin || t > expectedMax) continue;
        thickness[ci] = t;
        topD[ci] = topAll[ci];
        bottomD[ci] = bottomFilled[ci];
        valid[ci] = 1;
      }
      topAll = null; hasTop = null;
      bottomAll = null; hasBottom = null;
      bottomFilled = null; hasBottomF = null;

      // Pass D — 3×3 median filter; reject cells differing > 30% from median
      var thicknessF = new Float32Array(nCells);
      var validF     = new Uint8Array(nCells);
      var topF       = new Float32Array(nCells);
      var botF       = new Float32Array(nCells);
      var nbrBuf     = new Float32Array(9);
      for (var iy = 0; iy < gridRes; iy++) {
        for (var ix = 0; ix < gridRes; ix++) {
          var ci = iy * gridRes + ix;
          if (!valid[ci]) continue;
          var nN = 0;
          for (var dy = -1; dy <= 1; dy++) {
            var ny = iy + dy; if (ny < 0 || ny >= gridRes) continue;
            for (var dx = -1; dx <= 1; dx++) {
              var nx = ix + dx; if (nx < 0 || nx >= gridRes) continue;
              var nci = ny * gridRes + nx;
              if (valid[nci]) nbrBuf[nN++] = thickness[nci];
            }
          }
          if (nN < 3) {
            // Too few neighbours to validate — keep as-is
            thicknessF[ci] = thickness[ci];
            validF[ci] = 1;
            topF[ci] = topD[ci]; botF[ci] = bottomD[ci];
            continue;
          }
          // Insertion sort on small array
          for (var ii = 1; ii < nN; ii++) {
            var x = nbrBuf[ii], jj = ii - 1;
            while (jj >= 0 && nbrBuf[jj] > x) { nbrBuf[jj + 1] = nbrBuf[jj]; jj--; }
            nbrBuf[jj + 1] = x;
          }
          var med = nbrBuf[nN >> 1];
          if (med > 0 && Math.abs(thickness[ci] - med) / med <= 0.50) {
            thicknessF[ci] = thickness[ci];
            validF[ci] = 1;
            topF[ci] = topD[ci]; botF[ci] = bottomD[ci];
          }
        }
      }
      thickness = null; valid = null; topD = null; bottomD = null; nbrBuf = null;

      // Pass E — connected-component footprint rejection.
      // Find global median of valid cells; mark "fat" cells (> median*1.3),
      // flood-fill components, drop components below minComponentM2.
      var sortBuf = [];
      for (var i = 0; i < nCells; i++) if (validF[i]) sortBuf.push(thicknessF[i]);
      if (sortBuf.length > 0) {
        sortBuf.sort(function(a, b) { return a - b; });
        var medAll = sortBuf[sortBuf.length >> 1];
        var fatLimit = medAll * 1.30;
        var cellArea = cellU * cellV;

          for (var ix = 0; ix < gridRes; ix++) {
            var ci = iy * gridRes + ix;
            if (component[ci] !== 0) continue;
            if (!validF[ci] || thicknessF[ci] <= fatLimit) continue;
            // Flood fill
            stack.length = 0;
            stack.push(ci);
            component[ci] = compId;
            var sz = 0;
            while (stack.length > 0) {
              var cci = stack.pop();
              sz++;
              var cy = (cci / gridRes) | 0;
              var cx = cci - cy * gridRes;
              // 4-connected neighbours
              if (cx > 0) {
                var nci = cci - 1;
                if (component[nci] === 0 && validF[nci] && thicknessF[nci] > fatLimit) {
                  component[nci] = compId; stack.push(nci);
                }
              }
              if (cx < gridRes - 1) {
                var nci = cci + 1;
                if (component[nci] === 0 && validF[nci] && thicknessF[nci] > fatLimit) {
                  component[nci] = compId; stack.push(nci);
                }
              }
              if (cy > 0) {
                var nci = cci - gridRes;
                if (component[nci] === 0 && validF[nci] && thicknessF[nci] > fatLimit) {
                  component[nci] = compId; stack.push(nci);
                }
              }
              if (cy < gridRes - 1) {
                var nci = cci + gridRes;
                if (component[nci] === 0 && validF[nci] && thicknessF[nci] > fatLimit) {

                }

            }

            compId++;

        for (var i = 0; i < nCells; i++) {
          var cid = component[i];

          }
        }
        component = null; sortBuf = null;
      }

      return {
        grid:     thicknessF,
        valid:    validF,
        topD:     topF,
        bottomD:  botF,
        gridRes:  gridRes,
        uMin:     uMin,  vMin: vMin,
        cellU:    cellU, cellV: cellV,
        U:        U,     V: V,    N: N,    C: C,
        binSize:  binSize
      };
    }

    // Look up thickness for a world point. Returns the cell's thickness if
    // valid AND the point is inside the cell's slab band [bottomD, topD]
    // (with a small tolerance). Returns null otherwise so coloring restores
    // the original RGB — keeps off-slab points uncolored even when their
    // (u,v) cell is valid (e.g. a hanger sticking below a real cell).
    // Look up cell's thickness for a world point. The top-surface filter
    // (cfg.surfaceGrid) already does the spatial gating in the apply loop,
    // so we don't need a depth-band check here — we just need the cell's
    // thickness value to drive the color.
    function getThicknessForPoint(px, py, pz, tg) {
      if (!tg) return null;
      var dx = px - tg.C.x, dy = py - tg.C.y, dz = pz - tg.C.z;
      var u = dx * tg.U.x + dy * tg.U.y + dz * tg.U.z;
      var vv = dx * tg.V.x + dy * tg.V.y + dz * tg.V.z;
      var iu = Math.floor((u - tg.uMin) / tg.cellU);
      var iv = Math.floor((vv - tg.vMin) / tg.cellV);
      if (iu < 0 || iu >= tg.gridRes || iv < 0 || iv >= tg.gridRes) return null;
      var idx = iv * tg.gridRes + iu;
      if (!tg.valid[idx]) return null;
      return tg.grid[idx];
    }

    // ===== MEASUREMENT POINT LABELS =====
    const measurePointLabels = new Map(); // Map<Measure, TextSprite[]>
    const measureLabelScene = new THREE.Scene();
    measureLabelScene.name = "EnableMeasureLabelScene";
    let nextPointNumber = 1;                    // global D-number, never resets
    const measurePointNumbers = new Map();      // Map<Measure, number[]> — D-numbers per measurement

    // ===== SNAP THRESHOLDS (screen pixels) =====
    var SNAP_THRESHOLD_MEMBER = 18;      // for member/constraint picks
    var SNAP_THRESHOLD_MEASUREMENT = 10; // for Potree measurement picks (gentler)

    // ===== UNDO STACK =====
    const undoStack = [];
    const redoStack = [];   // box/volume-transform redo (Ctrl+Y / Ctrl+Shift+Z)

    // Attach undo tracking to a volume — captures transform before gizmo interaction, pushes on mouseup
    function trackVolumeUndo(volume) {
      var savedPos = null, savedRot = null, savedScale = null;
      var armed = false; // skip the initial insertion drag

      // After a short delay, arm the tracker (avoids capturing the initial sizing drag)
      setTimeout(function() { armed = true; }, 1500);

      function captureState() {
        if (!armed) return;
        if (!savedPos) {
          savedPos = volume.position.clone();
          savedRot = volume.rotation.clone();
          savedScale = volume.scale.clone();
        }
      }

      function pushUndo() {
        if (!savedPos) return;
        var posChanged = !volume.position.equals(savedPos);
        var rotChanged = volume.rotation.x !== savedRot.x || volume.rotation.y !== savedRot.y || volume.rotation.z !== savedRot.z;
        var scaleChanged = !volume.scale.equals(savedScale);
        if (posChanged || rotChanged || scaleChanged) {
          undoStack.push({
            type: 'volume-transform',
            vol: volume,
            before: { pos: savedPos.clone(), rot: savedRot.clone(), scale: savedScale.clone() },
            after:  { pos: volume.position.clone(), rot: volume.rotation.clone(), scale: volume.scale.clone() }
          });
          redoStack.length = 0;   // a fresh transform invalidates the redo chain
        }
        savedPos = null;
        savedRot = null;
        savedScale = null;
      }

      // Listen for transform changes from Potree's TransformationTool gizmo
      volume.addEventListener('position_changed', captureState);
      volume.addEventListener('orientation_changed', captureState);
      volume.addEventListener('scale_changed', captureState);

      // Also capture on raw drag events (body drag, not gizmo)
      volume.addEventListener('drag', captureState);
      volume.addEventListener('drop', pushUndo);

      // Push undo when mouse is released (covers gizmo handle drops)
      document.addEventListener('mouseup', function() {
        if (savedPos) {
          // Delay slightly so the final transform is applied before we compare
          setTimeout(pushUndo, 50);
        }
      });
    }

    // -- Undo last action --
    function performUndo() {
      if (undoStack.length === 0) { showToast('Nothing to undo'); return; }
      var action = undoStack.pop();

      if (action.type === 'mark') {
        // Remove the specific marker by id
        deleteMarker(action.id);
        showToast('Undid mark (' + markedPoints.length + ' remaining)');
      } else if (action.type === 'constraint-point') {
        // Remove last picked constraint point
        if (constraintPickMode && constraintPickPoints.length > 0) {
          constraintPickPoints.pop();
          if (constraintPickMarkers.length > 0) {
            var m = constraintPickMarkers.pop();
            m.traverse(function(obj) {
              if (obj.geometry) obj.geometry.dispose();
              if (obj.material) obj.material.dispose();
            });
            constraintScene.remove(m);
          }
          if (constraintPickPoints.length === 0) {
            cancelConstraintPick();
            showToast('Undid constraint pick — cancelled');
          } else {
            showToast('Pick point (' + (constraintPickPoints.length + 1) + '/' + constraintPickTarget + ') for ' + constraintPickType, 5000);
          }
        }
      } else if (action.type === 'constraint') {
        deleteConstraint(action.id);
        showToast('Undid constraint');
      } else if (action.type === 'member-point') {
        // Remove last picked member point
        if (memberPickMode && memberPickPoints.length > 0) {
          memberPickPoints.pop();
          if (memberPickMarkers.length > 0) {
            var m = memberPickMarkers.pop();
            m.traverse(function(obj) {
              if (obj.geometry) obj.geometry.dispose();
              if (obj.material) obj.material.dispose();
            });
            memberScene.remove(m);
          }
          if (memberPickPoints.length === 0) {
            cancelMemberPick();
            showToast('Undid member pick — cancelled');
          } else {
            showToast('Pick endpoint (2/2) for member', 5000);
          }
        }
      } else if (action.type === 'member') {
        deleteMember(action.id);
        showToast('Undid member');
      } else if (action.type === 'measurement-point') {
        var meas = action.measure;
        if (meas && meas.points && meas.points.length > 0) {
          var minReq = _measureMinPoints(meas);
          // If removing the last point would leave the measurement below its
          // required minimum, remove the entire measurement (no orphan
          // 1-point distance/height or <3-point area/angle measurements).
          if (meas.points.length - 1 < minReq) {
            // If this measurement is in-progress, also cancel the Potree tool
            // so we don't leave a dangling cursor-follow sphere + drag.
            if (pendingMeasurement === meas) cancelPotreeInsertion();
            viewer.scene.removeMeasurement(meas);
            showToast('Undid measurement');
          } else {
            meas.removeMarker(meas.points.length - 1);
            showToast('Undid measurement point');
          }
        }

        if (action.vol) {
          action.vol.position.copy(action.before.pos);
          action.vol.rotation.copy(action.before.rot);
          action.vol.scale.copy(action.before.scale);
        }
        redoStack.push(action);
        showToast('Undid box transform');
      }

      // supports box/volume transforms only).
      if (action.type !== 'volume-transform') redoStack.length = 0;
    }

    // -- Redo last undone action (box/volume transforms only for now) --
    function performRedo() {
      if (redoStack.length === 0) { showToast('Nothing to redo'); return; }
      var action = redoStack.pop();
      if (action.type === 'volume-transform') {
        if (action.vol) {
          action.vol.position.copy(action.after.pos);
          action.vol.rotation.copy(action.after.rot);
          action.vol.scale.copy(action.after.scale);
        }
        undoStack.push(action);
        showToast('Redid box transform');
      }
    }

    // ============================================================
    // SAVED VIEWS — camera + annotation-visibility snapshots
    // (SketchUp-Scenes model: a view captures the camera AND which
    //  dimensions/marks/members/notes are visible. Recall restores both.
    //  Dimensions stay a single global pool — a view just stores an on/off
    //  map keyed by stable ids, so the same dimension can appear in many
    //  views without duplication.)
    // ============================================================
    var savedViews = [];      // { id, name, cam, vis }
    var nextViewId = 1;
    var _activeViewId = null;
    var _nextMeasureMid = 1;  // stable per-measurement id (Potree Measures have no persistent id)
    try { console.info('[Enable] BDA build 2026-06-30 — no-login + R2 + mobile viewer stack'); } catch (e) {}

    function _viewEsc(s) {
      return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) {
        return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
      });
    }
    function _findView(id) {
      for (var i = 0; i < savedViews.length; i++) if (savedViews[i].id === id) return savedViews[i];
      return null;
    }
    function _ensureMid(m) {
      if (!m.userData) m.userData = {};
      if (m.userData._mid == null) m.userData._mid = _nextMeasureMid++;
      return m.userData._mid;
    }

    // Fully hide/show a measurement, INCLUDING the value labels the Dev2 chrome
    // reparents into its own depth scene — measure.visible alone won't touch
    // those (that's why a plain hide left the dimension text on screen).
    function _measMaterials(o) {
      var mats = [];
      if (o) {
        if (o.material) mats.push(o.material);
        if (o.sprite && o.sprite.material) mats.push(o.sprite.material);
      }
      return mats;
    }
    function _setMeasureVisible(m, vis) {
      m.visible = vis;
      // The connecting LINES (Line2 edges) and value labels are reparented into
      // the chrome's depth scene, where .visible alone proved unreliable (and
      // Potree's update() resets edge.visible). So hide them mechanism-
      // independently: object .visible AND material opacity=0 (restored on show).

        else status += ' \u2014 Enter to finalize';
        showToast(status, 5000);
      } else if (constraintPickType === 'plane-x-axis') {
        if (count < 2) {
          showToast('Pick +X end point (2/2) \u2014 left \u2192 right on screen', 5000);
        } else {
          showToast('+X line set \u2014 drag a marker to refine, Enter to accept, Esc to cancel', 6000);
        }
      } else if (count < constraintPickTarget) {
        showToast('Pick point (' + (count + 1) + '/' + constraintPickTarget + ') for ' + constraintPickType, 5000);
      } else {
        finalizeConstraint();
      }
    }

    // -- Cancel constraint pick mode --
    function cancelConstraintPick() {
      var wasXAxis = (constraintPickType === 'plane-x-axis');
      var wasEdit = wasXAxis && _pendingPlaneConstraint && constraints.indexOf(_pendingPlaneConstraint) !== -1;
      _pendingPlaneConstraint = null;
      constraintPickMode = false;
      constraintPickPoints = [];
      constraintPickType = null;
      constraintPickTarget = 0;
      clearPickMarkers();
      _disposeConstraintPreview();
      document.body.classList.remove('constraint-pick-mode');
      document.querySelectorAll('#enable-constraint-buttons button').forEach(function(b) { b.classList.remove('active'); });
      showToast(wasXAxis
        ? (wasEdit ? 'X axis edit cancelled' : 'Plane discarded — X axis required')
        : 'Constraint picking cancelled');
    }

    // -- Finalize constraint from picked points --
    function finalizeConstraint() {
      var type = constraintPickType;
      var pts = constraintPickPoints;
      var constraint = null;

      if (type === 'fit-plane') {
        if (pts.length < 3) {
          showToast('Need at least 3 points for best-fit plane');
          cancelConstraintPick();
          return;
        }
        // Compute centroid
        var centroid = new THREE.Vector3();
        for (var fi = 0; fi < pts.length; fi++) centroid.add(pts[fi]);
        centroid.divideScalar(pts.length);

        // Build 3x3 covariance matrix
        var xx = 0, xy = 0, xz = 0, yy = 0, yz = 0, zz = 0;
        for (var fi = 0; fi < pts.length; fi++) {
          var dx = pts[fi].x - centroid.x;
          var dy = pts[fi].y - centroid.y;
          var dz = pts[fi].z - centroid.z;
          xx += dx * dx; xy += dx * dy; xz += dx * dz;
          yy += dy * dy; yz += dy * dz; zz += dz * dz;
        }

        // Find the eigenvector with smallest eigenvalue via power iteration
        // on the adjugate (cofactor) matrix — the normal is the least-variance direction.
        // For a 3x3 symmetric matrix, the smallest eigenvector can be found by
        // computing cross products of rows of (A - λI). We use a simpler approach:
        // try each candidate normal (cross products of covariance rows) and pick
        // the one that gives the smallest variance.
        var det2 = function(a, b, c, d) { return a * d - b * c; };
        var candidates = [
          // Cross products of pairs of rows of the covariance matrix
          new THREE.Vector3(
            det2(xy, xz, yy, yz),
            det2(xz, xx, yz, xy),
            det2(xx, xy, xy, yy)
          ),
          new THREE.Vector3(
            det2(yy, yz, xy, xz),
            det2(yz, xy, xz, xx),
            det2(xy, yy, xx, xy)
          ),
          // Fallback: world axes
          new THREE.Vector3(1, 0, 0),
          new THREE.Vector3(0, 1, 0),
          new THREE.Vector3(0, 0, 1)
        ];

        // Pick candidate that minimizes sum of squared distances to the plane
        var bestNormal = null;
        var bestVariance = Infinity;
        for (var ci2 = 0; ci2 < candidates.length; ci2++) {
          var n = candidates[ci2];
          if (n.length() < 0.0001) continue;
          n.normalize();
          var variance = 0;
          for (var fi = 0; fi < pts.length; fi++) {
            var d = (pts[fi].x - centroid.x) * n.x +
                    (pts[fi].y - centroid.y) * n.y +
                    (pts[fi].z - centroid.z) * n.z;
            variance += d * d;
          }
          if (variance < bestVariance) {
            bestVariance = variance;
            bestNormal = n.clone();
          }
        }

        if (!bestNormal) {
          showToast('Could not compute best-fit plane');
          cancelConstraintPick();
          return;
        }

        var rms = Math.sqrt(bestVariance / pts.length) * 1000; // mm
        var normal = bestNormal;
        var plane = new THREE.Plane();
        plane.setFromNormalAndCoplanarPoint(normal, centroid);

        constraint = {
          id: nextConstraintId++,
          type: 'plane',
          name: 'Fit Plane ' + (nextConstraintId - 1),
          plane: plane,
          normal: normal,
          centroid: centroid,
          points: pts,
          visual: null,
          visible: true,
          locked: true
        };
        // Hold the plane while the user picks 2 points to define the +X axis.
        // The constraint isn't pushed to `constraints[]` until X is set, so
        // cancelling the X-axis pick discards the plane.
        _pendingPlaneConstraint = constraint;
        clearPickMarkers();
        constraintPickPoints = [];
        constraintPickType = 'plane-x-axis';
        constraintPickTarget = 2;
        constraintPickMode = true;
        showToast('Plane fit (RMS: ' + rms.toFixed(1) + ' mm). Now pick 2 points for +X axis (left → right)', 6000);
        return;
      } else if (type === 'axis') {
        var dir = new THREE.Vector3().subVectors(pts[1], pts[0]);
        if (dir.length() < 0.001) {
          showToast('Points are coincident \u2014 cannot define axis');
          cancelConstraintPick();
          return;
        }
        dir.normalize();
        constraint = {
          id: nextConstraintId++,
          type: 'axis',
          name: 'Axis ' + (nextConstraintId - 1),
          origin: pts[0].clone(),
          direction: dir,
          points: pts,
          visual: null,
          visible: true,
          locked: true
        };
      }

      clearPickMarkers();

      if (constraint) {
        buildConstraintVisual(constraint);
        constraints.push(constraint);
        rebuildConstraintList();
        // Replace constraint-point undo entries with a single constraint entry
        while (undoStack.length > 0 && undoStack[undoStack.length - 1].type === 'constraint-point') {
          undoStack.pop();
        }
        undoStack.push({ type: 'constraint', id: constraint.id });
        showToast(constraint.name + ' created');
      }

      constraintPickMode = false;
      constraintPickPoints = [];
      constraintPickType = null;
      constraintPickTarget = 0;
      _disposeConstraintPreview();
      document.body.classList.remove('constraint-pick-mode');
      document.querySelectorAll('#enable-constraint-buttons button').forEach(function(b) { b.classList.remove('active'); });
    }

    // -- Re-enter X-axis pick mode for an existing plane (sidebar button) --
    function startPlaneXAxisEdit(c) {
      if (!c || c.type !== 'plane') return;
      if (memberPickMode) cancelMemberPick();
      if (constraintPickMode) cancelConstraintPick();
      _pendingPlaneConstraint = c;
      constraintPickMode = true;
      constraintPickPoints = [];
      constraintPickType = 'plane-x-axis';
      constraintPickTarget = 2;
      _ensureConstraintPreview();
      showToast('Re-pick 2 points for ' + c.name + ' +X axis (Enter to accept, Esc to cancel)', 6000);
    }

    // -- Finalize the X-axis pick step that follows fit-plane creation --
    function finalizePlaneXAxis() {
      var c = _pendingPlaneConstraint;
      if (!c || constraintPickPoints.length < 2) return;
      // Validate that the projected X line has non-zero length on the plane.
      var n = c.normal;
      var a = constraintPickPoints[0].clone();
      var b = constraintPickPoints[1].clone();
      var aOff = (a.x - c.centroid.x) * n.x + (a.y - c.centroid.y) * n.y + (a.z - c.centroid.z) * n.z;
      var bOff = (b.x - c.centroid.x) * n.x + (b.y - c.centroid.y) * n.y + (b.z - c.centroid.z) * n.z;
      a.addScaledVector(n, -aOff);
      b.addScaledVector(n, -bOff);
      if (a.distanceTo(b) < 1e-4) {
        // Both picks projected to nearly the same point; ask the user to redo.
        clearPickMarkers();
        constraintPickPoints = [];
        showToast('X-axis points are too close after projection — pick 2 points farther apart', 5000);
        return;
      }
      // Capture the camera's screen-up vector at click time. Column 1 of the
      // camera's world matrix is its local Y axis = up direction on screen.
      var cam = viewer.scene.getActiveCamera();
      var camUp = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
      c.xAxisAnchorA = constraintPickPoints[0].clone();
      c.xAxisAnchorB = constraintPickPoints[1].clone();
      c.xAxisCamUp = camUp;
      c.basis = computePlaneBasis(c);

      clearPickMarkers();
      var alreadyInList = constraints.indexOf(c) !== -1;
      if (alreadyInList) {
        rebuildConstraintVisual(c);
        showToast(c.name + ' X axis updated');
      } else {
        buildConstraintVisual(c);
        constraints.push(c);
        rebuildConstraintList();
        while (undoStack.length > 0 && undoStack[undoStack.length - 1].type === 'constraint-point') {
          undoStack.pop();
        }
        undoStack.push({ type: 'constraint', id: c.id });
        showToast(c.name + ' created with custom X axis');
      }

      _pendingPlaneConstraint = null;
      constraintPickMode = false;
      constraintPickPoints = [];
      constraintPickType = null;
      constraintPickTarget = 0;
      _disposeConstraintPreview();
      document.body.classList.remove('constraint-pick-mode');
      document.querySelectorAll('#enable-constraint-buttons button').forEach(function(b) { b.classList.remove('active'); });
    }

    // -- Build 3D visual for a constraint --
    // Compute a plane constraint's local XYZ basis. If the user has set an X
    // axis (two anchors picked after the plane was fit), X = projection of
    // (anchorB - anchorA) onto the plane, Y = camera-up at click time
    // projected onto the plane and made perpendicular to X, Z = X × Y
    // (right-hand rule). Anchors are stored in world coordinates so a
    // re-fit (drag of plane definition points) automatically updates the
    // basis through reprojection. Falls back to the legacy auto-basis
    // (world-Z projected onto plane) if anchors are missing.
    function computePlaneBasis(c) {
      if (c.type !== 'plane') return null;
      var n = c.normal.clone().normalize();
      var X, Y, Z;
      if (c.xAxisAnchorA && c.xAxisAnchorB && c.xAxisCamUp) {
        // Project both anchors onto the plane to kill any Z drift.
        var a = c.xAxisAnchorA.clone();
        var b = c.xAxisAnchorB.clone();
        var aOff = (a.x - c.centroid.x) * n.x + (a.y - c.centroid.y) * n.y + (a.z - c.centroid.z) * n.z;
        var bOff = (b.x - c.centroid.x) * n.x + (b.y - c.centroid.y) * n.y + (b.z - c.centroid.z) * n.z;
        a.addScaledVector(n, -aOff);
        b.addScaledVector(n, -bOff);
        var dx = new THREE.Vector3().subVectors(b, a);
        if (dx.length() < 1e-6) return null;
        X = dx.normalize();
        // Camera-up at click time, projected onto plane and made ⊥ to X.
        var up = c.xAxisCamUp.clone();
        up.addScaledVector(n, -up.dot(n));
        up.addScaledVector(X, -up.dot(X));
        if (up.length() < 1e-6) {
          // Camera-up is parallel to X — pick an arbitrary perpendicular.
          up.copy(n).cross(X);
        }
        Y = up.normalize();
        Z = new THREE.Vector3().crossVectors(X, Y).normalize();
      } else {
        // Legacy auto-basis (world-Z projected, falling back to world-X).
        var worldRef = (Math.abs(n.z) < 0.9)
          ? new THREE.Vector3(0, 0, 1)
          : new THREE.Vector3(1, 0, 0);
        X = new THREE.Vector3().crossVectors(worldRef, n).normalize();
        Y = new THREE.Vector3().crossVectors(n, X).normalize();
        Z = n;
      }
      return { X: X, Y: Y, Z: Z, origin: c.centroid.clone() };
    }

    function buildConstraintVisual(constraint) {
      var group = new THREE.Group();
      group.name = 'constraint-' + constraint.id;

      if (constraint.type === 'plane') {
        var pts = constraint.points;
        var maxDist = 0;
        for (var i = 0; i < pts.length; i++) {
          for (var j = i + 1; j < pts.length; j++) {
            var d = pts[i].distanceTo(pts[j]);
            if (d > maxDist) maxDist = d;
          }
        }
        var quadSize = Math.max(maxDist * 3, 1);
        var planeGeo = new THREE.PlaneGeometry(quadSize, quadSize);
        var planeMat = new THREE.MeshBasicMaterial({
          color: 0x39ff14, transparent: true, opacity: 0.15,
          side: THREE.DoubleSide, depthTest: false, depthWrite: false
        });
        var planeMesh = new THREE.Mesh(planeGeo, planeMat);
        planeMesh.position.copy(constraint.centroid);
        // Build rotation so quad edges stay aligned with world axes.
        // PlaneGeometry face normal is local Z; local X/Y are the quad edges.
        var n = constraint.normal;
        // Project world-Z onto the plane to get a vertical-ish "up" edge.
        // If the plane is nearly horizontal (normal ~ Z), use world-X instead.
        var worldRef = (Math.abs(n.z) < 0.9)
          ? new THREE.Vector3(0, 0, 1)
          : new THREE.Vector3(1, 0, 0);
        // localX = horizontal edge in the plane
        var localX = new THREE.Vector3().crossVectors(worldRef, n).normalize();
        // localY = vertical edge in the plane
        var localY = new THREE.Vector3().crossVectors(n, localX).normalize();
        var rotMat = new THREE.Matrix4().makeBasis(localX, localY, n);
        var quat = new THREE.Quaternion().setFromRotationMatrix(rotMat);
        planeMesh.quaternion.copy(quat);
        group.add(planeMesh);

        var edgeGeo = new THREE.EdgesGeometry(planeGeo);
        var edgeMat = new THREE.LineBasicMaterial({
          color: 0x39ff14, transparent: true, opacity: 0.4,
          depthTest: false, depthWrite: false
        });
        var edgeLine = new THREE.LineSegments(edgeGeo, edgeMat);
        edgeLine.position.copy(constraint.centroid);
        edgeLine.quaternion.copy(quat);
        group.add(edgeLine);

        // +X (red) and +Y (green) basis arrows from centroid. Anchored from
        // the user-defined basis if present, falling back to auto-basis.
        var basis = constraint.basis || computePlaneBasis(constraint);
        if (basis) {
          var arrowLen = Math.max(quadSize * 0.28, 0.3);
          var headLen = arrowLen * 0.22;
          var headW = headLen * 0.55;
          var xArrow = new THREE.ArrowHelper(basis.X, constraint.centroid, arrowLen, 0xff3030, headLen, headW);
          var yArrow = new THREE.ArrowHelper(basis.Y, constraint.centroid, arrowLen, 0x30ff30, headLen, headW);
          [xArrow, yArrow].forEach(function(arr) {
            arr.userData.isBasisArrow = true;
            arr.line.material.transparent = true;
            arr.line.material.opacity = 0.95;
            arr.line.material.depthTest = false;
            arr.line.material.depthWrite = false;
            arr.cone.material.transparent = true;
            arr.cone.material.opacity = 0.95;
            arr.cone.material.depthTest = false;
            arr.cone.material.depthWrite = false;
            arr.line.userData.isBasisArrow = true;
            arr.cone.userData.isBasisArrow = true;
          });
          group.add(xArrow);
          group.add(yArrow);
        }
      } else if (constraint.type === 'axis') {
        var axDir = constraint.direction;
        var axOrigin = constraint.origin;
        var span = constraint.points[0].distanceTo(constraint.points[1]);
        var extend = Math.max(span * 5, 10);
        var p1 = new THREE.Vector3().copy(axOrigin).addScaledVector(axDir, -extend);
        var p2 = new THREE.Vector3().copy(axOrigin).addScaledVector(axDir, extend);
        var lineGeo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
        var lineMat = new THREE.LineBasicMaterial({
          color: 0x39ff14, transparent: true, opacity: 0.6,
          depthTest: false, depthWrite: false
        });
        group.add(new THREE.Line(lineGeo, lineMat));
      }

      // Definition point markers: solid green sphere, fixed screen-pixel size.
      // (Per-frame scaling lives in the render.pass.perspective_overlay handler;
      // isDefPointRing flag keeps updateConstraintVisuals' opacity rule pinned
      // at 0.9 instead of falling into the dim-mesh branch.)
      for (var k = 0; k < constraint.points.length; k++) {
        var pt = constraint.points[k];
        var ptGroup = new THREE.Group();
        ptGroup.position.copy(pt);
        ptGroup.userData.isDefinitionPoint = true;
        ptGroup.userData.pointIndex = k;

        var sphGeo = new THREE.SphereGeometry(0.4, 12, 12);
        var sphMat = new THREE.MeshBasicMaterial({
          color: 0x39ff14,
          depthTest: false,
          depthWrite: false,
          transparent: true,
          opacity: 0.9
        });
        var sphMesh = new THREE.Mesh(sphGeo, sphMat);
        sphMesh.userData.isDefPointRing = true;
        sphMesh.userData.isMarkerSphere = true;
        ptGroup.add(sphMesh);

        group.add(ptGroup);
      }

      constraint.visual = group;
      constraintScene.add(group);
      if (constraint.visible === false) group.visible = false;
      updateConstraintVisuals();
    }

    // -- Update visual opacity based on active state --
    function updateConstraintVisuals() {
      for (var ci = 0; ci < constraints.length; ci++) {
        var c = constraints[ci];
        if (!c.visual) continue;
        var isActive = c.id === activeConstraintId;
        c.visual.traverse(function(obj) {
          if (obj.material) {
            if (obj.userData && obj.userData.isDefPointRing) {
              obj.material.opacity = 0.9;
            } else if (obj.userData && obj.userData.isBasisArrow) {
              // Basis arrows manage their own opacity (always visible).
            } else if (obj.isMesh) {
              obj.material.opacity = isActive ? 0.2 : 0.08;
            } else if (obj.isLine || obj.isLineSegments) {
              obj.material.opacity = isActive ? 0.7 : 0.25;
            }
          }
        });
      }
    }

    // -- Rebuild constraint sidebar list --
    function rebuildConstraintList() {
      var listEl = document.getElementById('enable-constraint-list');
      if (!listEl) return;
      listEl.innerHTML = '';
      _appendDeleteAll(listEl, constraints.length, 'constraints', clearAllConstraints);

      for (var ci = 0; ci < constraints.length; ci++) {
        (function(c) {
          var row = document.createElement('div');
          row.className = 'constraint-row' + (c.id === activeConstraintId ? ' active' : '');

          var nameSpan = document.createElement('span');
          nameSpan.className = 'constraint-name';
          nameSpan.textContent = c.name;
          row.appendChild(nameSpan);

          var visBtn = document.createElement('button');
          visBtn.className = 'btn-vis' + (c.visible === false ? ' hidden' : '');
          visBtn.textContent = '\uD83D\uDC41';
          visBtn.title = 'Toggle visibility';
          visBtn.addEventListener('click', function() {
            c.visible = !c.visible;
            if (c.visual) c.visual.visible = c.visible;
            visBtn.classList.toggle('hidden', !c.visible);
          });
          row.appendChild(visBtn);

          var lockBtn = document.createElement('button');
          lockBtn.className = 'btn-lock' + (c.locked ? ' locked' : '');
          lockBtn.textContent = c.locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
          lockBtn.title = c.locked ? 'Unlock points' : 'Lock points';
          lockBtn.addEventListener('click', function() {
            c.locked = !c.locked;
            lockBtn.textContent = c.locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
            lockBtn.title = c.locked ? 'Unlock points' : 'Lock points';
            lockBtn.classList.toggle('locked', c.locked);
          });
          row.appendChild(lockBtn);

          if (c.type === 'plane') {
            var orthoBtn = document.createElement('button');
            orthoBtn.className = 'btn-ortho';
            orthoBtn.textContent = '\u2316';
            orthoBtn.title = 'Orthographic view of this plane';
            orthoBtn.addEventListener('click', function() {
              viewPlaneOrtho(c);
            });
            row.appendChild(orthoBtn);

            var setXBtn = document.createElement('button');
            setXBtn.className = 'btn-set-x';
            setXBtn.textContent = 'X';
            setXBtn.title = 'Re-pick +X axis for this plane';
            setXBtn.addEventListener('click', function() {
              startPlaneXAxisEdit(c);
            });
            row.appendChild(setXBtn);
          }

          var activateBtn = document.createElement('button');
          activateBtn.textContent = c.id === activeConstraintId ? 'Active' : 'Activate';
          activateBtn.addEventListener('click', function() {
            if (activeConstraintId === c.id) {
              activeConstraintId = null;
            } else {
              activeConstraintId = c.id;
            }
            rebuildConstraintList();
            updateConstraintVisuals();
          });
          row.appendChild(activateBtn);

          var deleteBtn = document.createElement('button');
          deleteBtn.textContent = '\u00d7';
          deleteBtn.title = 'Delete constraint';
          deleteBtn.addEventListener('click', function() {
            deleteConstraint(c.id);
          });
          row.appendChild(deleteBtn);

          listEl.appendChild(row);
        })(constraints[ci]);
      }
      updateConstraintStatus();
    }

    // -- Delete a constraint --
    function deleteConstraint(id) {
      var idx = -1;
      for (var i = 0; i < constraints.length; i++) {
        if (constraints[i].id === id) { idx = i; break; }
      }
      if (idx === -1) return;
      var c = constraints[idx];
      if (c.visual) {
        c.visual.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) obj.material.dispose();
        });
        constraintScene.remove(c.visual);
      }
      if (activeConstraintId === id) activeConstraintId = null;
      constraints.splice(idx, 1);
      rebuildConstraintList();
      updateConstraintVisuals();
    }

    // -- Update constraint status display --
    function updateConstraintStatus() {
      var el = document.getElementById('enable-constraint-status');
      if (!el) return;
      if (!activeConstraintId) {
        var orphanBits = [];
        if (_orthoMeasureMode) orphanBits.push('Ortho ON');
        if (_orthoParallelMode) orphanBits.push('Parallel ON');
        el.textContent = orphanBits.length
          ? orphanBits.join(', ') + ' (no plane active — inactive)'
          : '';
        return;
      }
      var c = null;
      for (var i = 0; i < constraints.length; i++) {
        if (constraints[i].id === activeConstraintId) { c = constraints[i]; break; }
      }
      if (c) {
        var txt = c.name + ' constraint active';
        if (c.type === 'plane' && c.basis) {
          if (_orthoMeasureMode) txt += ' | Ortho ON (' + (_orthoParallelMode ? 'X/Y/Z' : 'X/Y') + ')';
          if (_orthoParallelMode) txt += ' | Parallel';
        }
        el.textContent = txt;
      }
    }

    // -- Find nearest definition point to mouse (screen-space hit test) --
    function findNearestDefinitionPoint(mousePixel) {
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = 14; // pixel threshold
      var bestResult = null;
      for (var ci = 0; ci < constraints.length; ci++) {
        var c = constraints[ci];
        if (c.locked) continue;
        for (var pi = 0; pi < c.points.length; pi++) {
          var pt = c.points[pi].clone().project(camera);
          var screenX = (pt.x * 0.5 + 0.5) * rect.width;
          var screenY = (1 - (pt.y * 0.5 + 0.5)) * rect.height;
          var dx = screenX - mousePixel.x;
          var dy = screenY - mousePixel.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < bestDist) {
            bestDist = dist;
            bestResult = { constraint: c, pointIndex: pi };
          }
        }
      }
      return bestResult;
    }

    // -- Find nearest X-axis pick marker to mouse (during plane-x-axis pick) --
    function findNearestXAxisPickMarker(mousePixel) {
      if (constraintPickType !== 'plane-x-axis') return -1;
      if (!constraintPickMarkers.length) return -1;
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = 25;
      var bestIdx = -1;
      for (var i = 0; i < constraintPickMarkers.length; i++) {
        var pt = constraintPickMarkers[i].position.clone().project(camera);
        var sx = (pt.x * 0.5 + 0.5) * rect.width;
        var sy = (1 - (pt.y * 0.5 + 0.5)) * rect.height;
        var dx = sx - mousePixel.x, dy = sy - mousePixel.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      }
      return bestIdx;
    }

    // -- Recompute constraint geometry after a point is moved --
    function recomputeConstraint(c) {
      if (c.type === 'plane') {
        var pts = c.points;
        if (pts.length === 3) {
          var v1 = new THREE.Vector3().subVectors(pts[1], pts[0]);
          var v2 = new THREE.Vector3().subVectors(pts[2], pts[0]);
          var normal = new THREE.Vector3().crossVectors(v1, v2);
          if (normal.length() < 0.001) return false;
          normal.normalize();
          c.normal = normal;
          c.plane = new THREE.Plane();
          c.plane.setFromNormalAndCoplanarPoint(normal, pts[0]);
          c.centroid = new THREE.Vector3().add(pts[0]).add(pts[1]).add(pts[2]).divideScalar(3);
        } else if (pts.length > 3) {
          // Re-fit plane from all points
          var centroid = new THREE.Vector3();
          for (var i = 0; i < pts.length; i++) centroid.add(pts[i]);
          centroid.divideScalar(pts.length);
          var xx = 0, xy = 0, xz = 0, yy = 0, yz = 0, zz = 0;
          for (var i = 0; i < pts.length; i++) {
            var dx = pts[i].x - centroid.x, dy = pts[i].y - centroid.y, dz = pts[i].z - centroid.z;
            xx += dx * dx; xy += dx * dy; xz += dx * dz;
            yy += dy * dy; yz += dy * dz; zz += dz * dz;
          }
          var det2 = function(a, b, cd, d) { return a * d - b * cd; };
          var candidates = [
            new THREE.Vector3(det2(xy, xz, yy, yz), det2(xz, xx, yz, xy), det2(xx, xy, xy, yy)),
            new THREE.Vector3(det2(yy, yz, xy, xz), det2(yz, xy, xz, xx), det2(xy, yy, xx, xy)),
            new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 1)
          ];
          var bestNormal = null, bestVar = Infinity;
          for (var ci2 = 0; ci2 < candidates.length; ci2++) {
            var n = candidates[ci2];
            if (n.length() < 0.0001) continue;
            n.normalize();
            var v = 0;
            for (var i = 0; i < pts.length; i++) {
              var d = (pts[i].x - centroid.x) * n.x + (pts[i].y - centroid.y) * n.y + (pts[i].z - centroid.z) * n.z;
              v += d * d;
            }
            if (v < bestVar) { bestVar = v; bestNormal = n.clone(); }
          }
          if (!bestNormal) return false;
          c.normal = bestNormal;
          c.centroid = centroid;
          c.plane = new THREE.Plane();
          c.plane.setFromNormalAndCoplanarPoint(bestNormal, centroid);
        } else {
          return false; // fewer than 3 points
        }
      } else if (c.type === 'axis') {
        var dir = new THREE.Vector3().subVectors(c.points[1], c.points[0]);
        if (dir.length() < 0.001) return false;
        dir.normalize();
        c.direction = dir;
        c.origin = c.points[0].clone();
      }
      // Refresh plane basis (anchors are world-space; reproject onto new plane).
      if (c.type === 'plane') c.basis = computePlaneBasis(c);
      return true;
    }

    // -- Rebuild visual for a single constraint (dispose old, build new) --
    function rebuildConstraintVisual(c) {
      if (c.visual) {
        c.visual.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) obj.material.dispose();
        });
        constraintScene.remove(c.visual);
        c.visual = null;
      }
      buildConstraintVisual(c);
    }

    // -- Plane ortho depth slab state --
    var planeOrthoSlab = null;       // the BoxVolume used as depth slab
    var planeOrthoConstraint = null; // which constraint is active for ortho

    // -- Switch to orthographic view aligned to a plane constraint --
    function viewPlaneOrtho(c) {
      if (c.type !== 'plane') return;

      // Switch to orthographic camera mode
      viewer.setCameraMode(Potree.CameraMode.ORTHOGRAPHIC);

      // Position the camera along the plane normal, looking at the centroid.
      // Potree's render loop drives cameras from scene.view (yaw/pitch/position),
      // so we must set view — not camera — properties.
      var normal = c.normal.clone();
      var distance = viewer.scene.view.radius || 50;
      if (distance < 1) distance = 50;

      // Camera position: offset from centroid along the normal
      var camPos = c.centroid.clone().addScaledVector(normal, distance);
      viewer.scene.view.position.copy(camPos);
      viewer.scene.view.lookAt(c.centroid);

      // Create/update depth slab clip box
      planeOrthoConstraint = c;
      createOrUpdateDepthSlab(c, 20, 20);

      // Show depth controls UI
      showDepthControls(c);

      showToast('Ortho view: ' + c.name);
    }

    // -- Create or update the depth slab clip box --
    function createOrUpdateDepthSlab(c, behindMM, frontMM) {
      // Convert mm to scene units (assume metres)
      var behind = behindMM / 1000;
      var front = frontMM / 1000;
      var thickness = behind + front; // total depth
      if (thickness < 0.001) thickness = 0.001;

      // Slab center: offset from plane centroid along normal.
      // "front" is in the normal direction, "behind" is opposite.
      var offset = (front - behind) / 2;
      var center = c.centroid.clone().addScaledVector(c.normal, offset);

      // Orientation: rotate local Y axis to align with plane normal.
      // BoxVolume is a unit cube; scale.y controls thickness along local Y.
      var quat = new THREE.Quaternion().setFromUnitVectors(
        new THREE.Vector3(0, 1, 0), c.normal
      );

      // Lateral size: huge so it doesn't clip laterally
      var lateralSize = 10000;

      if (!planeOrthoSlab) {
        planeOrthoSlab = new Potree.BoxVolume();
        planeOrthoSlab.clip = true;
        planeOrthoSlab.name = 'Plane Depth Slab';
        planeOrthoSlab.visible = true;
        planeOrthoSlab.userData = planeOrthoSlab.userData || {};
        planeOrthoSlab.userData.persistent = true;
        planeOrthoSlab.userData.isDepthSlab = true;
        // Hide the green box visual
        planeOrthoSlab.box.visible = false;
        planeOrthoSlab.frame.visible = false;
        if (planeOrthoSlab.label) planeOrthoSlab.label.visible = false;

        viewer.scene.addVolume(planeOrthoSlab);
        // Switch to INSIDE_ALL so both the main crop box and slab must pass
        viewer.setClipMethod(Potree.ClipMethod.INSIDE_ALL);
      }

      planeOrthoSlab.position.copy(center);
      planeOrthoSlab.quaternion.copy(quat);
      planeOrthoSlab.scale.set(lateralSize, thickness, lateralSize);
      planeOrthoSlab.updateMatrixWorld(true);
      if (typeof planeOrthoSlab.update === 'function') planeOrthoSlab.update();
    }

    // -- Remove the depth slab and restore clip method --
    function removeDepthSlab() {
      if (planeOrthoSlab) {
        // Temporarily allow removal of our persistent slab
        planeOrthoSlab.userData.persistent = false;
        viewer.scene.removeVolume(planeOrthoSlab);
        planeOrthoSlab = null;
      }
      planeOrthoConstraint = null;
      // Restore to INSIDE_ANY (original mode)
      viewer.setClipMethod(Potree.ClipMethod.INSIDE_ANY);
      hideDepthControls();
    }

    // -- Show depth controls UI in sidebar --
    function showDepthControls(c) {
      hideDepthControls();
      var container = document.getElementById('enable-constraint-list');
      if (!container) return;

      var div = document.createElement('div');
      div.id = 'enable-plane-depth-controls';

      div.innerHTML =
        '<div class="depth-title">\u2316 ' + c.name + ' \u2014 Depth Slab</div>' +
        '<div class="depth-row">' +
          '<label>Behind:</label>' +
          '<input type="number" id="depth-behind" value="20" step="5" min="0">' +
          '<span class="unit">mm</span>' +
        '</div>' +
        '<div class="depth-row">' +
          '<label>In front:</label>' +
          '<input type="number" id="depth-front" value="20" step="5" min="0">' +
          '<span class="unit">mm</span>' +
        '</div>' +
        '<button id="btn-exit-plane-ortho">Exit Plane View</button>';

      container.parentNode.insertBefore(div, container.nextSibling);

      // Wire up live updating
      var behindInput = document.getElementById('depth-behind');
      var frontInput = document.getElementById('depth-front');

      function onDepthChange() {
        var behind = parseFloat(behindInput.value) || 0;
        var front = parseFloat(frontInput.value) || 0;
        if (behind < 0) behind = 0;
        if (front < 0) front = 0;
        if (planeOrthoConstraint) {
          createOrUpdateDepthSlab(planeOrthoConstraint, behind, front);
        }
      }
      behindInput.addEventListener('input', onDepthChange);
      frontInput.addEventListener('input', onDepthChange);

      document.getElementById('btn-exit-plane-ortho').addEventListener('click', function() {
        exitPlaneOrtho();
      });
    }

    // -- Hide depth controls UI --
    function hideDepthControls() {
      var el = document.getElementById('enable-plane-depth-controls');
      if (el) el.remove();
    }

    // -- Exit plane ortho mode: remove slab, switch back to perspective --
    function exitPlaneOrtho() {
      removeDepthSlab();
      viewer.setCameraMode(Potree.CameraMode.PERSPECTIVE);
      showToast('Exited plane view');
    }

    // ===== MEMBER SKETCHING FUNCTIONS =====

    // -- Start member pick mode --
    function startMemberPick() {
      if (MARK_MODE) toggleMarkMode(true);
      if (constraintPickMode) cancelConstraintPick();
      memberPickMode = true;
      memberPickPoints = [];
      clearMemberPickMarkers();
      _ensureMemberPreviewSphere();
      document.body.classList.add('member-pick-mode');
      showToast('Pick endpoint (1/2) for member', 5000);
      var btn = document.getElementById('btn-add-member');
      if (btn) btn.classList.add('active');
    }

    // -- Handle a picked point during member definition --
    function handleMemberPick(position) {
      memberPickPoints.push(position.clone());
      placeMemberPickMarker(position);
      undoStack.push({ type: 'member-point' });
      if (memberPickPoints.length < 2) {
        _startMemberRubberLine(position);
        showToast('Pick endpoint (2/2) for member', 5000);
      } else {
        finalizeMember();
      }
    }

    // -- Cancel member pick mode --
    function cancelMemberPick() {
      memberPickMode = false;
      memberPickPoints = [];
      clearMemberPickMarkers();
      clearMemberPreview();
      document.body.classList.remove('member-pick-mode');
      var btn = document.getElementById('btn-add-member');
      if (btn) btn.classList.remove('active');
      showToast('Member picking cancelled');
    }

    // -- Place temporary orange marker during member picking --
    function placeMemberPickMarker(position) {
      var ptGroup = new THREE.Group();
      ptGroup.position.copy(position);
      ptGroup.userData.isMemberPickMarker = true;
      var sphGeo = new THREE.SphereGeometry(0.4, 12, 12);
      var sphMat = new THREE.MeshBasicMaterial({
        color: 0xff9900, depthTest: false, depthWrite: false
      });
      var sphMesh = new THREE.Mesh(sphGeo, sphMat);
      sphMesh.userData.isMarkerSphere = true;
      ptGroup.add(sphMesh);
      memberScene.add(ptGroup);
      memberPickMarkers.push(ptGroup);
    }

    // -- Remove temporary member pick markers --
    function clearMemberPickMarkers() {
      for (var i = 0; i < memberPickMarkers.length; i++) {
        var m = memberPickMarkers[i];
        m.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) obj.material.dispose();
        });
        memberScene.remove(m);
      }
      memberPickMarkers.length = 0;
    }

    // -- Rubber-band preview during member picking (mirrors the constraint
    //    X-axis rubber line): an orange sphere follows the cursor's snapped
    //    pick, and once the first endpoint is down a line stretches from it to
    //    the cursor — matching the dimension tool's live feedback. --
    var _memberPreviewSphere = null;
    var _memberRubberLine = null;
    function _ensureMemberPreviewSphere() {
      if (_memberPreviewSphere) return;
      _memberPreviewSphere = _makePreviewSphere(0xff9900);
      memberScene.add(_memberPreviewSphere);
    }
    function _startMemberRubberLine(position) {
      _clearMemberRubberLine();
      var rbGeo = new THREE.BufferGeometry();
      rbGeo.setAttribute('position', new THREE.Float32BufferAttribute([
        position.x, position.y, position.z,
        position.x, position.y, position.z
      ], 3));
      var rbMat = new THREE.LineBasicMaterial({
        color: 0xff9900, depthTest: false, depthWrite: false, transparent: true, opacity: 0.95
      });
      _memberRubberLine = new THREE.Line(rbGeo, rbMat);
      _memberRubberLine.renderOrder = 1;
      memberScene.add(_memberRubberLine);
    }
    function _clearMemberRubberLine() {
      if (!_memberRubberLine) return;
      memberScene.remove(_memberRubberLine);
      if (_memberRubberLine.geometry) _memberRubberLine.geometry.dispose();
      if (_memberRubberLine.material) _memberRubberLine.material.dispose();
      _memberRubberLine = null;
    }
    function clearMemberPreview() {
      _disposePreviewSphere(_memberPreviewSphere, memberScene);
      _memberPreviewSphere = null;
      _clearMemberRubberLine();
    }
    // Update the member preview each mousemove. Uses the SAME pick + snap path
    // as actual placement (patched picker + findSnapTarget @ 18px), so the
    // preview lands exactly where the click will.
    function _updateMemberPreview(e) {
      if (!memberPickMode) return;
      var rect = renderArea.getBoundingClientRect();
      var mouse = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      var cam = viewer.scene.getActiveCamera();
      var pick = Potree.Utils.getMousePointCloudIntersection(mouse, cam, viewer, viewer.scene.pointclouds, { pickClipped: true });
      var loc = (pick && pick.location) ? pick.location.clone() : null;
      if (loc) {
        var snap = findSnapTarget(mouse, SNAP_THRESHOLD_MEMBER);
        if (snap) loc = snap.position.clone();
      }
      if (_memberPreviewSphere) {
        if (loc) { _memberPreviewSphere.position.copy(loc); _memberPreviewSphere.visible = true; }
        else { _memberPreviewSphere.visible = false; }
      }
      if (_memberRubberLine && memberPickPoints.length === 1 && loc) {
        var attr = _memberRubberLine.geometry.attributes.position;
        attr.setXYZ(1, loc.x, loc.y, loc.z);
        attr.needsUpdate = true;
      }
    }

    // -- Finalize member from 2 picked points --
    function finalizeMember() {
      clearMemberPickMarkers();
      clearMemberPreview();
      var member = {
        id: nextMemberId++,
        name: 'M' + (nextMemberId - 1),
        points: [memberPickPoints[0].clone(), memberPickPoints[1].clone()],
        visual: null,
        visible: true,
        locked: false
      };
      buildMemberVisual(member);
      members.push(member);
      rebuildMemberList();
      // Replace member-point undo entries with a single member entry
      while (undoStack.length > 0 && undoStack[undoStack.length - 1].type === 'member-point') {
        undoStack.pop();
      }
      undoStack.push({ type: 'member', id: member.id });
      showToast(member.name + ' created');

      memberPickMode = false;
      memberPickPoints = [];
      document.body.classList.remove('member-pick-mode');
      var btn = document.getElementById('btn-add-member');
      if (btn) btn.classList.remove('active');
    }

    // -- Create a label sprite with text --
    function createLabelSprite(text, position) {
      var canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 64;
      var ctx = canvas.getContext('2d');
      ctx.font = 'bold 36px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 64, 32);
      var texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      var mat = new THREE.SpriteMaterial({
        map: texture, depthTest: false, depthWrite: false,
        transparent: true, sizeAttenuation: false
      });
      var sprite = new THREE.Sprite(mat);
      sprite.position.copy(position);
      sprite.scale.set(0.08, 0.04, 1);
      sprite.userData.isMemberLabel = true;
      return sprite;
    }

    // -- Build 3D visual for a member --
    function buildMemberVisual(member) {
      var group = new THREE.Group();
      group.name = 'member-' + member.id;

      // Line between endpoints
      var lineGeo = new THREE.BufferGeometry().setFromPoints(member.points);
      var lineMat = new THREE.LineBasicMaterial({
        color: 0xff9900, depthTest: false, depthWrite: false,
        transparent: true, opacity: 0.9, linewidth: 2
      });
      group.add(new THREE.Line(lineGeo, lineMat));

      // Endpoint markers: solid orange sphere, fixed screen-pixel size.
      for (var k = 0; k < 2; k++) {
        var ptGroup = new THREE.Group();
        ptGroup.position.copy(member.points[k]);
        ptGroup.userData.isMemberEndpoint = true;
        ptGroup.userData.pointIndex = k;
        var epGeo = new THREE.SphereGeometry(0.4, 12, 12);
        var epMat = new THREE.MeshBasicMaterial({
          color: 0xff9900, depthTest: false, depthWrite: false
        });
        var epMesh = new THREE.Mesh(epGeo, epMat);
        epMesh.userData.isMarkerSphere = true;
        ptGroup.add(epMesh);
        group.add(ptGroup);
      }

      // Label sprite at midpoint
      var midpoint = new THREE.Vector3().addVectors(member.points[0], member.points[1]).multiplyScalar(0.5);
      var label = createLabelSprite(member.name, midpoint);
      group.add(label);

      member.visual = group;
      if (member.visible === false) group.visible = false;
      memberScene.add(group);
    }

    // -- Rebuild visual for a member (dispose old, build new) --
    function recomputeMemberVisual(m) {
      if (m.visual) {
        m.visual.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            if (obj.material.map) obj.material.map.dispose();
            obj.material.dispose();
          }
        });
        memberScene.remove(m.visual);
        m.visual = null;
      }
      buildMemberVisual(m);
    }

    // -- Rebuild member sidebar list --
    function rebuildMemberList() {
      var listEl = document.getElementById('enable-member-list');
      if (!listEl) return;
      listEl.innerHTML = '';
      _appendDeleteAll(listEl, members.length, 'members', clearAllMembers);

      for (var mi = 0; mi < members.length; mi++) {
        (function(m) {
          var row = document.createElement('div');
          row.className = 'member-row';

          var nameSpan = document.createElement('span');
          nameSpan.className = 'member-name';
          nameSpan.textContent = m.name;
          nameSpan.title = 'Click to rename';
          nameSpan.addEventListener('click', function() {
            var input = document.createElement('input');
            input.type = 'text';
            input.value = m.name;
            input.style.cssText = 'width:60px;font:12px/1.3 sans-serif;background:#333;color:#fff;border:1px solid #666;border-radius:2px;padding:1px 3px;';
            nameSpan.replaceWith(input);
            input.focus();
            input.select();
            function commit() {
              var val = input.value.trim();
              if (val && val !== m.name) {
                m.name = val;
                recomputeMemberVisual(m);
              }
              rebuildMemberList();
            }
            input.addEventListener('blur', commit);
            input.addEventListener('keydown', function(ev) {
              if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
              if (ev.key === 'Escape') { ev.preventDefault(); rebuildMemberList(); }
            });
          });
          row.appendChild(nameSpan);

          var visBtn = document.createElement('button');
          visBtn.className = 'btn-vis' + (m.visible === false ? ' hidden' : '');
          visBtn.textContent = '\uD83D\uDC41';
          visBtn.title = 'Toggle visibility';
          visBtn.addEventListener('click', function() {
            m.visible = !m.visible;
            if (m.visual) m.visual.visible = m.visible;
            visBtn.classList.toggle('hidden', !m.visible);
          });
          row.appendChild(visBtn);

          var lockBtn = document.createElement('button');
          lockBtn.className = 'btn-lock' + (m.locked ? ' locked' : '');
          lockBtn.textContent = m.locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
          lockBtn.title = m.locked ? 'Unlock to move' : 'Lock position';
          lockBtn.addEventListener('click', function() {
            m.locked = !m.locked;
            lockBtn.textContent = m.locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
            lockBtn.title = m.locked ? 'Unlock to move' : 'Lock position';
            lockBtn.classList.toggle('locked', m.locked);
          });
          row.appendChild(lockBtn);

          var deleteBtn = document.createElement('button');
          deleteBtn.textContent = '\u00d7';
          deleteBtn.title = 'Delete member';
          deleteBtn.addEventListener('click', function() {
            deleteMember(m.id);
          });
          row.appendChild(deleteBtn);

          listEl.appendChild(row);
        })(members[mi]);
      }
    }

    // -- Delete a member --
    function deleteMember(id) {
      var idx = -1;
      for (var i = 0; i < members.length; i++) {
        if (members[i].id === id) { idx = i; break; }
      }
      if (idx === -1) return;
      var m = members[idx];
      if (m.visual) {
        m.visual.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            if (obj.material.map) obj.material.map.dispose();
            obj.material.dispose();
          }
        });
        memberScene.remove(m.visual);
      }
      members.splice(idx, 1);
      rebuildMemberList();
    }

    // -- Find nearest member endpoint to mouse (screen-space hit test) --
    function findNearestMemberEndpoint(mousePixel) {
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = 14;
      var bestResult = null;
      for (var mi = 0; mi < members.length; mi++) {
        var m = members[mi];
        if (!m.visible || m.locked) continue;
        for (var pi = 0; pi < m.points.length; pi++) {
          var pt = m.points[pi].clone().project(camera);
          var screenX = (pt.x * 0.5 + 0.5) * rect.width;
          var screenY = (1 - (pt.y * 0.5 + 0.5)) * rect.height;
          var dx = screenX - mousePixel.x;
          var dy = screenY - mousePixel.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < bestDist) {
            bestDist = dist;
            bestResult = { member: m, pointIndex: pi };
          }
        }
      }
      return bestResult;
    }

    // -- Find nearest marker (for dragging — skips locked markers) --
    function findNearestMarker(mousePixel) {
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = 14;
      var bestResult = null;
      for (var i = 0; i < markedPoints.length; i++) {
        var m = markedPoints[i];
        if (m.locked || !m.visible) continue;
        var pt = m.visual.position.clone().project(camera);
        var screenX = (pt.x * 0.5 + 0.5) * rect.width;
        var screenY = (1 - (pt.y * 0.5 + 0.5)) * rect.height;
        var dx = screenX - mousePixel.x;
        var dy = screenY - mousePixel.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < bestDist) {
          bestDist = dist;
          bestResult = { mark: m, index: i };
        }
      }
      return bestResult;
    }

    // -- Find nearest Potree measurement sphere within ~18 px of mousePixel.
    // Mirrors chrome.js findDraggableSphereAt (used by the touch path). The
