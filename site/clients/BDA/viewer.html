<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Enable Viewer</title>

  <!-- ===================== CSS ===================== -->
  <link rel="stylesheet" href="../libs/potree/potree.css">
  <link rel="stylesheet" href="../libs/jquery-ui/jquery-ui.min.css">
  <link rel="stylesheet" href="../libs/spectrum/spectrum.css">
  <link rel="stylesheet" href="../libs/jstree/themes/mixed/style.css">
  <link rel="stylesheet" href="./custom.css">
  <link rel="stylesheet" href="./chrome.css">

  <style>
    /* Layout */
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #0f1318;
    }
    .potree_container { position: absolute; inset: 0; }
    #potree_render_area, #potree_sidebar_container { position: absolute; top: 0; bottom: 0; }

    /* Your widths (unchanged) */
    #potree_render_area       { left: 320px; right: 0; }
    #potree_sidebar_container { left: 0; right: auto; width: 320px; overflow-y: auto; }

    /* Sidebar logo header */
    #potree_sidebar_container::before{
      content:"";
      display:block;
      height:84px;
      margin:12px 12px 8px;
      background-image:url("../EnableLogo.png");
      background-repeat:no-repeat;
      background-position:center;
      background-size:contain;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    /* Hide all native Potree menu panels — our custom groups replace them */
    #potree_menu > h3,
    #potree_menu > div:not(#enable-sidebar-groups) {
      display: none !important;
    }

    /* Hide map UI completely */
    #potree_toggle_map, .potree_toggle_map, .mapToggle,
    #menu_map, #map, #potree_map_container,
    .ol-viewport, .ol-overlaycontainer { display: none !important; }

    /* (Potree's native About/Appearance/Scene/Tools sections all hidden by the
       #potree_menu > h3 / > div:not(#enable-sidebar-groups) rule above) */

    /* Navigation section layout */
    #enable-nav-slot #navigation { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
    #enable-nav-slot #navigation .button-icon { width: 26px; height: 26px; cursor: pointer; opacity: 0.7; transition: opacity 0.15s; }
    #enable-nav-slot #navigation .button-icon:hover { opacity: 1; }
    /* Camera projection selectgroup on its own line */
    #enable-nav-slot #navigation #camera_projection_options { width: 100%; }
    #enable-nav-slot li { list-style: none; }

    /* Slightly tighter sidebar spacing */
    #potree_sidebar_container .accordion > div { padding: 6px 10px; }

    /* ===== Mark mode cursor ===== */
    body.mark-mode #potree_render_area { cursor: crosshair !important; }
    body.mark-mode #potree_render_area canvas { cursor: crosshair !important; }

    /* ===== Mark tool buttons ===== */
    #enable-mark-buttons { margin: 6px 0; display: flex; gap: 6px; }
    #enable-mark-buttons button {
      flex: 1; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-mark-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }
    #enable-mark-buttons button.active {
      background: var(--accent, #4db6ff) !important;
      color: #000 !important; border-color: var(--accent, #4db6ff) !important;
    }

    /* ===== Mark list rows ===== */
    .mark-row {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 6px; border-radius: 3px; margin: 2px 0;
      font: 12px/1.3 sans-serif; color: var(--sidebar-text, #fbfbfb);
      background: rgba(255,255,255,0.05);
    }
    .mark-row .mark-name {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .mark-row button {
      padding: 2px 6px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .mark-row button:hover { outline: 1px solid var(--accent, #4db6ff); }
    .mark-row .btn-lock.locked { opacity: 1; background: rgba(255,165,0,0.3); }
    .mark-row .btn-vis.hidden { opacity: 0.35; }

    /* ===== Toast notification ===== */
    #enable-toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: #fff; padding: 8px 20px;
      border-radius: 6px; font: 14px/1.4 sans-serif; z-index: 99999;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    #enable-toast.show { opacity: 1; }

    /* ===== Constraint tool cursor ===== */
    body.constraint-pick-mode #potree_render_area { cursor: crosshair !important; }
    body.constraint-pick-mode #potree_render_area canvas { cursor: crosshair !important; }

    /* ===== Constraint tool buttons ===== */
    #enable-constraint-buttons { margin: 6px 0; display: flex; gap: 6px; }
    #enable-constraint-buttons button {
      flex: 1; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-constraint-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }
    #enable-constraint-buttons button.active {
      background: var(--accent, #4db6ff) !important;
      color: #000 !important; border-color: var(--accent, #4db6ff) !important;
    }

    /* ===== Constraint list ===== */
    #enable-constraint-list { margin: 4px 0; }
    .constraint-row {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 6px; border-radius: 3px; margin: 2px 0;
      font: 12px/1.3 sans-serif; color: var(--sidebar-text, #fbfbfb);
      background: rgba(255,255,255,0.05);
    }
    .constraint-row.active { background: rgba(57,255,20,0.15); }
    .constraint-row .constraint-name {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .constraint-row button {
      padding: 2px 6px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .constraint-row button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Constraint status ===== */
    #enable-constraint-status {
      font: 12px/1.3 sans-serif; color: #39ff14;
      margin: 4px 0; min-height: 16px;
    }

    /* ===== Constraint drag cursor ===== */
    body.constraint-drag #potree_render_area { cursor: grabbing !important; }
    body.constraint-drag #potree_render_area canvas { cursor: grabbing !important; }

    /* ===== Constraint visibility toggle ===== */
    .constraint-row .btn-vis {
      padding: 2px 5px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .constraint-row .btn-vis:hover { outline: 1px solid var(--accent, #4db6ff); }
    .constraint-row .btn-vis.hidden { opacity: 0.35; }
    .constraint-row .btn-lock {
      padding: 2px 5px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .constraint-row .btn-lock:hover { outline: 1px solid var(--accent, #4db6ff); }
    .constraint-row .btn-lock.locked { opacity: 1; background: rgba(255,165,0,0.3); }
    .constraint-row .btn-ortho {
      padding: 2px 5px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .constraint-row .btn-ortho:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Plane ortho depth slab controls ===== */
    #enable-plane-depth-controls {
      margin: 4px 0; padding: 6px 8px; border-radius: 4px;
      background: rgba(57,255,20,0.08); border: 1px solid rgba(57,255,20,0.2);
      font: 12px/1.4 sans-serif; color: var(--sidebar-text, #fbfbfb);
    }
    #enable-plane-depth-controls .depth-title {
      font-weight: 600; font-size: 11px; color: #39ff14; margin-bottom: 4px;
    }
    #enable-plane-depth-controls .depth-row {
      display: flex; align-items: center; gap: 6px; margin: 3px 0;
    }
    #enable-plane-depth-controls .depth-row label {
      min-width: 50px; font-size: 11px; color: var(--muted, #9aa3b2);
    }
    #enable-plane-depth-controls .depth-row input[type="number"] {
      width: 70px; padding: 2px 4px; border: 1px solid var(--border, #555);
      border-radius: 3px; background: #333; color: #fff; font: 12px/1.3 sans-serif;
    }
    #enable-plane-depth-controls .depth-row span.unit { font-size: 11px; color: var(--muted, #9aa3b2); }
    #enable-plane-depth-controls button {
      margin-top: 4px; padding: 3px 10px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    #enable-plane-depth-controls button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Member tool cursor ===== */
    body.member-pick-mode #potree_render_area { cursor: crosshair !important; }
    body.member-pick-mode #potree_render_area canvas { cursor: crosshair !important; }

    /* ===== Member buttons ===== */
    #enable-member-buttons { margin: 6px 0; display: flex; gap: 6px; }
    #enable-member-buttons button {
      flex: 1; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-member-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }
    #enable-member-buttons button.active {
      background: var(--accent, #4db6ff) !important;
      color: #000 !important; border-color: var(--accent, #4db6ff) !important;
    }

    /* ===== Member list ===== */
    #enable-member-list { margin: 4px 0; }
    .member-row {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 6px; border-radius: 3px; margin: 2px 0;
      font: 12px/1.3 sans-serif; color: var(--sidebar-text, #fbfbfb);
      background: rgba(255,255,255,0.05);
    }
    .member-row .member-name {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      cursor: pointer;
    }
    .member-row .member-name:hover { text-decoration: underline; }
    .member-row button {
      padding: 2px 6px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .member-row button:hover { outline: 1px solid var(--accent, #4db6ff); }
    .member-row .btn-vis.hidden { opacity: 0.35; }

    /* ===== Member drag cursor ===== */
    body.member-drag #potree_render_area { cursor: grabbing !important; }
    body.member-drag #potree_render_area canvas { cursor: grabbing !important; }

    /* ===== DXF export button ===== */
    #enable-member-buttons-export { margin: 4px 0; }
    #enable-member-buttons-export button {
      width: 100%; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-member-buttons-export button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Sidebar license footer (inline, bottom of sidebar) ===== */
    #enable-license-footer {
      padding: 10px 12px 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font: 10px/1.5 sans-serif;
      color: rgba(251,251,251,0.3);
    }
    #enable-license-footer a {
      color: rgba(251,251,251,0.4);
      text-decoration: none;
    }
    #enable-license-footer a:hover {
      color: rgba(251,251,251,0.65);
      text-decoration: underline;
    }

    /* ===== Session save/load buttons ===== */
    #enable-session-buttons { margin: 6px 0; display: flex; gap: 6px; }
    #enable-session-buttons button {
      flex: 1; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-session-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Elevation map buttons ===== */
    #enable-elevation-buttons { margin: 6px 0; display: flex; gap: 6px; flex-wrap: wrap; }
    #enable-elevation-buttons button {
      flex: 1; min-width: 80px; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-elevation-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }
    #enable-elevation-export { margin: 8px 0 2px; }
    #enable-elevation-export button {
      width: 100%; padding: 6px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-elevation-export button:hover { outline: 1px solid var(--accent, #4db6ff); }
    body.hold-grabbing, body.hold-grabbing * { cursor: grabbing !important; }
    #enable-elevation-buttons button.clip-btn.active {
      background: #555; outline: 2px solid var(--accent, #3EAD4A);
      pointer-events: none; opacity: 0.7;
    }
    #enable-elevation-range { margin: 4px 0; display: flex; gap: 6px; align-items: center; font: 12px/1.3 sans-serif; color: var(--sidebar-text, #fbfbfb); }
    #enable-elevation-range input[type="number"] {
      width: 60px; padding: 3px 5px; border: 1px solid var(--border, #333);
      border-radius: 3px; background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      font: 12px sans-serif;
    }
    #enable-elevation-range button {
      padding: 3px 8px; border: 1px solid var(--border, #333);
      border-radius: 3px; font: 12px sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    #enable-elevation-status { font: 11px/1.3 sans-serif; color: rgba(251,251,251,0.5); margin: 2px 0; min-height: 14px; }
    /* Compute progress overlay — visible during heavy computation */
    #enable-compute-overlay {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(20, 20, 20, 0.92); color: #fff;
      border: 1px solid var(--accent, #3EAD4A); border-radius: 6px;
      padding: 16px 28px; min-width: 280px;
      font: 13px/1.4 sans-serif; z-index: 100000;
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
      display: none;
    }
    #enable-compute-overlay.show { display: block; }
    #enable-compute-overlay .compute-title { font-weight: 700; margin-bottom: 8px; color: var(--accent, #3EAD4A); }
    #enable-compute-overlay .compute-status { font-size: 12px; color: #ddd; margin-bottom: 10px; }
    #enable-compute-overlay .compute-bar {
      width: 100%; height: 6px; background: rgba(255,255,255,0.1);
      border-radius: 3px; overflow: hidden; position: relative;
    }
    /* transform-only animation runs on the compositor thread, so it keeps
       moving even when the main thread is busy with heavy compute. */
    #enable-compute-overlay .compute-bar-fill {
      position: absolute; top: 0; left: 0; height: 100%;
      width: 30%; background: var(--accent, #3EAD4A);
      border-radius: 3px;
      transform: translateX(-100%);
      animation: compute-bar-slide 1.4s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes compute-bar-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(450%); }
    }
    #enable-contour-interval { margin: 4px 0; display: flex; gap: 6px; align-items: center; font: 12px/1.3 sans-serif; color: var(--sidebar-text, #fbfbfb); }
    #enable-contour-interval input[type="number"] {
      width: 65px; padding: 3px 5px; border: 1px solid var(--border, #333);
      border-radius: 3px; background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      font: 12px sans-serif;
    }
    #enable-contour-interval button {
      padding: 3px 8px; border: 1px solid var(--border, #333);
      border-radius: 3px; font: 12px sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    #heatmap-legend {
      display: none; position: fixed; top: 10px; right: 20px; z-index: 200;
      pointer-events: none;
    }

    /* Panorama modal */
    #station-panorama-modal {
      position: fixed; inset: 0; z-index: 100001;
      background: rgba(0, 0, 0, 0.92);
      display: none;
    }
    #station-panorama-modal.show { display: block; }
    #station-panorama-modal #spm-canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      cursor: grab; display: block;
    }
    #station-panorama-modal #spm-canvas.grabbing { cursor: grabbing; }
    #station-panorama-modal .spm-header {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0));
      pointer-events: none;
    }
    #station-panorama-modal .spm-title {
      color: #fff; font: 600 14px sans-serif; flex: 1;
    }
    #station-panorama-modal .spm-close {
      pointer-events: auto;
      background: rgba(0,0,0,0.5); color: #fff;
      border: 1px solid rgba(255,255,255,0.3); border-radius: 4px;
      width: 32px; height: 32px; cursor: pointer;
      font: 18px/1 sans-serif; padding: 0;
    }
    #station-panorama-modal .spm-close:hover {
      background: rgba(255,255,255,0.15); border-color: #fff;
    }
    #station-panorama-modal .spm-hint {
      position: absolute; bottom: 16px; left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.6); font: 11px sans-serif;
      background: rgba(0,0,0,0.5); padding: 4px 12px; border-radius: 12px;
      pointer-events: none;
    }


    /* ===== Measurement panel overrides ===== */
    /* Hide native raw XYZ + native distance table in measurement panel */
    .measurement_content .coordinates_table_container,
    .measurement_content .coordinates_table_container + br,
    .measurement_content #distances_table { display: none !important; }

    /* ===== Persistent measurement list ===== */
    #enable-measurement-list,
    #enable-area-list,
    #enable-angle-list,
    #enable-volume-list { margin: 4px 0; }
    .enable-list-section-label {
      font: bold 11px/1.3 sans-serif;
      color: var(--muted, #9aa3b2);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 8px 0 2px 0;
    }
    .enable-meas-points {
      display: flex; flex-wrap: wrap; gap: 3px;
      margin: 3px 0; font: 11px/1.3 sans-serif;
    }
    .enable-meas-points .point-chip {
      display: inline-flex; align-items: center; gap: 1px;
      padding: 1px 3px 1px 5px; border-radius: 3px;
      background: rgba(255,255,255,0.06);
      color: var(--sidebar-text, #fbfbfb);
    }
    .enable-meas-points .point-chip button {
      background: none; border: none; color: #f88;
      font: 13px/1 sans-serif; cursor: pointer; padding: 0 3px;
    }
    .enable-meas-points .point-chip button:hover {
      color: #fff; background: rgba(255,68,68,0.35); border-radius: 2px;
    }
    .enable-meas-item {
      padding: 4px 6px; border-radius: 3px; margin: 3px 0;
      font: 12px/1.3 sans-serif; color: var(--sidebar-text, #fbfbfb);
      background: rgba(255,255,255,0.05);
    }
    .enable-meas-item .meas-header {
      display: flex; align-items: center; gap: 4px; margin-bottom: 2px;
    }
    .enable-meas-item .meas-title { flex: 1; font-weight: 600; font-size: 11px; color: var(--muted,#9aa3b2); }
    .enable-meas-item .meas-delete {
      padding: 1px 5px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .enable-meas-item .meas-delete:hover { outline: 1px solid var(--accent, #4db6ff); }
    .enable-meas-seg {
      display: flex; gap: 6px; padding: 1px 0; font-variant-numeric: tabular-nums;
    }
    .enable-meas-seg .seg-name { white-space: nowrap; font-weight: 500; min-width: 56px; }
    .enable-meas-seg .seg-vals { color: rgba(251,251,251,0.7); }
    .enable-meas-seg.seg-total { border-top: 1px solid rgba(255,255,255,0.15); padding-top: 3px; margin-top: 2px; font-weight: 700; }

    /* Export all measurements button */
    #enable-measurement-buttons-export { margin: 4px 0; }
    #enable-measurement-buttons-export button {
      width: 100%; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-measurement-buttons-export button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Collapsible sidebar groups ===== */
    .enable-group {
      margin: 0; border-top: 1px solid rgba(255,255,255,0.08);
    }
    .enable-group:first-child { border-top: none; }
    .enable-group-header {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 10px; cursor: pointer; user-select: none;
      font: bold 13px/1.3 sans-serif; color: var(--sidebar-text, #fbfbfb);
      background: rgba(255,255,255,0.03);
      transition: background 0.15s;
    }
    .enable-group-header:hover { background: rgba(255,255,255,0.07); }
    .enable-group-header::before {
      content: '\25B6'; /* right-pointing triangle */
      display: inline-block; font-size: 9px; transition: transform 0.2s;
      width: 12px; text-align: center; flex-shrink: 0;
    }
    .enable-group.expanded > .enable-group-header::before {
      transform: rotate(90deg);
    }
    .enable-group-body {
      overflow: hidden; max-height: 0;
      transition: max-height 0.3s ease-out;
      padding: 0 10px;
    }
    .enable-group.expanded > .enable-group-body {
      max-height: 2000px; /* large enough for any content */
      overflow-x: hidden;
      overflow-y: visible;
      padding: 4px 10px 8px;
      transition: max-height 0.4s ease-in;
    }

    /* Potree elements inside groups: prevent overflow */
    .enable-group-body li { list-style: none; }

    /* ===== Global crop / cutout buttons (reuse elevation button style) ===== */
    #enable-global-crop-buttons { margin: 6px 0; display: flex; gap: 6px; flex-wrap: wrap; }
    #enable-global-crop-buttons button {
      flex: 1; min-width: 80px; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-global-crop-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Exclusion box buttons ===== */
    #enable-exclusion-buttons { margin: 6px 0; display: flex; gap: 6px; flex-wrap: wrap; }
    #enable-exclusion-buttons button {
      flex: 1; min-width: 80px; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-exclusion-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Elevation compute buttons ===== */
    #enable-elevation-compute { margin: 6px 0; display: flex; gap: 6px; flex-wrap: wrap; }
    #enable-elevation-compute button {
      flex: 1; min-width: 80px; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-elevation-compute button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Elevation contour buttons ===== */
    #enable-contour-buttons { margin: 6px 0; display: flex; gap: 6px; flex-wrap: wrap; }
    #enable-contour-buttons button {
      flex: 1; min-width: 80px; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;

      transition: outline 0.15s;
    }
    #enable-contour-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* Sub-section labels within groups */

      font: 600 11px/1.3 sans-serif; color: var(--muted, #9aa3b2);
      margin: 8px 0 2px; text-transform: uppercase; letter-spacing: 0.5px;
    }
  </style>

<body>

  <!-- ===================== VENDOR + POTREE JS (order matters) ===================== -->
  <script src="../libs/jquery/jquery-3.1.1.min.js"></script>

  <script src="../libs/three/build/three.min.js"></script>
  <script src="../libs/potree/potree.js"></script>
