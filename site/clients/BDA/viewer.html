  <script src="../libs/plasio/js/laslaz.js"></script>

  <!-- Per-client project registry -->
  <script src="projects.js"></script>

  <!-- ===================== FIREBASE (auth gate + cloud sessions) ===================== -->
  <link rel="stylesheet" href="../libs/firebase/login-overlay.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../libs/firebase/firebase-config.js"></script>
  <script src="../libs/firebase/enable-firebase.js"></script>

  <!-- ===================== APP ===================== -->
  <script>
  (function () {
    // ===================== UNITS =====================
    // World units are METRES. Every measurement readout routes through these
    // formatters so the top-right units switch changes EVERYTHING. Default: mm.
    var UNIT_MODE = 'mm';                       // 'mm' | 'imp-frac' | 'imp-dec'
    var M_TO_IN = 39.37007874015748;
    function _reduceFrac(n, d) { while (n > 0 && (n & 1) === 0) { n >>= 1; d >>= 1; } return [n, d]; }
    // Length (metres) -> display string WITH unit, in the current mode.
    function fmtLen(meters) {
      if (meters == null || isNaN(meters)) return '—';
      var neg = meters < 0, m = Math.abs(meters);
      if (UNIT_MODE === 'mm') return (neg ? '-' : '') + m.toFixed(3) + ' m';   // metric: metres to the mm
      var totalIn = m * M_TO_IN;
      if (UNIT_MODE === 'imp-dec') {
        totalIn = Math.round(totalIn / 0.05) * 0.05;
        var ft = Math.floor(totalIn / 12), inch = totalIn - ft * 12;
        return (neg ? '-' : '') + (ft > 0 ? ft + "' " : '') + inch.toFixed(2) + '"';
      }
      // imperial fractional to 1/16"
      var six = Math.round(totalIn * 16);
      var ftF = Math.floor(six / 192), rem = six - ftF * 192;
      var whole = Math.floor(rem / 16), frac = rem - whole * 16;
      var s = (neg ? '-' : '') + (ftF > 0 ? ftF + "' " : '');
      if (frac === 0) s += whole + '"';
      else { var rf = _reduceFrac(frac, 16); s += (whole > 0 ? whole + ' ' : '') + rf[0] + '/' + rf[1] + '"'; }
      return s;
    }
    function fmtArea(m2) {
      if (m2 == null || isNaN(m2)) return '—';
      return UNIT_MODE === 'mm' ? m2.toFixed(3) + ' m²' : (m2 * 10.7639104).toFixed(2) + ' ft²';
    }
    function fmtVol(m3) {
      if (m3 == null || isNaN(m3)) return '—';
      return UNIT_MODE === 'mm' ? m3.toFixed(3) + ' m³' : (m3 * 35.3146667).toFixed(2) + ' ft³';
    }
    // Compact value (metric strips the " m" suffix; imperial keeps the ' " marks).
    function fmtLenVal(meters) { var s = fmtLen(meters); return UNIT_MODE === 'mm' ? s.replace(/ m$/, '') : s; }
    function unitTitle() { return UNIT_MODE === 'mm' ? '(m)' : UNIT_MODE === 'imp-dec' ? '(ft-in dec)' : '(ft-in)'; }
    // Length INPUT fields carry a plain decimal in the current input unit
    // (mm mode -> mm, imperial -> decimal inches). Convert to/from metres.
    function inputUnitLabel() { return UNIT_MODE === 'mm' ? 'm' : 'in'; }
    function lenFromInput(val) { var x = parseFloat(val); if (isNaN(x)) return NaN; return UNIT_MODE === 'mm' ? x : x * 0.0254; }
    function lenToInput(meters) { return UNIT_MODE === 'mm' ? meters : meters * M_TO_IN; }
    function lenToInputStr(meters) { if (meters == null || isNaN(meters)) return ''; var v = lenToInput(meters); return UNIT_MODE === 'mm' ? v.toFixed(3) : v.toFixed(2); }
    // Hook consumed by the patched Potree measurement labels (libs/potree.js).
    window.__unitFmt = { len: fmtLen, area: fmtArea, vol: fmtVol };
    function getUnitMode() { return UNIT_MODE; }
    function setUnitMode(mode) {
      if (mode !== 'mm' && mode !== 'imp-frac' && mode !== 'imp-dec') return;
      UNIT_MODE = mode;
      try { refreshUnitsAll(); } catch (e) { console.warn('[units] refresh failed', e); }
    }
    // Re-render every measurement display after a unit change.
    function refreshUnitsAll() {
      try { if (typeof rebuildAllMeasurementLists === 'function') rebuildAllMeasurementLists(); } catch (e) {}
      try { (viewer.scene.measurements || []).forEach(function (m) { if (m && m.update) m.update(); }); } catch (e) {}
      try { if (typeof rebuildElevationBoxList === 'function') rebuildElevationBoxList(); } catch (e) {}
      try { _refreshElevationUnitDisplays(); } catch (e) {}
    }
    // Elevation status text is stored raw so it can be re-rendered on unit change.
    var _lastElevStatus = null;
    function renderElevStatus() {
      if (!_lastElevStatus) return;
      var s = _lastElevStatus;
      try {
        $('#enable-elevation-status').text(
          s.name + ': ' + s.count.toLocaleString() + ' pts | ' + s.label + ': ' +
          fmtLen(s.zMin) + ' to ' + fmtLen(s.zMax) + ' (' + fmtLen(s.zMax - s.zMin) + ')'
        );
      } catch (e) {}
    }
    function _refreshElevationUnitDisplays() {
      try { renderElevStatus(); } catch (e) {}
      try {
        if (elevationActive) {
          if (typeof updateElevationLegend === 'function') updateElevationLegend(elevationZMin, elevationZMax);
          if (typeof buildBoxContours === 'function') {
            elevationCropVolumes.forEach(function (v2) {
              var c = getBoxConfig(v2);
              if (c && c.active && c.contoursVisible) buildBoxContours(v2);
            });
          }
        }
      } catch (e) {}
    }

    // ----- read ?p=<PointCloudID> and lookup in projects.js -----
    const params = new URLSearchParams(location.search);
    const pointCloudID = params.get('p');
    if (!pointCloudID) { alert('Missing ?p=<PointCloudID> in URL'); return; }
    const meta = (window.PROJECTS || {})[pointCloudID];
    if (!meta || !meta.folder) { alert('PointCloudID "' + pointCloudID + '" not found in projects.js'); return; }
    const cloudURL = meta.folder.replace(/\/+$/, '') + '/cloud.js';

    // ----- init Potree viewer -----
    const renderArea = document.getElementById('potree_render_area');
    const viewer = new Potree.Viewer(renderArea, { useDefaultRenderLoop: true, showBoundingBox: false });

    // sensible defaults
    viewer.setEDLEnabled(true);
    // Soften EDL so the dark shading between octree-LOD points doesn't read as
    // cross-hatch/streak artifacts on flat slabs (and stops burying GPR marks).
    try { viewer.setEDLRadius(1.0); } catch (e) {}   // default 1.4 — tighter halo
    try { viewer.setEDLStrength(0.3); } catch (e) {} // default ~0.4 — gentler darkening
    viewer.setFOV(60);
    // Responsiveness-first budget. The clean (despeckled) look lives in the octree
    // data and costs nothing to render — this only trades some density at WIDE zoom
    // for a much smoother experience (zoom in to recover full ~1cm detail; +/- to tune).
    viewer.setPointBudget(3_000_000); // was 16M (laggy) -> 5M -> 3M for responsiveness (+/- to tune live)
    // minNodeSize raised above Potree default (30) to cull more small/deep nodes = fewer draw calls.
    try { viewer.setMinNodeSize(40); } catch (e) {}
    viewer.setDescription(meta.name || pointCloudID);
    document.title = 'Enable Viewer — ' + (meta.name || pointCloudID); // tab title per loaded project
    viewer.loadSettingsFromURL(); // allow ? overrides

    // -- Fix: Right-click always pans, even during measurement tool use --
    // During measurement insertion Potree's drag system is permanently
    // occupied by a measurement sphere, so right-click can never start a
    // navigation drag through InputHandler. We intercept ALL right-click
    // mouse events on the canvas, prevent Potree from seeing them, and
    // handle panning by directly updating OrbitControls.panDelta.
    (function() {
      var rightDragPrev = null;
      var domEl = viewer.renderer.domElement;

      domEl.addEventListener('mousedown', function(e) {
        if (e.button === 2) {
          e.stopImmediatePropagation();
          rightDragPrev = { x: e.clientX, y: e.clientY };
        }
      }, true);

      domEl.addEventListener('mousemove', function(e) {
        if (!rightDragPrev || !(e.buttons & 2)) {
          if (rightDragPrev) rightDragPrev = null;
          return;
        }
        e.stopImmediatePropagation();
        var dx = e.clientX - rightDragPrev.x;
        var dy = e.clientY - rightDragPrev.y;
        rightDragPrev = { x: e.clientX, y: e.clientY };
        var controls = viewer.getControls();
        if (controls && controls.panDelta) {
          controls.panDelta.x += dx / domEl.clientWidth;
          controls.panDelta.y += dy / domEl.clientHeight;
          if (controls.stopTweens) controls.stopTweens();
        }
      }, true);

      domEl.addEventListener('mouseup', function(e) {
        if (e.button === 2) {
          e.stopImmediatePropagation();
          rightDragPrev = null;
        }
      }, true);
    })();

    // -- Click-without-drag on an elevation box = toggle selection (gizmo) --
    // The box's fill mesh has raycast disabled so click-and-drag inside the
    // box can pan/rotate the camera. To preserve the "click box → handles
    // appear" interaction, we manually OBB-test on mousedown and, if the
    // mouseup happens within ~5px without movement, treat it as a click and
    // call inputHandler.toggleSelection on the volume.
    (function() {
      var domEl = viewer.renderer.domElement;
      var pendingClick = null; // { vol, x, y }
      var unitBox = new THREE.Box3(new THREE.Vector3(-0.5, -0.5, -0.5),
                                   new THREE.Vector3( 0.5,  0.5,  0.5));

      domEl.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        // Skip if the user is in any tool workflow that consumes left clicks —
        // a click then belongs to that tool, not to selecting a managed box.
        if (typeof MARK_MODE !== 'undefined' && MARK_MODE) return;
        if (typeof constraintPickMode !== 'undefined' && constraintPickMode) return;
        if (typeof memberPickMode !== 'undefined' && memberPickMode) return;
        if (typeof zBasePickMode !== 'undefined' && zBasePickMode) return;
        if (typeof notePickMode !== 'undefined' && notePickMode) return;
        if (typeof pendingMeasurement !== 'undefined' && pendingMeasurement) return;
        if (typeof pendingVolume !== 'undefined' && pendingVolume) return;

        // All internally-managed boxes whose fill-mesh raycast is disabled
        // (elevation crop, cut-out, exclusion) need this manual OBB hit-test to be
        // selectable — Potree can no longer pick them by their (now non-raycasting)
        // fill mesh, so without this their wireframe edges can't be clicked.
        var selBoxes = [];
        if (typeof elevationCropVolumes !== 'undefined') selBoxes = selBoxes.concat(elevationCropVolumes);
        if (typeof cutoutBoxes !== 'undefined') selBoxes = selBoxes.concat(cutoutBoxes);
        if (typeof exclusionBoxes !== 'undefined') selBoxes = selBoxes.concat(exclusionBoxes);
        if (selBoxes.length === 0) return;

        var rect = domEl.getBoundingClientRect();
        var ndc = {
          x: ((e.clientX - rect.left) / rect.width) * 2 - 1,
          y: -((e.clientY - rect.top) / rect.height) * 2 + 1
        };
        var camera = viewer.scene.getActiveCamera();
        var raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(ndc, camera);

        for (var i = 0; i < selBoxes.length; i++) {
          var vol = selBoxes[i];
          if (vol._disabled) continue;
          vol.updateMatrixWorld(true);
          var inv = new THREE.Matrix4().copy(vol.matrixWorld).invert();
          var localRay = raycaster.ray.clone().applyMatrix4(inv);
          var hit = new THREE.Vector3();
          if (localRay.intersectBox(unitBox, hit)) {
            pendingClick = { vol: vol, x: e.clientX, y: e.clientY };
            return;
          }
        }
      }, true);

      domEl.addEventListener('mouseup', function(e) {
        if (e.button !== 0) return;
        if (!pendingClick) return;
        var dx = e.clientX - pendingClick.x;
        var dy = e.clientY - pendingClick.y;
        var moved = Math.sqrt(dx * dx + dy * dy);
        var vol = pendingClick.vol;
        pendingClick = null;
        if (moved > 5) return; // it was a drag — camera already orbited
        var ih = viewer.inputHandler;
        // Volume insertion (placing a new box) and gizmo-handle grabs both run
        // through inputHandler.startDragging, which sets ih.drag.object. Don't
        // intervene in those cases — Potree's bubble-phase onMouseUp must run
        // to fire the 'drop' event that commits placement / ends drag.
        if (ih && ih.drag && ih.drag.object) return;
        // If Potree already has a wireframe pick on the click, let its own
        // onMouseUp run — it does the right thing for selection. We only take over
        // for clicks INSIDE a managed box where Potree can't see the volume (fill
        // raycast off) and would otherwise call deselectAll(), undoing our pick.
        //
        // CRUCIAL: defer for ANY hovered scene volume, not just `vol`. The mousedown
        // OBB test uses an INFINITE camera ray, so a managed box lying anywhere along
        // the ray's depth sets pendingClick even when the user actually clicked the
        // persistent clip box's edge across the scene. The clip box IS Potree-pickable
        // (its box.raycast routes to its frame), so without this broader check we'd
        // hijack the edge click and deselectAll() — making the clip-box edge feel
        // "unresponsive" the moment any elevation/cut-out/exclusion box exists.
        var sceneVols = (viewer.scene && viewer.scene.volumes) ? viewer.scene.volumes : [];
        var hoveredHasVol = ih && ih.hoveredElements && ih.hoveredElements.some(function(h) {
          var o = h && h.object;
          while (o) {
            if (o === vol) return true;                  // the managed box itself
            if (sceneVols.indexOf(o) >= 0) return true;  // any other volume (e.g. clip-box edge)
            o = o.parent;
          }
          return false;
        });
        if (hoveredHasVol) return;
        // Orbit-first clears hoveredElements on mousedown, so hoveredHasVol can't
        // see the crop box. If the crop box is the intended click target, defer
        // to the crop-click handler (main mouseup) so a managed box lying along
        // the infinite pick ray doesn't hijack the crop-box click.
        if (_cropClickCandidate) return;
        try {
          var alreadySelected = ih.selection && ih.selection.indexOf(vol) >= 0;
          ih.deselectAll();
          if (!alreadySelected) ih.toggleSelection(vol);
        } catch (err) { /* ignore */ }
        // Block Potree's bubble-phase onMouseUp; otherwise it sees no
        // selectable in hoveredElements and runs deselectAll(), wiping us out.
        e.stopImmediatePropagation();
      }, true);
    })();

    // ----- load GUI and force "always open" sidebar -----
    viewer.loadGUI(() => {
      viewer.setLanguage('en');

      const $menu = $("#potree_menu");

      // Kill any accordion instance & remove its traces
      try { $menu.accordion("destroy"); } catch(e) {}
      $menu.removeClass("ui-accordion ui-widget ui-helper-reset")
           .removeData("uiAccordion").removeData("ui-accordion");

      // Unbind header toggles and make them inert
      $menu.find("h3, .accordion-header, .ui-accordion-header")
           .off("click").css("cursor","default");

      // Force all section bodies visible
      $menu.children("div")
           .show().attr("aria-hidden","false")
           .css({display:"block", height:"auto", overflow:"visible"});

      // Legacy 'ui-accordion-content' blocks open
      $menu.find(".ui-accordion-content")
           .css({display:"block", height:"auto", overflow:"visible"})
           .attr("aria-hidden","false");

      // Remove map bits
      $(".potree_toggle_map, #potree_toggle_map, .mapToggle").remove();
      $("#menu_map, #map, #potree_map_container").remove();

      // Kill accordion if something tries to reattach it later
      const mo = new MutationObserver(() => {
        if ($menu.data("uiAccordion") || $menu.hasClass("ui-accordion")) {
          try { $menu.accordion("destroy"); } catch(e) {}
          $menu.removeClass("ui-accordion").removeData("uiAccordion").removeData("ui-accordion");
        }
      });
      mo.observe($menu[0], {attributes:true, childList:true, subtree:true});

      // Optional: silence benign sidebar DOM warnings
      const sb = viewer.sidebar;
      if (sb) {
        ["initReturnFilters","initFilters","onReturnNumberChanged"].forEach(fn => {
          if (typeof sb[fn] === "function") {
            const orig = sb[fn].bind(sb);
            sb[fn] = function(...args){ try { return orig(...args); } catch(e){ /* ignore missing DOM */ } };
          }
        });
      }

      // --- Force Background = None (use CSS page color) ---
      try {
        // make the WebGL canvas transparent so CSS background shows
        if (viewer.renderer?.setClearAlpha) viewer.renderer.setClearAlpha(0);
      } catch (_) {}

      try {
        // tell Potree to use "None" (matches the GUI radio value 'null')
        viewer.setBackground("null");
      } catch (_) {}

      // reflect it visually in the sidebar pills
      try {
        const $bgFieldset = $("#potree_menu fieldset legend").filter(function () {
          return $(this).text().trim().toLowerCase() === "background";
        }).closest("fieldset");

        $bgFieldset.find("input[name=background_options][value=null]")
          .prop("checked", true)
          .button("refresh");
      } catch (_) {}

      // (measurement setup runs outside loadGUI via polling — see below)
    });

    // ===== MARK POINT TOOL =====

    // -- State --
    let MARK_MODE = false;
    const markedPoints = [];  // array of { id, name, locked, visible, visual: THREE.Group }
    let nextMarkId = 1;
    const markerScene = new THREE.Scene();  // separate scene, rendered manually AFTER EDL
    markerScene.name = "EnableMarkerScene";

    // -- Scan station pins state --
    const stationScene = new THREE.Scene();
    stationScene.name = "EnableStationScene";
    const stations = [];           // each: { id, name, position, rotationQuat, panoramaURL, hasPanorama, visible, visual }
    let stationPinHeight = 0.4;    // auto-scaled after cloud loads
    let stationPinRadius = 0.1;
    let _stationManifest = null;   // raw manifest object once fetched

    let ringOuterRadius = 0.12;   // large ring visible when zoomed out
    let ringMiddleRadius = 0.025; // medium ring
    let ringInnerRadius = 0.006;  // tightest ring, ~point-sized
    const RING_SEGMENTS = 48;

    // -- Shared material (outline-only ring, no fill) --
    const ringMaterial = new THREE.LineBasicMaterial({
      color: 0xff2020,
      depthTest: false,
      depthWrite: false,
      transparent: true,
      opacity: 0.9,
      linewidth: 3
    });

    // -- Build a circle geometry (line loop) at origin in XY plane --
    function createCircleGeometry(radius, segments) {
      const pts = [];
      for (let i = 0; i <= segments; i++) {
        const angle = (i / segments) * Math.PI * 2;
        pts.push(Math.cos(angle) * radius, Math.sin(angle) * radius, 0);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
      return geo;
    }

    // -- Create a radial-gradient glow texture (cached per color hex) --
    var _glowTextureCache = {};
    function createGlowTexture(colorHex) {
      if (_glowTextureCache[colorHex]) return _glowTextureCache[colorHex];
      var size = 128;
      var canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      var ctx = canvas.getContext('2d');
      var c = new THREE.Color(colorHex);
      var r = Math.round(c.r * 255), g = Math.round(c.g * 255), b = Math.round(c.b * 255);
      var grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',0.20)');
      grad.addColorStop(0.4, 'rgba(' + r + ',' + g + ',' + b + ',0.15)');
      grad.addColorStop(0.7, 'rgba(' + r + ',' + g + ',' + b + ',0.35)');
      grad.addColorStop(0.9, 'rgba(' + r + ',' + g + ',' + b + ',0.5)');
      grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      var tex = new THREE.CanvasTexture(canvas);
      _glowTextureCache[colorHex] = tex;
      return tex;
    }

    // -- Create a glow sprite for a marker --
    function createGlowSprite(colorHex, radius) {
      var tex = createGlowTexture(colorHex);
      var mat = new THREE.SpriteMaterial({
        map: tex,
        blending: THREE.AdditiveBlending,
        depthTest: false,
        depthWrite: false,
        transparent: true,
        opacity: 1.0
      });
      var sprite = new THREE.Sprite(mat);
      sprite.scale.set(radius * 3, radius * 3, 1);
      return sprite;
    }

    // -- Create a text label sprite for a marker point --
    function createMarkLabel(text) {
      var canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 48;
      var ctx = canvas.getContext('2d');
      // Semi-transparent dark background pill
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.beginPath();
      if (ctx.roundRect) { ctx.roundRect(2, 2, canvas.width - 4, canvas.height - 4, 8); }
      else { ctx.rect(2, 2, canvas.width - 4, canvas.height - 4); }
      ctx.fill();
      // White text
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      var texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      var material = new THREE.SpriteMaterial({
        map: texture, depthTest: false, depthWrite: false,
        transparent: true, sizeAttenuation: true
      });
      var sprite = new THREE.Sprite(material);
      // Position offset to the right of the dot
      sprite.scale.set(ringOuterRadius * 2.5, ringOuterRadius * 1.0, 1);
      sprite.position.set(ringOuterRadius * 2.0, ringOuterRadius * 0.5, 0);
      sprite.userData.isMarkLabel = true;
      return sprite;
    }

    // -- Update label sprite on an existing marker --
    function updateMarkLabel(mark) {
      if (!mark.visual) return;
      // Remove old label
      mark.visual.children.forEach(function(child) {
        if (child.userData && child.userData.isMarkLabel) mark.visual.remove(child);
      });
      // Add new label
      var sprite = createMarkLabel(mark.name);
      mark.visual.add(sprite);
    }

    // -- Helper: scale a sphere mesh to a fixed screen-pixel size each frame.
    // Used across markers / constraint definition points / member endpoints
    // so every marker visually behaves like Potree's measurement spheres.
    function _scaleMarkerSphere(sphereObj, camera, _rsz) {
      var wp = sphereObj.getWorldPosition(new THREE.Vector3());
      var dist = camera.position.distanceTo(wp);
      var pr = Potree.Utils.projectedRadius(1, camera, dist, _rsz.width, _rsz.height);
      if (!pr || !isFinite(pr) || pr < 0.001) pr = 1;
      var s = 15 / pr;
      sphereObj.scale.set(s, s, s);
    }

    // -- Render markers in the perspective_overlay pass (AFTER EDL + depth clear) --
    viewer.addEventListener("render.pass.perspective_overlay", function(e) {
      if (markerScene.children.length === 0) return;
      const camera = viewer.scene.getActiveCamera();
      const _mkRSize = viewer.renderer.getSize(new THREE.Vector2());
      // Billboard the mark groups (label sprites auto-billboard anyway, but
      // historical behaviour also faces the group itself). Then scale every
      // isMarkerSphere mesh to its fixed screen-pixel size.
      for (let i = 0; i < markerScene.children.length; i++) {
        markerScene.children[i].quaternion.copy(camera.quaternion);
        markerScene.children[i].traverse(function (obj) {
          if (obj.userData && obj.userData.isMarkerSphere) {
            _scaleMarkerSphere(obj, camera, _mkRSize);
          }
        });
      }
      viewer.renderer.render(markerScene, camera);
    });

    // -- Render scan station pins in the same overlay pass --
    // Sprites auto-billboard via THREE.js's sprite shader, so we don't touch
    // them. The cone is a Mesh anchored to world up — also left untouched.
    viewer.addEventListener("render.pass.perspective_overlay", function(e) {
      if (stationScene.children.length === 0) return;
      const camera = viewer.scene.getActiveCamera();
      viewer.renderer.render(stationScene, camera);
    });

    // -- Camera-icon glyph sprite (white camera icon on filled disk) --
    var _stationIconTextureCache = null;
    function getStationIconTexture() {
      if (_stationIconTextureCache) return _stationIconTextureCache;
      var size = 128;
      var canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      var ctx = canvas.getContext('2d');
      // Filled cyan disk background
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2 - 4, 0, Math.PI * 2);
      ctx.fillStyle = '#4db6ff';
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#ffffff';
      ctx.stroke();
      // Simple white camera glyph
      ctx.fillStyle = '#ffffff';
      // camera body
      var bw = 56, bh = 38, bx = (size - bw) / 2, by = (size - bh) / 2 + 6;
      ctx.fillRect(bx, by, bw, bh);
      // viewfinder hump
      ctx.fillRect(bx + 16, by - 10, 24, 12);
      // lens (dark inner circle)
      ctx.beginPath();
      ctx.arc(size / 2, by + bh / 2, 12, 0, Math.PI * 2);
      ctx.fillStyle = '#1a1a1a';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(size / 2, by + bh / 2, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#4db6ff';
      ctx.fill();
      var tex = new THREE.CanvasTexture(canvas);
      tex.minFilter = THREE.LinearFilter;
      _stationIconTextureCache = tex;
      return tex;
    }

    // -- Build a station pin: cone (tip at station.position) + camera icon sprite + glow --
    // Potree's scene is Z-up, so the cone axis must be along world +Z to stand
    // vertically. Default ConeGeometry has its axis along +Y.
    function buildStationPinVisual(station) {
      var group = new THREE.Group();
      group.position.copy(station.position);

      var coneColor = 0x4db6ff;
      var pinOpacity = 1.0;

      // Build cone with apex at local (0,0,0) (the station) and base at (0,0,+h).
      //   Default: apex at +Y/2, base at -Y/2 (axis along Y).
      //   rotateX(-π/2): swing Y onto Z. After: apex at (0,0,-h/2), base at (0,0,+h/2).
      //     (And normals are inverted, hence DoubleSide.)
      //   translate(0,0,+h/2): apex at (0,0,0), base at (0,0,+h).
      var coneGeo = new THREE.ConeGeometry(stationPinRadius, stationPinHeight, 16);
      coneGeo.rotateX(-Math.PI / 2);
      coneGeo.translate(0, 0, stationPinHeight / 2);
      var coneMat = new THREE.MeshBasicMaterial({
        color: coneColor, depthTest: false, depthWrite: false,
        transparent: true, opacity: pinOpacity,
        side: THREE.DoubleSide
      });
      var cone = new THREE.Mesh(coneGeo, coneMat);
      cone.userData.isStationCone = true;
      cone.renderOrder = 1;
      group.add(cone);

      // Icon head sits above the cone base, along world +Z (up).
      var iconOffsetZ = stationPinHeight + stationPinRadius * 1.4;
      var iconScale = stationPinRadius * 4.5;

      // Glow halo behind the icon head
      var glow = createGlowSprite(coneColor, stationPinRadius * 2.5);
      glow.position.set(0, 0, iconOffsetZ);
      glow.material.opacity = 0.7;
      glow.renderOrder = 2;
      group.add(glow);

      // Camera icon sprite (sprites auto-billboard — do NOT override quaternion)
      var spriteMat = new THREE.SpriteMaterial({
        map: getStationIconTexture(),
        depthTest: false, depthWrite: false,
        transparent: true, opacity: 1.0
      });
      var sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(iconScale, iconScale, 1);
      sprite.position.set(0, 0, iconOffsetZ);
      sprite.renderOrder = 3;
      sprite.userData.isStationIcon = true;
      group.add(sprite);

      group.userData.station = station;
      group.userData.iconOffsetZ = iconOffsetZ;
      group.userData.iconScale = iconScale;

      return group;
    }

    // ============================================================
    // Panorama modal viewer
    // ============================================================
    // Lazy-initialized inverted-sphere THREE.js scene. On close, we keep the
    // renderer/scene/material alive for fast reopen and dispose only the
    // texture (which holds the per-station JPEG).
    var _spm = {
      renderer: null,
      scene: null,
      camera: null,
      sphere: null,
      material: null,
      texture: null,
      raf: null,
      yaw: 0,
      pitch: 0,
      dragging: false,
      lastX: 0, lastY: 0,
      escHandler: null,
      resizeHandler: null,
      open: false
    };

    function _spmInit() {
      if (_spm.renderer) return;
      var canvas = document.getElementById('spm-canvas');
      _spm.renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      _spm.renderer.setPixelRatio(window.devicePixelRatio || 1);
      _spm.scene = new THREE.Scene();
      _spm.camera = new THREE.PerspectiveCamera(75, 1, 0.1, 100);
      // Sphere centered at origin, normals flipped inward so we view the
      // panorama from the inside.
      var geo = new THREE.SphereGeometry(50, 64, 32);
      geo.scale(-1, 1, 1);
      _spm.material = new THREE.MeshBasicMaterial({ color: 0xffffff });
      _spm.sphere = new THREE.Mesh(geo, _spm.material);
      _spm.scene.add(_spm.sphere);

      canvas.addEventListener('pointerdown', function(ev) {
        _spm.dragging = true;
        _spm.lastX = ev.clientX;
        _spm.lastY = ev.clientY;
        canvas.classList.add('grabbing');
        canvas.setPointerCapture(ev.pointerId);
      });
      canvas.addEventListener('pointermove', function(ev) {
        if (!_spm.dragging) return;
        var dx = ev.clientX - _spm.lastX;
        var dy = ev.clientY - _spm.lastY;
        _spm.lastX = ev.clientX;
        _spm.lastY = ev.clientY;
        // "Grab and drag" feel: dragging right moves the image right (camera
        // looks left); dragging down moves the image down (camera looks up).
        _spm.yaw += dx * 0.005;
        _spm.pitch += dy * 0.005;
        _spm.pitch = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, _spm.pitch));
      });
      function endDrag(ev) {
        _spm.dragging = false;
        canvas.classList.remove('grabbing');
        try { canvas.releasePointerCapture(ev.pointerId); } catch (e) {}
      }
      canvas.addEventListener('pointerup', endDrag);
      canvas.addEventListener('pointercancel', endDrag);
      canvas.addEventListener('pointerleave', endDrag);

      canvas.addEventListener('wheel', function(ev) {
        ev.preventDefault();
        _spm.camera.fov = Math.max(25, Math.min(90, _spm.camera.fov + ev.deltaY * 0.05));
        _spm.camera.updateProjectionMatrix();
      }, { passive: false });

      document.getElementById('spm-close').addEventListener('click', closeStationPanorama);
    }

    function _spmResize() {
      var canvas = document.getElementById('spm-canvas');
      var w = canvas.clientWidth;
      var h = canvas.clientHeight;
      if (w === 0 || h === 0) return;
      _spm.renderer.setSize(w, h, false);
      _spm.camera.aspect = w / h;
      _spm.camera.updateProjectionMatrix();
    }

    function _spmRenderLoop() {
      if (!_spm.open) return;
      _spm.raf = requestAnimationFrame(_spmRenderLoop);
      // Apply yaw/pitch directly via euler angles (YXZ order = yaw, then pitch,
      // then roll). This avoids the camera-roll surprises that lookAt+spherical
      // produces when the up vector lines up with the look direction.
      _spm.camera.rotation.order = 'YXZ';
      _spm.camera.rotation.y = _spm.yaw;
      _spm.camera.rotation.x = _spm.pitch;
      _spm.camera.rotation.z = 0;
      _spm.renderer.render(_spm.scene, _spm.camera);
    }

    function openStationPanorama(station) {
      if (!station || !station.hasPanorama || !station.panoramaURL) {
        showToast('No panorama available for this station');
        return;
      }
      _spmInit();

      // Title
      var titleEl = document.getElementById('spm-title');
      if (titleEl) titleEl.textContent = station.name;

      // Reset camera orientation
      _spm.yaw = 0;
      _spm.pitch = 0;
      _spm.camera.fov = 75;
      _spm.camera.updateProjectionMatrix();

      // Default sphere orientation (sky at +Y pole). Don't apply the station's
      // rotation_quat here — it's from Trimble's Z-up rotation columns and
      // applying it to a Y-up sphere produces tilted "up". User can drag to
      // look around in the modal anyway.
      _spm.sphere.quaternion.identity();

      // Swap texture
      if (_spm.texture) {
        _spm.material.map = null;
        _spm.texture.dispose();
        _spm.texture = null;
      }
      var loader = new THREE.TextureLoader();
      _spm.texture = loader.load(station.panoramaURL, function() {
        // re-render once texture finishes loading
      }, undefined, function(err) {
        showToast('Failed to load panorama: ' + station.panoramaURL);
        console.error(err);
      });
      _spm.texture.minFilter = THREE.LinearFilter;
      _spm.material.map = _spm.texture;
      _spm.material.needsUpdate = true;

      // Show modal
      var modal = document.getElementById('station-panorama-modal');
      modal.classList.add('show');
      _spm.open = true;

      // Block all pointer events on the Potree canvas so drags in the modal
      // don't also orbit the cloud underneath.
      if (viewer.renderer && viewer.renderer.domElement) {
        _spm._prevPotreePointerEvents = viewer.renderer.domElement.style.pointerEvents;
        viewer.renderer.domElement.style.pointerEvents = 'none';
      }
      // Belt-and-suspenders: also block events at the document level (capture
      // phase) so anything Potree listens to outside the canvas can't react.
      _spm._eventBlocker = function(ev) {
        // Don't block events targeted at the modal itself
        var t = ev.target;
        while (t) {
          if (t.id === 'station-panorama-modal') return;
          t = t.parentNode;
        }
        ev.stopImmediatePropagation();
      };
      var blockedTypes = ['mousedown', 'mouseup', 'mousemove', 'wheel', 'contextmenu', 'pointerdown', 'pointerup', 'pointermove'];
      blockedTypes.forEach(function(t) {
        document.addEventListener(t, _spm._eventBlocker, true);
      });
      _spm._blockedTypes = blockedTypes;

      // NOTE: Esc intentionally does NOT close the panorama. While the panorama
      // is open the user is often mid-measurement in the point cloud, and Esc
      // must reach the measurement-tool cancel handler — not steal the keypress
      // to close the image. The panorama closes ONLY via its close button (see
      // closeStationPanorama). _spm.escHandler is left unset, so the cleanup in
      // closeStationPanorama is a guarded no-op.

      _spm.resizeHandler = function() { _spmResize(); };
      window.addEventListener('resize', _spm.resizeHandler);

      // Wait one frame so the canvas has its layout size before sizing renderer
      requestAnimationFrame(function() {
        _spmResize();
        _spmRenderLoop();
      });
    }

    function closeStationPanorama() {
      if (!_spm.open) return;
      _spm.open = false;
      if (_spm.raf) cancelAnimationFrame(_spm.raf);
      _spm.raf = null;
      var modal = document.getElementById('station-panorama-modal');
      modal.classList.remove('show');
      if (_spm.escHandler) {
        document.removeEventListener('keydown', _spm.escHandler, true);
        _spm.escHandler = null;
      }
      if (_spm.resizeHandler) {
        window.removeEventListener('resize', _spm.resizeHandler);
        _spm.resizeHandler = null;
      }
      // Restore Potree canvas pointer events
      if (viewer.renderer && viewer.renderer.domElement) {
        viewer.renderer.domElement.style.pointerEvents = _spm._prevPotreePointerEvents || '';
        _spm._prevPotreePointerEvents = null;
      }
      // Remove document-level event blockers
      if (_spm._eventBlocker && _spm._blockedTypes) {
        _spm._blockedTypes.forEach(function(t) {
          document.removeEventListener(t, _spm._eventBlocker, true);
        });
        _spm._eventBlocker = null;
        _spm._blockedTypes = null;
      }
      // Free texture memory; keep renderer for fast reopen
      if (_spm.texture) {
        _spm.material.map = null;
        _spm.texture.dispose();
        _spm.texture = null;
        _spm.material.needsUpdate = true;
      }
    }

    // -- Toggle visibility of all scan station pins --
    var _stationsVisible = true;
    function toggleStationsVisibility() {
      _stationsVisible = !_stationsVisible;
      stations.forEach(function(st) {
        st.visible = _stationsVisible;
        if (st.visual) st.visual.visible = _stationsVisible;
      });
      var btn = document.getElementById('btn-toggle-stations');
      if (btn) btn.textContent = _stationsVisible ? 'Hide Scan Stations' : 'Show Scan Stations';
    }

    // -- Apply a fetched station manifest: build pins, populate sidebar, check alignment --
    function onStationManifestLoaded(manifest, worldBB) {
      _stationManifest = manifest;
      if (!manifest || !manifest.stations || manifest.stations.length === 0) return;

      // Resolve base path for panorama URLs (relative to the project's folder).
      // meta.folder = "<project>/pointclouds/<scan_id>"; drop those two segments.
      // Regex (not split/join) so an absolute R2 URL keeps its "https://".
      var manifestBase = meta.folder.replace(/\/+$/, '').replace(/\/[^/]+\/[^/]+$/, '') + '/stations/';

      // Auto-scale pin size from cloud diagonal.
      try {
        var size = worldBB.getSize(new THREE.Vector3());
        var diagonal = Math.sqrt(size.x * size.x + size.y * size.y + size.z * size.z);
        stationPinHeight = Math.max(0.15, diagonal * 0.00625);
        stationPinRadius = stationPinHeight * 0.30;
      } catch (err) { /* fall back to defaults */ }

      // Only build pins for stations that have a panorama. The DB lists every
      // station, but pins without a clickable target just add clutter.
      manifest.stations.forEach(function(s) {
        var hasPano = !!s.has_panorama && !!s.panorama;
        if (!hasPano) return;
        var pos = new THREE.Vector3(s.position[0], s.position[1], s.position[2]);
        var quat = (s.rotation_quat && s.rotation_quat.length === 4)
          ? s.rotation_quat.slice() : [0, 0, 0, 1];
        var st = {
          id: s.id,
          name: s.name || s.id,
          position: pos,
          rotationQuat: quat,
          panoramaURL: manifestBase + s.panorama,
          hasPanorama: true,
          visible: true,
          visual: null
        };
        st.visual = buildStationPinVisual(st);
        stationScene.add(st.visual);
        stations.push(st);
      });
      console.log('[stations] built ' + stations.length + ' pins (out of ' + manifest.stations.length + ' DB stations)');
      if (stations.length === 0) {
        // No panoramas yet — leave the sidebar group hidden so it isn't an empty box
        return;
      }

      // Reveal the Show/Hide Scan Stations toggle in the Session group.
      // injectMarkButtons may not have run yet (it polls for Potree's #tools),
      // so retry until the row exists in the DOM.
      (function tryRevealToggle() {
        var row = document.getElementById('enable-stations-toggle-row');
        var btn = document.getElementById('btn-toggle-stations');
        if (!row || !btn) {
          setTimeout(tryRevealToggle, 150);
          return;
        }
        row.style.display = '';
        btn.textContent = _stationsVisible ? 'Hide Scan Stations' : 'Show Scan Stations';
        btn.addEventListener('click', toggleStationsVisibility);
        console.log('[stations] toggle button wired (' + stations.length + ' pins)');
      })();

      // Alignment sanity check (XY centroid vs cloud bbox center)
      try {
        var cx = 0, cy = 0, n = stations.length;
        for (var i = 0; i < n; i++) { cx += stations[i].position.x; cy += stations[i].position.y; }
        cx /= n; cy /= n;
        var wbCenter = worldBB.getCenter(new THREE.Vector3());
        var wbSize = worldBB.getSize(new THREE.Vector3());
        var diag = Math.sqrt(wbSize.x * wbSize.x + wbSize.y * wbSize.y + wbSize.z * wbSize.z);
        var dx = cx - wbCenter.x, dy = cy - wbCenter.y;
        var centroidDist = Math.sqrt(dx * dx + dy * dy);

        // Check if any single station lies far outside the bbox (allow 2x diagonal margin)
        var expandedBB = worldBB.clone();
        var pad = diag * 1.0;  // 1x diag padding on each side = 2x diag total expansion
        expandedBB.min.x -= pad; expandedBB.min.y -= pad; expandedBB.min.z -= pad;
        expandedBB.max.x += pad; expandedBB.max.y += pad; expandedBB.max.z += pad;
        var anyOutside = false;
        for (var j = 0; j < n; j++) {
          if (!expandedBB.containsPoint(stations[j].position)) { anyOutside = true; break; }
        }

        if (centroidDist > diag * 0.5 || anyOutside) {
          showToast('Station positions may be misaligned with point cloud — check --offset', 5000);
          console.warn('[stations] alignment check failed:',
            'centroidXY=', cx.toFixed(2), cy.toFixed(2),
            'cloudCenterXY=', wbCenter.x.toFixed(2), wbCenter.y.toFixed(2),
            'centroidDist=', centroidDist.toFixed(2),
            'cloudDiagonal=', diag.toFixed(2),
            'appliedOffset=', manifest.applied_offset,
            'anyOutsideExpanded=', anyOutside);
        } else {
          console.log('[stations] alignment OK (centroid offset ' + centroidDist.toFixed(2) + 'm vs cloud diag ' + diag.toFixed(2) + 'm)');
        }
      } catch (err) {
        console.warn('[stations] alignment check failed to run:', err);
      }
    }

    // -- Find nearest station pin under cursor (screen-space hit-test) --
    // Threshold is the larger of MIN_HIT_PX and half the icon's on-screen
    // diameter, so the user can click anywhere within the visible icon.
    function findNearestStationPin(mousePixel) {
      if (stations.length === 0) return null;
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var MIN_HIT_PX = 18;
      var bestDist = Infinity;
      var bestResult = null;
      for (var i = 0; i < stations.length; i++) {
        var st = stations[i];
        if (!st.visible || !st.hasPanorama) continue;
        // Project the icon's WORLD position (above the station along world +Z)
        var iconWorld = st.visual.position.clone();
        var offZ = (st.visual.userData && st.visual.userData.iconOffsetZ) || (stationPinHeight + stationPinRadius * 1.4);
        iconWorld.z += offZ;
        // Project icon center
        var ptC = iconWorld.clone().project(camera);
        var cx = (ptC.x * 0.5 + 0.5) * rect.width;
        var cy = (1 - (ptC.y * 0.5 + 0.5)) * rect.height;
        // Project icon edge (icon center + iconScale*0.5 along camera-right)
        var iconScale = (st.visual.userData && st.visual.userData.iconScale) || (stationPinRadius * 4.0);
        var cameraRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        var edgeWorld = iconWorld.clone().add(cameraRight.multiplyScalar(iconScale * 0.5));
        var ptE = edgeWorld.project(camera);
        var ex = (ptE.x * 0.5 + 0.5) * rect.width;
        var ey = (1 - (ptE.y * 0.5 + 0.5)) * rect.height;
        var radiusPx = Math.sqrt((ex - cx) * (ex - cx) + (ey - cy) * (ey - cy));
        var threshold = Math.max(MIN_HIT_PX, radiusPx);

        var dx = cx - mousePixel.x;
        var dy = cy - mousePixel.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < threshold && dist < bestDist) {
          bestDist = dist;
          bestResult = { station: st, index: i };
        }
      }
      return bestResult;
    }

    // -- Toast notification --
    let toastTimer = null;
    function showToast(msg, duration) {
      duration = duration || 2000;
      const el = document.getElementById('enable-toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), duration);
    }

    // -- Place a marker at a 3D position --
    function placeMarker(position) {
      // Group positioned at the picked point; billboarded each frame
      const group = new THREE.Group();
      group.position.copy(position);

      // Solid red sphere, fixed screen-pixel size (per-frame scaling in the
      // markerScene render pass below). Matches the dimension/constraint marker
      // style — just red.
      var dotGeo = new THREE.SphereGeometry(0.4, 12, 12);
      var dotMat = new THREE.MeshBasicMaterial({
        color: 0xff2020, depthTest: false, depthWrite: false
      });
      var dotMesh = new THREE.Mesh(dotGeo, dotMat);
      dotMesh.userData.isMarkerSphere = true;
      group.add(dotMesh);

      // Text label (e.g. "P1")
      var labelName = 'P' + nextMarkId;
      var labelSprite = createMarkLabel(labelName);
      group.add(labelSprite);

      var mark = {
        id: nextMarkId++,
        name: labelName,
        locked: true,
        visible: true,
        visual: group
      };
      group.name = "marker-" + mark.id;

      markerScene.add(group);
      markedPoints.push(mark);
      undoStack.push({ type: 'mark', id: mark.id });
      rebuildMarkList();
      showToast(mark.name + " placed (" + markedPoints.length + " total)");
    }

    // -- Delete a single marker by id --
    function deleteMarker(id) {
      for (var i = 0; i < markedPoints.length; i++) {
        if (markedPoints[i].id === id) {
          var m = markedPoints[i];
          m.visual.traverse(function(obj) {
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
              if (obj.material.map) obj.material.map.dispose();
              obj.material.dispose();
            }
          });
          markerScene.remove(m.visual);
          markedPoints.splice(i, 1);
          // Clean up any elevation boxes referencing this mark as Z=0 base.
          // Recompute each affected box so the heat map reflects the missing reference.
          var affected = getElevBoxesReferencingMark(id);
          for (var ai = 0; ai < affected.length; ai++) {
            var c = getBoxConfig(affected[ai]);
            c.zBaseMarkId = null;
            forceRecomputeBox(affected[ai]);
          }
          rebuildMarkList();
          return;
        }
      }
    }

    // -- Clear all markers --
    function clearAllMarkers() {
      while (markedPoints.length > 0) {
        var m = markedPoints.pop();
        m.visual.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            if (obj.material.map) obj.material.map.dispose();
            obj.material.dispose();
          }
        });
        markerScene.remove(m.visual);
      }
      rebuildMarkList();
      showToast("Cleared all markers");
    }

    // -- Rebuild mark list in sidebar --
    function rebuildMarkList() {
      var listEl = document.getElementById('enable-mark-list');
      if (!listEl) return;
      listEl.innerHTML = '';

      for (var i = 0; i < markedPoints.length; i++) {
        (function(m) {
          var row = document.createElement('div');
          row.className = 'mark-row';

          var nameSpan = document.createElement('span');
          nameSpan.className = 'mark-name';
          var refs = getElevBoxesReferencingMark(m.id);
          if (refs.length > 0) {
            var refNames = refs.map(function(v) { return v.name; }).join(', ');
            nameSpan.textContent = m.name + ' \u2014 Z=0 for: ' + refNames;
            nameSpan.title = 'Referenced as Z=0 base by: ' + refNames;
          } else {
            nameSpan.textContent = m.name;
          }
          row.appendChild(nameSpan);

          var visBtn = document.createElement('button');
          visBtn.className = 'btn-vis' + (m.visible === false ? ' hidden' : '');
          visBtn.textContent = '\uD83D\uDC41';
          visBtn.title = 'Toggle visibility';
          visBtn.addEventListener('click', function() {
            m.visible = !m.visible;
            m.visual.visible = m.visible;
            visBtn.classList.toggle('hidden', !m.visible);
          });
          row.appendChild(visBtn);

          var lockBtn = document.createElement('button');
          lockBtn.className = 'btn-lock' + (m.locked ? ' locked' : '');
          lockBtn.textContent = m.locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
          lockBtn.title = m.locked ? 'Unlock to move' : 'Lock position';
          lockBtn.addEventListener('click', function() {
            m.locked = !m.locked;
            lockBtn.textContent = m.locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
            lockBtn.title = m.locked ? 'Unlock to move' : 'Lock position';
            lockBtn.classList.toggle('locked', m.locked);
          });
          row.appendChild(lockBtn);

          var deleteBtn = document.createElement('button');
          deleteBtn.textContent = '\u00d7';
          deleteBtn.title = 'Delete mark';
          deleteBtn.addEventListener('click', function() {
            deleteMarker(m.id);
          });
          row.appendChild(deleteBtn);

          listEl.appendChild(row);
        })(markedPoints[i]);
      }
    }

    // ============================================================
    // ===== NOTES =================================================
    // ============================================================
    // Notes are text annotations attached to a 3D point in the cloud.
    // Each note renders as a small sticky-note icon sprite at its world
    // position. Clicking the icon opens a popover overlay where the user
    // can edit the text; clicking again (or the popover X) collapses it.
    // Notes share the same visibility toggle as scan stations and persist
    // through session save/load.

    var notes = [];                       // each: { id, name, text, position, visible, visual }
    var nextNoteId = 1;
    var notePickMode = false;
    var _expandedNoteId = null;            // currently-open popover (or null)
    var _noteIconTexture = null;
    var noteScene = new THREE.Scene();
    noteScene.name = "EnableNoteScene";

    function _createNoteIconTexture() {
      if (_noteIconTexture) return _noteIconTexture;
      var size = 256;
      var canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      var ctx = canvas.getContext('2d');
      var pad = 24;
      var w = size - pad * 2, h = size - pad * 2;
      var x0 = pad, y0 = pad;
      var foldSize = 44;
      var radius = 12;

      // Drop shadow for legibility against dark/light clouds.
      ctx.fillStyle = 'rgba(0,0,0,0.45)';
      ctx.beginPath();
      ctx.moveTo(x0 + radius, y0 + 6);
      ctx.lineTo(x0 + w - foldSize, y0 + 6);
      ctx.lineTo(x0 + w, y0 + foldSize + 6);
      ctx.lineTo(x0 + w, y0 + h - radius + 6);
      ctx.quadraticCurveTo(x0 + w, y0 + h + 6, x0 + w - radius, y0 + h + 6);
      ctx.lineTo(x0 + radius, y0 + h + 6);
      ctx.quadraticCurveTo(x0, y0 + h + 6, x0, y0 + h - radius + 6);
      ctx.lineTo(x0, y0 + radius + 6);
      ctx.quadraticCurveTo(x0, y0 + 6, x0 + radius, y0 + 6);
      ctx.closePath();
      ctx.fill();

      // Main note body (warm muted yellow) — rounded rect minus top-right corner
      var bodyGradient = ctx.createLinearGradient(0, y0, 0, y0 + h);
      bodyGradient.addColorStop(0, '#f7d54a');
      bodyGradient.addColorStop(1, '#e3b91e');
      ctx.fillStyle = bodyGradient;
      ctx.beginPath();
      ctx.moveTo(x0 + radius, y0);
      ctx.lineTo(x0 + w - foldSize, y0);
      ctx.lineTo(x0 + w, y0 + foldSize);
      ctx.lineTo(x0 + w, y0 + h - radius);
      ctx.quadraticCurveTo(x0 + w, y0 + h, x0 + w - radius, y0 + h);
      ctx.lineTo(x0 + radius, y0 + h);
      ctx.quadraticCurveTo(x0, y0 + h, x0, y0 + h - radius);
      ctx.lineTo(x0, y0 + radius);
      ctx.quadraticCurveTo(x0, y0, x0 + radius, y0);
      ctx.closePath();
      ctx.fill();

      // Folded corner — darker triangle showing the underside of the fold
      ctx.fillStyle = '#a87f12';
      ctx.beginPath();
      ctx.moveTo(x0 + w - foldSize, y0);
      ctx.lineTo(x0 + w, y0 + foldSize);
      ctx.lineTo(x0 + w - foldSize, y0 + foldSize);
      ctx.closePath();
      ctx.fill();

      // Faint ruled lines suggesting text
      ctx.strokeStyle = 'rgba(0,0,0,0.20)';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      var lineL = x0 + 22, lineR = x0 + w - 22;
      var lineY1 = y0 + h * 0.45;
      ctx.beginPath();
      ctx.moveTo(lineL, lineY1);              ctx.lineTo(lineR, lineY1);
      ctx.moveTo(lineL, lineY1 + 22);         ctx.lineTo(lineR, lineY1 + 22);
      ctx.moveTo(lineL, lineY1 + 44);         ctx.lineTo(lineR - 30, lineY1 + 44);
      ctx.stroke();

      // Thin outline for definition against pale backgrounds
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x0 + radius, y0);
      ctx.lineTo(x0 + w - foldSize, y0);
      ctx.lineTo(x0 + w, y0 + foldSize);
      ctx.lineTo(x0 + w, y0 + h - radius);
      ctx.quadraticCurveTo(x0 + w, y0 + h, x0 + w - radius, y0 + h);
      ctx.lineTo(x0 + radius, y0 + h);
      ctx.quadraticCurveTo(x0, y0 + h, x0, y0 + h - radius);
      ctx.lineTo(x0, y0 + radius);
      ctx.quadraticCurveTo(x0, y0, x0 + radius, y0);
      ctx.closePath();
      ctx.stroke();

      var tex = new THREE.CanvasTexture(canvas);
      tex.minFilter = THREE.LinearFilter;
      tex.magFilter = THREE.LinearFilter;
      tex.needsUpdate = true;
      _noteIconTexture = tex;
      return tex;
    }

    function _buildNoteVisual(note) {
      // Group at the 3D anchor; icon billboard is offset upward (world +Z) with
      // a thin connecting line from the anchor to the icon — same idea as the
      // scan-station cone: the line points at the exact feature the note is
      // about, while the icon sits clear of it for legibility.
      var group = new THREE.Group();
      group.position.copy(note.position);
      group.userData.isNoteGroup = true;
      group.userData.noteId = note.id;

      var offsetZ = Math.max(0.45, stationPinHeight * 1.8);
      group.userData.iconOffsetZ = offsetZ;

      // Connector line from anchor to icon
      var lineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, 0, offsetZ)
      ]);
      var lineMat = new THREE.LineBasicMaterial({
        color: 0xe3b91e, depthTest: false, depthWrite: false,
        transparent: true, opacity: 0.85
      });
      var line = new THREE.Line(lineGeo, lineMat);
      line.renderOrder = 1;
      group.add(line);

      // Small anchor dot at the actual 3D point — same yellow as the note,
      // helps locate the exact spot when the icon is offset some distance away.
      var anchorGeo = new THREE.SphereGeometry(stationPinRadius * 0.35, 10, 10);
      var anchorMat = new THREE.MeshBasicMaterial({
        color: 0xe3b91e, depthTest: false, depthWrite: false
      });
      var anchor = new THREE.Mesh(anchorGeo, anchorMat);
      anchor.position.set(0, 0, 0);
      anchor.renderOrder = 1;
      group.add(anchor);

      // The sticky-note icon sprite, offset up the connector line
      var spriteMat = new THREE.SpriteMaterial({
        map: _createNoteIconTexture(),
        depthTest: false, depthWrite: false,
        transparent: true, opacity: 1.0
      });
      var sprite = new THREE.Sprite(spriteMat);
      sprite.userData.isNoteIcon = true;
      sprite.userData.noteId = note.id;
      var s = Math.max(0.35, stationPinHeight * 1.5);
      sprite.scale.set(s, s, 1);
      sprite.position.set(0, 0, offsetZ);
      sprite.renderOrder = 2;
      group.add(sprite);

      group.userData.iconSprite = sprite;
      return group;
    }

    function placeNote(position, optText, optName, optId) {
      var note = {
        id: optId != null ? optId : nextNoteId++,
        name: optName || ('N' + (optId != null ? optId : (nextNoteId - 1))),
        text: optText || '',
        position: position.clone(),
        visible: true,
        visual: null
      };
      note.visual = _buildNoteVisual(note);
      noteScene.add(note.visual);
      notes.push(note);
      if (optId != null && optId >= nextNoteId) nextNoteId = optId + 1;
      undoStack.push({ type: 'note', id: note.id });
      rebuildNoteList();
      showToast(note.name + ' placed — click the icon to edit text');
      // Auto-open the popover so the user can immediately type.
      _openNotePopover(note.id);
      return note;
    }

    function deleteNote(id) {
      for (var i = 0; i < notes.length; i++) {
        if (notes[i].id !== id) continue;
        var n = notes[i];
        if (n.visual) {
          noteScene.remove(n.visual);
          if (n.visual.material) {
            // Texture is shared & cached — don't dispose; just drop the material
            n.visual.material.dispose();
          }
        }
        if (_expandedNoteId === id) _closeNotePopover();
        notes.splice(i, 1);
        rebuildNoteList();
        return;
      }
    }

    function clearAllNotes() {
      while (notes.length > 0) deleteNote(notes[notes.length - 1].id);
      nextNoteId = 1;
    }

    function setNoteText(id, text) {
      for (var i = 0; i < notes.length; i++) {
        if (notes[i].id === id) { notes[i].text = text; rebuildNoteList(); return; }
      }
    }
    function setNoteName(id, name) {
      for (var i = 0; i < notes.length; i++) {
        if (notes[i].id === id) { notes[i].name = name; rebuildNoteList(); return; }
      }
    }
    function setNoteVisible(id, vis) {
      for (var i = 0; i < notes.length; i++) {
        if (notes[i].id === id) {
          notes[i].visible = vis;
          if (notes[i].visual) notes[i].visual.visible = vis && _annotationsVisible;
          if (!vis && _expandedNoteId === id) _closeNotePopover();
          rebuildNoteList();
          return;
        }
      }
    }
    function findNoteById(id) {
      for (var i = 0; i < notes.length; i++) if (notes[i].id === id) return notes[i];
      return null;
    }

    // -- Generic hover-preview sphere helper --
    // Used by note placement (yellow) and constraint picks (green) to show
    // the user exactly which cloud point will be picked. Sphere material is
    // tagged isMarkerSphere so the existing per-frame screen-pixel scaler
    // (in render.pass.perspective_overlay) keeps it at a consistent size.
    function _makePreviewSphere(colorHex) {
      var geo = new THREE.SphereGeometry(0.4, 14, 14);
      var mat = new THREE.MeshBasicMaterial({
        color: colorHex,
        depthTest: false,
        depthWrite: false,
        transparent: true,
        opacity: 0.85
      });
      var mesh = new THREE.Mesh(geo, mat);
      mesh.userData.isMarkerSphere = true;
      mesh.userData.isHoverPreview = true;
      mesh.visible = false;
      return mesh;
    }
    function _disposePreviewSphere(mesh, parentScene) {
      if (!mesh) return;
      if (parentScene) parentScene.remove(mesh);
      if (mesh.geometry) mesh.geometry.dispose();
      if (mesh.material) mesh.material.dispose();
    }
    function _updatePreviewSphereAt(mesh, mousePixel) {
      if (!mesh) return;
      var pick = _origPick(mousePixel, viewer.scene.getActiveCamera(), viewer, viewer.scene.pointclouds);
      if (pick && pick.location) {
        mesh.position.copy(pick.location);
        mesh.visible = true;
      } else {
        mesh.visible = false;
      }
    }

    // -- Note pick mode --
    var _notePreviewSphere = null;
    function startNotePick() {
      if (constraintPickMode) cancelConstraintPick();
      if (memberPickMode) cancelMemberPick();
      if (MARK_MODE) toggleMarkMode(true);
      notePickMode = true;
      // No crosshair body class — the yellow preview sphere is the cue.
      if (!_notePreviewSphere) {
        _notePreviewSphere = _makePreviewSphere(0xf7d54a);
        noteScene.add(_notePreviewSphere);
      }
      showToast('Hover the cloud and click to place a note (Esc to cancel)', 4000);
    }
    function cancelNotePick() {
      notePickMode = false;
      if (_notePreviewSphere) {
        _disposePreviewSphere(_notePreviewSphere, noteScene);
        _notePreviewSphere = null;
      }
    }

    // -- Click hit-test against note icons (screen-space, like stations) --
    function _noteIconWorldPos(n) {
      if (!n.visual) return null;
      var spr = n.visual.userData.iconSprite;
      if (spr) return spr.getWorldPosition(new THREE.Vector3());
      return n.visual.position.clone();
    }
    function findNearestNoteIcon(mousePixel) {
      if (!_annotationsVisible) return null;
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestIdx = -1, bestDist2 = Infinity;
      var threshold = 28; // pixels
      for (var i = 0; i < notes.length; i++) {
        var n = notes[i];
        if (!n.visible || !n.visual) continue;
        var wp = _noteIconWorldPos(n);
        if (!wp) continue;
        var pos = wp.project(camera);
        if (pos.z < -1 || pos.z > 1) continue;
        var sx = (pos.x + 1) * 0.5 * rect.width;
        var sy = (-pos.y + 1) * 0.5 * rect.height;
        var dx = sx - mousePixel.x, dy = sy - mousePixel.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < bestDist2 && d2 < threshold * threshold) {
          bestDist2 = d2;
          bestIdx = i;
        }
      }
      return bestIdx >= 0 ? notes[bestIdx] : null;
    }

    // -- Expand / collapse popover --
    var _notePopoverEl = null;
    function _openNotePopover(id) {
      var n = findNoteById(id);
      if (!n) return;
      _closeNotePopover();
      _expandedNoteId = id;

      var pop = document.createElement('div');
      pop.id = 'enable-note-popover';
      pop.style.cssText =
        'position:fixed;z-index:1500;width:280px;background:var(--panel-bg,#1f1f1f);' +
        'color:var(--panel-fg,#e6e6e6);border:1px solid var(--panel-border,#3a3a3a);' +
        'border-radius:8px;padding:10px 12px;box-shadow:0 6px 24px rgba(0,0,0,0.45);' +
        'font:13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;';

      var header = document.createElement('div');
      header.style.cssText = 'display:flex;align-items:center;gap:8px;margin-bottom:8px';

      var nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.value = n.name;
      nameInput.style.cssText =
        'flex:1;background:transparent;border:0;color:inherit;font:600 13px sans-serif;' +
        'padding:2px 0;border-bottom:1px dashed transparent;outline:none';
      nameInput.addEventListener('focus', function () { nameInput.style.borderBottomColor = 'var(--panel-border,#555)'; });
      nameInput.addEventListener('blur', function () {
        nameInput.style.borderBottomColor = 'transparent';
        setNoteName(n.id, nameInput.value || ('N' + n.id));
      });
      header.appendChild(nameInput);

      pop.appendChild(header);

      var textarea = document.createElement('textarea');
      textarea.value = n.text;
      textarea.placeholder = 'Type your note...';
      textarea.style.cssText =
        'width:100%;min-height:90px;background:var(--panel-bg-2,#262626);color:inherit;' +
        'border:1px solid var(--panel-border,#3a3a3a);border-radius:4px;padding:8px;' +
        'font:13px/1.5 sans-serif;resize:vertical;box-sizing:border-box;outline:none';
      textarea.addEventListener('input', function () { setNoteText(n.id, textarea.value); });
      pop.appendChild(textarea);

      var footer = document.createElement('div');
      footer.style.cssText = 'display:flex;justify-content:flex-end;gap:6px;margin-top:8px';

      var delBtn = document.createElement('button');
      delBtn.textContent = 'Delete';
      delBtn.style.cssText =
        'background:transparent;border:1px solid var(--panel-border,#3a3a3a);color:#d04545;' +
        'padding:4px 10px;border-radius:4px;cursor:pointer;font:12px sans-serif';
      delBtn.addEventListener('click', function () { deleteNote(n.id); });
      footer.appendChild(delBtn);

      var saveBtn = document.createElement('button');
      saveBtn.textContent = 'Save';
      saveBtn.title = 'Save and close (text auto-saves as you type)';
      saveBtn.style.cssText =
        'background:#3EAD4A;border:1px solid #3EAD4A;color:#fff;' +
        'padding:4px 14px;border-radius:4px;cursor:pointer;font:600 12px sans-serif';
      saveBtn.addEventListener('click', function () {
        // Commit any pending name-input edit, then close.
        setNoteName(n.id, nameInput.value || ('N' + n.id));
        _closeNotePopover();
      });
      footer.appendChild(saveBtn);

      pop.appendChild(footer);

      // Keep note editing self-contained. Enter in the single-line name field
      // commits + closes; Enter in the textarea keeps its default (newline). In
      // BOTH cases the key is stopped from reaching the global keydown handler,
      // which would otherwise restart the last measurement tool and jump/zoom the
      // camera. (Escape is left to bubble — the global handler closes the popover.)
      pop.addEventListener('keydown', function (ev) {
        if (ev.key !== 'Enter') return;
        if (ev.target === nameInput) {
          ev.preventDefault();
          setNoteName(n.id, nameInput.value || ('N' + n.id));
          _closeNotePopover();
        }
        ev.stopPropagation();
      });

      document.body.appendChild(pop);
      _notePopoverEl = pop;
      _positionNotePopover();
      // Focus the textarea so the user can type immediately
      setTimeout(function () { textarea.focus(); }, 0);
    }

    function _closeNotePopover() {
      if (_notePopoverEl && _notePopoverEl.parentNode) {
        _notePopoverEl.parentNode.removeChild(_notePopoverEl);
      }
      _notePopoverEl = null;
      _expandedNoteId = null;
    }

    function _positionNotePopover() {
      if (!_notePopoverEl || _expandedNoteId == null) return;
      var n = findNoteById(_expandedNoteId);
      if (!n || !n.visual) { _closeNotePopover(); return; }
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var wp = _noteIconWorldPos(n);
      if (!wp) { _closeNotePopover(); return; }
      var sp = wp.project(camera);
      if (sp.z < -1 || sp.z > 1) { _notePopoverEl.style.display = 'none'; return; }
      _notePopoverEl.style.display = '';
      var sx = (sp.x + 1) * 0.5 * rect.width + rect.left;
      var sy = (-sp.y + 1) * 0.5 * rect.height + rect.top;
      // Anchor popover top-left to the icon's right-bottom so it doesn't cover it
      var popW = _notePopoverEl.offsetWidth || 280;
      var popH = _notePopoverEl.offsetHeight || 140;
      var x = sx + 22;
      var y = sy + 12;
      // Clamp to viewport
      var maxX = window.innerWidth - popW - 8;
      var maxY = window.innerHeight - popH - 8;
      if (x > maxX) x = sx - popW - 22;
      if (y > maxY) y = maxY;
      if (x < 8) x = 8;
      if (y < 60) y = 60; // leave room for the topbar
      _notePopoverEl.style.left = Math.round(x) + 'px';
      _notePopoverEl.style.top  = Math.round(y) + 'px';
    }

    // -- Sidebar list --
    function rebuildNoteList() {
      var listEl = document.getElementById('enable-note-list');

    function getBoxConfig(volume) {

          thicknessGapTol: 0.025,     // m — air-gap break for fixture rejection
          thicknessGrid: null,        // built per-compute, persistent until clear

    // Resolve the Z offset to subtract for a given box's elev calc. Returns 0

    function getZBaseZ(cfg) {
      if (!cfg || cfg.mode !== 'z' || cfg.zBaseMarkId == null) return 0;
      for (var i = 0; i < markedPoints.length; i++) {

    // Like findNearestMarker but ignores the locked filter (we want the user
    // to be able to pick ANY existing mark as a Z=0 base, even locked ones).
    function findAnyMarkerNear(mousePixel) {
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = 25;
      var bestMark = null;
      for (var i = 0; i < markedPoints.length; i++) {
        var m = markedPoints[i];
        if (!m.visible) continue;
        var pt = m.visual.position.clone().project(camera);
        var screenX = (pt.x * 0.5 + 0.5) * rect.width;
        var screenY = (1 - (pt.y * 0.5 + 0.5)) * rect.height;
        var dx = screenX - mousePixel.x;
        var dy = screenY - mousePixel.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < bestDist) {
          bestDist = dist;
          bestMark = m;
        }
      }
      return bestMark;
    }

        var v = elevationCropVolumes[i];
        var c = getBoxConfig(v);

      }

    // ===== Z-BASE PICK MODE =====

      cfg.zMax = null;

    // Get elevation value for a point — checks which box it's in, uses that box's mode
    function getElevationValue(px, py, pz) {
      // Find which elevation box this point belongs to
      for (var i = 0; i < elevationCropVolumes.length; i++) {
        var vol = elevationCropVolumes[i];
        if (vol._disabled) continue;
        vol.updateMatrixWorld(true);
        var inv = new THREE.Matrix4().copy(vol.matrixWorld).invert();
        var local = new THREE.Vector3(px, py, pz).applyMatrix4(inv);
        if (local.x >= -0.5 && local.x <= 0.5 &&
            local.y >= -0.5 && local.y <= 0.5 &&
            local.z >= -0.5 && local.z <= 0.5) {
          var cfg = getBoxConfig(vol);
          if (cfg.mode === 'plane' && cfg.refPlane) {
            var n = cfg.refPlane.normal;
            var c = cfg.refPlane.centroid;
            return (px - c.x) * n.x + (py - c.y) * n.y + (pz - c.z) * n.z;
          }
          return pz;
        }
      }
      return pz;

    // Fast version using pre-computed inverse matrices and config array

            v.y >= -0.5 && v.y <= 0.5 &&
            v.z >= -0.5 && v.z <= 0.5) {
          var cfg = boxConfigs[i];
          if (cfg.mode === 'plane' && cfg.refPlane) {
            var n = cfg.refPlane.normal;
            var c = cfg.refPlane.centroid;
