<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Enable Viewer</title>

  <!-- ===================== CSS ===================== -->
  <link rel="stylesheet" href="../libs/potree/potree.css">
  <link rel="stylesheet" href="../libs/jquery-ui/jquery-ui.min.css">
  <link rel="stylesheet" href="../libs/spectrum/spectrum.css">
  <link rel="stylesheet" href="../libs/jstree/themes/mixed/style.css">
  <link rel="stylesheet" href="./custom.css">

  <style>
    /* Layout */
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #0f1318;
    }
    .potree_container { position: absolute; inset: 0; }
    #potree_render_area, #potree_sidebar_container { position: absolute; top: 0; bottom: 0; }

    /* Your widths (unchanged) */
    #potree_render_area       { left: 300px; right: 0; }
    #potree_sidebar_container { left: 0; right: auto; width: 360px; overflow-y: auto; }

    /* Sidebar logo header */
    #potree_sidebar_container::before{
      content:"";
      display:block;
      height:84px;
      margin:12px 12px 8px;
      background-image:url("../EnableLogo.png");
      background-repeat:no-repeat;
      background-position:center;
      background-size:contain;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    /* Ensure panels are always open (belt + suspenders) */
    #potree_menu .ui-accordion-content,
    #potree_menu > div {
      display: block !important;
      height: auto !important;
      overflow: visible !important;
    }
    #potree_menu h3,
    #potree_menu .ui-accordion-header,
    #potree_menu .accordion-header {
      cursor: default !important;
      user-select: text;
    }

    /* Hide map UI completely */
    #potree_toggle_map, .potree_toggle_map, .mapToggle,
    #menu_map, #map, #potree_map_container,
    .ol-viewport, .ol-overlaycontainer { display: none !important; }

    /* Hide Potree's About section (covered by our version footer) */
    #menu_about, #menu_about + div { display: none !important; }

    /* Slightly tighter sidebar spacing */
    #potree_sidebar_container .accordion > div { padding: 6px 10px; }

    /* ===== Mark mode cursor ===== */
    body.mark-mode #potree_render_area { cursor: crosshair !important; }
    body.mark-mode #potree_render_area canvas { cursor: crosshair !important; }

    /* ===== Mark tool buttons ===== */
    #enable-mark-buttons { margin: 6px 0; display: flex; gap: 6px; }
    #enable-mark-buttons button {
      flex: 1; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-mark-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }
    #enable-mark-buttons button.active {
      background: var(--accent, #4db6ff) !important;
      color: #000 !important; border-color: var(--accent, #4db6ff) !important;
    }

    /* ===== Mark list rows ===== */
    .mark-row {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 6px; border-radius: 3px; margin: 2px 0;
      font: 12px/1.3 sans-serif; color: var(--sidebar-text, #fbfbfb);
      background: rgba(255,255,255,0.05);
    }
    .mark-row .mark-name {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .mark-row button {
      padding: 2px 6px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .mark-row button:hover { outline: 1px solid var(--accent, #4db6ff); }
    .mark-row .btn-lock.locked { opacity: 1; background: rgba(255,165,0,0.3); }
    .mark-row .btn-vis.hidden { opacity: 0.35; }

    /* ===== Toast notification ===== */
    #enable-toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: #fff; padding: 8px 20px;
      border-radius: 6px; font: 14px/1.4 sans-serif; z-index: 99999;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    #enable-toast.show { opacity: 1; }

    /* ===== Constraint tool cursor ===== */
    body.constraint-pick-mode #potree_render_area { cursor: crosshair !important; }
    body.constraint-pick-mode #potree_render_area canvas { cursor: crosshair !important; }

    /* ===== Constraint tool buttons ===== */
    #enable-constraint-buttons { margin: 6px 0; display: flex; gap: 6px; }
    #enable-constraint-buttons button {
      flex: 1; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-constraint-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }
    #enable-constraint-buttons button.active {
      background: var(--accent, #4db6ff) !important;
      color: #000 !important; border-color: var(--accent, #4db6ff) !important;
    }

    /* ===== Constraint list ===== */
    #enable-constraint-list { margin: 4px 0; }
    .constraint-row {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 6px; border-radius: 3px; margin: 2px 0;
      font: 12px/1.3 sans-serif; color: var(--sidebar-text, #fbfbfb);
      background: rgba(255,255,255,0.05);
    }
    .constraint-row.active { background: rgba(57,255,20,0.15); }
    .constraint-row .constraint-name {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .constraint-row button {
      padding: 2px 6px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .constraint-row button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Constraint status ===== */
    #enable-constraint-status {
      font: 12px/1.3 sans-serif; color: #39ff14;
      margin: 4px 0; min-height: 16px;
    }

    /* ===== Constraint drag cursor ===== */
    body.constraint-drag #potree_render_area { cursor: grabbing !important; }
    body.constraint-drag #potree_render_area canvas { cursor: grabbing !important; }

    /* ===== Constraint visibility toggle ===== */
    .constraint-row .btn-vis {
      padding: 2px 5px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .constraint-row .btn-vis:hover { outline: 1px solid var(--accent, #4db6ff); }
    .constraint-row .btn-vis.hidden { opacity: 0.35; }
    .constraint-row .btn-lock {
      padding: 2px 5px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .constraint-row .btn-lock:hover { outline: 1px solid var(--accent, #4db6ff); }
    .constraint-row .btn-lock.locked { opacity: 1; background: rgba(255,165,0,0.3); }
    .constraint-row .btn-ortho {
      padding: 2px 5px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .constraint-row .btn-ortho:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Plane ortho depth slab controls ===== */
    #enable-plane-depth-controls {
      margin: 4px 0; padding: 6px 8px; border-radius: 4px;
      background: rgba(57,255,20,0.08); border: 1px solid rgba(57,255,20,0.2);
      font: 12px/1.4 sans-serif; color: var(--sidebar-text, #fbfbfb);
    }
    #enable-plane-depth-controls .depth-title {
      font-weight: 600; font-size: 11px; color: #39ff14; margin-bottom: 4px;
    }
    #enable-plane-depth-controls .depth-row {
      display: flex; align-items: center; gap: 6px; margin: 3px 0;
    }
    #enable-plane-depth-controls .depth-row label {
      min-width: 50px; font-size: 11px; color: var(--muted, #9aa3b2);
    }
    #enable-plane-depth-controls .depth-row input[type="number"] {
      width: 70px; padding: 2px 4px; border: 1px solid var(--border, #555);
      border-radius: 3px; background: #333; color: #fff; font: 12px/1.3 sans-serif;
    }
    #enable-plane-depth-controls .depth-row span.unit { font-size: 11px; color: var(--muted, #9aa3b2); }
    #enable-plane-depth-controls button {
      margin-top: 4px; padding: 3px 10px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    #enable-plane-depth-controls button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Member tool cursor ===== */
    body.member-pick-mode #potree_render_area { cursor: crosshair !important; }
    body.member-pick-mode #potree_render_area canvas { cursor: crosshair !important; }

    /* ===== Member buttons ===== */
    #enable-member-buttons { margin: 6px 0; display: flex; gap: 6px; }
    #enable-member-buttons button {
      flex: 1; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-member-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }
    #enable-member-buttons button.active {
      background: var(--accent, #4db6ff) !important;
      color: #000 !important; border-color: var(--accent, #4db6ff) !important;
    }

    /* ===== Member list ===== */
    #enable-member-list { margin: 4px 0; }
    .member-row {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 6px; border-radius: 3px; margin: 2px 0;
      font: 12px/1.3 sans-serif; color: var(--sidebar-text, #fbfbfb);
      background: rgba(255,255,255,0.05);
    }
    .member-row .member-name {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      cursor: pointer;
    }
    .member-row .member-name:hover { text-decoration: underline; }
    .member-row button {
      padding: 2px 6px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .member-row button:hover { outline: 1px solid var(--accent, #4db6ff); }
    .member-row .btn-vis.hidden { opacity: 0.35; }

    /* ===== Member drag cursor ===== */
    body.member-drag #potree_render_area { cursor: grabbing !important; }
    body.member-drag #potree_render_area canvas { cursor: grabbing !important; }

    /* ===== DXF export button ===== */
    #enable-member-buttons-export { margin: 4px 0; }
    #enable-member-buttons-export button {
      width: 100%; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-member-buttons-export button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Sidebar version footer ===== */
    #enable-version-footer {
      position: fixed; bottom: 0; left: 0; width: 360px;
      padding: 6px 12px;
      background: var(--sidebar-bg, #363636);
      border-top: 1px solid rgba(255,255,255,0.08);
      font: 10px/1.4 sans-serif;
      color: rgba(251,251,251,0.35);
      z-index: 100;
      box-sizing: border-box;
    }
    #enable-version-footer a {
      color: rgba(251,251,251,0.45);
      text-decoration: none;
    }
    #enable-version-footer a:hover {
      color: rgba(251,251,251,0.7);
      text-decoration: underline;
    }

    /* ===== Session save/load buttons ===== */
    #enable-session-buttons { margin: 6px 0; display: flex; gap: 6px; }
    #enable-session-buttons button {
      flex: 1; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-session-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Measurement panel overrides ===== */
    /* Hide native raw XYZ + native distance table in measurement panel */
    .measurement_content .coordinates_table_container,
    .measurement_content .coordinates_table_container + br,
    .measurement_content #distances_table { display: none !important; }

    /* ===== Persistent measurement list ===== */
    #enable-measurement-list { margin: 4px 0; }
    .enable-meas-item {
      padding: 4px 6px; border-radius: 3px; margin: 3px 0;
      font: 12px/1.3 sans-serif; color: var(--sidebar-text, #fbfbfb);
      background: rgba(255,255,255,0.05);
    }
    .enable-meas-item .meas-header {
      display: flex; align-items: center; gap: 4px; margin-bottom: 2px;
    }
    .enable-meas-item .meas-title { flex: 1; font-weight: 600; font-size: 11px; color: var(--muted,#9aa3b2); }
    .enable-meas-item .meas-delete {
      padding: 1px 5px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .enable-meas-item .meas-delete:hover { outline: 1px solid var(--accent, #4db6ff); }
    .enable-meas-seg {
      display: flex; gap: 6px; padding: 1px 0; font-variant-numeric: tabular-nums;
    }
    .enable-meas-seg .seg-name { white-space: nowrap; font-weight: 500; min-width: 56px; }
    .enable-meas-seg .seg-vals { color: rgba(251,251,251,0.7); }
    .enable-meas-seg.seg-total { border-top: 1px solid rgba(255,255,255,0.15); padding-top: 3px; margin-top: 2px; font-weight: 700; }

    /* Export all measurements button */
    #enable-measurement-buttons-export { margin: 4px 0; }
    #enable-measurement-buttons-export button {
      width: 100%; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-measurement-buttons-export button:hover { outline: 1px solid var(--accent, #4db6ff); }
  </style>

<body>
  <!-- ===================== CONTAINER ===================== -->
  <div class="potree_container">
    <div id="potree_render_area"></div>
    <div id="potree_sidebar_container"></div>
  </div>

  <!-- Toast element -->
  <div id="enable-toast"></div>

  <!-- ===================== VENDOR + POTREE JS (order matters) ===================== -->
  <script src="../libs/jquery/jquery-3.1.1.min.js"></script>
  <script src="../libs/spectrum/spectrum.js"></script>
  <script src="../libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="../libs/other/BinaryHeap.js"></script>
  <script src="../libs/tween/tween.min.js"></script>
  <script src="../libs/d3/d3.js"></script>
  <script src="../libs/proj4/proj4.js"></script>
  <script src="../libs/i18next/i18next.js"></script>
  <script src="../libs/jstree/jstree.js"></script>

  <script src="../libs/three/build/three.min.js"></script>
  <script src="../libs/potree/potree.js"></script>
  <script src="../libs/plasio/js/laslaz.js"></script>

  <!-- Per-client project registry -->
  <script src="projects.js"></script>

  <!-- ===================== APP ===================== -->
  <script>
  (function () {
    // ----- read ?p=<PointCloudID> and lookup in projects.js -----
    const params = new URLSearchParams(location.search);
    const pointCloudID = params.get('p');
    if (!pointCloudID) { alert('Missing ?p=<PointCloudID> in URL'); return; }
    const meta = (window.PROJECTS || {})[pointCloudID];
    if (!meta || !meta.folder) { alert('PointCloudID "' + pointCloudID + '" not found in projects.js'); return; }
    const cloudURL = meta.folder.replace(/\/+$/, '') + '/cloud.js';

    // ----- init Potree viewer -----
    const renderArea = document.getElementById('potree_render_area');
    const viewer = new Potree.Viewer(renderArea, { useDefaultRenderLoop: true, showBoundingBox: false });

    // sensible defaults
    viewer.setEDLEnabled(true);
    viewer.setFOV(60);
    viewer.setPointBudget(2_000_000);
    viewer.setDescription(meta.name || pointCloudID);
    viewer.loadSettingsFromURL(); // allow ? overrides

    // -- Fix: Right-click always pans, even during measurement tool use --
    // During measurement insertion Potree's drag system is permanently
    // occupied by a measurement sphere, so right-click can never start a
    // navigation drag through InputHandler. We intercept ALL right-click
    // mouse events on the canvas, prevent Potree from seeing them, and
    // handle panning by directly updating OrbitControls.panDelta.
    (function() {
      var rightDragPrev = null;
      var domEl = viewer.renderer.domElement;

      domEl.addEventListener('mousedown', function(e) {
        if (e.button === 2) {
          e.stopImmediatePropagation();
          rightDragPrev = { x: e.clientX, y: e.clientY };
        }
      }, true);

      domEl.addEventListener('mousemove', function(e) {
        if (!rightDragPrev || !(e.buttons & 2)) {
          if (rightDragPrev) rightDragPrev = null;
          return;
        }
        e.stopImmediatePropagation();
        var dx = e.clientX - rightDragPrev.x;
        var dy = e.clientY - rightDragPrev.y;
        rightDragPrev = { x: e.clientX, y: e.clientY };
        var controls = viewer.getControls();
        if (controls && controls.panDelta) {
          controls.panDelta.x += dx / domEl.clientWidth;
          controls.panDelta.y += dy / domEl.clientHeight;
          if (controls.stopTweens) controls.stopTweens();
        }
      }, true);

      domEl.addEventListener('mouseup', function(e) {
        if (e.button === 2) {
          e.stopImmediatePropagation();
          rightDragPrev = null;
        }
      }, true);
    })();

    // ----- load GUI and force "always open" sidebar -----
    viewer.loadGUI(() => {
      viewer.setLanguage('en');

      const $menu = $("#potree_menu");

      // Kill any accordion instance & remove its traces
      try { $menu.accordion("destroy"); } catch(e) {}
      $menu.removeClass("ui-accordion ui-widget ui-helper-reset")
           .removeData("uiAccordion").removeData("ui-accordion");

      // Unbind header toggles and make them inert
      $menu.find("h3, .accordion-header, .ui-accordion-header")
           .off("click").css("cursor","default");

      // Force all section bodies visible
      $menu.children("div")
           .show().attr("aria-hidden","false")
           .css({display:"block", height:"auto", overflow:"visible"});

      // Legacy 'ui-accordion-content' blocks open
      $menu.find(".ui-accordion-content")
           .css({display:"block", height:"auto", overflow:"visible"})
           .attr("aria-hidden","false");

      // Remove map bits
      $(".potree_toggle_map, #potree_toggle_map, .mapToggle").remove();
      $("#menu_map, #map, #potree_map_container").remove();

      // Keep it that way if something tries to reattach accordion later
      const mo = new MutationObserver(() => {
        if ($menu.data("uiAccordion") || $menu.hasClass("ui-accordion")) {
          try { $menu.accordion("destroy"); } catch(e) {}
          $menu.removeClass("ui-accordion").removeData("uiAccordion").removeData("ui-accordion");
        }
        $menu.children("div").css({display:"block", height:"auto", overflow:"visible"})
             .attr("aria-hidden","false");
        $menu.find(".ui-accordion-content")
             .css({display:"block", height:"auto", overflow:"visible"})
             .attr("aria-hidden","false");
      });
      mo.observe($menu[0], {attributes:true, childList:true, subtree:true});

      // Optional: silence benign sidebar DOM warnings
      const sb = viewer.sidebar;
      if (sb) {
        ["initReturnFilters","initFilters","onReturnNumberChanged"].forEach(fn => {
          if (typeof sb[fn] === "function") {
            const orig = sb[fn].bind(sb);
            sb[fn] = function(...args){ try { return orig(...args); } catch(e){ /* ignore missing DOM */ } };
          }
        });
      }

      // --- Force Background = None (use CSS page color) ---
      try {
        // make the WebGL canvas transparent so CSS background shows
        if (viewer.renderer?.setClearAlpha) viewer.renderer.setClearAlpha(0);
      } catch (_) {}

      try {
        // tell Potree to use "None" (matches the GUI radio value 'null')
        viewer.setBackground("null");
      } catch (_) {}

      // reflect it visually in the sidebar pills
      try {
        const $bgFieldset = $("#potree_menu fieldset legend").filter(function () {
          return $(this).text().trim().toLowerCase() === "background";
        }).closest("fieldset");

        $bgFieldset.find("input[name=background_options][value=null]")
          .prop("checked", true)
          .button("refresh");
      } catch (_) {}

      // (measurement setup runs outside loadGUI via polling — see below)
    });

    // ===== MARK POINT TOOL =====

    // -- State --
    let MARK_MODE = false;
    const markedPoints = [];  // array of { id, name, locked, visible, visual: THREE.Group }
    let nextMarkId = 1;
    const markerScene = new THREE.Scene();  // separate scene, rendered manually AFTER EDL
    markerScene.name = "EnableMarkerScene";
    let ringOuterRadius = 0.12;   // large ring visible when zoomed out
    let ringMiddleRadius = 0.025; // medium ring
    let ringInnerRadius = 0.006;  // tightest ring, ~point-sized
    const RING_SEGMENTS = 48;

    // -- Shared material (outline-only ring, no fill) --
    const ringMaterial = new THREE.LineBasicMaterial({
      color: 0xff2020,
      depthTest: false,
      depthWrite: false,
      transparent: true,
      opacity: 0.9,
      linewidth: 3
    });

    // -- Build a circle geometry (line loop) at origin in XY plane --
    function createCircleGeometry(radius, segments) {
      const pts = [];
      for (let i = 0; i <= segments; i++) {
        const angle = (i / segments) * Math.PI * 2;
        pts.push(Math.cos(angle) * radius, Math.sin(angle) * radius, 0);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
      return geo;
    }

    // -- Create a radial-gradient glow texture (cached per color hex) --
    var _glowTextureCache = {};
    function createGlowTexture(colorHex) {
      if (_glowTextureCache[colorHex]) return _glowTextureCache[colorHex];
      var size = 128;
      var canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      var ctx = canvas.getContext('2d');
      var c = new THREE.Color(colorHex);
      var r = Math.round(c.r * 255), g = Math.round(c.g * 255), b = Math.round(c.b * 255);
      var grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',0.20)');
      grad.addColorStop(0.4, 'rgba(' + r + ',' + g + ',' + b + ',0.15)');
      grad.addColorStop(0.7, 'rgba(' + r + ',' + g + ',' + b + ',0.35)');
      grad.addColorStop(0.9, 'rgba(' + r + ',' + g + ',' + b + ',0.5)');
      grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      var tex = new THREE.CanvasTexture(canvas);
      _glowTextureCache[colorHex] = tex;
      return tex;
    }

    // -- Create a glow sprite for a marker --
    function createGlowSprite(colorHex, radius) {
      var tex = createGlowTexture(colorHex);
      var mat = new THREE.SpriteMaterial({
        map: tex,
        blending: THREE.AdditiveBlending,
        depthTest: false,
        depthWrite: false,
        transparent: true,
        opacity: 1.0
      });
      var sprite = new THREE.Sprite(mat);
      sprite.scale.set(radius * 3, radius * 3, 1);
      return sprite;
    }

    // -- Render markers in the perspective_overlay pass (AFTER EDL + depth clear) --
    // Same hook Potree's own measurement/annotation tools use.
    viewer.addEventListener("render.pass.perspective_overlay", function(e) {
      if (markerScene.children.length === 0) return;

      // Billboard: make every ring face the camera
      const camera = viewer.scene.getActiveCamera();
      for (let i = 0; i < markerScene.children.length; i++) {
        markerScene.children[i].quaternion.copy(camera.quaternion);
      }

      viewer.renderer.render(markerScene, camera);
    });

    // -- Toast notification --
    let toastTimer = null;
    function showToast(msg, duration) {
      duration = duration || 2000;
      const el = document.getElementById('enable-toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), duration);
    }

    // -- Place a marker at a 3D position --
    function placeMarker(position) {
      // Group positioned at the picked point; billboarded each frame
      const group = new THREE.Group();
      group.position.copy(position);

      // Filled dot at center (~actual point size)
      const dotGeo = new THREE.CircleGeometry(ringInnerRadius, RING_SEGMENTS);
      const dotMat = new THREE.MeshBasicMaterial({
        color: ringMaterial.color, depthTest: false, depthWrite: false,
        transparent: true, opacity: ringMaterial.opacity, side: THREE.DoubleSide
      });
      group.add(new THREE.Mesh(dotGeo, dotMat));

      // Additive glow (electron cloud effect)
      group.add(createGlowSprite(0xff2020, ringOuterRadius));

      var mark = {
        id: nextMarkId++,
        name: 'P' + (nextMarkId - 1),
        locked: true,
        visible: true,
        visual: group
      };
      group.name = "marker-" + mark.id;

      markerScene.add(group);
      markedPoints.push(mark);
      undoStack.push({ type: 'mark', id: mark.id });
      rebuildMarkList();
      showToast(mark.name + " placed (" + markedPoints.length + " total)");
    }

    // -- Delete a single marker by id --
    function deleteMarker(id) {
      for (var i = 0; i < markedPoints.length; i++) {
        if (markedPoints[i].id === id) {
          var m = markedPoints[i];
          m.visual.traverse(function(obj) {
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
              if (obj.material.map) obj.material.map.dispose();
              obj.material.dispose();
            }
          });
          markerScene.remove(m.visual);
          markedPoints.splice(i, 1);
          rebuildMarkList();
          return;
        }
      }
    }

    // -- Clear all markers --
    function clearAllMarkers() {
      while (markedPoints.length > 0) {
        var m = markedPoints.pop();
        m.visual.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            if (obj.material.map) obj.material.map.dispose();
            obj.material.dispose();
          }
        });
        markerScene.remove(m.visual);
      }
      rebuildMarkList();
      showToast("Cleared all markers");
    }

    // -- Rebuild mark list in sidebar --
    function rebuildMarkList() {
      var listEl = document.getElementById('enable-mark-list');
      if (!listEl) return;
      listEl.innerHTML = '';

      for (var i = 0; i < markedPoints.length; i++) {
        (function(m) {
          var row = document.createElement('div');
          row.className = 'mark-row';

          var nameSpan = document.createElement('span');
          nameSpan.className = 'mark-name';
          nameSpan.textContent = m.name;
          row.appendChild(nameSpan);

          var visBtn = document.createElement('button');
          visBtn.className = 'btn-vis' + (m.visible === false ? ' hidden' : '');
          visBtn.textContent = '\uD83D\uDC41';
          visBtn.title = 'Toggle visibility';
          visBtn.addEventListener('click', function() {
            m.visible = !m.visible;
            m.visual.visible = m.visible;
            visBtn.classList.toggle('hidden', !m.visible);
          });
          row.appendChild(visBtn);

          var lockBtn = document.createElement('button');
          lockBtn.className = 'btn-lock' + (m.locked ? ' locked' : '');
          lockBtn.textContent = m.locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
          lockBtn.title = m.locked ? 'Unlock to move' : 'Lock position';
          lockBtn.addEventListener('click', function() {
            m.locked = !m.locked;
            lockBtn.textContent = m.locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
            lockBtn.title = m.locked ? 'Unlock to move' : 'Lock position';
            lockBtn.classList.toggle('locked', m.locked);
          });
          row.appendChild(lockBtn);

          var deleteBtn = document.createElement('button');
          deleteBtn.textContent = '\u00d7';
          deleteBtn.title = 'Delete mark';
          deleteBtn.addEventListener('click', function() {
            deleteMarker(m.id);
          });
          row.appendChild(deleteBtn);

          listEl.appendChild(row);
        })(markedPoints[i]);
      }
    }

    // ===== CONSTRAINT MEASUREMENT TOOL =====

    // -- State --
    const constraints = [];
    let nextConstraintId = 1;
    let activeConstraintId = null;
    let constraintPickMode = false;
    let constraintPickPoints = [];
    let constraintPickTarget = 0;
    let constraintPickType = null;
    const constraintScene = new THREE.Scene();
    constraintScene.name = "EnableConstraintScene";
    let constraintDragActive = false;
    let constraintDragInfo = null; // { constraint, pointIndex }
    let constraintPickMarkers = []; // temporary markers shown while picking

    // ===== MEMBER SKETCHING TOOL =====
    const members = [];
    let nextMemberId = 1;
    let memberPickMode = false;
    let memberPickPoints = [];
    let memberPickMarkers = [];
    const memberScene = new THREE.Scene();
    memberScene.name = "EnableMemberScene";
    let memberDragActive = false;
    let memberDragInfo = null; // { member, pointIndex }

    // ===== MEASUREMENT POINT LABELS =====
    const measurePointLabels = new Map(); // Map<Measure, TextSprite[]>
    const measureLabelScene = new THREE.Scene();
    measureLabelScene.name = "EnableMeasureLabelScene";
    let nextPointNumber = 1;                    // global D-number, never resets
    const measurePointNumbers = new Map();      // Map<Measure, number[]> — D-numbers per measurement

    // ===== SNAP THRESHOLDS (screen pixels) =====
    var SNAP_THRESHOLD_MEMBER = 18;      // for member/constraint picks
    var SNAP_THRESHOLD_MEASUREMENT = 10; // for Potree measurement picks (gentler)

    // ===== UNDO STACK =====
    const undoStack = [];

    // -- Undo last action --
    function performUndo() {
      if (undoStack.length === 0) { showToast('Nothing to undo'); return; }
      var action = undoStack.pop();

      if (action.type === 'mark') {
        // Remove the specific marker by id
        deleteMarker(action.id);
        showToast('Undid mark (' + markedPoints.length + ' remaining)');
      } else if (action.type === 'constraint-point') {
        // Remove last picked constraint point
        if (constraintPickMode && constraintPickPoints.length > 0) {
          constraintPickPoints.pop();
          if (constraintPickMarkers.length > 0) {
            var m = constraintPickMarkers.pop();
            m.traverse(function(obj) {
              if (obj.geometry) obj.geometry.dispose();
              if (obj.material) obj.material.dispose();
            });
            constraintScene.remove(m);
          }
          if (constraintPickPoints.length === 0) {
            cancelConstraintPick();
            showToast('Undid constraint pick — cancelled');
          } else {
            showToast('Pick point (' + (constraintPickPoints.length + 1) + '/' + constraintPickTarget + ') for ' + constraintPickType, 5000);
          }
        }
      } else if (action.type === 'constraint') {
        deleteConstraint(action.id);
        showToast('Undid constraint');
      } else if (action.type === 'member-point') {
        // Remove last picked member point
        if (memberPickMode && memberPickPoints.length > 0) {
          memberPickPoints.pop();
          if (memberPickMarkers.length > 0) {
            var m = memberPickMarkers.pop();
            m.traverse(function(obj) {
              if (obj.geometry) obj.geometry.dispose();
              if (obj.material) obj.material.dispose();
            });
            memberScene.remove(m);
          }
          if (memberPickPoints.length === 0) {
            cancelMemberPick();
            showToast('Undid member pick — cancelled');
          } else {
            showToast('Pick endpoint (2/2) for member', 5000);
          }
        }
      } else if (action.type === 'member') {
        deleteMember(action.id);
        showToast('Undid member');
      } else if (action.type === 'measurement-point') {
        var meas = action.measure;
        if (meas && meas.points && meas.points.length > 0) {
          if (meas.points.length <= 1) {
            // Remove the whole measurement if only 1 point
            viewer.scene.removeMeasurement(meas);
          } else {
            // Remove last point
            meas.removeMarker(meas.points.length - 1);
          }
          showToast('Undid measurement point');
        }
      }
    }

    // -- Monkey-patch point picking to apply active constraint --
    const _origPick = Potree.Utils.getMousePointCloudIntersection;
    Potree.Utils.getMousePointCloudIntersection = function(mouse, camera, viewer, pointclouds, params) {
      const result = _origPick.call(this, mouse, camera, viewer, pointclouds, params);
      if (result && result.location && activeConstraintId && !constraintPickMode && !constraintDragActive) {
        result.location = projectPoint(result.location);
      }
      // Snap for Potree measurement tool (not during our custom picks or drags)
      if (result && result.location && !constraintPickMode && !memberPickMode && !constraintDragActive && !memberDragActive) {
        var snap = findSnapTarget(mouse, SNAP_THRESHOLD_MEASUREMENT);
        if (snap) {
          result.location = snap.position;
          showToast('Snapped to ' + snap.label, 1000);
        }
      }
      return result;
    };

    // -- Project a point onto the active constraint --
    function projectPoint(point) {
      const c = constraints.find(function(con) { return con.id === activeConstraintId; });
      if (!c) return point;
      if (c.type === 'plane') {
        const target = new THREE.Vector3();
        c.plane.projectPoint(point, target);
        return target;
      } else if (c.type === 'axis') {
        const v = new THREE.Vector3().subVectors(point, c.origin);
        const t = v.dot(c.direction);
        return new THREE.Vector3().copy(c.origin).addScaledVector(c.direction, t);
      }
      return point;
    }

    // -- Start constraint pick mode --
    function startConstraintPick(type) {
      if (MARK_MODE) toggleMarkMode(true);
      if (memberPickMode) cancelMemberPick();
      constraintPickMode = true;
      constraintPickPoints = [];
      constraintPickType = type;
      if (type === 'fit-plane') {
        constraintPickTarget = Infinity; // no auto-finalize; Enter/dblclick to finish
        document.body.classList.add('constraint-pick-mode');
        showToast('Pick points for best-fit plane (Enter to finalize, min 3)', 5000);
        var btn = document.getElementById('btn-fit-plane');
        if (btn) btn.classList.add('active');
      } else {
        constraintPickTarget = type === 'plane' ? 3 : 2;
        document.body.classList.add('constraint-pick-mode');
        showToast('Pick point (1/' + constraintPickTarget + ') for ' + type, 5000);
        var btn = document.getElementById(type === 'plane' ? 'btn-set-plane' : 'btn-set-axis');
        if (btn) btn.classList.add('active');
      }
    }

    // -- Place a temporary neon-green concentric ring marker during picking --
    function placePickMarker(position) {
      var ptGroup = new THREE.Group();
      ptGroup.position.copy(position);
      ptGroup.userData.isDefinitionPoint = true;
      // Filled dot at center
      var dotGeo = new THREE.CircleGeometry(ringInnerRadius, RING_SEGMENTS);
      var dotMat = new THREE.MeshBasicMaterial({
        color: 0x39ff14, depthTest: false, depthWrite: false,
        transparent: true, opacity: 0.9, side: THREE.DoubleSide
      });
      ptGroup.add(new THREE.Mesh(dotGeo, dotMat));
      // Additive glow
      ptGroup.add(createGlowSprite(0x39ff14, ringOuterRadius));
      constraintScene.add(ptGroup);
      constraintPickMarkers.push(ptGroup);
    }

    // -- Remove all temporary pick markers --
    function clearPickMarkers() {
      for (var i = 0; i < constraintPickMarkers.length; i++) {
        var m = constraintPickMarkers[i];
        m.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) obj.material.dispose();
        });
        constraintScene.remove(m);
      }
      constraintPickMarkers.length = 0;
    }

    // -- Handle a picked point during constraint definition --
    function handleConstraintPick(position) {
      constraintPickPoints.push(position.clone());
      placePickMarker(position);
      undoStack.push({ type: 'constraint-point' });
      var count = constraintPickPoints.length;
      if (constraintPickType === 'fit-plane') {
        var status = count + ' point' + (count === 1 ? '' : 's') + ' picked';
        if (count < 3) status += ' (need at least 3)';
        else status += ' \u2014 Enter to finalize';
        showToast(status, 5000);
      } else if (count < constraintPickTarget) {
        showToast('Pick point (' + (count + 1) + '/' + constraintPickTarget + ') for ' + constraintPickType, 5000);
      } else {
        finalizeConstraint();
      }
    }

    // -- Cancel constraint pick mode --
    function cancelConstraintPick() {
      constraintPickMode = false;
      constraintPickPoints = [];
      constraintPickType = null;
      constraintPickTarget = 0;
      clearPickMarkers();
      document.body.classList.remove('constraint-pick-mode');
      document.querySelectorAll('#enable-constraint-buttons button').forEach(function(b) { b.classList.remove('active'); });
      showToast('Constraint picking cancelled');
    }

    // -- Finalize constraint from picked points --
    function finalizeConstraint() {
      var type = constraintPickType;
      var pts = constraintPickPoints;
      var constraint = null;

      if (type === 'plane') {
        var v1 = new THREE.Vector3().subVectors(pts[1], pts[0]);
        var v2 = new THREE.Vector3().subVectors(pts[2], pts[0]);
        var normal = new THREE.Vector3().crossVectors(v1, v2);
        if (normal.length() < 0.001) {
          showToast('Points are collinear \u2014 cannot define plane');
          cancelConstraintPick();
          return;
        }
        normal.normalize();
        var plane = new THREE.Plane();
        plane.setFromNormalAndCoplanarPoint(normal, pts[0]);
        var centroid = new THREE.Vector3().add(pts[0]).add(pts[1]).add(pts[2]).divideScalar(3);
        constraint = {
          id: nextConstraintId++,
          type: 'plane',
          name: 'Plane ' + (nextConstraintId - 1),
          plane: plane,
          normal: normal,
          centroid: centroid,
          points: pts,
          visual: null,
          visible: true,
          locked: true
        };
      } else if (type === 'fit-plane') {
        if (pts.length < 3) {
          showToast('Need at least 3 points for best-fit plane');
          cancelConstraintPick();
          return;
        }
        // Compute centroid
        var centroid = new THREE.Vector3();
        for (var fi = 0; fi < pts.length; fi++) centroid.add(pts[fi]);
        centroid.divideScalar(pts.length);

        // Build 3x3 covariance matrix
        var xx = 0, xy = 0, xz = 0, yy = 0, yz = 0, zz = 0;
        for (var fi = 0; fi < pts.length; fi++) {
          var dx = pts[fi].x - centroid.x;
          var dy = pts[fi].y - centroid.y;
          var dz = pts[fi].z - centroid.z;
          xx += dx * dx; xy += dx * dy; xz += dx * dz;
          yy += dy * dy; yz += dy * dz; zz += dz * dz;
        }

        // Find the eigenvector with smallest eigenvalue via power iteration
        // on the adjugate (cofactor) matrix — the normal is the least-variance direction.
        // For a 3x3 symmetric matrix, the smallest eigenvector can be found by
        // computing cross products of rows of (A - λI). We use a simpler approach:
        // try each candidate normal (cross products of covariance rows) and pick
        // the one that gives the smallest variance.
        var det2 = function(a, b, c, d) { return a * d - b * c; };
        var candidates = [
          // Cross products of pairs of rows of the covariance matrix
          new THREE.Vector3(
            det2(xy, xz, yy, yz),
            det2(xz, xx, yz, xy),
            det2(xx, xy, xy, yy)
          ),
          new THREE.Vector3(
            det2(yy, yz, xy, xz),
            det2(yz, xy, xz, xx),
            det2(xy, yy, xx, xy)
          ),
          // Fallback: world axes
          new THREE.Vector3(1, 0, 0),
          new THREE.Vector3(0, 1, 0),
          new THREE.Vector3(0, 0, 1)
        ];

        // Pick candidate that minimizes sum of squared distances to the plane
        var bestNormal = null;
        var bestVariance = Infinity;
        for (var ci2 = 0; ci2 < candidates.length; ci2++) {
          var n = candidates[ci2];
          if (n.length() < 0.0001) continue;
          n.normalize();
          var variance = 0;
          for (var fi = 0; fi < pts.length; fi++) {
            var d = (pts[fi].x - centroid.x) * n.x +
                    (pts[fi].y - centroid.y) * n.y +
                    (pts[fi].z - centroid.z) * n.z;
            variance += d * d;
          }
          if (variance < bestVariance) {
            bestVariance = variance;
            bestNormal = n.clone();
          }
        }

        if (!bestNormal) {
          showToast('Could not compute best-fit plane');
          cancelConstraintPick();
          return;
        }

        var rms = Math.sqrt(bestVariance / pts.length) * 1000; // mm
        var normal = bestNormal;
        var plane = new THREE.Plane();
        plane.setFromNormalAndCoplanarPoint(normal, centroid);

        constraint = {
          id: nextConstraintId++,
          type: 'plane',
          name: 'Fit Plane ' + (nextConstraintId - 1),
          plane: plane,
          normal: normal,
          centroid: centroid,
          points: pts,
          visual: null,
          visible: true,
          locked: true
        };
        showToast('Best-fit plane from ' + pts.length + ' points (RMS: ' + rms.toFixed(1) + ' mm)', 4000);
      } else if (type === 'axis') {
        var dir = new THREE.Vector3().subVectors(pts[1], pts[0]);
        if (dir.length() < 0.001) {
          showToast('Points are coincident \u2014 cannot define axis');
          cancelConstraintPick();
          return;
        }
        dir.normalize();
        constraint = {
          id: nextConstraintId++,
          type: 'axis',
          name: 'Axis ' + (nextConstraintId - 1),
          origin: pts[0].clone(),
          direction: dir,
          points: pts,
          visual: null,
          visible: true,
          locked: true
        };
      }

      clearPickMarkers();

      if (constraint) {
        buildConstraintVisual(constraint);
        constraints.push(constraint);
        rebuildConstraintList();
        // Replace constraint-point undo entries with a single constraint entry
        while (undoStack.length > 0 && undoStack[undoStack.length - 1].type === 'constraint-point') {
          undoStack.pop();
        }
        undoStack.push({ type: 'constraint', id: constraint.id });
        showToast(constraint.name + ' created');
      }

      constraintPickMode = false;
      constraintPickPoints = [];
      constraintPickType = null;
      constraintPickTarget = 0;
      document.body.classList.remove('constraint-pick-mode');
      document.querySelectorAll('#enable-constraint-buttons button').forEach(function(b) { b.classList.remove('active'); });
    }

    // -- Build 3D visual for a constraint --
    function buildConstraintVisual(constraint) {
      var group = new THREE.Group();
      group.name = 'constraint-' + constraint.id;

      if (constraint.type === 'plane') {
        var pts = constraint.points;
        var maxDist = 0;
        for (var i = 0; i < pts.length; i++) {
          for (var j = i + 1; j < pts.length; j++) {
            var d = pts[i].distanceTo(pts[j]);
            if (d > maxDist) maxDist = d;
          }
        }
        var quadSize = Math.max(maxDist * 3, 1);
        var planeGeo = new THREE.PlaneGeometry(quadSize, quadSize);
        var planeMat = new THREE.MeshBasicMaterial({
          color: 0x39ff14, transparent: true, opacity: 0.15,
          side: THREE.DoubleSide, depthTest: false, depthWrite: false
        });
        var planeMesh = new THREE.Mesh(planeGeo, planeMat);
        planeMesh.position.copy(constraint.centroid);
        // Build rotation so quad edges stay aligned with world axes.
        // PlaneGeometry face normal is local Z; local X/Y are the quad edges.
        var n = constraint.normal;
        // Project world-Z onto the plane to get a vertical-ish "up" edge.
        // If the plane is nearly horizontal (normal ~ Z), use world-X instead.
        var worldRef = (Math.abs(n.z) < 0.9)
          ? new THREE.Vector3(0, 0, 1)
          : new THREE.Vector3(1, 0, 0);
        // localX = horizontal edge in the plane
        var localX = new THREE.Vector3().crossVectors(worldRef, n).normalize();
        // localY = vertical edge in the plane
        var localY = new THREE.Vector3().crossVectors(n, localX).normalize();
        var rotMat = new THREE.Matrix4().makeBasis(localX, localY, n);
        var quat = new THREE.Quaternion().setFromRotationMatrix(rotMat);
        planeMesh.quaternion.copy(quat);
        group.add(planeMesh);

        var edgeGeo = new THREE.EdgesGeometry(planeGeo);
        var edgeMat = new THREE.LineBasicMaterial({
          color: 0x39ff14, transparent: true, opacity: 0.4,
          depthTest: false, depthWrite: false
        });
        var edgeLine = new THREE.LineSegments(edgeGeo, edgeMat);
        edgeLine.position.copy(constraint.centroid);
        edgeLine.quaternion.copy(quat);
        group.add(edgeLine);
      } else if (constraint.type === 'axis') {
        var axDir = constraint.direction;
        var axOrigin = constraint.origin;
        var span = constraint.points[0].distanceTo(constraint.points[1]);
        var extend = Math.max(span * 5, 10);
        var p1 = new THREE.Vector3().copy(axOrigin).addScaledVector(axDir, -extend);
        var p2 = new THREE.Vector3().copy(axOrigin).addScaledVector(axDir, extend);
        var lineGeo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
        var lineMat = new THREE.LineBasicMaterial({
          color: 0x39ff14, transparent: true, opacity: 0.6,
          depthTest: false, depthWrite: false
        });
        group.add(new THREE.Line(lineGeo, lineMat));
      }

      // Definition point markers (dot + glow)
      for (var k = 0; k < constraint.points.length; k++) {
        var pt = constraint.points[k];
        var ptGroup = new THREE.Group();
        ptGroup.position.copy(pt);
        ptGroup.userData.isDefinitionPoint = true;
        ptGroup.userData.pointIndex = k;

        var dotGeo = new THREE.CircleGeometry(ringInnerRadius, RING_SEGMENTS);
        var dotMesh = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({
          color: 0x39ff14, depthTest: false, depthWrite: false,
          transparent: true, opacity: 0.9, side: THREE.DoubleSide
        }));
        dotMesh.userData.isDefPointRing = true;
        ptGroup.add(dotMesh);

        // Additive glow
        var glow = createGlowSprite(0x39ff14, ringOuterRadius);
        glow.userData.isDefPointRing = true;
        ptGroup.add(glow);

        group.add(ptGroup);
      }

      constraint.visual = group;
      constraintScene.add(group);
      if (constraint.visible === false) group.visible = false;
      updateConstraintVisuals();
    }

    // -- Update visual opacity based on active state --
    function updateConstraintVisuals() {
      for (var ci = 0; ci < constraints.length; ci++) {
        var c = constraints[ci];
        if (!c.visual) continue;
        var isActive = c.id === activeConstraintId;
        c.visual.traverse(function(obj) {
          if (obj.material) {
            if (obj.userData && obj.userData.isDefPointRing) {
              obj.material.opacity = 0.9;
            } else if (obj.isMesh) {
              obj.material.opacity = isActive ? 0.2 : 0.08;
            } else if (obj.isLine || obj.isLineSegments) {
              obj.material.opacity = isActive ? 0.7 : 0.25;
            }
          }
        });
      }
    }

    // -- Rebuild constraint sidebar list --
    function rebuildConstraintList() {
      var listEl = document.getElementById('enable-constraint-list');
      if (!listEl) return;
      listEl.innerHTML = '';

      for (var ci = 0; ci < constraints.length; ci++) {
        (function(c) {
          var row = document.createElement('div');
          row.className = 'constraint-row' + (c.id === activeConstraintId ? ' active' : '');

          var nameSpan = document.createElement('span');
          nameSpan.className = 'constraint-name';
          nameSpan.textContent = c.name;
          row.appendChild(nameSpan);

          var visBtn = document.createElement('button');
          visBtn.className = 'btn-vis' + (c.visible === false ? ' hidden' : '');
          visBtn.textContent = '\uD83D\uDC41';
          visBtn.title = 'Toggle visibility';
          visBtn.addEventListener('click', function() {
            c.visible = !c.visible;
            if (c.visual) c.visual.visible = c.visible;
            visBtn.classList.toggle('hidden', !c.visible);
          });
          row.appendChild(visBtn);

          var lockBtn = document.createElement('button');
          lockBtn.className = 'btn-lock' + (c.locked ? ' locked' : '');
          lockBtn.textContent = c.locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
          lockBtn.title = c.locked ? 'Unlock points' : 'Lock points';
          lockBtn.addEventListener('click', function() {
            c.locked = !c.locked;
            lockBtn.textContent = c.locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
            lockBtn.title = c.locked ? 'Unlock points' : 'Lock points';
            lockBtn.classList.toggle('locked', c.locked);
          });
          row.appendChild(lockBtn);

          if (c.type === 'plane') {
            var orthoBtn = document.createElement('button');
            orthoBtn.className = 'btn-ortho';
            orthoBtn.textContent = '\u2316';
            orthoBtn.title = 'Orthographic view of this plane';
            orthoBtn.addEventListener('click', function() {
              viewPlaneOrtho(c);
            });
            row.appendChild(orthoBtn);
          }

          var activateBtn = document.createElement('button');
          activateBtn.textContent = c.id === activeConstraintId ? 'Active' : 'Activate';
          activateBtn.addEventListener('click', function() {
            if (activeConstraintId === c.id) {
              activeConstraintId = null;
            } else {
              activeConstraintId = c.id;
            }
            rebuildConstraintList();
            updateConstraintVisuals();
          });
          row.appendChild(activateBtn);

          var deleteBtn = document.createElement('button');
          deleteBtn.textContent = '\u00d7';
          deleteBtn.title = 'Delete constraint';
          deleteBtn.addEventListener('click', function() {
            deleteConstraint(c.id);
          });
          row.appendChild(deleteBtn);

          listEl.appendChild(row);
        })(constraints[ci]);
      }
      updateConstraintStatus();
    }

    // -- Delete a constraint --
    function deleteConstraint(id) {
      var idx = -1;
      for (var i = 0; i < constraints.length; i++) {
        if (constraints[i].id === id) { idx = i; break; }
      }
      if (idx === -1) return;
      var c = constraints[idx];
      if (c.visual) {
        c.visual.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) obj.material.dispose();
        });
        constraintScene.remove(c.visual);
      }
      if (activeConstraintId === id) activeConstraintId = null;
      constraints.splice(idx, 1);
      rebuildConstraintList();
      updateConstraintVisuals();
    }

    // -- Update constraint status display --
    function updateConstraintStatus() {
      var el = document.getElementById('enable-constraint-status');
      if (!el) return;
      if (!activeConstraintId) { el.textContent = ''; return; }
      var c = null;
      for (var i = 0; i < constraints.length; i++) {
        if (constraints[i].id === activeConstraintId) { c = constraints[i]; break; }
      }
      if (c) el.textContent = c.name + ' constraint active';
    }

    // -- Find nearest definition point to mouse (screen-space hit test) --
    function findNearestDefinitionPoint(mousePixel) {
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = 25; // pixel threshold
      var bestResult = null;
      for (var ci = 0; ci < constraints.length; ci++) {
        var c = constraints[ci];
        if (c.locked) continue;
        for (var pi = 0; pi < c.points.length; pi++) {
          var pt = c.points[pi].clone().project(camera);
          var screenX = (pt.x * 0.5 + 0.5) * rect.width;
          var screenY = (1 - (pt.y * 0.5 + 0.5)) * rect.height;
          var dx = screenX - mousePixel.x;
          var dy = screenY - mousePixel.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < bestDist) {
            bestDist = dist;
            bestResult = { constraint: c, pointIndex: pi };
          }
        }
      }
      return bestResult;
    }

    // -- Recompute constraint geometry after a point is moved --
    function recomputeConstraint(c) {
      if (c.type === 'plane') {
        var pts = c.points;
        if (pts.length === 3) {
          var v1 = new THREE.Vector3().subVectors(pts[1], pts[0]);
          var v2 = new THREE.Vector3().subVectors(pts[2], pts[0]);
          var normal = new THREE.Vector3().crossVectors(v1, v2);
          if (normal.length() < 0.001) return false;
          normal.normalize();
          c.normal = normal;
          c.plane = new THREE.Plane();
          c.plane.setFromNormalAndCoplanarPoint(normal, pts[0]);
          c.centroid = new THREE.Vector3().add(pts[0]).add(pts[1]).add(pts[2]).divideScalar(3);
        } else if (pts.length > 3) {
          // Re-fit plane from all points
          var centroid = new THREE.Vector3();
          for (var i = 0; i < pts.length; i++) centroid.add(pts[i]);
          centroid.divideScalar(pts.length);
          var xx = 0, xy = 0, xz = 0, yy = 0, yz = 0, zz = 0;
          for (var i = 0; i < pts.length; i++) {
            var dx = pts[i].x - centroid.x, dy = pts[i].y - centroid.y, dz = pts[i].z - centroid.z;
            xx += dx * dx; xy += dx * dy; xz += dx * dz;
            yy += dy * dy; yz += dy * dz; zz += dz * dz;
          }
          var det2 = function(a, b, cd, d) { return a * d - b * cd; };
          var candidates = [
            new THREE.Vector3(det2(xy, xz, yy, yz), det2(xz, xx, yz, xy), det2(xx, xy, xy, yy)),
            new THREE.Vector3(det2(yy, yz, xy, xz), det2(yz, xy, xz, xx), det2(xy, yy, xx, xy)),
            new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 1)
          ];
          var bestNormal = null, bestVar = Infinity;
          for (var ci2 = 0; ci2 < candidates.length; ci2++) {
            var n = candidates[ci2];
            if (n.length() < 0.0001) continue;
            n.normalize();
            var v = 0;
            for (var i = 0; i < pts.length; i++) {
              var d = (pts[i].x - centroid.x) * n.x + (pts[i].y - centroid.y) * n.y + (pts[i].z - centroid.z) * n.z;
              v += d * d;
            }
            if (v < bestVar) { bestVar = v; bestNormal = n.clone(); }
          }
          if (!bestNormal) return false;
          c.normal = bestNormal;
          c.centroid = centroid;
          c.plane = new THREE.Plane();
          c.plane.setFromNormalAndCoplanarPoint(bestNormal, centroid);
        } else {
          return false; // fewer than 3 points
        }
      } else if (c.type === 'axis') {
        var dir = new THREE.Vector3().subVectors(c.points[1], c.points[0]);
        if (dir.length() < 0.001) return false;
        dir.normalize();
        c.direction = dir;
        c.origin = c.points[0].clone();
      }
      return true;
    }

    // -- Rebuild visual for a single constraint (dispose old, build new) --
    function rebuildConstraintVisual(c) {
      if (c.visual) {
        c.visual.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) obj.material.dispose();
        });
        constraintScene.remove(c.visual);
        c.visual = null;
      }
      buildConstraintVisual(c);
    }

    // -- Plane ortho depth slab state --
    var planeOrthoSlab = null;       // the BoxVolume used as depth slab
    var planeOrthoConstraint = null; // which constraint is active for ortho

    // -- Switch to orthographic view aligned to a plane constraint --
    function viewPlaneOrtho(c) {
      if (c.type !== 'plane') return;

      // Switch to orthographic camera mode
      viewer.setCameraMode(Potree.CameraMode.ORTHOGRAPHIC);

      // Position the camera along the plane normal, looking at the centroid.
      // Potree's render loop drives cameras from scene.view (yaw/pitch/position),
      // so we must set view — not camera — properties.
      var normal = c.normal.clone();
      var distance = viewer.scene.view.radius || 50;
      if (distance < 1) distance = 50;

      // Camera position: offset from centroid along the normal
      var camPos = c.centroid.clone().addScaledVector(normal, distance);
      viewer.scene.view.position.copy(camPos);
      viewer.scene.view.lookAt(c.centroid);

      // Create/update depth slab clip box
      planeOrthoConstraint = c;
      createOrUpdateDepthSlab(c, 20, 20);

      // Show depth controls UI
      showDepthControls(c);

      showToast('Ortho view: ' + c.name);
    }

    // -- Create or update the depth slab clip box --
    function createOrUpdateDepthSlab(c, behindMM, frontMM) {
      // Convert mm to scene units (assume metres)
      var behind = behindMM / 1000;
      var front = frontMM / 1000;
      var thickness = behind + front; // total depth
      if (thickness < 0.001) thickness = 0.001;

      // Slab center: offset from plane centroid along normal.
      // "front" is in the normal direction, "behind" is opposite.
      var offset = (front - behind) / 2;
      var center = c.centroid.clone().addScaledVector(c.normal, offset);

      // Orientation: rotate local Y axis to align with plane normal.
      // BoxVolume is a unit cube; scale.y controls thickness along local Y.
      var quat = new THREE.Quaternion().setFromUnitVectors(
        new THREE.Vector3(0, 1, 0), c.normal
      );

      // Lateral size: huge so it doesn't clip laterally
      var lateralSize = 10000;

      if (!planeOrthoSlab) {
        planeOrthoSlab = new Potree.BoxVolume();
        planeOrthoSlab.clip = true;
        planeOrthoSlab.name = 'Plane Depth Slab';
        planeOrthoSlab.visible = true;
        planeOrthoSlab.userData = planeOrthoSlab.userData || {};
        planeOrthoSlab.userData.persistent = true;
        planeOrthoSlab.userData.isDepthSlab = true;
        // Hide the green box visual
        planeOrthoSlab.box.visible = false;
        planeOrthoSlab.frame.visible = false;
        if (planeOrthoSlab.label) planeOrthoSlab.label.visible = false;

        viewer.scene.addVolume(planeOrthoSlab);
        // Switch to INSIDE_ALL so both the main crop box and slab must pass
        viewer.setClipMethod(Potree.ClipMethod.INSIDE_ALL);
      }

      planeOrthoSlab.position.copy(center);
      planeOrthoSlab.quaternion.copy(quat);
      planeOrthoSlab.scale.set(lateralSize, thickness, lateralSize);
      planeOrthoSlab.updateMatrixWorld(true);
      if (typeof planeOrthoSlab.update === 'function') planeOrthoSlab.update();
    }

    // -- Remove the depth slab and restore clip method --
    function removeDepthSlab() {
      if (planeOrthoSlab) {
        // Temporarily allow removal of our persistent slab
        planeOrthoSlab.userData.persistent = false;
        viewer.scene.removeVolume(planeOrthoSlab);
        planeOrthoSlab = null;
      }
      planeOrthoConstraint = null;
      // Restore to INSIDE_ANY (original mode)
      viewer.setClipMethod(Potree.ClipMethod.INSIDE_ANY);
      hideDepthControls();
    }

    // -- Show depth controls UI in sidebar --
    function showDepthControls(c) {
      hideDepthControls();
      var container = document.getElementById('enable-constraint-list');
      if (!container) return;

      var div = document.createElement('div');
      div.id = 'enable-plane-depth-controls';

      div.innerHTML =
        '<div class="depth-title">\u2316 ' + c.name + ' \u2014 Depth Slab</div>' +
        '<div class="depth-row">' +
          '<label>Behind:</label>' +
          '<input type="number" id="depth-behind" value="20" step="5" min="0">' +
          '<span class="unit">mm</span>' +
        '</div>' +
        '<div class="depth-row">' +
          '<label>In front:</label>' +
          '<input type="number" id="depth-front" value="20" step="5" min="0">' +
          '<span class="unit">mm</span>' +
        '</div>' +
        '<button id="btn-exit-plane-ortho">Exit Plane View</button>';

      container.parentNode.insertBefore(div, container.nextSibling);

      // Wire up live updating
      var behindInput = document.getElementById('depth-behind');
      var frontInput = document.getElementById('depth-front');

      function onDepthChange() {
        var behind = parseFloat(behindInput.value) || 0;
        var front = parseFloat(frontInput.value) || 0;
        if (behind < 0) behind = 0;
        if (front < 0) front = 0;
        if (planeOrthoConstraint) {
          createOrUpdateDepthSlab(planeOrthoConstraint, behind, front);
        }
      }
      behindInput.addEventListener('input', onDepthChange);
      frontInput.addEventListener('input', onDepthChange);

      document.getElementById('btn-exit-plane-ortho').addEventListener('click', function() {
        exitPlaneOrtho();
      });
    }

    // -- Hide depth controls UI --
    function hideDepthControls() {
      var el = document.getElementById('enable-plane-depth-controls');
      if (el) el.remove();
    }

    // -- Exit plane ortho mode: remove slab, switch back to perspective --
    function exitPlaneOrtho() {
      removeDepthSlab();
      viewer.setCameraMode(Potree.CameraMode.PERSPECTIVE);
      showToast('Exited plane view');
    }

    // ===== MEMBER SKETCHING FUNCTIONS =====

    // -- Start member pick mode --
    function startMemberPick() {
      if (MARK_MODE) toggleMarkMode(true);
      if (constraintPickMode) cancelConstraintPick();
      memberPickMode = true;
      memberPickPoints = [];
      clearMemberPickMarkers();
      document.body.classList.add('member-pick-mode');
      showToast('Pick endpoint (1/2) for member', 5000);
      var btn = document.getElementById('btn-add-member');
      if (btn) btn.classList.add('active');
    }

    // -- Handle a picked point during member definition --
    function handleMemberPick(position) {
      memberPickPoints.push(position.clone());
      placeMemberPickMarker(position);
      undoStack.push({ type: 'member-point' });
      if (memberPickPoints.length < 2) {
        showToast('Pick endpoint (2/2) for member', 5000);
      } else {
        finalizeMember();
      }
    }

    // -- Cancel member pick mode --
    function cancelMemberPick() {
      memberPickMode = false;
      memberPickPoints = [];
      clearMemberPickMarkers();
      document.body.classList.remove('member-pick-mode');
      var btn = document.getElementById('btn-add-member');
      if (btn) btn.classList.remove('active');
      showToast('Member picking cancelled');
    }

    // -- Place temporary orange marker during member picking --
    function placeMemberPickMarker(position) {
      var ptGroup = new THREE.Group();
      ptGroup.position.copy(position);
      ptGroup.userData.isMemberPickMarker = true;
      // Filled dot at center
      var dotGeo = new THREE.CircleGeometry(ringInnerRadius, RING_SEGMENTS);
      var dotMat = new THREE.MeshBasicMaterial({
        color: 0xff9900, depthTest: false, depthWrite: false,
        transparent: true, opacity: 0.9, side: THREE.DoubleSide
      });
      ptGroup.add(new THREE.Mesh(dotGeo, dotMat));
      // Additive glow
      ptGroup.add(createGlowSprite(0xff9900, ringOuterRadius));
      memberScene.add(ptGroup);
      memberPickMarkers.push(ptGroup);
    }

    // -- Remove temporary member pick markers --
    function clearMemberPickMarkers() {
      for (var i = 0; i < memberPickMarkers.length; i++) {
        var m = memberPickMarkers[i];
        m.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) obj.material.dispose();
        });
        memberScene.remove(m);
      }
      memberPickMarkers.length = 0;
    }

    // -- Finalize member from 2 picked points --
    function finalizeMember() {
      clearMemberPickMarkers();
      var member = {
        id: nextMemberId++,
        name: 'M' + (nextMemberId - 1),
        points: [memberPickPoints[0].clone(), memberPickPoints[1].clone()],
        visual: null,
        visible: true,
        locked: false
      };
      buildMemberVisual(member);
      members.push(member);
      rebuildMemberList();
      // Replace member-point undo entries with a single member entry
      while (undoStack.length > 0 && undoStack[undoStack.length - 1].type === 'member-point') {
        undoStack.pop();
      }
      undoStack.push({ type: 'member', id: member.id });
      showToast(member.name + ' created');

      memberPickMode = false;
      memberPickPoints = [];
      document.body.classList.remove('member-pick-mode');
      var btn = document.getElementById('btn-add-member');
      if (btn) btn.classList.remove('active');
    }

    // -- Create a label sprite with text --
    function createLabelSprite(text, position) {
      var canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 64;
      var ctx = canvas.getContext('2d');
      ctx.font = 'bold 36px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 64, 32);
      var texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      var mat = new THREE.SpriteMaterial({
        map: texture, depthTest: false, depthWrite: false,
        transparent: true, sizeAttenuation: false
      });
      var sprite = new THREE.Sprite(mat);
      sprite.position.copy(position);
      sprite.scale.set(0.08, 0.04, 1);
      sprite.userData.isMemberLabel = true;
      return sprite;
    }

    // -- Build 3D visual for a member --
    function buildMemberVisual(member) {
      var group = new THREE.Group();
      group.name = 'member-' + member.id;

      // Line between endpoints
      var lineGeo = new THREE.BufferGeometry().setFromPoints(member.points);
      var lineMat = new THREE.LineBasicMaterial({
        color: 0xff9900, depthTest: false, depthWrite: false,
        transparent: true, opacity: 0.9, linewidth: 2
      });
      group.add(new THREE.Line(lineGeo, lineMat));

      // Endpoint markers (dot + glow in orange)
      for (var k = 0; k < 2; k++) {
        var ptGroup = new THREE.Group();
        ptGroup.position.copy(member.points[k]);
        ptGroup.userData.isMemberEndpoint = true;
        ptGroup.userData.pointIndex = k;
        // Filled dot at center
        var epDotGeo = new THREE.CircleGeometry(ringInnerRadius, RING_SEGMENTS);
        var epDotMat = new THREE.MeshBasicMaterial({
          color: 0xff9900, depthTest: false, depthWrite: false,
          transparent: true, opacity: 0.9, side: THREE.DoubleSide
        });
        ptGroup.add(new THREE.Mesh(epDotGeo, epDotMat));
        // Additive glow
        ptGroup.add(createGlowSprite(0xff9900, ringOuterRadius));
        group.add(ptGroup);
      }

      // Label sprite at midpoint
      var midpoint = new THREE.Vector3().addVectors(member.points[0], member.points[1]).multiplyScalar(0.5);
      var label = createLabelSprite(member.name, midpoint);
      group.add(label);

      member.visual = group;
      if (member.visible === false) group.visible = false;
      memberScene.add(group);
    }

    // -- Rebuild visual for a member (dispose old, build new) --
    function recomputeMemberVisual(m) {
      if (m.visual) {
        m.visual.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            if (obj.material.map) obj.material.map.dispose();
            obj.material.dispose();
          }
        });
        memberScene.remove(m.visual);
        m.visual = null;
      }
      buildMemberVisual(m);
    }

    // -- Rebuild member sidebar list --
    function rebuildMemberList() {
      var listEl = document.getElementById('enable-member-list');
      if (!listEl) return;
      listEl.innerHTML = '';

      for (var mi = 0; mi < members.length; mi++) {
        (function(m) {
          var row = document.createElement('div');
          row.className = 'member-row';

          var nameSpan = document.createElement('span');
          nameSpan.className = 'member-name';
          nameSpan.textContent = m.name;
          nameSpan.title = 'Click to rename';
          nameSpan.addEventListener('click', function() {
            var input = document.createElement('input');
            input.type = 'text';
            input.value = m.name;
            input.style.cssText = 'width:60px;font:12px/1.3 sans-serif;background:#333;color:#fff;border:1px solid #666;border-radius:2px;padding:1px 3px;';
            nameSpan.replaceWith(input);
            input.focus();
            input.select();
            function commit() {
              var val = input.value.trim();
              if (val && val !== m.name) {
                m.name = val;
                recomputeMemberVisual(m);
              }
              rebuildMemberList();
            }
            input.addEventListener('blur', commit);
            input.addEventListener('keydown', function(ev) {
              if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
              if (ev.key === 'Escape') { ev.preventDefault(); rebuildMemberList(); }
            });
          });
          row.appendChild(nameSpan);

          var visBtn = document.createElement('button');
          visBtn.className = 'btn-vis' + (m.visible === false ? ' hidden' : '');
          visBtn.textContent = '\uD83D\uDC41';
          visBtn.title = 'Toggle visibility';
          visBtn.addEventListener('click', function() {
            m.visible = !m.visible;
            if (m.visual) m.visual.visible = m.visible;
            visBtn.classList.toggle('hidden', !m.visible);
          });
          row.appendChild(visBtn);

          var lockBtn = document.createElement('button');
          lockBtn.className = 'btn-lock' + (m.locked ? ' locked' : '');
          lockBtn.textContent = m.locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
          lockBtn.title = m.locked ? 'Unlock to move' : 'Lock position';
          lockBtn.addEventListener('click', function() {
            m.locked = !m.locked;
            lockBtn.textContent = m.locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
            lockBtn.title = m.locked ? 'Unlock to move' : 'Lock position';
            lockBtn.classList.toggle('locked', m.locked);
          });
          row.appendChild(lockBtn);

          var deleteBtn = document.createElement('button');
          deleteBtn.textContent = '\u00d7';
          deleteBtn.title = 'Delete member';
          deleteBtn.addEventListener('click', function() {
            deleteMember(m.id);
          });
          row.appendChild(deleteBtn);

          listEl.appendChild(row);
        })(members[mi]);
      }
    }

    // -- Delete a member --
    function deleteMember(id) {
      var idx = -1;
      for (var i = 0; i < members.length; i++) {
        if (members[i].id === id) { idx = i; break; }
      }
      if (idx === -1) return;
      var m = members[idx];
      if (m.visual) {
        m.visual.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            if (obj.material.map) obj.material.map.dispose();
            obj.material.dispose();
          }
        });
        memberScene.remove(m.visual);
      }
      members.splice(idx, 1);
      rebuildMemberList();
    }

    // -- Find nearest member endpoint to mouse (screen-space hit test) --
    function findNearestMemberEndpoint(mousePixel) {
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = 25;
      var bestResult = null;
      for (var mi = 0; mi < members.length; mi++) {
        var m = members[mi];
        if (!m.visible || m.locked) continue;
        for (var pi = 0; pi < m.points.length; pi++) {
          var pt = m.points[pi].clone().project(camera);
          var screenX = (pt.x * 0.5 + 0.5) * rect.width;
          var screenY = (1 - (pt.y * 0.5 + 0.5)) * rect.height;
          var dx = screenX - mousePixel.x;
          var dy = screenY - mousePixel.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < bestDist) {
            bestDist = dist;
            bestResult = { member: m, pointIndex: pi };
          }
        }
      }
      return bestResult;
    }

    // -- Find nearest marker (for dragging — skips locked markers) --
    function findNearestMarker(mousePixel) {
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = 25;
      var bestResult = null;
      for (var i = 0; i < markedPoints.length; i++) {
        var m = markedPoints[i];
        if (m.locked || !m.visible) continue;
        var pt = m.visual.position.clone().project(camera);
        var screenX = (pt.x * 0.5 + 0.5) * rect.width;
        var screenY = (1 - (pt.y * 0.5 + 0.5)) * rect.height;
        var dx = screenX - mousePixel.x;
        var dy = screenY - mousePixel.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < bestDist) {
          bestDist = dist;
          bestResult = { mark: m, index: i };
        }
      }
      return bestResult;
    }

    var markerDragActive = false;
    var markerDragInfo = null;

    // -- Find nearest snap target (member endpoints, constraint points, measurement points) --
    function findSnapTarget(mousePixel, threshold) {
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = threshold;
      var bestResult = null;

      function check(worldPos, label) {
        var pt = worldPos.clone().project(camera);
        var screenX = (pt.x * 0.5 + 0.5) * rect.width;
        var screenY = (1 - (pt.y * 0.5 + 0.5)) * rect.height;
        var dx = screenX - mousePixel.x;
        var dy = screenY - mousePixel.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < bestDist) {
          bestDist = dist;
          bestResult = { position: worldPos.clone(), label: label };
        }
      }

      // Member endpoints
      for (var mi = 0; mi < members.length; mi++) {
        var m = members[mi];
        if (!m.visible) continue;
        check(m.points[0], m.name + ' start');
        check(m.points[1], m.name + ' end');
      }

      // Constraint definition points
      for (var ci = 0; ci < constraints.length; ci++) {
        var c = constraints[ci];
        if (!c.visible) continue;
        for (var pi = 0; pi < c.points.length; pi++) {
          check(c.points[pi], c.name + ' pt' + (pi + 1));
        }
      }

      // Measurement points
      var measurements = viewer.scene.measurements || [];
      for (var i = 0; i < measurements.length; i++) {
        var meas = measurements[i];
        var nums = measurePointNumbers.get(meas);
        for (var j = 0; j < meas.points.length; j++) {
          var pos = meas.points[j].position || meas.points[j];
          var pLabel = nums && j < nums.length ? 'D' + nums[j] : 'D?';
          check(pos, pLabel);
        }
      }

      return bestResult;
    }

    // -- Export members as DXF --
    function exportMembersDXF() {
      if (members.length === 0) {
        showToast('No members to export');
        return;
      }
      var lines = [];
      lines.push('0', 'SECTION', '2', 'TABLES');
      lines.push('0', 'TABLE', '2', 'LAYER', '70', '' + members.length);
      for (var i = 0; i < members.length; i++) {
        lines.push('0', 'LAYER', '2', members[i].name, '70', '0', '62', '7', '6', 'CONTINUOUS');
      }
      lines.push('0', 'ENDTAB');
      lines.push('0', 'ENDSEC');
      lines.push('0', 'SECTION', '2', 'ENTITIES');
      for (var j = 0; j < members.length; j++) {
        var m = members[j];
        lines.push('0', 'LINE', '8', m.name);
        lines.push('10', '' + m.points[0].x, '20', '' + m.points[0].y, '30', '' + m.points[0].z);
        lines.push('11', '' + m.points[1].x, '21', '' + m.points[1].y, '31', '' + m.points[1].z);
      }
      lines.push('0', 'ENDSEC');
      lines.push('0', 'EOF');
      var content = lines.join('\n');
      var blob = new Blob([content], { type: 'application/dxf' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'members.dxf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Exported ' + members.length + ' member(s) to DXF');
    }

    // -- Render constraint + member visuals in overlay pass --
    viewer.addEventListener("render.pass.perspective_overlay", function(e) {
      var camera = viewer.scene.getActiveCamera();

      // Constraint visuals
      if (constraintScene.children.length > 0) {
        for (var ci = 0; ci < constraints.length; ci++) {
          var c = constraints[ci];
          if (!c.visual) continue;
          c.visual.traverse(function(obj) {
            if (obj.userData && obj.userData.isDefinitionPoint) {
              obj.quaternion.copy(camera.quaternion);
            }
          });
        }
