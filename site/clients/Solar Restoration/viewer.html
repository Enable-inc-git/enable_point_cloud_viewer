        viewer.renderer.render(constraintScene, camera);
      }

      // Member visuals
      if (memberScene.children.length > 0) {
        for (var mi = 0; mi < members.length; mi++) {
          var m = members[mi];
          if (!m.visual) continue;
          m.visual.traverse(function(obj) {
            if (obj.userData && obj.userData.isMemberEndpoint) {
              obj.quaternion.copy(camera.quaternion);
            }
          });
        }
        // Billboard pick markers too
        for (var pi = 0; pi < memberPickMarkers.length; pi++) {
          memberPickMarkers[pi].quaternion.copy(camera.quaternion);
        }
        viewer.renderer.render(memberScene, camera);
      }

      // Measurement point labels — offset above point, scale, render
      if (measureLabelScene.children.length > 0) {
        var cw = viewer.renderer.getSize(new THREE.Vector2()).width;
        var ch = viewer.renderer.getSize(new THREE.Vector2()).height;
        var isOrtho = camera instanceof THREE.OrthographicCamera;
        measurePointLabels.forEach(function(labels, measure) {
          for (var li = 0; li < labels.length; li++) {
            var lbl = labels[li];
            var pt = measure.points[li];
            if (!pt) continue;
            var worldPos = pt.position ? pt.position : pt;
            var dist = camera.position.distanceTo(worldPos);
            var pr = Potree.Utils.projectedRadius(1, camera, dist, cw, ch);
            var s = (70 / pr);
            lbl.scale.set(s, s, s);

            // Offset label above the point in screen space
            var screenPos = worldPos.clone().project(camera);
            var screenX = (screenPos.x + 1) * cw / 2;
            var screenY = (-screenPos.y + 1) * ch / 2;
            screenY -= 30; // 30 pixels above the dot

            // Unproject back to world — works for both perspective and ortho
            var ndcX = (screenX / cw) * 2 - 1;
            var ndcY = -(screenY / ch) * 2 + 1;
            var nearPoint = new THREE.Vector3(ndcX, ndcY, screenPos.z).unproject(camera);

            if (isOrtho) {
              // For ortho, unprojected point is already at the right world position
              lbl.position.copy(nearPoint);
            } else {
              // For perspective, project along the ray from camera to get correct depth
              var dir = nearPoint.sub(camera.position).normalize();
              lbl.position.copy(camera.position.clone().add(dir.multiplyScalar(dist)));
            }
          }
        });
        viewer.renderer.render(measureLabelScene, camera);
      }
    });

    // -- Toggle mark mode --
    function toggleMarkMode(forceOff) {
      if (forceOff) {
        MARK_MODE = false;
      } else {
        MARK_MODE = !MARK_MODE;
      }
      if (MARK_MODE && constraintPickMode) cancelConstraintPick();
      if (MARK_MODE && memberPickMode) cancelMemberPick();
      document.body.classList.toggle('mark-mode', MARK_MODE);
      showToast(MARK_MODE ? "Mark mode ON  (click to mark, X or ESC to exit)" : "Mark mode OFF");
      // Update button state
      const btn = document.getElementById('btn-mark-mode');
      if (btn) btn.classList.toggle('active', MARK_MODE);
    }

    // ===== MEASUREMENT POINT LABEL FUNCTIONS =====

    // -- Create a Potree TextSprite label for measurement points --
    function createMeasurePointLabel(text, position) {
      var label = new Potree.TextSprite(text);
      label.setTextColor({r: 255, g: 0, b: 0, a: 1.0});
      label.setBorderColor({r: 0, g: 0, b: 0, a: 0.0});
      label.setBackgroundColor({r: 0, g: 0, b: 0, a: 0.0});
      label.fontsize = 16;
      label.material.depthTest = false;
      label.material.depthWrite = false;
      label.material.transparent = true;
      label.position.copy(position);
      label.userData.isMeasureLabel = true;
      return label;
    }

    // -- Get the D-name for a given point index within a measure --
    function getPointName(measure, idx) {
      var nums = measurePointNumbers.get(measure);
      if (nums && idx < nums.length) return 'D' + nums[idx];
      return 'D?';
    }

    // -- Sync labels for a measurement (create/remove/update) --
    function syncMeasurePointLabels(measure) {
      var labels = measurePointLabels.get(measure);
      if (!labels) { labels = []; measurePointLabels.set(measure, labels); }
      var nums = measurePointNumbers.get(measure);
      if (!nums) { nums = []; measurePointNumbers.set(measure, nums); }

      var pts = measure.points;

      // Reclaim P-numbers for removed ghost points (e.g. ESC during measurement)
      while (nums.length > pts.length) {
        var removed = nums.pop();
        // Reclaim if it was the very latest assigned number
        if (removed === nextPointNumber - 1) {
          nextPointNumber--;
        }
      }

      // Assign global P-numbers to any new points
      while (nums.length < pts.length) {
        nums.push(nextPointNumber++);
      }

      // Remove excess labels
      while (labels.length > pts.length) {
        var old = labels.pop();
        measureLabelScene.remove(old);
        old.traverse(function(obj) {
          if (obj.material) {
            if (obj.material.map) obj.material.map.dispose();
            obj.material.dispose();
          }
        });
      }
      // Create missing labels
      while (labels.length < pts.length) {
        var idx = labels.length;
        var pos = pts[idx].position ? pts[idx].position.clone() : pts[idx].clone();
        var lbl = createMeasurePointLabel('D' + nums[idx], pos);
        lbl.visible = measure.visible;
        measureLabelScene.add(lbl);
        labels.push(lbl);
      }
      // Update positions
      for (var i = 0; i < labels.length; i++) {
        var p = pts[i].position ? pts[i].position : pts[i];
        labels[i].position.copy(p);
        labels[i].visible = measure.visible;
      }
    }

    // -- Remove all labels for a measurement --
    function removeMeasurePointLabels(measure) {
      var labels = measurePointLabels.get(measure);
      if (labels) {
        for (var i = 0; i < labels.length; i++) {
          measureLabelScene.remove(labels[i]);
          labels[i].traverse(function(obj) {
            if (obj.material) {
              if (obj.material.map) obj.material.map.dispose();
              obj.material.dispose();
            }
          });
        }
        measurePointLabels.delete(measure);
      }
      measurePointNumbers.delete(measure);
    }

    // -- Hook measurement events for labels + sidebar --
    var _measListTimer = null;
    function debouncedRebuildMeasList() {
      clearTimeout(_measListTimer);
      _measListTimer = setTimeout(rebuildMeasurementList, 80);
    }

    function setupMeasurementLabelEvents() {
      viewer.scene.addEventListener('measurement_added', function(e) {
        var m = e.measurement;
        syncMeasurePointLabels(m);
        rebuildMeasurementList();
        m.addEventListener('marker_added', function() {
          syncMeasurePointLabels(m);
          debouncedRebuildMeasList();
          undoStack.push({ type: 'measurement-point', measure: m });
        });
        m.addEventListener('marker_moved', function() {
          syncMeasurePointLabels(m);
          debouncedRebuildMeasList();
        });
        m.addEventListener('marker_removed', function() {
          syncMeasurePointLabels(m);
          debouncedRebuildMeasList();
        });
      });
      viewer.scene.addEventListener('measurement_removed', function(e) {
        removeMeasurePointLabels(e.measurement);
        rebuildMeasurementList();
      });
    }

    // ===== PERSISTENT MEASUREMENT SIDEBAR LIST =====

    function rebuildMeasurementList() {
      var listEl = document.getElementById('enable-measurement-list');
      if (!listEl) return;
      var measurements = viewer.scene.measurements || [];
      // Only show distance measurements
      var distMeasures = [];
      for (var i = 0; i < measurements.length; i++) {
        var m = measurements[i];
        if (m.showDistances && !m.showArea && !m.showAngles) distMeasures.push(m);
      }

      if (distMeasures.length === 0) {
        listEl.innerHTML = '';
        return;
      }

      var html = '';
      for (var mi = 0; mi < distMeasures.length; mi++) {
        var measure = distMeasures[mi];
        var nums = measurePointNumbers.get(measure);
        var pts = measure.points;
        if (!nums || pts.length < 2) {
          // Show placeholder for incomplete measurement
          var pName = (nums && nums.length > 0) ? 'D' + nums[0] : '...';
          html += '<div class="enable-meas-item">' +
            '<div class="meas-header"><span class="meas-title">' + pName + '... (picking)</span></div>' +
            '</div>';
          continue;
        }

        var firstName = 'D' + nums[0];
        var lastName = 'D' + nums[nums.length - 1];
        html += '<div class="enable-meas-item">' +
          '<div class="meas-header">' +
          '<span class="meas-title">' + firstName + ' \u2192 ' + lastName + '</span>' +
          '<button class="meas-delete" data-meas-idx="' + mi + '" title="Delete measurement">\u00d7</button>' +
          '</div>';

        var total3D = 0, totalXY = 0, totalZ = 0;
        for (var si = 0; si < pts.length - 1; si++) {
          var a = pts[si].position ? pts[si].position : pts[si];
          var b = pts[si + 1].position ? pts[si + 1].position : pts[si + 1];
          var dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
          var d3d = Math.sqrt(dx * dx + dy * dy + dz * dz);
          var dxy = Math.sqrt(dx * dx + dy * dy);
          var absZ = Math.abs(dz);
          var zSign = dz >= 0 ? '+' : '-';
          total3D += d3d; totalXY += dxy; totalZ += absZ;

          html += '<div class="enable-meas-seg">' +
            '<span class="seg-name">D' + nums[si] + '\u2192D' + nums[si + 1] + '</span>' +
            '<span class="seg-vals">3D:' + d3d.toFixed(3) + ' XY:' + dxy.toFixed(3) + ' Z:' + absZ.toFixed(3) + '(' + zSign + ')</span>' +
            '</div>';
        }
        // Total row if multi-segment
        if (pts.length > 2) {
          html += '<div class="enable-meas-seg seg-total">' +
            '<span class="seg-name">Total</span>' +
            '<span class="seg-vals">3D:' + total3D.toFixed(3) + ' XY:' + totalXY.toFixed(3) + ' Z:' + totalZ.toFixed(3) + '</span>' +
            '</div>';
        }
        html += '</div>';
      }
      listEl.innerHTML = html;

      // Bind delete buttons
      listEl.querySelectorAll('.meas-delete').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var idx = parseInt(btn.getAttribute('data-meas-idx'));
          if (distMeasures[idx]) {
            viewer.scene.removeMeasurement(distMeasures[idx]);
          }
        });
      });
    }

    // ===== EXPORT ALL MEASUREMENTS TO TXT =====
    function exportAllMeasurements() {
      var measurements = viewer.scene.measurements || [];
      var distMeasures = [];
      for (var i = 0; i < measurements.length; i++) {
        var m = measurements[i];
        if (m.showDistances && !m.showArea && !m.showAngles && m.points.length >= 2) {
          distMeasures.push(m);
        }
      }
      if (distMeasures.length === 0) { showToast('No measurements to export'); return; }

      var lines = [];
      lines.push('Measurements Export');
      lines.push('Total measurements: ' + distMeasures.length);
      lines.push('');

      for (var mi = 0; mi < distMeasures.length; mi++) {
        var measure = distMeasures[mi];
        var nums = measurePointNumbers.get(measure) || [];
        var pts = measure.points;

        var firstName = nums.length > 0 ? 'D' + nums[0] : 'D?';
        var lastName = nums.length > 0 ? 'D' + nums[nums.length - 1] : 'D?';
        lines.push('=== Measurement ' + (mi + 1) + ': ' + firstName + ' -> ' + lastName + ' ===');
        lines.push('');

        lines.push('Point Coordinates:');
        for (var pi = 0; pi < pts.length; pi++) {
          var p = pts[pi].position ? pts[pi].position : pts[pi];
          var pn = pi < nums.length ? 'D' + nums[pi] : 'D?';
          lines.push('  ' + pn + ': X=' + p.x.toFixed(4) + ', Y=' + p.y.toFixed(4) + ', Z=' + p.z.toFixed(4));
        }
        lines.push('');

        lines.push('Segment Distances:');
        var total3D = 0, totalXY = 0, totalZ = 0;
        for (var si = 0; si < pts.length - 1; si++) {
          var a = pts[si].position ? pts[si].position : pts[si];
          var b = pts[si + 1].position ? pts[si + 1].position : pts[si + 1];
          var dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
          var d3d = Math.sqrt(dx * dx + dy * dy + dz * dz);
          var dxy = Math.sqrt(dx * dx + dy * dy);
          var absZ = Math.abs(dz);
          var zSign = dz >= 0 ? '(+)' : '(-)';
          total3D += d3d; totalXY += dxy; totalZ += absZ;
          var sn1 = si < nums.length ? 'D' + nums[si] : 'D?';
          var sn2 = (si + 1) < nums.length ? 'D' + nums[si + 1] : 'D?';
          lines.push('  ' + sn1 + ' -> ' + sn2 + ':  3D: ' + d3d.toFixed(3) + '  XY: ' + dxy.toFixed(3) + '  Z: ' + absZ.toFixed(3) + ' ' + zSign);
        }
        lines.push('');
        lines.push('Totals:  3D: ' + total3D.toFixed(3) + '  XY: ' + totalXY.toFixed(3) + '  Z: ' + totalZ.toFixed(3));
        lines.push('');
      }

      var content = lines.join('\n');
      var blob = new Blob([content], { type: 'text/plain' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'measurements.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Exported ' + distMeasures.length + ' measurement(s) to .txt');
    }

    // ===== SAVE / LOAD SESSION =====

    function v3toObj(v) { return { x: v.x, y: v.y, z: v.z }; }

    function serializeSession() {
      var data = {
        version: 1,
        pointCloudID: pointCloudID,
        constraints: constraints.map(function(c) {
          return {
            id: c.id, type: c.type, name: c.name,
            points: c.points.map(v3toObj),
            visible: c.visible, locked: !!c.locked
          };
        }),
        activeConstraintId: activeConstraintId,
        nextConstraintId: nextConstraintId,
        members: members.map(function(m) {
          return {
            id: m.id, name: m.name,
            points: m.points.map(v3toObj),
            visible: m.visible
          };
        }),
        nextMemberId: nextMemberId,
        measurements: (function() {
          var arr = [];
          var allMeas = viewer.scene.measurements || [];
          for (var i = 0; i < allMeas.length; i++) {
            var m = allMeas[i];
            if (!m.showDistances || m.showArea || m.showAngles) continue;
            var pts = [];
            for (var j = 0; j < m.points.length; j++) {
              var p = m.points[j].position || m.points[j];
              pts.push(v3toObj(p));
            }
            var nums = measurePointNumbers.get(m) || [];
            arr.push({ points: pts, pointNumbers: nums.slice() });
          }
          return arr;
        })(),
        nextPointNumber: nextPointNumber,
        nextMarkId: nextMarkId,
        marks: markedPoints.map(function(m) {
          return { id: m.id, name: m.name, locked: m.locked, visible: m.visible, position: v3toObj(m.visual.position) };
        })
      };
      return data;
    }

    function saveSessionToFile() {
      var data = serializeSession();
      var json = JSON.stringify(data, null, 2);
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      var date = new Date().toISOString().slice(0, 10);
      a.download = 'session_' + pointCloudID + '_' + date + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Session saved');
    }

    function loadSession(data) {
      // Validate
      if (!data || data.version !== 1) {
        showToast('Invalid session file');
        return;
      }
      if (data.pointCloudID && data.pointCloudID !== pointCloudID) {
        showToast('Warning: session is for "' + data.pointCloudID + '", current is "' + pointCloudID + '"', 4000);
      }

      // Clear existing state
      clearAllMarkers();
      while (constraints.length > 0) {
        deleteConstraint(constraints[constraints.length - 1].id);
      }
      while (members.length > 0) {
        deleteMember(members[members.length - 1].id);
      }
      var existingMeas = (viewer.scene.measurements || []).slice();
      for (var i = 0; i < existingMeas.length; i++) {
        viewer.scene.removeMeasurement(existingMeas[i]);
      }
      undoStack.length = 0;

      // Restore constraints
      if (data.constraints) {
        for (var ci = 0; ci < data.constraints.length; ci++) {
          var sc = data.constraints[ci];
          var pts = sc.points.map(function(p) { return new THREE.Vector3(p.x, p.y, p.z); });
          var c = {
            id: sc.id, type: sc.type, name: sc.name,
            points: pts, visual: null,
            visible: sc.visible !== false,
            locked: !!sc.locked
          };
          recomputeConstraint(c);
          buildConstraintVisual(c);
          constraints.push(c);
        }
      }
      activeConstraintId = data.activeConstraintId || null;
      nextConstraintId = data.nextConstraintId || (constraints.length + 1);
      rebuildConstraintList();
      updateConstraintVisuals();

      // Restore members
      if (data.members) {
        for (var mi = 0; mi < data.members.length; mi++) {
          var sm = data.members[mi];
          var m = {
            id: sm.id, name: sm.name,
            points: sm.points.map(function(p) { return new THREE.Vector3(p.x, p.y, p.z); }),
            visual: null,
            visible: sm.visible !== false
          };
          buildMemberVisual(m);
          members.push(m);
        }
      }
      nextMemberId = data.nextMemberId || (members.length + 1);
      rebuildMemberList();

      // Restore measurements
      nextPointNumber = data.nextPointNumber || 1;
      if (data.measurements) {
        for (var mi2 = 0; mi2 < data.measurements.length; mi2++) {
          var sm2 = data.measurements[mi2];
          if (!sm2.points || sm2.points.length < 2) continue;
          var measure = new Potree.Measure();
          measure.showDistances = true;
          measure.showArea = false;
          measure.showAngles = false;
          measure.closed = false;
          for (var pi = 0; pi < sm2.points.length; pi++) {
            var pp = sm2.points[pi];
            measure.addMarker(new THREE.Vector3(pp.x, pp.y, pp.z));
          }
          viewer.scene.addMeasurement(measure);
          // Override auto-assigned P-numbers with saved ones
          if (sm2.pointNumbers && sm2.pointNumbers.length > 0) {
            measurePointNumbers.set(measure, sm2.pointNumbers.slice());
            syncMeasurePointLabels(measure);
          }
        }
      }
      rebuildMeasurementList();

      // Restore marks
      if (data.marks) {
        for (var mk = 0; mk < data.marks.length; mk++) {
          var sm = data.marks[mk];
          // Support both old format (just {x,y,z}) and new format ({id, name, position, ...})
          var pos = sm.position ? sm.position : sm;
          placeMarker(new THREE.Vector3(pos.x, pos.y, pos.z));
          // Override auto-assigned properties with saved ones
          var placed = markedPoints[markedPoints.length - 1];
          if (sm.id) placed.id = sm.id;
          if (sm.name) placed.name = sm.name;
          if (sm.locked !== undefined) placed.locked = sm.locked;
          if (sm.visible !== undefined) { placed.visible = sm.visible; placed.visual.visible = sm.visible; }
        }
      }
      if (data.nextMarkId) nextMarkId = data.nextMarkId;
      rebuildMarkList();
      // Clear undo stack from restore operations
      undoStack.length = 0;

      showToast('Session loaded');
    }

    function loadSessionFromFile() {
      var input = document.getElementById('session-file-input');
      if (!input) return;
      input.click();
    }

    // -- Inject sidebar buttons once GUI is ready --
    function injectMarkButtons() {
      const $tools = $('#tools');
      if ($tools.length === 0) { setTimeout(injectMarkButtons, 200); return; }

      const html = '<div id="enable-mark-buttons">' +
        '<button id="btn-mark-mode" title="X marks the spot (shortcut: X)">Mark Point</button>' +
        '<button id="btn-clear-marks" title="Clear all markers (shortcut: Z)">Clear Marks</button>' +
        '</div>' +
        '<div id="enable-mark-list"></div>' +
        '<div id="enable-constraint-buttons">' +
        '<button id="btn-set-plane" title="Define a constraint plane (3 points)">Set Plane</button>' +
        '<button id="btn-fit-plane" title="Best-fit plane from many points (Enter to finalize)">Fit Plane</button>' +
        '<button id="btn-set-axis" title="Define a constraint axis (2 points)">Set Axis</button>' +
        '</div>' +
        '<div id="enable-constraint-list"></div>' +
        '<div id="enable-constraint-status"></div>' +
        '<div id="enable-member-buttons">' +
        '<button id="btn-add-member" title="Sketch a structural member (shortcut: M)">Add Member</button>' +
        '</div>' +
        '<div id="enable-member-list"></div>' +
        '<div id="enable-member-buttons-export">' +
        '<button id="btn-export-dxf" title="Export all members as DXF">Export DXF</button>' +
        '</div>' +
        '<div id="enable-measurement-list"></div>' +
        '<div id="enable-measurement-buttons-export">' +
        '<button id="btn-export-measurements" title="Export all measurements to .txt">Export Measurements (.txt)</button>' +
        '</div>' +
        '<div id="enable-session-buttons">' +
        '<button id="btn-save-session" title="Save all work to a file">Save Session</button>' +
        '<button id="btn-load-session" title="Load a saved session file">Load Session</button>' +
        '</div>' +
        '<input type="file" id="session-file-input" accept=".json" style="display:none">';
      $tools.after(html);

      document.getElementById('btn-mark-mode').addEventListener('click', function() { toggleMarkMode(); });
      document.getElementById('btn-clear-marks').addEventListener('click', function() { clearAllMarkers(); });
      document.getElementById('btn-set-plane').addEventListener('click', function() { startConstraintPick('plane'); });
      document.getElementById('btn-fit-plane').addEventListener('click', function() { startConstraintPick('fit-plane'); });
      document.getElementById('btn-set-axis').addEventListener('click', function() { startConstraintPick('axis'); });
      document.getElementById('btn-add-member').addEventListener('click', function() { startMemberPick(); });
      document.getElementById('btn-export-dxf').addEventListener('click', function() { exportMembersDXF(); });
      document.getElementById('btn-export-measurements').addEventListener('click', function() { exportAllMeasurements(); });
      document.getElementById('btn-save-session').addEventListener('click', function() { saveSessionToFile(); });
      document.getElementById('btn-load-session').addEventListener('click', function() { loadSessionFromFile(); });
      document.getElementById('session-file-input').addEventListener('change', function(e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
          try {
            var data = JSON.parse(ev.target.result);
            loadSession(data);
          } catch (err) {
            showToast('Failed to parse session file');
            console.error(err);
          }
        };
        reader.readAsText(file);
        e.target.value = ''; // allow re-loading same file
      });

      // Version footer at bottom of sidebar
      var sidebar = document.getElementById('potree_sidebar_container');
      if (sidebar) {
        var footer = document.createElement('div');
        footer.id = 'enable-version-footer';
        footer.innerHTML =
          'Enable Point Cloud Viewer v1.0<br>' +
          'Powered by <a href="http://potree.org" target="_blank" rel="noopener">Potree</a>' +
          ' \u00a9 2011\u20132020 Markus Sch\u00fctz. BSD 2-Clause License.';
        sidebar.appendChild(footer);
      }
    }
    injectMarkButtons();

    // -- Setup measurement point labels (immediate — viewer.scene exists from init) --
    setupMeasurementLabelEvents();

    // -- Speed lock: let user override auto-speed via slider, with reset button --
    var SPEED_MAX = 7;
    function setupSpeedLock() {
      var sld = document.getElementById('sldMoveSpeed');
      if (!sld) { setTimeout(setupSpeedLock, 200); return; }

      // Set our auto-speed cap
      viewer._autoSpeedMax = SPEED_MAX;

      // Reconfigure slider: linear 0–SPEED_MAX instead of Potree's exponential 0–10001
      $(sld).slider('destroy');
      $(sld).slider({
        value: viewer.getMoveSpeed(),
        min: 0,
        max: SPEED_MAX,
        step: 0.1,
        slide: function(event, ui) {
          viewer._speedLocked = true;
          viewer.setMoveSpeed(ui.value);
        }
      });

      // Keep slider + label in sync when speed changes (auto or manual)
      var lbl = document.getElementById('lblMoveSpeed');
      viewer.addEventListener('move_speed_changed', function() {
        var speed = viewer.getMoveSpeed();
        if (lbl) lbl.textContent = speed.toFixed(1);
        $(sld).slider('value', speed);
      });
      if (lbl) lbl.textContent = viewer.getMoveSpeed().toFixed(1);

      // Add reset button next to the speed label
      if (lbl) {
        var resetBtn = document.createElement('span');
        resetBtn.textContent = '\u21BA';
        resetBtn.title = 'Reset to auto speed';
        resetBtn.style.cssText = 'cursor:pointer;margin-left:6px;font-size:14px;opacity:0.6;';
        resetBtn.addEventListener('mouseenter', function() { resetBtn.style.opacity = '1'; });
        resetBtn.addEventListener('mouseleave', function() { resetBtn.style.opacity = '0.6'; });
        resetBtn.addEventListener('click', function() {
          viewer._speedLocked = false;
        });
        lbl.parentNode.insertBefore(resetBtn, lbl.nextSibling);
      }
    }
    setupSpeedLock();

    // -- Click handler with drag guard + constraint point dragging --
    let mouseDownPos = null;

    renderArea.addEventListener('mousedown', function(e) {
      // Check if clicking near an unlocked marker (for dragging)
      if (e.button === 0 && markedPoints.length > 0 && !memberPickMode && !constraintPickMode && !MARK_MODE) {
        var rect = renderArea.getBoundingClientRect();
        var mousePixel = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        var markerHit = findNearestMarker(mousePixel);
        if (markerHit) {
          markerDragActive = true;
          markerDragInfo = markerHit;
          document.body.classList.add('marker-drag');
          e.stopPropagation();
          mouseDownPos = null;
          return;
        }
      }
      // Check if clicking near a member endpoint (for dragging) — check before constraints
      if (e.button === 0 && members.length > 0 && !memberPickMode && !constraintPickMode && !MARK_MODE) {
        var rect = renderArea.getBoundingClientRect();
        var mousePixel = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        var memberHit = findNearestMemberEndpoint(mousePixel);
        if (memberHit) {
          memberDragActive = true;
          memberDragInfo = memberHit;
          document.body.classList.add('member-drag');
          e.stopPropagation();
          mouseDownPos = null;
          return;
        }
      }
      // Check if clicking near a constraint definition point (for dragging)
      if (e.button === 0 && constraints.length > 0 && !constraintPickMode && !MARK_MODE && !memberPickMode) {
        var rect = renderArea.getBoundingClientRect();
        var mousePixel = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        var hit = findNearestDefinitionPoint(mousePixel);
        if (hit) {
          constraintDragActive = true;
          constraintDragInfo = hit;
          document.body.classList.add('constraint-drag');
          e.stopPropagation();
          mouseDownPos = null;
          return;
        }
      }
      if (!MARK_MODE && !constraintPickMode && !memberPickMode) return;
      if (e.button !== 0) return; // left-click only for placing points
      mouseDownPos = { x: e.clientX, y: e.clientY };
    }, true);

    // -- Hover highlight state (persists across mousemove calls) --
    var _hoveredGroup = null;
    var HOVER_THRESHOLD = 12; // pixels

    renderArea.addEventListener('mousemove', function(e) {
      // Marker dragging
      if (markerDragActive && markerDragInfo) {
        var rect = renderArea.getBoundingClientRect();
        var mouse = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        var camera = viewer.scene.getActiveCamera();
        var pickResult = _origPick(mouse, camera, viewer, viewer.scene.pointclouds, { pickClipped: true });
        if (pickResult && pickResult.location) {
          markerDragInfo.mark.visual.position.copy(pickResult.location);
        }
        return;
      }
      // Member endpoint dragging
      if (memberDragActive && memberDragInfo) {
        var rect = renderArea.getBoundingClientRect();
        var mouse = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        var camera = viewer.scene.getActiveCamera();
        var pickResult = _origPick(mouse, camera, viewer, viewer.scene.pointclouds, { pickClipped: true });
        if (pickResult && pickResult.location) {
          memberDragInfo.member.points[memberDragInfo.pointIndex] = pickResult.location.clone();
          recomputeMemberVisual(memberDragInfo.member);
        }
        return;
      }
      // Constraint definition point dragging
      if (constraintDragActive && constraintDragInfo) {
        var rect = renderArea.getBoundingClientRect();
        var mouse = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        var camera = viewer.scene.getActiveCamera();
        var pickResult = _origPick(mouse, camera, viewer, viewer.scene.pointclouds, { pickClipped: true });
        if (pickResult && pickResult.location) {
          var c = constraintDragInfo.constraint;
          c.points[constraintDragInfo.pointIndex] = pickResult.location.clone();
          if (recomputeConstraint(c)) {
            rebuildConstraintVisual(c);
          }
        }
        return;
      }

    // -- Hover highlight: scale up glow when cursor is near a custom point --
    var rect2 = renderArea.getBoundingClientRect();
    var mousePixel2 = { x: e.clientX - rect2.left, y: e.clientY - rect2.top };
    var cam = viewer.scene.getActiveCamera();
    var bestHoverDist = HOVER_THRESHOLD;
    var bestHoverGroup = null;

    var checkHover = function(worldPos, group) {
      var pt = worldPos.clone().project(cam);
      var sx = (pt.x * 0.5 + 0.5) * rect2.width;
      var sy = (1 - (pt.y * 0.5 + 0.5)) * rect2.height;
      var dx = sx - mousePixel2.x, dy = sy - mousePixel2.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < bestHoverDist) {
        bestHoverDist = dist;
        bestHoverGroup = group;
      }
    };

    // Check mark points (skip locked)
    for (var hi = 0; hi < markedPoints.length; hi++) {
      var hm = markedPoints[hi];
      if (hm.visible && !hm.locked) checkHover(hm.visual.position, hm.visual);
    }
    // Check constraint definition points (skip locked)
    for (var hi2 = 0; hi2 < constraints.length; hi2++) {
      var hc = constraints[hi2];
      if (!hc.visible || !hc.visual || hc.locked) continue;
      for (var hj = 0; hj < hc.visual.children.length; hj++) {
        var child = hc.visual.children[hj];
        if (child.userData && child.userData.isDefinitionPoint) {
          checkHover(child.getWorldPosition(new THREE.Vector3()), child);
        }
      }
    }
    // Check member endpoints (skip locked)
    for (var hi3 = 0; hi3 < members.length; hi3++) {
      var hmm = members[hi3];
      if (!hmm.visible || !hmm.visual || hmm.locked) continue;
      for (var hj2 = 0; hj2 < hmm.visual.children.length; hj2++) {
        var child2 = hmm.visual.children[hj2];
        if (child2.userData && child2.userData.isMemberEndpoint) {
          checkHover(child2.getWorldPosition(new THREE.Vector3()), child2);
        }
      }
    }

    // Apply/remove hover effect (lighten center dot color)
    if (_hoveredGroup !== bestHoverGroup) {
      // Remove previous hover — restore original color
      if (_hoveredGroup && _hoveredGroup.userData._origDotColor !== undefined) {
        _hoveredGroup.traverse(function(obj) {
          if (obj.isMesh && obj.geometry && obj.geometry.type === 'CircleGeometry') {
            obj.material.color.setHex(_hoveredGroup.userData._origDotColor);
          }
        });
        delete _hoveredGroup.userData._origDotColor;
      }
      // Apply new hover — lighten dot to near-white tint
      if (bestHoverGroup) {
        bestHoverGroup.traverse(function(obj) {
          if (obj.isMesh && obj.geometry && obj.geometry.type === 'CircleGeometry') {
            if (bestHoverGroup.userData._origDotColor === undefined) {
              bestHoverGroup.userData._origDotColor = obj.material.color.getHex();
            }
            // Lerp toward white for a highlight effect
            var orig = new THREE.Color(bestHoverGroup.userData._origDotColor);
            obj.material.color.copy(orig).lerp(new THREE.Color(0xffffff), 0.7);
          }
        });
        renderArea.style.cursor = 'pointer';
      } else {
        renderArea.style.cursor = '';
      }
      _hoveredGroup = bestHoverGroup;
    }

    }, true);

    renderArea.addEventListener('mouseup', function(e) {
      // Finalize marker drag
      if (markerDragActive) {
        markerDragActive = false;
        markerDragInfo = null;
        document.body.classList.remove('marker-drag');
        return;
      }

      // Finalize member endpoint drag
      if (memberDragActive) {
        memberDragActive = false;
        memberDragInfo = null;
        document.body.classList.remove('member-drag');
        return;
      }

      // Finalize constraint point drag
      if (constraintDragActive) {
        constraintDragActive = false;
        constraintDragInfo = null;
        document.body.classList.remove('constraint-drag');
        return;
      }

      if ((!MARK_MODE && !constraintPickMode && !memberPickMode) || !mouseDownPos) return;

      // Drag guard: only place marker if mouse moved < 5px
      const dx = e.clientX - mouseDownPos.x;
      const dy = e.clientY - mouseDownPos.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      mouseDownPos = null;
      if (dist > 5) return;

      // Pixel coordinates relative to the renderer canvas (what Potree expects)
      const rect = renderArea.getBoundingClientRect();
      const mouse = { x: e.clientX - rect.left, y: e.clientY - rect.top };

      // Pick point using Potree's own utility (same as measurement tool uses)
      const camera = viewer.scene.getActiveCamera();
      const pickResult = Potree.Utils.getMousePointCloudIntersection(
        mouse, camera, viewer, viewer.scene.pointclouds, { pickClipped: true }
      );

      if (pickResult && pickResult.location) {
        var pos = pickResult.location;
        // Snap check for member/constraint picks (aggressive threshold)
        if (memberPickMode || constraintPickMode) {
          var snap = findSnapTarget(mouse, SNAP_THRESHOLD_MEMBER);
          if (snap) {
            pos = snap.position;
            showToast('Snapped to ' + snap.label, 1500);
          }
        }
        if (memberPickMode) {
          handleMemberPick(pos);
        } else if (constraintPickMode) {
          handleConstraintPick(pos);
        } else {
          placeMarker(pos);
        }
      } else {
        showToast("No point found under cursor");
      }
    }, true);

    // ----- load the point cloud -----
    Potree.loadPointCloud(cloudURL, pointCloudID).then((e) => {
      const pc    = e.pointcloud;
      const scene = viewer.scene;
      scene.addPointCloud(pc);

      // material defaults
      pc.material.size = 1.0;
      pc.material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
      pc.material.shape = Potree.PointShape.CIRCLE;

      // Fit camera to content on first load
      viewer.fitToScreen();

      // ===== Auto-scale marker size based on bounding box =====
      try {
        pc.updateMatrixWorld(true);
        let worldBB;
        if (typeof pc.getBoundingBoxWorld === "function") {
          worldBB = pc.getBoundingBoxWorld(new THREE.Box3());
        } else if (pc.pcoGeometry && pc.pcoGeometry.tightBoundingBox) {
          worldBB = pc.pcoGeometry.tightBoundingBox.clone().applyMatrix4(pc.matrixWorld);
        } else {
          worldBB = pc.boundingBox.clone().applyMatrix4(pc.matrixWorld);
        }
        const size = worldBB.getSize(new THREE.Vector3());
        const diagonal = Math.sqrt(size.x * size.x + size.y * size.y + size.z * size.z);
        ringOuterRadius = diagonal * 0.002;      // visible zoomed out
        ringMiddleRadius = diagonal * 0.0005;   // mid-range
        ringInnerRadius = diagonal * 0.00012;    // ~single point sized
        if (ringOuterRadius < 0.02) ringOuterRadius = 0.02;
        if (ringMiddleRadius < 0.005) ringMiddleRadius = 0.005;
        if (ringInnerRadius < 0.001) ringInnerRadius = 0.001;
      } catch (err) {
        console.warn('Marker size auto-scale failed, using default:', err);
      }

      // ===== INITIAL, LOCKED CLIP BOX (robust across forks) =====
      try {
        // World-space AABB of the cloud
        pc.updateMatrixWorld(true);
        // Prefer tightBoundingBox (actual scan extents) over the cubic octree BB
        let worldBB;
        if (pc.pcoGeometry && pc.pcoGeometry.tightBoundingBox) {
          worldBB = pc.pcoGeometry.tightBoundingBox.clone().applyMatrix4(pc.matrixWorld);
        } else if (typeof pc.getBoundingBoxWorld === "function") {
          worldBB = pc.getBoundingBoxWorld(new THREE.Box3());
        } else {
          worldBB = pc.boundingBox.clone().applyMatrix4(pc.matrixWorld);
        }
        const center = worldBB.getCenter(new THREE.Vector3());
        const size   = worldBB.getSize(new THREE.Vector3());

        let clipBox;

        // Preferred: use clippingTool if present
        if (viewer.clippingTool && typeof viewer.clippingTool.addBox === "function") {
          clipBox = viewer.clippingTool.addBox();
          clipBox.clip = true;
          clipBox.setPosition(center);
          clipBox.scale.set(size.x, size.y, size.z);
        } else if (typeof Potree.BoxVolume === "function") {
          // Fallback: plain BoxVolume
          clipBox = new Potree.BoxVolume();
          clipBox.clip = true;
          clipBox.position.copy(center);
          clipBox.scale.set(size.x, size.y, size.z);
          scene.addVolume(clipBox);
        } else {
          console.warn("No BoxVolume/ClippingTool available in this build; skipping clip box.");
        }

        if (clipBox) {
          clipBox.name = "Initial Crop";
          clipBox.visible = true;
          clipBox.userData = clipBox.userData || {};
          clipBox.userData.persistent = true;     // mark as locked

          // Disallow editing if API exists
          if (typeof clipBox.setEditable === "function") clipBox.setEditable(false);

          viewer.setClipTask(Potree.ClipTask.SHOW_INSIDE);
          viewer.setClipMethod(Potree.ClipMethod.INSIDE_ANY);

          // Prevent deletion through scene API
          const originalRemoveVolume = scene.removeVolume ? scene.removeVolume.bind(scene) : null;
          if (originalRemoveVolume) {
            scene.removeVolume = (vol) => {
              if (vol && vol.userData && vol.userData.persistent) return; // ignore
              return originalRemoveVolume(vol);
            };
          }

          // Prevent Delete/Backspace removal
          document.addEventListener("keydown", (ev) => {
            if (ev.key === "Delete" || ev.key === "Backspace") {
              const ih = viewer.inputHandler;
              const sel = (ih && (ih.selected || ih.selection)) ? Array.from(ih.selected || ih.selection) : [];
              const hasLocked = sel.some(s => s && s.userData && s.userData.persistent);
              if (hasLocked) { ev.preventDefault(); ev.stopPropagation(); }
            }
          }, true);
        }
      } catch (err) {
        console.warn('Clip box init failed:', err);
      }
    }).catch((err) => {
      console.error(err);
      alert('Failed to load point cloud: ' + cloudURL);
    });

    // ----- keyboard helpers -----
    window.addEventListener('keydown', (ev) => {
      // Existing shortcuts
      if (ev.key === 'e' || ev.key === 'E') viewer.setEDLEnabled(!viewer.getEDLEnabled()); // toggle EDL
      if (ev.key === '+' || ev.key === '=') viewer.setPointBudget(viewer.getPointBudget() + 250000);
      if (ev.key === '-' || ev.key === '_') viewer.setPointBudget(Math.max(250000, viewer.getPointBudget() - 250000));
      if (ev.key === 'f' || ev.key === 'F') viewer.fitToScreen();

      // Mark point shortcuts
      if (ev.key === 'x' || ev.key === 'X') toggleMarkMode();
      if ((ev.key === 'z' || ev.key === 'Z') && !ev.ctrlKey && !ev.metaKey) clearAllMarkers();
      // Member shortcut
      if (ev.key === 'm' || ev.key === 'M') startMemberPick();
      // Undo
      if ((ev.key === 'z' || ev.key === 'Z') && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); performUndo(); }

      // Enter finalizes fit-plane mode
      if (ev.key === 'Enter' && constraintPickMode && constraintPickType === 'fit-plane') {
        ev.preventDefault();
        finalizeConstraint();
      }

      if (ev.key === 'Escape') {
        if (constraintPickMode) cancelConstraintPick();
        else if (memberPickMode) cancelMemberPick();
        else if (MARK_MODE) toggleMarkMode(true);
        // Cancel any active Potree measurement insertion
        viewer.dispatchEvent({ type: 'cancel_insertions' });
      }
    });
  })();
  </script>
</body>
</html>
