          memberDragInfo = memberHit;
          document.body.classList.add('member-drag');
          e.stopPropagation();
          mouseDownPos = null;
          return;
        }
      }
      // Check if clicking near a constraint definition point (for dragging)
      if (e.button === 0 && constraints.length > 0 && !constraintPickMode && !MARK_MODE && !memberPickMode) {
        var rect = renderArea.getBoundingClientRect();
        var mousePixel = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        var hit = findNearestDefinitionPoint(mousePixel);
        if (hit) {
          constraintDragActive = true;
          constraintDragInfo = hit;
          document.body.classList.add('constraint-drag');
          e.stopPropagation();
          mouseDownPos = null;
          return;
        }
      }
      if (!MARK_MODE && !constraintPickMode && !memberPickMode) return;
      mouseDownPos = { x: e.clientX, y: e.clientY };
    }, true);

    renderArea.addEventListener('mousemove', function(e) {
      // Member endpoint dragging
      if (memberDragActive && memberDragInfo) {
        var rect = renderArea.getBoundingClientRect();
        var mouse = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        var camera = viewer.scene.getActiveCamera();
        var pickResult = _origPick(mouse, camera, viewer, viewer.scene.pointclouds, { pickClipped: true });
        if (pickResult && pickResult.location) {
          memberDragInfo.member.points[memberDragInfo.pointIndex] = pickResult.location.clone();
          recomputeMemberVisual(memberDragInfo.member);
        }
        return;
      }
      // Constraint definition point dragging
      if (!constraintDragActive || !constraintDragInfo) return;
      var rect = renderArea.getBoundingClientRect();
      var mouse = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      var camera = viewer.scene.getActiveCamera();
      var pickResult = _origPick(mouse, camera, viewer, viewer.scene.pointclouds, { pickClipped: true });
      if (pickResult && pickResult.location) {
        var c = constraintDragInfo.constraint;
        c.points[constraintDragInfo.pointIndex] = pickResult.location.clone();
        if (recomputeConstraint(c)) {
          rebuildConstraintVisual(c);
        }
      }
    }, true);

    renderArea.addEventListener('mouseup', function(e) {
      // Finalize member endpoint drag
      if (memberDragActive) {
        memberDragActive = false;
        memberDragInfo = null;
        document.body.classList.remove('member-drag');
        return;
      }

      // Finalize constraint point drag
      if (constraintDragActive) {
        constraintDragActive = false;
        constraintDragInfo = null;
        document.body.classList.remove('constraint-drag');
        return;
      }

      if ((!MARK_MODE && !constraintPickMode && !memberPickMode) || !mouseDownPos) return;

      // Drag guard: only place marker if mouse moved < 5px
      const dx = e.clientX - mouseDownPos.x;
      const dy = e.clientY - mouseDownPos.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      mouseDownPos = null;
      if (dist > 5) return;

      // Pixel coordinates relative to the renderer canvas (what Potree expects)
      const rect = renderArea.getBoundingClientRect();
      const mouse = { x: e.clientX - rect.left, y: e.clientY - rect.top };

      // Pick point using Potree's own utility (same as measurement tool uses)
      const camera = viewer.scene.getActiveCamera();
      const pickResult = Potree.Utils.getMousePointCloudIntersection(
        mouse, camera, viewer, viewer.scene.pointclouds, { pickClipped: true }
      );

      if (pickResult && pickResult.location) {
        if (memberPickMode) {
          handleMemberPick(pickResult.location);
        } else if (constraintPickMode) {
          handleConstraintPick(pickResult.location);
        } else {
          placeMarker(pickResult.location);
        }
      } else {
        showToast("No point found under cursor");
      }
    }, true);

    // ----- load the point cloud -----
    Potree.loadPointCloud(cloudURL, pointCloudID).then((e) => {
      const pc    = e.pointcloud;
      const scene = viewer.scene;
      scene.addPointCloud(pc);

      // material defaults
      pc.material.size = 1.0;
      pc.material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
      pc.material.shape = Potree.PointShape.CIRCLE;

      // Fit camera to content on first load
      viewer.fitToScreen();

      // ===== Auto-scale marker size based on bounding box =====
      try {
        pc.updateMatrixWorld(true);
        let worldBB;
        if (typeof pc.getBoundingBoxWorld === "function") {
          worldBB = pc.getBoundingBoxWorld(new THREE.Box3());
        } else if (pc.pcoGeometry && pc.pcoGeometry.tightBoundingBox) {
          worldBB = pc.pcoGeometry.tightBoundingBox.clone().applyMatrix4(pc.matrixWorld);
        } else {
          worldBB = pc.boundingBox.clone().applyMatrix4(pc.matrixWorld);
        }
        const size = worldBB.getSize(new THREE.Vector3());
        const diagonal = Math.sqrt(size.x * size.x + size.y * size.y + size.z * size.z);
        ringOuterRadius = diagonal * 0.002;      // visible zoomed out
        ringMiddleRadius = diagonal * 0.0005;   // mid-range
        ringInnerRadius = diagonal * 0.00012;    // ~single point sized
        if (ringOuterRadius < 0.02) ringOuterRadius = 0.02;
        if (ringMiddleRadius < 0.005) ringMiddleRadius = 0.005;
        if (ringInnerRadius < 0.001) ringInnerRadius = 0.001;
      } catch (err) {
        console.warn('Marker size auto-scale failed, using default:', err);
      }

      // ===== INITIAL, LOCKED CLIP BOX (robust across forks) =====
      try {
        // World-space AABB of the cloud
        pc.updateMatrixWorld(true);
        let worldBB;
        if (typeof pc.getBoundingBoxWorld === "function") {
          worldBB = pc.getBoundingBoxWorld(new THREE.Box3());
        } else if (pc.pcoGeometry && pc.pcoGeometry.tightBoundingBox) {
          worldBB = pc.pcoGeometry.tightBoundingBox.clone().applyMatrix4(pc.matrixWorld);
        } else {
          worldBB = pc.boundingBox.clone().applyMatrix4(pc.matrixWorld);
        }
        const center = worldBB.getCenter(new THREE.Vector3());
        const size   = worldBB.getSize(new THREE.Vector3());

        let clipBox;

        // Preferred: use clippingTool if present
        if (viewer.clippingTool && typeof viewer.clippingTool.addBox === "function") {
          clipBox = viewer.clippingTool.addBox();
          clipBox.clip = true;
          clipBox.setPosition(center);
          clipBox.scale.set(size.x, size.y, size.z);
        } else if (typeof Potree.BoxVolume === "function") {
          // Fallback: plain BoxVolume
          clipBox = new Potree.BoxVolume();
          clipBox.clip = true;
          clipBox.position.copy(center);
          clipBox.scale.set(size.x, size.y, size.z);
          scene.addVolume(clipBox);
        } else {
          console.warn("No BoxVolume/ClippingTool available in this build; skipping clip box.");
        }

        if (clipBox) {
          clipBox.name = "Initial Crop";
          clipBox.visible = true;
          clipBox.userData = clipBox.userData || {};
          clipBox.userData.persistent = true;     // mark as locked

          // Disallow editing if API exists
          if (typeof clipBox.setEditable === "function") clipBox.setEditable(false);

          viewer.setClipTask(Potree.ClipTask.SHOW_INSIDE);
          viewer.setClipMethod(Potree.ClipMethod.INSIDE_ANY);

          // Prevent deletion through scene API
          const originalRemoveVolume = scene.removeVolume ? scene.removeVolume.bind(scene) : null;
          if (originalRemoveVolume) {
            scene.removeVolume = (vol) => {
              if (vol && vol.userData && vol.userData.persistent) return; // ignore
              return originalRemoveVolume(vol);
            };
          }

          // Prevent Delete/Backspace removal
          document.addEventListener("keydown", (ev) => {
            if (ev.key === "Delete" || ev.key === "Backspace") {
              const ih = viewer.inputHandler;
              const sel = (ih && (ih.selected || ih.selection)) ? Array.from(ih.selected || ih.selection) : [];
              const hasLocked = sel.some(s => s && s.userData && s.userData.persistent);
              if (hasLocked) { ev.preventDefault(); ev.stopPropagation(); }
            }
          }, true);
        }
      } catch (err) {
        console.warn('Clip box init failed:', err);
      }
    }).catch((err) => {
      console.error(err);
      alert('Failed to load point cloud: ' + cloudURL);
    });

    // ----- keyboard helpers -----
    window.addEventListener('keydown', (ev) => {
      // Existing shortcuts
      if (ev.key === 'e' || ev.key === 'E') viewer.setEDLEnabled(!viewer.getEDLEnabled()); // toggle EDL
      if (ev.key === '+' || ev.key === '=') viewer.setPointBudget(viewer.getPointBudget() + 250000);
      if (ev.key === '-' || ev.key === '_') viewer.setPointBudget(Math.max(250000, viewer.getPointBudget() - 250000));
      if (ev.key === 'f' || ev.key === 'F') viewer.fitToScreen();

      // Mark point shortcuts
      if (ev.key === 'x' || ev.key === 'X') toggleMarkMode();
      if (ev.key === 'z' || ev.key === 'Z') clearAllMarkers();
      // Member shortcut
      if (ev.key === 'm' || ev.key === 'M') startMemberPick();

      if (ev.key === 'Escape') {
        if (constraintPickMode) cancelConstraintPick();
        else if (memberPickMode) cancelMemberPick();
        else if (MARK_MODE) toggleMarkMode(true);
        // Cancel any active Potree measurement insertion
        viewer.dispatchEvent({ type: 'cancel_insertions' });
      }
    });
  })();
  </script>
</body>
