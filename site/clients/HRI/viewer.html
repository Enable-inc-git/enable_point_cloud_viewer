            stWorldBB = pc.boundingBox.clone().applyMatrix4(pc.matrixWorld);
          }
          // Manifest sits at <projectRoot>/stations/stations.json; meta.folder is
          // "<projectRoot>/pointclouds/<scan_id>", so we drop the last two path
          // segments rather than relying on browser '../' normalization.
          // Regex (not split/join) so an absolute R2 URL keeps its "https://".
          var _projectRoot = meta.folder.replace(/\/+$/, '').replace(/\/[^/]+\/[^/]+$/, '');
          var manifestURL = _projectRoot + '/stations/stations.json';
          console.log('[stations] fetching manifest:', manifestURL);
          fetch(manifestURL)
            .then(function(r) { return r.ok ? r.json() : null; })
            .then(function(manifest) {
              if (manifest) onStationManifestLoaded(manifest, stWorldBB);
            })
            .catch(function() { /* silent — feature disables cleanly when no manifest */ });
        } catch (err) {
          console.warn('Station manifest fetch setup failed:', err);
        }
      }

      // ===== INITIAL, LOCKED CLIP BOX (robust across forks) =====
      try {
        // World-space AABB of the cloud
        pc.updateMatrixWorld(true);
        // Prefer tightBoundingBox (actual scan extents) over the cubic octree BB
        let worldBB;
        if (pc.pcoGeometry && pc.pcoGeometry.tightBoundingBox) {
          worldBB = pc.pcoGeometry.tightBoundingBox.clone().applyMatrix4(pc.matrixWorld);
        } else if (typeof pc.getBoundingBoxWorld === "function") {
          worldBB = pc.getBoundingBoxWorld(new THREE.Box3());
        } else {
          worldBB = pc.boundingBox.clone().applyMatrix4(pc.matrixWorld);
        }
        const center = worldBB.getCenter(new THREE.Vector3());
        const size   = worldBB.getSize(new THREE.Vector3());

        let clipBox;

        // Preferred: use clippingTool if present
        if (viewer.clippingTool && typeof viewer.clippingTool.addBox === "function") {
          clipBox = viewer.clippingTool.addBox();
          clipBox.clip = true;
          clipBox.setPosition(center);
          clipBox.scale.set(size.x, size.y, size.z);
        } else if (typeof Potree.BoxVolume === "function") {
          // Fallback: plain BoxVolume
          clipBox = new Potree.BoxVolume();
          clipBox.clip = true;
          clipBox.position.copy(center);
          clipBox.scale.set(size.x, size.y, size.z);
          scene.addVolume(clipBox);
        } else {
          console.warn("No BoxVolume/ClippingTool available in this build; skipping clip box.");
        }

        if (clipBox) {
          clipBox.name = "Initial Crop";
          clipBox.visible = true;
          clipBox.userData = clipBox.userData || {};
          clipBox.userData.persistent = true;     // mark as locked
          initialClipBox = clipBox;               // store reference for elevation tool
          _applyBoxWireToVolume(clipBox);         // honor the box-wireframe brightness setting
          trackVolumeUndo(clipBox);               // Ctrl+Z undoes accidental move/rotate/scale of the crop box
          // Make the crop box grabbable ONLY by its wireframe perimeter: route
          // the fill mesh's hit-test to the frame, so dragging OVER the interior
          // orbits/pans while grabbing an EDGE selects + moves the box.
          // CRUCIAL THRESHOLD FIX: the frame is a UNIT-cube wireframe whose size
          // lives in the volume's matrixWorld, but THREE.Line.raycast divides the
          // pick threshold by the frame's OWN scale (1,1,1) and tests in unit-cube
          // space — so the default 0.2 becomes a grab band of 0.2 * boxSize
          // (METRES), which swallows the interior (you'd have to drag far off the
          // outline to orbit). Force a thin ~1.5%-of-box band so you grab right on
          // the wireframe and orbit everywhere else.
          if (clipBox.box && clipBox.frame) {
            // Grab band for the crop-box wireframe, measured in unit-cube space
            // (≈ fraction of box size). Was 0.015 (~1.5%) — too thin to hit without
            // pixel-perfect aim. Widened, and much wider on coarse pointers (touch)
            // where a fingertip can't land on a thin edge.
            var _coarsePointer = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
            var _clipEdgeGrab = _coarsePointer ? 0.09 : 0.04;
            clipBox.box.raycast = function(raycaster, intersects) {
              var lp = raycaster.params && raycaster.params.Line;
              var saved = lp ? lp.threshold : null;
              if (lp) lp.threshold = _clipEdgeGrab;
              try { clipBox.frame.raycast(raycaster, intersects); }
              finally { if (lp) lp.threshold = saved; }
            };
          }

          // Disallow editing if API exists
          if (typeof clipBox.setEditable === "function") clipBox.setEditable(false);

          viewer.setClipTask(Potree.ClipTask.SHOW_INSIDE);
          viewer.setClipMethod(Potree.ClipMethod.INSIDE_ANY);

          // Prevent deletion through scene API
          const originalRemoveVolume = scene.removeVolume ? scene.removeVolume.bind(scene) : null;
          if (originalRemoveVolume) {
            scene.removeVolume = (vol) => {
              if (vol && vol.userData && vol.userData.persistent) return; // ignore
              return originalRemoveVolume(vol);
            };
          }

          // Prevent Delete/Backspace removal — but NOT when typing in form fields
          document.addEventListener("keydown", (ev) => {
            if (ev.key === "Delete" || ev.key === "Backspace") {
              var t = ev.target;
              var tag = t && t.tagName;
              if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
              const ih = viewer.inputHandler;
              const sel = (ih && (ih.selected || ih.selection)) ? Array.from(ih.selected || ih.selection) : [];
              const hasLocked = sel.some(s => s && s.userData && s.userData.persistent);
              if (hasLocked) { ev.preventDefault(); ev.stopPropagation(); }
            }
          }, true);
        }
      } catch (err) {
        console.warn('Clip box init failed:', err);
      }
    }).catch((err) => {
      console.error(err);
      alert('Failed to load point cloud: ' + cloudURL);
    });

    // ----- keyboard helpers -----
    window.addEventListener('keydown', (ev) => {
      // Single-key tool shortcuts must NEVER fire while the user is typing in a form
      // field (note text/name, sidebar inputs). Otherwise typing "m"/"x"/"z"/"f"/"e"
      // into a note toggles tools — e.g. "m" starts member-pick mode, so the next
      // click prompts for a member endpoint. See feedback_keyboard_guards.
      var _sk = ev.target;
      var _skTyping = _sk && (_sk.tagName === 'INPUT' || _sk.tagName === 'TEXTAREA' ||
                              _sk.tagName === 'SELECT' || _sk.isContentEditable);
      // Existing shortcuts (suppressed while typing)
      if (!_skTyping) {
        if (ev.key === 'e' || ev.key === 'E') viewer.setEDLEnabled(!viewer.getEDLEnabled()); // toggle EDL
        if (ev.key === '+' || ev.key === '=') viewer.setPointBudget(viewer.getPointBudget() + 250000);
        if (ev.key === '-' || ev.key === '_') viewer.setPointBudget(Math.max(250000, viewer.getPointBudget() - 250000));
        if (ev.key === 'f' || ev.key === 'F') viewer.fitToScreen();

        // Mark point shortcuts
        if (ev.key === 'x' || ev.key === 'X') toggleMarkMode();
        if ((ev.key === 'z' || ev.key === 'Z') && !ev.ctrlKey && !ev.metaKey) clearAllMarkers();
        // Member shortcut
        if (ev.key === 'm' || ev.key === 'M') startMemberPick();
      }
      // Ortho-measure toggle (requires an active plane with a basis)
      if (ev.key === 'o' || ev.key === 'O') {
        var _t = ev.target;
        var _typing = _t && (_t.tagName === 'INPUT' || _t.tagName === 'TEXTAREA' || _t.isContentEditable);
        if (!_typing && !constraintPickMode && !memberPickMode && !MARK_MODE) {
          if (!_orthoMeasureMode) {
            var ac = constraints.find(function(con) { return con.id === activeConstraintId; });
            if (!ac || ac.type !== 'plane' || !ac.basis) {
              showToast('Activate a plane first to enable ortho measure', 3000);
            } else {
              _orthoMeasureMode = true;
              _normDimMode = false; _normDimArmed = false; _normDimRefId = null; _disposeNormPreview(); // mutually exclusive
              var axesLbl = _orthoParallelMode ? 'X/Y/Z' : 'X/Y';
              showToast('Ortho measure ON — picks snap to ' + ac.name + ' ' + axesLbl + ' axes', 3000);
              updateConstraintStatus();
            }
          } else {
            _orthoMeasureMode = false;
            showToast('Ortho measure OFF', 2000);
            updateConstraintStatus();
          }
        }
      }
      // Parallel mode toggle: switch between drawing on the active plane
      // (default) and drawing in a parallel plane that follows the prior pick.
      if (ev.key === 'p' || ev.key === 'P') {
        var _tp = ev.target;
        var _typingP = _tp && (_tp.tagName === 'INPUT' || _tp.tagName === 'TEXTAREA' || _tp.isContentEditable);
        if (!_typingP && !constraintPickMode && !memberPickMode && !MARK_MODE) {
          if (!_orthoParallelMode) {
            var acP = constraints.find(function(con) { return con.id === activeConstraintId; });
            if (!acP || acP.type !== 'plane' || !acP.basis) {
              showToast('Activate a plane first to enable parallel mode', 3000);
            } else {
              _orthoParallelMode = true;
              showToast('Parallel mode ON — drawing tracks last pick’s elevation; ortho includes Z', 3500);
              updateConstraintStatus();
            }
          } else {
            _orthoParallelMode = false;
            showToast('Parallel mode OFF — drawing locked to the active plane', 2500);
            updateConstraintStatus();
          }
        }
      }
      // Normal-dimension toggle (uses the SELECTED plane). "d" = dimension.
      if (ev.key === 'd' || ev.key === 'D') {
        var _td = ev.target;
        var _typingD = _td && (_td.tagName === 'INPUT' || _td.tagName === 'TEXTAREA' || _td.isContentEditable);
        if (!_typingD && !ev.ctrlKey && !ev.metaKey && !constraintPickMode && !memberPickMode && !MARK_MODE) {
          toggleNormDim();
        }
      }
      // Undo
      if ((ev.key === 'z' || ev.key === 'Z') && (ev.ctrlKey || ev.metaKey) && ev.shiftKey) { ev.preventDefault(); performRedo(); }
      else if ((ev.key === 'z' || ev.key === 'Z') && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); performUndo(); }
      if ((ev.key === 'y' || ev.key === 'Y') && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); performRedo(); }

      // Enter: finalize fit-plane (when in that mode), otherwise restart
      // the last measurement/volume tool used (skip when typing in inputs).
      if (ev.key === 'Enter') {
        if (constraintPickMode && constraintPickType === 'fit-plane') {
          ev.preventDefault();
          finalizeConstraint();
        } else if (constraintPickMode && constraintPickType === 'plane-x-axis' && constraintPickPoints.length >= 2) {
          ev.preventDefault();
          finalizePlaneXAxis();
        } else {
          var t = ev.target;
          var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
          // Don't restart the measurement tool (which re-arms Potree's insertion and
          // jumps the camera) while a note is being placed or its popover is open.
          if (!typing && !notePickMode && _expandedNoteId == null &&
              !constraintPickMode && !memberPickMode && !MARK_MODE && !pendingMeasurement) {
            if (restartLastMeasurementTool()) {
              ev.preventDefault();
            }
          }
        }
      }

      if (ev.key === 'Escape') {
        // In Norm mode, Esc STOPS the measuring (disarms) — exactly like exiting
        // the distance tool — but leaves the Norm modifier on (only the Norm
        // button turns that off). This is the primary Esc action while armed.
        if (_normDimArmed) {
          _normDimArmed = false;
          _disposeNormPreview();
          updateConstraintStatus();
          showToast('Measuring stopped (Norm still on — start the distance tool to resume, or click Norm to exit)', 3500);
          return;
        }
        // Cancel a pending move/copy-to-point pick.
        if (_planeMovePick) { cancelPlaneMovePick(); showToast('Move/copy to point cancelled', 1500); return; }
        // Deselect a highlighted plane first (only if nothing else is mid-action).
        if (!zBasePickMode && !constraintPickMode && !memberPickMode && !notePickMode &&
            _expandedNoteId == null && !MARK_MODE && selectedConstraintId !== null) {
          deselectConstraint();
        }
        if (zBasePickMode) { cancelZBasePick(); rebuildElevationBoxList(); }
        else if (constraintPickMode) cancelConstraintPick();
        else if (memberPickMode) cancelMemberPick();
        else if (notePickMode) cancelNotePick();
        else if (_expandedNoteId != null) _closeNotePopover();
        else if (MARK_MODE) toggleMarkMode(true);
        // Hard-cancel any active Potree measurement insertion: dispatches
        // cancel_insertions, stops the InputHandler drag, and removes any
        // orphan measurement that has fewer than the required points.
        cancelPotreeInsertion();
        // Also drop any current selection (e.g. the large clip box or a managed
        // volume) — Esc should clear a highlighted/selected object, not just modes.
        try { if (viewer.inputHandler && viewer.inputHandler.deselectAll) viewer.inputHandler.deselectAll(); } catch (e) {}
        // The user pressed Esc to stop a tool — they want to navigate next, not
        // grab whatever sphere/mark the cursor is resting on. Force the next
        // left-drag to orbit.
        _orbitNextDrag = true;
      }
    });

    // ---- Dev2 bridge: expose runtime objects chrome.js needs for visual
    //      augmentation (station-pin highlighting, station number sprites).
    //      This is the only viewer.html JS edit Dev2 makes beyond the body
    //      wrapper divs and the script tags — none of the handlers above
    //      are touched.
    // ---- Independent visibility toggles for the top-bar "eye" dropdown ----
    // (clip box / panoramas / notes). Separate from the old combined
    // stations+notes "annotations" switch and the "all dimensions" switch.
    var _notesVisibleAll = true;
    function _setStationsVisOnly(vis) {
      _stationsVisible = vis;
      for (var _svi = 0; _svi < stations.length; _svi++) {
        stations[_svi].visible = vis;
        if (stations[_svi].visual) stations[_svi].visual.visible = vis;
      }
    }
    function _setNotesVisOnly(vis) {
      _notesVisibleAll = vis;
      for (var _nvi = 0; _nvi < notes.length; _nvi++) {
        if (notes[_nvi].visual) notes[_nvi].visual.visible = vis && (notes[_nvi].visible !== false);
      }
      if (!vis && typeof _closeNotePopover === 'function') _closeNotePopover();
    }
    window.__dev2 = {
      get viewer()              { return viewer;              },
      get stations()            { return stations;            },
      get THREE()               { return THREE;               },
      get measureLabelScene()   { return measureLabelScene;   },
      get measurePointLabels()  { return measurePointLabels;  },
      get notes()               { return notes;               },
      startNotePick:            function () { return startNotePick(); },
      performUndo:              function () { return performUndo();   },
      performRedo:              function () { return performRedo();   },
      setUnitMode:              function (m) { return setUnitMode(m); },
      getUnitMode:              function () { return getUnitMode();   },
      setBoxWireBrightness:     function (v) { return setBoxWireBrightness(v); },
      getBoxWireBrightness:     function () { return getBoxWireBrightness(); },
      // Light/dark theme toggle (eye dropdown). The 3D canvas background is
      // CSS-driven (custom.css `--bg` keyed off :root[data-theme]) and the
      // WebGL layer is transparent, so the flip is automatic — this hook just
      // guarantees the canvas stays transparent so the CSS bg shows through,
      // and is a place for any future JS-side theme refresh.
      applyViewerTheme:         function (theme) {
        try { if (viewer && viewer.renderer) viewer.renderer.setClearAlpha(0); } catch (e) {}
        return theme;
      },
      // Visibility toggles for the top-bar eye dropdown.
      getClipBoxVis:            function () { return !!(typeof initialClipBox !== 'undefined' && initialClipBox && !initialClipBox._outlineHidden); },
      toggleClipBoxVis:         function () { var b = document.getElementById('btn-toggle-clipbox-outline'); if (b) b.click(); return this.getClipBoxVis(); },
      hasStations:              function () { return stations.length > 0; },
      getStationsVis:           function () { return _stationsVisible; },
      toggleStationsVis:        function () { _setStationsVisOnly(!_stationsVisible); return _stationsVisible; },
      hasNotes:                 function () { return notes.length > 0; },
      getNotesVis:              function () { return _notesVisibleAll; },
      toggleNotesVis:           function () { _setNotesVisOnly(!_notesVisibleAll); return _notesVisibleAll; },
      // Custom drawing axes — gizmo show/hide for the eye dropdown.
      hasCustomAxes:            function () { return !!_customAxes; },
      getAxesGizmoVis:          function () { return _customAxesVisible; },
      toggleAxesGizmoVis:       function () { setAxesGizmoVisible(!_customAxesVisible); return _customAxesVisible; },
      // Rename an elevation box by its current name (used by chrome.js's right-panel
      // header rename). Rebuilds both toolbars + the legend title.
      getExportSpacingMM:       function () { return _exportSpacingMM; },
      setExportSpacingMM:       function (v) { v = +v; if (isFinite(v) && v > 0) _exportSpacingMM = v; return _exportSpacingMM; },
      renameElevBox:            function (oldName, newName) {
        if (!newName || !newName.trim()) return false;
        newName = newName.trim();
        for (var i = 0; i < elevationCropVolumes.length; i++) {
          if (elevationCropVolumes[i].name === oldName) {
            elevationCropVolumes[i].name = newName;
            rebuildElevationBoxList();
            return true;
          }
        }
        return false;
      },
      get undoStack()           { return undoStack;           },
      // Called from chrome.js after a clean 1-finger tap on touch. Exits any
      // single-action pick mode (Mark, Note, Constraint) so the user can
      // immediately pan/orbit after a single placement on tablet.
      _touchExitSingleModes:    function () {
        if (MARK_MODE) toggleMarkMode(true);
        // Note pick already auto-exits via cancelNotePick() inside the
        // placement flow; nothing to do here.
        // Constraint picks: 2-point picks (axis, plane-x-axis) auto-finalize.
        // Fit-plane is multi-point, intentionally not auto-exited.
      }
    };
  })();
  </script>

  <script src="./icons.js"></script>
