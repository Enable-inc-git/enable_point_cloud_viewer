    }

    // ===== VOLUME LIST =====
    function rebuildVolumeList() {
      var listEl = document.getElementById('enable-volume-list');
      if (!listEl) return;
      var allVolumes = (viewer.scene.volumes || []);
      var userVolumes = [];
      for (var i = 0; i < allVolumes.length; i++) {
        if (isUserVolumeMeasurement(allVolumes[i])) userVolumes.push(allVolumes[i]);
      }
      if (userVolumes.length === 0) { listEl.innerHTML = ''; return; }

      var html = '<div class="enable-list-section-label">Volumes</div>';
      for (var vi = 0; vi < userVolumes.length; vi++) {
        var vol = userVolumes[vi];
        var name = vol.name || ('Volume ' + (vi + 1));
        var sx = Math.abs(vol.scale.x), sy = Math.abs(vol.scale.y), sz = Math.abs(vol.scale.z);
        var v3 = (typeof vol.getVolume === 'function') ? vol.getVolume() : (sx * sy * sz);
        html += '<div class="enable-meas-item">' +
          '<div class="meas-header">' +
          '<span class="meas-title">' + name + '</span>' +
          '<button class="meas-delete" data-vol-idx="' + vi + '" title="Delete volume">\u00d7</button>' +
          '</div>' +
          '<div class="enable-meas-seg">' +
            '<span class="seg-name">Volume</span>' +
            '<span class="seg-vals">' + fmtVol(v3) + '</span>' +
          '</div>' +
          '<div class="enable-meas-seg">' +
            '<span class="seg-name">Size</span>' +
            '<span class="seg-vals">' + fmtLen(sx) + ' \u00d7 ' + fmtLen(sy) + ' \u00d7 ' + fmtLen(sz) + '</span>' +
          '</div>' +
          '</div>';
      }
      listEl.innerHTML = html;
      listEl.querySelectorAll('.meas-delete').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var idx = parseInt(btn.getAttribute('data-vol-idx'));
          if (userVolumes[idx]) viewer.scene.removeVolume(userVolumes[idx]);
        });
      });
    }

    // ===== EXPORT ALL MEASUREMENTS TO TXT =====
    function exportAllMeasurements() {
      var measurements = viewer.scene.measurements || [];
      var distMeasures = [], areaMeasures = [], angleMeasures = [];
      for (var i = 0; i < measurements.length; i++) {
        var m = measurements[i];
        if (m.showArea && m.points.length >= 3) areaMeasures.push(m);
        else if (m.showAngles && m.points.length >= 3) angleMeasures.push(m);
        else if ((m.showDistances || m.showHeight) && m.points.length >= 2) distMeasures.push(m);
      }
      var allVolumes = (viewer.scene.volumes || []);
      var userVolumes = [];
      for (var vi = 0; vi < allVolumes.length; vi++) {
        if (isUserVolumeMeasurement(allVolumes[vi])) userVolumes.push(allVolumes[vi]);
      }
      var totalCount = distMeasures.length + areaMeasures.length + angleMeasures.length + userVolumes.length;
      if (totalCount === 0) { showToast('No measurements to export'); return; }

      var lines = [];
      lines.push('Measurements Export');
      lines.push('Units: ' + (UNIT_MODE === 'mm' ? 'metres (to the mm)' : UNIT_MODE === 'imp-dec' ? 'feet-inches (decimal, 0.05")' : 'feet-inches (fractional, 1/16")'));
      lines.push('Distances/Heights: ' + distMeasures.length + ' | Areas: ' + areaMeasures.length +
                 ' | Angles: ' + angleMeasures.length + ' | Volumes: ' + userVolumes.length);
      lines.push('');

      for (var mi = 0; mi < distMeasures.length; mi++) {
        var measure = distMeasures[mi];
        var nums = measurePointNumbers.get(measure) || [];
        var pts = measure.points;
        var isHeight = measure.showHeight && !measure.showDistances;
        var typeLabel = isHeight ? ' [Vertical]' : '';

        var firstName = nums.length > 0 ? 'D' + nums[0] : 'D?';
        var lastName = nums.length > 0 ? 'D' + nums[nums.length - 1] : 'D?';
        lines.push('=== Measurement ' + (mi + 1) + typeLabel + ': ' + firstName + ' -> ' + lastName + ' ===');
        lines.push('');

        lines.push('Point Coordinates:');
        for (var pi = 0; pi < pts.length; pi++) {
          var p = pts[pi].position ? pts[pi].position : pts[pi];
          var pn = pi < nums.length ? 'D' + nums[pi] : 'D?';
          lines.push('  ' + pn + ': X=' + fmtLenVal(p.x) + ', Y=' + fmtLenVal(p.y) + ', Z=' + fmtLenVal(p.z));
        }
        lines.push('');

        lines.push('Segment Distances:');
        var total3D = 0, totalXY = 0, totalZ = 0;
        for (var si = 0; si < pts.length - 1; si++) {
          var a = pts[si].position ? pts[si].position : pts[si];
          var b = pts[si + 1].position ? pts[si + 1].position : pts[si + 1];
          var dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
          var d3d = Math.sqrt(dx * dx + dy * dy + dz * dz);
          var dxy = Math.sqrt(dx * dx + dy * dy);
          var absZ = Math.abs(dz);
          var zSign = dz >= 0 ? '(+)' : '(-)';
          total3D += d3d; totalXY += dxy; totalZ += absZ;
          var sn1 = si < nums.length ? 'D' + nums[si] : 'D?';
          var sn2 = (si + 1) < nums.length ? 'D' + nums[si + 1] : 'D?';
          if (isHeight) {
            lines.push('  ' + sn1 + ' -> ' + sn2 + ':  Vertical: ' + fmtLen(absZ) + ' ' + zSign);
          } else {
            lines.push('  ' + sn1 + ' -> ' + sn2 + ':  3D: ' + fmtLen(d3d) + '  XY: ' + fmtLen(dxy) + '  Z: ' + fmtLen(absZ) + ' ' + zSign);
          }
        }
        lines.push('');
        if (isHeight) {
          lines.push('Totals:  Vertical: ' + fmtLen(totalZ));
        } else {
          lines.push('Totals:  3D: ' + fmtLen(total3D) + '  XY: ' + fmtLen(totalXY) + '  Z: ' + fmtLen(totalZ));
        }
        lines.push('');
      }

      // Areas
      for (var ai = 0; ai < areaMeasures.length; ai++) {
        var measure = areaMeasures[ai];
        var nums = measurePointNumbers.get(measure) || [];
        var pts = measure.points;
        var firstName = nums.length > 0 ? 'D' + nums[0] : 'D?';
        var lastName = nums.length > 0 ? 'D' + nums[nums.length - 1] : 'D?';
        lines.push('=== Area ' + (ai + 1) + ': ' + firstName + ' -> ' + lastName + ' (' + pts.length + ' pts) ===');
        lines.push('');
        lines.push('Point Coordinates:');
        for (var pi = 0; pi < pts.length; pi++) {
          var p = pts[pi].position ? pts[pi].position : pts[pi];
          var pn = pi < nums.length ? 'D' + nums[pi] : 'D?';
          lines.push('  ' + pn + ': X=' + fmtLenVal(p.x) + ', Y=' + fmtLenVal(p.y) + ', Z=' + fmtLenVal(p.z));
        }
        var area3D = compute3DPolygonArea(pts);
        var areaXY = (typeof measure.getArea === 'function') ? measure.getArea() : 0;
        var perim = 0;
        for (var pj = 0; pj < pts.length; pj++) {
          var ap = pts[pj].position ? pts[pj].position : pts[pj];
          var bp = pts[(pj + 1) % pts.length].position ? pts[(pj + 1) % pts.length].position : pts[(pj + 1) % pts.length];
          perim += Math.sqrt((bp.x - ap.x) * (bp.x - ap.x) + (bp.y - ap.y) * (bp.y - ap.y) + (bp.z - ap.z) * (bp.z - ap.z));
        }
        lines.push('');
        lines.push('Surface area (3D): ' + fmtArea(area3D));
        lines.push('Plan area (XY):    ' + fmtArea(areaXY));
        lines.push('Perimeter:         ' + fmtLen(perim));
        lines.push('');
      }

      // Angles
      for (var gi = 0; gi < angleMeasures.length; gi++) {
        var measure = angleMeasures[gi];
        var nums = measurePointNumbers.get(measure) || [];
        var pts = measure.points;
        var firstName = nums.length > 0 ? 'D' + nums[0] : 'D?';
        var lastName = nums.length > 0 ? 'D' + nums[nums.length - 1] : 'D?';
        lines.push('=== Angle ' + (gi + 1) + ': ' + firstName + ' -> ' + lastName + ' (' + pts.length + ' pts) ===');
        lines.push('');
        var lastIdx = pts.length - 1;
        var loop = !!measure.closed;
        for (var aii = 0; aii < pts.length; aii++) {
          if (!loop && (aii === 0 || aii === lastIdx)) continue;
          var rad = (typeof measure.getAngle === 'function') ? measure.getAngle(aii) : 0;
          if (!isFinite(rad)) rad = 0;
          var deg = rad * (180 / Math.PI);
          var nm = nums && aii < nums.length ? 'D' + nums[aii] : ('P' + (aii + 1));
          lines.push('  ' + nm + ': ' + deg.toFixed(2) + ' deg');
        }
        lines.push('');
      }

      // Volumes
      for (var vi2 = 0; vi2 < userVolumes.length; vi2++) {
        var vol = userVolumes[vi2];
        var name = vol.name || ('Volume ' + (vi2 + 1));
        var sx = Math.abs(vol.scale.x), sy = Math.abs(vol.scale.y), sz = Math.abs(vol.scale.z);
        var v3 = (typeof vol.getVolume === 'function') ? vol.getVolume() : (sx * sy * sz);
        lines.push('=== Volume ' + (vi2 + 1) + ': ' + name + ' ===');
        lines.push('  Volume: ' + fmtVol(v3));
        lines.push('  Size:   ' + fmtLen(sx) + ' x ' + fmtLen(sy) + ' x ' + fmtLen(sz));
        lines.push('  Center: X=' + fmtLenVal(vol.position.x) + ', Y=' + fmtLenVal(vol.position.y) + ', Z=' + fmtLenVal(vol.position.z));
        lines.push('');
      }

      var content = lines.join('\n');
      var blob = new Blob([content], { type: 'text/plain' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'measurements.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Exported ' + totalCount + ' measurement(s) to .txt');
    }

    // ===== SAVE / LOAD SESSION =====

    function v3toObj(v) { return { x: v.x, y: v.y, z: v.z }; }
    function serializeVolume(vol) {
      return {
        position: v3toObj(vol.position),
        rotation: { x: vol.rotation.x, y: vol.rotation.y, z: vol.rotation.z },
        scale: v3toObj(vol.scale),
        name: vol.name || '',
        disabled: !!vol._disabled
      };
    }
    function restoreVolume(sv) {
      var vol = new Potree.BoxVolume();
      vol.clip = false;
      vol.position.set(sv.position.x, sv.position.y, sv.position.z);
      if (sv.rotation) vol.rotation.set(sv.rotation.x, sv.rotation.y, sv.rotation.z);
      vol.scale.set(sv.scale.x, sv.scale.y, sv.scale.z);
      vol.name = sv.name || '';
      vol._disabled = !!sv.disabled;
      vol.visible = !vol._disabled;
      viewer.scene.addVolume(vol);
      return vol;
    }

    function serializeSession() {
      var data = {
        version: 1,
        pointCloudID: pointCloudID,
        constraints: constraints.map(function(c) {
          var out = {
            id: c.id, type: c.type, name: c.name,
            points: c.points.map(v3toObj),
            visible: c.visible, locked: !!c.locked
          };
          if (c.type === 'plane' && c.xAxisAnchorA && c.xAxisAnchorB) {
            out.xAxisAnchorA = v3toObj(c.xAxisAnchorA);
            out.xAxisAnchorB = v3toObj(c.xAxisAnchorB);
            if (c.xAxisCamUp) out.xAxisCamUp = v3toObj(c.xAxisCamUp);
          }
          if (c.type === 'plane' && c.rectExtent) {
            out.rectExtent = {
              xMin: c.rectExtent.xMin, xMax: c.rectExtent.xMax,
              yMin: c.rectExtent.yMin, yMax: c.rectExtent.yMax
            };
          }
          if (c.type === 'plane' && c.perpRefNormal) {
            out.perpRefNormal = v3toObj(c.perpRefNormal);
          }
          if (c.type === 'plane' && c.perpRef && c.perpCycle != null) {
            out.perpRef = { X: v3toObj(c.perpRef.X), Y: v3toObj(c.perpRef.Y), N: v3toObj(c.perpRef.N) };
            out.perpCycle = c.perpCycle;
          }
          return out;
        }),
        activeConstraintId: activeConstraintId,
        nextConstraintId: nextConstraintId,
        members: members.map(function(m) {
          return {
            id: m.id, name: m.name,
            points: m.points.map(v3toObj),
            visible: m.visible
          };
        }),
        nextMemberId: nextMemberId,
        measurements: (function() {
          var arr = [];
          var allMeas = viewer.scene.measurements || [];
          for (var i = 0; i < allMeas.length; i++) {
            var m = allMeas[i];
            if (!(m.showDistances || m.showHeight) || m.showArea || m.showAngles) continue;
            var pts = [];
            for (var j = 0; j < m.points.length; j++) {
              var p = m.points[j].position || m.points[j];
              pts.push(v3toObj(p));
            }
            var nums = measurePointNumbers.get(m) || [];
            arr.push({
              id: (m.userData && m.userData._mid != null) ? m.userData._mid : null,
              points: pts,
              pointNumbers: nums.slice(),
              showDistances: !!m.showDistances,
              showHeight: !!m.showHeight,
              only3D: !!(m.userData && m.userData.only3D)
            });
          }
          return arr;
        })(),
        nextPointNumber: nextPointNumber,
        nextMarkId: nextMarkId,
        initialClipBox: initialClipBox ? serializeVolume(initialClipBox) : null,
        marks: markedPoints.map(function(m) {
          return { id: m.id, name: m.name, locked: m.locked, visible: m.visible, position: v3toObj(m.visual.position) };
        }),
        notes: notes.map(function(n) {
          return { id: n.id, name: n.name, text: n.text || '', visible: !!n.visible, position: v3toObj(n.position) };
        }),
        nextNoteId: nextNoteId,
        savedViews: savedViews.map(function(v) { return { id: v.id, name: v.name, cam: v.cam, vis: v.vis, clip: v.clip }; }),
        nextViewId: nextViewId,
        // Elevation map state
        elevationMap: (function() {
          if (elevationCropVolumes.length === 0 && !elevationActive) return null;
          return {
            active: elevationActive,
            zMin: elevationZMin,
            zMax: elevationZMax,
            contoursVisible: elevationContoursVisible,
            elevationBoxes: elevationCropVolumes.map(function(vol) {
              var sv = serializeVolume(vol);
              var cfg = getBoxConfig(vol);
              sv.config = {
                mode: cfg.mode,
                refConstraintIdx: cfg.refConstraintIdx,
                refSide: cfg.refSide,
                sideSet: cfg.sideSet,
                zBaseMarkId: cfg.zBaseMarkId,
                thicknessExpectedMin: cfg.thicknessExpectedMin,
                thicknessExpectedMax: cfg.thicknessExpectedMax,
                thicknessGapTol: cfg.thicknessGapTol,
                zMin: cfg.zMin,
                zMax: cfg.zMax,
                contourStep: cfg.contourStep,
                legendTicks: cfg.legendTicks,
                active: cfg.active
              };
              return sv;
            }),
            exclusionBoxes: exclusionBoxes.map(serializeVolume),
            cutoutBoxes: cutoutBoxes.map(serializeVolume)
          };
        })()
      };
      return data;
    }

    // ===== CLOUD SESSIONS (Firebase / Firestore) =====
    // Private per-user cloud storage layered on top of the existing local-file
    // save/load. Reuses serializeSession() / loadSession() verbatim.
    function _cloudReady() {
      return !!(window.EnableCloud && window.EnableAuth && EnableAuth.currentUser());
    }
    function saveCloudSession() {
      if (!_cloudReady()) { showToast('Sign in to save to the cloud'); return; }
      var name = prompt('Name this cloud session:', 'Session ' + new Date().toLocaleDateString());
      if (!name) return;
      EnableCloud.saveSession(pointCloudID, name, serializeSession()).then(function() {
        showToast('Saved to cloud');
        refreshCloudSessions();
      }).catch(function(err) {
        console.error('[cloud] save failed', err);
        showToast('Cloud save failed');
      });
    }
    function refreshCloudSessions() {
      var listEl = document.getElementById('enable-cloud-list');
      if (!listEl) return;
      if (!_cloudReady()) { listEl.innerHTML = ''; return; }
      listEl.innerHTML = '<div class="enable-cloud-empty">Loading…</div>';
      EnableCloud.listSessions(pointCloudID).then(function(items) {
        if (!items.length) { listEl.innerHTML = '<div class="enable-cloud-empty">No cloud sessions yet.</div>'; return; }
        listEl.innerHTML = '';
        items.forEach(function(it) {
          var row = document.createElement('div');
          row.className = 'enable-cloud-row';
          var label = document.createElement('span');
          label.className = 'enable-cloud-name';
          label.textContent = it.name;
          label.title = it.updatedAt ? new Date(it.updatedAt).toLocaleString() : it.name;
          var load = document.createElement('button');
          load.textContent = 'Load'; load.title = 'Load this cloud session';
          load.onclick = function() {
            if (it.data) { loadSession(it.data); showToast('Loaded "' + it.name + '"'); }
            else showToast('Session data is missing');
          };
          var del = document.createElement('button');
          del.textContent = '✕'; del.title = 'Delete this cloud session';
          del.className = 'enable-cloud-del';
          del.onclick = function() {
            if (!confirm('Delete cloud session "' + it.name + '"?')) return;
            EnableCloud.deleteSession(pointCloudID, it.id).then(function() {
              showToast('Deleted'); refreshCloudSessions();
            }).catch(function(err) { console.error('[cloud] delete failed', err); showToast('Delete failed'); });
          };
          row.appendChild(label); row.appendChild(load); row.appendChild(del);
          listEl.appendChild(row);
        });
      }).catch(function(err) {
        console.error('[cloud] list failed', err);
        listEl.innerHTML = '<div class="enable-cloud-empty">Could not load cloud sessions.</div>';
      });
    }
    function updateUserBar(user) {
      var em = document.getElementById('enable-user-email');
      if (em) em.textContent = (user && user.email) ? user.email : '';
      var so = document.getElementById('enable-signout');
      if (so) so.onclick = function() { EnableAuth.signOut().then(function() { location.reload(); }); };
    }

    function saveSessionToFile() {
      var data = serializeSession();
      var json = JSON.stringify(data, null, 2);
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      var date = new Date().toISOString().slice(0, 10);
      a.download = 'session_' + pointCloudID + '_' + date + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Session saved');
    }

    function loadSession(data) {
      // Validate
      if (!data || data.version !== 1) {
        showToast('Invalid session file');
        return;
      }
      if (data.pointCloudID && data.pointCloudID !== pointCloudID) {
        showToast('Warning: session is for "' + data.pointCloudID + '", current is "' + pointCloudID + '"', 4000);
      }

      // Clear existing state
      clearAllMarkers();
      clearAllNotes();
      while (constraints.length > 0) {
        deleteConstraint(constraints[constraints.length - 1].id);
      }
      while (members.length > 0) {
        deleteMember(members[members.length - 1].id);
      }
      var existingMeas = (viewer.scene.measurements || []).slice();
      for (var i = 0; i < existingMeas.length; i++) {
        viewer.scene.removeMeasurement(existingMeas[i]);
      }
      // Clear elevation state
      if (elevationActive) onClearElevation();
      clearAllElevationBoxes();
      clearAllCutoutBoxes();
      for (var exi = 0; exi < exclusionBoxes.length; exi++) viewer.scene.removeVolume(exclusionBoxes[exi]);
      exclusionBoxes = [];
      rebuildExclusionList();
      undoStack.length = 0;
      redoStack.length = 0;

      // Restore constraints
      if (data.constraints) {
        for (var ci = 0; ci < data.constraints.length; ci++) {
          var sc = data.constraints[ci];
          var pts = sc.points.map(function(p) { return new THREE.Vector3(p.x, p.y, p.z); });
          var c = {
            id: sc.id, type: sc.type, name: sc.name,
            points: pts, visual: null,
            visible: sc.visible !== false,
            locked: !!sc.locked
          };
          if (sc.xAxisAnchorA && sc.xAxisAnchorB) {
            c.xAxisAnchorA = new THREE.Vector3(sc.xAxisAnchorA.x, sc.xAxisAnchorA.y, sc.xAxisAnchorA.z);
            c.xAxisAnchorB = new THREE.Vector3(sc.xAxisAnchorB.x, sc.xAxisAnchorB.y, sc.xAxisAnchorB.z);
            if (sc.xAxisCamUp) {
              c.xAxisCamUp = new THREE.Vector3(sc.xAxisCamUp.x, sc.xAxisCamUp.y, sc.xAxisCamUp.z);
            } else {
              // Old session without camUp — synthesize from world Z so basis is consistent.
              c.xAxisCamUp = new THREE.Vector3(0, 0, 1);
            }
          }
          if (sc.rectExtent) {
            c.rectExtent = {
              xMin: sc.rectExtent.xMin, xMax: sc.rectExtent.xMax,
              yMin: sc.rectExtent.yMin, yMax: sc.rectExtent.yMax
            };
          }
          if (sc.perpRefNormal) {
            c.perpRefNormal = new THREE.Vector3(sc.perpRefNormal.x, sc.perpRefNormal.y, sc.perpRefNormal.z);
          }
          if (sc.perpRef && sc.perpCycle != null) {
            c.perpRef = {
              X: new THREE.Vector3(sc.perpRef.X.x, sc.perpRef.X.y, sc.perpRef.X.z),
              Y: new THREE.Vector3(sc.perpRef.Y.x, sc.perpRef.Y.y, sc.perpRef.Y.z),
              N: new THREE.Vector3(sc.perpRef.N.x, sc.perpRef.N.y, sc.perpRef.N.z)
            };
            c.perpCycle = sc.perpCycle;
          }
          recomputeConstraint(c);
          buildConstraintVisual(c);
          constraints.push(c);
        }
      }
      activeConstraintId = data.activeConstraintId || null;
      selectedConstraintId = null;
      nextConstraintId = data.nextConstraintId || (constraints.length + 1);
      rebuildConstraintList();
      updateConstraintVisuals();

      // Restore members
      if (data.members) {
        for (var mi = 0; mi < data.members.length; mi++) {
          var sm = data.members[mi];
          var m = {
            id: sm.id, name: sm.name,
            points: sm.points.map(function(p) { return new THREE.Vector3(p.x, p.y, p.z); }),
            visual: null,
            visible: sm.visible !== false
          };
          buildMemberVisual(m);
          members.push(m);
        }
      }
      nextMemberId = data.nextMemberId || (members.length + 1);
      rebuildMemberList();

      // Restore measurements
      nextPointNumber = data.nextPointNumber || 1;
      if (data.measurements) {
        for (var mi2 = 0; mi2 < data.measurements.length; mi2++) {
          var sm2 = data.measurements[mi2];
          if (!sm2.points || sm2.points.length < 2) continue;
          var measure = new Potree.Measure();
          // Default to a distance measurement; honor saved type if present
          var savedShowH = !!sm2.showHeight;
          var savedShowD = sm2.showDistances !== false && !savedShowH;
          measure.showDistances = savedShowD;
          measure.showHeight = savedShowH;
          measure.showArea = false;
          measure.showAngles = false;
          measure.closed = false;
          if (sm2.only3D) measure.userData.only3D = true; // set before markers so labels build 3D-only
          // Plain distance measures show ONLY the 3D value in the in-model label
          // (declutter); the left-toolbar accordion still shows the XY/Z split.
          else if (savedShowD) measure.userData.label3DOnly = true;
          for (var pi = 0; pi < sm2.points.length; pi++) {
            var pp = sm2.points[pi];
            measure.addMarker(new THREE.Vector3(pp.x, pp.y, pp.z));
          }
          viewer.scene.addMeasurement(measure);
          // Preserve the saved stable id so saved-view visibility snapshots still match
          if (sm2.id != null) { measure.userData._mid = sm2.id; if (sm2.id >= _nextMeasureMid) _nextMeasureMid = sm2.id + 1; }
          // Override auto-assigned P-numbers with saved ones
          if (sm2.pointNumbers && sm2.pointNumbers.length > 0) {
            measurePointNumbers.set(measure, sm2.pointNumbers.slice());
            syncMeasurePointLabels(measure);
          }
        }
      }
      rebuildAllMeasurementLists();

      // Restore saved views (camera + visibility snapshots). Safe to restore
      // before marks/members are recreated — views are only applied on recall.
      savedViews = [];
      _activeViewId = null;
      if (data.savedViews && data.savedViews.length) {
        savedViews = data.savedViews.map(function(v) { return { id: v.id, name: v.name, cam: v.cam, vis: v.vis, clip: v.clip }; });
        nextViewId = data.nextViewId || (savedViews.reduce(function(mx, v) { return Math.max(mx, v.id); }, 0) + 1);
      } else {
        nextViewId = data.nextViewId || 1;
      }
      rebuildViewsList();

      // Restore marks
      if (data.marks) {
        for (var mk = 0; mk < data.marks.length; mk++) {
          var sm = data.marks[mk];
          // Support both old format (just {x,y,z}) and new format ({id, name, position, ...})
          var pos = sm.position ? sm.position : sm;
          placeMarker(new THREE.Vector3(pos.x, pos.y, pos.z));
          // Override auto-assigned properties with saved ones
          var placed = markedPoints[markedPoints.length - 1];
          if (sm.id) placed.id = sm.id;
          if (sm.name) {
            placed.name = sm.name;
            // Update the label sprite text
            updateMarkLabel(placed);
          }
          if (sm.locked !== undefined) placed.locked = sm.locked;
          if (sm.visible !== undefined) { placed.visible = sm.visible; placed.visual.visible = sm.visible; }
        }
      }
      if (data.nextMarkId) nextMarkId = data.nextMarkId;
      rebuildMarkList();

      // Restore notes
      clearAllNotes();
      if (data.notes) {
        for (var nk = 0; nk < data.notes.length; nk++) {
          var sn = data.notes[nk];
          var npos = new THREE.Vector3(sn.position.x, sn.position.y, sn.position.z);
          var placedNote = placeNote(npos, sn.text || '', sn.name || null, sn.id);
          if (placedNote && sn.visible === false) setNoteVisible(placedNote.id, false);
        }
        // The placeNote call auto-opens the popover for each one; close the last
        // one so loading doesn't leave a popover hanging.
        _closeNotePopover();
      }
      if (data.nextNoteId) nextNoteId = Math.max(nextNoteId, data.nextNoteId);
      rebuildNoteList();

      // Restore initial clip box transform
      if (data.initialClipBox && initialClipBox) {
        var cb = data.initialClipBox;
        initialClipBox.position.set(cb.position.x, cb.position.y, cb.position.z);
        if (cb.rotation) initialClipBox.rotation.set(cb.rotation.x, cb.rotation.y, cb.rotation.z);
        initialClipBox.scale.set(cb.scale.x, cb.scale.y, cb.scale.z);
      }

      // Restore elevation map state
      if (data.elevationMap) {
        var em = data.elevationMap;

        // Clear any existing elevation state first
        if (elevationActive) onClearElevation();
        clearAllElevationBoxes();
        for (var ei = 0; ei < exclusionBoxes.length; ei++) viewer.scene.removeVolume(exclusionBoxes[ei]);
        exclusionBoxes = [];
        clearAllCutoutBoxes();

        // Restore cut-out boxes
        if (em.cutoutBoxes) {
          for (var ci2 = 0; ci2 < em.cutoutBoxes.length; ci2++) {
            var vol = restoreVolume(em.cutoutBoxes[ci2]);
            styleCutoutBox(vol);
            setTimeout((function(v) { return function() { styleCutoutBox(v); }; })(vol), 500);
            cutoutBoxes.push(vol);
            trackVolumeUndo(vol);
            trackCutoutForElevation(vol);
          }
          _cutoutCounter = cutoutBoxes.length;
          syncExclusionBoxes();
          rebuildCutoutList();
        }

        // Restore elevation boxes with per-box config
        var hasActiveBox = false;
        if (em.elevationBoxes) {
          for (var ei2 = 0; ei2 < em.elevationBoxes.length; ei2++) {
            var sv = em.elevationBoxes[ei2];
            var vol = restoreVolume(sv);
            styleElevationBox(vol);
            setTimeout((function(v) { return function() { styleElevationBox(v); }; })(vol), 500);
            elevationCropVolumes.push(vol);
            trackVolumeUndo(vol);
            // Restore per-box config
            if (sv.config) {
              var cfg = getBoxConfig(vol);
              cfg.mode = sv.config.mode || 'z';
              cfg.refConstraintIdx = sv.config.refConstraintIdx;
              cfg.refSide = sv.config.refSide || 1;
              cfg.sideSet = !!sv.config.sideSet;
              cfg.zBaseMarkId = (sv.config.zBaseMarkId != null) ? sv.config.zBaseMarkId : null;
              if (sv.config.thicknessExpectedMin != null) cfg.thicknessExpectedMin = sv.config.thicknessExpectedMin;
              if (sv.config.thicknessExpectedMax != null) cfg.thicknessExpectedMax = sv.config.thicknessExpectedMax;
              if (sv.config.thicknessGapTol != null) cfg.thicknessGapTol = sv.config.thicknessGapTol;
              cfg.zMin = sv.config.zMin;
              cfg.zMax = sv.config.zMax;
              cfg.contourStep = sv.config.contourStep || 0.05;
              if (sv.config.legendTicks != null) cfg.legendTicks = sv.config.legendTicks;
              cfg.active = !!sv.config.active;
              // Restore reference plane from constraint index
              if (cfg.mode === 'plane' && cfg.refConstraintIdx >= 0 && cfg.refConstraintIdx < constraints.length) {
                var refC = constraints[cfg.refConstraintIdx];
                cfg.refPlane = { normal: refC.normal.clone(), centroid: refC.centroid.clone() };
              }
              if (cfg.active) hasActiveBox = true;
            }
          }
          _elevBoxCounter = elevationCropVolumes.length;
          syncHighlightBoxes();
          rebuildElevationBoxList();
        }

        // Restore exclusion boxes
        if (em.exclusionBoxes) {
          for (var xi = 0; xi < em.exclusionBoxes.length; xi++) {
            var vol = restoreVolume(em.exclusionBoxes[xi]);
            if (vol.box) { vol.box.material.color.setHex(0x000000); vol.box.material.opacity = 0.03; vol.box.material.transparent = true; vol.box.material.needsUpdate = true; }
            if (vol.frame) { vol.frame.material.color.setHex(0x000000); vol.frame.material.needsUpdate = true; }
            if (vol.label) vol.label.visible = false;
            exclusionBoxes.push(vol);
            trackVolumeUndo(vol);
          }
          rebuildExclusionList();
        }

        // Trigger recompute for each active box
        if (hasActiveBox && elevationCropVolumes.length > 0) {
          setTimeout(function() {
            // Find first active box and compute
            for (var bi2 = 0; bi2 < elevationCropVolumes.length; bi2++) {
              var boxCfg = getBoxConfig(elevationCropVolumes[bi2]);
              if (boxCfg.active) {
                _selectedElevBox = elevationCropVolumes[bi2];
                syncElevGlobals();
                onComputeElevation();
                break;
              }
            }
          }, 300);
        }
      }

      // Clear undo stack from restore operations
      undoStack.length = 0;
      redoStack.length = 0;

      showToast('Session loaded');
    }

    function loadSessionFromFile() {
      var input = document.getElementById('session-file-input');
      if (!input) return;
      input.click();
    }

    // -- Inject sidebar buttons once GUI is ready --
    // ===== ELEVATION MAP — UTILITY FUNCTIONS =====

    // Force-load octree nodes. If filterAABB is provided, ONLY load nodes
    // whose bounding box intersects that AABB — critical for large clouds
    // (otherwise we load 26M+ points to compute a heat map on a small region).
    // Force-load octree nodes intersecting filterAABB. opts:
    //   maxDepth     — stop recursing past this octree depth (root = 0). The
    //                  major lever for web performance: each leaf node is one
    //                  HTTP request, and recursing to leaves over a CDN at
    //                  ~50ms RTT can mean thousands of requests for a "large
    //                  area". Capping at depth ~6 typically gives several
    //                  hundred thousand points — plenty for elevation/contour
    //                  analysis (200×200 grid) — at 5–10× fewer requests.
    //   maxPoints    — soft cap; once already-loaded in-AABB points exceed
    //                  this, deeper levels are skipped between polls. Acts as
    //                  a points-based ceiling on top of maxDepth. Default Inf.
    //   onProgress   — optional callback({loaded, target}) for status updates.
    function forceLoadAllNodes(pointCloud, filterAABB, opts) {
      opts = opts || {};
      var maxDepth = opts.maxDepth != null ? opts.maxDepth : Infinity;
      var maxPoints = opts.maxPoints != null ? opts.maxPoints : Infinity;
      var onProgress = opts.onProgress;
      return new Promise(function (resolve) {
        var geo = pointCloud.pcoGeometry;
        if (!geo || !geo.root) { resolve(); return; }
        var pcoOffset = geo.offset;
        function nodeIntersects(node) {
          if (!filterAABB) return true;
          if (!node.boundingBox) return true;
          var nbb = node.boundingBox;
          var wxmin = pcoOffset.x + nbb.min.x, wxmax = pcoOffset.x + nbb.max.x;
          var wymin = pcoOffset.y + nbb.min.y, wymax = pcoOffset.y + nbb.max.y;
          var wzmin = pcoOffset.z + nbb.min.z, wzmax = pcoOffset.z + nbb.max.z;
          return !(wxmax < filterAABB.min[0] || wxmin > filterAABB.max[0] ||
                   wymax < filterAABB.min[1] || wymin > filterAABB.max[1] ||
                   wzmax < filterAABB.min[2] || wzmin > filterAABB.max[2]);
        }
        function countLoadedPoints() {
          var n = 0;
          function visit(node) {
            if (!node || !nodeIntersects(node)) return;
            if (node.loaded && node.geometry && node.geometry.attributes.position) {
              n += node.geometry.attributes.position.count;
            }
            if (node.children) {
              for (var i = 0; i < 8; i++) if (node.children[i]) visit(node.children[i]);
            }
          }
          visit(geo.root);
          return n;
        }
        // BFS by level so depth and point-budget caps are easy to enforce.
        // Trigger loads on each in-AABB node up to maxDepth; stop early if
        // already-loaded points exceed maxPoints between levels.
        function triggerLoadsBFS() {
          var current = [geo.root];
          var depth = 0;
          while (current.length > 0 && depth <= maxDepth) {
            var next = [];
            for (var i = 0; i < current.length; i++) {
              var node = current[i];
              if (!node || !nodeIntersects(node)) continue;
              if (!node.loaded) node.load();
              if (node.children) {
                for (var j = 0; j < 8; j++) {
                  if (node.children[j]) next.push(node.children[j]);
                }
              }
            }
            current = next;
            depth++;
            if (countLoadedPoints() >= maxPoints) break;
          }
        }
        var origMax = Potree.maxNodesLoading || 4;
        // CDNs over HTTP/2 multiplex many streams over one connection; the
        // default cap of 4 (and previous bump to 20) leaves throughput on the
        // table during a force-load burst.
        Potree.maxNodesLoading = 60;
        triggerLoadsBFS();
        var poll = setInterval(function () {
          if (onProgress) {
            try { onProgress({ loaded: countLoadedPoints(), inFlight: Potree.numNodesLoading }); } catch (_) {}
          }
          if (Potree.numNodesLoading === 0) {
            clearInterval(poll);
            Potree.maxNodesLoading = origMax;
            resolve();
          }
        }, 200);
      });
    }

    // Extract loaded-node positions, optionally filtered to nodes that
    // intersect a given AABB. Nodes outside the filter are skipped entirely
    // to avoid allocating a 300MB merged buffer for points we'll never use.
    function extractPositions(pointCloud, filterAABB, maxLevel) {
      var geo = pointCloud.pcoGeometry;
      var allPositions = [];
      var nodeMap = [];
      var totalCount = 0;
      var pcoOffset = geo.offset;
      function nodeLevel(node) {
        return (node.level != null) ? node.level : (node.name ? node.name.length - 1 : 0);
      }
      function nodeIntersects(node) {
        if (!filterAABB) return true;
        if (!node.boundingBox) return true;
        var nbb = node.boundingBox;
        var wxmin = pcoOffset.x + nbb.min.x, wxmax = pcoOffset.x + nbb.max.x;
        var wymin = pcoOffset.y + nbb.min.y, wymax = pcoOffset.y + nbb.max.y;
        var wzmin = pcoOffset.z + nbb.min.z, wzmax = pcoOffset.z + nbb.max.z;
        return !(wxmax < filterAABB.min[0] || wxmin > filterAABB.max[0] ||
                 wymax < filterAABB.min[1] || wymin > filterAABB.max[1] ||
                 wzmax < filterAABB.min[2] || wzmin > filterAABB.max[2]);
      }
      function traverse(node) {
        if (!node || !nodeIntersects(node)) return;
        // Deterministic set: ignore nodes deeper than maxLevel. Potree also
        // streams view-dependent deeper nodes that would otherwise leak in and
        // make each recompute use a different point set (→ shifting contours).
        if (maxLevel != null && nodeLevel(node) > maxLevel) return;
        if (node.loaded && node.geometry) {
          var posAttr = node.geometry.attributes.position;
          if (posAttr && posAttr.array) {
            var bbMin = node.boundingBox
              ? { x: node.boundingBox.min.x, y: node.boundingBox.min.y, z: node.boundingBox.min.z }
              : { x: 0, y: 0, z: 0 };
            nodeMap.push({ geometryNode: node, startIndex: totalCount, count: posAttr.count, bbMin: bbMin });
            totalCount += posAttr.count;
            allPositions.push({ array: posAttr.array, count: posAttr.count, bbMin: bbMin });
          }
        }
        if (node.children) {
          for (var i = 0; i < 8; i++) {
            if (node.children[i]) traverse(node.children[i]);
          }
        }
      }
      traverse(geo.root);
      var merged = new Float32Array(totalCount * 3);
      var writeOffset = 0;
      var pcoOffset = geo.offset;
      var ox = pcoOffset.x, oy = pcoOffset.y, oz = pcoOffset.z;
      for (var n = 0; n < allPositions.length; n++) {
        var arr = allPositions[n].array;
        var cnt = allPositions[n].count;
        var bb = allPositions[n].bbMin;
        var tx = ox + bb.x, ty = oy + bb.y, tz = oz + bb.z;
        for (var i = 0; i < cnt; i++) {
          merged[writeOffset]     = arr[i * 3]     + tx;
          merged[writeOffset + 1] = arr[i * 3 + 1] + ty;
          merged[writeOffset + 2] = arr[i * 3 + 2] + tz;
          writeOffset += 3;
        }
      }
      return { positions: merged, count: totalCount, nodeMap: nodeMap };
    }

    function backupOriginalRGBA(pointCloud) {
      var map = new Map();
      var geo = pointCloud.pcoGeometry;
      function traverse(node) {
        if (!node) return;
        if (node.loaded && node.geometry) {
          var rgba = node.geometry.attributes.rgba;
          if (rgba && rgba.array) map.set(node, new Uint8Array(rgba.array));
        }
        if (node.children) {
          for (var i = 0; i < 8; i++) {
            if (node.children[i]) traverse(node.children[i]);
          }
        }
      }
      traverse(geo.root);
      return map;
    }

    function restoreOriginalRGBA(backupMap) {
      if (!backupMap) return;
      backupMap.forEach(function (origArray, node) {
        if (node.geometry && node.geometry.attributes.rgba) {
          var rgba = node.geometry.attributes.rgba;
          rgba.array.set(origArray);
          rgba.needsUpdate = true;
        }
      });
    }

    // Sequential color ramp: blue → cyan → green → yellow → red
    function elevationToRGBA(z, zMin, zMax) {
      var range = zMax - zMin;
      if (range < 1e-6) return [128, 128, 128, 255];
      var t = (z - zMin) / range;
      t = Math.max(0, Math.min(1, t));

      var r, g, b;
      if (t < 0.25) {
        var s = t / 0.25;
        r = 0;
        g = Math.round(255 * s);
        b = 255;
      } else if (t < 0.5) {
        var s = (t - 0.25) / 0.25;
        r = 0;
        g = 255;
        b = Math.round(255 * (1 - s));
      } else if (t < 0.75) {
        var s = (t - 0.5) / 0.25;
        r = Math.round(255 * s);
        g = 255;
        b = 0;
      } else {
        var s = (t - 0.75) / 0.25;
        r = 255;
        g = Math.round(255 * (1 - s));
        b = 0;
      }
      return [r, g, b, 255];
    }

    function getCropBoxBounds(volume) {
      if (!volume) return null;
      volume.updateMatrixWorld(true);
      var mat = volume.matrixWorld;
      var corners = [
        new THREE.Vector3(-0.5, -0.5, -0.5), new THREE.Vector3( 0.5, -0.5, -0.5),
        new THREE.Vector3(-0.5,  0.5, -0.5), new THREE.Vector3( 0.5,  0.5, -0.5),
        new THREE.Vector3(-0.5, -0.5,  0.5), new THREE.Vector3( 0.5, -0.5,  0.5),
        new THREE.Vector3(-0.5,  0.5,  0.5), new THREE.Vector3( 0.5,  0.5,  0.5)
      ];
      var min = new THREE.Vector3(Infinity, Infinity, Infinity);
      var max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
      for (var i = 0; i < corners.length; i++) {
        corners[i].applyMatrix4(mat);
        min.min(corners[i]);
        max.max(corners[i]);
      }
      return { min: [min.x, min.y, min.z], max: [max.x, max.y, max.z] };
    }

    // Get the union AABB of all active elevation crop volumes
    function getElevationCropBounds() {
      var active = elevationCropVolumes.filter(function(v) { return !v._disabled; });
      if (active.length === 0) return null;
      var min = new THREE.Vector3(Infinity, Infinity, Infinity);
      var max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
      for (var b = 0; b < active.length; b++) {
        var bounds = getCropBoxBounds(active[b]);
        if (!bounds) continue;
        min.x = Math.min(min.x, bounds.min[0]); min.y = Math.min(min.y, bounds.min[1]); min.z = Math.min(min.z, bounds.min[2]);
        max.x = Math.max(max.x, bounds.max[0]); max.y = Math.max(max.y, bounds.max[1]); max.z = Math.max(max.z, bounds.max[2]);
      }
      return { min: [min.x, min.y, min.z], max: [max.x, max.y, max.z] };
    }

    // Check if a point is inside ANY active elevation crop volume (exact OBB test)
    // Pre-compute inverse matrices for elevation crop volumes (call once before loop)
    function buildElevationInvMats() {
      var mats = [];
      for (var b = 0; b < elevationCropVolumes.length; b++) {
        var vol = elevationCropVolumes[b];
        if (vol._disabled) continue;
        vol.updateMatrixWorld(true);
        mats.push(new THREE.Matrix4().copy(vol.matrixWorld).invert());
      }
      return mats;
    }

    // Check point against pre-computed inverse matrices
    function isInsideAnyElevationBoxFast(px, py, pz, elevInvMats) {
      var v = new THREE.Vector3();
      for (var b = 0; b < elevInvMats.length; b++) {
        v.set(px, py, pz).applyMatrix4(elevInvMats[b]);
        if (v.x >= -0.5 && v.x <= 0.5 &&
            v.y >= -0.5 && v.y <= 0.5 &&
            v.z >= -0.5 && v.z <= 0.5) return true;
      }
      return false;
    }

    // Legacy wrapper (used in per-frame recolor for single nodes)
    function isInsideAnyElevationBox(px, py, pz) {
      var mats = buildElevationInvMats();
      return isInsideAnyElevationBoxFast(px, py, pz, mats);
    }

    // Build a 2D grid of max-Z values for top-surface detection
    function buildSurfaceGrid(positions, cropBounds, gridRes) {
      gridRes = gridRes || 200;
      var xMin = cropBounds ? cropBounds.min[0] : Infinity;
      var xMax = cropBounds ? cropBounds.max[0] : -Infinity;
      var yMin = cropBounds ? cropBounds.min[1] : Infinity;
      var yMax = cropBounds ? cropBounds.max[1] : -Infinity;

      // If no crop bounds, compute from positions
      if (!cropBounds) {
        var count = positions.length / 3;
        for (var i = 0; i < count; i++) {
          var px = positions[i * 3], py = positions[i * 3 + 1];
          if (px < xMin) xMin = px; if (px > xMax) xMax = px;
          if (py < yMin) yMin = py; if (py > yMax) yMax = py;
        }
      }

      var xRange = xMax - xMin, yRange = yMax - yMin;
      if (xRange < 1e-6 || yRange < 1e-6) return null;
      var cellX = xRange / gridRes, cellY = yRange / gridRes;

      var maxZ = new Float32Array(gridRes * gridRes);
      for (var i = 0; i < maxZ.length; i++) maxZ[i] = -Infinity;

      var count = positions.length / 3;
      for (var i = 0; i < count; i++) {
        var px = positions[i * 3], py = positions[i * 3 + 1], pz = positions[i * 3 + 2];
        if (cropBounds) {
          if (px < cropBounds.min[0] || px > cropBounds.max[0] ||
              py < cropBounds.min[1] || py > cropBounds.max[1] ||
              pz < cropBounds.min[2] || pz > cropBounds.max[2]) continue;
        }
        var ix = Math.floor((px - xMin) / cellX);
        var iy = Math.floor((py - yMin) / cellY);
        if (ix >= gridRes) ix = gridRes - 1;
        if (iy >= gridRes) iy = gridRes - 1;
        if (ix < 0) ix = 0; if (iy < 0) iy = 0;
        var idx = iy * gridRes + ix;
        if (pz > maxZ[idx]) maxZ[idx] = pz;
      }

      return { maxZ: maxZ, gridRes: gridRes, xMin: xMin, yMin: yMin, cellX: cellX, cellY: cellY };
    }

    // Check if a point is on the top surface (within tolerance of max Z in its grid cell)
    function isTopSurface(px, py, pz, surfGrid, tolerance) {
      if (!surfGrid) return true;
      var ix = Math.floor((px - surfGrid.xMin) / surfGrid.cellX);
      var iy = Math.floor((py - surfGrid.yMin) / surfGrid.cellY);
      if (ix < 0 || iy < 0 || ix >= surfGrid.gridRes || iy >= surfGrid.gridRes) return false;
      var cellMaxZ = surfGrid.maxZ[iy * surfGrid.gridRes + ix];
      if (cellMaxZ === -Infinity) return false;
      return pz >= cellMaxZ - tolerance;
    }

    // Build the per-box draw list used by the heat-map coloring pipeline.
    // Each entry has the inverse matrix, config, tolerance, and resolved zMin/zMax (user or cfg auto).
    function buildActiveBoxDrawList() {
      var list = [];
      for (var i = 0; i < elevationCropVolumes.length; i++) {
        var vol = elevationCropVolumes[i];
        if (vol._disabled) continue;
        var cfg = getBoxConfig(vol);
        if (!cfg.active) continue;
        if (cfg.heatmapHidden) continue;
        if (cfg.zMin == null || cfg.zMax == null || cfg.zMin >= cfg.zMax) continue;
        vol.updateMatrixWorld(true);
        // Surface-filter tolerance: Z mode and Plane mode have zMin/zMax in
        // the same SPATIAL units the surface grid is built in, so 10% of
        // their range is a sensible tolerance. Thickness mode's zMin/zMax
        // are THICKNESS values (~10s of cm) and cfg.surfaceGrid is in Z
        // space, so 10% of thickness range is far too tight (rejects the
        // whole top surface). Use a fixed slab-friendly Z tolerance instead.
        var tol = (cfg.mode === 'thickness')
          ? 0.10  // 100mm — generous for slab top-surface variation
          : (cfg.zMax - cfg.zMin) * 0.10;
        // Hoist per-box mode constants once so the per-point loops in
        // applyElevationColors / colorNodeByElevation don't re-resolve
        // them N times.
        var entry = {
          invMat: new THREE.Matrix4().copy(vol.matrixWorld).invert(),
          cfg: cfg,
          tolerance: tol,
          mode: cfg.mode || 'z'
        };
        if (entry.mode === 'plane' && cfg.refPlane) {
          entry.pNx = cfg.refPlane.normal.x;
          entry.pNy = cfg.refPlane.normal.y;
          entry.pNz = cfg.refPlane.normal.z;
          entry.pCx = cfg.refPlane.centroid.x;
          entry.pCy = cfg.refPlane.centroid.y;
          entry.pCz = cfg.refPlane.centroid.z;
          entry.pSide = cfg.refSide || 1;
        } else if (entry.mode !== 'thickness') {
          entry.zBaseZ = getZBaseZ(cfg);
        }
        list.push(entry);
      }
      return list;
    }

    function applyElevationColors(positions, nodeMap) {
      var boxes = buildActiveBoxDrawList();
      var exclInvMats = buildExclusionInvMats();
      var hasExclusions = exclInvMats.length > 0;
      var v = new THREE.Vector3();

      for (var n = 0; n < nodeMap.length; n++) {
        var entry = nodeMap[n];
        var node = entry.geometryNode;
        if (!node.geometry || !node.geometry.attributes.rgba) continue;

        // streams a node out and back in: re-streamed nodes get a fresh
        // geometry without this tag, so elevationFrameUpdate will re-color.

            } else if (cfg.surfaceGrid) {

                arr[off + 2] = origArr[off + 2];
                arr[off + 3] = origArr[off + 3];

    }

    // Color a single geometry node by elevation (for newly loaded nodes during zoom).
    // Optional `cachedBoxes` and `cachedExcl` skip the rebuilds — pass them when
    // coloring multiple nodes in one frame so we don't re-walk the volume lists
    // for every node.
    function colorNodeByElevation(node, pc, cachedBoxes, cachedExcl) {
      if (!node.geometry || !node.geometry.attributes.rgba || !node.geometry.attributes.position) return;

      // be re-colored automatically because their fresh BufferGeometry won't
      // have this flag set).

      var rgba = node.geometry.attributes.rgba;

      var geo = pc.pcoGeometry;

      var ty = pcoOffset.y + bbMin.y;
      var tz = pcoOffset.z + bbMin.z;

              v.y >= -0.5 && v.y <= 0.5 &&
              v.z >= -0.5 && v.z <= 0.5) { hitBox = boxes[b]; break; }
        }

        var keep = !!hitBox;
        if (keep) {
          var cfg = hitBox.cfg;
          if (cfg.planeSurfGrid) {
            if (!isPlaneTopSurface(px, py, pz, cfg.planeSurfGrid, hitBox.tolerance)) keep = false;
          } else if (cfg.surfaceGrid) {
            if (!isTopSurface(px, py, pz, cfg.surfaceGrid, hitBox.tolerance)) keep = false;
          }
          if (keep && hasExclusions && isPointExcluded(px, py, pz, exclInvMats)) keep = false;
        }

        if (keep) {
          var cfg2 = hitBox.cfg;
          var elev;
          if (hitBox.mode === 'plane') {
            elev = ((px - hitBox.pCx) * hitBox.pNx + (py - hitBox.pCy) * hitBox.pNy + (pz - hitBox.pCz) * hitBox.pNz) * hitBox.pSide;
          } else if (hitBox.mode === 'thickness') {
            elev = getThicknessForPoint(px, py, pz, cfg2.thicknessGrid);
          } else {
            elev = pz - hitBox.zBaseZ;

          if (elev === null) {

          } else {
            var color = elevationToRGBA(elev, cfg2.zMin, cfg2.zMax);
            arr[off] = color[0]; arr[off + 1] = color[1];
            arr[off + 2] = color[2]; arr[off + 3] = color[3];
          }

    }

    // Re-color EVERY loaded node that was ever elevation-colored — not just the
    // compute-time elevationNodeMap. Nodes coloured while the user navigates
    // (via elevationFrameUpdate) are NOT in elevationNodeMap, so re-coloring
    // through applyElevationColors(elevationPositions, elevationNodeMap) left
    // their heat colours behind when a box was hidden/deactivated ("colouring of
    // some points at some locations remains"). Walk the elevColored geometries
    // and re-run colorNodeByElevation with the CURRENT active-box list — points
    // no longer covered by any active box fall back to their originals.
    function recolorElevatedNodes() {
      var pc = viewer.scene.pointclouds[0];
      if (!pc || !pc.pcoGeometry || !pc.pcoGeometry.root) return;
      var cachedBoxes = buildActiveBoxDrawList();
      var cachedExcl = buildExclusionInvMats();
      elevationColoredNodes.clear();
      (function walk(node) {

            node.geometry.attributes.rgba &&
            node.geometry.userData && node.geometry.userData.elevColored) {

    // large clouds and inflates memory through repeated allocations.

    var _elevPrevLoadingCount = 0;

      // after streaming finishes (to catch the just-finished load). Skipping
      // entirely otherwise drops elevation per-frame cost to ~zero.

          for (var i = 0; i < 8; i++) {

      var cachedExcl = buildExclusionInvMats();

    // ===== Per-box elevation LEGENDS =====
    // Each ACTIVE box gets its own gradient legend (its own range + tick density),

    function _legendTextColor() {

    function renderBoxLegend(canvas, cfg, barX, barW) {
      var ctx = canvas.getContext('2d');
      var w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      var zMin = cfg.zMin, zMax = cfg.zMax;
      if (zMin == null || zMax == null || !(zMax > zMin)) return;
      var txt = _legendTextColor();
      var range = zMax - zMin;
      var barTop = 8, barBot = h - 10;

      // Gradient bar (top = high, bottom = low)

        var tt = 1 - (y / barH);

        ctx.beginPath(); ctx.moveTo(barX - tickLen, yPos); ctx.lineTo(barX, yPos); ctx.stroke();
        ctx.fillStyle = txt; ctx.textAlign = 'right';

      }
    }

    // Rebuild the whole legend row: one legend per active, painting box.
    function rebuildElevationLegends() {
      var stack = document.getElementById('heatmap-legend-stack');
      if (!stack) return;
      stack.innerHTML = '';
      // One legend per COMPUTED (cfg.active), not-hidden, valid-range box. Iterate the
      // volumes directly (buildActiveBoxDrawList returns draw ENTRIES, not volumes, so
      // it can't give us the box name) using the same filter it applies.
      for (var i = 0; i < elevationCropVolumes.length; i++) {
        var vol = elevationCropVolumes[i];
        if (vol._disabled) continue;
        var cfg = getBoxConfig(vol);
        if (!cfg.active || cfg.heatmapHidden) continue;
        if (cfg.zMin == null || cfg.zMax == null || !(cfg.zMax > cfg.zMin)) continue;
        var item = document.createElement('div');
        item.className = 'heatmap-legend-item';
        // Title block (box name, larger) + unit (smaller), bottom-aligned so bars line up.
        var head = document.createElement('div');
        head.className = 'heatmap-legend-head';
        var nm = document.createElement('div');
        nm.className = 'heatmap-legend-name';
        nm.textContent = vol.name || 'Box';
        nm.style.color = _legendTextColor();
        var un = document.createElement('div');
        un.className = 'heatmap-legend-unit';
        un.textContent = UNIT_MODE === 'mm' ? '(m)' : '(ft-in)';
        un.style.color = _legendTextColor();
        head.appendChild(nm); head.appendChild(un);
        // Size the canvas so the bar is CENTERED (symmetric margins = label width),
        // and set the title block to the same width so its centred text lands over
        // the bar. Adapts to short (metric) vs wide (imperial) tick labels.
        var _barW = 34, _tickPad = 14;
        var _labelW = Math.ceil(_legendMaxLabelWidth(cfg));
        var _margin = _labelW + _tickPad;         // room for labels + tick, both sides (centres the bar)
        var _cw = _margin * 2 + _barW;
        var cv = document.createElement('canvas');
        cv.width = _cw; cv.height = 430;
        head.style.width = _cw + 'px';
        item.appendChild(head); item.appendChild(cv);
        stack.appendChild(item);
        renderBoxLegend(cv, cfg, _margin, _barW);
      }
      stack.style.display = stack.children.length ? 'flex' : 'none';
    }

    function hideElevationLegend() {
      var el = document.getElementById('heatmap-legend-stack');
      if (el) el.style.display = 'none';
    }

    // ===== ELEVATION MAP — CONTOUR LINES =====

    function smallestEigenvector3x3_local(a00, a01, a02, a11, a12, a22) {
      var trace = a00 + a11 + a22;
      var q = trace / 3;
      var b00 = a00 - q, b11 = a11 - q, b22 = a22 - q;
      var p2 = b00*b00 + b11*b11 + b22*b22 + 2*(a01*a01 + a02*a02 + a12*a12);
      var p = Math.sqrt(p2 / 6);

      var invP = 1/p;
      var B00=b00*invP, B01=a01*invP, B02=a02*invP;
      var B11=b11*invP, B12=a12*invP, B22=b22*invP;
      var detB = B00*(B11*B22-B12*B12) - B01*(B01*B22-B12*B02) + B02*(B01*B12-B11*B02);
      var halfDetB = Math.max(-1, Math.min(1, detB/2));

      var m00=a00-lambda0, m01x=a01, m02x=a02;
      var m10=a01, m11x=a11-lambda0, m12x=a12;
      var m20=a02, m21=a12, m22x=a22-lambda0;
      var nx = m01x*m12x - m02x*m11x;
      var ny = m02x*m10 - m00*m12x;

      var len = Math.sqrt(nx*nx+ny*ny+nz*nz);
      if (len < 1e-12) {
        nx=m01x*m22x-m02x*m21; ny=m02x*m20-m00*m22x; nz=m00*m21-m01x*m20;
        len = Math.sqrt(nx*nx+ny*ny+nz*nz);
      }
      if (len < 1e-12) {
        nx=m11x*m22x-m12x*m21; ny=m12x*m20-m10*m22x; nz=m10*m21-m11x*m20;
        len = Math.sqrt(nx*nx+ny*ny+nz*nz);
      }
      if (len < 1e-12) return [0, 0, 1];
      return [nx/len, ny/len, nz/len];
    }

    function marchingSquares(grid, cols, rows, level) {
      var segments = [];
      function msLerp(va, vb) {
        if (Math.abs(vb - va) < 1e-10) return 0.5;
        return (level - va) / (vb - va);
      }
      for (var r = 0; r < rows - 1; r++) {
        for (var c = 0; c < cols - 1; c++) {
          var v00 = grid[r * cols + c];
          var v10 = grid[r * cols + c + 1];
          var v01 = grid[(r + 1) * cols + c];
          var v11 = grid[(r + 1) * cols + c + 1];
          if (isNaN(v00) || isNaN(v10) || isNaN(v01) || isNaN(v11)) continue;
          var b00 = v00 >= level ? 1 : 0;
          var b10 = v10 >= level ? 1 : 0;
          var b01 = v01 >= level ? 1 : 0;
          var b11 = v11 >= level ? 1 : 0;
          var idx = b00 | (b10 << 1) | (b01 << 2) | (b11 << 3);
          if (idx === 0 || idx === 15) continue;

          var top    = [c + msLerp(v01, v11), r + 1];
          var left   = [c, r + msLerp(v00, v01)];
          var right  = [c + 1, r + msLerp(v10, v11)];
          switch (idx) {
            case 1:  segments.push([bottom[0], bottom[1], left[0], left[1]]); break;
            case 2:  segments.push([bottom[0], bottom[1], right[0], right[1]]); break;
            case 3:  segments.push([left[0], left[1], right[0], right[1]]); break;
            case 4:  segments.push([left[0], left[1], top[0], top[1]]); break;
            case 5:  segments.push([bottom[0], bottom[1], top[0], top[1]]); break;
            case 6:

                segments.push([right[0], right[1], top[0], top[1]]);
              } else {
                segments.push([bottom[0], bottom[1], right[0], right[1]]);
                segments.push([left[0], left[1], top[0], top[1]]);
              }
              break;
            case 7:  segments.push([right[0], right[1], top[0], top[1]]); break;
            case 8:  segments.push([right[0], right[1], top[0], top[1]]); break;
            case 9:

                segments.push([left[0], left[1], top[0], top[1]]);

                segments.push([right[0], right[1], top[0], top[1]]);
              }
              break;
            case 10: segments.push([bottom[0], bottom[1], top[0], top[1]]); break;
            case 11: segments.push([left[0], left[1], top[0], top[1]]); break;
            case 12: segments.push([left[0], left[1], right[0], right[1]]); break;
            case 13: segments.push([bottom[0], bottom[1], right[0], right[1]]); break;
            case 14: segments.push([bottom[0], bottom[1], left[0], left[1]]); break;
          }
        }
      }
      return segments;
    }

    function createContourLabel(text, color) {
      var canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 48;
      var ctx = canvas.getContext('2d');

      // Background pill (matches temporal viewer)
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(2, 2, canvas.width - 4, canvas.height - 4, 8);
      } else {
        ctx.rect(2, 2, canvas.width - 4, canvas.height - 4);
      }
      ctx.fill();

      // Text
      ctx.fillStyle = color;
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

    }

    // Remove a single box's contour group (or all if no box given)

        if (obj.material) {

          obj.material.dispose();
        }

      elevationScene.remove(group);
    }
