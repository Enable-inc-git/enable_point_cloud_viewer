      // the global bottom value. Ensures cells in regions with no underside
      // scan still get a thickness reading (assuming any underside was
      // scanned anywhere in the box). Per-cell measurements take priority.
      if (globalBottomD < Infinity) {
        for (var ci = 0; ci < nCells; ci++) {
          if (hasTop[ci] && !hasBottom[ci]) {
            bottomAll[ci] = globalBottomD;
            hasBottom[ci] = 1;
          }
        }
      }

      depths = null;
      cellOffset = null;
      cellCount = null;

      // Phase 2 — bottom-surface infill via iterative neighbor averaging.
      // The slab underside is mostly continuous, so cells with a top scan
      // but no detected bottom can borrow a bottom estimate from valid
      // neighbors. Drop panels and slab steps survive because their cells
      // have their own measured bottom that overrides the infill.
      var bottomFilled = new Float32Array(bottomAll);
      var hasBottomF = new Uint8Array(hasBottom);
      var pending = new Float32Array(nCells);
      var pendingMask = new Uint8Array(nCells);
      var maxIters = Math.max(gridRes, 50); // enough to cross the box
      for (var iter = 0; iter < maxIters; iter++) {
        var changed = false;
        for (var iy = 0; iy < gridRes; iy++) {
          for (var ix = 0; ix < gridRes; ix++) {
            var ci = iy * gridRes + ix;
            if (hasBottomF[ci]) continue;
            if (!hasTop[ci]) continue; // only fill cells that have a top
            var sum = 0, n = 0;
            if (ix > 0)            { var nci = ci - 1;       if (hasBottomF[nci]) { sum += bottomFilled[nci]; n++; } }
            if (ix < gridRes - 1)  { var nci = ci + 1;       if (hasBottomF[nci]) { sum += bottomFilled[nci]; n++; } }
            if (iy > 0)            { var nci = ci - gridRes; if (hasBottomF[nci]) { sum += bottomFilled[nci]; n++; } }
            if (iy < gridRes - 1)  { var nci = ci + gridRes; if (hasBottomF[nci]) { sum += bottomFilled[nci]; n++; } }
            if (n > 0) {
              pending[ci] = sum / n;
              pendingMask[ci] = 1;
              changed = true;
            }
          }
        }
        if (!changed) break;
        for (var i = 0; i < nCells; i++) {
          if (pendingMask[i]) {
            bottomFilled[i] = pending[i];
            hasBottomF[i] = 1;
            pendingMask[i] = 0;
          }
        }
      }
      pending = null; pendingMask = null;

      // Phase 3 — Pass C sanity filter on (top, infilled-bottom) pairs.
      // Free originals once we've used them for infill seeding.
      var thickness = new Float32Array(nCells);
      var topD      = new Float32Array(nCells);
      var bottomD   = new Float32Array(nCells);
      var valid     = new Uint8Array(nCells);
      for (var ci = 0; ci < nCells; ci++) {
        if (!hasTop[ci] || !hasBottomF[ci]) continue;
        var t = topAll[ci] - bottomFilled[ci];
        if (t < expectedMin || t > expectedMax) continue;
        thickness[ci] = t;
        topD[ci] = topAll[ci];
        bottomD[ci] = bottomFilled[ci];
        valid[ci] = 1;
      }
      topAll = null; hasTop = null;
      bottomAll = null; hasBottom = null;
      bottomFilled = null; hasBottomF = null;

      // Pass D — 3×3 median filter; reject cells differing > 30% from median
      var thicknessF = new Float32Array(nCells);
      var validF     = new Uint8Array(nCells);
      var topF       = new Float32Array(nCells);
      var botF       = new Float32Array(nCells);
      var nbrBuf     = new Float32Array(9);
      for (var iy = 0; iy < gridRes; iy++) {
        for (var ix = 0; ix < gridRes; ix++) {
          var ci = iy * gridRes + ix;
          if (!valid[ci]) continue;
          var nN = 0;
          for (var dy = -1; dy <= 1; dy++) {
            var ny = iy + dy; if (ny < 0 || ny >= gridRes) continue;
            for (var dx = -1; dx <= 1; dx++) {
              var nx = ix + dx; if (nx < 0 || nx >= gridRes) continue;
              var nci = ny * gridRes + nx;
              if (valid[nci]) nbrBuf[nN++] = thickness[nci];
            }
          }
          if (nN < 3) {
            // Too few neighbours to validate — keep as-is
            thicknessF[ci] = thickness[ci];
            validF[ci] = 1;
            topF[ci] = topD[ci]; botF[ci] = bottomD[ci];
            continue;
          }
          // Insertion sort on small array
          for (var ii = 1; ii < nN; ii++) {
            var x = nbrBuf[ii], jj = ii - 1;
            while (jj >= 0 && nbrBuf[jj] > x) { nbrBuf[jj + 1] = nbrBuf[jj]; jj--; }
            nbrBuf[jj + 1] = x;
          }
          var med = nbrBuf[nN >> 1];
          if (med > 0 && Math.abs(thickness[ci] - med) / med <= 0.50) {
            thicknessF[ci] = thickness[ci];
            validF[ci] = 1;
            topF[ci] = topD[ci]; botF[ci] = bottomD[ci];
          }
        }
      }
      thickness = null; valid = null; topD = null; bottomD = null; nbrBuf = null;

      // Pass E — connected-component footprint rejection.
      // Find global median of valid cells; mark "fat" cells (> median*1.3),
      // flood-fill components, drop components below minComponentM2.
      var sortBuf = [];
      for (var i = 0; i < nCells; i++) if (validF[i]) sortBuf.push(thicknessF[i]);
      if (sortBuf.length > 0) {
        sortBuf.sort(function(a, b) { return a - b; });
        var medAll = sortBuf[sortBuf.length >> 1];
        var fatLimit = medAll * 1.30;
        var cellArea = cellU * cellV;
        var minCellsKeep = Math.max(2, Math.ceil(minComponentM2 / cellArea));

        var component = new Int32Array(nCells); // 0 = not visited
        var stack = [];
        var compId = 1;
        var compSize = [0]; // index 0 unused
        for (var iy = 0; iy < gridRes; iy++) {
          for (var ix = 0; ix < gridRes; ix++) {
            var ci = iy * gridRes + ix;
            if (component[ci] !== 0) continue;
            if (!validF[ci] || thicknessF[ci] <= fatLimit) continue;
            // Flood fill
            stack.length = 0;
            stack.push(ci);
            component[ci] = compId;
            var sz = 0;
            while (stack.length > 0) {
              var cci = stack.pop();
              sz++;
              var cy = (cci / gridRes) | 0;
              var cx = cci - cy * gridRes;
              // 4-connected neighbours
              if (cx > 0) {
                var nci = cci - 1;
                if (component[nci] === 0 && validF[nci] && thicknessF[nci] > fatLimit) {
                  component[nci] = compId; stack.push(nci);
                }
              }
              if (cx < gridRes - 1) {
                var nci = cci + 1;
                if (component[nci] === 0 && validF[nci] && thicknessF[nci] > fatLimit) {
                  component[nci] = compId; stack.push(nci);
                }
              }
              if (cy > 0) {
                var nci = cci - gridRes;
                if (component[nci] === 0 && validF[nci] && thicknessF[nci] > fatLimit) {
                  component[nci] = compId; stack.push(nci);
                }
              }
              if (cy < gridRes - 1) {
                var nci = cci + gridRes;
                if (component[nci] === 0 && validF[nci] && thicknessF[nci] > fatLimit) {
                  component[nci] = compId; stack.push(nci);
                }
              }
            }
            compSize[compId] = sz;
            compId++;
          }
        }
        for (var i = 0; i < nCells; i++) {
          var cid = component[i];
          if (cid > 0 && compSize[cid] < minCellsKeep) {
            validF[i] = 0;
          }
        }
        component = null; sortBuf = null;
      }

      return {
        grid:     thicknessF,
        valid:    validF,
        topD:     topF,
        bottomD:  botF,
        gridRes:  gridRes,
        uMin:     uMin,  vMin: vMin,
        cellU:    cellU, cellV: cellV,
        U:        U,     V: V,    N: N,    C: C,
        binSize:  binSize
      };
    }

    // Look up thickness for a world point. Returns the cell's thickness if
    // valid AND the point is inside the cell's slab band [bottomD, topD]
    // (with a small tolerance). Returns null otherwise so coloring restores
    // the original RGB — keeps off-slab points uncolored even when their
    // (u,v) cell is valid (e.g. a hanger sticking below a real cell).
    // Look up cell's thickness for a world point. The top-surface filter
    // (cfg.surfaceGrid) already does the spatial gating in the apply loop,
    // so we don't need a depth-band check here — we just need the cell's
    // thickness value to drive the color.
    function getThicknessForPoint(px, py, pz, tg) {
      if (!tg) return null;
      var dx = px - tg.C.x, dy = py - tg.C.y, dz = pz - tg.C.z;
      var u = dx * tg.U.x + dy * tg.U.y + dz * tg.U.z;
      var vv = dx * tg.V.x + dy * tg.V.y + dz * tg.V.z;
      var iu = Math.floor((u - tg.uMin) / tg.cellU);
      var iv = Math.floor((vv - tg.vMin) / tg.cellV);
      if (iu < 0 || iu >= tg.gridRes || iv < 0 || iv >= tg.gridRes) return null;
      var idx = iv * tg.gridRes + iu;
      if (!tg.valid[idx]) return null;
      return tg.grid[idx];
    }

    // ===== MEASUREMENT POINT LABELS =====
    const measurePointLabels = new Map(); // Map<Measure, TextSprite[]>
    const measureLabelScene = new THREE.Scene();
    measureLabelScene.name = "EnableMeasureLabelScene";
    let nextPointNumber = 1;                    // global D-number, never resets
    const measurePointNumbers = new Map();      // Map<Measure, number[]> — D-numbers per measurement

    // ===== SNAP THRESHOLDS (screen pixels) =====
    var SNAP_THRESHOLD_MEMBER = 18;      // for member/constraint picks
    var SNAP_THRESHOLD_MEASUREMENT = 10; // for Potree measurement picks (gentler)

    // ===== UNDO STACK =====
    const undoStack = [];
    const redoStack = [];   // box/volume-transform redo (Ctrl+Y / Ctrl+Shift+Z)

    // Attach undo tracking to a volume — captures transform before gizmo interaction, pushes on mouseup
    // Volumes whose transforms (move/rotate/scale) are undoable. A SINGLE pair of
    // global mousedown/mouseup handlers snapshots the true pre-drag state of every
    // tracked box on mousedown and commits an undo entry on mouseup if anything
    // changed — so rotation, position AND scale are all captured reliably,
    // regardless of which Potree events fire.
    var _trackedVolumes = [];
    var _volSnapshots = null;
    function trackVolumeUndo(volume) {

      setTimeout(function() { volume._undoArmed = true; }, 1500);
      _trackedVolumes.push(volume);
    }
    function _untrackVolumeUndo(volume) {
      var i = _trackedVolumes.indexOf(volume);

    }
    document.addEventListener('mousedown', function(e) {

      // A click on a toolbar button (e.g. Undo, which is outside potree_render_area)
      // would otherwise snapshot the box, the button's undo then changes it, and the
      // mouseup records that change as a spurious NEW "box transform" command (which
      // also clears the redo stack) — making the Undo BUTTON flip one step back and
      // forth. Ctrl+Z is a key event, never triggered this, hence it worked.
      _volSnapshots = null;

    document.addEventListener('mouseup', function() {

                undo: function(){ vol.position.copy(before.pos); vol.rotation.copy(before.rot); vol.scale.copy(before.scale); if (typeof vol.update==='function') vol.update(); },
                redo: function(){ vol.position.copy(after.pos); vol.rotation.copy(after.rot); vol.scale.copy(after.scale); if (typeof vol.update==='function') vol.update(); } });
            })(v,
              { pos: s.pos.clone(), rot: s.rot.clone(), scale: s.scale.clone() },
              { pos: v.position.clone(), rot: v.rotation.clone(), scale: v.scale.clone() });
          }
        }

    // Every undoable action pushes a command { label, undo, redo, tag? }.
    // performUndo pops it, runs .undo(), and moves it to the redo stack;
    // performRedo runs .redo() and moves it back. This makes undo AND redo
    // uniform across all action types.

    }
    function performRedo() {

        for (var ci2 = 0; ci2 < candidates.length; ci2++) {
          var n = candidates[ci2];
          if (n.length() < 0.0001) continue;
          n.normalize();
          var variance = 0;
          for (var fi = 0; fi < pts.length; fi++) {
            var d = (pts[fi].x - centroid.x) * n.x +
                    (pts[fi].y - centroid.y) * n.y +
                    (pts[fi].z - centroid.z) * n.z;
            variance += d * d;
          }
          if (variance < bestVariance) {
            bestVariance = variance;
            bestNormal = n.clone();
          }
        }

        if (!bestNormal) {
          showToast('Could not compute best-fit plane');
          cancelConstraintPick();
          return;
        }

        var rms = Math.sqrt(bestVariance / pts.length) * 1000; // mm
        var normal = bestNormal;
        var plane = new THREE.Plane();
        plane.setFromNormalAndCoplanarPoint(normal, centroid);

        constraint = {
          id: nextConstraintId++,
          type: 'plane',
          name: 'Fit Plane ' + (nextConstraintId - 1),
          plane: plane,
          normal: normal,
          centroid: centroid,
          points: pts,
          visual: null,
          visible: true,
          locked: true
        };
        // Hold the plane while the user picks 2 points to define the +X axis.
        // The constraint isn't pushed to `constraints[]` until X is set, so
        // cancelling the X-axis pick discards the plane.
        _pendingPlaneConstraint = constraint;
        clearPickMarkers();
        constraintPickPoints = [];
        constraintPickType = 'plane-x-axis';
        constraintPickTarget = 2;
        constraintPickMode = true;
        showToast('Plane fit (RMS: ' + rms.toFixed(1) + ' mm). Now pick 2 points for +X axis (left → right)', 6000);
        return;
      } else if (type === 'axis') {
        var dir = new THREE.Vector3().subVectors(pts[1], pts[0]);
        if (dir.length() < 0.001) {
          showToast('Points are coincident \u2014 cannot define axis');
          cancelConstraintPick();
          return;
        }
        dir.normalize();
        constraint = {
          id: nextConstraintId++,
          type: 'axis',
          name: 'Axis ' + (nextConstraintId - 1),
          origin: pts[0].clone(),
          direction: dir,
          points: pts,
          visual: null,
          visible: true,
          locked: true
        };
      } else if (type === 'perp-plane') {
        if (pts.length < 1) { showToast('Need a point'); cancelConstraintPick(); return; }
        var refC = constraints.find(function(c) { return c.id === _perpRefConstraintId && c.type === 'plane'; });
        if (!refC) {
          showToast('Reference plane is gone — cannot build perpendicular plane');
          cancelConstraintPick();
          return;
        }
        var refN = refC.normal.clone().normalize();
        // "Square to the reference": the new plane's in-plane direction follows
        // the reference plane's own X axis, so the new plane is orthogonal to the
        // reference AND aligned with its axes (not rotated by an arbitrary line).
        var refBasis = refC.basis || computePlaneBasis(refC);
        var refX = (refBasis && refBasis.X) ? refBasis.X.clone().normalize() : null;
        if (!refX) {
          var tmpRef = (Math.abs(refN.z) < 0.9) ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(1, 0, 0);
          refX = new THREE.Vector3().crossVectors(tmpRef, refN).normalize();
        }
        var refYv = (refBasis && refBasis.Y) ? refBasis.Y.clone().normalize()
                                             : new THREE.Vector3().crossVectors(refN, refX).normalize();
        // Initial size from the reference plane's own extent.
        var refSize = 0;
        for (var ri = 0; ri < refC.points.length; ri++) {
          for (var rj = ri + 1; rj < refC.points.length; rj++) {
            refSize = Math.max(refSize, refC.points[ri].distanceTo(refC.points[rj]));
          }
        }
        if (!(refSize > 0.3)) refSize = 1;
        var perpHalf = refSize / 2;
        var pClick = pts[0].clone();
        // Two def-points straddling the click along refX → the plane is centered
        // on the click, and the user can still drag these to rotate/reposition.
        var pp0 = pClick.clone().addScaledVector(refX, -perpHalf);
        var pp1 = pClick.clone().addScaledVector(refX, perpHalf);
        var perpN = new THREE.Vector3().crossVectors(refX, refN);
        if (perpN.length() < 1e-4) {
          showToast('Reference plane basis is degenerate — cannot build perpendicular plane', 5000);
          cancelConstraintPick();
          return;
        }
        perpN.normalize();
        var perpPlane = new THREE.Plane().setFromNormalAndCoplanarPoint(perpN, pClick);
        constraint = {
          id: nextConstraintId++,
          type: 'plane',
          name: 'Perp Plane ' + (nextConstraintId - 1),
          plane: perpPlane,
          normal: perpN,
          centroid: pClick,
          points: [pp0, pp1],
          visual: null,
          visible: true,
          // Created UNLOCKED so the user can immediately rotate it 90° (⟳) or
          // drag its points before locking it down.
          locked: false,
          // Snapshot of the reference normal (legacy) + full reference basis and
          // the current orientation cycle state. Orientation is derived from
          // these (see applyPerpCycle), not from the point positions.
          perpRefNormal: refN.clone(),
          perpRef: { X: refX.clone(), Y: refYv.clone(), N: refN.clone() },
          perpCycle: 0,
          // Auto-basis: X along the reference X axis, Y along the reference normal.
          xAxisAnchorA: pp0.clone(),
          xAxisAnchorB: pp1.clone(),
          xAxisCamUp: refN.clone()
        };
        // Normalize orientation/points through the cycle machinery (state 0 =
        // ⊥ ref, X-aligned — identical to what we just built).
        applyPerpCycle(constraint);
      }

      clearPickMarkers();

      if (constraint) {
        buildConstraintVisual(constraint);
        constraints.push(constraint);
        rebuildConstraintList();
        // Replace constraint-point pick entries with a single constraint entry
        while (undoStack.length > 0 && undoStack[undoStack.length - 1].tag === 'constraint-point') {
          undoStack.pop();
        }
        pushUndoCmd(_cmdAddConstraint(constraint));
        if (constraint.perpRefNormal) {
          // Perp plane: select it (unlocked) so the user can click ⟳ to rotate
          // 90° until the alignment is right, then lock it.
          selectConstraint(constraint.id);
          showToast(constraint.name + ' created — click ⟳ in its row to cycle orientation (5 presets), then lock when correct', 6000);
        } else {
          showToast(constraint.name + ' created');
        }
      }

      constraintPickMode = false;
      constraintPickPoints = [];
      constraintPickType = null;
      constraintPickTarget = 0;
      _disposeConstraintPreview();
      document.body.classList.remove('constraint-pick-mode');
      document.querySelectorAll('#enable-constraint-buttons button').forEach(function(b) { b.classList.remove('active'); });
    }

    // -- Re-enter X-axis pick mode for an existing plane (sidebar button) --
    function startPlaneXAxisEdit(c) {
      if (!c || c.type !== 'plane') return;
      if (memberPickMode) cancelMemberPick();
      if (constraintPickMode) cancelConstraintPick();
      _pendingPlaneConstraint = c;
      constraintPickMode = true;
      constraintPickPoints = [];
      constraintPickType = 'plane-x-axis';
      constraintPickTarget = 2;
      _ensureConstraintPreview();
      showToast('Re-pick 2 points for ' + c.name + ' +X axis (Enter to accept, Esc to cancel)', 6000);
    }

    // -- Finalize the X-axis pick step that follows fit-plane creation --
    function finalizePlaneXAxis() {
      var c = _pendingPlaneConstraint;
      if (!c || constraintPickPoints.length < 2) return;
      // Validate that the projected X line has non-zero length on the plane.
      var n = c.normal;
      var a = constraintPickPoints[0].clone();
      var b = constraintPickPoints[1].clone();
      var aOff = (a.x - c.centroid.x) * n.x + (a.y - c.centroid.y) * n.y + (a.z - c.centroid.z) * n.z;
      var bOff = (b.x - c.centroid.x) * n.x + (b.y - c.centroid.y) * n.y + (b.z - c.centroid.z) * n.z;
      a.addScaledVector(n, -aOff);
      b.addScaledVector(n, -bOff);
      if (a.distanceTo(b) < 1e-4) {
        // Both picks projected to nearly the same point; ask the user to redo.
        clearPickMarkers();
        constraintPickPoints = [];
        showToast('X-axis points are too close after projection — pick 2 points farther apart', 5000);
        return;
      }
      // Capture the camera's screen-up vector at click time. Column 1 of the
      // camera's world matrix is its local Y axis = up direction on screen.
      var cam = viewer.scene.getActiveCamera();
      var camUp = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
      c.xAxisAnchorA = constraintPickPoints[0].clone();
      c.xAxisAnchorB = constraintPickPoints[1].clone();
      c.xAxisCamUp = camUp;
      c.basis = computePlaneBasis(c);

      clearPickMarkers();
      var alreadyInList = constraints.indexOf(c) !== -1;
      if (alreadyInList) {
        rebuildConstraintVisual(c);
        showToast(c.name + ' X axis updated');
      } else {
        buildConstraintVisual(c);
        constraints.push(c);
        rebuildConstraintList();
        while (undoStack.length > 0 && undoStack[undoStack.length - 1].tag === 'constraint-point') {
          undoStack.pop();
        }
        pushUndoCmd(_cmdAddConstraint(c));
        showToast(c.name + ' created with custom X axis');
      }

      _pendingPlaneConstraint = null;
      constraintPickMode = false;
      constraintPickPoints = [];
      constraintPickType = null;
      constraintPickTarget = 0;
      _disposeConstraintPreview();
      document.body.classList.remove('constraint-pick-mode');
      document.querySelectorAll('#enable-constraint-buttons button').forEach(function(b) { b.classList.remove('active'); });
    }

    // -- Build 3D visual for a constraint --
    // Compute a plane constraint's local XYZ basis. If the user has set an X
    // axis (two anchors picked after the plane was fit), X = projection of
    // (anchorB - anchorA) onto the plane, Y = camera-up at click time
    // projected onto the plane and made perpendicular to X, Z = X × Y
    // (right-hand rule). Anchors are stored in world coordinates so a
    // re-fit (drag of plane definition points) automatically updates the
    // basis through reprojection. Falls back to the legacy auto-basis
    // (world-Z projected onto plane) if anchors are missing.
    function computePlaneBasis(c) {
      if (c.type !== 'plane') return null;
      var n = c.normal.clone().normalize();
      var X, Y, Z;
      if (c.xAxisAnchorA && c.xAxisAnchorB && c.xAxisCamUp) {
        // Project both anchors onto the plane to kill any Z drift.
        var a = c.xAxisAnchorA.clone();
        var b = c.xAxisAnchorB.clone();
        var aOff = (a.x - c.centroid.x) * n.x + (a.y - c.centroid.y) * n.y + (a.z - c.centroid.z) * n.z;
        var bOff = (b.x - c.centroid.x) * n.x + (b.y - c.centroid.y) * n.y + (b.z - c.centroid.z) * n.z;
        a.addScaledVector(n, -aOff);
        b.addScaledVector(n, -bOff);
        var dx = new THREE.Vector3().subVectors(b, a);
        if (dx.length() < 1e-6) return null;
        X = dx.normalize();
        // Camera-up at click time, projected onto plane and made ⊥ to X.
        var up = c.xAxisCamUp.clone();
        up.addScaledVector(n, -up.dot(n));
        up.addScaledVector(X, -up.dot(X));
        if (up.length() < 1e-6) {
          // Camera-up is parallel to X — pick an arbitrary perpendicular.
          up.copy(n).cross(X);
        }
        Y = up.normalize();
        Z = new THREE.Vector3().crossVectors(X, Y).normalize();
      } else {
        // Legacy auto-basis (world-Z projected, falling back to world-X).
        var worldRef = (Math.abs(n.z) < 0.9)
          ? new THREE.Vector3(0, 0, 1)
          : new THREE.Vector3(1, 0, 0);
        X = new THREE.Vector3().crossVectors(worldRef, n).normalize();
        Y = new THREE.Vector3().crossVectors(n, X).normalize();
        Z = n;
      }
      return { X: X, Y: Y, Z: Z, origin: c.centroid.clone() };
    }

    function buildConstraintVisual(constraint) {
      var group = new THREE.Group();
      group.name = 'constraint-' + constraint.id;

      if (constraint.type === 'plane') {
        var pts = constraint.points;
        var maxDist = 0;
        for (var i = 0; i < pts.length; i++) {
          for (var j = i + 1; j < pts.length; j++) {
            var d = pts[i].distanceTo(pts[j]);
            if (d > maxDist) maxDist = d;
          }
        }
        var quadSize = Math.max(maxDist * 3, 1);

        // Quad orientation frame. We draw the rectangle in the plane's LOCAL
        // basis (X = red arrow, Y = green arrow) so the outline and the stretch
        // handles line up with the axes the user set — instead of the old
        // world-level frame. Falls back to a world-Z-projected frame only when
        // the plane has no basis (shouldn't happen for current planes).
        var n = constraint.normal;
        var quadBasis = constraint.basis || computePlaneBasis(constraint);
        var localX, localY;
        if (quadBasis && quadBasis.X && quadBasis.Y) {
          localX = quadBasis.X.clone().normalize();
          localY = quadBasis.Y.clone().normalize();
        } else {
          var worldRef = (Math.abs(n.z) < 0.9)
            ? new THREE.Vector3(0, 0, 1)
            : new THREE.Vector3(1, 0, 0);
          localX = new THREE.Vector3().crossVectors(worldRef, n).normalize();
          localY = new THREE.Vector3().crossVectors(n, localX).normalize();
        }
        // localZ from X×Y guarantees a proper (right-handed) rotation even if the
        // basis Z was flipped relative to the fit normal. Fill is DoubleSide, so
        // the face-normal direction is irrelevant visually.
        var localZ = new THREE.Vector3().crossVectors(localX, localY).normalize();
        var rotMat = new THREE.Matrix4().makeBasis(localX, localY, localZ);
        var quat = new THREE.Quaternion().setFromRotationMatrix(rotMat);
        // Persist the quad frame so stretch-handle drags use identical axes.
        constraint._quadX = localX.clone();
        constraint._quadY = localY.clone();

        // Rectangle extents = local-frame distances from centroid along X/Y.
        // Default = symmetric square; the user stretch handles mutate these.
        // Purely visual — they do NOT affect the plane math.
        if (!constraint.rectExtent) {
          var half = quadSize / 2;
          constraint.rectExtent = { xMin: -half, xMax: half, yMin: -half, yMax: half };
        }
        var ex = constraint.rectExtent;
        var rectW = Math.max(ex.xMax - ex.xMin, 0.01);
        var rectH = Math.max(ex.yMax - ex.yMin, 0.01);
        var rectCx = (ex.xMin + ex.xMax) / 2;
        var rectCy = (ex.yMin + ex.yMax) / 2;
        var rectCenter = constraint.centroid.clone()
          .addScaledVector(localX, rectCx)
          .addScaledVector(localY, rectCy);

        var planeGeo = new THREE.PlaneGeometry(rectW, rectH);
        var planeMat = new THREE.MeshBasicMaterial({
          color: 0x39ff14, transparent: true, opacity: 0.22,
          side: THREE.DoubleSide, depthTest: true, depthWrite: false
        });
        var planeMesh = new THREE.Mesh(planeGeo, planeMat);
        planeMesh.position.copy(rectCenter);
        planeMesh.quaternion.copy(quat);
        planeMesh.renderOrder = 1;
        planeMesh.userData.isPlaneFill = true;          // also the click target for plane selection
        planeMesh.userData.constraintId = constraint.id;
        // Render the fill in planeFillScene (drawn in the depth_overlay pass, which
        // has the point cloud's depth) so it depth-tests correctly: points IN FRONT
        // of the plane occlude the green sheet, points BEHIND show through it — the
        // classic section-plane look. Lifecycle is managed via constraint._fillMesh.
        planeFillScene.add(planeMesh);
        constraint._fillMesh = planeMesh;

        var edgeGeo = new THREE.EdgesGeometry(planeGeo);
        var edgeMat = new THREE.LineBasicMaterial({
          color: 0x39ff14, transparent: true, opacity: 0.4,
          depthTest: false, depthWrite: false
        });
        var edgeLine = new THREE.LineSegments(edgeGeo, edgeMat);
        edgeLine.position.copy(rectCenter);
        edgeLine.quaternion.copy(quat);
        group.add(edgeLine);

        // Stretch handles: 4 at the edge midpoints (move one edge) + 4 at the
        // corners (move two edges diagonally). Visible/pickable only when the
        // plane is unlocked; purely visual.
        var handleDefs = [
          { edge: 'xMin', u: ex.xMin, v: rectCy },
          { edge: 'xMax', u: ex.xMax, v: rectCy },
          { edge: 'yMin', u: rectCx, v: ex.yMin },
          { edge: 'yMax', u: rectCx, v: ex.yMax },
          { edge: 'xMin,yMin', u: ex.xMin, v: ex.yMin, corner: true },
          { edge: 'xMax,yMin', u: ex.xMax, v: ex.yMin, corner: true },
          { edge: 'xMin,yMax', u: ex.xMin, v: ex.yMax, corner: true },
          { edge: 'xMax,yMax', u: ex.xMax, v: ex.yMax, corner: true }
        ];
        for (var hIdx = 0; hIdx < handleDefs.length; hIdx++) {
          var hd = handleDefs[hIdx];
          var hPos = constraint.centroid.clone()
            .addScaledVector(localX, hd.u)
            .addScaledVector(localY, hd.v);
          var hSize = hd.corner ? 0.68 : 0.55;
          var hMesh = new THREE.Mesh(
            new THREE.BoxGeometry(hSize, hSize, hSize),
            new THREE.MeshBasicMaterial({
              color: hd.corner ? 0xffa000 : 0xffd400,
              depthTest: false, depthWrite: false,
              transparent: true, opacity: 0.95
            })
          );
          hMesh.position.copy(hPos);
          hMesh.userData.isPlaneStretchHandle = true;
          hMesh.userData.isMarkerSphere = true; // reuse constant-screen scaling
          hMesh.userData.handleEdge = hd.edge;
          hMesh.visible = (constraint.id === selectedConstraintId);
          group.add(hMesh);
        }

        // +X (red) and +Y (green) basis arrows from centroid. Anchored from
        // the user-defined basis if present, falling back to auto-basis.
        var basis = constraint.basis || computePlaneBasis(constraint);
        if (basis) {
          var arrowLen = Math.max(quadSize * 0.28, 0.3);
          var headLen = arrowLen * 0.22;
          var headW = headLen * 0.55;
          var xArrow = new THREE.ArrowHelper(basis.X, constraint.centroid, arrowLen, 0xff3030, headLen, headW);
          var yArrow = new THREE.ArrowHelper(basis.Y, constraint.centroid, arrowLen, 0x30ff30, headLen, headW);
          [xArrow, yArrow].forEach(function(arr) {
            arr.userData.isBasisArrow = true;
            arr.line.material.transparent = true;
            arr.line.material.opacity = 0.95;
            arr.line.material.depthTest = false;
            arr.line.material.depthWrite = false;
            arr.cone.material.transparent = true;
            arr.cone.material.opacity = 0.95;
            arr.cone.material.depthTest = false;
            arr.cone.material.depthWrite = false;
            arr.line.userData.isBasisArrow = true;
            arr.cone.userData.isBasisArrow = true;
          });
          group.add(xArrow);
          group.add(yArrow);
        }
      } else if (constraint.type === 'axis') {
        var axDir = constraint.direction;
        var axOrigin = constraint.origin;
        var span = constraint.points[0].distanceTo(constraint.points[1]);
        var extend = Math.max(span * 5, 10);
        var p1 = new THREE.Vector3().copy(axOrigin).addScaledVector(axDir, -extend);
        var p2 = new THREE.Vector3().copy(axOrigin).addScaledVector(axDir, extend);
        var lineGeo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
        var lineMat = new THREE.LineBasicMaterial({
          color: 0x39ff14, transparent: true, opacity: 0.6,
          depthTest: false, depthWrite: false
        });
        group.add(new THREE.Line(lineGeo, lineMat));
      }

      // Definition point markers: solid green sphere, fixed screen-pixel size.
      // (Per-frame scaling lives in the render.pass.perspective_overlay handler;
      // isDefPointRing flag keeps updateConstraintVisuals' opacity rule pinned
      // at 0.9 instead of falling into the dim-mesh branch.)
      for (var k = 0; k < constraint.points.length; k++) {
        var pt = constraint.points[k];
        var ptGroup = new THREE.Group();
        ptGroup.position.copy(pt);
        ptGroup.userData.isDefinitionPoint = true;
        ptGroup.userData.pointIndex = k;

        var sphGeo = new THREE.SphereGeometry(0.4, 12, 12);
        var sphMat = new THREE.MeshBasicMaterial({
          color: 0x39ff14,
          depthTest: false,
          depthWrite: false,
          transparent: true,
          opacity: 0.9
        });
        var sphMesh = new THREE.Mesh(sphGeo, sphMat);
        sphMesh.userData.isDefPointRing = true;
        sphMesh.userData.isMarkerSphere = true;
        ptGroup.add(sphMesh);

        group.add(ptGroup);
      }

      constraint.visual = group;
      constraintScene.add(group);
      if (constraint.visible === false) group.visible = false;
      updateConstraintVisuals();
    }

    // -- Update visual opacity based on active state --
    function updateConstraintVisuals() {
      for (var ci = 0; ci < constraints.length; ci++) {
        var c = constraints[ci];
        if (!c.visual) continue;
        var isSel = c.id === selectedConstraintId;
        c.visual.traverse(function(obj) {
          if (obj.material) {
            if (obj.userData && obj.userData.isDefPointRing) {
              obj.material.opacity = 0.9;
            } else if (obj.userData && obj.userData.isPlaneStretchHandle) {
              // Stretch handles keep their own bright opacity (never dimmed).
              obj.material.opacity = 0.95;
            } else if (obj.userData && obj.userData.isBasisArrow) {
              // Basis arrows manage their own opacity (always visible).
            } else if (obj.isMesh) {
              obj.material.opacity = isSel ? 0.2 : 0.08;
            } else if (obj.isLine || obj.isLineSegments) {
              obj.material.opacity = isSel ? 0.7 : 0.25;
            }
          }
        });
      }
    }

    // -- Select / deselect a constraint (highlight + stretch handles). This is
    //    SEPARATE from binding (activeConstraintId), which drives measurement snap. --
    function selectConstraint(id) {
      selectedConstraintId = id;
      rebuildConstraintList();
      updateConstraintVisuals();
    }
    function deselectConstraint() {
      if (selectedConstraintId === null) return false;
      selectedConstraintId = null;
      rebuildConstraintList();
      updateConstraintVisuals();
      return true;
    }

    // -- Enable the plane-selection-dependent buttons only when a PLANE is selected --
    function updatePerpPlaneButton() {
      var selectedPlane = selectedConstraintId !== null && constraints.some(function(c) {
        return c.id === selectedConstraintId && c.type === 'plane';
      });
      var btn = document.getElementById('btn-perp-plane');
      if (btn) {
        btn.disabled = !selectedPlane;
        btn.title = selectedPlane
          ? 'New plane perpendicular and square to the selected plane (single click to place; unlock to rotate/stretch)'
          : 'Select a plane first, then create a plane perpendicular to it';
      }
    }

    // -- Normal-dimension hover preview: a red dot on the cloud point under the
    //    cursor + an elastic line back to its perpendicular foot on the plane
    //    (mirrors the distance tool's red-dot cue instead of a crosshair). --
    var _normPreviewSphere = null;
    var _normPreviewLine = null;
    function _ensureNormPreview() {
      if (!_normPreviewSphere) {
        _normPreviewSphere = _makePreviewSphere(0xff2020);
        constraintScene.add(_normPreviewSphere);
      }
      if (!_normPreviewLine) {
        var g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, 0, 0, 0], 3));
        _normPreviewLine = new THREE.Line(g, new THREE.LineBasicMaterial({
          color: 0xff2020, depthTest: false, depthWrite: false, transparent: true, opacity: 0.9
        }));
        _normPreviewLine.renderOrder = 1;
        _normPreviewLine.visible = false;
        constraintScene.add(_normPreviewLine);
      }
    }
    function _disposeNormPreview() {
      if (_normPreviewSphere) {
        constraintScene.remove(_normPreviewSphere);
        if (_normPreviewSphere.geometry) _normPreviewSphere.geometry.dispose();
        if (_normPreviewSphere.material) _normPreviewSphere.material.dispose();
        _normPreviewSphere = null;
      }
      if (_normPreviewLine) {
        constraintScene.remove(_normPreviewLine);
        if (_normPreviewLine.geometry) _normPreviewLine.geometry.dispose();
        if (_normPreviewLine.material) _normPreviewLine.material.dispose();
        _normPreviewLine = null;
      }
    }
    function _updateNormPreview(e) {
      if (!_normDimArmed || !_normPreviewSphere) return;
      var ref = constraints.find(function(c) { return c.id === _normDimRefId && c.type === 'plane'; });
      var rect = renderArea.getBoundingClientRect();
      var mouse = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      var pick = _origPick(mouse, viewer.scene.getActiveCamera(), viewer, viewer.scene.pointclouds, { pickClipped: true });
      if (ref && pick && pick.location) {
        var foot = new THREE.Vector3();
        ref.plane.projectPoint(pick.location, foot);
        _normPreviewSphere.position.copy(pick.location);
        _normPreviewSphere.visible = true;
        var pos = _normPreviewLine.geometry.attributes.position;
        pos.setXYZ(0, pick.location.x, pick.location.y, pick.location.z);
        pos.setXYZ(1, foot.x, foot.y, foot.z);
        pos.needsUpdate = true;
        _normPreviewLine.visible = true;
      } else {
        _normPreviewSphere.visible = false;
        _normPreviewLine.visible = false;
      }
    }

    // -- Toggle normal-dimension mode for a plane. With planeId, targets that
    //    plane (row "Norm" button); without, uses the selected plane ("d" key).
    //    While ON, a single cloud click drops a perpendicular dimension onto the
    //    plane. Toggling the active plane again (or a different plane) switches. --
    function toggleNormDim(planeId) {
      var id = (planeId != null) ? planeId : selectedConstraintId;
      var target = constraints.find(function(c) { return c.id === id && c.type === 'plane'; });
      if (_normDimMode && target && _normDimRefId === target.id) {
        _normDimMode = false; _normDimArmed = false; _normDimRefId = null;
        _disposeNormPreview();
        showToast('Normal dimension OFF', 2000);
        rebuildConstraintList(); updateConstraintStatus();
        return;
      }
      if (!target) {
        showToast('Select a plane first to dimension normal to it', 3000);
        return;
      }
      if (MARK_MODE) toggleMarkMode(true);
      if (memberPickMode) cancelMemberPick();
      if (constraintPickMode) cancelConstraintPick();
      cancelPotreeInsertion();
      // Norm and Bind are mutually exclusive — turn off any bound plane.
      if (activeConstraintId !== null) activeConstraintId = null;
      _normDimMode = true; _normDimArmed = true; _normDimRefId = target.id;
      _ensureNormPreview();
      showToast('Normal dimension ON — click cloud points to measure ⟂ distance to ' + target.name + ' (Esc = stop measuring; Norm button = exit)', 5000);
      rebuildConstraintList(); updateConstraintStatus();
    }

    // -- Create a perpendicular dimension from a cloud point to the norm plane --
    function placeNormDimension(cloudPoint) {
      var ref = constraints.find(function(c) { return c.id === _normDimRefId && c.type === 'plane'; });
      if (!ref) { showToast('Normal-dimension plane is gone'); return; }
      var foot = new THREE.Vector3();
      ref.plane.projectPoint(cloudPoint, foot);
      if (cloudPoint.distanceTo(foot) < 1e-4) {
        showToast('That point is already on the plane', 2000);
        return;
      }
      var measure = new Potree.Measure();
      measure.showDistances = true;
      measure.showArea = false;
      measure.showAngles = false;
      measure.showHeight = false;
      measure.closed = false;
      measure.userData.only3D = true; // perpendicular gap — XY/Z breakdown isn't meaningful (set before markers so labels build 3D-only)
      measure.addMarker(cloudPoint.clone());
      measure.addMarker(foot);
      viewer.scene.addMeasurement(measure);
      pushUndoCmd(_cmdAddMeasurement(measure)); // one undo entry per perpendicular dimension
      try { rebuildAllMeasurementLists(); } catch (e) {}
    }
