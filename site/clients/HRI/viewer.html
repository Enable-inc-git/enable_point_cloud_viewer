      // If called without an explicit target group, keep legacy behavior (clear + rebuild into scene)
      var target = _contourBuildTarget;
      if (!target) {
        clearElevationContours();
        target = elevationScene;
      }
      var tolerance = (zMax - zMin) * 0.10;

      // Resolve box context — prefer explicit boxCfg, fall back to globals for legacy callers
      var mode = boxCfg ? boxCfg.mode : elevationMode;
      var refPlane = boxCfg ? boxCfg.refPlane : elevationRefPlane;
      var refSide = boxCfg ? boxCfg.refSide : elevationRefSide;
      var surfGrid = boxCfg ? boxCfg.surfaceGrid : elevationSurfaceGrid;
      var planeSurfGrid = boxCfg ? boxCfg.planeSurfGrid : elevationPlaneSurfGrid;
      var step = boxCfg ? boxCfg.contourStep : elevationContourStep;

      // Collect only top-surface points inside the box's OBB, excluding exclusion zones
      var exclInvMats = buildExclusionInvMats();
      var hasExclusions = exclInvMats.length > 0;
      var boxInv = null;
      if (boxCfg && _contourBuildTarget && _contourBuildTarget.userData && _contourBuildTarget.userData.elevBox) {
        var vol = _contourBuildTarget.userData.elevBox;
        vol.updateMatrixWorld(true);
        boxInv = new THREE.Matrix4().copy(vol.matrixWorld).invert();
      }
      var pts = [];
      var count = positions.length / 3;
      var _v = new THREE.Vector3();
      for (var i = 0; i < count; i++) {
        var px = positions[i * 3];
        var py = positions[i * 3 + 1];
        var pz = positions[i * 3 + 2];
        if (boxInv) {
          _v.set(px, py, pz).applyMatrix4(boxInv);
          if (_v.x < -0.5 || _v.x > 0.5 || _v.y < -0.5 || _v.y > 0.5 || _v.z < -0.5 || _v.z > 0.5) continue;
        } else if (cropBounds) {
          if (px < cropBounds.min[0] || px > cropBounds.max[0] ||
              py < cropBounds.min[1] || py > cropBounds.max[1] ||
              pz < cropBounds.min[2] || pz > cropBounds.max[2]) continue;
        }
        if (planeSurfGrid) {
          if (!isPlaneTopSurface(px, py, pz, planeSurfGrid, tolerance)) continue;
        } else if (surfGrid) {
          if (!isTopSurface(px, py, pz, surfGrid, tolerance)) continue;
        }
        if (hasExclusions && isPointExcluded(px, py, pz, exclInvMats)) continue;
        var elevVal;
        if (mode === 'plane' && refPlane) {
          var nn = refPlane.normal, cc = refPlane.centroid;
          var ss = refSide || 1;
          elevVal = ((px - cc.x) * nn.x + (py - cc.y) * nn.y + (pz - cc.z) * nn.z) * ss;
        } else if (mode === 'thickness' && boxCfg && boxCfg.thicknessGrid) {
          var tval = getThicknessForPoint(px, py, pz, boxCfg.thicknessGrid);
          if (tval === null) continue;
          elevVal = tval;
        } else {
          elevVal = pz - (boxCfg ? getZBaseZ(boxCfg) : 0);
        }
        pts.push({ x: px, y: py, z: pz, elev: elevVal });
      }

      if (pts.length < 100) { showToast('Too few points for contours'); return; }

      // Find dominant surface plane — use reference plane in plane deviation mode, PCA otherwise
      var cx = 0, cy = 0, cz = 0;
      for (var i = 0; i < pts.length; i++) {
        cx += pts[i].x; cy += pts[i].y; cz += pts[i].z;
      }
      cx /= pts.length; cy /= pts.length; cz /= pts.length;

      var N, U, V;
      if (mode === 'plane' && planeSurfGrid) {
        // Use the reference plane's axes — contours project from the plane normal direction
        N = planeSurfGrid.N.clone();
        U = planeSurfGrid.U.clone();
        V = planeSurfGrid.V.clone();
      } else {
        var cxx = 0, cxy = 0, cxz = 0, cyy = 0, cyz = 0, czz = 0;
        for (var i = 0; i < pts.length; i++) {
          var dx = pts[i].x - cx, dy = pts[i].y - cy, dz = pts[i].z - cz;
          cxx += dx * dx; cxy += dx * dy; cxz += dx * dz;
          cyy += dy * dy; cyz += dy * dz; czz += dz * dz;
        }
        var normal = smallestEigenvector3x3_local(cxx, cxy, cxz, cyy, cyz, czz);
        var absNx = Math.abs(normal[0]), absNy = Math.abs(normal[1]), absNz = Math.abs(normal[2]);
        var up;
        if (absNz > absNx && absNz > absNy) up = new THREE.Vector3(1, 0, 0);
        else if (absNy > absNx) up = new THREE.Vector3(1, 0, 0);
        else up = new THREE.Vector3(0, 1, 0);
        N = new THREE.Vector3(normal[0], normal[1], normal[2]);
        U = new THREE.Vector3().crossVectors(up, N).normalize();
        V = new THREE.Vector3().crossVectors(N, U).normalize();
      }

      // Project onto UV plane
      var uMin = Infinity, uMax = -Infinity, vMin = Infinity, vMax = -Infinity;
      for (var i = 0; i < pts.length; i++) {
        var dx = pts[i].x - cx, dy = pts[i].y - cy, dz = pts[i].z - cz;
        pts[i].u = dx * U.x + dy * U.y + dz * U.z;
        pts[i].v = dx * V.x + dy * V.y + dz * V.z;
        if (pts[i].u < uMin) uMin = pts[i].u; if (pts[i].u > uMax) uMax = pts[i].u;
        if (pts[i].v < vMin) vMin = pts[i].v; if (pts[i].v > vMax) vMax = pts[i].v;
      }

      var gridRes = 100;
      var uRange = uMax - uMin, vRange = vMax - vMin;
      if (uRange < 0.001 || vRange < 0.001) return;
      var cellU = uRange / gridRes, cellV = vRange / gridRes;

      // Grid: use max Z per cell (top surface only)
      var gridMax = new Float32Array(gridRes * gridRes);
      var gridCount = new Uint16Array(gridRes * gridRes);
      var gridN = new Float32Array(gridRes * gridRes);
      var gridNCount = new Uint16Array(gridRes * gridRes);
      for (var i = 0; i < gridMax.length; i++) gridMax[i] = -Infinity;

      for (var i = 0; i < pts.length; i++) {
        var iu = Math.floor((pts[i].u - uMin) / cellU);
        var iv = Math.floor((pts[i].v - vMin) / cellV);
        if (iu >= gridRes) iu = gridRes - 1;
        if (iv >= gridRes) iv = gridRes - 1;
        var idx = iv * gridRes + iu;
        gridCount[idx]++;
        // Use average Z of top-surface points (already filtered)
        if (gridMax[idx] === -Infinity) gridMax[idx] = 0;
        gridMax[idx] += pts[i].elev;
        var dx = pts[i].x - cx, dy = pts[i].y - cy, dz = pts[i].z - cz;
        gridN[idx] += dx * N.x + dy * N.y + dz * N.z;
        gridNCount[idx]++;
      }

      var gridAvg = new Float32Array(gridRes * gridRes);
      var gridNAvg = new Float32Array(gridRes * gridRes);
      for (var i = 0; i < gridRes * gridRes; i++) {
        if (gridCount[i] > 0) {
          gridAvg[i] = gridMax[i] / gridCount[i];
          gridNAvg[i] = gridN[i] / gridNCount[i];
        } else {
          gridAvg[i] = NaN;
          gridNAvg[i] = 0;
        }
      }

      // Contour levels — use the resolved per-box step
      var range = zMax - zMin;

      // Determine decimal places from step
      var decimals = 0;
      if (step < 0.01) decimals = 3;
      else if (step < 0.1) decimals = 2;
      else if (step < 1) decimals = 1;

      var contourLevels = [];
      var firstLevel = Math.ceil(zMin / step) * step;
      for (var v = firstLevel; v <= zMax + step * 0.01; v += step) {
        if (v >= zMin && v <= zMax) contourLevels.push(v);
      }

      // Compute scan diagonal for label sizing
      var scanDiag = Math.sqrt(uRange * uRange + vRange * vRange);
      var labelScale = scanDiag * 0.04;
      if (labelScale < 0.4) labelScale = 0.4;

      // Offset contour lines slightly along surface normal so they render in front of points
      // Use ~0.5% of scan diagonal, enough to clear point splats without visible gap
      var surfOffset = scanDiag * 0.003;
      if (surfOffset < 0.003) surfOffset = 0.003; // min 3mm
      // In plane deviation mode, offset toward the chosen viewing side
      var offsetDir = (mode === 'plane' && refSide) ? refSide : 1;
      var offX = N.x * surfOffset * offsetDir;
      var offY = N.y * surfOffset * offsetDir;
      var offZ = N.z * surfOffset * offsetDir;

      // Single shared material — cloning per line wasted memory and was
      // never necessary (every contour line uses identical settings).
      var contourMaterial = new THREE.LineBasicMaterial({
        color: 0x000000, linewidth: 4,
        depthTest: true, depthWrite: false,
        transparent: false
      });

      // ===== Label placement: greedy spacing across all levels =====
      // Track every label we place (across levels) and require a minimum
      // world-space distance between any two labels. This naturally thins
      // out clutter at perimeters where contours bunch up, while keeping
      // good coverage along long open contours.
      var placedLabelXY = [];                       // [x,y,z, x,y,z, ...]
      var minLabelSpacing = scanDiag * 0.10;        // ~10% of map diagonal
      var minLabelSpacingSq = minLabelSpacing * minLabelSpacing;
      var edgeMarginU = uRange * 0.05;              // skip labels within 5% of box edge
      var edgeMarginV = vRange * 0.05;
      var uLo = uMin + edgeMarginU, uHi = uMax - edgeMarginU;
      var vLo = vMin + edgeMarginV, vHi = vMax - edgeMarginV;

      function tryPlaceLabel(wx, wy, wz, uVal, vVal, labelText, target) {
        // Skip near box edges — perimeter contour intersections cluster here
        if (uVal < uLo || uVal > uHi || vVal < vLo || vVal > vHi) return false;
        // Reject if any already-placed label is too close
        for (var pi = 0; pi < placedLabelXY.length; pi += 3) {
          var dx = wx - placedLabelXY[pi];
          var dy = wy - placedLabelXY[pi + 1];
          var dz = wz - placedLabelXY[pi + 2];
          if (dx * dx + dy * dy + dz * dz < minLabelSpacingSq) return false;
        }
        placedLabelXY.push(wx, wy, wz);
        var sprite = createContourLabel(labelText, '#ffffff');
        sprite.scale.set(labelScale, labelScale * 0.4, 1);
        sprite.position.set(wx + offX, wy + offY, wz + offZ);
        target.add(sprite);
        return true;
      }

      for (var ci = 0; ci < contourLevels.length; ci++) {
        var level = contourLevels[ci];
        var segs = marchingSquares(gridAvg, gridRes, gridRes, level);
        if (segs.length === 0) continue;

        // Per-segment data: world position of midpoint + (u,v) for edge test
        var linePositions = [];
        var midData = []; // [{wx,wy,wz,u,v}] per segment
        for (var si = 0; si < segs.length; si++) {
          var seg = segs[si];
          var mu = 0, mv = 0;
          for (var pi = 0; pi < 2; pi++) {
            var gu = seg[pi * 2], gv = seg[pi * 2 + 1];
            var uVal = uMin + gu * cellU, vVal = vMin + gv * cellV;
            mu += uVal; mv += vVal;
            var iu = Math.floor(gu), iv = Math.floor(gv);
            if (iu >= gridRes) iu = gridRes - 1;
            if (iv >= gridRes) iv = gridRes - 1;
            var nOffset = gridNAvg[iv * gridRes + iu];
            var wx = cx + uVal * U.x + vVal * V.x + nOffset * N.x + offX;
            var wy = cy + uVal * U.y + vVal * V.y + nOffset * N.y + offY;
            var wz = cz + uVal * U.z + vVal * V.z + nOffset * N.z + offZ;
            linePositions.push(wx, wy, wz);
          }
          // Midpoint of this segment in world space (without offX/Y/Z, since
          // labels apply their own offset)
          var aIdx = (si * 2) * 3, bIdx = (si * 2 + 1) * 3;
          midData.push({
            wx: (linePositions[aIdx] + linePositions[bIdx]) / 2 - offX,
            wy: (linePositions[aIdx + 1] + linePositions[bIdx + 1]) / 2 - offY,
            wz: (linePositions[aIdx + 2] + linePositions[bIdx + 2]) / 2 - offZ,
            u: mu / 2,
            v: mv / 2
          });
        }

        if (linePositions.length === 0) continue;

        // Render multiple offset copies to create a thicker visible line
        var thickness = scanDiag * 0.0008;
        if (thickness < 0.001) thickness = 0.001;
        var offsets = [[0, 0], [thickness, 0], [-thickness, 0], [0, thickness], [0, -thickness]];
        for (var oi = 0; oi < offsets.length; oi++) {
          var du = offsets[oi][0], dv = offsets[oi][1];
          var ox2 = U.x * du + V.x * dv;
          var oy2 = U.y * du + V.y * dv;
          var oz2 = U.z * du + V.z * dv;
          var shifted = new Float32Array(linePositions.length);
          for (var si2 = 0; si2 < linePositions.length; si2 += 3) {
            shifted[si2]     = linePositions[si2]     + ox2;
            shifted[si2 + 1] = linePositions[si2 + 1] + oy2;
            shifted[si2 + 2] = linePositions[si2 + 2] + oz2;
          }
          var geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.Float32BufferAttribute(shifted, 3));
          var line = new THREE.LineSegments(geometry, contourMaterial);
          line.userData.contourLevel = level;
          line.raycast = function () {};
          target.add(line);
        }

        // Place labels with greedy spacing. Walk segments in order and try
        // to place at each midpoint; spacing rules will reject candidates
        // too close to already-placed labels (any level).
        var labelText = fmtLenVal(level);
        var placedAny = false;
        var stride = Math.max(1, Math.floor(midData.length / 24)); // sample
        for (var li = 0; li < midData.length; li += stride) {
          var m = midData[li];
          if (tryPlaceLabel(m.wx, m.wy, m.wz, m.u, m.v, labelText, target)) {
            placedAny = true;
          }
        }
        // If spacing rejected every candidate (very dense map), force one in
        // the interior so the level is identifiable.
        if (!placedAny) {
          for (var li = 0; li < midData.length; li++) {
            var m = midData[li];
            if (m.u < uLo || m.u > uHi || m.v < vLo || m.v > vHi) continue;
            placedLabelXY.push(m.wx, m.wy, m.wz);
            var sprite = createContourLabel(labelText, '#ffffff');
            sprite.scale.set(labelScale, labelScale * 0.4, 1);
            sprite.position.set(m.wx + offX, m.wy + offY, m.wz + offZ);
            target.add(sprite);
            break;
          }
        }
      }

      elevationContoursVisible = true;
    }

    // ===== ELEVATION MAP — CROP BOX + ORCHESTRATION =====

    // ===== EXCLUSION ZONES =====

    function onAddExclusion() {
      var volume = viewer.volumeTool.startInsertion({ clip: false });
      volume.name = 'Exclusion Zone ' + (exclusionBoxes.length + 1);
      volume.clip = false;
      exclusionBoxes.push(volume);
      trackVolumeUndo(volume);

      // Style: nearly invisible fill, black frame, no label
      function styleExclusionBox(vol) {
        if (vol.box) {
          vol.box.material.color.setHex(0x000000);
          vol.box.material.opacity = 0.03;
          vol.box.material.needsUpdate = true;
          // Same fix as cut-out and elevation boxes — disable raycast on the
          // invisible fill so clicks pass through to anything behind it
          // (measurement spheres, markers, etc).
          vol.box.raycast = function() {};
        }
        if (vol.frame) {
          vol.frame.material.color.setHex(0x000000);
          vol.frame.material.needsUpdate = true;
        }
        if (vol.label) vol.label.visible = false;
      }
      styleExclusionBox(volume);
      setTimeout(function() { styleExclusionBox(volume); }, 500);

      $('#btn-clear-exclusions, #btn-hide-exclusion-outlines').show();
      rebuildExclusionList();
      showToast('Click and drag to place exclusion zone.');
    }

    function onClearExclusions() {
      for (var i = 0; i < exclusionBoxes.length; i++) {
        viewer.scene.removeVolume(exclusionBoxes[i]);
      }
      exclusionBoxes = [];
      _lastExclusionHash = 'force';
      forceRecolorElevation();
      $('#btn-clear-exclusions, #btn-hide-exclusion-outlines').hide();
      _exclusionOutlinesHidden = false;
      rebuildExclusionList();
    }

    function removeExclusion(index) {
      if (index >= 0 && index < exclusionBoxes.length) {
        viewer.scene.removeVolume(exclusionBoxes[index]);
        exclusionBoxes.splice(index, 1);
        _lastExclusionHash = 'force';
        forceRecolorElevation();
        if (exclusionBoxes.length === 0) $('#btn-clear-exclusions').hide();
        rebuildExclusionList();
      }
    }

    function toggleExclusion(index) {
      if (index >= 0 && index < exclusionBoxes.length) {
        var vol = exclusionBoxes[index];
        vol._disabled = !vol._disabled;
        vol.visible = !vol._disabled;
        _lastExclusionHash = 'force';
        forceRecolorElevation();
        rebuildExclusionList();
      }
    }

    function forceRecolorElevation() {
      if (elevationActive && elevationPositions && elevationNodeMap) {
        applyElevationColors(elevationPositions, elevationNodeMap);
        // Reset colored nodes so frame listener picks up new exclusions
        elevationColoredNodes.clear();
        for (var ni = 0; ni < elevationNodeMap.length; ni++) {
          elevationColoredNodes.add(elevationNodeMap[ni].geometryNode);
        }
        // Rebuild contours for any box that currently shows them
        for (var bi = 0; bi < elevationCropVolumes.length; bi++) {
          var cfg = getBoxConfig(elevationCropVolumes[bi]);
          if (cfg.active && cfg.contoursVisible) {
            buildBoxContours(elevationCropVolumes[bi]);
          }
        }
      }
    }

    function rebuildExclusionList() {
      var $list = $('#exclusion-list');
      $list.empty();
      if (exclusionBoxes.length === 0) return;
      for (var i = 0; i < exclusionBoxes.length; i++) {
        var vol = exclusionBoxes[i];
        var disabled = vol._disabled;
        var eyeStyle = disabled ? 'opacity:0.35' : '';
        var html = '<div style="display:flex;align-items:center;gap:4px;margin:2px 0;padding:3px 6px;background:rgba(255,255,255,0.05);border-radius:3px;font:12px/1.3 sans-serif;color:var(--sidebar-text)">' +
          '<span style="flex:1">Exclusion ' + (i + 1) + '</span>' +
          '<button data-idx="' + i + '" class="btn-toggle-exclusion" style="padding:1px 5px;border:1px solid var(--border);border-radius:3px;font:11px sans-serif;cursor:pointer;background:var(--panel-bg);color:var(--sidebar-text);' + eyeStyle + '" title="Toggle">&#128065;</button>' +
          '<button data-idx="' + i + '" class="btn-remove-exclusion" style="padding:1px 5px;border:1px solid var(--border);border-radius:3px;font:11px sans-serif;cursor:pointer;background:var(--panel-bg);color:var(--sidebar-text)" title="Delete">&times;</button>' +
          '</div>';
        $list.append(html);
      }
      $list.find('.btn-remove-exclusion').on('click', function() { removeExclusion(parseInt($(this).data('idx'))); });
      $list.find('.btn-toggle-exclusion').on('click', function() { toggleExclusion(parseInt($(this).data('idx'))); });
    }

    // Listen for Potree removing volumes (user selects + presses Delete)
    viewer.scene.addEventListener('volume_removed', function(e) {
      var vol = e.volume;
      var idx = exclusionBoxes.indexOf(vol);
      if (idx >= 0) {
        exclusionBoxes.splice(idx, 1);
        _lastExclusionHash = 'force';
        forceRecolorElevation();
        if (exclusionBoxes.length === 0) $('#btn-clear-exclusions').hide();
        rebuildExclusionList();
      }
    });

    // Per-frame: detect exclusion box movement and recolor (throttled to max once per 500ms)
    var _exclusionRecolorTimer = null;
    viewer.addEventListener('update', function() {
      if (exclusionBoxes.length > 0 && elevationActive) {
        var hash = '';
        for (var i = 0; i < exclusionBoxes.length; i++) {
          var vol = exclusionBoxes[i];
          if (vol._disabled) { hash += 'off|'; continue; }
          var p = vol.position, s = vol.scale;
          hash += p.x.toFixed(2) + p.y.toFixed(2) + p.z.toFixed(2) +
                  s.x.toFixed(2) + s.y.toFixed(2) + s.z.toFixed(2) + '|';
        }
        if (hash !== _lastExclusionHash) {
          _lastExclusionHash = hash;
          if (!_exclusionRecolorTimer) {
            _exclusionRecolorTimer = setTimeout(function() {
              _exclusionRecolorTimer = null;
              if (elevationActive && elevationPositions && elevationNodeMap) {
                applyElevationColors(elevationPositions, elevationNodeMap);
                elevationColoredNodes.clear();
                for (var ni = 0; ni < elevationNodeMap.length; ni++) {
                  elevationColoredNodes.add(elevationNodeMap[ni].geometryNode);
                }
              }
            }, 250);
          }
        }
      } else if (_lastExclusionHash !== '' && exclusionBoxes.length === 0) {
        _lastExclusionHash = '';
        if (elevationActive) forceRecolorElevation();
      }
    });

    // Check if a point is inside any active exclusion box
    function isPointExcluded(px, py, pz, exclInvMats) {
      for (var ei = 0; ei < exclInvMats.length; ei++) {
        var local = new THREE.Vector3(px, py, pz).applyMatrix4(exclInvMats[ei]);
        if (Math.abs(local.x) <= 0.5 && Math.abs(local.y) <= 0.5 && Math.abs(local.z) <= 0.5) return true;
      }
      return false;
    }

    // Build exclusion inverse matrices (for active boxes only)
    function buildExclusionInvMats() {
      var mats = [];
      for (var i = 0; i < exclusionBoxes.length; i++) {
        if (exclusionBoxes[i]._disabled) continue;
        exclusionBoxes[i].updateMatrixWorld(true);
        mats.push(new THREE.Matrix4().copy(exclusionBoxes[i].matrixWorld).invert());
      }
      // Also treat active cut-out boxes as exclusion zones for coloring/contours
      for (var i = 0; i < cutoutBoxes.length; i++) {
        if (cutoutBoxes[i]._disabled) continue;
        cutoutBoxes[i].updateMatrixWorld(true);
        mats.push(new THREE.Matrix4().copy(cutoutBoxes[i].matrixWorld).invert());
      }
      return mats;
    }

    // Show/hide crop box outline (frame + box visuals only, clipping stays)
    var _cropOutlineHidden = false;
    // Show/hide all exclusion box outlines
    var _exclusionOutlinesHidden = false;
    function onToggleExclusionOutlines() {
      _exclusionOutlinesHidden = !_exclusionOutlinesHidden;
      for (var i = 0; i < exclusionBoxes.length; i++) {
        var vol = exclusionBoxes[i];
        if (vol._disabled) continue;
        if (_exclusionOutlinesHidden) {
          if (vol.frame) vol.frame.visible = false;
          if (vol.box) vol.box.visible = false;
          if (vol.label) vol.label.visible = false;
        } else {
          if (vol.frame) vol.frame.visible = true;
          if (vol.box) vol.box.visible = true;
        }
      }
      $('#btn-hide-exclusion-outlines').text(_exclusionOutlinesHidden ? 'Show Boxes' : 'Hide Boxes');
    }

    // ===== Elevation Crop Box management (multi-box) =====

    function styleElevationBox(vol) {
      // Transparent fill (invisible), green wireframe. The fill mesh has its
      // raycast disabled so click-and-drag INSIDE the box pans/rotates the
      // camera (Potree's InputHandler doesn't grab it as a drag target).
      // A custom mousedown/mouseup pair below detects a click-without-drag
      // over the box and toggles its selection so the resize/move gizmo
      // still appears — without blocking camera controls.
      if (vol.box) {
        vol.box.visible = true;
        vol.box.material.color.setHex(0x000000);
        vol.box.material.opacity = 0.0;
        vol.box.material.transparent = true;
        vol.box.material.needsUpdate = true;
        vol.box.raycast = function() {};
      }
      if (vol.frame) {
        // Consistent with every other box: honor the box-wireframe brightness
        // (default black) instead of a special green frame.
        _applyBoxWireToVolume(vol);
      }
      if (vol.label) vol.label.visible = false;
    }

    // Per-box state drives whether a box is highlighted (green preview) or heat-mapped
    var _elevationComputed = false; // legacy; retained for save/load compatibility

    // Push elevation box transforms to highlight boxes (green point tint).
    // A box gets the green highlight if it's enabled AND either:
    //   - cfg.active is false (never computed → preview mode), OR
    //   - cfg.active is true BUT the user has moved/resized the box since
    //     compute (current transform != cfg.computedBoxMatrix). The whole
    //     current OBB tints green, signalling "this is the new region";
    //     the heat map still paints inside (modulated by current bounds via
    //     applyElevationColors, see boxTransformChanged below).
    function _matricesDiffer(a, b) {
      if (!a || !b) return !!a !== !!b;
      var ae = a.elements, be = b.elements;
      for (var k = 0; k < 16; k++) {
        if (Math.abs(ae[k] - be[k]) > 1e-6) return true;
      }
      return false;
    }
    function syncHighlightBoxes() {
      var matrixList = [];
      for (var i = 0; i < elevationCropVolumes.length; i++) {
        var vol = elevationCropVolumes[i];
        if (vol._disabled) continue;
        var cfg = getBoxConfig(vol);
        vol.updateMatrixWorld(true);
        var modifiedSinceCompute = cfg.active && cfg.computedBoxMatrix &&
          _matricesDiffer(vol.matrixWorld, cfg.computedBoxMatrix);
        if (cfg.active && !modifiedSinceCompute) continue;
        matrixList.push({ inverse: new THREE.Matrix4().copy(vol.matrixWorld).invert() });
      }
      viewer.scene.pointclouds.forEach(function(pc) {
        pc.material.setHighlightBoxes(matrixList);
      });
    }

    function addElevationBox() {
      var volume = viewer.volumeTool.startInsertion({ clip: false });
      _elevBoxCounter++;
      volume.name = 'Elev Box ' + _elevBoxCounter;
      volume.clip = false;

      styleElevationBox(volume);
      setTimeout(function() { styleElevationBox(volume); }, 500);

      elevationCropVolumes.push(volume);
      trackVolumeUndo(volume);
      // New box starts as inactive (cfg.active=false) so it shows the green preview.
      // Already-active boxes retain their heat map colors.
      syncHighlightBoxes();
      rebuildElevationBoxList();
      showToast('Click and drag on the point cloud to place elevation box.');
    }

    function removeElevationBox(index) {
      if (index < 0 || index >= elevationCropVolumes.length) return;
      var vol = elevationCropVolumes[index];
      var cfg = getBoxConfig(vol);
      if (cfg.contourGroup) {
        disposeContourGroup(cfg.contourGroup);
        cfg.contourGroup = null;
      }
      elevationBoxConfigs.delete(vol);
      if (_selectedElevBox === vol) _selectedElevBox = null;
      viewer.scene.removeVolume(vol);
      elevationCropVolumes.splice(index, 1);
      if (elevationActive) {
        applyElevationColors(elevationPositions, elevationNodeMap);
      }
      syncHighlightBoxes();
      rebuildElevationBoxList();
      showToast('Elevation box removed');
    }

    function clearAllElevationBoxes() {
      for (var i = 0; i < elevationCropVolumes.length; i++) {
        var cfg = getBoxConfig(elevationCropVolumes[i]);
        if (cfg.contourGroup) disposeContourGroup(cfg.contourGroup);
        elevationBoxConfigs.delete(elevationCropVolumes[i]);
        viewer.scene.removeVolume(elevationCropVolumes[i]);
      }
      elevationCropVolumes = [];
      _elevBoxCounter = 0;
      _selectedElevBox = null;
      if (elevationActive) onClearElevation();
      rebuildElevationBoxList();

    // rebuild refreshes both toolbars + the legend title (which reads vol.name).
    function _editElevName(spanEl, vol) {
      if (!spanEl || !vol) return;
      var input = document.createElement('input');
      input.type = 'text';
      input.value = vol.name || '';
      input.style.cssText = 'flex:1;min-width:0;font:inherit;font-weight:700;padding:1px 4px;' +
        'border:1px solid var(--accent,#4db6ff);border-radius:3px;background:var(--panel-bg,#3a3a3a);color:var(--sidebar-text,#fbfbfb)';
      spanEl.replaceWith(input);
      input.focus(); input.select();
      var done = false;
      function commit(save) {
        if (done) return; done = true;
        var nv = input.value.trim();
        if (save && nv) vol.name = nv;
        rebuildElevationBoxList();   // restores the span; refreshes list + legend title
      }
      input.addEventListener('keydown', function (e) {
        e.stopPropagation();   // never leak Enter/Esc/letters to global shortcuts
        if (e.key === 'Enter') { e.preventDefault(); commit(true); }
        else if (e.key === 'Escape') { e.preventDefault(); commit(false); }
      });
      input.addEventListener('blur', function () { commit(true); });
      input.addEventListener('click', function (e) { e.stopPropagation(); });
      input.addEventListener('mousedown', function (e) { e.stopPropagation(); });

    function onReapplyElevationRange() {

    function clearBoxElevation(volume) {

        disposeContourGroup(cfg.contourGroup);
        cfg.contourGroup = null;

      cfg.contoursVisible = false;
      // Recompute any remaining active boxes' coloring; points from this box fall back to originals

        applyElevationColors(elevationPositions, elevationNodeMap);

    function onClearElevation() {

      syncHighlightBoxes();

        vol.box.material.transparent = true;
        vol.box.material.needsUpdate = true;

      if (Math.abs(dv) > 1e-9) { var tc = (re.yMin - v0) / dv, td = (re.yMax - v0) / dv; lo = Math.max(lo, Math.min(tc, td)); hi = Math.min(hi, Math.max(tc, td)); }

      return (lo > hi) ? null : [lo, hi];
    }

    // Pairwise intersection lines of visible planes, CLIPPED to where both planes'
    // stretched rectangles overlap: [{ origin, dir(unit), tLo, tHi }].
    function getIntersectionLines() {
      var planes = [];
      for (var i = 0; i < constraints.length; i++) {
        var c = constraints[i];
        if (c.type === 'plane' && c.visible !== false && c.plane) planes.push(c);
      }
      var lines = [];
      for (var a = 0; a < planes.length; a++) {
        for (var b = a + 1; b < planes.length; b++) {
          var n1 = planes[a].plane.normal, n2 = planes[b].plane.normal;
          var h1 = -planes[a].plane.constant, h2 = -planes[b].plane.constant;  // THREE.Plane: n·x = -constant
          var u = new THREE.Vector3().crossVectors(n1, n2);
          var uLen2 = u.lengthSq();
          if (uLen2 < 1e-9) continue;   // parallel → no line
          var p = new THREE.Vector3()
            .addScaledVector(new THREE.Vector3().crossVectors(n2, u), h1)
            .addScaledVector(new THREE.Vector3().crossVectors(u, n1), h2)
            .divideScalar(uLen2);
          var dir = u.normalize();
          var rA = _lineRectTRange(p, dir, planes[a]);
          var rB = _lineRectTRange(p, dir, planes[b]);
          if (!rA || !rB) continue;              // line misses one rectangle entirely
          var tLo = Math.max(rA[0], rB[0]), tHi = Math.min(rA[1], rB[1]);
          if (tLo >= tHi) continue;              // rectangles don't overlap along the line
          lines.push({ origin: p, dir: dir, tLo: tLo, tHi: tHi });
        }
      }
      return lines;
    }

    // Screen-space snap: if the cursor is within `thrPx` of an intersection line's
    // on-screen projection, return the 3D point ON the line nearest the cursor ray
    // (works even where the line runs through empty space, e.g. a member centreline).
    function snapToIntersectionLineScreen(mouse, camera, thrPx) {
      var lines = getIntersectionLines();
      if (!lines.length || !mouse || typeof mouse.x !== 'number' || !camera) return null;
      var sz = viewer.renderer.getSize(new THREE.Vector2());
      var ray = Potree.Utils.mouseToRay(mouse, camera, sz.x, sz.y);
      var ro = ray.origin, rd = ray.direction.clone().normalize();
      var best = null, bestPx = thrPx;
      for (var i = 0; i < lines.length; i++) {
        var lo = lines[i].origin, ld = lines[i].dir;   // ld is unit
        var w0 = new THREE.Vector3().subVectors(lo, ro);
        var b = ld.dot(rd), d = ld.dot(w0), e = rd.dot(w0);
        var denom = 1 - b * b;
        if (Math.abs(denom) < 1e-6) continue;           // line ∥ ray
        var t = (b * e - d) / denom;                    // param on the intersection line
        t = Math.max(lines[i].tLo, Math.min(lines[i].tHi, t));   // only snap on the visible (clipped) segment
        var pol = new THREE.Vector3().copy(lo).addScaledVector(ld, t);
        var sp = pol.clone().project(camera);
        if (sp.z < -1 || sp.z > 1) continue;            // behind camera / off-frustum
        var px = (sp.x * 0.5 + 0.5) * sz.x;
        var py = (1 - (sp.y * 0.5 + 0.5)) * sz.y;
        var dist = Math.sqrt((px - mouse.x) * (px - mouse.x) + (py - mouse.y) * (py - mouse.y));
        if (dist < bestPx) { bestPx = dist; best = pol; }
      }
      return best;
    }

    // ---- Green intersection-line visuals (drawn like a plane outline so you can
    // see the axis where two planes cross, and snap/measure to it). ----
    var _intersectLineGroup = new THREE.Group();
    constraintScene.add(_intersectLineGroup);
    function updateIntersectionLineVisuals() {
      var lines = getIntersectionLines();
      while (_intersectLineGroup.children.length < lines.length) {
        var geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
        var mat = new THREE.LineBasicMaterial({ color: 0x39ff14, transparent: true, opacity: 0.9, depthTest: false, depthWrite: false });
        _intersectLineGroup.add(new THREE.Line(geo, mat));

      while (_intersectLineGroup.children.length > lines.length) {
        var old = _intersectLineGroup.children.pop();
        if (old.geometry) old.geometry.dispose();
        if (old.material) old.material.dispose();
      }
      for (var i = 0; i < lines.length; i++) {
        var L = lines[i];
        var line = _intersectLineGroup.children[i];
        var pos = line.geometry.attributes.position;
        pos.setXYZ(0, L.origin.x + L.dir.x * L.tLo, L.origin.y + L.dir.y * L.tLo, L.origin.z + L.dir.z * L.tLo);
        pos.setXYZ(1, L.origin.x + L.dir.x * L.tHi, L.origin.y + L.dir.y * L.tHi, L.origin.z + L.dir.z * L.tHi);

    }

    // Push focus box transforms + per-box opacity to every point cloud material.
    function syncFocusBoxes() {
      var activeBoxes = focusBoxes.filter(function(v) { return !v._disabled; });
      var list = activeBoxes.map(function(vol) {
        vol.updateMatrixWorld(true);
        var inv = new THREE.Matrix4().copy(vol.matrixWorld).invert();
        return { inverse: inv, opacity: (vol._focusOpacity == null ? 1 : vol._focusOpacity) };
      });
      viewer.scene.pointclouds.forEach(function(pc) {
        pc.material.setFocusBoxes(list);
        pc.material.setFocusOutsideOpacity(_pcOpacityLogical);
      });
    }

    // Route the global "outside" opacity. When focus boxes exist the whole cloud
    // renders via dithered discard, so the outside value must go through the shader
    // (uFocusOutsideOpacity) and the smooth post-process fade is disabled to avoid
    // double-dimming. With no focus boxes, behave exactly as before (edlOpacity).
    function applyGlobalOpacity() {
      if (focusBoxes.length > 0) {
        // Outside fade is the per-point focus dither; keep the global cloud opacity
        // at 1 (edlOpacity too) so nothing double-fades.
        viewer.edlOpacity = 1.0;
        viewer.scene.pointclouds.forEach(function(pc) {
          pc.material.setFocusOutsideOpacity(_pcOpacityLogical);
          if (pc.material.uniforms && pc.material.uniforms.uCloudOpacity) pc.material.uniforms.uCloudOpacity.value = 1.0;
        });
      } else {
        // EDL renderer (desktop) fades via the post-process; Android GPUs that can't
        // run EDL use the BASIC renderer where edlOpacity is a no-op, so ALSO drive
        // the shader's uCloudOpacity — a screen-space dither gated to !use_edl in
        // potree.js, so it's inert on EDL devices. (Dither, not alpha-blend, because
        // the low-level point renderer doesn't honor a JS material.blending change.)
        viewer.edlOpacity = _pcOpacityLogical;
        viewer.scene.pointclouds.forEach(function(pc) {
          if (pc.material.uniforms && pc.material.uniforms.uCloudOpacity) pc.material.uniforms.uCloudOpacity.value = _pcOpacityLogical;
        });
      }
      if (viewer.repaint) viewer.repaint();
    }

    function rebuildFocusList() {
      var list = document.getElementById('enable-focus-list');
      if (!list) return;
      list.innerHTML = '';

      var clearBtn = document.getElementById('btn-clear-all-focus');
      if (clearBtn) clearBtn.style.display = focusBoxes.length > 0 ? '' : 'none';

      for (var i = 0; i < focusBoxes.length; i++) {
        (function(idx) {
          var vol = focusBoxes[idx];
          var row = document.createElement('div');
          row.style.cssText = 'display:flex;align-items:center;gap:6px;margin:2px 0;font:12px/1.3 sans-serif;color:var(--sidebar-text,#fbfbfb)';

          var nameSpan = document.createElement('span');
          nameSpan.style.flex = '1';
          nameSpan.textContent = vol.name;

          var eyeBtn = document.createElement('button');
          eyeBtn.textContent = vol._disabled ? '—' : '\u{1F441}';
          eyeBtn.title = 'Toggle this focus box on/off';
          eyeBtn.style.cssText = 'background:none;border:none;color:var(--sidebar-text,#fbfbfb);cursor:pointer;font-size:14px;padding:2px 4px';
          eyeBtn.addEventListener('click', function() {
            vol._disabled = !vol._disabled;

            styleFocusBox(vol);
            syncFocusBoxes();

          });

          var outlineBtn = document.createElement('button');
          var _outVis = vol.frame ? vol.frame.visible : true;
          outlineBtn.textContent = _outVis ? '□' : '■';
          outlineBtn.title = 'Toggle outline visibility';
          outlineBtn.style.cssText = 'background:none;border:none;color:var(--sidebar-text,#fbfbfb);cursor:pointer;font-size:14px;padding:2px 4px';
          outlineBtn.addEventListener('click', function() {
            vol._outlineHidden = !vol._outlineHidden;
            vol.visible = !vol._outlineHidden;                 // focus effect is shader-driven, unaffected
            if (!vol._outlineHidden) styleFocusBox(vol);
            outlineBtn.textContent = vol._outlineHidden ? '■' : '□';
          });

          var delBtn = document.createElement('button');
          delBtn.textContent = '✕';
          delBtn.title = 'Remove this focus box';
          delBtn.style.cssText = 'background:none;border:none;color:#f44;cursor:pointer;font-size:14px;padding:2px 4px';
          delBtn.addEventListener('click', function() { removeFocusBox(idx); });

          row.appendChild(nameSpan);
          row.appendChild(eyeBtn);
          row.appendChild(outlineBtn);
          row.appendChild(delBtn);

    }

    // Right-panel per-box opacity, shown on select (satisfies the tool-settings-on-
    // select rule). chrome.js adopts #enable-focus-panel into the context panel.
    function ensureFocusPanel() {
      var p = document.getElementById('enable-focus-panel');

        document.body.appendChild(p); // chrome.js reparents this into the context panel

    }

        '<div style="margin:2px 0 10px">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;font-size:12px;opacity:0.85;margin-bottom:3px">' +
            '<span>Interior opacity</span><span id="focus-opacity-val">' + pct + '%</span>' +
          '</div>' +
          '<input type="range" id="focus-opacity-slider" min="0" max="100" value="' + pct + '" style="width:100%">' +
        '</div>';

      if (os) os.addEventListener('input', function() {

    function hideFocusBoxSettings() {

    // Selecting a focus box (via its list row or 3D click) routes through Potree
    // selection_changed -> enable:selection-changed; show/clear its settings panel.
    document.addEventListener('enable:selection-changed', function(e) {
      var name = e && e.detail && e.detail.name;
      var vol = null;
      if (name) {
        for (var i = 0; i < focusBoxes.length; i++) {
          if (focusBoxes[i].name === name) { vol = focusBoxes[i]; break; }

      else hideFocusBoxSettings();
    });

    // Create the panel element up front so chrome.js adopts it into the context panel.
    ensureFocusPanel();

    // Potree removes a volume when the user selects it + presses Delete. Clean up
    // our focus-box bookkeeping so the box stops focusing points, leaves the list,
    // and its settings panel clears.
    viewer.scene.addEventListener('volume_removed', function(e) {
      var vol = e && e.volume;
      var idx = focusBoxes.indexOf(vol);
      if (idx >= 0) {
        focusBoxes.splice(idx, 1);
        if (focusBoxes.length === 0) { _pcOpacityLogical = 1.0; updateScansPanel(); }  // restore full opacity

        rebuildFocusList();

    // ============================================================
    // COLOR GROUPS — draw a 2D polygon; every point that projects
    // inside it (unlimited depth — combine with clip/focus boxes to
    // limit depth) gets tinted toward the group's colour. Groups
    // toggle on/off. The tint is BAKED into each node's colour buffer
    // and re-applied as LOD nodes stream in, so it scales to many
    // regions across a whole building. Entirely viewer-local.
    // ============================================================
    var colorGroups = [];        // { id, name, color:[r,g,b] 0-255, enabled, strokes:[{vp:Float32Array(16), ndc:Float32Array(2n)}] }
    var _cgCounter = 0;
    var _cgActiveId = null;      // group that new regions are added to

    function _cgHexToRgb(s){ s=s.replace('#',''); return [parseInt(s.substr(0,2),16),parseInt(s.substr(2,2),16),parseInt(s.substr(4,2),16)]; }

    function addColorGroup(name, color) {
      var g = { id:'cg-'+(++_cgCounter), name: name || ('Group '+_cgCounter), color: color || _cgNextColor(), enabled:true, strokes:[] };
      colorGroups.push(g);
      _cgActiveId = g.id;
      rebuildColorGroupList();
      return g;
    }
    function removeColorGroup(id) {
      for (var i=0;i<colorGroups.length;i++){ if (colorGroups[i].id===id){ colorGroups.splice(i,1); break; } }
      if (_cgActiveId===id) _cgActiveId = colorGroups.length ? colorGroups[colorGroups.length-1].id : null;
      if (_cgSelectedId===id){ _cgSelectedId=null; _cgHidePanel(); }
      _cgBump(); rebuildColorGroupList();
    }
    function clearAllColorGroups() {
      colorGroups = []; _cgActiveId=null; _cgSelectedId=null;
      _cgHidePanel(); _cgBump(); rebuildColorGroupList();
    }
    function _cgBump(){ _cgPaintVersion++; if (viewer.repaint) viewer.repaint(); }

    // -- point-in-polygon (crossing number), verts flat [x0,y0,x1,y1,...] in NDC --
    function _cgPointInPoly(x, y, v) {
      var inside=false, n=v.length/2;
      for (var i=0, j=n-1; i<n; j=i++){
        var yi=v[i*2+1], yj=v[j*2+1];
        if ((yi>y)!==(yj>y)){
          var xi=v[i*2], xj=v[j*2];
          if (x < (xj-xi)*(y-yi)/(yj-yi) + xi) inside = !inside;
        }
      }
      return inside;
    }

    // -- bake the enabled groups' strokes into one octree node's colours --
    function _cgPaintNode(node) {
      var gn = node.geometryNode; if (!gn || !gn.geometry) return false;
      var geom = gn.geometry;
      // PotreeConverter binary octrees expose colour as 'rgba' (Uint8x4 normalized);
      // the on-the-fly LAS path uses 'color'. Support both.
      var colAttr = geom.attributes.rgba || geom.attributes.color, posAttr = geom.attributes.position;
      if (!colAttr || !posAttr || !node.sceneNode) { node._cgVersion = _cgPaintVersion; return false; }

      var strokes = [];
      for (var gi=0; gi<colorGroups.length; gi++){
        var g = colorGroups[gi]; if (!g.enabled) continue;
        for (var si=0; si<g.strokes.length; si++) strokes.push({ s:g.strokes[si], c:g.color });

        if (node._cgOrigColor){ colAttr.array.set(node._cgOrigColor); colAttr.needsUpdate = true; node._cgVersion = _cgPaintVersion; return true; }
        node._cgVersion = _cgPaintVersion; return false;

      var e = node.sceneNode.matrixWorld.elements;
      var m0=e[0],m1=e[1],m2=e[2],m4=e[4],m5=e[5],m6=e[6],m8=e[8],m9=e[9],m10=e[10],m12=e[12],m13=e[13],m14=e[14];

        else { col[o]=orig[o]; col[o+1]=orig[o+1]; col[o+2]=orig[o+2]; col[o+3]=orig[o+3]; }

      node._cgVersion = _cgPaintVersion;
      return true;
    }

    // Re-bake stale visible nodes a few per frame (avoids a hard freeze on
    // big changes); newly streamed LOD nodes get painted automatically.
    viewer.addEventListener('update', function() {
      var pcs = viewer.scene.pointclouds; if (!pcs || !pcs.length) return;
      var budget = 6;
      for (var p=0; p<pcs.length && budget>0; p++){
        var vn = pcs[p].visibleNodes; if (!vn) continue;
        for (var n=0; n<vn.length && budget>0; n++){
          var node = vn[n];
          if (node._cgVersion === _cgPaintVersion) continue;
          if (_cgPaintNode(node)) budget--;
        }
      }
    });

    // -- polygon-draw overlay (passive SVG) + capture-phase input --
    // The overlay is pointer-events:none so it NEVER blocks the viewer. We watch
    // pointer events in the capture phase and treat only a CLEAN click (no drag) as
    // a polygon vertex — so left-drag orbit, right-drag pan and wheel zoom all keep
    // working while you draw.
    var _cgOverlay = null, _cgPts = [], _cgMoveXY = null, _cgDown = null;
    function _cgEnsureOverlay() {
      if (_cgOverlay) return _cgOverlay;
      var NS='http://www.w3.org/2000/svg';
      var svg = document.createElementNS(NS,'svg');
      svg.setAttribute('id','enable-colorize-overlay');
      svg.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:50;pointer-events:none;display:none';
      var fill = document.createElementNS(NS,'polygon');
      fill.setAttribute('fill','rgba(255,255,255,0.12)'); fill.setAttribute('stroke','none');
      var poly = document.createElementNS(NS,'polyline');
      poly.setAttribute('fill','none'); poly.setAttribute('stroke','#fff'); poly.setAttribute('stroke-width','1.5'); poly.setAttribute('stroke-dasharray','5 4');
      svg.appendChild(fill); svg.appendChild(poly);
      renderArea.appendChild(svg);
      _cgOverlay = { svg:svg, poly:poly, fill:fill };
      return _cgOverlay;
    }
    function _cgXY(ev){ var r=renderArea.getBoundingClientRect(); return { x:ev.clientX-r.left, y:ev.clientY-r.top }; }

    // While a polygon is IN PROGRESS (>=1 vertex placed) navigation is FROZEN:
    // intercept mouse/wheel events at the document capture phase — ahead of both
    // Potree's InputHandler and the app's capture-phase pan handler — and swallow
    // them. With ZERO vertices (tool active but between polygons, e.g. right after
    // Enter) nothing is blocked, so orbit / pan / zoom work normally.
    var _CG_EVT = ['mousedown','mouseup','mousemove','click','dblclick','wheel','mousewheel','DOMMouseScroll','contextmenu'];
    function _cgOnDocEvent(ev){

      if (ev.target !== renderArea && !renderArea.contains(ev.target)) return;
      var wasActive = _cgPts.length >= 1;   // freeze only once a polygon is under way
      var type = ev.type;
      if (type==='mousedown'){ _cgDown={ x:ev.clientX, y:ev.clientY, btn:ev.button }; }
      else if (type==='mousemove'){ _cgMoveXY=_cgXY(ev); _cgRedraw(); }
      else if (type==='mouseup' && _cgDown){
        var moved=Math.hypot(ev.clientX-_cgDown.x, ev.clientY-_cgDown.y), btn=_cgDown.btn; _cgDown=null;
        if (moved<=6){                        // a clean click (drags orbit/pan instead)
          if (btn===2){ _cgFinish(); }        // clean right-click closes the region
          else if (btn===0){
            var p=_cgXY(ev), done=false;
            if (_cgPts.length>=3){ var f=_cgPts[0]; if (Math.hypot(p.x-f.x,p.y-f.y)<10){ _cgFinish(); done=true; } }
            if (!done){ _cgPts.push(p); _cgRedraw(); }

        }

    }
    function _cgSetCursor(on){
      renderArea.style.cursor = on ? 'crosshair' : '';
      var cv=renderArea.querySelector('canvas'); if (cv) cv.style.cursor = on ? 'crosshair' : '';
    }
    function startColorizeDraw(){

    // Helper: create a collapsible group
    function createGroup(id, title, expanded) {
      return '<div class="enable-group' + (expanded ? ' expanded' : '') + '" id="group-' + id + '">' +

    function closeGroup() { return '</div></div>'; }

    // ===== SKETCHUP / GLB MODEL IMPORT =====
    // Models live in viewer.scene.scene (Potree's main THREE scene) so they render
    // in the normal pass and occlude correctly against the point cloud.
    // Each project's models/ folder auto-loads on start (hidden by default); the
    // user toggles them on in the right "Tool settings" panel. Models render in
    // viewer.scene.scene so they occlude correctly against the cloud.
    let models = [];               // [{ name, group, visible }]
    let loadedPointCloud = null;   // set when the cloud finishes loading
    let modelLightsAdded = false;

    // -- Model snapping support. modelSnapMeshes = leaf meshes of visible models.
    //    The model is often very dense (this backyard glb is ~3.5M triangles), so
    //    we rely on THREE's per-mesh bounds culling in intersectObjects (only the
    //    few meshes under the cursor get triangle-tested) — ONE raycast per pick
    //    gives both the surface point AND the hit triangle, from which we snap to
    //    the nearest vertex / point-along-edge. No million-vertex precompute. --
    let modelSnapMeshes = [];
    let _modelRaycaster = null;
    // Extracted hard edges/vertices (world space) of loaded+visible models. These
    // are the REAL feature edges (EdgesGeometry drops flat interior tessellation),
    // which is what you actually want to snap to on a dense model.
    let modelSnapVerts = [];   // Array<Vector3>
    let modelSnapEdges = [];   // Array<[Vector3, Vector3]>
    let modelEdgeLines = null; // THREE.LineSegments overlay (toggleable)
    let showModelEdges = false;
    let modelFeatureGrid = null; // spatial hash → only project features near the cursor
    function _vkey(v) { return Math.round(v.x * 1e4) + ',' + Math.round(v.y * 1e4) + ',' + Math.round(v.z * 1e4); }
    function rebuildModelSnapMeshes() {
      modelSnapMeshes = [];
      for (var i = 0; i < models.length; i++) {
        if (!models[i].group || !models[i].visible) continue;
        models[i].group.traverse(function(obj) {
          if (obj.isMesh && obj.geometry && obj.geometry.attributes && obj.geometry.attributes.position) modelSnapMeshes.push(obj);
        });
      }
    }

    // One raycast against the visible model under the cursor. Returns the surface
    // hit + the hit triangle (object/face) so the caller can snap to features
    // without a second raycast. Returns { point, distance, object, face } or null.
    function modelSurfacePick(mousePixel) {
      if (!modelSnapMeshes.length) return null;
      var camera = viewer.scene.getActiveCamera();
      if (!camera) return null;
      var rect = renderArea.getBoundingClientRect();
      if (!_modelRaycaster) _modelRaycaster = new THREE.Raycaster();
      var ndc = new THREE.Vector2((mousePixel.x / rect.width) * 2 - 1, -(mousePixel.y / rect.height) * 2 + 1);
      _modelRaycaster.setFromCamera(ndc, camera);
      var hits = _modelRaycaster.intersectObjects(modelSnapMeshes, false);
      if (!hits.length) return null;
      return { point: hits[0].point.clone(), distance: hits[0].distance, object: hits[0].object, face: hits[0].face };
    }

    // Extract a model's hard edges/vertices (world space) via EdgesGeometry, run
    // in time-sliced chunks so a 3.5M-tri model never freezes the viewer. ~18°
    // keeps real feature edges (deck boards, slats, rims) and drops flat interior
    // tessellation — exactly what should be snappable.
    function scheduleEdgeExtract(rec) {
      rec.snapEdges = [];
      rec.snapVerts = [];
      var vkeys = new Set();
      var meshes = [];
      rec.group.updateMatrixWorld(true);
      rec.group.traverse(function(o) { if (o.isMesh && o.geometry && o.geometry.attributes && o.geometry.attributes.position) meshes.push(o); });
      var mi = 0, tick = 0;
      function step() {
        var t0 = performance.now();
        while (mi < meshes.length && (performance.now() - t0) < 15) {
          var o = meshes[mi++];
          try {
            var eg = new THREE.EdgesGeometry(o.geometry, 18);
            var ep = eg.attributes.position, a = new THREE.Vector3(), b = new THREE.Vector3();
            for (var i = 0; i + 1 < ep.count; i += 2) {
              a.fromBufferAttribute(ep, i); b.fromBufferAttribute(ep, i + 1);
              o.localToWorld(a); o.localToWorld(b);
              var A = a.clone(), B = b.clone();
              rec.snapEdges.push([A, B]);
              var ka = _vkey(A); if (!vkeys.has(ka)) { vkeys.add(ka); rec.snapVerts.push(A); }
              var kb = _vkey(B); if (!vkeys.has(kb)) { vkeys.add(kb); rec.snapVerts.push(B); }
            }
            if (eg.dispose) eg.dispose();
          } catch (e) {}
        }
        rebuildModelFeatures();
        if (showModelEdges && (++tick % 6 === 0)) rebuildEdgeLines(); // fill in the overlay as it builds
        if (mi < meshes.length) setTimeout(step, 0);
        else { buildFeatureGrid(); rebuildEdgeLines(); console.log('[msnap] edges extracted "' + rec.name + '":', rec.snapEdges.length, 'edges,', rec.snapVerts.length, 'verts'); }
      }
      setTimeout(step, 0);
    }
    function rebuildModelFeatures() {
      modelSnapVerts = [];
      modelSnapEdges = [];
      for (var i = 0; i < models.length; i++) {
        var r = models[i];
        if (!r.group || !r.visible || !r.snapVerts) continue;
        for (var v = 0; v < r.snapVerts.length; v++) modelSnapVerts.push(r.snapVerts[v]);
        for (var e = 0; e < r.snapEdges.length; e++) modelSnapEdges.push(r.snapEdges[e]);
      }
    }
    // Cyan overlay of all snappable edges (toggle in the Models panel) so you can
    // SEE what's detected.
    function rebuildEdgeLines() {
      if (modelEdgeLines) { viewer.scene.scene.remove(modelEdgeLines); modelEdgeLines.geometry.dispose(); modelEdgeLines.material.dispose(); modelEdgeLines = null; }
      if (!showModelEdges || !modelSnapEdges.length) return;
      var pos = new Float32Array(modelSnapEdges.length * 6);
      for (var i = 0; i < modelSnapEdges.length; i++) {
        var A = modelSnapEdges[i][0], B = modelSnapEdges[i][1], o = i * 6;
        pos[o] = A.x; pos[o + 1] = A.y; pos[o + 2] = A.z; pos[o + 3] = B.x; pos[o + 4] = B.y; pos[o + 5] = B.z;
      }
      var g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      modelEdgeLines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x00e5ff, transparent: true, opacity: 0.85 }));
      modelEdgeLines.renderOrder = 5;
      viewer.scene.scene.add(modelEdgeLines);
    }
    function toggleModelEdges() { showModelEdges = !showModelEdges; rebuildEdgeLines(); updateModelsPanel(); }

    // Snap to the nearest extracted hard VERTEX (priority) or point ALONG a hard
    // EDGE, near the raycast anchor H. The 3D distance pre-filter keeps it fast
    // regardless of how many edges the model has (only local ones get projected).
    var _mfAB = new THREE.Vector3(), _mfP = new THREE.Vector3(), _mfProj = new THREE.Vector3();
    function _segDistSq(H, A, B) {
      _mfAB.subVectors(B, A);
      var abl = _mfAB.lengthSq() || 1;
      var t = _mfP.subVectors(H, A).dot(_mfAB) / abl; t = t < 0 ? 0 : (t > 1 ? 1 : t);
      _mfP.copy(A).addScaledVector(_mfAB, t);
      return H.distanceToSquared(_mfP);
    }
    // Spatial hash over the extracted features so each pick only touches features
    // near the cursor (a 3.5M-tri model yields enormous edge counts; scanning all
    // of them per mousemove freezes the drag). Edges are rasterized into every
    // cell they cross so long edges are found from anywhere along them.
    function buildFeatureGrid() {
      modelFeatureGrid = null;
      if (!modelSnapVerts.length && !modelSnapEdges.length) return;
      var bb = new THREE.Box3();
      for (var i = 0; i < modelSnapVerts.length; i++) bb.expandByPoint(modelSnapVerts[i]);
      var diag = bb.getSize(new THREE.Vector3()).length() || 1;
      var cell = Math.max(diag / 256, 0.03);
      var min = bb.min.clone();
      var vgrid = new Map(), egrid = new Map();
      function push(map, k, idx) { var a = map.get(k); if (!a) { a = []; map.set(k, a); } a.push(idx); }
      function key(x, y, z) { return x + ',' + y + ',' + z; }
      for (var v = 0; v < modelSnapVerts.length; v++) {
        var p = modelSnapVerts[v];
        push(vgrid, key(Math.floor((p.x - min.x) / cell), Math.floor((p.y - min.y) / cell), Math.floor((p.z - min.z) / cell)), v);
      }
      for (var e = 0; e < modelSnapEdges.length; e++) {
        var A = modelSnapEdges[e][0], B = modelSnapEdges[e][1];
        var steps = Math.max(1, Math.ceil(A.distanceTo(B) / cell)), lastK = null;
        for (var s = 0; s <= steps; s++) {
          var t = s / steps;
          var k = key(Math.floor((A.x + (B.x - A.x) * t - min.x) / cell), Math.floor((A.y + (B.y - A.y) * t - min.y) / cell), Math.floor((A.z + (B.z - A.z) * t - min.z) / cell));
          if (k !== lastK) { push(egrid, k, e); lastK = k; }
        }
      }
      modelFeatureGrid = { cell: cell, min: min, vgrid: vgrid, egrid: egrid };
      console.log('[msnap] feature grid built: cell=' + cell.toFixed(3) + ' vcells=' + vgrid.size + ' ecells=' + egrid.size);
    }

    function modelFeatureNear(H, mousePixel) {
      if (!modelSnapVerts.length && !modelSnapEdges.length) return null;
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var dist = camera.position.distanceTo(H);
      var pr = Potree.Utils.projectedRadius(1, camera, dist, rect.width, rect.height);
      var r3d = pr > 1e-6 ? 30 / pr : dist * 0.05;   // world radius ≈ 30 px
      var r3d2 = r3d * r3d;
      var RV = 24, RE = 14, s, dx, dy, d;
      function scr(wp) { _mfProj.copy(wp).project(camera); return { x: (_mfProj.x * 0.5 + 0.5) * rect.width, y: (1 - (_mfProj.y * 0.5 + 0.5)) * rect.height }; }
      // Gather candidate indices from the grid cells around H (or all, pre-grid).
      var vCand = null, eCand = null, g = modelFeatureGrid;
      if (g) {
        vCand = new Set(); eCand = new Set();
        var rc = Math.min(8, Math.ceil(r3d / g.cell));
        var cx = Math.floor((H.x - g.min.x) / g.cell), cy = Math.floor((H.y - g.min.y) / g.cell), cz = Math.floor((H.z - g.min.z) / g.cell);
        for (var ax = -rc; ax <= rc; ax++) for (var ay = -rc; ay <= rc; ay++) for (var az = -rc; az <= rc; az++) {
          var k = (cx + ax) + ',' + (cy + ay) + ',' + (cz + az);
          var va = g.vgrid.get(k); if (va) for (var iv = 0; iv < va.length; iv++) vCand.add(va[iv]);
          var ea = g.egrid.get(k); if (ea) for (var ie = 0; ie < ea.length; ie++) eCand.add(ea[ie]);
        }
      }
      var bV = null, bVd = RV;
      function checkVert(idx) { var V = modelSnapVerts[idx]; if (V.distanceToSquared(H) > r3d2) return; s = scr(V); dx = s.x - mousePixel.x; dy = s.y - mousePixel.y; d = Math.sqrt(dx * dx + dy * dy); if (d < bVd) { bVd = d; bV = V; } }
      if (vCand) vCand.forEach(checkVert); else for (var i = 0; i < modelSnapVerts.length; i++) checkVert(i);
      if (bV) return { position: bV.clone(), label: 'model vertex' };
      var bEpos = null, bEd = RE;
      function checkEdge(idx) {
        var A = modelSnapEdges[idx][0], B = modelSnapEdges[idx][1];
        if (_segDistSq(H, A, B) > r3d2) return;
        var sa = scr(A), sb = scr(B), ex = sb.x - sa.x, ey = sb.y - sa.y, el2 = ex * ex + ey * ey;
        var t = el2 > 0 ? ((mousePixel.x - sa.x) * ex + (mousePixel.y - sa.y) * ey) / el2 : 0; t = t < 0 ? 0 : (t > 1 ? 1 : t);
        var qx = sa.x + ex * t, qy = sa.y + ey * t; dx = qx - mousePixel.x; dy = qy - mousePixel.y; d = Math.sqrt(dx * dx + dy * dy);
        if (d < bEd) { bEd = d; bEpos = A.clone().lerp(B, t); }
      }
      if (eCand) eCand.forEach(checkEdge); else for (var j = 0; j < modelSnapEdges.length; j++) checkEdge(j);
      if (bEpos) return { position: bEpos, label: 'model edge' };
      return null;
    }

    // Does a finalized measurement point sit on the model surface? (camera-ray test;
    // used to colour model points teal vs cloud points red.)
    function isPositionOnModel(pos) {
      if (!modelSnapMeshes.length) return false;
      var camera = viewer.scene.getActiveCamera();
      if (!camera) return false;
      if (!_modelRaycaster) _modelRaycaster = new THREE.Raycaster();
      var dir = pos.clone().sub(camera.position);
      var dist = dir.length();
      if (dist < 1e-6) return false;
      dir.multiplyScalar(1 / dist);
      _modelRaycaster.set(camera.position.clone(), dir);
      var hits = _modelRaycaster.intersectObjects(modelSnapMeshes, false);
      if (!hits.length) return false;
      return Math.abs(hits[0].distance - dist) < Math.max(0.03, dist * 0.01);
    }
    var MODEL_TEAL = 0x00e5ff;

    // -- Visual snap indicator: a white dot that jumps to the feature the next
    //    measurement click will grab. Lives in markerScene (renders on top). --
    var _snapTargetPos = null;
    var _snapTargetTime = 0;
    var _snapIndicator = (function () {
      var geo = new THREE.SphereGeometry(1, 16, 12);
      var mat = new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, depthWrite: false, transparent: true, opacity: 0.95 });
      var mesh = new THREE.Mesh(geo, mat);
      mesh.renderOrder = 99999;
      mesh.visible = false;
      markerScene.add(mesh);
      return mesh;
    })();
    // -- Hover indicator: a white dot shown while the cursor is over a draggable
    //    node's hit box (mark / member / constraint / dimension sphere) so the
    //    user knows they'll grab it, not orbit. Persistent while hovering. --
    var _hoverIndicatorPos = null;
    var _hoverIndicator = (function () {
      var geo = new THREE.SphereGeometry(1, 16, 12);
      var mat = new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false, depthWrite: false, transparent: true, opacity: 0.95 });
      var mesh = new THREE.Mesh(geo, mat);
      mesh.renderOrder = 99998;
      mesh.visible = false;
      markerScene.add(mesh);
      return mesh;
    })();
    var _hoverIndSize = new THREE.Vector2();
    viewer.addEventListener("render.pass.perspective_overlay", function () {
      if (!_hoverIndicator) return;
      _hoverIndicator.visible = !!_hoverIndicatorPos;
      if (!_hoverIndicatorPos) return;
      var cam = viewer.scene.getActiveCamera();
      _hoverIndicator.position.copy(_hoverIndicatorPos);
      var sz = viewer.renderer.getSize(_hoverIndSize);
      var dist = cam.position.distanceTo(_hoverIndicatorPos);
      var pr = Potree.Utils.projectedRadius(1, cam, dist, sz.x, sz.y);
      var s = pr > 0.0001 ? (6 / pr) : 0.05; // ~6 px radius — matches the node dot (like the snap indicator)
      _hoverIndicator.scale.set(s, s, s);
    });
    var _snapIndSize = new THREE.Vector2();
    viewer.addEventListener("render.pass.perspective_overlay", function () {
      if (!_snapIndicator) return;
      var show = _snapTargetPos && (performance.now() - _snapTargetTime) < 350;
      _snapIndicator.visible = !!show;
      if (!show) return;
      var cam = viewer.scene.getActiveCamera();
      _snapIndicator.position.copy(_snapTargetPos);
      var sz = viewer.renderer.getSize(_snapIndSize);

        g.hi.scale.setScalar(pr > 0.0001 ? (6 / pr) : 0.05);

    // -- Diagnostic: run __msInfo() in the console to check model snap state /
    //    whether the model and cloud overlap. --
    window.__msInfo = function () {
      var info = {
        models: models.map(function (m) { return { name: m.name, visible: m.visible }; }),

    // Potree scene is Z-up (raw LAS coords), so rotate +90° about X to map the
    // model's up axis to world +Z. The model was built directly on this scan with
    // origins untouched, so its coords already match — position stays at origin.
    const MODEL_X_ROTATION = Math.PI / 2;

    // =====================================================================
    // Model clipping — make loaded GLB models obey the SAME crop boxes that
    // clip the point cloud. Potree clips points in its point shader and never
    // touches THREE meshes, so the model used to persist outside the crop.
    // We inject Potree's box test into each model material via onBeforeCompile
    // and `discard` fragments that fall outside the active crop boxes. Mirrors
    // potree.js update() (clipBox = box.matrixWorld.invert()) and the point
    // shader test (inside == abs(local) <= 0.5; SHOW_INSIDE + INSIDE_ANY, or
    // INSIDE_ALL during plane-ortho view). Per-model toggle (rec.clipped,
    // default true); with no active crop box the model shows fully.

    var MODEL_CLIP_MAX = 8; // GLSL array size; live count varies via a uniform
    var _modelClipBoxes = (function () { var a = []; for (var k = 0; k < MODEL_CLIP_MAX; k++) a.push(new THREE.Matrix4()); return a; })();
    var modelClipUniforms = {
      count:  { value: 0 },
      method: { value: 0 },          // 0 = INSIDE_ANY, 1 = INSIDE_ALL
      boxes:  { value: _modelClipBoxes }
    };

    function refreshModelClipUniforms() {

        return v && v.clip === true && (v instanceof Potree.BoxVolume);
      });
      var n = Math.min(vols.length, MODEL_CLIP_MAX);

    function setModelClipped(rec, on) {

    function ensureModelLights() {
      if (modelLightsAdded) return;

      s.add(new THREE.AmbientLight(0xffffff, 0.7));
      const d1 = new THREE.DirectionalLight(0xffffff, 0.6); d1.position.set(1, 1, 2); s.add(d1);
      const d2 = new THREE.DirectionalLight(0xffffff, 0.4); d2.position.set(-1, -1, 1); s.add(d2);
      modelLightsAdded = true;
    }

    function prepModelMaterials(root) {

      // and its PBR export can be fully metallic (renders black without an env map).
      // Make materials double-sided and non-metallic so colors/textures show.
      root.traverse(function(obj) {
        if (!obj.isMesh || !obj.material) return;

    // A model record is a directory entry; group === null until the user loads it.

      var rec = { name: name, url: url, fromFile: !!fromFile, group: null, visible: false, loading: false, clipped: true };
      models.push(rec);
      return rec;
    }

    function displayLoadedGroup(rec, scene3d) {

      group.name = 'EnableModel:' + rec.name;

    }

    function setModelVisible(rec, vis) {

      rec.visible = !!vis;
      rec.group.visible = !!vis;

      rebuildModelFeatures();
      buildFeatureGrid();
      rebuildEdgeLines();

      rebuildModelFeatures();
      buildFeatureGrid();
      rebuildEdgeLines();
      updateModelsPanel();

    // Manual load via the panel's file picker.
    function loadModelFile(file) {
      if (!file) return;
      var rec = addModelEntry(file.name.replace(/\.(glb|gltf)$/i, ''), URL.createObjectURL(file), true);
      loadModelRec(rec);
    }

    // Discover the project's models/ folder (lists, does NOT load — the user loads
    // on demand). Folder: <root>/pointclouds/<x> -> <root>/models
    function discoverProjectModels() {
      var root = meta.folder.replace(/\/+$/, '').replace(/\/pointclouds\/[^/]*$/, '');
      var modelsURL = root + '/models';
      fetch(modelsURL + '/').then(function(r) { return r.ok ? r.text() : Promise.reject(); })
        .then(function(html) {
          var files = [], re = /href="([^"?]+\.glb)"/gi, m;
          while ((m = re.exec(html))) { var f = decodeURIComponent(m[1].split('/').pop()); if (f && files.indexOf(f) === -1) files.push(f); }

        })
        .then(function(list) {
          if (!list || !list.length) { console.log('[models] none in', modelsURL); return; }
          list.forEach(function(item) {
            var file = typeof item === 'string' ? item : item.file;

    // =====================================================================
    // Multi-scan support — load >1 point cloud and view/hide each from the

    function _cloudMetaFor(folder) {

      return null;
    }

    // The primary cloud is already loaded by the main flow; register it here.

          rebalanceScanBudgets();

        }).catch(function (err) { console.warn('[scans] failed to load', cm.id, err); });
      });
    }

    function setScanVisible(idx, vis) {
      var s = scanClouds[idx];
      if (!s || !s.pc) return;
      s.visible = vis;
      s.pc.visible = vis;
      updateScansPanel();
      rebalanceScanBudgets();
    }

    // Inline SVG string for a context-panel group title, using the shared
    // Lucide subset (window.DEV2_ICONS holds each icon's inner shapes). Matches
    // the left toolbar's 14px stroked icons so the group headers feel native.
    function _cpIcon(name) {
      var inner = (window.DEV2_ICONS && window.DEV2_ICONS[name]) || '';
      return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
             'stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
    }

    function ensureScansPanel() {
      var p = document.getElementById('enable-scans-panel');
      if (!p) {
        p = document.createElement('div');
        p.id = 'enable-scans-panel';
        document.body.appendChild(p); // chrome.js reparents this into the context panel
      }
      return p;
    }

    function updateScansPanel() {
      var p = ensureScansPanel();
      // Always show the Scans panel: it hosts the point-cloud opacity slider on
      // every project. The per-cloud show/hide list only appears when there is
      // more than one cloud. When it is slider-only (<=1 cloud) flag it so
      // chrome.js does not auto-open the context panel just for the slider.

      var multi = scanClouds.length > 1;

      // "inside" it. Drives viewer.edlOpacity (the EDL composite blends the
      // point-cloud image over the already-rendered model, depth-tested — so
      // points in front of the model fade while points behind stay occluded).
      var _pcOpacityPct = Math.round(_pcOpacityLogical * 100);
      // With focus boxes active this slider is the "outside focus" opacity (the
      // bulk of the cloud), routed through the dithered-discard shader path.
      var _opacityLabel = (typeof focusBoxes !== 'undefined' && focusBoxes.length > 0)
        ? 'Point cloud opacity (outside focus)' : 'Point cloud opacity';
      var html =
        '<div class="enable-cp-title">' + _cpIcon('layers') + '<span>Scans</span></div>' +
        '<div style="margin:2px 0 10px">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;font-size:12px;opacity:0.85;margin-bottom:3px">' +
            '<span>' + _opacityLabel + '</span><span id="pc-opacity-val">' + _pcOpacityPct + '%</span>' +
          '</div>' +
          '<input type="range" id="pc-opacity-slider" min="0" max="100" value="' + _pcOpacityPct + '" style="width:100%">' +
        '</div>';
      // Focus-box pick restriction toggle — only relevant while a focus box exists.
      if (typeof focusBoxes !== 'undefined' && focusBoxes.length > 0) {
        html +=
          '<label style="display:flex;align-items:center;gap:8px;font-size:12px;opacity:0.9;margin:-4px 0 10px;cursor:pointer" ' +
          'title="Off (default): with a focus box active you cannot pick or snap onto points OUTSIDE it, for every tool, no matter their opacity. On: allow picking outside the focus box.">' +
            '<input type="checkbox" id="focus-snap-outside"' + (_focusSnapOutside ? ' checked' : '') + '>' +
            '<span>Snap/select outside focus</span>' +
          '</label>';
      }
      if (multi) {
        for (var i = 0; i < scanClouds.length; i++) {
          var s = scanClouds[i];
          html += '<div class="enable-scans-row">' +
            '<span title="' + s.name + '">' + s.name + '</span>' +

            '</div>';
        }
      }
      p.innerHTML = html;
      var os = p.querySelector('#pc-opacity-slider');
      if (os) os.addEventListener('input', function () {
        var v = Math.max(0, Math.min(100, +this.value));
        _pcOpacityLogical = v / 100;   // single source of truth for outside opacity
        applyGlobalOpacity();          // routes to edlOpacity OR dithered-outside
        var lbl = p.querySelector('#pc-opacity-val');
        if (lbl) lbl.textContent = v + '%';

      var btns = p.querySelectorAll('.enable-scan-eye');

        });

    // -- Speed lock: let user override auto-speed via slider, with reset button --
    var SPEED_MAX = 7;
    function setupSpeedLock() {
      var sld = document.getElementById('sldMoveSpeed');
      if (!sld) { setTimeout(setupSpeedLock, 200); return; }

      // Set our auto-speed cap
      viewer._autoSpeedMax = SPEED_MAX;

      // Reconfigure slider: linear 0–SPEED_MAX instead of Potree's exponential 0–10001
      $(sld).slider('destroy');
      $(sld).slider({
        value: viewer.getMoveSpeed(),
        min: 0,
        max: SPEED_MAX,
        step: 0.1,
        slide: function(event, ui) {
          viewer._speedLocked = true;
          viewer.setMoveSpeed(ui.value);
        }
      });

      // Keep slider + label in sync when speed changes (auto or manual)
      var lbl = document.getElementById('lblMoveSpeed');
      viewer.addEventListener('move_speed_changed', function() {
        var speed = viewer.getMoveSpeed();
        if (lbl) lbl.textContent = speed.toFixed(1);
        $(sld).slider('value', speed);
      });
      if (lbl) lbl.textContent = viewer.getMoveSpeed().toFixed(1);
