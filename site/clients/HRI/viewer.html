    // -- Delete a constraint --
    function deleteConstraint(id) {
      var idx = -1;
      for (var i = 0; i < constraints.length; i++) {
        if (constraints[i].id === id) { idx = i; break; }
      }
      if (idx === -1) return;
      var c = constraints[idx];
      if (c.visual) {
        c.visual.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) obj.material.dispose();
        });
        constraintScene.remove(c.visual);
      }
      _disposePlaneFill(c);
      if (activeConstraintId === id) activeConstraintId = null;
      if (selectedConstraintId === id) selectedConstraintId = null;
      if (_normDimRefId === id) { _normDimMode = false; _normDimArmed = false; _normDimRefId = null; _disposeNormPreview(); }
      constraints.splice(idx, 1);
      rebuildConstraintList();
      updateConstraintVisuals();
    }

    // -- Update constraint status display --
    function updateConstraintStatus() {
      var el = document.getElementById('enable-constraint-status');
      if (!el) return;
      // Normal-dimension mode is independent of binding (its own plane ref), so
      // surface it in both branches.
      var normRef = _normDimMode
        ? constraints.find(function(cc) { return cc.id === _normDimRefId; })
        : null;
      var normLabel = normRef ? ('Norm dim ON (' + normRef.name + ')' + (_normDimArmed ? ' — measuring' : ' — paused')) : '';
      var normTxt = normLabel ? ' | ' + normLabel : '';
      if (!activeConstraintId) {
        var orphanBits = [];
        if (_orthoMeasureMode) orphanBits.push('Ortho ON');
        if (_orthoParallelMode) orphanBits.push('Parallel ON');
        var orphanTxt = orphanBits.length ? orphanBits.join(', ') + ' (no plane active — inactive)' : '';
        el.textContent = (orphanTxt + (normLabel ? (orphanTxt ? ' ' : '') + normLabel : '')).trim();
        return;
      }
      var c = null;
      for (var i = 0; i < constraints.length; i++) {
        if (constraints[i].id === activeConstraintId) { c = constraints[i]; break; }
      }
      if (c) {
        var txt = c.name + ' constraint active';
        if (c.type === 'plane' && c.basis) {
          if (_orthoMeasureMode) txt += ' | Ortho ON (' + (_orthoParallelMode ? 'X/Y/Z' : 'X/Y') + ')';
          if (_orthoParallelMode) txt += ' | Parallel';
        }
        el.textContent = txt + normTxt;
      }
    }

    // -- Find nearest definition point to mouse (screen-space hit test) --
    function findNearestDefinitionPoint(mousePixel) {
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = 14; // pixel threshold
      var bestResult = null;
      for (var ci = 0; ci < constraints.length; ci++) {
        var c = constraints[ci];
        if (c.locked) continue;
        for (var pi = 0; pi < c.points.length; pi++) {
          var pt = c.points[pi].clone().project(camera);
          var screenX = (pt.x * 0.5 + 0.5) * rect.width;
          var screenY = (1 - (pt.y * 0.5 + 0.5)) * rect.height;
          var dx = screenX - mousePixel.x;
          var dy = screenY - mousePixel.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < bestDist) {
            bestDist = dist;
            bestResult = { constraint: c, pointIndex: pi };
          }
        }
      }
      return bestResult;
    }

    // -- Find nearest plane stretch handle to mouse (unlocked planes only) --
    function findNearestPlaneHandle(mousePixel) {
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = 14; // pixel threshold
      var bestResult = null;
      for (var ci = 0; ci < constraints.length; ci++) {
        var c = constraints[ci];
        if (c.type !== 'plane' || c.visible === false || !c.visual) continue;
        if (c.id !== selectedConstraintId) continue; // handles only on the selected plane
        c.visual.traverse(function(obj) {
          if (!obj.userData || !obj.userData.isPlaneStretchHandle) return;
          var wp = obj.getWorldPosition(new THREE.Vector3()).project(camera);
          if (wp.z < -1 || wp.z > 1) return;
          var sx = (wp.x * 0.5 + 0.5) * rect.width;
          var sy = (1 - (wp.y * 0.5 + 0.5)) * rect.height;
          var dx = sx - mousePixel.x, dy = sy - mousePixel.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < bestDist) {
            bestDist = dist;
            bestResult = { constraint: c, edge: obj.userData.handleEdge };
          }
        });
      }
      return bestResult;
    }

    // -- Raycast the plane quads; return the nearest plane constraint hit (or null) --
    function pickPlaneConstraintAt(mousePixel) {
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var ndc = new THREE.Vector2(
        (mousePixel.x / rect.width) * 2 - 1,
        -(mousePixel.y / rect.height) * 2 + 1
      );
      var ray = new THREE.Raycaster();
      ray.setFromCamera(ndc, camera);
      var best = null, bestDist = Infinity;
      for (var ci = 0; ci < constraints.length; ci++) {
        var c = constraints[ci];
        if (c.type !== 'plane' || c.visible === false || !c._fillMesh) continue;
        var hits = ray.intersectObjects([c._fillMesh], false);
        if (hits.length && hits[0].distance < bestDist) {
          bestDist = hits[0].distance;
          best = c;
        }
      }
      return best;
    }

    // -- Find nearest X-axis pick marker to mouse (during plane-x-axis pick) --
    function findNearestXAxisPickMarker(mousePixel) {
      if (constraintPickType !== 'plane-x-axis') return -1;
      if (!constraintPickMarkers.length) return -1;
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = 25;
      var bestIdx = -1;
      for (var i = 0; i < constraintPickMarkers.length; i++) {
        var pt = constraintPickMarkers[i].position.clone().project(camera);
        var sx = (pt.x * 0.5 + 0.5) * rect.width;
        var sy = (1 - (pt.y * 0.5 + 0.5)) * rect.height;
        var dx = sx - mousePixel.x, dy = sy - mousePixel.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      }
      return bestIdx;
    }

    // -- Recompute constraint geometry after a point is moved --
    function recomputeConstraint(c) {
      if (c.type === 'plane') {
        var pts = c.points;
        if (pts.length === 2 && c.perpRef && c.perpCycle != null) {
          // Cycled perp plane: orientation comes from the cycle state; the points
          // only set the anchor. Centroid = midpoint, then re-apply the cycle.
          c.centroid = new THREE.Vector3().addVectors(pts[0], pts[1]).multiplyScalar(0.5);
          applyPerpCycle(c);
        } else if (pts.length === 2 && c.perpRefNormal) {
          // Legacy 2-point perp: re-derive from the 2 points + snapshot ref normal.
          var ld = new THREE.Vector3().subVectors(pts[1], pts[0]);
          if (ld.length() < 1e-4) return false;
          ld.normalize();
          var rn = c.perpRefNormal.clone().normalize();
          var pn = new THREE.Vector3().crossVectors(ld, rn);
          if (pn.length() < 1e-4) return false;
          pn.normalize();
          c.normal = pn;
          c.centroid = new THREE.Vector3().addVectors(pts[0], pts[1]).multiplyScalar(0.5);
          c.plane = new THREE.Plane().setFromNormalAndCoplanarPoint(pn, c.centroid);
          c.xAxisAnchorA = pts[0].clone();
          c.xAxisAnchorB = pts[1].clone();
          c.xAxisCamUp = rn;
          c.basis = computePlaneBasis(c);
        } else if (pts.length === 3) {
          var v1 = new THREE.Vector3().subVectors(pts[1], pts[0]);
          var v2 = new THREE.Vector3().subVectors(pts[2], pts[0]);
          var normal = new THREE.Vector3().crossVectors(v1, v2);
          if (normal.length() < 0.001) return false;
          normal.normalize();
          c.normal = normal;
          c.plane = new THREE.Plane();
          c.plane.setFromNormalAndCoplanarPoint(normal, pts[0]);
          c.centroid = new THREE.Vector3().add(pts[0]).add(pts[1]).add(pts[2]).divideScalar(3);
        } else if (pts.length > 3) {
          // Re-fit plane from all points
          var centroid = new THREE.Vector3();
          for (var i = 0; i < pts.length; i++) centroid.add(pts[i]);
          centroid.divideScalar(pts.length);
          var xx = 0, xy = 0, xz = 0, yy = 0, yz = 0, zz = 0;
          for (var i = 0; i < pts.length; i++) {
            var dx = pts[i].x - centroid.x, dy = pts[i].y - centroid.y, dz = pts[i].z - centroid.z;
            xx += dx * dx; xy += dx * dy; xz += dx * dz;
            yy += dy * dy; yz += dy * dz; zz += dz * dz;
          }
          var det2 = function(a, b, cd, d) { return a * d - b * cd; };
          var candidates = [
            new THREE.Vector3(det2(xy, xz, yy, yz), det2(xz, xx, yz, xy), det2(xx, xy, xy, yy)),
            new THREE.Vector3(det2(yy, yz, xy, xz), det2(yz, xy, xz, xx), det2(xy, yy, xx, xy)),
            new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 1)
          ];
          var bestNormal = null, bestVar = Infinity;
          for (var ci2 = 0; ci2 < candidates.length; ci2++) {
            var n = candidates[ci2];
            if (n.length() < 0.0001) continue;
            n.normalize();
            var v = 0;
            for (var i = 0; i < pts.length; i++) {
              var d = (pts[i].x - centroid.x) * n.x + (pts[i].y - centroid.y) * n.y + (pts[i].z - centroid.z) * n.z;
              v += d * d;
            }
            if (v < bestVar) { bestVar = v; bestNormal = n.clone(); }
          }
          if (!bestNormal) return false;
          c.normal = bestNormal;
          c.centroid = centroid;
          c.plane = new THREE.Plane();
          c.plane.setFromNormalAndCoplanarPoint(bestNormal, centroid);
        } else {
          return false; // fewer than 3 points
        }
      } else if (c.type === 'axis') {
        var dir = new THREE.Vector3().subVectors(c.points[1], c.points[0]);
        if (dir.length() < 0.001) return false;
        dir.normalize();
        c.direction = dir;
        c.origin = c.points[0].clone();
      }
      // Refresh plane basis (anchors are world-space; reproject onto new plane).
      if (c.type === 'plane') c.basis = computePlaneBasis(c);
      return true;
    }

    // Dispose a plane's depth-correct fill mesh (lives in viewer.scene.scene, not
    // the constraint group). Call wherever c.visual is disposed.
    function _disposePlaneFill(c) {
      if (c && c._fillMesh) {
        planeFillScene.remove(c._fillMesh);
        if (c._fillMesh.geometry) c._fillMesh.geometry.dispose();
        if (c._fillMesh.material) c._fillMesh.material.dispose();
        c._fillMesh = null;
      }
    }

    // -- Rebuild visual for a single constraint (dispose old, build new) --
    function rebuildConstraintVisual(c) {
      if (c.visual) {
        c.visual.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) obj.material.dispose();
        });
        constraintScene.remove(c.visual);
        c.visual = null;
      }
      _disposePlaneFill(c);
      buildConstraintVisual(c);
    }

    // ===== PERPENDICULAR-PLANE ORIENTATION CYCLE =====
    // A perp plane can step through 5 preset orientations, all pivoting on its
    // placement point. States 0/1 stay perpendicular to the reference plane
    // (aligned to its X / Y axes); states 2/3/4 use GLOBAL Z directly (world is
    // Z-up here) — horizontal, and two true-vertical planes facing the
    // reference's X / Y horizontal directions. Orientation is derived from the
    // reference-basis snapshot (c.perpRef) + c.perpCycle, NOT from the points —
    // so dragging a point translates the anchor without changing orientation.
    // Plain-language names: "Perpendicular" = square to the reference surface
    // (two ways, along its X / Y); "Level" = world-horizontal; "Plumb" =
    // world-vertical (two ways, along the reference's X / Y directions).
    var PERP_STATE_NAMES = [
      'Perpendicular (X)',
      'Perpendicular (Y)',
      'Level',
      'Plumb (X)',
      'Plumb (Y)'
    ];
    var PERP_STATE_COUNT = 5;

    // Orthonormal right-handed basis {X,Y,Z} from a desired normal (Z) and a
    // preferred in-plane X (Gram-Schmidt; falls back if preferX ∥ normal).
    function _orthoBasis(normal, preferX) {
      var Z = normal.clone(); if (Z.length() < 1e-6) Z.set(0, 0, 1); Z.normalize();
      var X = preferX.clone();
      X.addScaledVector(Z, -X.dot(Z));
      if (X.length() < 1e-6) {
        X.copy(Math.abs(Z.z) < 0.9 ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(1, 0, 0));
        X.addScaledVector(Z, -X.dot(Z));
      }
      X.normalize();
      var Y = new THREE.Vector3().crossVectors(Z, X).normalize();
      return { X: X, Y: Y, Z: Z };
    }

    // Compute the {X,Y,Z} basis for a perp plane's cycle state from the
    // reference-basis snapshot ref = {X,Y,N}.
    function _perpBasisForState(ref, state) {
      var worldZ = new THREE.Vector3(0, 0, 1);
      var X = ref.X.clone().normalize();
      var Y = ref.Y.clone().normalize();
      var N = ref.N.clone().normalize();
      function horiz(v) { var h = v.clone(); h.z = 0; return (h.length() < 1e-4) ? null : h.normalize(); }
      var normal, preferX;
      // Two horizontal directions 90° apart: H1 = reference X horizontalized,
      // H2 ⊥ H1. States 3 & 4 are two DIFFERENT vertical (plumb) planes 90°
      // apart — one running along H1, one along H2 — so cycling between them
      // genuinely rotates the plane 90° about global Z. Both keep Y = world up.
      var H1 = horiz(X) || horiz(Y) || new THREE.Vector3(1, 0, 0);
      var H2 = new THREE.Vector3().crossVectors(worldZ, H1);
      if (H2.length() < 1e-4) H2.set(0, 1, 0); else H2.normalize();
      if (state === 0) { normal = new THREE.Vector3().crossVectors(X, N); preferX = X; }
      else if (state === 1) { normal = new THREE.Vector3().crossVectors(Y, N); preferX = Y; }
      else if (state === 2) { normal = worldZ.clone(); preferX = H1.clone(); }
      else if (state === 3) { normal = new THREE.Vector3().crossVectors(H1, worldZ); preferX = H1.clone(); }
      else { normal = new THREE.Vector3().crossVectors(H2, worldZ); preferX = H2.clone(); }
      if (normal.length() < 1e-4) normal = worldZ.clone();
      return _orthoBasis(normal, preferX);
    }

    // Apply the current cycle state's orientation to a perp plane: sets normal /
    // plane / basis from perpRef+perpCycle and repositions the 2 def-points
    // symmetric about the centroid along the new local X (preserving size).
    function applyPerpCycle(c) {
      if (!c.perpRef || c.perpCycle == null) return;
      var half = (c.points && c.points.length === 2) ? 0.5 * c.points[0].distanceTo(c.points[1]) : 1;
      if (!(half > 0.05)) half = 1;
      if (!c.centroid) c.centroid = new THREE.Vector3();
      var b = _perpBasisForState(c.perpRef, c.perpCycle);
      c.normal = b.Z.clone();
      c.plane = new THREE.Plane().setFromNormalAndCoplanarPoint(c.normal, c.centroid);
      c.basis = { X: b.X.clone(), Y: b.Y.clone(), Z: b.Z.clone(), origin: c.centroid.clone() };
      c.points = [
        c.centroid.clone().addScaledVector(b.X, -half),
        c.centroid.clone().addScaledVector(b.X, half)
      ];
      c.xAxisAnchorA = c.points[0].clone();
      c.xAxisAnchorB = c.points[1].clone();
      c.xAxisCamUp = b.Y.clone();
    }

    // Translate a cycled perp plane so its dragged point follows the cursor,
    // keeping the cycled orientation and size fixed.
    function translatePerpPlane(c, idx, newLoc) {
      var half = 0.5 * c.points[0].distanceTo(c.points[1]);
      if (!(half > 0.05)) half = 1;
      var X = c.basis.X.clone();
      var sign = (idx === 1) ? 1 : -1;
      var centroid = newLoc.clone().addScaledVector(X, -sign * half);
      c.centroid = centroid;
      c.plane = new THREE.Plane().setFromNormalAndCoplanarPoint(c.normal, centroid);
      c.basis.origin = centroid.clone();
      c.points = [ centroid.clone().addScaledVector(X, -half), centroid.clone().addScaledVector(X, half) ];
      c.xAxisAnchorA = c.points[0].clone();
      c.xAxisAnchorB = c.points[1].clone();
    }

    // Advance a perp plane to the next of the 5 cycle orientations. The user's
    // stretch (rectExtent) is snapshotted and restored so cycling never resets
    // the plane's size back to the insertion square.
    function rotatePerpPlaneCycle(c) {
      if (!c || !c.perpRef || c.perpCycle == null || !c.points || c.points.length < 2) return;
      var before = _snapshotPlane(c);
      var savedExtent = c.rectExtent ? {
        xMin: c.rectExtent.xMin, xMax: c.rectExtent.xMax,
        yMin: c.rectExtent.yMin, yMax: c.rectExtent.yMax
      } : null;
      c.perpCycle = (c.perpCycle + 1) % PERP_STATE_COUNT;
      applyPerpCycle(c);
      if (savedExtent) c.rectExtent = savedExtent; // keep the current stretch
      rebuildConstraintVisual(c);
      _pushPlaneEdit('cycle ' + c.name, c, before);
      showToast(c.name + ': ' + PERP_STATE_NAMES[c.perpCycle] + ' (' + (c.perpCycle + 1) + '/' + PERP_STATE_COUNT + ')', 2000);
    }

    // ===== MOVE / COPY A PLANE ALONG ITS NORMAL =====
    // Rigidly translate a plane constraint by a world vector (all points +
    // centroid + anchors), then recompute so orientation is preserved.
    function _translatePlane(c, vec) {
      for (var i = 0; i < c.points.length; i++) c.points[i].add(vec);
      if (c.centroid) c.centroid.add(vec);
      if (c.xAxisAnchorA) c.xAxisAnchorA.add(vec);
      if (c.xAxisAnchorB) c.xAxisAnchorB.add(vec);
      if (recomputeConstraint(c)) rebuildConstraintVisual(c);
      else rebuildConstraintVisual(c);
    }

    // Deep-clone a plane constraint (new id/name), build + register it.
    function duplicatePlane(c) {
      var nc = {
        id: nextConstraintId++,
        type: c.type,
        name: c.name + ' copy',
        normal: c.normal.clone(),
        centroid: c.centroid.clone(),
        points: c.points.map(function(p) { return p.clone(); }),
        plane: new THREE.Plane().copy(c.plane),
        visual: null,
        visible: true,
        locked: c.locked
      };
      if (c.rectExtent) nc.rectExtent = { xMin: c.rectExtent.xMin, xMax: c.rectExtent.xMax, yMin: c.rectExtent.yMin, yMax: c.rectExtent.yMax };
      if (c.xAxisAnchorA) nc.xAxisAnchorA = c.xAxisAnchorA.clone();
      if (c.xAxisAnchorB) nc.xAxisAnchorB = c.xAxisAnchorB.clone();
      if (c.xAxisCamUp) nc.xAxisCamUp = c.xAxisCamUp.clone();
      if (c.perpRefNormal) nc.perpRefNormal = c.perpRefNormal.clone();
      if (c.perpRef) nc.perpRef = { X: c.perpRef.X.clone(), Y: c.perpRef.Y.clone(), N: c.perpRef.N.clone() };
      if (c.perpCycle != null) nc.perpCycle = c.perpCycle;
      nc.basis = c.basis
        ? { X: c.basis.X.clone(), Y: c.basis.Y.clone(), Z: c.basis.Z.clone(), origin: c.basis.origin.clone() }
        : computePlaneBasis(nc);
      buildConstraintVisual(nc);
      constraints.push(nc);
      rebuildConstraintList();
      return nc;
    }

    // Offset a plane by a signed distance (metres) along its normal. doCopy →
    // leave the original and offset a duplicate instead.
    function offsetPlaneAlongNormal(c, signedMeters, doCopy) {
      if (!c || c.type !== 'plane') return;
      var vec = c.normal.clone().normalize().multiplyScalar(signedMeters);
      if (doCopy) {
        var target = duplicatePlane(c);
        _translatePlane(target, vec);
        selectConstraint(target.id);
        pushUndoCmd(_cmdAddConstraint(target)); // undo removes the copy
      } else {
        var before = _snapshotPlane(c);
        _translatePlane(c, vec);
        _pushPlaneEdit('move ' + c.name, c, before);
      }
      showToast((doCopy ? 'Copied ' : 'Moved ') + c.name + ' ' + fmtLen(Math.abs(signedMeters)) + ' along normal');
    }

    // Move/copy a plane so it lands at a picked point, plus an extra signed
    // distance from that point along the normal (Tekla reference+distance).
    function movePlaneToPoint(c, worldPoint, extraMeters, doCopy) {
      if (!c || c.type !== 'plane') return;
      var n = c.normal.clone().normalize();
      var signedToPoint = new THREE.Vector3().subVectors(worldPoint, c.centroid).dot(n);
      offsetPlaneAlongNormal(c, signedToPoint + (extraMeters || 0), doCopy);
    }

    // Begin a one-shot "move/copy to point" pick for a plane.
    function startPlaneMovePick(planeId, doCopy) {
      if (MARK_MODE) toggleMarkMode(true);
      if (memberPickMode) cancelMemberPick();
      if (constraintPickMode) cancelConstraintPick();
      if (_normDimArmed) { _normDimArmed = false; _disposeNormPreview(); }
      cancelPotreeInsertion();
      _planeMovePick = { planeId: planeId, doCopy: !!doCopy };
      document.body.classList.add('constraint-pick-mode'); // crosshair cue
      showToast((doCopy ? 'Copy' : 'Move') + ' to point — click a cloud point' +
        (_planeMoveMeters ? (' (plane will sit ' + fmtLen(Math.abs(_planeMoveMeters)) + ' from it)') : ' (plane passes through it)') +
        '. Esc to cancel.', 5000);
    }
    function cancelPlaneMovePick() {
      _planeMovePick = null;
      document.body.classList.remove('constraint-pick-mode');
    }

    // -- Plane ortho depth slab state --
    var planeOrthoSlab = null;       // the BoxVolume used as depth slab
    var planeOrthoConstraint = null; // which constraint is active for ortho

    // -- Switch to orthographic view aligned to a plane constraint --
    function viewPlaneOrtho(c) {
      if (c.type !== 'plane') return;

      // Switch to orthographic camera mode
      viewer.setCameraMode(Potree.CameraMode.ORTHOGRAPHIC);

      // Position the camera along the plane normal, looking at the centroid.
      // Potree's render loop drives cameras from scene.view (yaw/pitch/position),
      // so we must set view — not camera — properties.
      var normal = c.normal.clone();
      var distance = viewer.scene.view.radius || 50;
      if (distance < 1) distance = 50;

      // Camera position: offset from centroid along the normal
      var camPos = c.centroid.clone().addScaledVector(normal, distance);
      viewer.scene.view.position.copy(camPos);
      viewer.scene.view.lookAt(c.centroid);

      // Create/update depth slab clip box
      planeOrthoConstraint = c;
      createOrUpdateDepthSlab(c, 20, 20);

      // Show depth controls UI
      showDepthControls(c);

      showToast('Ortho view: ' + c.name);
    }

    // -- Create or update the depth slab clip box --
    function createOrUpdateDepthSlab(c, behindMM, frontMM) {
      // Convert mm to scene units (assume metres)
      var behind = behindMM / 1000;
      var front = frontMM / 1000;
      var thickness = behind + front; // total depth
      if (thickness < 0.001) thickness = 0.001;

      // Slab center: offset from plane centroid along normal.
      // "front" is in the normal direction, "behind" is opposite.
      var offset = (front - behind) / 2;
      var center = c.centroid.clone().addScaledVector(c.normal, offset);

      // Orientation: rotate local Y axis to align with plane normal.
      // BoxVolume is a unit cube; scale.y controls thickness along local Y.
      var quat = new THREE.Quaternion().setFromUnitVectors(
        new THREE.Vector3(0, 1, 0), c.normal
      );

      // Lateral size: huge so it doesn't clip laterally
      var lateralSize = 10000;

      if (!planeOrthoSlab) {
        planeOrthoSlab = new Potree.BoxVolume();
        planeOrthoSlab.clip = true;
        planeOrthoSlab.name = 'Plane Depth Slab';
        planeOrthoSlab.visible = true;
        planeOrthoSlab.userData = planeOrthoSlab.userData || {};
        planeOrthoSlab.userData.persistent = true;
        planeOrthoSlab.userData.isDepthSlab = true;
        // Hide the green box visual
        planeOrthoSlab.box.visible = false;
        planeOrthoSlab.frame.visible = false;
        if (planeOrthoSlab.label) planeOrthoSlab.label.visible = false;

        viewer.scene.addVolume(planeOrthoSlab);
        // Switch to INSIDE_ALL so both the main crop box and slab must pass
        viewer.setClipMethod(Potree.ClipMethod.INSIDE_ALL);
      }

      planeOrthoSlab.position.copy(center);
      planeOrthoSlab.quaternion.copy(quat);
      planeOrthoSlab.scale.set(lateralSize, thickness, lateralSize);
      planeOrthoSlab.updateMatrixWorld(true);
      if (typeof planeOrthoSlab.update === 'function') planeOrthoSlab.update();
    }

    // -- Remove the depth slab and restore clip method --
    function removeDepthSlab() {
      if (planeOrthoSlab) {
        // Temporarily allow removal of our persistent slab
        planeOrthoSlab.userData.persistent = false;
        viewer.scene.removeVolume(planeOrthoSlab);
        planeOrthoSlab = null;
      }
      planeOrthoConstraint = null;
      // Restore to INSIDE_ANY (original mode)
      viewer.setClipMethod(Potree.ClipMethod.INSIDE_ANY);
      hideDepthControls();
    }

    // -- Show depth controls UI in sidebar --
    function showDepthControls(c) {
      hideDepthControls();
      var container = document.getElementById('enable-constraint-list');
      if (!container) return;

      var div = document.createElement('div');
      div.id = 'enable-plane-depth-controls';

      div.innerHTML =
        '<div class="depth-title">\u2316 ' + c.name + ' \u2014 Depth Slab</div>' +
        '<div class="depth-row">' +
          '<label>Behind:</label>' +
          '<input type="number" id="depth-behind" value="20" step="5" min="0">' +
          '<span class="unit">mm</span>' +
        '</div>' +
        '<div class="depth-row">' +
          '<label>In front:</label>' +
          '<input type="number" id="depth-front" value="20" step="5" min="0">' +
          '<span class="unit">mm</span>' +
        '</div>' +
        '<button id="btn-exit-plane-ortho">Exit Plane View</button>';

      container.parentNode.insertBefore(div, container.nextSibling);

      // Wire up live updating
      var behindInput = document.getElementById('depth-behind');
      var frontInput = document.getElementById('depth-front');

      function onDepthChange() {
        var behind = parseFloat(behindInput.value) || 0;
        var front = parseFloat(frontInput.value) || 0;
        if (behind < 0) behind = 0;
        if (front < 0) front = 0;
        if (planeOrthoConstraint) {
          createOrUpdateDepthSlab(planeOrthoConstraint, behind, front);
        }
      }
      behindInput.addEventListener('input', onDepthChange);
      frontInput.addEventListener('input', onDepthChange);

      document.getElementById('btn-exit-plane-ortho').addEventListener('click', function() {
        exitPlaneOrtho();
      });
    }

    // -- Hide depth controls UI --
    function hideDepthControls() {
      var el = document.getElementById('enable-plane-depth-controls');
      if (el) el.remove();
    }

    // -- Exit plane ortho mode: remove slab, switch back to perspective --
    function exitPlaneOrtho() {
      removeDepthSlab();
      viewer.setCameraMode(Potree.CameraMode.PERSPECTIVE);
      showToast('Exited plane view');
    }

    // ===== MEMBER SKETCHING FUNCTIONS =====

    // -- Start member pick mode --
    function startMemberPick() {
      if (MARK_MODE) toggleMarkMode(true);
      if (constraintPickMode) cancelConstraintPick();
      memberPickMode = true;
      memberPickPoints = [];
      clearMemberPickMarkers();
      _ensureMemberPreviewSphere();
      document.body.classList.add('member-pick-mode');
      showToast('Pick endpoint (1/2) for member', 5000);
      var btn = document.getElementById('btn-add-member');
      if (btn) btn.classList.add('active');
    }

    // -- Handle a picked point during member definition --
    function handleMemberPick(position) {
      memberPickPoints.push(position.clone());
      placeMemberPickMarker(position);
      (function(pos) {
        pushUndoCmd({ label: 'member pick', tag: 'member-point',
          undo: function(){
            if (memberPickMode && memberPickPoints.length > 0) {
              memberPickPoints.pop();
              if (memberPickMarkers.length > 0) {
                var mk = memberPickMarkers.pop();
                mk.traverse(function(o){ if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose(); });
                memberScene.remove(mk);
              }
              if (memberPickPoints.length === 0) cancelMemberPick();
            }
          },
          redo: function(){ if (memberPickMode) { memberPickPoints.push(pos.clone()); placeMemberPickMarker(pos); } } });
      })(position.clone());
      if (memberPickPoints.length < 2) {
        _startMemberRubberLine(position);
        showToast('Pick endpoint (2/2) for member', 5000);
      } else {
        finalizeMember();
      }
    }

    // -- Cancel member pick mode --
    function cancelMemberPick() {
      memberPickMode = false;
      memberPickPoints = [];
      clearMemberPickMarkers();
      clearMemberPreview();
      document.body.classList.remove('member-pick-mode');
      var btn = document.getElementById('btn-add-member');
      if (btn) btn.classList.remove('active');
      showToast('Member picking cancelled');
    }

    // -- Place temporary orange marker during member picking --
    function placeMemberPickMarker(position) {
      var ptGroup = new THREE.Group();
      ptGroup.position.copy(position);
      ptGroup.userData.isMemberPickMarker = true;
      var sphGeo = new THREE.SphereGeometry(0.4, 12, 12);
      var sphMat = new THREE.MeshBasicMaterial({
        color: 0xff9900, depthTest: false, depthWrite: false
      });
      var sphMesh = new THREE.Mesh(sphGeo, sphMat);
      sphMesh.userData.isMarkerSphere = true;
      ptGroup.add(sphMesh);
      memberScene.add(ptGroup);
      memberPickMarkers.push(ptGroup);
    }

    // -- Remove temporary member pick markers --
    function clearMemberPickMarkers() {
      for (var i = 0; i < memberPickMarkers.length; i++) {
        var m = memberPickMarkers[i];
        m.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) obj.material.dispose();
        });
        memberScene.remove(m);
      }
      memberPickMarkers.length = 0;
    }

    // -- Rubber-band preview during member picking (mirrors the constraint
    //    X-axis rubber line): an orange sphere follows the cursor's snapped
    //    pick, and once the first endpoint is down a line stretches from it to
    //    the cursor — matching the dimension tool's live feedback. --
    var _memberPreviewSphere = null;
    var _memberRubberLine = null;
    function _ensureMemberPreviewSphere() {
      if (_memberPreviewSphere) return;
      _memberPreviewSphere = _makePreviewSphere(0xff9900);
      memberScene.add(_memberPreviewSphere);
    }
    function _startMemberRubberLine(position) {
      _clearMemberRubberLine();
      var rbGeo = new THREE.BufferGeometry();
      rbGeo.setAttribute('position', new THREE.Float32BufferAttribute([
        position.x, position.y, position.z,
        position.x, position.y, position.z
      ], 3));
      var rbMat = new THREE.LineBasicMaterial({
        color: 0xff9900, depthTest: false, depthWrite: false, transparent: true, opacity: 0.95
      });
      _memberRubberLine = new THREE.Line(rbGeo, rbMat);
      _memberRubberLine.renderOrder = 1;
      memberScene.add(_memberRubberLine);
    }
    function _clearMemberRubberLine() {
      if (!_memberRubberLine) return;
      memberScene.remove(_memberRubberLine);
      if (_memberRubberLine.geometry) _memberRubberLine.geometry.dispose();
      if (_memberRubberLine.material) _memberRubberLine.material.dispose();
      _memberRubberLine = null;
    }
    function clearMemberPreview() {
      _disposePreviewSphere(_memberPreviewSphere, memberScene);
      _memberPreviewSphere = null;
      _clearMemberRubberLine();
    }
    // Update the member preview each mousemove. Uses the SAME pick + snap path
    // as actual placement (patched picker + findSnapTarget @ 18px), so the
    // preview lands exactly where the click will.
    function _updateMemberPreview(e) {
      if (!memberPickMode) return;
      var rect = renderArea.getBoundingClientRect();
      var mouse = { x: e.clientX - rect.left, y: e.clientY - rect.top };
      var cam = viewer.scene.getActiveCamera();
      var pick = Potree.Utils.getMousePointCloudIntersection(mouse, cam, viewer, viewer.scene.pointclouds, { pickClipped: true });
      var loc = (pick && pick.location) ? pick.location.clone() : null;
      if (loc && !_axisLock) {              // a locked axis overrides node snapping
        var snap = findSnapTarget(mouse, SNAP_THRESHOLD_MEMBER);
        if (snap) loc = snap.position.clone();
      }
      if (_memberPreviewSphere) {
        if (loc) { _memberPreviewSphere.position.copy(loc); _memberPreviewSphere.visible = true; }
        else { _memberPreviewSphere.visible = false; }
      }
      if (_memberRubberLine && memberPickPoints.length === 1 && loc) {
        var attr = _memberRubberLine.geometry.attributes.position;
        attr.setXYZ(1, loc.x, loc.y, loc.z);
        attr.needsUpdate = true;
      }
    }

    // -- Finalize member from 2 picked points --
    function finalizeMember() {
      clearMemberPickMarkers();
      clearMemberPreview();
      var member = {
        id: nextMemberId++,
        name: 'M' + (nextMemberId - 1),
        points: [memberPickPoints[0].clone(), memberPickPoints[1].clone()],
        visual: null,
        visible: true,
        locked: false
      };
      buildMemberVisual(member);
      members.push(member);
      rebuildMemberList();
      // Replace member-point pick entries with a single member entry
      while (undoStack.length > 0 && undoStack[undoStack.length - 1].tag === 'member-point') {
        undoStack.pop();
      }
      pushUndoCmd(_cmdAddMember(member));
      showToast(member.name + ' created');

      memberPickMode = false;
      memberPickPoints = [];
      document.body.classList.remove('member-pick-mode');
      var btn = document.getElementById('btn-add-member');
      if (btn) btn.classList.remove('active');
    }

    // -- Create a label sprite with text --
    function createLabelSprite(text, position) {
      var canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 64;
      var ctx = canvas.getContext('2d');
      ctx.font = 'bold 36px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 64, 32);
      var texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      var mat = new THREE.SpriteMaterial({
        map: texture, depthTest: false, depthWrite: false,
        transparent: true, sizeAttenuation: false
      });
      var sprite = new THREE.Sprite(mat);
      sprite.position.copy(position);
      sprite.scale.set(0.08, 0.04, 1);
      sprite.userData.isMemberLabel = true;
      return sprite;
    }

    // -- Build 3D visual for a member --
    function buildMemberVisual(member) {
      var group = new THREE.Group();
      group.name = 'member-' + member.id;

      // Line between endpoints
      var lineGeo = new THREE.BufferGeometry().setFromPoints(member.points);
      var lineMat = new THREE.LineBasicMaterial({
        color: 0xff9900, depthTest: false, depthWrite: false,
        transparent: true, opacity: 0.9, linewidth: 2
      });
      group.add(new THREE.Line(lineGeo, lineMat));

      // Endpoint markers: solid orange sphere, fixed screen-pixel size.
      for (var k = 0; k < 2; k++) {
        var ptGroup = new THREE.Group();
        ptGroup.position.copy(member.points[k]);
        ptGroup.userData.isMemberEndpoint = true;
        ptGroup.userData.pointIndex = k;
        var epGeo = new THREE.SphereGeometry(0.4, 12, 12);
        var epMat = new THREE.MeshBasicMaterial({
          color: 0xff9900, depthTest: false, depthWrite: false
        });
        var epMesh = new THREE.Mesh(epGeo, epMat);
        epMesh.userData.isMarkerSphere = true;
        ptGroup.add(epMesh);
        group.add(ptGroup);
      }

      // Label sprite at midpoint
      var midpoint = new THREE.Vector3().addVectors(member.points[0], member.points[1]).multiplyScalar(0.5);
      var label = createLabelSprite(member.name, midpoint);
      group.add(label);

      member.visual = group;
      if (member.visible === false) group.visible = false;
      memberScene.add(group);
    }

    // -- Rebuild visual for a member (dispose old, build new) --
    function recomputeMemberVisual(m) {
      if (m.visual) {
        m.visual.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            if (obj.material.map) obj.material.map.dispose();
            obj.material.dispose();
          }
        });
        memberScene.remove(m.visual);
        m.visual = null;
      }
      buildMemberVisual(m);
    }

    // -- Rebuild member sidebar list --
    function rebuildMemberList() {
      var listEl = document.getElementById('enable-member-list');
      if (!listEl) return;
      listEl.innerHTML = '';
      _appendDeleteAll(listEl, members.length, 'members', clearAllMembers);

      for (var mi = 0; mi < members.length; mi++) {
        (function(m) {
          var row = document.createElement('div');
          row.className = 'member-row';

          var nameSpan = document.createElement('span');
          nameSpan.className = 'member-name';
          nameSpan.textContent = m.name;
          nameSpan.title = 'Click to rename';
          nameSpan.addEventListener('click', function() {
            var input = document.createElement('input');
            input.type = 'text';
            input.value = m.name;
            input.style.cssText = 'width:60px;font:12px/1.3 sans-serif;background:#333;color:#fff;border:1px solid #666;border-radius:2px;padding:1px 3px;';
            nameSpan.replaceWith(input);
            input.focus();
            input.select();
            function commit() {
              var val = input.value.trim();
              if (val && val !== m.name) {
                m.name = val;
                recomputeMemberVisual(m);
              }
              rebuildMemberList();
            }
            input.addEventListener('blur', commit);
            input.addEventListener('keydown', function(ev) {
              if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
              if (ev.key === 'Escape') { ev.preventDefault(); rebuildMemberList(); }
            });
          });
          row.appendChild(nameSpan);

          var visBtn = document.createElement('button');
          visBtn.className = 'btn-vis' + (m.visible === false ? ' hidden' : '');
          visBtn.textContent = '\uD83D\uDC41';
          visBtn.title = 'Toggle visibility';
          visBtn.addEventListener('click', function() {
            m.visible = !m.visible;

    // -- Create a Potree TextSprite label for measurement points --
    function createMeasurePointLabel(text, position, onModel) {
      var label = new Potree.TextSprite(text);

      // Setting .fontsize alone does NOT regenerate the texture; we must call update()
      // to re-render the canvas at the new size so D# matches Potree's edge labels (16).
      label.fontsize = 16;
      label.update();
      label.material.depthTest = false;
      label.material.depthWrite = false;

    }

    // -- Get the D-name for a given point index within a measure --

      return 'D?';
    }

    // -- Reposition a single measure's D# labels with screen-space outward offset.
    // Shared by per-frame render and post-add sync so newly-placed labels land
    // at their final offset position immediately (no one-frame "jump").
    function repositionMeasureLabels(measure, camera) {
      var labels = measurePointLabels.get(measure);
      if (!labels || labels.length === 0) return;
      if (!camera) camera = viewer.scene.getActiveCamera();
      if (!camera) return;
      var size = viewer.renderer.getSize(new THREE.Vector2());
      var cw = size.width, ch = size.height;
      if (!cw || !ch) return;
      var isOrtho = camera instanceof THREE.OrthographicCamera;
      var OFFSET_PX = 26;
      var pts = measure.points;
      // While an insertion is in progress, Potree keeps the last point as a
      // trailing cursor-follow. Right after a click, that trailing point sits
      // exactly on top of the just-placed point — showing its label there is
      // a confusing duplicate. Hide it until the cursor has moved away.
      var isPending = (pendingMeasurement === measure);
      var TRAIL_HIDE_PX_SQ = 100; // 10 px
      var projected = new Array(pts.length);
      for (var pi = 0; pi < pts.length; pi++) {
        var pp = pts[pi].position ? pts[pi].position : pts[pi];
        if (!pp) { projected[pi] = null; continue; }
        var sp = pp.clone().project(camera);
        projected[pi] = {
          x: (sp.x + 1) * cw / 2,
          y: (-sp.y + 1) * ch / 2,
          z: sp.z
        };
      }
      for (var li = 0; li < labels.length; li++) {
        var lbl = labels[li];
        var pt = pts[li];
        if (!pt) continue;
        var worldPos = pt.position ? pt.position : pt;
        var dist = camera.position.distanceTo(worldPos);
        var pr = Potree.Utils.projectedRadius(1, camera, dist, cw, ch);
        if (!pr || !isFinite(pr) || pr < 0.001) pr = 1;
        var s = (70 / pr);
        lbl.scale.set(s, s, s);

        var thisScr = projected[li];
        if (!thisScr) continue;

        // Outward direction = sum of unit vectors pointing AWAY from each neighbour.
        var outX = 0, outY = 0, contributors = 0;
        var neighborIdxs = [li - 1, li + 1];
        for (var ni = 0; ni < neighborIdxs.length; ni++) {
          var nIdx = neighborIdxs[ni];
          if (nIdx < 0 || nIdx >= pts.length) continue;
          var nScr = projected[nIdx];
          if (!nScr) continue;
          var dxs = thisScr.x - nScr.x;
          var dys = thisScr.y - nScr.y;
          var slen = Math.sqrt(dxs * dxs + dys * dys);
          if (slen > 0.5) {
            outX += dxs / slen;
            outY += dys / slen;
            contributors++;
          }
        }
        if (contributors === 0) {
          outY = -1;
        } else {
          var olen = Math.sqrt(outX * outX + outY * outY);
          if (olen < 0.001) { outX = 0; outY = -1; }
          else { outX /= olen; outY /= olen; }
        }

        var screenX = thisScr.x + outX * OFFSET_PX;
        var screenY = thisScr.y + outY * OFFSET_PX;

        var ndcX = (screenX / cw) * 2 - 1;
        var ndcY = -(screenY / ch) * 2 + 1;
        var nearPoint = new THREE.Vector3(ndcX, ndcY, thisScr.z).unproject(camera);

        if (isOrtho) {
          lbl.position.copy(nearPoint);
        } else {
          var dir = nearPoint.sub(camera.position).normalize();
          lbl.position.copy(camera.position.clone().add(dir.multiplyScalar(dist)));
        }

        // Trailing-label suppression: during an in-progress insertion, the
        // last point follows the cursor. Hide its label whenever it sits on
        // top of the previous (just-placed) point — it'll reveal as soon as
        // the cursor moves away. measure.visible still acts as the master
        // toggle from the sidebar.
        if (isPending && li === labels.length - 1 && li > 0) {
          var prevScr = projected[li - 1];
          if (prevScr) {
            var pdx = thisScr.x - prevScr.x;
            var pdy = thisScr.y - prevScr.y;
            var tooClose = (pdx * pdx + pdy * pdy) < TRAIL_HIDE_PX_SQ;
            lbl.visible = measure.visible && !tooClose;
          } else {
            lbl.visible = measure.visible;
          }
        } else {
          lbl.visible = measure.visible;
        }
      }
    }

    // -- Sync labels for a measurement (create/remove/update) --
    function syncMeasurePointLabels(measure) {

      // their coords in the sidebar list — skip the D# sprite labels.
      if (typeof _isPointMeasure === 'function' && _isPointMeasure(measure)) return;
      var labels = measurePointLabels.get(measure);
      if (!labels) { labels = []; measurePointLabels.set(measure, labels); }
      var nums = measurePointNumbers.get(measure);
      if (!nums) { nums = []; measurePointNumbers.set(measure, nums); }

      var pts = measure.points;

      // Reclaim P-numbers for removed ghost points (e.g. ESC during measurement)
      while (nums.length > pts.length) {
        var removed = nums.pop();
        // Reclaim if it was the very latest assigned number
        if (removed === nextPointNumber - 1) {
          nextPointNumber--;
        }
      }

      // Assign global P-numbers to any new points
      while (nums.length < pts.length) {
        nums.push(nextPointNumber++);
      }

      // Remove excess labels
      while (labels.length > pts.length) {
        var old = labels.pop();
        measureLabelScene.remove(old);
        old.traverse(function(obj) {
          if (obj.material) {
            if (obj.material.map) obj.material.map.dispose();
            obj.material.dispose();
          }
        });
      }
      // Create missing labels
      while (labels.length < pts.length) {
        var idx = labels.length;
        var pos = pts[idx].position ? pts[idx].position.clone() : pts[idx].clone();
        var onMC = isPositionOnModel(pos);
        var lbl = createMeasurePointLabel('D' + nums[idx], pos, onMC);
        lbl.userData._lastCheckedPos = pos.clone();
        lbl.visible = measure.visible;
        measureLabelScene.add(lbl);
        labels.push(lbl);
      }
      // Update positions, and re-evaluate model/cloud colour for points that moved.
      for (var i = 0; i < labels.length; i++) {
        var p = pts[i].position ? pts[i].position : pts[i];
        var lc = labels[i].userData._lastCheckedPos;
        if (!lc || lc.distanceToSquared(p) > 1e-6) {
          var onM = isPositionOnModel(p);
          labels[i].userData._lastCheckedPos = p.clone();
          if (labels[i].userData._onModel !== onM) {
            measureLabelScene.remove(labels[i]);
            labels[i].traverse(function(o) { if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); } });
            labels[i] = createMeasurePointLabel('D' + nums[i], p, onM);
            labels[i].userData._lastCheckedPos = p.clone();
            measureLabelScene.add(labels[i]);

      // every frame — see applyMeasureColors for why that's required).
      applyMeasureColors(measure, labels);

      // on the next frame when the per-frame reposition pass runs.
      repositionMeasureLabels(measure);
    }

    // -- Colour a measurement's spheres + edges by on-model state. --
    // A point ON the model is teal; on the cloud, red. An edge is teal ONLY when
    // BOTH its endpoints are on the model — any edge touching a cloud point
    // (including a model→cloud span) stays red.
    //
    // Two non-obvious reasons each element gets its OWN Color object (rather than
    // the obvious sph.material.color.setHex()), re-applied every frame:
    //   1. Potree's Measure.update() runs on every geometry change and sets
    //      sphere.material.color / edge.material.color = the single shared
    //      measure.color object. setHex() on that would bleed one point's colour
    //      onto the whole measurement.
    //   2. setMarker/setPosition dispatch 'marker_moved' BEFORE calling update(),
    //      so colouring inside the event handler is immediately clobbered. Hence
    //      this is ALSO called every frame from the perspective_overlay pass.

    // place via setHex) so there's no per-frame allocation and no shared object
    // a stray setHex elsewhere could bleed through.

    // -- Remove all labels for a measurement --

    function cancelPotreeInsertion() {

      // (which was the second-to-last and IS a committed point) would be
      // misclassified as a trailing and hidden by repositionMeasureLabels.

        }
        if (viewer.volumeTool && !viewer.volumeTool._enableWrapped) {
          var origVS = viewer.volumeTool.startInsertion.bind(viewer.volumeTool);
          viewer.volumeTool.startInsertion = function(args) {
            // Don't cancel prior measurement when starting volume — different tool family
            lastVolumeToolArgs = args || {};
            var v = origVS(args);
            pendingVolume = v;   // mid-insertion until placed
            // Potree places these boxes via a "floating" startDragging(volume)
            // and relies on a 'drop' that does NOT fire reliably here — leaving
            // the viewer stuck in the insertion state (pendingVolume + the
            // floating inputHandler.drag), so the box is unclickable / has no
            // handles until the user hits Esc. Force-FINISH on the placement
            // mouseup instead: reset the tool state like Esc (keeping the box —
            // cancelPotreeInsertion skips tracked boxes) and select it so its
            // resize/move handles appear and it's adjustable right away. The
            // 'drop' path stays as a secondary trigger; a flag makes it idempotent.
            var _volDone = false;
            function _finishVolumePlacement() {
              if (_volDone) return; _volDone = true;
              document.removeEventListener('mouseup', _volPlaceOnce, true);
              try { cancelPotreeInsertion(); } catch (_) {}   // clears pendingVolume + floating drag + re-enables input; keeps tracked box
              try {
                var ih = viewer.inputHandler;
                if (ih) {
                  ih.deselectAll();
                  ih.toggleSelection(v);                        // show the box's handles
                  if (Array.isArray(ih.hoveredElements)) ih.hoveredElements = [];
                }
              } catch (_) {}
            }
            var _volPlaceOnce = function() { setTimeout(_finishVolumePlacement, 0); };
            document.addEventListener('mouseup', _volPlaceOnce, true);
            if (v && typeof v.addEventListener === 'function') {
              v.addEventListener('drop', _finishVolumePlacement);
            }
            return v;
          };
          viewer.volumeTool._enableWrapped = true;
        }
      } catch (e) { console.warn('Tool wrapping failed:', e); }

      viewer.scene.addEventListener('measurement_added', function(e) {
        var m = e.measurement;
        _ensureMid(m);   // stable id so saved-view visibility snapshots can reference it
        syncMeasurePointLabels(m);
        rebuildAllMeasurementLists();
        m.addEventListener('marker_added', function() {
          syncMeasurePointLabels(m);
          debouncedRebuildMeasList();
          pushUndoCmd({ label: 'measurement point', tag: 'measurement-point',
            undo: function(){
              if (!m.points || m.points.length === 0) return;
              var minReq = _measureMinPoints(m);
              if (m.points.length - 1 < minReq) {
                if (pendingMeasurement === m) cancelPotreeInsertion();
                this._whole = true; this._pos = null;
                viewer.scene.removeMeasurement(m);
              } else {
                var li = m.points.length - 1;
                this._pos = (m.points[li].position || m.points[li]).clone();
                this._whole = false;
                m.removeMarker(li);
              }
              try { rebuildAllMeasurementLists(); } catch(e){}
            },
            redo: function(){
              if (this._whole) { try { viewer.scene.addMeasurement(m); } catch(e){} }
              else if (this._pos) { m.addMarker(this._pos.clone()); }
              try { rebuildAllMeasurementLists(); } catch(e){}
            } });
          // If the in-progress measurement reaches its maxMarkers, the Potree
          // tool ends insertion automatically; clear our pending tracker and
          // re-sync so the (now-committed) last label appears immediately.
          // Without the re-sync, repositionMeasureLabels above ran while
          // pendingMeasurement was still set and hid the last label as a
          // trailing — but it isn't anymore once insertion has finished.
          if (pendingMeasurement === m && m.maxMarkers && m.points.length >= m.maxMarkers) {
            pendingMeasurement = null;
            syncMeasurePointLabels(m);
          }
        });
        m.addEventListener('marker_moved', function() {
          syncMeasurePointLabels(m);
          debouncedRebuildMeasList();
        });
        m.addEventListener('marker_removed', function() {
          syncMeasurePointLabels(m);
          debouncedRebuildMeasList();
        });
      });
      viewer.scene.addEventListener('measurement_removed', function(e) {
        removeMeasurePointLabels(e.measurement);
        if (pendingMeasurement === e.measurement) pendingMeasurement = null;
        rebuildAllMeasurementLists();
      });
      // Volume add/remove (Potree's volume tool) — refresh the volume list,
      // and keep it live during drag/scale of user-created measurement volumes
      viewer.scene.addEventListener('volume_added', function(e) {
        debouncedRebuildMeasList();
        var vol = e.volume;
        if (!vol || !isUserVolumeMeasurement(vol)) return;
        vol.addEventListener('scale_changed', debouncedRebuildMeasList);
        vol.addEventListener('position_changed', debouncedRebuildMeasList);
        vol.addEventListener('orientation_changed', debouncedRebuildMeasList);
      });
      viewer.scene.addEventListener('volume_removed', function() {
        debouncedRebuildMeasList();
      });
    }

    // Restart the most-recently-used measurement (or volume) tool. Used by Enter.
    function restartLastMeasurementTool() {
      if (lastMeasurementToolArgs && viewer.measuringTool) {
        viewer.measuringTool.startInsertion(lastMeasurementToolArgs);
        return true;
      }
      if (lastVolumeToolArgs && viewer.volumeTool) {
        viewer.volumeTool.startInsertion(lastVolumeToolArgs);
        return true;
      }
      return false;
    }

    // Delete a single point from a measurement; if the measurement would drop
    // below its required minimum, remove the whole measurement.
    function deleteMeasurementPoint(measure, idx) {
      if (!measure || !measure.points || idx < 0 || idx >= measure.points.length) return;
      var minReq = _measureMinPoints(measure);
      if (measure.points.length - 1 < minReq) {
        viewer.scene.removeMeasurement(measure);
        showToast('Removed measurement (would have too few points)');
      } else {
        measure.removeMarker(idx);
        showToast('Removed point');
      }
    }

    // ===== TRUE 3D POLYGON AREA (Newell's method) =====
    // Potree's getArea() uses an XY-only shoelace formula, so any polygon on
    // a vertical or angled surface returns 0 m². Newell's method computes the
    // best-fit-plane normal and gives the true 3D surface area regardless of
    // polygon orientation.
    function compute3DPolygonArea(pts) {
      if (!pts || pts.length < 3) return 0;
      var nx = 0, ny = 0, nz = 0;
      for (var i = 0; i < pts.length; i++) {
        var a = pts[i].position ? pts[i].position : pts[i];
        var b = pts[(i + 1) % pts.length].position ? pts[(i + 1) % pts.length].position : pts[(i + 1) % pts.length];
        nx += (a.y - b.y) * (a.z + b.z);
        ny += (a.z - b.z) * (a.x + b.x);
        nz += (a.x - b.x) * (a.y + b.y);
      }
      return 0.5 * Math.sqrt(nx * nx + ny * ny + nz * nz);
    }

    // ===== USER-CREATED VOLUMES (excludes our internally managed boxes) =====
    function isUserVolumeMeasurement(vol) {
      if (!vol) return false;
      if (typeof initialClipBox !== 'undefined' && vol === initialClipBox) return false;
      if (typeof planeOrthoSlab !== 'undefined' && vol === planeOrthoSlab) return false;
      if (typeof cutoutBoxes !== 'undefined' && cutoutBoxes.indexOf(vol) >= 0) return false;
      if (typeof elevationCropVolumes !== 'undefined' && elevationCropVolumes.indexOf(vol) >= 0) return false;
      return true;
    }

    function rebuildAllMeasurementLists() {
      rebuildMeasurementList();
      rebuildPointList();
      rebuildAreaList();
      rebuildAngleList();
      rebuildVolumeList();
    }

    function _isPointMeasure(m) {
      return m.showCoordinates && !m.showDistances && !m.showHeight && !m.showArea && !m.showAngles;
    }
    function clearAllPointMeasurements() {
      (viewer.scene.measurements || []).slice().forEach(function(m) {
        if (_isPointMeasure(m)) viewer.scene.removeMeasurement(m);
      });
    }

          html += '<div class="enable-meas-seg">' +

            '<span class="seg-vals">X: ' + fmtLenVal(p.x) + '  Y: ' + fmtLenVal(p.y) + '  Z: ' + fmtLenVal(p.z) + '</span>' +

        btn.addEventListener('click', function() {

    // ===== PERSISTENT MEASUREMENT SIDEBAR LIST =====

    function rebuildMeasurementList() {
      var listEl = document.getElementById('enable-measurement-list');
      if (!listEl) return;
      var measurements = viewer.scene.measurements || [];
      // Show distance and vertical-height measurements (skip area/angle/coord-only)
      var distMeasures = [];
      for (var i = 0; i < measurements.length; i++) {
        var m = measurements[i];
        if ((m.showDistances || m.showHeight) && !m.showArea && !m.showAngles) distMeasures.push(m);
      }

      if (distMeasures.length === 0) {
        listEl.innerHTML = '';
        return;
      }

      var html = '<div class="enable-list-section-label">Distance &amp; Height' +
        '<button id="btn-clear-dist-meas" title="Delete all distance/height measurements" style="float:right;background:none;border:none;color:var(--muted,#9aa3b2);cursor:pointer;font:11px sans-serif">Delete all</button>' +
        '</div>';
      for (var mi = 0; mi < distMeasures.length; mi++) {
        var measure = distMeasures[mi];
        var nums = measurePointNumbers.get(measure);
        var pts = measure.points;
        if (!nums || pts.length < 2) {
          // Show placeholder for incomplete measurement
          var pName = (nums && nums.length > 0) ? 'D' + nums[0] : '...';
          html += '<div class="enable-meas-item">' +
            '<div class="meas-header"><span class="meas-title">' + pName + '... (picking)</span></div>' +
            '</div>';
          continue;
        }

        var firstName = 'D' + nums[0];
        var lastName = 'D' + nums[nums.length - 1];
        html += '<div class="enable-meas-item">' +
          '<div class="meas-header">' +
          '<span class="meas-title">' + firstName + ' \u2192 ' + lastName + '</span>' +
          '<button class="btn-vis meas-vis' + (measure.visible === false ? ' hidden' : '') + '" data-meas-idx="' + mi + '" title="Show/hide this dimension">\ud83d\udc41</button>' +
          '<button class="meas-delete" data-meas-idx="' + mi + '" title="Delete measurement">\u00d7</button>' +
          '</div>';

        // Per-point delete chips
        var chipsHtml = '<div class="enable-meas-points">';
        for (var ci = 0; ci < pts.length; ci++) {
          var cName = ci < nums.length ? 'D' + nums[ci] : ('P' + (ci + 1));
          chipsHtml += '<span class="point-chip">' + cName +
            '<button data-pt-list="dist" data-pt-mi="' + mi + '" data-pt-idx="' + ci + '" title="Delete this point">\u00d7</button>' +
            '</span>';
        }
        chipsHtml += '</div>';
        html += chipsHtml;

        var isHeight = measure.showHeight && !measure.showDistances;
        var only3D = !!(measure.userData && measure.userData.only3D);
        var total3D = 0, totalXY = 0, totalZ = 0;
        for (var si = 0; si < pts.length - 1; si++) {
          var a = pts[si].position ? pts[si].position : pts[si];
          var b = pts[si + 1].position ? pts[si + 1].position : pts[si + 1];
          var dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
          var d3d = Math.sqrt(dx * dx + dy * dy + dz * dz);
          var dxy = Math.sqrt(dx * dx + dy * dy);
          var absZ = Math.abs(dz);
          var zSign = dz >= 0 ? '+' : '-';
          total3D += d3d; totalXY += dxy; totalZ += absZ;

          var segVals = isHeight
            ? 'Vert:' + fmtLen(absZ) + '(' + zSign + ')'
            : (only3D
                ? '3D:' + fmtLen(d3d)
                : '3D:' + fmtLen(d3d) + ' XY:' + fmtLen(dxy) + ' Z:' + fmtLen(absZ) + '(' + zSign + ')');
          html += '<div class="enable-meas-seg">' +
            '<span class="seg-name">D' + nums[si] + '\u2192D' + nums[si + 1] + '</span>' +
            '<span class="seg-vals">' + segVals + '</span>' +
            '</div>';
        }
        // Total row if multi-segment
        if (pts.length > 2) {
          var totalVals = isHeight
            ? 'Vert:' + fmtLen(totalZ)
            : (only3D
                ? '3D:' + fmtLen(total3D)
                : '3D:' + fmtLen(total3D) + ' XY:' + fmtLen(totalXY) + ' Z:' + fmtLen(totalZ));
          html += '<div class="enable-meas-seg seg-total">' +
            '<span class="seg-name">Total</span>' +
            '<span class="seg-vals">' + totalVals + '</span>' +
            '</div>';
        }
        html += '</div>';
      }
      listEl.innerHTML = html;

      // Bind delete buttons
      listEl.querySelectorAll('.meas-delete').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var idx = parseInt(btn.getAttribute('data-meas-idx'));
          if (distMeasures[idx]) {
            viewer.scene.removeMeasurement(distMeasures[idx]);
          }
        });
      });
      // Per-measurement show/hide toggle (flip these, then Save View to capture)
      listEl.querySelectorAll('.meas-vis').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var m = distMeasures[parseInt(btn.getAttribute('data-meas-idx'))];
          if (!m) return;
          _setMeasureVisible(m, m.visible === false);     // toggle
          btn.classList.toggle('hidden', m.visible === false);
        });
      });
      var _cda = listEl.querySelector('#btn-clear-dist-meas');
      if (_cda) _cda.addEventListener('click', clearAllDistMeasurements);
      // Per-point delete chips
      listEl.querySelectorAll('.point-chip button').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var mi = parseInt(btn.getAttribute('data-pt-mi'));
          var pi = parseInt(btn.getAttribute('data-pt-idx'));
          if (distMeasures[mi]) deleteMeasurementPoint(distMeasures[mi], pi);
        });
      });
    }

    // ===== AREA LIST =====
    function rebuildAreaList() {
      var listEl = document.getElementById('enable-area-list');
      if (!listEl) return;
      var measurements = viewer.scene.measurements || [];
      var areaMeasures = [];
      for (var i = 0; i < measurements.length; i++) {
        if (measurements[i].showArea) areaMeasures.push(measurements[i]);
      }
      if (areaMeasures.length === 0) { listEl.innerHTML = ''; return; }

      var html = '<div class="enable-list-section-label">Areas</div>';
      for (var mi = 0; mi < areaMeasures.length; mi++) {
        var measure = areaMeasures[mi];
        var nums = measurePointNumbers.get(measure);
        var pts = measure.points;
        if (!pts || pts.length < 3) {
          var pName = (nums && nums.length > 0) ? 'D' + nums[0] : '...';
          html += '<div class="enable-meas-item">' +
            '<div class="meas-header"><span class="meas-title">' + pName + '... (picking, need 3+)</span></div>' +
            '</div>';
          continue;
        }
        var firstName = nums && nums.length > 0 ? 'D' + nums[0] : 'D?';
        var lastName  = nums && nums.length > 0 ? 'D' + nums[nums.length - 1] : 'D?';
        var area3D = compute3DPolygonArea(pts);
        // XY plan area for reference (Potree's native shoelace)
        var areaXY = (typeof measure.getArea === 'function') ? measure.getArea() : 0;
        var perim = 0;
        for (var pi = 0; pi < pts.length; pi++) {
          var a = pts[pi].position ? pts[pi].position : pts[pi];
          var b = pts[(pi + 1) % pts.length].position ? pts[(pi + 1) % pts.length].position : pts[(pi + 1) % pts.length];
          var dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
          perim += Math.sqrt(dx * dx + dy * dy + dz * dz);
        }
        var aChips = '<div class="enable-meas-points">';
        for (var aci = 0; aci < pts.length; aci++) {
          var acName = nums && aci < nums.length ? 'D' + nums[aci] : ('P' + (aci + 1));
          aChips += '<span class="point-chip">' + acName +
            '<button data-pt-list="area" data-pt-mi="' + mi + '" data-pt-idx="' + aci + '" title="Delete this point">\u00d7</button>' +
            '</span>';
        }
        aChips += '</div>';
        html += '<div class="enable-meas-item">' +
          '<div class="meas-header">' +
          '<span class="meas-title">' + firstName + ' \u2192 ' + lastName + ' (' + pts.length + ' pts)</span>' +
          '<button class="meas-delete" data-area-idx="' + mi + '" title="Delete area">\u00d7</button>' +
          '</div>' +
          aChips +
          '<div class="enable-meas-seg">' +
            '<span class="seg-name">Surface</span>' +
            '<span class="seg-vals">' + fmtArea(area3D) + '</span>' +
          '</div>' +
          '<div class="enable-meas-seg">' +
            '<span class="seg-name">Plan (XY)</span>' +
            '<span class="seg-vals">' + fmtArea(areaXY) + '</span>' +
          '</div>' +
          '<div class="enable-meas-seg">' +
            '<span class="seg-name">Perimeter</span>' +
            '<span class="seg-vals">' + fmtLen(perim) + '</span>' +
          '</div>' +
          '</div>';
      }
      listEl.innerHTML = html;
      listEl.querySelectorAll('.meas-delete').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var idx = parseInt(btn.getAttribute('data-area-idx'));
          if (areaMeasures[idx]) viewer.scene.removeMeasurement(areaMeasures[idx]);
        });
      });
      listEl.querySelectorAll('.point-chip button').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var mi = parseInt(btn.getAttribute('data-pt-mi'));
          var pi = parseInt(btn.getAttribute('data-pt-idx'));
          if (areaMeasures[mi]) deleteMeasurementPoint(areaMeasures[mi], pi);
        });
      });

    // ===== ANGLE LIST =====
    function rebuildAngleList() {

      for (var i = 0; i < measurements.length; i++) {

        html += '<div class="enable-meas-item">' +

          '<button class="meas-delete" data-ang-idx="' + mi + '" title="Delete angle">\u00d7</button>' +

        var gChips = '<div class="enable-meas-points">';
        for (var gci = 0; gci < pts.length; gci++) {

          gChips += '<span class="point-chip">' + gcName +
            '<button data-pt-list="angle" data-pt-mi="' + mi + '" data-pt-idx="' + gci + '" title="Delete this point">\u00d7</button>' +
            '</span>';
        }
        gChips += '</div>';
        html += gChips;
        // For each interior corner, compute the angle
        var lastIdx = pts.length - 1;
        var loop = !!measure.closed;
        for (var ai = 0; ai < pts.length; ai++) {
          if (!loop && (ai === 0 || ai === lastIdx)) continue;
          var rad = (typeof measure.getAngle === 'function') ? measure.getAngle(ai) : 0;
          if (!isFinite(rad)) rad = 0;

          html += '<div class="enable-meas-seg">' +
            '<span class="seg-name">' + nm + '</span>' +

      listEl.querySelectorAll('.meas-delete').forEach(function(btn) {

          var mi = parseInt(btn.getAttribute('data-pt-mi'));

          if (angleMeasures[mi]) deleteMeasurementPoint(angleMeasures[mi], pi);
        });
