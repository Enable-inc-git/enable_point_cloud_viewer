          lines.push('  ' + pn + ': X=' + p.x.toFixed(4) + ', Y=' + p.y.toFixed(4) + ', Z=' + p.z.toFixed(4));
        }
        lines.push('');

        lines.push('Segment Distances:');
        var total3D = 0, totalXY = 0, totalZ = 0;
        for (var si = 0; si < pts.length - 1; si++) {
          var a = pts[si].position ? pts[si].position : pts[si];
          var b = pts[si + 1].position ? pts[si + 1].position : pts[si + 1];
          var dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
          var d3d = Math.sqrt(dx * dx + dy * dy + dz * dz);
          var dxy = Math.sqrt(dx * dx + dy * dy);
          var absZ = Math.abs(dz);
          var zSign = dz >= 0 ? '(+)' : '(-)';
          total3D += d3d; totalXY += dxy; totalZ += absZ;
          var sn1 = si < nums.length ? 'D' + nums[si] : 'D?';
          var sn2 = (si + 1) < nums.length ? 'D' + nums[si + 1] : 'D?';
          if (isHeight) {
            lines.push('  ' + sn1 + ' -> ' + sn2 + ':  Vertical: ' + absZ.toFixed(3) + ' ' + zSign);
          } else {
            lines.push('  ' + sn1 + ' -> ' + sn2 + ':  3D: ' + d3d.toFixed(3) + '  XY: ' + dxy.toFixed(3) + '  Z: ' + absZ.toFixed(3) + ' ' + zSign);
          }
        }
        lines.push('');
        if (isHeight) {
          lines.push('Totals:  Vertical: ' + totalZ.toFixed(3));
        } else {
          lines.push('Totals:  3D: ' + total3D.toFixed(3) + '  XY: ' + totalXY.toFixed(3) + '  Z: ' + totalZ.toFixed(3));
        }
        lines.push('');
      }

      // Areas
      for (var ai = 0; ai < areaMeasures.length; ai++) {
        var measure = areaMeasures[ai];
        var nums = measurePointNumbers.get(measure) || [];
        var pts = measure.points;
        var firstName = nums.length > 0 ? 'D' + nums[0] : 'D?';
        var lastName = nums.length > 0 ? 'D' + nums[nums.length - 1] : 'D?';
        lines.push('=== Area ' + (ai + 1) + ': ' + firstName + ' -> ' + lastName + ' (' + pts.length + ' pts) ===');
        lines.push('');
        lines.push('Point Coordinates:');
        for (var pi = 0; pi < pts.length; pi++) {
          var p = pts[pi].position ? pts[pi].position : pts[pi];
          var pn = pi < nums.length ? 'D' + nums[pi] : 'D?';
          lines.push('  ' + pn + ': X=' + p.x.toFixed(4) + ', Y=' + p.y.toFixed(4) + ', Z=' + p.z.toFixed(4));
        }
        var area3D = compute3DPolygonArea(pts);
        var areaXY = (typeof measure.getArea === 'function') ? measure.getArea() : 0;
        var perim = 0;
        for (var pj = 0; pj < pts.length; pj++) {
          var ap = pts[pj].position ? pts[pj].position : pts[pj];
          var bp = pts[(pj + 1) % pts.length].position ? pts[(pj + 1) % pts.length].position : pts[(pj + 1) % pts.length];
          perim += Math.sqrt((bp.x - ap.x) * (bp.x - ap.x) + (bp.y - ap.y) * (bp.y - ap.y) + (bp.z - ap.z) * (bp.z - ap.z));
        }
        lines.push('');
        lines.push('Surface area (3D): ' + area3D.toFixed(3) + ' m^2');
        lines.push('Plan area (XY):    ' + areaXY.toFixed(3) + ' m^2');
        lines.push('Perimeter:         ' + perim.toFixed(3) + ' m');
        lines.push('');
      }

      // Angles
      for (var gi = 0; gi < angleMeasures.length; gi++) {
        var measure = angleMeasures[gi];
        var nums = measurePointNumbers.get(measure) || [];
        var pts = measure.points;
        var firstName = nums.length > 0 ? 'D' + nums[0] : 'D?';
        var lastName = nums.length > 0 ? 'D' + nums[nums.length - 1] : 'D?';
        lines.push('=== Angle ' + (gi + 1) + ': ' + firstName + ' -> ' + lastName + ' (' + pts.length + ' pts) ===');
        lines.push('');
        var lastIdx = pts.length - 1;
        var loop = !!measure.closed;
        for (var aii = 0; aii < pts.length; aii++) {
          if (!loop && (aii === 0 || aii === lastIdx)) continue;
          var rad = (typeof measure.getAngle === 'function') ? measure.getAngle(aii) : 0;
          if (!isFinite(rad)) rad = 0;
          var deg = rad * (180 / Math.PI);
          var nm = nums && aii < nums.length ? 'D' + nums[aii] : ('P' + (aii + 1));
          lines.push('  ' + nm + ': ' + deg.toFixed(2) + ' deg');
        }
        lines.push('');
      }

      // Volumes
      for (var vi2 = 0; vi2 < userVolumes.length; vi2++) {
        var vol = userVolumes[vi2];
        var name = vol.name || ('Volume ' + (vi2 + 1));
        var sx = Math.abs(vol.scale.x), sy = Math.abs(vol.scale.y), sz = Math.abs(vol.scale.z);
        var v3 = (typeof vol.getVolume === 'function') ? vol.getVolume() : (sx * sy * sz);
        lines.push('=== Volume ' + (vi2 + 1) + ': ' + name + ' ===');
        lines.push('  Volume: ' + v3.toFixed(3) + ' m^3');
        lines.push('  Size:   ' + sx.toFixed(3) + ' x ' + sy.toFixed(3) + ' x ' + sz.toFixed(3) + ' m');
        lines.push('  Center: X=' + vol.position.x.toFixed(4) + ', Y=' + vol.position.y.toFixed(4) + ', Z=' + vol.position.z.toFixed(4));
        lines.push('');
      }

      var content = lines.join('\n');
      var blob = new Blob([content], { type: 'text/plain' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'measurements.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Exported ' + totalCount + ' measurement(s) to .txt');
    }

    // ===== SAVE / LOAD SESSION =====

    function v3toObj(v) { return { x: v.x, y: v.y, z: v.z }; }
    function serializeVolume(vol) {
      return {
        position: v3toObj(vol.position),
        rotation: { x: vol.rotation.x, y: vol.rotation.y, z: vol.rotation.z },
        scale: v3toObj(vol.scale),
        name: vol.name || '',
        disabled: !!vol._disabled
      };
    }
    function restoreVolume(sv) {
      var vol = new Potree.BoxVolume();
      vol.clip = false;
      vol.position.set(sv.position.x, sv.position.y, sv.position.z);
      if (sv.rotation) vol.rotation.set(sv.rotation.x, sv.rotation.y, sv.rotation.z);
      vol.scale.set(sv.scale.x, sv.scale.y, sv.scale.z);
      vol.name = sv.name || '';
      vol._disabled = !!sv.disabled;
      vol.visible = !vol._disabled;
      viewer.scene.addVolume(vol);
      return vol;
    }

    function serializeSession() {
      var data = {
        version: 1,
        pointCloudID: pointCloudID,
        constraints: constraints.map(function(c) {
          var out = {
            id: c.id, type: c.type, name: c.name,
            points: c.points.map(v3toObj),
            visible: c.visible, locked: !!c.locked
          };
          if (c.type === 'plane' && c.xAxisAnchorA && c.xAxisAnchorB) {
            out.xAxisAnchorA = v3toObj(c.xAxisAnchorA);
            out.xAxisAnchorB = v3toObj(c.xAxisAnchorB);
            if (c.xAxisCamUp) out.xAxisCamUp = v3toObj(c.xAxisCamUp);
          }
          return out;
        }),
        activeConstraintId: activeConstraintId,
        nextConstraintId: nextConstraintId,
        members: members.map(function(m) {
          return {
            id: m.id, name: m.name,
            points: m.points.map(v3toObj),
            visible: m.visible
          };
        }),
        nextMemberId: nextMemberId,
        measurements: (function() {
          var arr = [];
          var allMeas = viewer.scene.measurements || [];
          for (var i = 0; i < allMeas.length; i++) {
            var m = allMeas[i];
            if (!(m.showDistances || m.showHeight) || m.showArea || m.showAngles) continue;
            var pts = [];
            for (var j = 0; j < m.points.length; j++) {
              var p = m.points[j].position || m.points[j];
              pts.push(v3toObj(p));
            }
            var nums = measurePointNumbers.get(m) || [];
            arr.push({
              points: pts,
              pointNumbers: nums.slice(),
              showDistances: !!m.showDistances,
              showHeight: !!m.showHeight
            });
          }
          return arr;
        })(),
        nextPointNumber: nextPointNumber,
        nextMarkId: nextMarkId,
        initialClipBox: initialClipBox ? serializeVolume(initialClipBox) : null,
        marks: markedPoints.map(function(m) {
          return { id: m.id, name: m.name, locked: m.locked, visible: m.visible, position: v3toObj(m.visual.position) };
        }),
        // Elevation map state
        elevationMap: (function() {
          if (elevationCropVolumes.length === 0 && !elevationActive) return null;
          return {
            active: elevationActive,
            zMin: elevationZMin,
            zMax: elevationZMax,
            contoursVisible: elevationContoursVisible,
            elevationBoxes: elevationCropVolumes.map(function(vol) {
              var sv = serializeVolume(vol);
              var cfg = getBoxConfig(vol);
              sv.config = {
                mode: cfg.mode,
                refConstraintIdx: cfg.refConstraintIdx,
                refSide: cfg.refSide,
                sideSet: cfg.sideSet,
                zBaseMarkId: cfg.zBaseMarkId,
                thicknessExpectedMin: cfg.thicknessExpectedMin,
                thicknessExpectedMax: cfg.thicknessExpectedMax,
                thicknessGapTol: cfg.thicknessGapTol,
                zMin: cfg.zMin,
                zMax: cfg.zMax,
                contourStep: cfg.contourStep,
                active: cfg.active
              };
              return sv;
            }),
            exclusionBoxes: exclusionBoxes.map(serializeVolume),
            cutoutBoxes: cutoutBoxes.map(serializeVolume)
          };
        })()
      };
      return data;
    }

    function saveSessionToFile() {
      var data = serializeSession();
      var json = JSON.stringify(data, null, 2);
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      var date = new Date().toISOString().slice(0, 10);
      a.download = 'session_' + pointCloudID + '_' + date + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Session saved');
    }

    function loadSession(data) {
      // Validate
      if (!data || data.version !== 1) {
        showToast('Invalid session file');
        return;
      }
      if (data.pointCloudID && data.pointCloudID !== pointCloudID) {
        showToast('Warning: session is for "' + data.pointCloudID + '", current is "' + pointCloudID + '"', 4000);
      }

      // Clear existing state
      clearAllMarkers();
      while (constraints.length > 0) {
        deleteConstraint(constraints[constraints.length - 1].id);
      }
      while (members.length > 0) {
        deleteMember(members[members.length - 1].id);
      }
      var existingMeas = (viewer.scene.measurements || []).slice();
      for (var i = 0; i < existingMeas.length; i++) {
        viewer.scene.removeMeasurement(existingMeas[i]);
      }
      // Clear elevation state
      if (elevationActive) onClearElevation();
      clearAllElevationBoxes();
      clearAllCutoutBoxes();
      for (var exi = 0; exi < exclusionBoxes.length; exi++) viewer.scene.removeVolume(exclusionBoxes[exi]);
      exclusionBoxes = [];
      rebuildExclusionList();
      undoStack.length = 0;

      // Restore constraints
      if (data.constraints) {
        for (var ci = 0; ci < data.constraints.length; ci++) {
          var sc = data.constraints[ci];
          var pts = sc.points.map(function(p) { return new THREE.Vector3(p.x, p.y, p.z); });
          var c = {
            id: sc.id, type: sc.type, name: sc.name,
            points: pts, visual: null,
            visible: sc.visible !== false,
            locked: !!sc.locked
          };
          if (sc.xAxisAnchorA && sc.xAxisAnchorB) {
            c.xAxisAnchorA = new THREE.Vector3(sc.xAxisAnchorA.x, sc.xAxisAnchorA.y, sc.xAxisAnchorA.z);
            c.xAxisAnchorB = new THREE.Vector3(sc.xAxisAnchorB.x, sc.xAxisAnchorB.y, sc.xAxisAnchorB.z);
            if (sc.xAxisCamUp) {
              c.xAxisCamUp = new THREE.Vector3(sc.xAxisCamUp.x, sc.xAxisCamUp.y, sc.xAxisCamUp.z);
            } else {
              // Old session without camUp — synthesize from world Z so basis is consistent.
              c.xAxisCamUp = new THREE.Vector3(0, 0, 1);
            }
          }
          recomputeConstraint(c);
          buildConstraintVisual(c);
          constraints.push(c);
        }
      }
      activeConstraintId = data.activeConstraintId || null;
      nextConstraintId = data.nextConstraintId || (constraints.length + 1);
      rebuildConstraintList();
      updateConstraintVisuals();

      // Restore members
      if (data.members) {
        for (var mi = 0; mi < data.members.length; mi++) {
          var sm = data.members[mi];
          var m = {
            id: sm.id, name: sm.name,
            points: sm.points.map(function(p) { return new THREE.Vector3(p.x, p.y, p.z); }),
            visual: null,
            visible: sm.visible !== false
          };
          buildMemberVisual(m);
          members.push(m);
        }
      }
      nextMemberId = data.nextMemberId || (members.length + 1);
      rebuildMemberList();

      // Restore measurements
      nextPointNumber = data.nextPointNumber || 1;
      if (data.measurements) {
        for (var mi2 = 0; mi2 < data.measurements.length; mi2++) {
          var sm2 = data.measurements[mi2];
          if (!sm2.points || sm2.points.length < 2) continue;
          var measure = new Potree.Measure();
          // Default to a distance measurement; honor saved type if present
          var savedShowH = !!sm2.showHeight;
          var savedShowD = sm2.showDistances !== false && !savedShowH;
          measure.showDistances = savedShowD;
          measure.showHeight = savedShowH;
          measure.showArea = false;
          measure.showAngles = false;
          measure.closed = false;
          for (var pi = 0; pi < sm2.points.length; pi++) {
            var pp = sm2.points[pi];
            measure.addMarker(new THREE.Vector3(pp.x, pp.y, pp.z));
          }
          viewer.scene.addMeasurement(measure);
          // Override auto-assigned P-numbers with saved ones
          if (sm2.pointNumbers && sm2.pointNumbers.length > 0) {
            measurePointNumbers.set(measure, sm2.pointNumbers.slice());
            syncMeasurePointLabels(measure);
          }
        }
      }
      rebuildAllMeasurementLists();

      // Restore marks
      if (data.marks) {
        for (var mk = 0; mk < data.marks.length; mk++) {
          var sm = data.marks[mk];
          // Support both old format (just {x,y,z}) and new format ({id, name, position, ...})
          var pos = sm.position ? sm.position : sm;
          placeMarker(new THREE.Vector3(pos.x, pos.y, pos.z));
          // Override auto-assigned properties with saved ones
          var placed = markedPoints[markedPoints.length - 1];
          if (sm.id) placed.id = sm.id;
          if (sm.name) {
            placed.name = sm.name;
            // Update the label sprite text
            updateMarkLabel(placed);
          }
          if (sm.locked !== undefined) placed.locked = sm.locked;
          if (sm.visible !== undefined) { placed.visible = sm.visible; placed.visual.visible = sm.visible; }
        }
      }
      if (data.nextMarkId) nextMarkId = data.nextMarkId;
      rebuildMarkList();

      // Restore initial clip box transform
      if (data.initialClipBox && initialClipBox) {
        var cb = data.initialClipBox;
        initialClipBox.position.set(cb.position.x, cb.position.y, cb.position.z);
        if (cb.rotation) initialClipBox.rotation.set(cb.rotation.x, cb.rotation.y, cb.rotation.z);
        initialClipBox.scale.set(cb.scale.x, cb.scale.y, cb.scale.z);
      }

      // Restore elevation map state
      if (data.elevationMap) {
        var em = data.elevationMap;

        // Clear any existing elevation state first
        if (elevationActive) onClearElevation();
        clearAllElevationBoxes();
        for (var ei = 0; ei < exclusionBoxes.length; ei++) viewer.scene.removeVolume(exclusionBoxes[ei]);
        exclusionBoxes = [];
        clearAllCutoutBoxes();

        // Restore cut-out boxes
        if (em.cutoutBoxes) {
          for (var ci2 = 0; ci2 < em.cutoutBoxes.length; ci2++) {
            var vol = restoreVolume(em.cutoutBoxes[ci2]);
            styleCutoutBox(vol);
            setTimeout((function(v) { return function() { styleCutoutBox(v); }; })(vol), 500);
            cutoutBoxes.push(vol);
            trackVolumeUndo(vol);
            trackCutoutForElevation(vol);
          }
          _cutoutCounter = cutoutBoxes.length;
          syncExclusionBoxes();
          rebuildCutoutList();
        }

        // Restore elevation boxes with per-box config
        var hasActiveBox = false;
        if (em.elevationBoxes) {
          for (var ei2 = 0; ei2 < em.elevationBoxes.length; ei2++) {
            var sv = em.elevationBoxes[ei2];
            var vol = restoreVolume(sv);
            styleElevationBox(vol);
            setTimeout((function(v) { return function() { styleElevationBox(v); }; })(vol), 500);
            elevationCropVolumes.push(vol);
            trackVolumeUndo(vol);
            // Restore per-box config
            if (sv.config) {
              var cfg = getBoxConfig(vol);
              cfg.mode = sv.config.mode || 'z';
              cfg.refConstraintIdx = sv.config.refConstraintIdx;
              cfg.refSide = sv.config.refSide || 1;
              cfg.sideSet = !!sv.config.sideSet;
              cfg.zBaseMarkId = (sv.config.zBaseMarkId != null) ? sv.config.zBaseMarkId : null;
              if (sv.config.thicknessExpectedMin != null) cfg.thicknessExpectedMin = sv.config.thicknessExpectedMin;
              if (sv.config.thicknessExpectedMax != null) cfg.thicknessExpectedMax = sv.config.thicknessExpectedMax;
              if (sv.config.thicknessGapTol != null) cfg.thicknessGapTol = sv.config.thicknessGapTol;
              cfg.zMin = sv.config.zMin;
              cfg.zMax = sv.config.zMax;
              cfg.contourStep = sv.config.contourStep || 0.05;
              cfg.active = !!sv.config.active;
              // Restore reference plane from constraint index
              if (cfg.mode === 'plane' && cfg.refConstraintIdx >= 0 && cfg.refConstraintIdx < constraints.length) {
                var refC = constraints[cfg.refConstraintIdx];
                cfg.refPlane = { normal: refC.normal.clone(), centroid: refC.centroid.clone() };
              }
              if (cfg.active) hasActiveBox = true;
            }
          }
          _elevBoxCounter = elevationCropVolumes.length;
          syncHighlightBoxes();
          rebuildElevationBoxList();
        }

        // Restore exclusion boxes
        if (em.exclusionBoxes) {
          for (var xi = 0; xi < em.exclusionBoxes.length; xi++) {
            var vol = restoreVolume(em.exclusionBoxes[xi]);
            if (vol.box) { vol.box.material.color.setHex(0x000000); vol.box.material.opacity = 0.03; vol.box.material.transparent = true; vol.box.material.needsUpdate = true; }
            if (vol.frame) { vol.frame.material.color.setHex(0x000000); vol.frame.material.needsUpdate = true; }
            if (vol.label) vol.label.visible = false;
            exclusionBoxes.push(vol);
            trackVolumeUndo(vol);
          }
          rebuildExclusionList();
        }

        // Trigger recompute for each active box
        if (hasActiveBox && elevationCropVolumes.length > 0) {
          setTimeout(function() {
            // Find first active box and compute
            for (var bi2 = 0; bi2 < elevationCropVolumes.length; bi2++) {
              var boxCfg = getBoxConfig(elevationCropVolumes[bi2]);
              if (boxCfg.active) {
                _selectedElevBox = elevationCropVolumes[bi2];
                syncElevGlobals();
                onComputeElevation();
                break;
              }
            }
          }, 300);
        }
      }

      // Clear undo stack from restore operations
      undoStack.length = 0;

      showToast('Session loaded');
    }

    function loadSessionFromFile() {
      var input = document.getElementById('session-file-input');
      if (!input) return;
      input.click();
    }

    // -- Inject sidebar buttons once GUI is ready --
    // ===== ELEVATION MAP — UTILITY FUNCTIONS =====

    // Force-load octree nodes. If filterAABB is provided, ONLY load nodes
    // whose bounding box intersects that AABB — critical for large clouds
    // (otherwise we load 26M+ points to compute a heat map on a small region).
    // Force-load octree nodes intersecting filterAABB. opts:
    //   maxDepth     — stop recursing past this octree depth (root = 0). The
    //                  major lever for web performance: each leaf node is one
    //                  HTTP request, and recursing to leaves over a CDN at
    //                  ~50ms RTT can mean thousands of requests for a "large
    //                  area". Capping at depth ~6 typically gives several
    //                  hundred thousand points — plenty for elevation/contour
    //                  analysis (200×200 grid) — at 5–10× fewer requests.
    //   maxPoints    — soft cap; once already-loaded in-AABB points exceed
    //                  this, deeper levels are skipped between polls. Acts as
    //                  a points-based ceiling on top of maxDepth. Default Inf.
    //   onProgress   — optional callback({loaded, target}) for status updates.
    function forceLoadAllNodes(pointCloud, filterAABB, opts) {
      opts = opts || {};
      var maxDepth = opts.maxDepth != null ? opts.maxDepth : Infinity;
      var maxPoints = opts.maxPoints != null ? opts.maxPoints : Infinity;
      var onProgress = opts.onProgress;
      return new Promise(function (resolve) {
        var geo = pointCloud.pcoGeometry;
        if (!geo || !geo.root) { resolve(); return; }
        var pcoOffset = geo.offset;
        function nodeIntersects(node) {
          if (!filterAABB) return true;
          if (!node.boundingBox) return true;
          var nbb = node.boundingBox;
          var wxmin = pcoOffset.x + nbb.min.x, wxmax = pcoOffset.x + nbb.max.x;
          var wymin = pcoOffset.y + nbb.min.y, wymax = pcoOffset.y + nbb.max.y;
          var wzmin = pcoOffset.z + nbb.min.z, wzmax = pcoOffset.z + nbb.max.z;
          return !(wxmax < filterAABB.min[0] || wxmin > filterAABB.max[0] ||
                   wymax < filterAABB.min[1] || wymin > filterAABB.max[1] ||
                   wzmax < filterAABB.min[2] || wzmin > filterAABB.max[2]);
        }
        function countLoadedPoints() {
          var n = 0;
          function visit(node) {
            if (!node || !nodeIntersects(node)) return;
            if (node.loaded && node.geometry && node.geometry.attributes.position) {
              n += node.geometry.attributes.position.count;
            }
            if (node.children) {
              for (var i = 0; i < 8; i++) if (node.children[i]) visit(node.children[i]);
            }
          }
          visit(geo.root);
          return n;
        }
        // BFS by level so depth and point-budget caps are easy to enforce.
        // Trigger loads on each in-AABB node up to maxDepth; stop early if
        // already-loaded points exceed maxPoints between levels.
        function triggerLoadsBFS() {
          var current = [geo.root];
          var depth = 0;
          while (current.length > 0 && depth <= maxDepth) {
            var next = [];
            for (var i = 0; i < current.length; i++) {
              var node = current[i];
              if (!node || !nodeIntersects(node)) continue;
              if (!node.loaded) node.load();
              if (node.children) {
                for (var j = 0; j < 8; j++) {
                  if (node.children[j]) next.push(node.children[j]);
                }
              }
            }
            current = next;
            depth++;
            if (countLoadedPoints() >= maxPoints) break;
          }
        }
        var origMax = Potree.maxNodesLoading || 4;
        // CDNs over HTTP/2 multiplex many streams over one connection; the
        // default cap of 4 (and previous bump to 20) leaves throughput on the
        // table during a force-load burst.
        Potree.maxNodesLoading = 60;
        triggerLoadsBFS();
        var poll = setInterval(function () {
          if (onProgress) {
            try { onProgress({ loaded: countLoadedPoints(), inFlight: Potree.numNodesLoading }); } catch (_) {}
          }
          if (Potree.numNodesLoading === 0) {
            clearInterval(poll);
            Potree.maxNodesLoading = origMax;
            resolve();
          }
        }, 200);
      });
    }

    // Extract loaded-node positions, optionally filtered to nodes that
    // intersect a given AABB. Nodes outside the filter are skipped entirely
    // to avoid allocating a 300MB merged buffer for points we'll never use.
    function extractPositions(pointCloud, filterAABB) {
      var geo = pointCloud.pcoGeometry;
      var allPositions = [];
      var nodeMap = [];
      var totalCount = 0;
      var pcoOffset = geo.offset;
      function nodeIntersects(node) {
        if (!filterAABB) return true;
        if (!node.boundingBox) return true;
        var nbb = node.boundingBox;
        var wxmin = pcoOffset.x + nbb.min.x, wxmax = pcoOffset.x + nbb.max.x;
        var wymin = pcoOffset.y + nbb.min.y, wymax = pcoOffset.y + nbb.max.y;
        var wzmin = pcoOffset.z + nbb.min.z, wzmax = pcoOffset.z + nbb.max.z;
        return !(wxmax < filterAABB.min[0] || wxmin > filterAABB.max[0] ||
                 wymax < filterAABB.min[1] || wymin > filterAABB.max[1] ||
                 wzmax < filterAABB.min[2] || wzmin > filterAABB.max[2]);
      }
      function traverse(node) {
        if (!node || !nodeIntersects(node)) return;
        if (node.loaded && node.geometry) {
          var posAttr = node.geometry.attributes.position;
          if (posAttr && posAttr.array) {
            var bbMin = node.boundingBox
              ? { x: node.boundingBox.min.x, y: node.boundingBox.min.y, z: node.boundingBox.min.z }
              : { x: 0, y: 0, z: 0 };
            nodeMap.push({ geometryNode: node, startIndex: totalCount, count: posAttr.count, bbMin: bbMin });
            totalCount += posAttr.count;
            allPositions.push({ array: posAttr.array, count: posAttr.count, bbMin: bbMin });
          }
        }
        if (node.children) {
          for (var i = 0; i < 8; i++) {
            if (node.children[i]) traverse(node.children[i]);
          }
        }
      }
      traverse(geo.root);
      var merged = new Float32Array(totalCount * 3);
      var writeOffset = 0;
      var pcoOffset = geo.offset;
      var ox = pcoOffset.x, oy = pcoOffset.y, oz = pcoOffset.z;
      for (var n = 0; n < allPositions.length; n++) {
        var arr = allPositions[n].array;
        var cnt = allPositions[n].count;
        var bb = allPositions[n].bbMin;
        var tx = ox + bb.x, ty = oy + bb.y, tz = oz + bb.z;
        for (var i = 0; i < cnt; i++) {
          merged[writeOffset]     = arr[i * 3]     + tx;
          merged[writeOffset + 1] = arr[i * 3 + 1] + ty;
          merged[writeOffset + 2] = arr[i * 3 + 2] + tz;
          writeOffset += 3;
        }
      }
      return { positions: merged, count: totalCount, nodeMap: nodeMap };
    }

    function backupOriginalRGBA(pointCloud) {
      var map = new Map();
      var geo = pointCloud.pcoGeometry;
      function traverse(node) {
        if (!node) return;
        if (node.loaded && node.geometry) {
          var rgba = node.geometry.attributes.rgba;
          if (rgba && rgba.array) map.set(node, new Uint8Array(rgba.array));
        }
        if (node.children) {
          for (var i = 0; i < 8; i++) {
            if (node.children[i]) traverse(node.children[i]);
          }
        }
      }
      traverse(geo.root);
      return map;
    }

    function restoreOriginalRGBA(backupMap) {
      if (!backupMap) return;
      backupMap.forEach(function (origArray, node) {
        if (node.geometry && node.geometry.attributes.rgba) {
          var rgba = node.geometry.attributes.rgba;
          rgba.array.set(origArray);
          rgba.needsUpdate = true;
        }
      });
    }

    // Sequential color ramp: blue → cyan → green → yellow → red
    function elevationToRGBA(z, zMin, zMax) {
      var range = zMax - zMin;
      if (range < 1e-6) return [128, 128, 128, 255];
      var t = (z - zMin) / range;
      t = Math.max(0, Math.min(1, t));

      var r, g, b;
      if (t < 0.25) {
        var s = t / 0.25;
        r = 0;
        g = Math.round(255 * s);
        b = 255;
      } else if (t < 0.5) {
        var s = (t - 0.25) / 0.25;
        r = 0;
        g = 255;
        b = Math.round(255 * (1 - s));
      } else if (t < 0.75) {
        var s = (t - 0.5) / 0.25;
        r = Math.round(255 * s);
        g = 255;
        b = 0;
      } else {
        var s = (t - 0.75) / 0.25;
        r = 255;
        g = Math.round(255 * (1 - s));
        b = 0;
      }
      return [r, g, b, 255];
    }

    function getCropBoxBounds(volume) {
      if (!volume) return null;
      volume.updateMatrixWorld(true);
      var mat = volume.matrixWorld;
      var corners = [
        new THREE.Vector3(-0.5, -0.5, -0.5), new THREE.Vector3( 0.5, -0.5, -0.5),
        new THREE.Vector3(-0.5,  0.5, -0.5), new THREE.Vector3( 0.5,  0.5, -0.5),
        new THREE.Vector3(-0.5, -0.5,  0.5), new THREE.Vector3( 0.5, -0.5,  0.5),
        new THREE.Vector3(-0.5,  0.5,  0.5), new THREE.Vector3( 0.5,  0.5,  0.5)
      ];
      var min = new THREE.Vector3(Infinity, Infinity, Infinity);
      var max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
      for (var i = 0; i < corners.length; i++) {
        corners[i].applyMatrix4(mat);
        min.min(corners[i]);
        max.max(corners[i]);
      }
      return { min: [min.x, min.y, min.z], max: [max.x, max.y, max.z] };
    }

    // Get the union AABB of all active elevation crop volumes
    function getElevationCropBounds() {
      var active = elevationCropVolumes.filter(function(v) { return !v._disabled; });
      if (active.length === 0) return null;
      var min = new THREE.Vector3(Infinity, Infinity, Infinity);
      var max = new THREE.Vector3(-Infinity, -Infinity, -Infinity);
      for (var b = 0; b < active.length; b++) {
        var bounds = getCropBoxBounds(active[b]);
        if (!bounds) continue;
        min.x = Math.min(min.x, bounds.min[0]); min.y = Math.min(min.y, bounds.min[1]); min.z = Math.min(min.z, bounds.min[2]);
        max.x = Math.max(max.x, bounds.max[0]); max.y = Math.max(max.y, bounds.max[1]); max.z = Math.max(max.z, bounds.max[2]);
      }
      return { min: [min.x, min.y, min.z], max: [max.x, max.y, max.z] };
    }

    // Check if a point is inside ANY active elevation crop volume (exact OBB test)
    // Pre-compute inverse matrices for elevation crop volumes (call once before loop)
    function buildElevationInvMats() {
      var mats = [];
      for (var b = 0; b < elevationCropVolumes.length; b++) {
        var vol = elevationCropVolumes[b];
        if (vol._disabled) continue;
        vol.updateMatrixWorld(true);
        mats.push(new THREE.Matrix4().copy(vol.matrixWorld).invert());
      }
      return mats;
    }

    // Check point against pre-computed inverse matrices
    function isInsideAnyElevationBoxFast(px, py, pz, elevInvMats) {
      var v = new THREE.Vector3();
      for (var b = 0; b < elevInvMats.length; b++) {
        v.set(px, py, pz).applyMatrix4(elevInvMats[b]);
        if (v.x >= -0.5 && v.x <= 0.5 &&
            v.y >= -0.5 && v.y <= 0.5 &&
            v.z >= -0.5 && v.z <= 0.5) return true;
      }
      return false;
    }

    // Legacy wrapper (used in per-frame recolor for single nodes)
    function isInsideAnyElevationBox(px, py, pz) {
      var mats = buildElevationInvMats();
      return isInsideAnyElevationBoxFast(px, py, pz, mats);
    }

    // Build a 2D grid of max-Z values for top-surface detection
    function buildSurfaceGrid(positions, cropBounds, gridRes) {
      gridRes = gridRes || 200;
      var xMin = cropBounds ? cropBounds.min[0] : Infinity;
      var xMax = cropBounds ? cropBounds.max[0] : -Infinity;
      var yMin = cropBounds ? cropBounds.min[1] : Infinity;
      var yMax = cropBounds ? cropBounds.max[1] : -Infinity;

      // If no crop bounds, compute from positions
      if (!cropBounds) {
        var count = positions.length / 3;
        for (var i = 0; i < count; i++) {
          var px = positions[i * 3], py = positions[i * 3 + 1];
          if (px < xMin) xMin = px; if (px > xMax) xMax = px;
          if (py < yMin) yMin = py; if (py > yMax) yMax = py;
        }
      }

      var xRange = xMax - xMin, yRange = yMax - yMin;
      if (xRange < 1e-6 || yRange < 1e-6) return null;
      var cellX = xRange / gridRes, cellY = yRange / gridRes;

      var maxZ = new Float32Array(gridRes * gridRes);
      for (var i = 0; i < maxZ.length; i++) maxZ[i] = -Infinity;

      var count = positions.length / 3;
      for (var i = 0; i < count; i++) {
        var px = positions[i * 3], py = positions[i * 3 + 1], pz = positions[i * 3 + 2];
        if (cropBounds) {
          if (px < cropBounds.min[0] || px > cropBounds.max[0] ||
              py < cropBounds.min[1] || py > cropBounds.max[1] ||
              pz < cropBounds.min[2] || pz > cropBounds.max[2]) continue;
        }
        var ix = Math.floor((px - xMin) / cellX);
        var iy = Math.floor((py - yMin) / cellY);
        if (ix >= gridRes) ix = gridRes - 1;
        if (iy >= gridRes) iy = gridRes - 1;
        if (ix < 0) ix = 0; if (iy < 0) iy = 0;
        var idx = iy * gridRes + ix;
        if (pz > maxZ[idx]) maxZ[idx] = pz;
      }

      return { maxZ: maxZ, gridRes: gridRes, xMin: xMin, yMin: yMin, cellX: cellX, cellY: cellY };
    }

    // Check if a point is on the top surface (within tolerance of max Z in its grid cell)
    function isTopSurface(px, py, pz, surfGrid, tolerance) {
      if (!surfGrid) return true;
      var ix = Math.floor((px - surfGrid.xMin) / surfGrid.cellX);
      var iy = Math.floor((py - surfGrid.yMin) / surfGrid.cellY);
      if (ix < 0 || iy < 0 || ix >= surfGrid.gridRes || iy >= surfGrid.gridRes) return false;
      var cellMaxZ = surfGrid.maxZ[iy * surfGrid.gridRes + ix];
      if (cellMaxZ === -Infinity) return false;
      return pz >= cellMaxZ - tolerance;
    }

    // Build the per-box draw list used by the heat-map coloring pipeline.
    // Each entry has the inverse matrix, config, tolerance, and resolved zMin/zMax (user or cfg auto).
    function buildActiveBoxDrawList() {
      var list = [];
      for (var i = 0; i < elevationCropVolumes.length; i++) {
        var vol = elevationCropVolumes[i];
        if (vol._disabled) continue;
        var cfg = getBoxConfig(vol);
        if (!cfg.active) continue;
        if (cfg.heatmapHidden) continue;
        if (cfg.zMin == null || cfg.zMax == null || cfg.zMin >= cfg.zMax) continue;
        vol.updateMatrixWorld(true);
        // Surface-filter tolerance: Z mode and Plane mode have zMin/zMax in
        // the same SPATIAL units the surface grid is built in, so 10% of
        // their range is a sensible tolerance. Thickness mode's zMin/zMax
        // are THICKNESS values (~10s of cm) and cfg.surfaceGrid is in Z
        // space, so 10% of thickness range is far too tight (rejects the
        // whole top surface). Use a fixed slab-friendly Z tolerance instead.
        var tol = (cfg.mode === 'thickness')
          ? 0.10  // 100mm — generous for slab top-surface variation
          : (cfg.zMax - cfg.zMin) * 0.10;
        // Hoist per-box mode constants once so the per-point loops in
        // applyElevationColors / colorNodeByElevation don't re-resolve
        // them N times.
        var entry = {
          invMat: new THREE.Matrix4().copy(vol.matrixWorld).invert(),
          cfg: cfg,
          tolerance: tol,
          mode: cfg.mode || 'z'
        };
        if (entry.mode === 'plane' && cfg.refPlane) {
          entry.pNx = cfg.refPlane.normal.x;
          entry.pNy = cfg.refPlane.normal.y;
          entry.pNz = cfg.refPlane.normal.z;
          entry.pCx = cfg.refPlane.centroid.x;
          entry.pCy = cfg.refPlane.centroid.y;
          entry.pCz = cfg.refPlane.centroid.z;
          entry.pSide = cfg.refSide || 1;
        } else if (entry.mode !== 'thickness') {
          entry.zBaseZ = getZBaseZ(cfg);
        }
        list.push(entry);
      }
      return list;
    }

    function applyElevationColors(positions, nodeMap) {
      var boxes = buildActiveBoxDrawList();
      var exclInvMats = buildExclusionInvMats();
      var hasExclusions = exclInvMats.length > 0;
      var v = new THREE.Vector3();

      for (var n = 0; n < nodeMap.length; n++) {
        var entry = nodeMap[n];
        var node = entry.geometryNode;
        if (!node.geometry || !node.geometry.attributes.rgba) continue;
        // Tag the BufferGeometry (not the node) so we can detect when Potree
        // streams a node out and back in: re-streamed nodes get a fresh
        // geometry without this tag, so elevationFrameUpdate will re-color.
        if (!node.geometry.userData) node.geometry.userData = {};
        node.geometry.userData.elevColored = true;
        var rgba = node.geometry.attributes.rgba;
        var arr = rgba.array;
        var start = entry.startIndex;
        var count = entry.count;
        var origArr = elevationOrigRGBA ? elevationOrigRGBA.get(node) : null;

        for (var i = 0; i < count; i++) {
          var globalIdx = start + i;
          var px = positions[globalIdx * 3];
          var py = positions[globalIdx * 3 + 1];
          var pz = positions[globalIdx * 3 + 2];
          var off = i * 4;

          // Find the FIRST active box that contains this point (boxes are independent; first wins on overlap)
          var hitBox = null;
          for (var b = 0; b < boxes.length; b++) {
            v.set(px, py, pz).applyMatrix4(boxes[b].invMat);
            if (v.x >= -0.5 && v.x <= 0.5 &&
                v.y >= -0.5 && v.y <= 0.5 &&
                v.z >= -0.5 && v.z <= 0.5) { hitBox = boxes[b]; break; }
          }

          var keep = !!hitBox;
          if (keep) {
            var cfg = hitBox.cfg;
            // Top-surface check against THIS box's surface grid
            if (cfg.planeSurfGrid) {
              if (!isPlaneTopSurface(px, py, pz, cfg.planeSurfGrid, hitBox.tolerance)) keep = false;
            } else if (cfg.surfaceGrid) {
              if (!isTopSurface(px, py, pz, cfg.surfaceGrid, hitBox.tolerance)) keep = false;
            }
            if (keep && hasExclusions && isPointExcluded(px, py, pz, exclInvMats)) keep = false;
          }

          if (!keep) {
            if (origArr) {
              arr[off]     = origArr[off];
              arr[off + 1] = origArr[off + 1];
              arr[off + 2] = origArr[off + 2];
              arr[off + 3] = origArr[off + 3];
            }
          } else {
            var cfg2 = hitBox.cfg;
            var elev;
            if (hitBox.mode === 'plane') {
              elev = ((px - hitBox.pCx) * hitBox.pNx + (py - hitBox.pCy) * hitBox.pNy + (pz - hitBox.pCz) * hitBox.pNz) * hitBox.pSide;
            } else if (hitBox.mode === 'thickness') {
              elev = getThicknessForPoint(px, py, pz, cfg2.thicknessGrid);
            } else {
              elev = pz - hitBox.zBaseZ;
            }
            if (elev === null) {
              // Thickness lookup said this point isn't on the slab — restore original
              if (origArr) {
                arr[off]     = origArr[off];
                arr[off + 1] = origArr[off + 1];
                arr[off + 2] = origArr[off + 2];
                arr[off + 3] = origArr[off + 3];
              }
            } else {
              var color = elevationToRGBA(elev, cfg2.zMin, cfg2.zMax);
              arr[off]     = color[0];
              arr[off + 1] = color[1];
              arr[off + 2] = color[2];
              arr[off + 3] = color[3];
            }
          }
        }
        rgba.needsUpdate = true;
      }
    }

    // Color a single geometry node by elevation (for newly loaded nodes during zoom).
    // Optional `cachedBoxes` and `cachedExcl` skip the rebuilds — pass them when
    // coloring multiple nodes in one frame so we don't re-walk the volume lists
    // for every node.
    function colorNodeByElevation(node, pc, cachedBoxes, cachedExcl) {
      if (!node.geometry || !node.geometry.attributes.rgba || !node.geometry.attributes.position) return;
      // Mark this geometry as colored (per-geometry, so re-streamed nodes will
      // be re-colored automatically because their fresh BufferGeometry won't
      // have this flag set).
      if (!node.geometry.userData) node.geometry.userData = {};
      node.geometry.userData.elevColored = true;
      var posAttr = node.geometry.attributes.position;
      var rgba = node.geometry.attributes.rgba;
      var arr = rgba.array;
      var geo = pc.pcoGeometry;
      var pcoOffset = geo.offset;
      var bbMin = node.boundingBox
        ? { x: node.boundingBox.min.x, y: node.boundingBox.min.y, z: node.boundingBox.min.z }
        : { x: 0, y: 0, z: 0 };
      var tx = pcoOffset.x + bbMin.x;
      var ty = pcoOffset.y + bbMin.y;
      var tz = pcoOffset.z + bbMin.z;
      var boxes = cachedBoxes || buildActiveBoxDrawList();
      var exclInvMats = cachedExcl || buildExclusionInvMats();
      var hasExclusions = exclInvMats.length > 0;
      var v = new THREE.Vector3();

      // Back up original RGBA for this node if not already saved
      if (elevationOrigRGBA && !elevationOrigRGBA.has(node)) {
        elevationOrigRGBA.set(node, new Uint8Array(arr));
      }
      var origArr = elevationOrigRGBA ? elevationOrigRGBA.get(node) : null;

      for (var i = 0; i < posAttr.count; i++) {
        var px = posAttr.array[i * 3] + tx;
        var py = posAttr.array[i * 3 + 1] + ty;
        var pz = posAttr.array[i * 3 + 2] + tz;
        var off = i * 4;

        var hitBox = null;
        for (var b = 0; b < boxes.length; b++) {
          v.set(px, py, pz).applyMatrix4(boxes[b].invMat);
          if (v.x >= -0.5 && v.x <= 0.5 &&
              v.y >= -0.5 && v.y <= 0.5 &&
              v.z >= -0.5 && v.z <= 0.5) { hitBox = boxes[b]; break; }
        }

        var keep = !!hitBox;
        if (keep) {
          var cfg = hitBox.cfg;
          if (cfg.planeSurfGrid) {
            if (!isPlaneTopSurface(px, py, pz, cfg.planeSurfGrid, hitBox.tolerance)) keep = false;
          } else if (cfg.surfaceGrid) {
            if (!isTopSurface(px, py, pz, cfg.surfaceGrid, hitBox.tolerance)) keep = false;
          }
          if (keep && hasExclusions && isPointExcluded(px, py, pz, exclInvMats)) keep = false;
        }

        if (keep) {
          var cfg2 = hitBox.cfg;
          var elev;
          if (hitBox.mode === 'plane') {
            elev = ((px - hitBox.pCx) * hitBox.pNx + (py - hitBox.pCy) * hitBox.pNy + (pz - hitBox.pCz) * hitBox.pNz) * hitBox.pSide;
          } else if (hitBox.mode === 'thickness') {
            elev = getThicknessForPoint(px, py, pz, cfg2.thicknessGrid);
          } else {
            elev = pz - hitBox.zBaseZ;
          }
          if (elev === null) {
            keep = false;
          } else {
            var color = elevationToRGBA(elev, cfg2.zMin, cfg2.zMax);
            arr[off] = color[0]; arr[off + 1] = color[1];
            arr[off + 2] = color[2]; arr[off + 3] = color[3];
          }
        }
        if (!keep && origArr) {
          arr[off] = origArr[off]; arr[off + 1] = origArr[off + 1];
          arr[off + 2] = origArr[off + 2]; arr[off + 3] = origArr[off + 3];
        }
      }
      rgba.needsUpdate = true;
    }

    // Per-frame check: color any newly loaded nodes
    // Throttle: only run a full octree walk when Potree has loaded a new node
    // since our last pass. Without this we walk the whole tree every frame
    // (60 FPS × hundreds of nodes), which dominates the per-frame budget on
    // large clouds and inflates memory through repeated allocations.
    var _elevWasLoading = false;
    var _elevPrevLoadingCount = 0;

    function elevationFrameUpdate() {
      if (!elevationActive) return;
      var pc = viewer.scene.pointclouds[0];
      if (!pc || !pc.pcoGeometry || !pc.pcoGeometry.root) return;

      // Run only when Potree is actively streaming nodes, OR for one frame
      // after streaming finishes (to catch the just-finished load). Skipping
      // entirely otherwise drops elevation per-frame cost to ~zero.
      var nl = (typeof Potree !== 'undefined' && Potree.numNodesLoading) || 0;
      var streamFinishedThisFrame = (_elevWasLoading && nl === 0);
      if (nl === 0 && !streamFinishedThisFrame) {
        _elevPrevLoadingCount = nl;
        return;
      }
      _elevWasLoading = (nl > 0);
      _elevPrevLoadingCount = nl;

      // Collect uncolored loaded nodes first; compute per-frame caches once
      // and pass them in so we don't rebuild the active-box / exclusion lists
      // for every single node coloured this frame.
      var newNodes = [];
      function gather(node) {
        if (!node) return;
        if (node.loaded && node.geometry) {
          var ud = node.geometry.userData;
          if (!ud || !ud.elevColored) newNodes.push(node);
        }
        if (node.children) {
          for (var i = 0; i < 8; i++) {
            if (node.children[i]) gather(node.children[i]);
          }
        }
      }
      gather(pc.pcoGeometry.root);
      if (newNodes.length === 0) return;

      var cachedBoxes = buildActiveBoxDrawList();
      var cachedExcl = buildExclusionInvMats();
      for (var i = 0; i < newNodes.length; i++) {
        elevationColoredNodes.add(newNodes[i]);
        colorNodeByElevation(newNodes[i], pc, cachedBoxes, cachedExcl);
      }
    }

    function updateElevationLegend(zMin, zMax) {
      var canvas = document.getElementById('heatmap-legend-canvas');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');
      var w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      var barX = 100, barW = 40, barTop = 60, barBot = h - 20;
      var barH = barBot - barTop;

      // Draw gradient bar: top = high (red), bottom = low (blue)
      for (var y = 0; y < barH; y++) {
        var t = 1 - (y / barH); // top=1, bottom=0
        var color = elevationToRGBA(zMin + t * (zMax - zMin), zMin, zMax);
        ctx.fillStyle = 'rgb(' + color[0] + ',' + color[1] + ',' + color[2] + ')';
        ctx.fillRect(barX, barTop + y, barW, 1);
      }

      ctx.strokeStyle = '#aaa';
      ctx.lineWidth = 1;
      ctx.strokeRect(barX, barTop, barW, barH);

      // Use the contour step for legend ticks so they match contour lines
      var range = zMax - zMin;
      var step = elevationContourStep;
      // If step would give too many ticks on the legend, use multiples
      var nTicks = Math.floor(range / step);
      var legendStep = step;
      if (nTicks > 12) {
        var mult = Math.ceil(nTicks / 8);
        legendStep = step * mult;
      }

      // Determine decimal places from step
      var decimals = 0;
      if (legendStep < 0.01) decimals = 3;
      else if (legendStep < 0.1) decimals = 2;
      else if (legendStep < 1) decimals = 1;

      var tickLen = 6;
      var labelRight = barX - 8;

      // Draw ticks with labels on the LEFT side of the bar, right-justified
      ctx.font = '16px sans-serif';
      ctx.textBaseline = 'middle';

      var firstTick = Math.ceil(zMin / legendStep) * legendStep;
      for (var v = firstTick; v <= zMax + legendStep * 0.01; v += legendStep) {
        if (v < zMin || v > zMax) continue;
        var t = (v - zMin) / range;
        var yPos = barTop + barH * (1 - t);

        // Tick line
        ctx.strokeStyle = '#ccc';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(barX - tickLen, yPos);
        ctx.lineTo(barX, yPos);
        ctx.stroke();

        // Label
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'right';
        ctx.fillText(v.toFixed(decimals), labelRight, yPos);
      }

      // Title
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      var centerX = (labelRight + barX + barW) / 2;
      if (elevationMode === 'plane') {
        ctx.fillText('Deviation', centerX, 18);
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText('(m)', centerX, 40);
      } else {
        ctx.fillText('Elevation', centerX, 18);
        ctx.font = 'bold 18px sans-serif';
        ctx.fillText('(m)', centerX, 40);
      }

      document.getElementById('heatmap-legend').style.display = 'block';
    }

    function hideElevationLegend() {
      var el = document.getElementById('heatmap-legend');
      if (el) el.style.display = 'none';
    }

    // ===== ELEVATION MAP — CONTOUR LINES =====

    function smallestEigenvector3x3_local(a00, a01, a02, a11, a12, a22) {
      var trace = a00 + a11 + a22;
      var q = trace / 3;
      var b00 = a00 - q, b11 = a11 - q, b22 = a22 - q;
      var p2 = b00*b00 + b11*b11 + b22*b22 + 2*(a01*a01 + a02*a02 + a12*a12);
      var p = Math.sqrt(p2 / 6);
      if (p < 1e-15) return [0, 0, 1];
      var invP = 1/p;
      var B00=b00*invP, B01=a01*invP, B02=a02*invP;
      var B11=b11*invP, B12=a12*invP, B22=b22*invP;
      var detB = B00*(B11*B22-B12*B12) - B01*(B01*B22-B12*B02) + B02*(B01*B12-B11*B02);
      var halfDetB = Math.max(-1, Math.min(1, detB/2));
      var phi = Math.acos(halfDetB)/3;
      var lambda0 = q + 2*p*Math.cos(phi + 2*Math.PI/3);
      var m00=a00-lambda0, m01x=a01, m02x=a02;
      var m10=a01, m11x=a11-lambda0, m12x=a12;
      var m20=a02, m21=a12, m22x=a22-lambda0;
      var nx = m01x*m12x - m02x*m11x;
      var ny = m02x*m10 - m00*m12x;
      var nz = m00*m11x - m01x*m10;
      var len = Math.sqrt(nx*nx+ny*ny+nz*nz);
      if (len < 1e-12) {
        nx=m01x*m22x-m02x*m21; ny=m02x*m20-m00*m22x; nz=m00*m21-m01x*m20;
        len = Math.sqrt(nx*nx+ny*ny+nz*nz);
      }
      if (len < 1e-12) {
        nx=m11x*m22x-m12x*m21; ny=m12x*m20-m10*m22x; nz=m10*m21-m11x*m20;
        len = Math.sqrt(nx*nx+ny*ny+nz*nz);
      }
      if (len < 1e-12) return [0, 0, 1];
      return [nx/len, ny/len, nz/len];
    }

    function marchingSquares(grid, cols, rows, level) {
      var segments = [];
      function msLerp(va, vb) {
        if (Math.abs(vb - va) < 1e-10) return 0.5;
        return (level - va) / (vb - va);
      }
      for (var r = 0; r < rows - 1; r++) {
        for (var c = 0; c < cols - 1; c++) {
          var v00 = grid[r * cols + c];
          var v10 = grid[r * cols + c + 1];
          var v01 = grid[(r + 1) * cols + c];
          var v11 = grid[(r + 1) * cols + c + 1];
          if (isNaN(v00) || isNaN(v10) || isNaN(v01) || isNaN(v11)) continue;
          var b00 = v00 >= level ? 1 : 0;
          var b10 = v10 >= level ? 1 : 0;
          var b01 = v01 >= level ? 1 : 0;
          var b11 = v11 >= level ? 1 : 0;
          var idx = b00 | (b10 << 1) | (b01 << 2) | (b11 << 3);
          if (idx === 0 || idx === 15) continue;
          var bottom = [c + msLerp(v00, v10), r];
          var top    = [c + msLerp(v01, v11), r + 1];
          var left   = [c, r + msLerp(v00, v01)];
          var right  = [c + 1, r + msLerp(v10, v11)];
          switch (idx) {
            case 1:  segments.push([bottom[0], bottom[1], left[0], left[1]]); break;
            case 2:  segments.push([bottom[0], bottom[1], right[0], right[1]]); break;
            case 3:  segments.push([left[0], left[1], right[0], right[1]]); break;
            case 4:  segments.push([left[0], left[1], top[0], top[1]]); break;
            case 5:  segments.push([bottom[0], bottom[1], top[0], top[1]]); break;
            case 6:
              var avg = (v00 + v10 + v01 + v11) / 4;
              if (avg >= level) {
                segments.push([bottom[0], bottom[1], left[0], left[1]]);
                segments.push([right[0], right[1], top[0], top[1]]);
              } else {
                segments.push([bottom[0], bottom[1], right[0], right[1]]);
                segments.push([left[0], left[1], top[0], top[1]]);
              }
              break;
            case 7:  segments.push([right[0], right[1], top[0], top[1]]); break;
            case 8:  segments.push([right[0], right[1], top[0], top[1]]); break;
            case 9:
              var avg = (v00 + v10 + v01 + v11) / 4;
              if (avg >= level) {
                segments.push([bottom[0], bottom[1], right[0], right[1]]);
                segments.push([left[0], left[1], top[0], top[1]]);
              } else {
                segments.push([bottom[0], bottom[1], left[0], left[1]]);
                segments.push([right[0], right[1], top[0], top[1]]);
              }
              break;
            case 10: segments.push([bottom[0], bottom[1], top[0], top[1]]); break;
            case 11: segments.push([left[0], left[1], top[0], top[1]]); break;
            case 12: segments.push([left[0], left[1], right[0], right[1]]); break;
            case 13: segments.push([bottom[0], bottom[1], right[0], right[1]]); break;
            case 14: segments.push([bottom[0], bottom[1], left[0], left[1]]); break;
          }
        }
      }
      return segments;
    }

    function createContourLabel(text, color) {
      var canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 48;
      var ctx = canvas.getContext('2d');

      // Background pill (matches temporal viewer)
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(2, 2, canvas.width - 4, canvas.height - 4, 8);
      } else {
        ctx.rect(2, 2, canvas.width - 4, canvas.height - 4);
      }
      ctx.fill();

      // Text
      ctx.fillStyle = color;
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);

      var texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      var material = new THREE.SpriteMaterial({ map: texture, depthTest: true, depthWrite: false, transparent: true, sizeAttenuation: true });
      var sprite = new THREE.Sprite(material);
      sprite.scale.set(0.15, 0.06, 1); // overridden by caller based on scan size
      sprite.raycast = function () {};
      return sprite;
    }

    // Remove a single box's contour group (or all if no box given)
    function disposeContourGroup(group) {
      if (!group) return;
      group.traverse(function(obj) {
        if (obj.geometry) obj.geometry.dispose();
        if (obj.material) {
          if (obj.material.map) obj.material.map.dispose();
          obj.material.dispose();
        }
      });
      elevationScene.remove(group);
    }

    function clearElevationContours() {
      // Clear all per-box contour groups
      for (var i = 0; i < elevationCropVolumes.length; i++) {
        var cfg = getBoxConfig(elevationCropVolumes[i]);
        if (cfg.contourGroup) {
          disposeContourGroup(cfg.contourGroup);
          cfg.contourGroup = null;
          cfg.contoursVisible = false;
        }
      }
      // Also remove any stray children
      while (elevationScene.children.length > 0) {
        disposeContourGroup(elevationScene.children[0]);
      }
      elevationContoursVisible = false;
    }

    // Build contour lines for a SINGLE elevation box into its own THREE.Group.
    function buildBoxContours(volume) {
      var cfg = getBoxConfig(volume);
      if (!cfg.active || !elevationPositions) return;
      if (cfg.contourGroup) {
        disposeContourGroup(cfg.contourGroup);
        cfg.contourGroup = null;
      }
      var group = new THREE.Group();
      group.userData.elevBox = volume;
      _contourBuildTarget = group;
      try {
        buildElevationContours(elevationPositions, cfg.zMin, cfg.zMax, cfg.cropBounds, cfg);
      } finally {
        _contourBuildTarget = null;
      }
      if (group.children.length > 0) {
        elevationScene.add(group);
        cfg.contourGroup = group;
        cfg.contoursVisible = true;
        elevationContoursVisible = true;
      }
    }

    var _contourBuildTarget = null;

    function buildElevationContours(positions, zMin, zMax, cropBounds, boxCfg) {
      // If called without an explicit target group, keep legacy behavior (clear + rebuild into scene)
      var target = _contourBuildTarget;
      if (!target) {
        clearElevationContours();
        target = elevationScene;
      }
      var tolerance = (zMax - zMin) * 0.10;

      // Resolve box context — prefer explicit boxCfg, fall back to globals for legacy callers
      var mode = boxCfg ? boxCfg.mode : elevationMode;
      var refPlane = boxCfg ? boxCfg.refPlane : elevationRefPlane;
      var refSide = boxCfg ? boxCfg.refSide : elevationRefSide;
      var surfGrid = boxCfg ? boxCfg.surfaceGrid : elevationSurfaceGrid;
      var planeSurfGrid = boxCfg ? boxCfg.planeSurfGrid : elevationPlaneSurfGrid;
      var step = boxCfg ? boxCfg.contourStep : elevationContourStep;

      // Collect only top-surface points inside the box's OBB, excluding exclusion zones
      var exclInvMats = buildExclusionInvMats();
      var hasExclusions = exclInvMats.length > 0;
      var boxInv = null;
      if (boxCfg && _contourBuildTarget && _contourBuildTarget.userData && _contourBuildTarget.userData.elevBox) {
        var vol = _contourBuildTarget.userData.elevBox;
        vol.updateMatrixWorld(true);
        boxInv = new THREE.Matrix4().copy(vol.matrixWorld).invert();
      }
      var pts = [];
      var count = positions.length / 3;
      var _v = new THREE.Vector3();
      for (var i = 0; i < count; i++) {
        var px = positions[i * 3];
        var py = positions[i * 3 + 1];
        var pz = positions[i * 3 + 2];
        if (boxInv) {
          _v.set(px, py, pz).applyMatrix4(boxInv);
          if (_v.x < -0.5 || _v.x > 0.5 || _v.y < -0.5 || _v.y > 0.5 || _v.z < -0.5 || _v.z > 0.5) continue;
        } else if (cropBounds) {
          if (px < cropBounds.min[0] || px > cropBounds.max[0] ||
              py < cropBounds.min[1] || py > cropBounds.max[1] ||
              pz < cropBounds.min[2] || pz > cropBounds.max[2]) continue;
        }
        if (planeSurfGrid) {
          if (!isPlaneTopSurface(px, py, pz, planeSurfGrid, tolerance)) continue;
        } else if (surfGrid) {
          if (!isTopSurface(px, py, pz, surfGrid, tolerance)) continue;
        }
        if (hasExclusions && isPointExcluded(px, py, pz, exclInvMats)) continue;
        var elevVal;
        if (mode === 'plane' && refPlane) {
          var nn = refPlane.normal, cc = refPlane.centroid;
          var ss = refSide || 1;
          elevVal = ((px - cc.x) * nn.x + (py - cc.y) * nn.y + (pz - cc.z) * nn.z) * ss;
        } else if (mode === 'thickness' && boxCfg && boxCfg.thicknessGrid) {
          var tval = getThicknessForPoint(px, py, pz, boxCfg.thicknessGrid);
          if (tval === null) continue;
          elevVal = tval;
        } else {
          elevVal = pz - (boxCfg ? getZBaseZ(boxCfg) : 0);
        }
        pts.push({ x: px, y: py, z: pz, elev: elevVal });
      }

      if (pts.length < 100) { showToast('Too few points for contours'); return; }

      // Find dominant surface plane — use reference plane in plane deviation mode, PCA otherwise
      var cx = 0, cy = 0, cz = 0;
      for (var i = 0; i < pts.length; i++) {
        cx += pts[i].x; cy += pts[i].y; cz += pts[i].z;
      }
      cx /= pts.length; cy /= pts.length; cz /= pts.length;

      var N, U, V;
      if (mode === 'plane' && planeSurfGrid) {
        // Use the reference plane's axes — contours project from the plane normal direction
        N = planeSurfGrid.N.clone();
        U = planeSurfGrid.U.clone();
        V = planeSurfGrid.V.clone();
      } else {
        var cxx = 0, cxy = 0, cxz = 0, cyy = 0, cyz = 0, czz = 0;
        for (var i = 0; i < pts.length; i++) {
          var dx = pts[i].x - cx, dy = pts[i].y - cy, dz = pts[i].z - cz;
          cxx += dx * dx; cxy += dx * dy; cxz += dx * dz;
          cyy += dy * dy; cyz += dy * dz; czz += dz * dz;
        }
        var normal = smallestEigenvector3x3_local(cxx, cxy, cxz, cyy, cyz, czz);
        var absNx = Math.abs(normal[0]), absNy = Math.abs(normal[1]), absNz = Math.abs(normal[2]);
        var up;
        if (absNz > absNx && absNz > absNy) up = new THREE.Vector3(1, 0, 0);
        else if (absNy > absNx) up = new THREE.Vector3(1, 0, 0);
        else up = new THREE.Vector3(0, 1, 0);
        N = new THREE.Vector3(normal[0], normal[1], normal[2]);
        U = new THREE.Vector3().crossVectors(up, N).normalize();
        V = new THREE.Vector3().crossVectors(N, U).normalize();
      }

      // Project onto UV plane
      var uMin = Infinity, uMax = -Infinity, vMin = Infinity, vMax = -Infinity;
      for (var i = 0; i < pts.length; i++) {
        var dx = pts[i].x - cx, dy = pts[i].y - cy, dz = pts[i].z - cz;
        pts[i].u = dx * U.x + dy * U.y + dz * U.z;
        pts[i].v = dx * V.x + dy * V.y + dz * V.z;
        if (pts[i].u < uMin) uMin = pts[i].u; if (pts[i].u > uMax) uMax = pts[i].u;
        if (pts[i].v < vMin) vMin = pts[i].v; if (pts[i].v > vMax) vMax = pts[i].v;
      }

      var gridRes = 100;
      var uRange = uMax - uMin, vRange = vMax - vMin;
      if (uRange < 0.001 || vRange < 0.001) return;
      var cellU = uRange / gridRes, cellV = vRange / gridRes;

      // Grid: use max Z per cell (top surface only)
      var gridMax = new Float32Array(gridRes * gridRes);
      var gridCount = new Uint16Array(gridRes * gridRes);
      var gridN = new Float32Array(gridRes * gridRes);
      var gridNCount = new Uint16Array(gridRes * gridRes);
      for (var i = 0; i < gridMax.length; i++) gridMax[i] = -Infinity;

      for (var i = 0; i < pts.length; i++) {
        var iu = Math.floor((pts[i].u - uMin) / cellU);
        var iv = Math.floor((pts[i].v - vMin) / cellV);
        if (iu >= gridRes) iu = gridRes - 1;
        if (iv >= gridRes) iv = gridRes - 1;
        var idx = iv * gridRes + iu;
        gridCount[idx]++;
        // Use average Z of top-surface points (already filtered)
        if (gridMax[idx] === -Infinity) gridMax[idx] = 0;
        gridMax[idx] += pts[i].elev;
        var dx = pts[i].x - cx, dy = pts[i].y - cy, dz = pts[i].z - cz;
        gridN[idx] += dx * N.x + dy * N.y + dz * N.z;
        gridNCount[idx]++;
      }

      var gridAvg = new Float32Array(gridRes * gridRes);
      var gridNAvg = new Float32Array(gridRes * gridRes);
      for (var i = 0; i < gridRes * gridRes; i++) {
        if (gridCount[i] > 0) {
          gridAvg[i] = gridMax[i] / gridCount[i];
          gridNAvg[i] = gridN[i] / gridNCount[i];
        } else {
          gridAvg[i] = NaN;
          gridNAvg[i] = 0;
        }
      }

      // Contour levels — use the resolved per-box step
      var range = zMax - zMin;

      // Determine decimal places from step
      var decimals = 0;
      if (step < 0.01) decimals = 3;
      else if (step < 0.1) decimals = 2;
      else if (step < 1) decimals = 1;

      var contourLevels = [];
      var firstLevel = Math.ceil(zMin / step) * step;
      for (var v = firstLevel; v <= zMax + step * 0.01; v += step) {
        if (v >= zMin && v <= zMax) contourLevels.push(v);
      }

      // Compute scan diagonal for label sizing
      var scanDiag = Math.sqrt(uRange * uRange + vRange * vRange);
      var labelScale = scanDiag * 0.04;
      if (labelScale < 0.4) labelScale = 0.4;

      // Offset contour lines slightly along surface normal so they render in front of points
      // Use ~0.5% of scan diagonal, enough to clear point splats without visible gap
      var surfOffset = scanDiag * 0.003;
      if (surfOffset < 0.003) surfOffset = 0.003; // min 3mm
      // In plane deviation mode, offset toward the chosen viewing side
      var offsetDir = (mode === 'plane' && refSide) ? refSide : 1;
      var offX = N.x * surfOffset * offsetDir;
      var offY = N.y * surfOffset * offsetDir;
      var offZ = N.z * surfOffset * offsetDir;

      // Single shared material — cloning per line wasted memory and was
      // never necessary (every contour line uses identical settings).
      var contourMaterial = new THREE.LineBasicMaterial({
        color: 0x000000, linewidth: 4,
        depthTest: true, depthWrite: false,
        transparent: false
      });

      // ===== Label placement: greedy spacing across all levels =====
      // Track every label we place (across levels) and require a minimum
      // world-space distance between any two labels. This naturally thins
      // out clutter at perimeters where contours bunch up, while keeping
      // good coverage along long open contours.
      var placedLabelXY = [];                       // [x,y,z, x,y,z, ...]
      var minLabelSpacing = scanDiag * 0.10;        // ~10% of map diagonal
      var minLabelSpacingSq = minLabelSpacing * minLabelSpacing;
      var edgeMarginU = uRange * 0.05;              // skip labels within 5% of box edge
      var edgeMarginV = vRange * 0.05;
      var uLo = uMin + edgeMarginU, uHi = uMax - edgeMarginU;
      var vLo = vMin + edgeMarginV, vHi = vMax - edgeMarginV;

      function tryPlaceLabel(wx, wy, wz, uVal, vVal, labelText, target) {
        // Skip near box edges — perimeter contour intersections cluster here
        if (uVal < uLo || uVal > uHi || vVal < vLo || vVal > vHi) return false;
        // Reject if any already-placed label is too close
        for (var pi = 0; pi < placedLabelXY.length; pi += 3) {
          var dx = wx - placedLabelXY[pi];
          var dy = wy - placedLabelXY[pi + 1];
          var dz = wz - placedLabelXY[pi + 2];
          if (dx * dx + dy * dy + dz * dz < minLabelSpacingSq) return false;
        }
        placedLabelXY.push(wx, wy, wz);
        var sprite = createContourLabel(labelText, '#ffffff');
        sprite.scale.set(labelScale, labelScale * 0.4, 1);
        sprite.position.set(wx + offX, wy + offY, wz + offZ);
        target.add(sprite);
        return true;
      }

      for (var ci = 0; ci < contourLevels.length; ci++) {
        var level = contourLevels[ci];
        var segs = marchingSquares(gridAvg, gridRes, gridRes, level);
        if (segs.length === 0) continue;

        // Per-segment data: world position of midpoint + (u,v) for edge test
        var linePositions = [];
        var midData = []; // [{wx,wy,wz,u,v}] per segment
        for (var si = 0; si < segs.length; si++) {
          var seg = segs[si];
          var mu = 0, mv = 0;
          for (var pi = 0; pi < 2; pi++) {
            var gu = seg[pi * 2], gv = seg[pi * 2 + 1];
            var uVal = uMin + gu * cellU, vVal = vMin + gv * cellV;
            mu += uVal; mv += vVal;
            var iu = Math.floor(gu), iv = Math.floor(gv);
            if (iu >= gridRes) iu = gridRes - 1;
            if (iv >= gridRes) iv = gridRes - 1;
            var nOffset = gridNAvg[iv * gridRes + iu];
            var wx = cx + uVal * U.x + vVal * V.x + nOffset * N.x + offX;
            var wy = cy + uVal * U.y + vVal * V.y + nOffset * N.y + offY;
            var wz = cz + uVal * U.z + vVal * V.z + nOffset * N.z + offZ;
            linePositions.push(wx, wy, wz);
          }
          // Midpoint of this segment in world space (without offX/Y/Z, since
          // labels apply their own offset)
          var aIdx = (si * 2) * 3, bIdx = (si * 2 + 1) * 3;
          midData.push({
            wx: (linePositions[aIdx] + linePositions[bIdx]) / 2 - offX,
            wy: (linePositions[aIdx + 1] + linePositions[bIdx + 1]) / 2 - offY,
            wz: (linePositions[aIdx + 2] + linePositions[bIdx + 2]) / 2 - offZ,
            u: mu / 2,
            v: mv / 2
          });
        }

        if (linePositions.length === 0) continue;

        // Render multiple offset copies to create a thicker visible line
        var thickness = scanDiag * 0.0008;
        if (thickness < 0.001) thickness = 0.001;
        var offsets = [[0, 0], [thickness, 0], [-thickness, 0], [0, thickness], [0, -thickness]];
        for (var oi = 0; oi < offsets.length; oi++) {
          var du = offsets[oi][0], dv = offsets[oi][1];
          var ox2 = U.x * du + V.x * dv;
          var oy2 = U.y * du + V.y * dv;
          var oz2 = U.z * du + V.z * dv;
          var shifted = new Float32Array(linePositions.length);
          for (var si2 = 0; si2 < linePositions.length; si2 += 3) {
            shifted[si2]     = linePositions[si2]     + ox2;
            shifted[si2 + 1] = linePositions[si2 + 1] + oy2;
            shifted[si2 + 2] = linePositions[si2 + 2] + oz2;
          }
          var geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.Float32BufferAttribute(shifted, 3));
          var line = new THREE.LineSegments(geometry, contourMaterial);
          line.userData.contourLevel = level;
          line.raycast = function () {};
          target.add(line);
        }

        // Place labels with greedy spacing. Walk segments in order and try
        // to place at each midpoint; spacing rules will reject candidates
        // too close to already-placed labels (any level).
        var labelText = level.toFixed(decimals) + ' m';
        var placedAny = false;
        var stride = Math.max(1, Math.floor(midData.length / 24)); // sample
        for (var li = 0; li < midData.length; li += stride) {
          var m = midData[li];
          if (tryPlaceLabel(m.wx, m.wy, m.wz, m.u, m.v, labelText, target)) {
            placedAny = true;
          }
        }
        // If spacing rejected every candidate (very dense map), force one in
        // the interior so the level is identifiable.
        if (!placedAny) {
          for (var li = 0; li < midData.length; li++) {
            var m = midData[li];
            if (m.u < uLo || m.u > uHi || m.v < vLo || m.v > vHi) continue;
            placedLabelXY.push(m.wx, m.wy, m.wz);
            var sprite = createContourLabel(labelText, '#ffffff');
            sprite.scale.set(labelScale, labelScale * 0.4, 1);
            sprite.position.set(m.wx + offX, m.wy + offY, m.wz + offZ);
            target.add(sprite);
            break;
          }
        }
      }

      elevationContoursVisible = true;
    }

    // ===== ELEVATION MAP — CROP BOX + ORCHESTRATION =====

    // ===== EXCLUSION ZONES =====

    function onAddExclusion() {
      var volume = viewer.volumeTool.startInsertion({ clip: false });
      volume.name = 'Exclusion Zone ' + (exclusionBoxes.length + 1);
      volume.clip = false;
      exclusionBoxes.push(volume);
      trackVolumeUndo(volume);

      // Style: nearly invisible fill, black frame, no label
      function styleExclusionBox(vol) {
        if (vol.box) {
          vol.box.material.color.setHex(0x000000);
          vol.box.material.opacity = 0.03;
          vol.box.material.needsUpdate = true;
        }
        if (vol.frame) {
          vol.frame.material.color.setHex(0x000000);
          vol.frame.material.needsUpdate = true;
        }
        if (vol.label) vol.label.visible = false;
      }
      styleExclusionBox(volume);
      setTimeout(function() { styleExclusionBox(volume); }, 500);

      $('#btn-clear-exclusions, #btn-hide-exclusion-outlines').show();
      rebuildExclusionList();
      showToast('Click and drag to place exclusion zone.');
    }

    function onClearExclusions() {
      for (var i = 0; i < exclusionBoxes.length; i++) {
        viewer.scene.removeVolume(exclusionBoxes[i]);
      }
      exclusionBoxes = [];
      _lastExclusionHash = 'force';
      forceRecolorElevation();
      $('#btn-clear-exclusions, #btn-hide-exclusion-outlines').hide();
      _exclusionOutlinesHidden = false;
      rebuildExclusionList();
    }

    function removeExclusion(index) {
      if (index >= 0 && index < exclusionBoxes.length) {
        viewer.scene.removeVolume(exclusionBoxes[index]);
        exclusionBoxes.splice(index, 1);
        _lastExclusionHash = 'force';
        forceRecolorElevation();
        if (exclusionBoxes.length === 0) $('#btn-clear-exclusions').hide();
        rebuildExclusionList();
      }
    }

    function toggleExclusion(index) {
      if (index >= 0 && index < exclusionBoxes.length) {
        var vol = exclusionBoxes[index];
        vol._disabled = !vol._disabled;
        vol.visible = !vol._disabled;
        _lastExclusionHash = 'force';
        forceRecolorElevation();
        rebuildExclusionList();
      }
    }

    function forceRecolorElevation() {
      if (elevationActive && elevationPositions && elevationNodeMap) {
        applyElevationColors(elevationPositions, elevationNodeMap);
        // Reset colored nodes so frame listener picks up new exclusions
        elevationColoredNodes.clear();
        for (var ni = 0; ni < elevationNodeMap.length; ni++) {
          elevationColoredNodes.add(elevationNodeMap[ni].geometryNode);
        }
        // Rebuild contours for any box that currently shows them
        for (var bi = 0; bi < elevationCropVolumes.length; bi++) {
          var cfg = getBoxConfig(elevationCropVolumes[bi]);
          if (cfg.active && cfg.contoursVisible) {
            buildBoxContours(elevationCropVolumes[bi]);
          }
        }
      }
    }

    function rebuildExclusionList() {
      var $list = $('#exclusion-list');
      $list.empty();
      if (exclusionBoxes.length === 0) return;
      for (var i = 0; i < exclusionBoxes.length; i++) {
        var vol = exclusionBoxes[i];
        var disabled = vol._disabled;
        var eyeStyle = disabled ? 'opacity:0.35' : '';
        var html = '<div style="display:flex;align-items:center;gap:4px;margin:2px 0;padding:3px 6px;background:rgba(255,255,255,0.05);border-radius:3px;font:12px/1.3 sans-serif;color:var(--sidebar-text)">' +
          '<span style="flex:1">Exclusion ' + (i + 1) + '</span>' +
          '<button data-idx="' + i + '" class="btn-toggle-exclusion" style="padding:1px 5px;border:1px solid var(--border);border-radius:3px;font:11px sans-serif;cursor:pointer;background:var(--panel-bg);color:var(--sidebar-text);' + eyeStyle + '" title="Toggle">&#128065;</button>' +
          '<button data-idx="' + i + '" class="btn-remove-exclusion" style="padding:1px 5px;border:1px solid var(--border);border-radius:3px;font:11px sans-serif;cursor:pointer;background:var(--panel-bg);color:var(--sidebar-text)" title="Delete">&times;</button>' +
          '</div>';
        $list.append(html);
      }
      $list.find('.btn-remove-exclusion').on('click', function() { removeExclusion(parseInt($(this).data('idx'))); });
      $list.find('.btn-toggle-exclusion').on('click', function() { toggleExclusion(parseInt($(this).data('idx'))); });
    }

    // Listen for Potree removing volumes (user selects + presses Delete)
    viewer.scene.addEventListener('volume_removed', function(e) {
      var vol = e.volume;
      var idx = exclusionBoxes.indexOf(vol);
      if (idx >= 0) {
        exclusionBoxes.splice(idx, 1);
        _lastExclusionHash = 'force';
        forceRecolorElevation();
        if (exclusionBoxes.length === 0) $('#btn-clear-exclusions').hide();
        rebuildExclusionList();
      }
    });

    // Per-frame: detect exclusion box movement and recolor (throttled to max once per 500ms)
    var _exclusionRecolorTimer = null;
    viewer.addEventListener('update', function() {
      if (exclusionBoxes.length > 0 && elevationActive) {
        var hash = '';
        for (var i = 0; i < exclusionBoxes.length; i++) {
          var vol = exclusionBoxes[i];
          if (vol._disabled) { hash += 'off|'; continue; }
          var p = vol.position, s = vol.scale;
          hash += p.x.toFixed(2) + p.y.toFixed(2) + p.z.toFixed(2) +
                  s.x.toFixed(2) + s.y.toFixed(2) + s.z.toFixed(2) + '|';
        }
        if (hash !== _lastExclusionHash) {
          _lastExclusionHash = hash;
          if (!_exclusionRecolorTimer) {
            _exclusionRecolorTimer = setTimeout(function() {
              _exclusionRecolorTimer = null;
              if (elevationActive && elevationPositions && elevationNodeMap) {
                applyElevationColors(elevationPositions, elevationNodeMap);
                elevationColoredNodes.clear();
                for (var ni = 0; ni < elevationNodeMap.length; ni++) {
                  elevationColoredNodes.add(elevationNodeMap[ni].geometryNode);
                }
              }
            }, 250);
          }
        }
      } else if (_lastExclusionHash !== '' && exclusionBoxes.length === 0) {
        _lastExclusionHash = '';
        if (elevationActive) forceRecolorElevation();
      }
    });

    // Check if a point is inside any active exclusion box
    function isPointExcluded(px, py, pz, exclInvMats) {
      for (var ei = 0; ei < exclInvMats.length; ei++) {
        var local = new THREE.Vector3(px, py, pz).applyMatrix4(exclInvMats[ei]);
        if (Math.abs(local.x) <= 0.5 && Math.abs(local.y) <= 0.5 && Math.abs(local.z) <= 0.5) return true;
      }
      return false;
    }

    // Build exclusion inverse matrices (for active boxes only)
    function buildExclusionInvMats() {
      var mats = [];
      for (var i = 0; i < exclusionBoxes.length; i++) {
        if (exclusionBoxes[i]._disabled) continue;
        exclusionBoxes[i].updateMatrixWorld(true);
        mats.push(new THREE.Matrix4().copy(exclusionBoxes[i].matrixWorld).invert());
      }
      // Also treat active cut-out boxes as exclusion zones for coloring/contours
      for (var i = 0; i < cutoutBoxes.length; i++) {
        if (cutoutBoxes[i]._disabled) continue;
        cutoutBoxes[i].updateMatrixWorld(true);
        mats.push(new THREE.Matrix4().copy(cutoutBoxes[i].matrixWorld).invert());
      }
      return mats;
    }

    // Show/hide crop box outline (frame + box visuals only, clipping stays)
    var _cropOutlineHidden = false;
    // Show/hide all exclusion box outlines
    var _exclusionOutlinesHidden = false;
    function onToggleExclusionOutlines() {
      _exclusionOutlinesHidden = !_exclusionOutlinesHidden;
      for (var i = 0; i < exclusionBoxes.length; i++) {
        var vol = exclusionBoxes[i];
        if (vol._disabled) continue;
        if (_exclusionOutlinesHidden) {
          if (vol.frame) vol.frame.visible = false;
          if (vol.box) vol.box.visible = false;
          if (vol.label) vol.label.visible = false;
        } else {
          if (vol.frame) vol.frame.visible = true;
          if (vol.box) vol.box.visible = true;
        }
      }
      $('#btn-hide-exclusion-outlines').text(_exclusionOutlinesHidden ? 'Show Boxes' : 'Hide Boxes');
    }

    // ===== Elevation Crop Box management (multi-box) =====

    function styleElevationBox(vol) {
      // Transparent fill (invisible), green wireframe. The fill mesh has its
      // raycast disabled so click-and-drag INSIDE the box pans/rotates the
      // camera (Potree's InputHandler doesn't grab it as a drag target).
      // A custom mousedown/mouseup pair below detects a click-without-drag
      // over the box and toggles its selection so the resize/move gizmo
      // still appears — without blocking camera controls.
      if (vol.box) {
        vol.box.visible = true;
        vol.box.material.color.setHex(0x000000);
        vol.box.material.opacity = 0.0;
        vol.box.material.transparent = true;
        vol.box.material.needsUpdate = true;
        vol.box.raycast = function() {};
      }
      if (vol.frame) {
        vol.frame.material.color.setHex(0x44cc44);
        vol.frame.material.needsUpdate = true;
      }
