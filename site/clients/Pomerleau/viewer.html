    // -- Finalize constraint from picked points --
    function finalizeConstraint() {
      var type = constraintPickType;
      var pts = constraintPickPoints;
      var constraint = null;

      if (type === 'fit-plane') {
        if (pts.length < 3) {
          showToast('Need at least 3 points for best-fit plane');
          cancelConstraintPick();
          return;
        }
        // Compute centroid
        var centroid = new THREE.Vector3();
        for (var fi = 0; fi < pts.length; fi++) centroid.add(pts[fi]);
        centroid.divideScalar(pts.length);

        // Build 3x3 covariance matrix
        var xx = 0, xy = 0, xz = 0, yy = 0, yz = 0, zz = 0;
        for (var fi = 0; fi < pts.length; fi++) {
          var dx = pts[fi].x - centroid.x;
          var dy = pts[fi].y - centroid.y;
          var dz = pts[fi].z - centroid.z;
          xx += dx * dx; xy += dx * dy; xz += dx * dz;
          yy += dy * dy; yz += dy * dz; zz += dz * dz;
        }

        // Find the eigenvector with smallest eigenvalue via power iteration
        // on the adjugate (cofactor) matrix — the normal is the least-variance direction.
        // For a 3x3 symmetric matrix, the smallest eigenvector can be found by
        // computing cross products of rows of (A - λI). We use a simpler approach:
        // try each candidate normal (cross products of covariance rows) and pick
        // the one that gives the smallest variance.
        var det2 = function(a, b, c, d) { return a * d - b * c; };
        var candidates = [
          // Cross products of pairs of rows of the covariance matrix
          new THREE.Vector3(
            det2(xy, xz, yy, yz),
            det2(xz, xx, yz, xy),
            det2(xx, xy, xy, yy)
          ),
          new THREE.Vector3(
            det2(yy, yz, xy, xz),
            det2(yz, xy, xz, xx),
            det2(xy, yy, xx, xy)
          ),
          // Fallback: world axes
          new THREE.Vector3(1, 0, 0),
          new THREE.Vector3(0, 1, 0),
          new THREE.Vector3(0, 0, 1)
        ];

        // Pick candidate that minimizes sum of squared distances to the plane
        var bestNormal = null;
        var bestVariance = Infinity;
        for (var ci2 = 0; ci2 < candidates.length; ci2++) {
          var n = candidates[ci2];
          if (n.length() < 0.0001) continue;
          n.normalize();
          var variance = 0;
          for (var fi = 0; fi < pts.length; fi++) {
            var d = (pts[fi].x - centroid.x) * n.x +
                    (pts[fi].y - centroid.y) * n.y +
                    (pts[fi].z - centroid.z) * n.z;
            variance += d * d;
          }
          if (variance < bestVariance) {
            bestVariance = variance;
            bestNormal = n.clone();
          }
        }

        if (!bestNormal) {
          showToast('Could not compute best-fit plane');
          cancelConstraintPick();
          return;
        }

        var rms = Math.sqrt(bestVariance / pts.length) * 1000; // mm
        var normal = bestNormal;
        var plane = new THREE.Plane();
        plane.setFromNormalAndCoplanarPoint(normal, centroid);

        constraint = {
          id: nextConstraintId++,
          type: 'plane',
          name: 'Fit Plane ' + (nextConstraintId - 1),
          plane: plane,
          normal: normal,
          centroid: centroid,
          points: pts,
          visual: null,
          visible: true,
          locked: true
        };
        // Hold the plane while the user picks 2 points to define the +X axis.
        // The constraint isn't pushed to `constraints[]` until X is set, so
        // cancelling the X-axis pick discards the plane.
        _pendingPlaneConstraint = constraint;
        clearPickMarkers();
        constraintPickPoints = [];
        constraintPickType = 'plane-x-axis';
        constraintPickTarget = 2;
        constraintPickMode = true;
        showToast('Plane fit (RMS: ' + rms.toFixed(1) + ' mm). Now pick 2 points for +X axis (left → right)', 6000);
        return;
      } else if (type === 'axis') {
        var dir = new THREE.Vector3().subVectors(pts[1], pts[0]);
        if (dir.length() < 0.001) {
          showToast('Points are coincident \u2014 cannot define axis');
          cancelConstraintPick();
          return;
        }
        dir.normalize();
        constraint = {
          id: nextConstraintId++,
          type: 'axis',
          name: 'Axis ' + (nextConstraintId - 1),
          origin: pts[0].clone(),
          direction: dir,
          points: pts,
          visual: null,
          visible: true,
          locked: true
        };
      }

      clearPickMarkers();

      if (constraint) {
        buildConstraintVisual(constraint);
        constraints.push(constraint);
        rebuildConstraintList();
        // Replace constraint-point undo entries with a single constraint entry
        while (undoStack.length > 0 && undoStack[undoStack.length - 1].type === 'constraint-point') {
          undoStack.pop();
        }
        undoStack.push({ type: 'constraint', id: constraint.id });
        showToast(constraint.name + ' created');
      }

      constraintPickMode = false;
      constraintPickPoints = [];
      constraintPickType = null;
      constraintPickTarget = 0;
      document.body.classList.remove('constraint-pick-mode');
      document.querySelectorAll('#enable-constraint-buttons button').forEach(function(b) { b.classList.remove('active'); });
    }

    // -- Re-enter X-axis pick mode for an existing plane (sidebar button) --
    function startPlaneXAxisEdit(c) {
      if (!c || c.type !== 'plane') return;
      if (memberPickMode) cancelMemberPick();
      if (constraintPickMode) cancelConstraintPick();
      _pendingPlaneConstraint = c;
      constraintPickMode = true;
      constraintPickPoints = [];
      constraintPickType = 'plane-x-axis';
      constraintPickTarget = 2;
      document.body.classList.add('constraint-pick-mode');
      showToast('Re-pick 2 points for ' + c.name + ' +X axis (Enter to accept, Esc to cancel)', 6000);
    }

    // -- Finalize the X-axis pick step that follows fit-plane creation --
    function finalizePlaneXAxis() {
      var c = _pendingPlaneConstraint;
      if (!c || constraintPickPoints.length < 2) return;
      // Validate that the projected X line has non-zero length on the plane.
      var n = c.normal;
      var a = constraintPickPoints[0].clone();
      var b = constraintPickPoints[1].clone();
      var aOff = (a.x - c.centroid.x) * n.x + (a.y - c.centroid.y) * n.y + (a.z - c.centroid.z) * n.z;
      var bOff = (b.x - c.centroid.x) * n.x + (b.y - c.centroid.y) * n.y + (b.z - c.centroid.z) * n.z;
      a.addScaledVector(n, -aOff);
      b.addScaledVector(n, -bOff);
      if (a.distanceTo(b) < 1e-4) {
        // Both picks projected to nearly the same point; ask the user to redo.
        clearPickMarkers();
        constraintPickPoints = [];
        showToast('X-axis points are too close after projection — pick 2 points farther apart', 5000);
        return;
      }
      // Capture the camera's screen-up vector at click time. Column 1 of the
      // camera's world matrix is its local Y axis = up direction on screen.
      var cam = viewer.scene.getActiveCamera();
      var camUp = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
      c.xAxisAnchorA = constraintPickPoints[0].clone();
      c.xAxisAnchorB = constraintPickPoints[1].clone();
      c.xAxisCamUp = camUp;
      c.basis = computePlaneBasis(c);

      clearPickMarkers();
      var alreadyInList = constraints.indexOf(c) !== -1;
      if (alreadyInList) {
        rebuildConstraintVisual(c);
        showToast(c.name + ' X axis updated');
      } else {
        buildConstraintVisual(c);
        constraints.push(c);
        rebuildConstraintList();
        while (undoStack.length > 0 && undoStack[undoStack.length - 1].type === 'constraint-point') {
          undoStack.pop();
        }
        undoStack.push({ type: 'constraint', id: c.id });
        showToast(c.name + ' created with custom X axis');
      }

      _pendingPlaneConstraint = null;
      constraintPickMode = false;
      constraintPickPoints = [];
      constraintPickType = null;
      constraintPickTarget = 0;
      document.body.classList.remove('constraint-pick-mode');
      document.querySelectorAll('#enable-constraint-buttons button').forEach(function(b) { b.classList.remove('active'); });
    }

    // -- Build 3D visual for a constraint --
    // Compute a plane constraint's local XYZ basis. If the user has set an X
    // axis (two anchors picked after the plane was fit), X = projection of
    // (anchorB - anchorA) onto the plane, Y = camera-up at click time
    // projected onto the plane and made perpendicular to X, Z = X × Y
    // (right-hand rule). Anchors are stored in world coordinates so a
    // re-fit (drag of plane definition points) automatically updates the
    // basis through reprojection. Falls back to the legacy auto-basis
    // (world-Z projected onto plane) if anchors are missing.
    function computePlaneBasis(c) {
      if (c.type !== 'plane') return null;
      var n = c.normal.clone().normalize();
      var X, Y, Z;
      if (c.xAxisAnchorA && c.xAxisAnchorB && c.xAxisCamUp) {
        // Project both anchors onto the plane to kill any Z drift.
        var a = c.xAxisAnchorA.clone();
        var b = c.xAxisAnchorB.clone();
        var aOff = (a.x - c.centroid.x) * n.x + (a.y - c.centroid.y) * n.y + (a.z - c.centroid.z) * n.z;
        var bOff = (b.x - c.centroid.x) * n.x + (b.y - c.centroid.y) * n.y + (b.z - c.centroid.z) * n.z;
        a.addScaledVector(n, -aOff);
        b.addScaledVector(n, -bOff);
        var dx = new THREE.Vector3().subVectors(b, a);
        if (dx.length() < 1e-6) return null;
        X = dx.normalize();
        // Camera-up at click time, projected onto plane and made ⊥ to X.
        var up = c.xAxisCamUp.clone();
        up.addScaledVector(n, -up.dot(n));
        up.addScaledVector(X, -up.dot(X));
        if (up.length() < 1e-6) {
          // Camera-up is parallel to X — pick an arbitrary perpendicular.
          up.copy(n).cross(X);
        }
        Y = up.normalize();
        Z = new THREE.Vector3().crossVectors(X, Y).normalize();
      } else {
        // Legacy auto-basis (world-Z projected, falling back to world-X).
        var worldRef = (Math.abs(n.z) < 0.9)
          ? new THREE.Vector3(0, 0, 1)
          : new THREE.Vector3(1, 0, 0);
        X = new THREE.Vector3().crossVectors(worldRef, n).normalize();
        Y = new THREE.Vector3().crossVectors(n, X).normalize();
        Z = n;
      }
      return { X: X, Y: Y, Z: Z, origin: c.centroid.clone() };
    }

    function buildConstraintVisual(constraint) {
      var group = new THREE.Group();
      group.name = 'constraint-' + constraint.id;

      if (constraint.type === 'plane') {
        var pts = constraint.points;
        var maxDist = 0;
        for (var i = 0; i < pts.length; i++) {
          for (var j = i + 1; j < pts.length; j++) {
            var d = pts[i].distanceTo(pts[j]);
            if (d > maxDist) maxDist = d;
          }
        }
        var quadSize = Math.max(maxDist * 3, 1);
        var planeGeo = new THREE.PlaneGeometry(quadSize, quadSize);
        var planeMat = new THREE.MeshBasicMaterial({
          color: 0x39ff14, transparent: true, opacity: 0.15,
          side: THREE.DoubleSide, depthTest: false, depthWrite: false
        });
        var planeMesh = new THREE.Mesh(planeGeo, planeMat);
        planeMesh.position.copy(constraint.centroid);
        // Build rotation so quad edges stay aligned with world axes.
        // PlaneGeometry face normal is local Z; local X/Y are the quad edges.
        var n = constraint.normal;
        // Project world-Z onto the plane to get a vertical-ish "up" edge.
        // If the plane is nearly horizontal (normal ~ Z), use world-X instead.
        var worldRef = (Math.abs(n.z) < 0.9)
          ? new THREE.Vector3(0, 0, 1)
          : new THREE.Vector3(1, 0, 0);
        // localX = horizontal edge in the plane
        var localX = new THREE.Vector3().crossVectors(worldRef, n).normalize();
        // localY = vertical edge in the plane
        var localY = new THREE.Vector3().crossVectors(n, localX).normalize();
        var rotMat = new THREE.Matrix4().makeBasis(localX, localY, n);
        var quat = new THREE.Quaternion().setFromRotationMatrix(rotMat);
        planeMesh.quaternion.copy(quat);
        group.add(planeMesh);

        var edgeGeo = new THREE.EdgesGeometry(planeGeo);
        var edgeMat = new THREE.LineBasicMaterial({
          color: 0x39ff14, transparent: true, opacity: 0.4,
          depthTest: false, depthWrite: false
        });
        var edgeLine = new THREE.LineSegments(edgeGeo, edgeMat);
        edgeLine.position.copy(constraint.centroid);
        edgeLine.quaternion.copy(quat);
        group.add(edgeLine);

        // +X (red) and +Y (green) basis arrows from centroid. Anchored from
        // the user-defined basis if present, falling back to auto-basis.
        var basis = constraint.basis || computePlaneBasis(constraint);
        if (basis) {
          var arrowLen = Math.max(quadSize * 0.28, 0.3);
          var headLen = arrowLen * 0.22;
          var headW = headLen * 0.55;
          var xArrow = new THREE.ArrowHelper(basis.X, constraint.centroid, arrowLen, 0xff3030, headLen, headW);
          var yArrow = new THREE.ArrowHelper(basis.Y, constraint.centroid, arrowLen, 0x30ff30, headLen, headW);
          [xArrow, yArrow].forEach(function(arr) {
            arr.userData.isBasisArrow = true;
            arr.line.material.transparent = true;
            arr.line.material.opacity = 0.95;
            arr.line.material.depthTest = false;
            arr.line.material.depthWrite = false;
            arr.cone.material.transparent = true;
            arr.cone.material.opacity = 0.95;
            arr.cone.material.depthTest = false;
            arr.cone.material.depthWrite = false;
            arr.line.userData.isBasisArrow = true;
            arr.cone.userData.isBasisArrow = true;
          });
          group.add(xArrow);
          group.add(yArrow);
        }
      } else if (constraint.type === 'axis') {
        var axDir = constraint.direction;
        var axOrigin = constraint.origin;
        var span = constraint.points[0].distanceTo(constraint.points[1]);
        var extend = Math.max(span * 5, 10);
        var p1 = new THREE.Vector3().copy(axOrigin).addScaledVector(axDir, -extend);
        var p2 = new THREE.Vector3().copy(axOrigin).addScaledVector(axDir, extend);
        var lineGeo = new THREE.BufferGeometry().setFromPoints([p1, p2]);
        var lineMat = new THREE.LineBasicMaterial({
          color: 0x39ff14, transparent: true, opacity: 0.6,
          depthTest: false, depthWrite: false
        });
        group.add(new THREE.Line(lineGeo, lineMat));
      }

      // Definition point markers (dot + glow)
      for (var k = 0; k < constraint.points.length; k++) {
        var pt = constraint.points[k];
        var ptGroup = new THREE.Group();
        ptGroup.position.copy(pt);
        ptGroup.userData.isDefinitionPoint = true;
        ptGroup.userData.pointIndex = k;

        var dotGeo = new THREE.CircleGeometry(ringInnerRadius, RING_SEGMENTS);
        var dotMesh = new THREE.Mesh(dotGeo, new THREE.MeshBasicMaterial({
          color: 0x39ff14, depthTest: false, depthWrite: false,
          transparent: true, opacity: 0.9, side: THREE.DoubleSide
        }));
        dotMesh.userData.isDefPointRing = true;
        ptGroup.add(dotMesh);

        // Additive glow
        var glow = createGlowSprite(0x39ff14, ringOuterRadius);
        glow.userData.isDefPointRing = true;
        ptGroup.add(glow);

        group.add(ptGroup);
      }

      constraint.visual = group;
      constraintScene.add(group);
      if (constraint.visible === false) group.visible = false;
      updateConstraintVisuals();
    }

    // -- Update visual opacity based on active state --
    function updateConstraintVisuals() {
      for (var ci = 0; ci < constraints.length; ci++) {
        var c = constraints[ci];
        if (!c.visual) continue;
        var isActive = c.id === activeConstraintId;
        c.visual.traverse(function(obj) {
          if (obj.material) {
            if (obj.userData && obj.userData.isDefPointRing) {
              obj.material.opacity = 0.9;
            } else if (obj.userData && obj.userData.isBasisArrow) {
              // Basis arrows manage their own opacity (always visible).
            } else if (obj.isMesh) {
              obj.material.opacity = isActive ? 0.2 : 0.08;
            } else if (obj.isLine || obj.isLineSegments) {
              obj.material.opacity = isActive ? 0.7 : 0.25;
            }
          }
        });
      }
    }

    // -- Rebuild constraint sidebar list --
    function rebuildConstraintList() {
      var listEl = document.getElementById('enable-constraint-list');
      if (!listEl) return;
      listEl.innerHTML = '';

      for (var ci = 0; ci < constraints.length; ci++) {
        (function(c) {
          var row = document.createElement('div');
          row.className = 'constraint-row' + (c.id === activeConstraintId ? ' active' : '');

          var nameSpan = document.createElement('span');
          nameSpan.className = 'constraint-name';
          nameSpan.textContent = c.name;
          row.appendChild(nameSpan);

          var visBtn = document.createElement('button');
          visBtn.className = 'btn-vis' + (c.visible === false ? ' hidden' : '');
          visBtn.textContent = '\uD83D\uDC41';
          visBtn.title = 'Toggle visibility';
          visBtn.addEventListener('click', function() {
            c.visible = !c.visible;
            if (c.visual) c.visual.visible = c.visible;
            visBtn.classList.toggle('hidden', !c.visible);
          });
          row.appendChild(visBtn);

          var lockBtn = document.createElement('button');
          lockBtn.className = 'btn-lock' + (c.locked ? ' locked' : '');
          lockBtn.textContent = c.locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
          lockBtn.title = c.locked ? 'Unlock points' : 'Lock points';
          lockBtn.addEventListener('click', function() {
            c.locked = !c.locked;
            lockBtn.textContent = c.locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
            lockBtn.title = c.locked ? 'Unlock points' : 'Lock points';
            lockBtn.classList.toggle('locked', c.locked);
          });
          row.appendChild(lockBtn);

          if (c.type === 'plane') {
            var orthoBtn = document.createElement('button');
            orthoBtn.className = 'btn-ortho';
            orthoBtn.textContent = '\u2316';
            orthoBtn.title = 'Orthographic view of this plane';
            orthoBtn.addEventListener('click', function() {
              viewPlaneOrtho(c);
            });
            row.appendChild(orthoBtn);

            var setXBtn = document.createElement('button');
            setXBtn.className = 'btn-set-x';
            setXBtn.textContent = 'X';
            setXBtn.title = 'Re-pick +X axis for this plane';
            setXBtn.addEventListener('click', function() {
              startPlaneXAxisEdit(c);
            });
            row.appendChild(setXBtn);
          }

          var activateBtn = document.createElement('button');
          activateBtn.textContent = c.id === activeConstraintId ? 'Active' : 'Activate';
          activateBtn.addEventListener('click', function() {
            if (activeConstraintId === c.id) {
              activeConstraintId = null;
            } else {
              activeConstraintId = c.id;
            }
            rebuildConstraintList();
            updateConstraintVisuals();
          });
          row.appendChild(activateBtn);

          var deleteBtn = document.createElement('button');
          deleteBtn.textContent = '\u00d7';
          deleteBtn.title = 'Delete constraint';
          deleteBtn.addEventListener('click', function() {
            deleteConstraint(c.id);
          });
          row.appendChild(deleteBtn);

          listEl.appendChild(row);
        })(constraints[ci]);
      }
      updateConstraintStatus();
    }

    // -- Delete a constraint --
    function deleteConstraint(id) {
      var idx = -1;
      for (var i = 0; i < constraints.length; i++) {
        if (constraints[i].id === id) { idx = i; break; }
      }
      if (idx === -1) return;
      var c = constraints[idx];
      if (c.visual) {
        c.visual.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) obj.material.dispose();
        });
        constraintScene.remove(c.visual);
      }
      if (activeConstraintId === id) activeConstraintId = null;
      constraints.splice(idx, 1);
      rebuildConstraintList();
      updateConstraintVisuals();
    }

    // -- Update constraint status display --
    function updateConstraintStatus() {
      var el = document.getElementById('enable-constraint-status');
      if (!el) return;
      if (!activeConstraintId) {
        var orphanBits = [];
        if (_orthoMeasureMode) orphanBits.push('Ortho ON');
        if (_orthoParallelMode) orphanBits.push('Parallel ON');
        el.textContent = orphanBits.length
          ? orphanBits.join(', ') + ' (no plane active — inactive)'
          : '';
        return;
      }
      var c = null;
      for (var i = 0; i < constraints.length; i++) {
        if (constraints[i].id === activeConstraintId) { c = constraints[i]; break; }
      }
      if (c) {
        var txt = c.name + ' constraint active';
        if (c.type === 'plane' && c.basis) {
          if (_orthoMeasureMode) txt += ' | Ortho ON (' + (_orthoParallelMode ? 'X/Y/Z' : 'X/Y') + ')';
          if (_orthoParallelMode) txt += ' | Parallel';
        }
        el.textContent = txt;
      }
    }

    // -- Find nearest definition point to mouse (screen-space hit test) --
    function findNearestDefinitionPoint(mousePixel) {
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = 25; // pixel threshold
      var bestResult = null;
      for (var ci = 0; ci < constraints.length; ci++) {
        var c = constraints[ci];
        if (c.locked) continue;
        for (var pi = 0; pi < c.points.length; pi++) {
          var pt = c.points[pi].clone().project(camera);
          var screenX = (pt.x * 0.5 + 0.5) * rect.width;
          var screenY = (1 - (pt.y * 0.5 + 0.5)) * rect.height;
          var dx = screenX - mousePixel.x;
          var dy = screenY - mousePixel.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < bestDist) {
            bestDist = dist;
            bestResult = { constraint: c, pointIndex: pi };
          }
        }
      }
      return bestResult;
    }

    // -- Find nearest X-axis pick marker to mouse (during plane-x-axis pick) --
    function findNearestXAxisPickMarker(mousePixel) {
      if (constraintPickType !== 'plane-x-axis') return -1;
      if (!constraintPickMarkers.length) return -1;
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = 25;
      var bestIdx = -1;
      for (var i = 0; i < constraintPickMarkers.length; i++) {
        var pt = constraintPickMarkers[i].position.clone().project(camera);
        var sx = (pt.x * 0.5 + 0.5) * rect.width;
        var sy = (1 - (pt.y * 0.5 + 0.5)) * rect.height;
        var dx = sx - mousePixel.x, dy = sy - mousePixel.y;
        var d = Math.sqrt(dx * dx + dy * dy);
        if (d < bestDist) { bestDist = d; bestIdx = i; }
      }
      return bestIdx;
    }

    // -- Recompute constraint geometry after a point is moved --
    function recomputeConstraint(c) {
      if (c.type === 'plane') {
        var pts = c.points;
        if (pts.length === 3) {
          var v1 = new THREE.Vector3().subVectors(pts[1], pts[0]);
          var v2 = new THREE.Vector3().subVectors(pts[2], pts[0]);
          var normal = new THREE.Vector3().crossVectors(v1, v2);
          if (normal.length() < 0.001) return false;
          normal.normalize();
          c.normal = normal;
          c.plane = new THREE.Plane();
          c.plane.setFromNormalAndCoplanarPoint(normal, pts[0]);
          c.centroid = new THREE.Vector3().add(pts[0]).add(pts[1]).add(pts[2]).divideScalar(3);
        } else if (pts.length > 3) {
          // Re-fit plane from all points
          var centroid = new THREE.Vector3();
          for (var i = 0; i < pts.length; i++) centroid.add(pts[i]);
          centroid.divideScalar(pts.length);
          var xx = 0, xy = 0, xz = 0, yy = 0, yz = 0, zz = 0;
          for (var i = 0; i < pts.length; i++) {
            var dx = pts[i].x - centroid.x, dy = pts[i].y - centroid.y, dz = pts[i].z - centroid.z;
            xx += dx * dx; xy += dx * dy; xz += dx * dz;
            yy += dy * dy; yz += dy * dz; zz += dz * dz;
          }
          var det2 = function(a, b, cd, d) { return a * d - b * cd; };
          var candidates = [
            new THREE.Vector3(det2(xy, xz, yy, yz), det2(xz, xx, yz, xy), det2(xx, xy, xy, yy)),
            new THREE.Vector3(det2(yy, yz, xy, xz), det2(yz, xy, xz, xx), det2(xy, yy, xx, xy)),
            new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 1)
          ];
          var bestNormal = null, bestVar = Infinity;
          for (var ci2 = 0; ci2 < candidates.length; ci2++) {
            var n = candidates[ci2];
            if (n.length() < 0.0001) continue;
            n.normalize();
            var v = 0;
            for (var i = 0; i < pts.length; i++) {
              var d = (pts[i].x - centroid.x) * n.x + (pts[i].y - centroid.y) * n.y + (pts[i].z - centroid.z) * n.z;
              v += d * d;
            }
            if (v < bestVar) { bestVar = v; bestNormal = n.clone(); }
          }
          if (!bestNormal) return false;
          c.normal = bestNormal;
          c.centroid = centroid;
          c.plane = new THREE.Plane();
          c.plane.setFromNormalAndCoplanarPoint(bestNormal, centroid);
        } else {
          return false; // fewer than 3 points
        }
      } else if (c.type === 'axis') {
        var dir = new THREE.Vector3().subVectors(c.points[1], c.points[0]);
        if (dir.length() < 0.001) return false;
        dir.normalize();
        c.direction = dir;
        c.origin = c.points[0].clone();
      }
      // Refresh plane basis (anchors are world-space; reproject onto new plane).
      if (c.type === 'plane') c.basis = computePlaneBasis(c);
      return true;
    }

    // -- Rebuild visual for a single constraint (dispose old, build new) --
    function rebuildConstraintVisual(c) {
      if (c.visual) {
        c.visual.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) obj.material.dispose();
        });
        constraintScene.remove(c.visual);
        c.visual = null;
      }
      buildConstraintVisual(c);
    }

    // -- Plane ortho depth slab state --
    var planeOrthoSlab = null;       // the BoxVolume used as depth slab
    var planeOrthoConstraint = null; // which constraint is active for ortho

    // -- Switch to orthographic view aligned to a plane constraint --
    function viewPlaneOrtho(c) {
      if (c.type !== 'plane') return;

      // Switch to orthographic camera mode
      viewer.setCameraMode(Potree.CameraMode.ORTHOGRAPHIC);

      // Position the camera along the plane normal, looking at the centroid.
      // Potree's render loop drives cameras from scene.view (yaw/pitch/position),
      // so we must set view — not camera — properties.
      var normal = c.normal.clone();
      var distance = viewer.scene.view.radius || 50;
      if (distance < 1) distance = 50;

      // Camera position: offset from centroid along the normal
      var camPos = c.centroid.clone().addScaledVector(normal, distance);
      viewer.scene.view.position.copy(camPos);
      viewer.scene.view.lookAt(c.centroid);

      // Create/update depth slab clip box
      planeOrthoConstraint = c;
      createOrUpdateDepthSlab(c, 20, 20);

      // Show depth controls UI
      showDepthControls(c);

      showToast('Ortho view: ' + c.name);
    }

    // -- Create or update the depth slab clip box --
    function createOrUpdateDepthSlab(c, behindMM, frontMM) {
      // Convert mm to scene units (assume metres)
      var behind = behindMM / 1000;
      var front = frontMM / 1000;
      var thickness = behind + front; // total depth
      if (thickness < 0.001) thickness = 0.001;

      // Slab center: offset from plane centroid along normal.
      // "front" is in the normal direction, "behind" is opposite.
      var offset = (front - behind) / 2;
      var center = c.centroid.clone().addScaledVector(c.normal, offset);

      // Orientation: rotate local Y axis to align with plane normal.
      // BoxVolume is a unit cube; scale.y controls thickness along local Y.
      var quat = new THREE.Quaternion().setFromUnitVectors(
        new THREE.Vector3(0, 1, 0), c.normal
      );

      // Lateral size: huge so it doesn't clip laterally
      var lateralSize = 10000;

      if (!planeOrthoSlab) {
        planeOrthoSlab = new Potree.BoxVolume();
        planeOrthoSlab.clip = true;
        planeOrthoSlab.name = 'Plane Depth Slab';
        planeOrthoSlab.visible = true;
        planeOrthoSlab.userData = planeOrthoSlab.userData || {};
        planeOrthoSlab.userData.persistent = true;
        planeOrthoSlab.userData.isDepthSlab = true;
        // Hide the green box visual
        planeOrthoSlab.box.visible = false;
        planeOrthoSlab.frame.visible = false;
        if (planeOrthoSlab.label) planeOrthoSlab.label.visible = false;

        viewer.scene.addVolume(planeOrthoSlab);
        // Switch to INSIDE_ALL so both the main crop box and slab must pass
        viewer.setClipMethod(Potree.ClipMethod.INSIDE_ALL);
      }

      planeOrthoSlab.position.copy(center);
      planeOrthoSlab.quaternion.copy(quat);
      planeOrthoSlab.scale.set(lateralSize, thickness, lateralSize);
      planeOrthoSlab.updateMatrixWorld(true);
      if (typeof planeOrthoSlab.update === 'function') planeOrthoSlab.update();
    }

    // -- Remove the depth slab and restore clip method --
    function removeDepthSlab() {
      if (planeOrthoSlab) {
        // Temporarily allow removal of our persistent slab
        planeOrthoSlab.userData.persistent = false;
        viewer.scene.removeVolume(planeOrthoSlab);
        planeOrthoSlab = null;
      }
      planeOrthoConstraint = null;
      // Restore to INSIDE_ANY (original mode)
      viewer.setClipMethod(Potree.ClipMethod.INSIDE_ANY);
      hideDepthControls();
    }

    // -- Show depth controls UI in sidebar --
    function showDepthControls(c) {
      hideDepthControls();
      var container = document.getElementById('enable-constraint-list');
      if (!container) return;

      var div = document.createElement('div');
      div.id = 'enable-plane-depth-controls';

      div.innerHTML =
        '<div class="depth-title">\u2316 ' + c.name + ' \u2014 Depth Slab</div>' +
        '<div class="depth-row">' +
          '<label>Behind:</label>' +
          '<input type="number" id="depth-behind" value="20" step="5" min="0">' +
          '<span class="unit">mm</span>' +
        '</div>' +
        '<div class="depth-row">' +
          '<label>In front:</label>' +
          '<input type="number" id="depth-front" value="20" step="5" min="0">' +
          '<span class="unit">mm</span>' +
        '</div>' +
        '<button id="btn-exit-plane-ortho">Exit Plane View</button>';

      container.parentNode.insertBefore(div, container.nextSibling);

      // Wire up live updating
      var behindInput = document.getElementById('depth-behind');
      var frontInput = document.getElementById('depth-front');

      function onDepthChange() {
        var behind = parseFloat(behindInput.value) || 0;
        var front = parseFloat(frontInput.value) || 0;
        if (behind < 0) behind = 0;
        if (front < 0) front = 0;
        if (planeOrthoConstraint) {
          createOrUpdateDepthSlab(planeOrthoConstraint, behind, front);
        }
      }
      behindInput.addEventListener('input', onDepthChange);
      frontInput.addEventListener('input', onDepthChange);

      document.getElementById('btn-exit-plane-ortho').addEventListener('click', function() {
        exitPlaneOrtho();
      });
    }

    // -- Hide depth controls UI --
    function hideDepthControls() {
      var el = document.getElementById('enable-plane-depth-controls');
      if (el) el.remove();
    }

    // -- Exit plane ortho mode: remove slab, switch back to perspective --
    function exitPlaneOrtho() {
      removeDepthSlab();
      viewer.setCameraMode(Potree.CameraMode.PERSPECTIVE);
      showToast('Exited plane view');
    }

    // ===== MEMBER SKETCHING FUNCTIONS =====

    // -- Start member pick mode --
    function startMemberPick() {
      if (MARK_MODE) toggleMarkMode(true);
      if (constraintPickMode) cancelConstraintPick();
      memberPickMode = true;
      memberPickPoints = [];
      clearMemberPickMarkers();
      document.body.classList.add('member-pick-mode');
      showToast('Pick endpoint (1/2) for member', 5000);
      var btn = document.getElementById('btn-add-member');
      if (btn) btn.classList.add('active');
    }

    // -- Handle a picked point during member definition --
    function handleMemberPick(position) {
      memberPickPoints.push(position.clone());
      placeMemberPickMarker(position);
      undoStack.push({ type: 'member-point' });
      if (memberPickPoints.length < 2) {
        showToast('Pick endpoint (2/2) for member', 5000);
      } else {
        finalizeMember();
      }
    }

    // -- Cancel member pick mode --
    function cancelMemberPick() {
      memberPickMode = false;
      memberPickPoints = [];
      clearMemberPickMarkers();
      document.body.classList.remove('member-pick-mode');
      var btn = document.getElementById('btn-add-member');
      if (btn) btn.classList.remove('active');
      showToast('Member picking cancelled');
    }

    // -- Place temporary orange marker during member picking --
    function placeMemberPickMarker(position) {
      var ptGroup = new THREE.Group();
      ptGroup.position.copy(position);
      ptGroup.userData.isMemberPickMarker = true;
      // Filled dot at center
      var dotGeo = new THREE.CircleGeometry(ringInnerRadius, RING_SEGMENTS);
      var dotMat = new THREE.MeshBasicMaterial({
        color: 0xff9900, depthTest: false, depthWrite: false,
        transparent: true, opacity: 0.9, side: THREE.DoubleSide
      });
      ptGroup.add(new THREE.Mesh(dotGeo, dotMat));
      // Additive glow
      ptGroup.add(createGlowSprite(0xff9900, ringOuterRadius));
      memberScene.add(ptGroup);
      memberPickMarkers.push(ptGroup);
    }

    // -- Remove temporary member pick markers --
    function clearMemberPickMarkers() {
      for (var i = 0; i < memberPickMarkers.length; i++) {
        var m = memberPickMarkers[i];
        m.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) obj.material.dispose();
        });
        memberScene.remove(m);
      }
      memberPickMarkers.length = 0;
    }

    // -- Finalize member from 2 picked points --
    function finalizeMember() {
      clearMemberPickMarkers();
      var member = {
        id: nextMemberId++,
        name: 'M' + (nextMemberId - 1),
        points: [memberPickPoints[0].clone(), memberPickPoints[1].clone()],
        visual: null,
        visible: true,
        locked: false
      };
      buildMemberVisual(member);
      members.push(member);
      rebuildMemberList();
      // Replace member-point undo entries with a single member entry
      while (undoStack.length > 0 && undoStack[undoStack.length - 1].type === 'member-point') {
        undoStack.pop();
      }
      undoStack.push({ type: 'member', id: member.id });
      showToast(member.name + ' created');

      memberPickMode = false;
      memberPickPoints = [];
      document.body.classList.remove('member-pick-mode');
      var btn = document.getElementById('btn-add-member');
      if (btn) btn.classList.remove('active');
    }

    // -- Create a label sprite with text --
    function createLabelSprite(text, position) {
      var canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 64;
      var ctx = canvas.getContext('2d');
      ctx.font = 'bold 36px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 64, 32);
      var texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      var mat = new THREE.SpriteMaterial({
        map: texture, depthTest: false, depthWrite: false,
        transparent: true, sizeAttenuation: false
      });
      var sprite = new THREE.Sprite(mat);
      sprite.position.copy(position);
      sprite.scale.set(0.08, 0.04, 1);
      sprite.userData.isMemberLabel = true;
      return sprite;
    }

    // -- Build 3D visual for a member --
    function buildMemberVisual(member) {
      var group = new THREE.Group();
      group.name = 'member-' + member.id;

      // Line between endpoints
      var lineGeo = new THREE.BufferGeometry().setFromPoints(member.points);
      var lineMat = new THREE.LineBasicMaterial({
        color: 0xff9900, depthTest: false, depthWrite: false,
        transparent: true, opacity: 0.9, linewidth: 2
      });
      group.add(new THREE.Line(lineGeo, lineMat));

      // Endpoint markers (dot + glow in orange)
      for (var k = 0; k < 2; k++) {
        var ptGroup = new THREE.Group();
        ptGroup.position.copy(member.points[k]);
        ptGroup.userData.isMemberEndpoint = true;
        ptGroup.userData.pointIndex = k;
        // Filled dot at center
        var epDotGeo = new THREE.CircleGeometry(ringInnerRadius, RING_SEGMENTS);
        var epDotMat = new THREE.MeshBasicMaterial({
          color: 0xff9900, depthTest: false, depthWrite: false,
          transparent: true, opacity: 0.9, side: THREE.DoubleSide
        });
        ptGroup.add(new THREE.Mesh(epDotGeo, epDotMat));
        // Additive glow
        ptGroup.add(createGlowSprite(0xff9900, ringOuterRadius));
        group.add(ptGroup);
      }

      // Label sprite at midpoint
      var midpoint = new THREE.Vector3().addVectors(member.points[0], member.points[1]).multiplyScalar(0.5);
      var label = createLabelSprite(member.name, midpoint);
      group.add(label);

      member.visual = group;
      if (member.visible === false) group.visible = false;
      memberScene.add(group);
    }

    // -- Rebuild visual for a member (dispose old, build new) --
    function recomputeMemberVisual(m) {
      if (m.visual) {
        m.visual.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            if (obj.material.map) obj.material.map.dispose();
            obj.material.dispose();
          }
        });
        memberScene.remove(m.visual);
        m.visual = null;
      }
      buildMemberVisual(m);
    }

    // -- Rebuild member sidebar list --
    function rebuildMemberList() {
      var listEl = document.getElementById('enable-member-list');
      if (!listEl) return;
      listEl.innerHTML = '';

      for (var mi = 0; mi < members.length; mi++) {
        (function(m) {
          var row = document.createElement('div');
          row.className = 'member-row';

          var nameSpan = document.createElement('span');
          nameSpan.className = 'member-name';
          nameSpan.textContent = m.name;
          nameSpan.title = 'Click to rename';
          nameSpan.addEventListener('click', function() {
            var input = document.createElement('input');
            input.type = 'text';
            input.value = m.name;
            input.style.cssText = 'width:60px;font:12px/1.3 sans-serif;background:#333;color:#fff;border:1px solid #666;border-radius:2px;padding:1px 3px;';
            nameSpan.replaceWith(input);
            input.focus();
            input.select();
            function commit() {
              var val = input.value.trim();
              if (val && val !== m.name) {
                m.name = val;
                recomputeMemberVisual(m);
              }
              rebuildMemberList();
            }
            input.addEventListener('blur', commit);
            input.addEventListener('keydown', function(ev) {
              if (ev.key === 'Enter') { ev.preventDefault(); commit(); }
              if (ev.key === 'Escape') { ev.preventDefault(); rebuildMemberList(); }
            });
          });
          row.appendChild(nameSpan);

          var visBtn = document.createElement('button');
          visBtn.className = 'btn-vis' + (m.visible === false ? ' hidden' : '');
          visBtn.textContent = '\uD83D\uDC41';
          visBtn.title = 'Toggle visibility';
          visBtn.addEventListener('click', function() {
            m.visible = !m.visible;
            if (m.visual) m.visual.visible = m.visible;
            visBtn.classList.toggle('hidden', !m.visible);
          });
          row.appendChild(visBtn);

          var lockBtn = document.createElement('button');
          lockBtn.className = 'btn-lock' + (m.locked ? ' locked' : '');
          lockBtn.textContent = m.locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
          lockBtn.title = m.locked ? 'Unlock to move' : 'Lock position';
          lockBtn.addEventListener('click', function() {
            m.locked = !m.locked;
            lockBtn.textContent = m.locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
            lockBtn.title = m.locked ? 'Unlock to move' : 'Lock position';
            lockBtn.classList.toggle('locked', m.locked);
          });
          row.appendChild(lockBtn);

          var deleteBtn = document.createElement('button');
          deleteBtn.textContent = '\u00d7';
          deleteBtn.title = 'Delete member';
          deleteBtn.addEventListener('click', function() {
            deleteMember(m.id);
          });
          row.appendChild(deleteBtn);

          listEl.appendChild(row);
        })(members[mi]);
      }
    }

    // -- Delete a member --
    function deleteMember(id) {
      var idx = -1;
      for (var i = 0; i < members.length; i++) {
        if (members[i].id === id) { idx = i; break; }
      }
      if (idx === -1) return;
      var m = members[idx];
      if (m.visual) {
        m.visual.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            if (obj.material.map) obj.material.map.dispose();
            obj.material.dispose();
          }
        });
        memberScene.remove(m.visual);
      }
      members.splice(idx, 1);
      rebuildMemberList();
    }

    // -- Find nearest member endpoint to mouse (screen-space hit test) --
    function findNearestMemberEndpoint(mousePixel) {
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = 25;
      var bestResult = null;
      for (var mi = 0; mi < members.length; mi++) {
        var m = members[mi];
        if (!m.visible || m.locked) continue;
        for (var pi = 0; pi < m.points.length; pi++) {
          var pt = m.points[pi].clone().project(camera);
          var screenX = (pt.x * 0.5 + 0.5) * rect.width;
          var screenY = (1 - (pt.y * 0.5 + 0.5)) * rect.height;
          var dx = screenX - mousePixel.x;
          var dy = screenY - mousePixel.y;
          var dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < bestDist) {
            bestDist = dist;
            bestResult = { member: m, pointIndex: pi };
          }
        }
      }
      return bestResult;
    }

    // -- Find nearest marker (for dragging — skips locked markers) --
    function findNearestMarker(mousePixel) {
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = 25;
      var bestResult = null;
      for (var i = 0; i < markedPoints.length; i++) {
        var m = markedPoints[i];
        if (m.locked || !m.visible) continue;
        var pt = m.visual.position.clone().project(camera);
        var screenX = (pt.x * 0.5 + 0.5) * rect.width;
        var screenY = (1 - (pt.y * 0.5 + 0.5)) * rect.height;
        var dx = screenX - mousePixel.x;
        var dy = screenY - mousePixel.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < bestDist) {
          bestDist = dist;
          bestResult = { mark: m, index: i };
        }
      }
      return bestResult;
    }

    var markerDragActive = false;
    var markerDragInfo = null;

    // -- Find nearest snap target (member endpoints, constraint points, measurement points) --
    function findSnapTarget(mousePixel, threshold) {
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = threshold;
      var bestResult = null;

      function check(worldPos, label) {
        var pt = worldPos.clone().project(camera);
        var screenX = (pt.x * 0.5 + 0.5) * rect.width;
        var screenY = (1 - (pt.y * 0.5 + 0.5)) * rect.height;
        var dx = screenX - mousePixel.x;
        var dy = screenY - mousePixel.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < bestDist) {
          bestDist = dist;
          bestResult = { position: worldPos.clone(), label: label };
        }
      }

      // Member endpoints
      for (var mi = 0; mi < members.length; mi++) {
        var m = members[mi];
        if (!m.visible) continue;
        check(m.points[0], m.name + ' start');
        check(m.points[1], m.name + ' end');
      }

      // Constraint definition points
      for (var ci = 0; ci < constraints.length; ci++) {
        var c = constraints[ci];
        if (!c.visible) continue;
        for (var pi = 0; pi < c.points.length; pi++) {
          check(c.points[pi], c.name + ' pt' + (pi + 1));
        }
      }

      // Measurement points
      var measurements = viewer.scene.measurements || [];
      for (var i = 0; i < measurements.length; i++) {
        var meas = measurements[i];
        var nums = measurePointNumbers.get(meas);
        for (var j = 0; j < meas.points.length; j++) {
          var pos = meas.points[j].position || meas.points[j];
          var pLabel = nums && j < nums.length ? 'D' + nums[j] : 'D?';
          check(pos, pLabel);
        }
      }

      return bestResult;
    }

    // -- Export members as DXF --
    function exportMembersDXF() {
      if (members.length === 0) {
        showToast('No members to export');
        return;
      }
      var lines = [];
      lines.push('0', 'SECTION', '2', 'TABLES');
      lines.push('0', 'TABLE', '2', 'LAYER', '70', '' + members.length);
      for (var i = 0; i < members.length; i++) {
        lines.push('0', 'LAYER', '2', members[i].name, '70', '0', '62', '7', '6', 'CONTINUOUS');
      }
      lines.push('0', 'ENDTAB');
      lines.push('0', 'ENDSEC');
      lines.push('0', 'SECTION', '2', 'ENTITIES');
      for (var j = 0; j < members.length; j++) {
        var m = members[j];
        lines.push('0', 'LINE', '8', m.name);
        lines.push('10', '' + m.points[0].x, '20', '' + m.points[0].y, '30', '' + m.points[0].z);
        lines.push('11', '' + m.points[1].x, '21', '' + m.points[1].y, '31', '' + m.points[1].z);
      }
      lines.push('0', 'ENDSEC');
      lines.push('0', 'EOF');
      var content = lines.join('\n');
      var blob = new Blob([content], { type: 'application/dxf' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'members.dxf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Exported ' + members.length + ' member(s) to DXF');
    }

    // -- Render constraint + member visuals in overlay pass --
    viewer.addEventListener("render.pass.perspective_overlay", function(e) {
      var camera = viewer.scene.getActiveCamera();

      // Constraint visuals
      if (constraintScene.children.length > 0) {
        for (var ci = 0; ci < constraints.length; ci++) {
          var c = constraints[ci];
          if (!c.visual) continue;
          c.visual.traverse(function(obj) {
            if (obj.userData && obj.userData.isDefinitionPoint) {
              obj.quaternion.copy(camera.quaternion);
            }
          });
        }
        viewer.renderer.render(constraintScene, camera);
      }

      // Member visuals
      if (memberScene.children.length > 0) {
        for (var mi = 0; mi < members.length; mi++) {
          var m = members[mi];
          if (!m.visual) continue;
          m.visual.traverse(function(obj) {
            if (obj.userData && obj.userData.isMemberEndpoint) {
              obj.quaternion.copy(camera.quaternion);
            }
          });
        }
        // Billboard pick markers too
        for (var pi = 0; pi < memberPickMarkers.length; pi++) {
          memberPickMarkers[pi].quaternion.copy(camera.quaternion);
        }
        viewer.renderer.render(memberScene, camera);
      }

      // Elevation contours moved to render.pass.depth_overlay (depth-tested against point cloud)

      // Measurement point labels — push outward along the segment so the D#
      // label is on the OPPOSITE side of the endpoint from the segment midpoint
      // (where Potree's edge/height/area dimension labels sit). Guarantees the
      // D# label never sits on top of the dimension value.
      if (measureLabelScene.children.length > 0) {
        var cw = viewer.renderer.getSize(new THREE.Vector2()).width;
        var ch = viewer.renderer.getSize(new THREE.Vector2()).height;
        var isOrtho = camera instanceof THREE.OrthographicCamera;
        var OFFSET_PX = 26;
        measurePointLabels.forEach(function(labels, measure) {
          var pts = measure.points;
          // Pre-project all this measure's points to screen space
          var projected = new Array(pts.length);
          for (var pi = 0; pi < pts.length; pi++) {
            var pp = pts[pi].position ? pts[pi].position : pts[pi];
            if (!pp) { projected[pi] = null; continue; }
            var sp = pp.clone().project(camera);
            projected[pi] = {
              x: (sp.x + 1) * cw / 2,
              y: (-sp.y + 1) * ch / 2,
              z: sp.z
            };
          }
          for (var li = 0; li < labels.length; li++) {
            var lbl = labels[li];
            var pt = pts[li];
            if (!pt) continue;
            var worldPos = pt.position ? pt.position : pt;
            var dist = camera.position.distanceTo(worldPos);
            var pr = Potree.Utils.projectedRadius(1, camera, dist, cw, ch);
            if (!pr || !isFinite(pr) || pr < 0.001) pr = 1;
            var s = (70 / pr);
            lbl.scale.set(s, s, s);

            var thisScr = projected[li];
            if (!thisScr) continue;

            // Compute outward direction in screen space — sum of unit vectors
            // pointing AWAY from each adjacent point.
            var outX = 0, outY = 0, contributors = 0;
            var neighborIdxs = [li - 1, li + 1];
            for (var ni = 0; ni < neighborIdxs.length; ni++) {
              var nIdx = neighborIdxs[ni];
              if (nIdx < 0 || nIdx >= pts.length) continue;
              var nScr = projected[nIdx];
              if (!nScr) continue;
              var dxs = thisScr.x - nScr.x;
              var dys = thisScr.y - nScr.y;
              var slen = Math.sqrt(dxs * dxs + dys * dys);
              if (slen > 0.5) {
                outX += dxs / slen;
                outY += dys / slen;
                contributors++;
              }
            }
            if (contributors === 0) {
              // Single isolated point or all neighbors at same screen pos — default upward
              outY = -1;
            } else {
              var olen = Math.sqrt(outX * outX + outY * outY);
              if (olen < 0.001) {
                // Endpoints cancel (e.g., centerpoint of a straight 3-pt line) — go upward
                outX = 0; outY = -1;
              } else {
                outX /= olen; outY /= olen;
              }
            }

            var screenX = thisScr.x + outX * OFFSET_PX;
            var screenY = thisScr.y + outY * OFFSET_PX;

            // Unproject back to world — works for both perspective and ortho
            var ndcX = (screenX / cw) * 2 - 1;
            var ndcY = -(screenY / ch) * 2 + 1;
            var nearPoint = new THREE.Vector3(ndcX, ndcY, thisScr.z).unproject(camera);

            if (isOrtho) {
              lbl.position.copy(nearPoint);
            } else {
              var dir = nearPoint.sub(camera.position).normalize();
              lbl.position.copy(camera.position.clone().add(dir.multiplyScalar(dist)));
            }
          }
        });
        viewer.renderer.render(measureLabelScene, camera);
      }
    });

    // -- Render elevation contours + labels with depth testing against point cloud --
    viewer.addEventListener("render.pass.depth_overlay", function(e) {
      if (elevationContoursVisible && elevationScene.children.length > 0) {
        var camera = viewer.scene.getActiveCamera();
        try { viewer.renderer.render(elevationScene, camera); } catch(e) { console.warn('Elevation scene render error:', e); }
      }
    });

    // -- Elevation: re-color newly streamed nodes each frame --
    viewer.addEventListener('update', elevationFrameUpdate);

    // -- Toggle mark mode --
    function toggleMarkMode(forceOff) {
      if (forceOff) {
        MARK_MODE = false;
      } else {
        MARK_MODE = !MARK_MODE;
      }
      if (MARK_MODE && constraintPickMode) cancelConstraintPick();
      if (MARK_MODE && memberPickMode) cancelMemberPick();
      document.body.classList.toggle('mark-mode', MARK_MODE);
      showToast(MARK_MODE ? "Mark mode ON  (click to mark, X or ESC to exit)" : "Mark mode OFF");
      // Update button state
      const btn = document.getElementById('btn-mark-mode');
      if (btn) btn.classList.toggle('active', MARK_MODE);
    }

    // ===== MEASUREMENT POINT LABEL FUNCTIONS =====

    // -- Create a Potree TextSprite label for measurement points --
    function createMeasurePointLabel(text, position) {
      var label = new Potree.TextSprite(text);
      label.setTextColor({r: 255, g: 0, b: 0, a: 1.0});
      label.setBorderColor({r: 0, g: 0, b: 0, a: 0.0});
      label.setBackgroundColor({r: 0, g: 0, b: 0, a: 0.0});
      // TextSprite generates its texture in its constructor at the default fontsize (28).
      // Setting .fontsize alone does NOT regenerate the texture; we must call update()
      // to re-render the canvas at the new size so D# matches Potree's edge labels (16).
      label.fontsize = 16;
      label.update();
      label.material.depthTest = false;
      label.material.depthWrite = false;
      label.material.transparent = true;
      label.position.copy(position);
      label.userData.isMeasureLabel = true;
      return label;
    }

    // -- Get the D-name for a given point index within a measure --
    function getPointName(measure, idx) {
      var nums = measurePointNumbers.get(measure);
      if (nums && idx < nums.length) return 'D' + nums[idx];
      return 'D?';
    }

    // -- Sync labels for a measurement (create/remove/update) --
    function syncMeasurePointLabels(measure) {
      var labels = measurePointLabels.get(measure);
      if (!labels) { labels = []; measurePointLabels.set(measure, labels); }
      var nums = measurePointNumbers.get(measure);
      if (!nums) { nums = []; measurePointNumbers.set(measure, nums); }

      var pts = measure.points;

      // Reclaim P-numbers for removed ghost points (e.g. ESC during measurement)
      while (nums.length > pts.length) {
        var removed = nums.pop();
        // Reclaim if it was the very latest assigned number
        if (removed === nextPointNumber - 1) {
          nextPointNumber--;
        }
      }

      // Assign global P-numbers to any new points
      while (nums.length < pts.length) {
        nums.push(nextPointNumber++);
      }

      // Remove excess labels
      while (labels.length > pts.length) {
        var old = labels.pop();
        measureLabelScene.remove(old);
        old.traverse(function(obj) {
          if (obj.material) {
            if (obj.material.map) obj.material.map.dispose();
            obj.material.dispose();
          }
        });
      }
      // Create missing labels
      while (labels.length < pts.length) {
        var idx = labels.length;
        var pos = pts[idx].position ? pts[idx].position.clone() : pts[idx].clone();
        var lbl = createMeasurePointLabel('D' + nums[idx], pos);
        lbl.visible = measure.visible;
        measureLabelScene.add(lbl);
        labels.push(lbl);
      }
      // Update positions
      for (var i = 0; i < labels.length; i++) {
        var p = pts[i].position ? pts[i].position : pts[i];
        labels[i].position.copy(p);
        labels[i].visible = measure.visible;
      }
    }

    // -- Remove all labels for a measurement --
    function removeMeasurePointLabels(measure) {
      var labels = measurePointLabels.get(measure);
      if (labels) {
        for (var i = 0; i < labels.length; i++) {
          measureLabelScene.remove(labels[i]);
          labels[i].traverse(function(obj) {
            if (obj.material) {
              if (obj.material.map) obj.material.map.dispose();
              obj.material.dispose();
            }
          });
        }
        measurePointLabels.delete(measure);
      }
      measurePointNumbers.delete(measure);
    }

    // -- Hook measurement events for labels + sidebar --
    var _measListTimer = null;
    function debouncedRebuildMeasList() {
      clearTimeout(_measListTimer);
      _measListTimer = setTimeout(rebuildAllMeasurementLists, 80);
    }

    // ===== INSERTION-STATE TRACKING =====
    // Potree's MeasuringTool/VolumeTool startInsertion does not auto-cancel a
    // previously started insertion, and `cancel_insertions` only removes its
    // mouseup listeners — it leaves the dangling cursor-follow sphere in scene
    // and the InputHandler still mid-drag. So we track which measurement is
    // currently being inserted and provide a hard "cancel + cleanup" routine.
    var pendingMeasurement = null;
    var lastMeasurementToolArgs = null;   // last viewer.measuringTool.startInsertion args
    var lastVolumeToolArgs = null;        // last viewer.volumeTool.startInsertion args

    function _measureMinPoints(m) {
      if (!m) return 2;
      if (m.showArea || m.showAngles) return 3;
      return 2;
    }

    function cleanupOrphanMeasurements() {
      var meas = (viewer.scene.measurements || []).slice();
      for (var i = 0; i < meas.length; i++) {
        var m = meas[i];
        if (m.points.length < _measureMinPoints(m)) {
          viewer.scene.removeMeasurement(m);
        }
      }
    }

    function cancelPotreeInsertion() {
      try { viewer.dispatchEvent({ type: 'cancel_insertions' }); } catch (_) {}
      try { if (viewer.inputHandler) viewer.inputHandler.drag = null; } catch (_) {}
      cleanupOrphanMeasurements();
      pendingMeasurement = null;
    }

    function setupMeasurementLabelEvents() {
      // Track in-progress measurement & remember last tool args so Enter can
      // restart the same tool. Wrap startInsertion on both tools.
      try {
        if (viewer.measuringTool && !viewer.measuringTool._enableWrapped) {
          var origMS = viewer.measuringTool.startInsertion.bind(viewer.measuringTool);
          viewer.measuringTool.startInsertion = function(args) {
            // Cancel any previous insertion first to avoid orphan cursor spheres
            cancelPotreeInsertion();
            lastMeasurementToolArgs = args || {};
            var m = origMS(args);
            pendingMeasurement = m;
            return m;
          };
          viewer.measuringTool._enableWrapped = true;
        }
        if (viewer.volumeTool && !viewer.volumeTool._enableWrapped) {
          var origVS = viewer.volumeTool.startInsertion.bind(viewer.volumeTool);
          viewer.volumeTool.startInsertion = function(args) {
            // Don't cancel prior measurement when starting volume — different tool family
            lastVolumeToolArgs = args || {};
            return origVS(args);
          };
          viewer.volumeTool._enableWrapped = true;
        }
      } catch (e) { console.warn('Tool wrapping failed:', e); }

      viewer.scene.addEventListener('measurement_added', function(e) {
        var m = e.measurement;
        syncMeasurePointLabels(m);
        rebuildAllMeasurementLists();
        m.addEventListener('marker_added', function() {
          syncMeasurePointLabels(m);
          debouncedRebuildMeasList();
          undoStack.push({ type: 'measurement-point', measure: m });
          // If the in-progress measurement reaches its maxMarkers, the Potree
          // tool ends insertion automatically; clear our pending tracker.
          if (pendingMeasurement === m && m.maxMarkers && m.points.length >= m.maxMarkers) {
            pendingMeasurement = null;
          }
        });
        m.addEventListener('marker_moved', function() {
          syncMeasurePointLabels(m);
          debouncedRebuildMeasList();
        });
        m.addEventListener('marker_removed', function() {
          syncMeasurePointLabels(m);
          debouncedRebuildMeasList();
        });
      });
      viewer.scene.addEventListener('measurement_removed', function(e) {
        removeMeasurePointLabels(e.measurement);
        if (pendingMeasurement === e.measurement) pendingMeasurement = null;
        rebuildAllMeasurementLists();
      });
      // Volume add/remove (Potree's volume tool) — refresh the volume list,
      // and keep it live during drag/scale of user-created measurement volumes
      viewer.scene.addEventListener('volume_added', function(e) {
        debouncedRebuildMeasList();
        var vol = e.volume;
        if (!vol || !isUserVolumeMeasurement(vol)) return;
        vol.addEventListener('scale_changed', debouncedRebuildMeasList);
        vol.addEventListener('position_changed', debouncedRebuildMeasList);
        vol.addEventListener('orientation_changed', debouncedRebuildMeasList);
      });
      viewer.scene.addEventListener('volume_removed', function() {
        debouncedRebuildMeasList();
      });
    }

    // Restart the most-recently-used measurement (or volume) tool. Used by Enter.
    function restartLastMeasurementTool() {
      if (lastMeasurementToolArgs && viewer.measuringTool) {
        viewer.measuringTool.startInsertion(lastMeasurementToolArgs);
        return true;
      }
      if (lastVolumeToolArgs && viewer.volumeTool) {
        viewer.volumeTool.startInsertion(lastVolumeToolArgs);
        return true;
      }
      return false;
    }

    // Delete a single point from a measurement; if the measurement would drop
    // below its required minimum, remove the whole measurement.
    function deleteMeasurementPoint(measure, idx) {
      if (!measure || !measure.points || idx < 0 || idx >= measure.points.length) return;
      var minReq = _measureMinPoints(measure);
      if (measure.points.length - 1 < minReq) {
        viewer.scene.removeMeasurement(measure);
        showToast('Removed measurement (would have too few points)');
      } else {
        measure.removeMarker(idx);
        showToast('Removed point');
      }
    }

    // ===== TRUE 3D POLYGON AREA (Newell's method) =====
    // Potree's getArea() uses an XY-only shoelace formula, so any polygon on
    // a vertical or angled surface returns 0 m². Newell's method computes the
    // best-fit-plane normal and gives the true 3D surface area regardless of
    // polygon orientation.
    function compute3DPolygonArea(pts) {
      if (!pts || pts.length < 3) return 0;
      var nx = 0, ny = 0, nz = 0;
      for (var i = 0; i < pts.length; i++) {
        var a = pts[i].position ? pts[i].position : pts[i];
        var b = pts[(i + 1) % pts.length].position ? pts[(i + 1) % pts.length].position : pts[(i + 1) % pts.length];
        nx += (a.y - b.y) * (a.z + b.z);
        ny += (a.z - b.z) * (a.x + b.x);
        nz += (a.x - b.x) * (a.y + b.y);
      }
      return 0.5 * Math.sqrt(nx * nx + ny * ny + nz * nz);
    }

    // ===== USER-CREATED VOLUMES (excludes our internally managed boxes) =====
    function isUserVolumeMeasurement(vol) {
      if (!vol) return false;
      if (typeof initialClipBox !== 'undefined' && vol === initialClipBox) return false;
      if (typeof planeOrthoSlab !== 'undefined' && vol === planeOrthoSlab) return false;
      if (typeof cutoutBoxes !== 'undefined' && cutoutBoxes.indexOf(vol) >= 0) return false;
      if (typeof elevationCropVolumes !== 'undefined' && elevationCropVolumes.indexOf(vol) >= 0) return false;
      return true;
    }

    function rebuildAllMeasurementLists() {
      rebuildMeasurementList();
      rebuildAreaList();
      rebuildAngleList();
      rebuildVolumeList();
    }

    // ===== PERSISTENT MEASUREMENT SIDEBAR LIST =====

    function rebuildMeasurementList() {
      var listEl = document.getElementById('enable-measurement-list');
      if (!listEl) return;
      var measurements = viewer.scene.measurements || [];
      // Show distance and vertical-height measurements (skip area/angle/coord-only)
      var distMeasures = [];
      for (var i = 0; i < measurements.length; i++) {
        var m = measurements[i];
        if ((m.showDistances || m.showHeight) && !m.showArea && !m.showAngles) distMeasures.push(m);
      }

      if (distMeasures.length === 0) {
        listEl.innerHTML = '';
        return;
      }

      var html = '<div class="enable-list-section-label">Distance &amp; Height</div>';
      for (var mi = 0; mi < distMeasures.length; mi++) {
        var measure = distMeasures[mi];
        var nums = measurePointNumbers.get(measure);
        var pts = measure.points;
        if (!nums || pts.length < 2) {
          // Show placeholder for incomplete measurement
          var pName = (nums && nums.length > 0) ? 'D' + nums[0] : '...';
          html += '<div class="enable-meas-item">' +
            '<div class="meas-header"><span class="meas-title">' + pName + '... (picking)</span></div>' +
            '</div>';
          continue;
        }

        var firstName = 'D' + nums[0];
        var lastName = 'D' + nums[nums.length - 1];
        html += '<div class="enable-meas-item">' +
          '<div class="meas-header">' +
          '<span class="meas-title">' + firstName + ' \u2192 ' + lastName + '</span>' +
          '<button class="meas-delete" data-meas-idx="' + mi + '" title="Delete measurement">\u00d7</button>' +
          '</div>';

        // Per-point delete chips
        var chipsHtml = '<div class="enable-meas-points">';
        for (var ci = 0; ci < pts.length; ci++) {
          var cName = ci < nums.length ? 'D' + nums[ci] : ('P' + (ci + 1));
          chipsHtml += '<span class="point-chip">' + cName +
            '<button data-pt-list="dist" data-pt-mi="' + mi + '" data-pt-idx="' + ci + '" title="Delete this point">\u00d7</button>' +
            '</span>';
        }
        chipsHtml += '</div>';
        html += chipsHtml;

        var isHeight = measure.showHeight && !measure.showDistances;
        var total3D = 0, totalXY = 0, totalZ = 0;
        for (var si = 0; si < pts.length - 1; si++) {
          var a = pts[si].position ? pts[si].position : pts[si];
          var b = pts[si + 1].position ? pts[si + 1].position : pts[si + 1];
          var dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
          var d3d = Math.sqrt(dx * dx + dy * dy + dz * dz);
          var dxy = Math.sqrt(dx * dx + dy * dy);
          var absZ = Math.abs(dz);
          var zSign = dz >= 0 ? '+' : '-';
          total3D += d3d; totalXY += dxy; totalZ += absZ;

          var segVals = isHeight
            ? 'Vert:' + absZ.toFixed(3) + '(' + zSign + ')'
            : '3D:' + d3d.toFixed(3) + ' XY:' + dxy.toFixed(3) + ' Z:' + absZ.toFixed(3) + '(' + zSign + ')';
          html += '<div class="enable-meas-seg">' +
            '<span class="seg-name">D' + nums[si] + '\u2192D' + nums[si + 1] + '</span>' +
            '<span class="seg-vals">' + segVals + '</span>' +
            '</div>';
        }
        // Total row if multi-segment
        if (pts.length > 2) {
          var totalVals = isHeight
            ? 'Vert:' + totalZ.toFixed(3)
            : '3D:' + total3D.toFixed(3) + ' XY:' + totalXY.toFixed(3) + ' Z:' + totalZ.toFixed(3);
          html += '<div class="enable-meas-seg seg-total">' +
            '<span class="seg-name">Total</span>' +
            '<span class="seg-vals">' + totalVals + '</span>' +
            '</div>';
        }
        html += '</div>';
      }
      listEl.innerHTML = html;

      // Bind delete buttons
      listEl.querySelectorAll('.meas-delete').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var idx = parseInt(btn.getAttribute('data-meas-idx'));
          if (distMeasures[idx]) {
            viewer.scene.removeMeasurement(distMeasures[idx]);
          }
        });
      });
      // Per-point delete chips
      listEl.querySelectorAll('.point-chip button').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var mi = parseInt(btn.getAttribute('data-pt-mi'));
          var pi = parseInt(btn.getAttribute('data-pt-idx'));
          if (distMeasures[mi]) deleteMeasurementPoint(distMeasures[mi], pi);
        });
      });
    }

    // ===== AREA LIST =====
    function rebuildAreaList() {
      var listEl = document.getElementById('enable-area-list');
      if (!listEl) return;
      var measurements = viewer.scene.measurements || [];
      var areaMeasures = [];
      for (var i = 0; i < measurements.length; i++) {
        if (measurements[i].showArea) areaMeasures.push(measurements[i]);
      }
      if (areaMeasures.length === 0) { listEl.innerHTML = ''; return; }

      var html = '<div class="enable-list-section-label">Areas</div>';
      for (var mi = 0; mi < areaMeasures.length; mi++) {
        var measure = areaMeasures[mi];
        var nums = measurePointNumbers.get(measure);
        var pts = measure.points;
        if (!pts || pts.length < 3) {
          var pName = (nums && nums.length > 0) ? 'D' + nums[0] : '...';
          html += '<div class="enable-meas-item">' +
            '<div class="meas-header"><span class="meas-title">' + pName + '... (picking, need 3+)</span></div>' +
            '</div>';
          continue;
        }
        var firstName = nums && nums.length > 0 ? 'D' + nums[0] : 'D?';
        var lastName  = nums && nums.length > 0 ? 'D' + nums[nums.length - 1] : 'D?';
        var area3D = compute3DPolygonArea(pts);
        // XY plan area for reference (Potree's native shoelace)
        var areaXY = (typeof measure.getArea === 'function') ? measure.getArea() : 0;
        var perim = 0;
        for (var pi = 0; pi < pts.length; pi++) {
          var a = pts[pi].position ? pts[pi].position : pts[pi];
          var b = pts[(pi + 1) % pts.length].position ? pts[(pi + 1) % pts.length].position : pts[(pi + 1) % pts.length];
          var dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
          perim += Math.sqrt(dx * dx + dy * dy + dz * dz);
        }
        var aChips = '<div class="enable-meas-points">';
        for (var aci = 0; aci < pts.length; aci++) {
          var acName = nums && aci < nums.length ? 'D' + nums[aci] : ('P' + (aci + 1));
          aChips += '<span class="point-chip">' + acName +
            '<button data-pt-list="area" data-pt-mi="' + mi + '" data-pt-idx="' + aci + '" title="Delete this point">\u00d7</button>' +
            '</span>';
        }
        aChips += '</div>';
        html += '<div class="enable-meas-item">' +
          '<div class="meas-header">' +
          '<span class="meas-title">' + firstName + ' \u2192 ' + lastName + ' (' + pts.length + ' pts)</span>' +
          '<button class="meas-delete" data-area-idx="' + mi + '" title="Delete area">\u00d7</button>' +
          '</div>' +
          aChips +
          '<div class="enable-meas-seg">' +
            '<span class="seg-name">Surface</span>' +
            '<span class="seg-vals">' + area3D.toFixed(3) + ' m\u00b2</span>' +
          '</div>' +
          '<div class="enable-meas-seg">' +
            '<span class="seg-name">Plan (XY)</span>' +
            '<span class="seg-vals">' + areaXY.toFixed(3) + ' m\u00b2</span>' +
          '</div>' +
          '<div class="enable-meas-seg">' +
            '<span class="seg-name">Perimeter</span>' +
            '<span class="seg-vals">' + perim.toFixed(3) + ' m</span>' +
          '</div>' +
          '</div>';
      }
      listEl.innerHTML = html;
      listEl.querySelectorAll('.meas-delete').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var idx = parseInt(btn.getAttribute('data-area-idx'));
          if (areaMeasures[idx]) viewer.scene.removeMeasurement(areaMeasures[idx]);
        });
      });
      listEl.querySelectorAll('.point-chip button').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var mi = parseInt(btn.getAttribute('data-pt-mi'));
          var pi = parseInt(btn.getAttribute('data-pt-idx'));
          if (areaMeasures[mi]) deleteMeasurementPoint(areaMeasures[mi], pi);
        });
      });
    }

    // ===== ANGLE LIST =====

        var gChips = '<div class="enable-meas-points">';
        for (var gci = 0; gci < pts.length; gci++) {
          var gcName = nums && gci < nums.length ? 'D' + nums[gci] : ('P' + (gci + 1));
          gChips += '<span class="point-chip">' + gcName +
            '<button data-pt-list="angle" data-pt-mi="' + mi + '" data-pt-idx="' + gci + '" title="Delete this point">\u00d7</button>' +
            '</span>';
        }
        gChips += '</div>';
        html += gChips;
        // For each interior corner, compute the angle
        var lastIdx = pts.length - 1;
        var loop = !!measure.closed;
        for (var ai = 0; ai < pts.length; ai++) {
          if (!loop && (ai === 0 || ai === lastIdx)) continue;
          var rad = (typeof measure.getAngle === 'function') ? measure.getAngle(ai) : 0;
          if (!isFinite(rad)) rad = 0;
          var deg = rad * (180 / Math.PI);
          var nm = nums && ai < nums.length ? 'D' + nums[ai] : ('P' + (ai + 1));
          html += '<div class="enable-meas-seg">' +
            '<span class="seg-name">' + nm + '</span>' +
            '<span class="seg-vals">' + deg.toFixed(2) + '\u00b0</span>' +
            '</div>';
        }
        html += '</div>';
      }
      listEl.innerHTML = html;
      listEl.querySelectorAll('.meas-delete').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var idx = parseInt(btn.getAttribute('data-ang-idx'));
          if (angleMeasures[idx]) viewer.scene.removeMeasurement(angleMeasures[idx]);
        });
      });
      listEl.querySelectorAll('.point-chip button').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var mi = parseInt(btn.getAttribute('data-pt-mi'));
          var pi = parseInt(btn.getAttribute('data-pt-idx'));
          if (angleMeasures[mi]) deleteMeasurementPoint(angleMeasures[mi], pi);
        });
      });
    }

    // ===== VOLUME LIST =====
    function rebuildVolumeList() {
      var listEl = document.getElementById('enable-volume-list');
      if (!listEl) return;
      var allVolumes = (viewer.scene.volumes || []);
      var userVolumes = [];
      for (var i = 0; i < allVolumes.length; i++) {
        if (isUserVolumeMeasurement(allVolumes[i])) userVolumes.push(allVolumes[i]);
      }
      if (userVolumes.length === 0) { listEl.innerHTML = ''; return; }

      var html = '<div class="enable-list-section-label">Volumes</div>';
      for (var vi = 0; vi < userVolumes.length; vi++) {
        var vol = userVolumes[vi];
        var name = vol.name || ('Volume ' + (vi + 1));
        var sx = Math.abs(vol.scale.x), sy = Math.abs(vol.scale.y), sz = Math.abs(vol.scale.z);
        var v3 = (typeof vol.getVolume === 'function') ? vol.getVolume() : (sx * sy * sz);
        html += '<div class="enable-meas-item">' +
          '<div class="meas-header">' +
          '<span class="meas-title">' + name + '</span>' +
          '<button class="meas-delete" data-vol-idx="' + vi + '" title="Delete volume">\u00d7</button>' +
          '</div>' +
          '<div class="enable-meas-seg">' +
            '<span class="seg-name">Volume</span>' +
            '<span class="seg-vals">' + v3.toFixed(3) + ' m\u00b3</span>' +
          '</div>' +
          '<div class="enable-meas-seg">' +
            '<span class="seg-name">Size</span>' +
            '<span class="seg-vals">' + sx.toFixed(3) + ' \u00d7 ' + sy.toFixed(3) + ' \u00d7 ' + sz.toFixed(3) + ' m</span>' +
          '</div>' +
          '</div>';
      }
      listEl.innerHTML = html;
      listEl.querySelectorAll('.meas-delete').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var idx = parseInt(btn.getAttribute('data-vol-idx'));
          if (userVolumes[idx]) viewer.scene.removeVolume(userVolumes[idx]);
        });
      });
    }

    // ===== EXPORT ALL MEASUREMENTS TO TXT =====
    function exportAllMeasurements() {
      var measurements = viewer.scene.measurements || [];
      var distMeasures = [], areaMeasures = [], angleMeasures = [];
      for (var i = 0; i < measurements.length; i++) {
        var m = measurements[i];
        if (m.showArea && m.points.length >= 3) areaMeasures.push(m);
        else if (m.showAngles && m.points.length >= 3) angleMeasures.push(m);
        else if ((m.showDistances || m.showHeight) && m.points.length >= 2) distMeasures.push(m);
      }
      var allVolumes = (viewer.scene.volumes || []);
      var userVolumes = [];
      for (var vi = 0; vi < allVolumes.length; vi++) {
        if (isUserVolumeMeasurement(allVolumes[vi])) userVolumes.push(allVolumes[vi]);
      }
      var totalCount = distMeasures.length + areaMeasures.length + angleMeasures.length + userVolumes.length;
      if (totalCount === 0) { showToast('No measurements to export'); return; }

      var lines = [];
      lines.push('Measurements Export');
      lines.push('Distances/Heights: ' + distMeasures.length + ' | Areas: ' + areaMeasures.length +
                 ' | Angles: ' + angleMeasures.length + ' | Volumes: ' + userVolumes.length);
      lines.push('');

      for (var mi = 0; mi < distMeasures.length; mi++) {
        var measure = distMeasures[mi];
        var nums = measurePointNumbers.get(measure) || [];
        var pts = measure.points;
        var isHeight = measure.showHeight && !measure.showDistances;
        var typeLabel = isHeight ? ' [Vertical]' : '';

        var firstName = nums.length > 0 ? 'D' + nums[0] : 'D?';
        var lastName = nums.length > 0 ? 'D' + nums[nums.length - 1] : 'D?';
        lines.push('=== Measurement ' + (mi + 1) + typeLabel + ': ' + firstName + ' -> ' + lastName + ' ===');
        lines.push('');

        lines.push('Point Coordinates:');
        for (var pi = 0; pi < pts.length; pi++) {
          var p = pts[pi].position ? pts[pi].position : pts[pi];
          var pn = pi < nums.length ? 'D' + nums[pi] : 'D?';
