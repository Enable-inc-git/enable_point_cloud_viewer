<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Pomerleau Viewer</title>

  <!-- ===================== CSS ===================== -->
  <link rel="stylesheet" href="../libs/potree/potree.css">
  <link rel="stylesheet" href="../libs/jquery-ui/jquery-ui.min.css">
  <link rel="stylesheet" href="../libs/spectrum/spectrum.css">
  <link rel="stylesheet" href="../libs/jstree/themes/mixed/style.css">
  <link rel="stylesheet" href="./custom.css">

  <style>
    /* Layout */
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      background: #0f1318;
    }
    .potree_container { position: absolute; inset: 0; }
    #potree_render_area, #potree_sidebar_container { position: absolute; top: 0; bottom: 0; }

    /* Your widths (unchanged) */
    #potree_render_area       { left: 320px; right: 0; }
    #potree_sidebar_container { left: 0; right: auto; width: 320px; overflow-y: auto; }

    /* Sidebar logo header */
    #potree_sidebar_container::before{
      content:"";
      display:block;
      height:84px;
      margin:12px 12px 8px;
      background-image:url("../pomerleau_bleu_rgb.jpg");
      background-repeat:no-repeat;
      background-position:center;
      background-size:contain;
      border-bottom:1px solid rgba(255,255,255,.08);
    }

    /* Hide all native Potree menu panels — our custom groups replace them */
    #potree_menu > h3,
    #potree_menu > div:not(#enable-sidebar-groups) {
      display: none !important;
    }

    /* Hide map UI completely */
    #potree_toggle_map, .potree_toggle_map, .mapToggle,
    #menu_map, #map, #potree_map_container,
    .ol-viewport, .ol-overlaycontainer { display: none !important; }

    /* (Potree's native About/Appearance/Scene/Tools sections all hidden by the
       #potree_menu > h3 / > div:not(#enable-sidebar-groups) rule above) */

    /* Navigation section layout */
    #enable-nav-slot #navigation { list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 2px; }
    #enable-nav-slot #navigation .button-icon { width: 26px; height: 26px; cursor: pointer; opacity: 0.7; transition: opacity 0.15s; }
    #enable-nav-slot #navigation .button-icon:hover { opacity: 1; }
    /* Camera projection selectgroup on its own line */
    #enable-nav-slot #navigation #camera_projection_options { width: 100%; }
    #enable-nav-slot li { list-style: none; }

    /* Slightly tighter sidebar spacing */
    #potree_sidebar_container .accordion > div { padding: 6px 10px; }

    /* ===== Mark mode cursor ===== */
    body.mark-mode #potree_render_area { cursor: crosshair !important; }
    body.mark-mode #potree_render_area canvas { cursor: crosshair !important; }

    /* ===== Mark tool buttons ===== */
    #enable-mark-buttons { margin: 6px 0; display: flex; gap: 6px; }
    #enable-mark-buttons button {
      flex: 1; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-mark-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }
    #enable-mark-buttons button.active {
      background: var(--accent, #4db6ff) !important;
      color: #000 !important; border-color: var(--accent, #4db6ff) !important;
    }

    /* ===== Mark list rows ===== */
    .mark-row {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 6px; border-radius: 3px; margin: 2px 0;
      font: 12px/1.3 sans-serif; color: var(--sidebar-text, #fbfbfb);
      background: rgba(255,255,255,0.05);
    }
    .mark-row .mark-name {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .mark-row button {
      padding: 2px 6px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .mark-row button:hover { outline: 1px solid var(--accent, #4db6ff); }
    .mark-row .btn-lock.locked { opacity: 1; background: rgba(255,165,0,0.3); }
    .mark-row .btn-vis.hidden { opacity: 0.35; }

    /* ===== Toast notification ===== */
    #enable-toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.8); color: #fff; padding: 8px 20px;
      border-radius: 6px; font: 14px/1.4 sans-serif; z-index: 99999;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    #enable-toast.show { opacity: 1; }

    /* ===== Constraint tool cursor ===== */
    body.constraint-pick-mode #potree_render_area { cursor: crosshair !important; }
    body.constraint-pick-mode #potree_render_area canvas { cursor: crosshair !important; }

    /* ===== Constraint tool buttons ===== */
    #enable-constraint-buttons { margin: 6px 0; display: flex; gap: 6px; }
    #enable-constraint-buttons button {
      flex: 1; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-constraint-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }
    #enable-constraint-buttons button.active {
      background: var(--accent, #4db6ff) !important;
      color: #000 !important; border-color: var(--accent, #4db6ff) !important;
    }

    /* ===== Constraint list ===== */
    #enable-constraint-list { margin: 4px 0; }
    .constraint-row {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 6px; border-radius: 3px; margin: 2px 0;
      font: 12px/1.3 sans-serif; color: var(--sidebar-text, #fbfbfb);
      background: rgba(255,255,255,0.05);
    }
    .constraint-row.active { background: rgba(57,255,20,0.15); }
    .constraint-row .constraint-name {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .constraint-row button {
      padding: 2px 6px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .constraint-row button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Constraint status ===== */
    #enable-constraint-status {
      font: 12px/1.3 sans-serif; color: #39ff14;
      margin: 4px 0; min-height: 16px;
    }

    /* ===== Constraint drag cursor ===== */
    body.constraint-drag #potree_render_area { cursor: grabbing !important; }
    body.constraint-drag #potree_render_area canvas { cursor: grabbing !important; }

    /* ===== Constraint visibility toggle ===== */
    .constraint-row .btn-vis {
      padding: 2px 5px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .constraint-row .btn-vis:hover { outline: 1px solid var(--accent, #4db6ff); }
    .constraint-row .btn-vis.hidden { opacity: 0.35; }
    .constraint-row .btn-lock {
      padding: 2px 5px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .constraint-row .btn-lock:hover { outline: 1px solid var(--accent, #4db6ff); }
    .constraint-row .btn-lock.locked { opacity: 1; background: rgba(255,165,0,0.3); }
    .constraint-row .btn-ortho {
      padding: 2px 5px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .constraint-row .btn-ortho:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Plane ortho depth slab controls ===== */
    #enable-plane-depth-controls {
      margin: 4px 0; padding: 6px 8px; border-radius: 4px;
      background: rgba(57,255,20,0.08); border: 1px solid rgba(57,255,20,0.2);
      font: 12px/1.4 sans-serif; color: var(--sidebar-text, #fbfbfb);
    }
    #enable-plane-depth-controls .depth-title {
      font-weight: 600; font-size: 11px; color: #39ff14; margin-bottom: 4px;
    }
    #enable-plane-depth-controls .depth-row {
      display: flex; align-items: center; gap: 6px; margin: 3px 0;
    }
    #enable-plane-depth-controls .depth-row label {
      min-width: 50px; font-size: 11px; color: var(--muted, #9aa3b2);
    }
    #enable-plane-depth-controls .depth-row input[type="number"] {
      width: 70px; padding: 2px 4px; border: 1px solid var(--border, #555);
      border-radius: 3px; background: #333; color: #fff; font: 12px/1.3 sans-serif;
    }
    #enable-plane-depth-controls .depth-row span.unit { font-size: 11px; color: var(--muted, #9aa3b2); }
    #enable-plane-depth-controls button {
      margin-top: 4px; padding: 3px 10px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    #enable-plane-depth-controls button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Member tool cursor ===== */
    body.member-pick-mode #potree_render_area { cursor: crosshair !important; }
    body.member-pick-mode #potree_render_area canvas { cursor: crosshair !important; }

    /* ===== Member buttons ===== */
    #enable-member-buttons { margin: 6px 0; display: flex; gap: 6px; }
    #enable-member-buttons button {
      flex: 1; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-member-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }
    #enable-member-buttons button.active {
      background: var(--accent, #4db6ff) !important;
      color: #000 !important; border-color: var(--accent, #4db6ff) !important;
    }

    /* ===== Member list ===== */
    #enable-member-list { margin: 4px 0; }
    .member-row {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 6px; border-radius: 3px; margin: 2px 0;
      font: 12px/1.3 sans-serif; color: var(--sidebar-text, #fbfbfb);
      background: rgba(255,255,255,0.05);
    }
    .member-row .member-name {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      cursor: pointer;
    }
    .member-row .member-name:hover { text-decoration: underline; }
    .member-row button {
      padding: 2px 6px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .member-row button:hover { outline: 1px solid var(--accent, #4db6ff); }
    .member-row .btn-vis.hidden { opacity: 0.35; }

    /* ===== Member drag cursor ===== */
    body.member-drag #potree_render_area { cursor: grabbing !important; }
    body.member-drag #potree_render_area canvas { cursor: grabbing !important; }

    /* ===== DXF export button ===== */
    #enable-member-buttons-export { margin: 4px 0; }
    #enable-member-buttons-export button {
      width: 100%; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-member-buttons-export button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Sidebar license footer (inline, bottom of sidebar) ===== */
    #enable-license-footer {
      padding: 10px 12px 20px;
      border-top: 1px solid rgba(255,255,255,0.08);
      font: 10px/1.5 sans-serif;
      color: rgba(251,251,251,0.3);
    }
    #enable-license-footer a {
      color: rgba(251,251,251,0.4);
      text-decoration: none;
    }
    #enable-license-footer a:hover {
      color: rgba(251,251,251,0.65);
      text-decoration: underline;
    }

    /* ===== Session save/load buttons ===== */
    #enable-session-buttons { margin: 6px 0; display: flex; gap: 6px; }
    #enable-session-buttons button {
      flex: 1; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-session-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Elevation map buttons ===== */
    #enable-elevation-buttons { margin: 6px 0; display: flex; gap: 6px; flex-wrap: wrap; }
    #enable-elevation-buttons button {
      flex: 1; min-width: 80px; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-elevation-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }
    #enable-elevation-buttons button.clip-btn.active {
      background: #555; outline: 2px solid var(--accent, #3EAD4A);
      pointer-events: none; opacity: 0.7;
    }
    #enable-elevation-range { margin: 4px 0; display: flex; gap: 6px; align-items: center; font: 12px/1.3 sans-serif; color: var(--sidebar-text, #fbfbfb); }
    #enable-elevation-range input[type="number"] {
      width: 60px; padding: 3px 5px; border: 1px solid var(--border, #333);
      border-radius: 3px; background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      font: 12px sans-serif;
    }
    #enable-elevation-range button {
      padding: 3px 8px; border: 1px solid var(--border, #333);
      border-radius: 3px; font: 12px sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    #enable-elevation-status { font: 11px/1.3 sans-serif; color: rgba(251,251,251,0.5); margin: 2px 0; min-height: 14px; }
    /* Compute progress overlay — visible during heavy computation */
    #enable-compute-overlay {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(20, 20, 20, 0.92); color: #fff;
      border: 1px solid var(--accent, #3EAD4A); border-radius: 6px;
      padding: 16px 28px; min-width: 280px;
      font: 13px/1.4 sans-serif; z-index: 100000;
      box-shadow: 0 6px 24px rgba(0,0,0,0.5);
      display: none;
    }
    #enable-compute-overlay.show { display: block; }
    #enable-compute-overlay .compute-title { font-weight: 700; margin-bottom: 8px; color: var(--accent, #3EAD4A); }
    #enable-compute-overlay .compute-status { font-size: 12px; color: #ddd; margin-bottom: 10px; }
    #enable-compute-overlay .compute-bar {
      width: 100%; height: 6px; background: rgba(255,255,255,0.1);
      border-radius: 3px; overflow: hidden; position: relative;
    }
    /* transform-only animation runs on the compositor thread, so it keeps
       moving even when the main thread is busy with heavy compute. */
    #enable-compute-overlay .compute-bar-fill {
      position: absolute; top: 0; left: 0; height: 100%;
      width: 30%; background: var(--accent, #3EAD4A);
      border-radius: 3px;
      transform: translateX(-100%);
      animation: compute-bar-slide 1.4s ease-in-out infinite;
      will-change: transform;
    }
    @keyframes compute-bar-slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(450%); }
    }
    #enable-contour-interval { margin: 4px 0; display: flex; gap: 6px; align-items: center; font: 12px/1.3 sans-serif; color: var(--sidebar-text, #fbfbfb); }
    #enable-contour-interval input[type="number"] {
      width: 65px; padding: 3px 5px; border: 1px solid var(--border, #333);
      border-radius: 3px; background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      font: 12px sans-serif;
    }
    #enable-contour-interval button {
      padding: 3px 8px; border: 1px solid var(--border, #333);
      border-radius: 3px; font: 12px sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    #heatmap-legend {
      display: none; position: fixed; top: 10px; right: 20px; z-index: 200;
      pointer-events: none;
    }

    /* ===== Measurement panel overrides ===== */
    /* Hide native raw XYZ + native distance table in measurement panel */
    .measurement_content .coordinates_table_container,
    .measurement_content .coordinates_table_container + br,
    .measurement_content #distances_table { display: none !important; }

    /* ===== Persistent measurement list ===== */
    #enable-measurement-list,
    #enable-area-list,
    #enable-angle-list,
    #enable-volume-list { margin: 4px 0; }
    .enable-list-section-label {
      font: bold 11px/1.3 sans-serif;
      color: var(--muted, #9aa3b2);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin: 8px 0 2px 0;
    }
    .enable-meas-points {
      display: flex; flex-wrap: wrap; gap: 3px;
      margin: 3px 0; font: 11px/1.3 sans-serif;
    }
    .enable-meas-points .point-chip {
      display: inline-flex; align-items: center; gap: 1px;
      padding: 1px 3px 1px 5px; border-radius: 3px;
      background: rgba(255,255,255,0.06);
      color: var(--sidebar-text, #fbfbfb);
    }
    .enable-meas-points .point-chip button {
      background: none; border: none; color: #f88;
      font: 13px/1 sans-serif; cursor: pointer; padding: 0 3px;
    }
    .enable-meas-points .point-chip button:hover {
      color: #fff; background: rgba(255,68,68,0.35); border-radius: 2px;
    }
    .enable-meas-item {
      padding: 4px 6px; border-radius: 3px; margin: 3px 0;
      font: 12px/1.3 sans-serif; color: var(--sidebar-text, #fbfbfb);
      background: rgba(255,255,255,0.05);
    }
    .enable-meas-item .meas-header {
      display: flex; align-items: center; gap: 4px; margin-bottom: 2px;
    }
    .enable-meas-item .meas-title { flex: 1; font-weight: 600; font-size: 11px; color: var(--muted,#9aa3b2); }
    .enable-meas-item .meas-delete {
      padding: 1px 5px; border: 1px solid var(--border, #555);
      border-radius: 3px; font: 11px/1.2 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
    }
    .enable-meas-item .meas-delete:hover { outline: 1px solid var(--accent, #4db6ff); }
    .enable-meas-seg {
      display: flex; gap: 6px; padding: 1px 0; font-variant-numeric: tabular-nums;
    }
    .enable-meas-seg .seg-name { white-space: nowrap; font-weight: 500; min-width: 56px; }
    .enable-meas-seg .seg-vals { color: rgba(251,251,251,0.7); }
    .enable-meas-seg.seg-total { border-top: 1px solid rgba(255,255,255,0.15); padding-top: 3px; margin-top: 2px; font-weight: 700; }

    /* Export all measurements button */
    #enable-measurement-buttons-export { margin: 4px 0; }
    #enable-measurement-buttons-export button {
      width: 100%; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-measurement-buttons-export button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Collapsible sidebar groups ===== */
    .enable-group {
      margin: 0; border-top: 1px solid rgba(255,255,255,0.08);
    }
    .enable-group:first-child { border-top: none; }
    .enable-group-header {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 10px; cursor: pointer; user-select: none;
      font: bold 13px/1.3 sans-serif; color: var(--sidebar-text, #fbfbfb);
      background: rgba(255,255,255,0.03);
      transition: background 0.15s;
    }
    .enable-group-header:hover { background: rgba(255,255,255,0.07); }
    .enable-group-header::before {
      content: '\25B6'; /* right-pointing triangle */
      display: inline-block; font-size: 9px; transition: transform 0.2s;
      width: 12px; text-align: center; flex-shrink: 0;
    }
    .enable-group.expanded > .enable-group-header::before {
      transform: rotate(90deg);
    }
    .enable-group-body {
      overflow: hidden; max-height: 0;
      transition: max-height 0.3s ease-out;
      padding: 0 10px;
    }
    .enable-group.expanded > .enable-group-body {
      max-height: 2000px; /* large enough for any content */
      overflow-x: hidden;
      overflow-y: visible;
      padding: 4px 10px 8px;
      transition: max-height 0.4s ease-in;
    }

    /* Potree elements inside groups: prevent overflow */
    .enable-group-body li { list-style: none; }

    /* ===== Global crop / cutout buttons (reuse elevation button style) ===== */
    #enable-global-crop-buttons { margin: 6px 0; display: flex; gap: 6px; flex-wrap: wrap; }
    #enable-global-crop-buttons button {
      flex: 1; min-width: 80px; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-global-crop-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Exclusion box buttons ===== */
    #enable-exclusion-buttons { margin: 6px 0; display: flex; gap: 6px; flex-wrap: wrap; }
    #enable-exclusion-buttons button {
      flex: 1; min-width: 80px; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-exclusion-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Elevation compute buttons ===== */
    #enable-elevation-compute { margin: 6px 0; display: flex; gap: 6px; flex-wrap: wrap; }
    #enable-elevation-compute button {
      flex: 1; min-width: 80px; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-elevation-compute button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* ===== Elevation contour buttons ===== */
    #enable-contour-buttons { margin: 6px 0; display: flex; gap: 6px; flex-wrap: wrap; }
    #enable-contour-buttons button {
      flex: 1; min-width: 80px; padding: 5px 8px; border: 1px solid var(--border, #333);
      border-radius: 4px; font: 13px/1.3 sans-serif; cursor: pointer;
      background: var(--panel-bg, #6b6b6b); color: var(--sidebar-text, #fbfbfb);
      transition: outline 0.15s;
    }
    #enable-contour-buttons button:hover { outline: 1px solid var(--accent, #4db6ff); }

    /* Sub-section labels within groups */
    .enable-subsection-label {
      font: 600 11px/1.3 sans-serif; color: var(--muted, #9aa3b2);
      margin: 8px 0 2px; text-transform: uppercase; letter-spacing: 0.5px;
    }
  </style>
</head>

<body>
  <!-- ===================== CONTAINER ===================== -->
  <div class="potree_container">
    <div id="potree_render_area"></div>
    <div id="potree_sidebar_container"></div>
  </div>

  <!-- Toast element -->
  <div id="enable-toast"></div>

  <!-- Compute progress overlay (shown while elevation map is computing) -->
  <div id="enable-compute-overlay">
    <div class="compute-title">Computing Elevation Map</div>
    <div class="compute-status" id="enable-compute-status-text">Initializing...</div>
    <div class="compute-bar"><div class="compute-bar-fill"></div></div>
  </div>

  <!-- Elevation legend -->
  <div id="heatmap-legend"><canvas id="heatmap-legend-canvas" width="180" height="520"></canvas></div>

  <!-- ===================== VENDOR + POTREE JS (order matters) ===================== -->
  <script src="../libs/jquery/jquery-3.1.1.min.js"></script>
  <script src="../libs/spectrum/spectrum.js"></script>
  <script src="../libs/jquery-ui/jquery-ui.min.js"></script>
  <script src="../libs/other/BinaryHeap.js"></script>
  <script src="../libs/tween/tween.min.js"></script>
  <script src="../libs/d3/d3.js"></script>
  <script src="../libs/proj4/proj4.js"></script>
  <script src="../libs/i18next/i18next.js"></script>
  <script src="../libs/jstree/jstree.js"></script>

  <script src="../libs/three/build/three.min.js"></script>
  <script src="../libs/potree/potree.js"></script>
  <script src="../libs/plasio/js/laslaz.js"></script>

  <!-- Per-client project registry -->
  <script src="projects.js"></script>

  <!-- ===================== APP ===================== -->
  <script>
  (function () {
    // ----- read ?p=<PointCloudID> and lookup in projects.js -----
    const params = new URLSearchParams(location.search);
    const pointCloudID = params.get('p');
    if (!pointCloudID) { alert('Missing ?p=<PointCloudID> in URL'); return; }
    const meta = (window.PROJECTS || {})[pointCloudID];
    if (!meta || !meta.folder) { alert('PointCloudID "' + pointCloudID + '" not found in projects.js'); return; }
    const cloudURL = meta.folder.replace(/\/+$/, '') + '/cloud.js';

    // ----- init Potree viewer -----
    const renderArea = document.getElementById('potree_render_area');
    const viewer = new Potree.Viewer(renderArea, { useDefaultRenderLoop: true, showBoundingBox: false });

    // sensible defaults
    viewer.setEDLEnabled(true);
    viewer.setFOV(60);
    viewer.setPointBudget(2_000_000);
    viewer.setDescription(meta.name || pointCloudID);
    viewer.loadSettingsFromURL(); // allow ? overrides

    // -- Fix: Right-click always pans, even during measurement tool use --
    // During measurement insertion Potree's drag system is permanently
    // occupied by a measurement sphere, so right-click can never start a
    // navigation drag through InputHandler. We intercept ALL right-click
    // mouse events on the canvas, prevent Potree from seeing them, and
    // handle panning by directly updating OrbitControls.panDelta.
    (function() {
      var rightDragPrev = null;
      var domEl = viewer.renderer.domElement;

      domEl.addEventListener('mousedown', function(e) {
        if (e.button === 2) {
          e.stopImmediatePropagation();
          rightDragPrev = { x: e.clientX, y: e.clientY };
        }
      }, true);

      domEl.addEventListener('mousemove', function(e) {
        if (!rightDragPrev || !(e.buttons & 2)) {
          if (rightDragPrev) rightDragPrev = null;
          return;
        }
        e.stopImmediatePropagation();
        var dx = e.clientX - rightDragPrev.x;
        var dy = e.clientY - rightDragPrev.y;
        rightDragPrev = { x: e.clientX, y: e.clientY };
        var controls = viewer.getControls();
        if (controls && controls.panDelta) {
          controls.panDelta.x += dx / domEl.clientWidth;
          controls.panDelta.y += dy / domEl.clientHeight;
          if (controls.stopTweens) controls.stopTweens();
        }
      }, true);

      domEl.addEventListener('mouseup', function(e) {
        if (e.button === 2) {
          e.stopImmediatePropagation();
          rightDragPrev = null;
        }
      }, true);
    })();

    // -- Click-without-drag on an elevation box = toggle selection (gizmo) --
    // The box's fill mesh has raycast disabled so click-and-drag inside the
    // box can pan/rotate the camera. To preserve the "click box → handles
    // appear" interaction, we manually OBB-test on mousedown and, if the
    // mouseup happens within ~5px without movement, treat it as a click and
    // call inputHandler.toggleSelection on the volume.
    (function() {
      var domEl = viewer.renderer.domElement;
      var pendingClick = null; // { vol, x, y }
      var unitBox = new THREE.Box3(new THREE.Vector3(-0.5, -0.5, -0.5),
                                   new THREE.Vector3( 0.5,  0.5,  0.5));

      domEl.addEventListener('mousedown', function(e) {
        if (e.button !== 0) return;
        if (typeof elevationCropVolumes === 'undefined' || elevationCropVolumes.length === 0) return;
        // Skip if the user is in any pick mode that consumes left clicks
        if (typeof MARK_MODE !== 'undefined' && MARK_MODE) return;
        if (typeof constraintPickMode !== 'undefined' && constraintPickMode) return;
        if (typeof memberPickMode !== 'undefined' && memberPickMode) return;
        if (typeof zBasePickMode !== 'undefined' && zBasePickMode) return;

        var rect = domEl.getBoundingClientRect();
        var ndc = {
          x: ((e.clientX - rect.left) / rect.width) * 2 - 1,
          y: -((e.clientY - rect.top) / rect.height) * 2 + 1
        };
        var camera = viewer.scene.getActiveCamera();
        var raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(ndc, camera);

        for (var i = 0; i < elevationCropVolumes.length; i++) {
          var vol = elevationCropVolumes[i];
          if (vol._disabled) continue;
          vol.updateMatrixWorld(true);
          var inv = new THREE.Matrix4().copy(vol.matrixWorld).invert();
          var localRay = raycaster.ray.clone().applyMatrix4(inv);
          var hit = new THREE.Vector3();
          if (localRay.intersectBox(unitBox, hit)) {
            pendingClick = { vol: vol, x: e.clientX, y: e.clientY };
            return;
          }
        }
      }, true);

      domEl.addEventListener('mouseup', function(e) {
        if (e.button !== 0) return;
        if (!pendingClick) return;
        var dx = e.clientX - pendingClick.x;
        var dy = e.clientY - pendingClick.y;
        var moved = Math.sqrt(dx * dx + dy * dy);
        var vol = pendingClick.vol;
        pendingClick = null;
        if (moved > 5) return; // it was a drag — camera already orbited
        var ih = viewer.inputHandler;
        // Volume insertion (placing a new box) and gizmo-handle grabs both run
        // through inputHandler.startDragging, which sets ih.drag.object. Don't
        // intervene in those cases — Potree's bubble-phase onMouseUp must run
        // to fire the 'drop' event that commits placement / ends drag.
        if (ih && ih.drag && ih.drag.object) return;
        // If Potree already has the volume in hoveredElements (i.e. the click
        // landed on the wireframe edge), let Potree's own onMouseUp run — it
        // does the right thing for selection. We only take over for clicks
        // INSIDE the box where Potree can't see the volume (fill raycast off)
        // and would otherwise call deselectAll(), undoing our selection.
        var hoveredHasVol = ih && ih.hoveredElements && ih.hoveredElements.some(function(h) {
          var o = h && h.object;
          while (o) { if (o === vol) return true; o = o.parent; }
          return false;
        });
        if (hoveredHasVol) return;
        try {
          var alreadySelected = ih.selection && ih.selection.indexOf(vol) >= 0;
          ih.deselectAll();
          if (!alreadySelected) ih.toggleSelection(vol);
        } catch (err) { /* ignore */ }
        // Block Potree's bubble-phase onMouseUp; otherwise it sees no
        // selectable in hoveredElements and runs deselectAll(), wiping us out.
        e.stopImmediatePropagation();
      }, true);
    })();

    // ----- load GUI and force "always open" sidebar -----
    viewer.loadGUI(() => {
      viewer.setLanguage('en');

      const $menu = $("#potree_menu");

      // Kill any accordion instance & remove its traces
      try { $menu.accordion("destroy"); } catch(e) {}
      $menu.removeClass("ui-accordion ui-widget ui-helper-reset")
           .removeData("uiAccordion").removeData("ui-accordion");

      // Unbind header toggles and make them inert
      $menu.find("h3, .accordion-header, .ui-accordion-header")
           .off("click").css("cursor","default");

      // Force all section bodies visible
      $menu.children("div")
           .show().attr("aria-hidden","false")
           .css({display:"block", height:"auto", overflow:"visible"});

      // Legacy 'ui-accordion-content' blocks open
      $menu.find(".ui-accordion-content")
           .css({display:"block", height:"auto", overflow:"visible"})
           .attr("aria-hidden","false");

      // Remove map bits
      $(".potree_toggle_map, #potree_toggle_map, .mapToggle").remove();
      $("#menu_map, #map, #potree_map_container").remove();

      // Kill accordion if something tries to reattach it later
      const mo = new MutationObserver(() => {
        if ($menu.data("uiAccordion") || $menu.hasClass("ui-accordion")) {
          try { $menu.accordion("destroy"); } catch(e) {}
          $menu.removeClass("ui-accordion").removeData("uiAccordion").removeData("ui-accordion");
        }
      });
      mo.observe($menu[0], {attributes:true, childList:true, subtree:true});

      // Optional: silence benign sidebar DOM warnings
      const sb = viewer.sidebar;
      if (sb) {
        ["initReturnFilters","initFilters","onReturnNumberChanged"].forEach(fn => {
          if (typeof sb[fn] === "function") {
            const orig = sb[fn].bind(sb);
            sb[fn] = function(...args){ try { return orig(...args); } catch(e){ /* ignore missing DOM */ } };
          }
        });
      }

      // --- Force Background = None (use CSS page color) ---
      try {
        // make the WebGL canvas transparent so CSS background shows
        if (viewer.renderer?.setClearAlpha) viewer.renderer.setClearAlpha(0);
      } catch (_) {}

      try {
        // tell Potree to use "None" (matches the GUI radio value 'null')
        viewer.setBackground("null");
      } catch (_) {}

      // reflect it visually in the sidebar pills
      try {
        const $bgFieldset = $("#potree_menu fieldset legend").filter(function () {
          return $(this).text().trim().toLowerCase() === "background";
        }).closest("fieldset");

        $bgFieldset.find("input[name=background_options][value=null]")
          .prop("checked", true)
          .button("refresh");
      } catch (_) {}

      // (measurement setup runs outside loadGUI via polling — see below)
    });

    // ===== MARK POINT TOOL =====

    // -- State --
    let MARK_MODE = false;
    const markedPoints = [];  // array of { id, name, locked, visible, visual: THREE.Group }
    let nextMarkId = 1;
    const markerScene = new THREE.Scene();  // separate scene, rendered manually AFTER EDL
    markerScene.name = "EnableMarkerScene";
    let ringOuterRadius = 0.12;   // large ring visible when zoomed out
    let ringMiddleRadius = 0.025; // medium ring
    let ringInnerRadius = 0.006;  // tightest ring, ~point-sized
    const RING_SEGMENTS = 48;

    // -- Shared material (outline-only ring, no fill) --
    const ringMaterial = new THREE.LineBasicMaterial({
      color: 0xff2020,
      depthTest: false,
      depthWrite: false,
      transparent: true,
      opacity: 0.9,
      linewidth: 3
    });

    // -- Build a circle geometry (line loop) at origin in XY plane --
    function createCircleGeometry(radius, segments) {
      const pts = [];
      for (let i = 0; i <= segments; i++) {
        const angle = (i / segments) * Math.PI * 2;
        pts.push(Math.cos(angle) * radius, Math.sin(angle) * radius, 0);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
      return geo;
    }

    // -- Create a radial-gradient glow texture (cached per color hex) --
    var _glowTextureCache = {};
    function createGlowTexture(colorHex) {
      if (_glowTextureCache[colorHex]) return _glowTextureCache[colorHex];
      var size = 128;
      var canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      var ctx = canvas.getContext('2d');
      var c = new THREE.Color(colorHex);
      var r = Math.round(c.r * 255), g = Math.round(c.g * 255), b = Math.round(c.b * 255);
      var grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
      grad.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',0.20)');
      grad.addColorStop(0.4, 'rgba(' + r + ',' + g + ',' + b + ',0.15)');
      grad.addColorStop(0.7, 'rgba(' + r + ',' + g + ',' + b + ',0.35)');
      grad.addColorStop(0.9, 'rgba(' + r + ',' + g + ',' + b + ',0.5)');
      grad.addColorStop(1, 'rgba(' + r + ',' + g + ',' + b + ',0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);
      var tex = new THREE.CanvasTexture(canvas);
      _glowTextureCache[colorHex] = tex;
      return tex;
    }

    // -- Create a glow sprite for a marker --
    function createGlowSprite(colorHex, radius) {
      var tex = createGlowTexture(colorHex);
      var mat = new THREE.SpriteMaterial({
        map: tex,
        blending: THREE.AdditiveBlending,
        depthTest: false,
        depthWrite: false,
        transparent: true,
        opacity: 1.0
      });
      var sprite = new THREE.Sprite(mat);
      sprite.scale.set(radius * 3, radius * 3, 1);
      return sprite;
    }

    // -- Create a text label sprite for a marker point --
    function createMarkLabel(text) {
      var canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 48;
      var ctx = canvas.getContext('2d');
      // Semi-transparent dark background pill
      ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
      ctx.beginPath();
      if (ctx.roundRect) { ctx.roundRect(2, 2, canvas.width - 4, canvas.height - 4, 8); }
      else { ctx.rect(2, 2, canvas.width - 4, canvas.height - 4); }
      ctx.fill();
      // White text
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 28px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      var texture = new THREE.CanvasTexture(canvas);
      texture.minFilter = THREE.LinearFilter;
      var material = new THREE.SpriteMaterial({
        map: texture, depthTest: false, depthWrite: false,
        transparent: true, sizeAttenuation: true
      });
      var sprite = new THREE.Sprite(material);
      // Position offset to the right of the dot
      sprite.scale.set(ringOuterRadius * 2.5, ringOuterRadius * 1.0, 1);
      sprite.position.set(ringOuterRadius * 2.0, ringOuterRadius * 0.5, 0);
      sprite.userData.isMarkLabel = true;
      return sprite;
    }

    // -- Update label sprite on an existing marker --
    function updateMarkLabel(mark) {
      if (!mark.visual) return;
      // Remove old label
      mark.visual.children.forEach(function(child) {
        if (child.userData && child.userData.isMarkLabel) mark.visual.remove(child);
      });
      // Add new label
      var sprite = createMarkLabel(mark.name);
      mark.visual.add(sprite);
    }

    // -- Render markers in the perspective_overlay pass (AFTER EDL + depth clear) --
    // Same hook Potree's own measurement/annotation tools use.
    viewer.addEventListener("render.pass.perspective_overlay", function(e) {
      if (markerScene.children.length === 0) return;

      // Billboard: make every ring face the camera
      const camera = viewer.scene.getActiveCamera();
      for (let i = 0; i < markerScene.children.length; i++) {
        markerScene.children[i].quaternion.copy(camera.quaternion);
      }

      viewer.renderer.render(markerScene, camera);
    });

    // -- Toast notification --
    let toastTimer = null;
    function showToast(msg, duration) {
      duration = duration || 2000;
      const el = document.getElementById('enable-toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), duration);
    }

    // -- Place a marker at a 3D position --
    function placeMarker(position) {
      // Group positioned at the picked point; billboarded each frame
      const group = new THREE.Group();
      group.position.copy(position);

      // Filled dot at center (~actual point size)
      const dotGeo = new THREE.CircleGeometry(ringInnerRadius, RING_SEGMENTS);
      const dotMat = new THREE.MeshBasicMaterial({
        color: ringMaterial.color, depthTest: false, depthWrite: false,
        transparent: true, opacity: ringMaterial.opacity, side: THREE.DoubleSide
      });
      group.add(new THREE.Mesh(dotGeo, dotMat));

      // Additive glow (electron cloud effect)
      group.add(createGlowSprite(0xff2020, ringOuterRadius));

      // Text label (e.g. "P1")
      var labelName = 'P' + nextMarkId;
      var labelSprite = createMarkLabel(labelName);
      group.add(labelSprite);

      var mark = {
        id: nextMarkId++,
        name: labelName,
        locked: true,
        visible: true,
        visual: group
      };
      group.name = "marker-" + mark.id;

      markerScene.add(group);
      markedPoints.push(mark);
      undoStack.push({ type: 'mark', id: mark.id });
      rebuildMarkList();
      showToast(mark.name + " placed (" + markedPoints.length + " total)");
    }

    // -- Delete a single marker by id --
    function deleteMarker(id) {
      for (var i = 0; i < markedPoints.length; i++) {
        if (markedPoints[i].id === id) {
          var m = markedPoints[i];
          m.visual.traverse(function(obj) {
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
              if (obj.material.map) obj.material.map.dispose();
              obj.material.dispose();
            }
          });
          markerScene.remove(m.visual);
          markedPoints.splice(i, 1);
          // Clean up any elevation boxes referencing this mark as Z=0 base.
          // Recompute each affected box so the heat map reflects the missing reference.
          var affected = getElevBoxesReferencingMark(id);
          for (var ai = 0; ai < affected.length; ai++) {
            var c = getBoxConfig(affected[ai]);
            c.zBaseMarkId = null;
            forceRecomputeBox(affected[ai]);
          }
          rebuildMarkList();
          return;
        }
      }
    }

    // -- Clear all markers --
    function clearAllMarkers() {
      while (markedPoints.length > 0) {
        var m = markedPoints.pop();
        m.visual.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) {
            if (obj.material.map) obj.material.map.dispose();
            obj.material.dispose();
          }
        });
        markerScene.remove(m.visual);
      }
      rebuildMarkList();
      showToast("Cleared all markers");
    }

    // -- Rebuild mark list in sidebar --
    function rebuildMarkList() {
      var listEl = document.getElementById('enable-mark-list');
      if (!listEl) return;
      listEl.innerHTML = '';

      for (var i = 0; i < markedPoints.length; i++) {
        (function(m) {
          var row = document.createElement('div');
          row.className = 'mark-row';

          var nameSpan = document.createElement('span');
          nameSpan.className = 'mark-name';
          var refs = getElevBoxesReferencingMark(m.id);
          if (refs.length > 0) {
            var refNames = refs.map(function(v) { return v.name; }).join(', ');
            nameSpan.textContent = m.name + ' \u2014 Z=0 for: ' + refNames;
            nameSpan.title = 'Referenced as Z=0 base by: ' + refNames;
          } else {
            nameSpan.textContent = m.name;
          }
          row.appendChild(nameSpan);

          var visBtn = document.createElement('button');
          visBtn.className = 'btn-vis' + (m.visible === false ? ' hidden' : '');
          visBtn.textContent = '\uD83D\uDC41';
          visBtn.title = 'Toggle visibility';
          visBtn.addEventListener('click', function() {
            m.visible = !m.visible;
            m.visual.visible = m.visible;
            visBtn.classList.toggle('hidden', !m.visible);
          });
          row.appendChild(visBtn);

          var lockBtn = document.createElement('button');
          lockBtn.className = 'btn-lock' + (m.locked ? ' locked' : '');
          lockBtn.textContent = m.locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
          lockBtn.title = m.locked ? 'Unlock to move' : 'Lock position';
          lockBtn.addEventListener('click', function() {
            m.locked = !m.locked;
            lockBtn.textContent = m.locked ? '\uD83D\uDD12' : '\uD83D\uDD13';
            lockBtn.title = m.locked ? 'Unlock to move' : 'Lock position';
            lockBtn.classList.toggle('locked', m.locked);
          });
          row.appendChild(lockBtn);

          var deleteBtn = document.createElement('button');
          deleteBtn.textContent = '\u00d7';
          deleteBtn.title = 'Delete mark';
          deleteBtn.addEventListener('click', function() {
            deleteMarker(m.id);
          });
          row.appendChild(deleteBtn);

          listEl.appendChild(row);
        })(markedPoints[i]);
      }
    }

    // ===== CONSTRAINT MEASUREMENT TOOL =====

    // -- State --
    const constraints = [];
    let nextConstraintId = 1;
    let activeConstraintId = null;
    let constraintPickMode = false;
    let constraintPickPoints = [];
    let constraintPickTarget = 0;
    let constraintPickType = null;
    const constraintScene = new THREE.Scene();
    constraintScene.name = "EnableConstraintScene";
    let constraintDragActive = false;
    let constraintDragInfo = null; // { constraint, pointIndex }
    let constraintPickMarkers = []; // temporary markers shown while picking
    // After a plane is fit, we hold it here while the user picks the 2 X-axis
    // points; only then is the basis populated and the constraint pushed to
    // `constraints[]`. Cancelling the X-axis pick discards the pending plane.
    let _pendingPlaneConstraint = null;
    // Drag state for the 2 X-axis pick markers (refine after placement).
    let _xAxisPickDragActive = false;
    let _xAxisPickDragIndex = -1;
    // Ortho-measure mode: when on AND a plane with a basis is active, every
    // measurement pick after the first is snapped to one of the active plane's
    // basis axes from the previous point. In plane-locked mode (default) only
    // X and Y are candidates; in parallel mode Z (the plane normal) is also a
    // valid axis, letting the user step to a different elevation and continue
    // sketching in a parallel plane.
    let _orthoMeasureMode = false;
    // Parallel mode: when on, plane-projection follows the previous
    // measurement point's elevation (drawing plane = active plane offset by
    // the prior pick's signed distance) instead of the active plane itself.
    let _orthoParallelMode = false;

    // ===== MEMBER SKETCHING TOOL =====
    const members = [];
    let nextMemberId = 1;
    let memberPickMode = false;
    let memberPickPoints = [];
    let memberPickMarkers = [];
    const memberScene = new THREE.Scene();
    memberScene.name = "EnableMemberScene";
    let memberDragActive = false;
    let memberDragInfo = null; // { member, pointIndex }

    // ===== ELEVATION MAP TOOL =====
    const elevationScene = new THREE.Scene();
    elevationScene.name = "EnableElevationScene";
    let elevationPositions = null;   // Float32Array of world positions
    let elevationNodeMap = null;     // array of { geometryNode, startIndex, count }
    let elevationOrigRGBA = null;    // Map<node, Uint8Array> backup
    let elevationActive = false;
    let initialClipBox = null;       // reference to the persistent initial clip box
    let elevationCropVolumes = [];   // array of Potree BoxVolumes for elevation areas
    let _elevBoxCounter = 0;
    let elevationContoursVisible = false;
    let elevationColoredNodes = new Set();
    let elevationCropBounds = null;
    let elevationOrigBudget = null;
    let elevationSurfaceGrid = null;
    let elevationContourStep = 0.05;
    let exclusionBoxes = [];
    let _lastExclusionHash = '';
    let elevationZMin = 0;
    let elevationZMax = 1;
    let elevationPlaneSurfGrid = null;
    let elevationPickingSide = false;

    // Per-box config: each elevation box stores its own mode/reference/side
    let elevationBoxConfigs = new Map(); // Map<BoxVolume, { mode, refConstraintIdx, refPlane, refSide, sideSet, zMin, zMax, contourStep }>
    let _selectedElevBox = null; // currently selected box for sidebar editing

    // Proxy globals: read/write from the selected box's config (or defaults if none selected)
    // These are used by the sidebar UI and compute pipeline for backward compatibility
    function _selCfg() {
      if (_selectedElevBox) return getBoxConfig(_selectedElevBox);
      // If no box selected, use first non-disabled box
      for (var i = 0; i < elevationCropVolumes.length; i++) {
        if (!elevationCropVolumes[i]._disabled) return getBoxConfig(elevationCropVolumes[i]);
      }
      return { mode: 'z', refConstraintIdx: -1, refPlane: null, refSide: 1, sideSet: false, zMin: null, zMax: null, contourStep: 0.05 };
    }
    // Compatibility getters/setters via property descriptors on a proxy object
    var _elevProxy = {};
    Object.defineProperties(_elevProxy, {
      mode: { get: function() { return _selCfg().mode; }, set: function(v) { _selCfg().mode = v; } },
      refPlane: { get: function() { return _selCfg().refPlane; }, set: function(v) { _selCfg().refPlane = v; } },
      refSide: { get: function() { return _selCfg().refSide; }, set: function(v) { _selCfg().refSide = v; } },
      refConstraintIdx: { get: function() { return _selCfg().refConstraintIdx; }, set: function(v) { _selCfg().refConstraintIdx = v; } },
      sideSet: { get: function() { return _selCfg().sideSet; }, set: function(v) { _selCfg().sideSet = v; } }
    });
    // Legacy global aliases that delegate to the proxy
    var elevationMode = 'z';         // Will be synced from _elevProxy in sidebar handlers
    var elevationRefPlane = null;
    var elevationRefSide = 1;

    // Sync globals from selected box (call after changing selection or box config)
    function syncElevGlobals() {
      var cfg = _selCfg();
      elevationMode = cfg.mode;
      elevationRefPlane = cfg.refPlane;
      elevationRefSide = cfg.refSide;
    }

    function getBoxConfig(volume) {
      if (!elevationBoxConfigs.has(volume)) {
        elevationBoxConfigs.set(volume, {
          mode: 'z',
          refConstraintIdx: -1,
          refPlane: null,
          refSide: 1,
          sideSet: false,
          zBaseMarkId: null,      // Z-mode only: id of mark used as Z=0 reference
          // Thickness-mode parameters
          thicknessExpectedMin: 0.10, // m — flag voids/openings below this
          thicknessExpectedMax: 0.60, // m — reject columns/capitals above this
          thicknessGapTol: 0.025,     // m — air-gap break for fixture rejection
          thicknessGrid: null,        // built per-compute, persistent until clear
          zMin: null,   // null = auto-detect
          zMax: null,
          contourStep: 0.05,
          active: false,          // true once this box has been computed
          surfaceGrid: null,      // per-box Z surface grid
          planeSurfGrid: null,    // per-box plane surface grid
          cropBounds: null,       // per-box AABB
          contourGroup: null,     // THREE.Group for this box's contour lines
          contoursVisible: false,
          heatmapHidden: false    // true = hide this box's heat map + contour visibility
        });
      }
      return elevationBoxConfigs.get(volume);
    }

    // Resolve the Z offset to subtract for a given box's elev calc. Returns 0
    // unless the box is in Z mode with a valid zBaseMarkId pointing to a
    // currently-existing mark.
    function getZBaseZ(cfg) {
      if (!cfg || cfg.mode !== 'z' || cfg.zBaseMarkId == null) return 0;
      for (var i = 0; i < markedPoints.length; i++) {
        if (markedPoints[i].id === cfg.zBaseMarkId) {
          return markedPoints[i].visual.position.z;
        }
      }
      return 0;
    }

    // Like findNearestMarker but ignores the locked filter (we want the user
    // to be able to pick ANY existing mark as a Z=0 base, even locked ones).
    function findAnyMarkerNear(mousePixel) {
      var camera = viewer.scene.getActiveCamera();
      var rect = renderArea.getBoundingClientRect();
      var bestDist = 25;
      var bestMark = null;
      for (var i = 0; i < markedPoints.length; i++) {
        var m = markedPoints[i];
        if (!m.visible) continue;
        var pt = m.visual.position.clone().project(camera);
        var screenX = (pt.x * 0.5 + 0.5) * rect.width;
        var screenY = (1 - (pt.y * 0.5 + 0.5)) * rect.height;
        var dx = screenX - mousePixel.x;
        var dy = screenY - mousePixel.y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < bestDist) {
          bestDist = dist;
          bestMark = m;
        }
      }
      return bestMark;
    }

    // Return the elevation box volumes that reference `markId` as their Z=0 base.
    function getElevBoxesReferencingMark(markId) {
      var refs = [];
      if (markId == null) return refs;
      for (var i = 0; i < elevationCropVolumes.length; i++) {
        var v = elevationCropVolumes[i];
        var c = getBoxConfig(v);
        if (c.mode === 'z' && c.zBaseMarkId === markId) refs.push(v);
      }
      return refs;
    }

    // ===== Z-BASE PICK MODE =====
    var zBasePickMode = false;
    var zBasePickTargetVol = null;

    function startZBasePick(vol) {
      // Cancel other pick modes
      if (constraintPickMode) cancelConstraintPick();
      if (memberPickMode) cancelMemberPick();
      if (MARK_MODE) toggleMarkMode(true);
      zBasePickMode = true;
      zBasePickTargetVol = vol;
      document.body.classList.add('mark-mode'); // crosshair cursor
      var hint = markedPoints.length > 0
        ? 'Click an existing mark to use as Z=0, or click any point to place a new one'
        : 'Click any point in the cloud to place a Z=0 reference mark';
      showToast(hint + ' for ' + vol.name, 5000);
    }

    function cancelZBasePick() {
      zBasePickMode = false;
      zBasePickTargetVol = null;
      document.body.classList.remove('mark-mode');
    }

    // Recompute a single box's elevation (forces re-detect of zMin/zMax in the
    // new offset space and re-applies colors / contours).
    function forceRecomputeBox(vol) {
      if (!vol) return;
      var cfg = getBoxConfig(vol);
      // Reset auto-detect range so it picks up the new offset
      cfg.zMin = null;
      cfg.zMax = null;
      if (cfg.active) {
        _selectedElevBox = vol;
        syncElevGlobals();
        onComputeElevation();
      }
      rebuildElevationBoxList();
      rebuildMarkList();
    }

    function assignZBaseMark(vol, markId) {
      var cfg = getBoxConfig(vol);
      cfg.zBaseMarkId = markId;
      forceRecomputeBox(vol);
      var name = '';
      for (var i = 0; i < markedPoints.length; i++) {
        if (markedPoints[i].id === markId) { name = markedPoints[i].name; break; }
      }
      showToast('Z=0 base set to ' + name + ' for ' + vol.name);
    }

    function clearZBaseMark(vol) {
      var cfg = getBoxConfig(vol);
      if (cfg.zBaseMarkId == null) return;
      cfg.zBaseMarkId = null;
      forceRecomputeBox(vol);
      showToast('Z=0 base cleared for ' + vol.name);
    }

    // Get elevation value for a point — checks which box it's in, uses that box's mode
    function getElevationValue(px, py, pz) {
      // Find which elevation box this point belongs to
      for (var i = 0; i < elevationCropVolumes.length; i++) {
        var vol = elevationCropVolumes[i];
        if (vol._disabled) continue;
        vol.updateMatrixWorld(true);
        var inv = new THREE.Matrix4().copy(vol.matrixWorld).invert();
        var local = new THREE.Vector3(px, py, pz).applyMatrix4(inv);
        if (local.x >= -0.5 && local.x <= 0.5 &&
            local.y >= -0.5 && local.y <= 0.5 &&
            local.z >= -0.5 && local.z <= 0.5) {
          var cfg = getBoxConfig(vol);
          if (cfg.mode === 'plane' && cfg.refPlane) {
            var n = cfg.refPlane.normal;
            var c = cfg.refPlane.centroid;
            return (px - c.x) * n.x + (py - c.y) * n.y + (pz - c.z) * n.z;
          }
          return pz;
        }
      }
      return pz;
    }

    // Fast version using pre-computed inverse matrices and config array
    function getElevationValueFast(px, py, pz, elevInvMats, boxConfigs) {
      var v = new THREE.Vector3();
      for (var i = 0; i < elevInvMats.length; i++) {
        v.set(px, py, pz).applyMatrix4(elevInvMats[i]);
        if (v.x >= -0.5 && v.x <= 0.5 &&
            v.y >= -0.5 && v.y <= 0.5 &&
            v.z >= -0.5 && v.z <= 0.5) {
          var cfg = boxConfigs[i];
          if (cfg.mode === 'plane' && cfg.refPlane) {
            var n = cfg.refPlane.normal;
            var c = cfg.refPlane.centroid;
            return (px - c.x) * n.x + (py - c.y) * n.y + (pz - c.z) * n.z;
          }
          return pz;
        }
      }
      return pz;
    }

    // Build inverse matrices + configs array for fast per-point lookup
    function buildElevationLookup() {
      var mats = [], cfgs = [];
      for (var i = 0; i < elevationCropVolumes.length; i++) {
        var vol = elevationCropVolumes[i];
        if (vol._disabled) continue;
        vol.updateMatrixWorld(true);
        mats.push(new THREE.Matrix4().copy(vol.matrixWorld).invert());
        cfgs.push(getBoxConfig(vol));
      }
      return { mats: mats, cfgs: cfgs };
    }

    // Get the "dominant" config for the compute pass
    // (uses first active non-disabled box's plane config for surface grid, or null for Z mode)
    function getDominantPlaneConfig() {
      for (var i = 0; i < elevationCropVolumes.length; i++) {
        if (elevationCropVolumes[i]._disabled) continue;
        var cfg = getBoxConfig(elevationCropVolumes[i]);
        if (cfg.mode === 'plane' && cfg.refPlane) return cfg;
      }
      return null;
    }

    // Check if any box uses plane deviation mode
    function hasPlaneDeviationBox() {
      for (var i = 0; i < elevationCropVolumes.length; i++) {
        if (elevationCropVolumes[i]._disabled) continue;
        var cfg = getBoxConfig(elevationCropVolumes[i]);
        if (cfg.mode === 'plane') return true;
      }
      return false;
    }

    // Build a surface grid in the reference plane's UV space
    // Projects from the chosen side to find the "top" surface
    function buildPlaneSurfaceGrid(positions, cropBounds, gridRes, refPlane, side, precomputedBounds) {
      gridRes = gridRes || 200;
      var N = refPlane.normal;
      var C = refPlane.centroid;

      // Build U, V axes on the plane
      var worldUp = Math.abs(N.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
      var U = new THREE.Vector3().crossVectors(worldUp, N).normalize();
      var V = new THREE.Vector3().crossVectors(N, U).normalize();

      // Project all points into plane UV space, find UV bounds. Caller can
      // pre-compute these in onComputeElevation Pass A and pass them in to
      // skip this whole pass.
      var count = positions.length / 3;
      var uMin, uMax, vMin, vMax;
      if (precomputedBounds) {
        uMin = precomputedBounds.uMin; uMax = precomputedBounds.uMax;
        vMin = precomputedBounds.vMin; vMax = precomputedBounds.vMax;
      } else {
        uMin = Infinity; uMax = -Infinity; vMin = Infinity; vMax = -Infinity;
        for (var i = 0; i < count; i++) {
          var px = positions[i * 3], py = positions[i * 3 + 1], pz = positions[i * 3 + 2];
          if (cropBounds) {
            if (px < cropBounds.min[0] || px > cropBounds.max[0] ||
                py < cropBounds.min[1] || py > cropBounds.max[1] ||
                pz < cropBounds.min[2] || pz > cropBounds.max[2]) continue;
          }
          var dx = px - C.x, dy = py - C.y, dz = pz - C.z;
          var u = dx * U.x + dy * U.y + dz * U.z;
          var v = dx * V.x + dy * V.y + dz * V.z;
          if (u < uMin) uMin = u; if (u > uMax) uMax = u;
          if (v < vMin) vMin = v; if (v > vMax) vMax = v;
        }
      }

      var uRange = uMax - uMin, vRange = vMax - vMin;
      if (uRange < 1e-6 || vRange < 1e-6) return null;
      var cellU = uRange / gridRes, cellV = vRange / gridRes;

      // For each UV cell, find the extremal signed distance (max if side=+1, min if side=-1)
      // This is the "top surface" as seen from the chosen side
      var gridSurf = new Float32Array(gridRes * gridRes);
      for (var i = 0; i < gridSurf.length; i++) gridSurf[i] = side > 0 ? -Infinity : Infinity;

      for (var i = 0; i < count; i++) {
        var px = positions[i * 3], py = positions[i * 3 + 1], pz = positions[i * 3 + 2];
        if (cropBounds) {
          if (px < cropBounds.min[0] || px > cropBounds.max[0] ||
              py < cropBounds.min[1] || py > cropBounds.max[1] ||
              pz < cropBounds.min[2] || pz > cropBounds.max[2]) continue;
        }
        var dx = px - C.x, dy = py - C.y, dz = pz - C.z;
        var u = dx * U.x + dy * U.y + dz * U.z;
        var v = dx * V.x + dy * V.y + dz * V.z;
        var nDist = dx * N.x + dy * N.y + dz * N.z; // signed distance from plane

        var iu = Math.floor((u - uMin) / cellU);
        var iv = Math.floor((v - vMin) / cellV);
        if (iu >= gridRes) iu = gridRes - 1;
        if (iv >= gridRes) iv = gridRes - 1;
        if (iu < 0) iu = 0; if (iv < 0) iv = 0;
        var idx = iv * gridRes + iu;
        if (side > 0) {
          if (nDist > gridSurf[idx]) gridSurf[idx] = nDist;
        } else {
          if (nDist < gridSurf[idx]) gridSurf[idx] = nDist;
        }
      }

      return {
        gridSurf: gridSurf, gridRes: gridRes,
        uMin: uMin, vMin: vMin, cellU: cellU, cellV: cellV,
        U: U, V: V, N: N, C: C, side: side
      };
    }

    // Check if a point is on the "top surface" from the chosen side of the plane
    function isPlaneTopSurface(px, py, pz, planeSurfGrid, tolerance) {
      if (!planeSurfGrid) return true;
      var dx = px - planeSurfGrid.C.x, dy = py - planeSurfGrid.C.y, dz = pz - planeSurfGrid.C.z;
      var u = dx * planeSurfGrid.U.x + dy * planeSurfGrid.U.y + dz * planeSurfGrid.U.z;
      var v = dx * planeSurfGrid.V.x + dy * planeSurfGrid.V.y + dz * planeSurfGrid.V.z;
      var nDist = dx * planeSurfGrid.N.x + dy * planeSurfGrid.N.y + dz * planeSurfGrid.N.z;

      var iu = Math.floor((u - planeSurfGrid.uMin) / planeSurfGrid.cellU);
      var iv = Math.floor((v - planeSurfGrid.vMin) / planeSurfGrid.cellV);
      if (iu < 0 || iv < 0 || iu >= planeSurfGrid.gridRes || iv >= planeSurfGrid.gridRes) return false;
      var surfDist = planeSurfGrid.gridSurf[iv * planeSurfGrid.gridRes + iu];
      if (surfDist === -Infinity || surfDist === Infinity) return false;

      if (planeSurfGrid.side > 0) {
        return nDist >= surfDist - tolerance;
      } else {
        return nDist <= surfDist + tolerance;
      }
    }

    // ===== THICKNESS GRID (slab thickness heatmap) =====
    // Build a 2D grid of slab thickness over a box. Memory-conscious: typed
    // arrays throughout, all temp buffers freed before return; persistent
    // output is ~520 KB at gridRes=200 (5 Float32/Uint8 grids).
    //
    // Algorithm passes (per docs):
    //   A: Top-surface band detection per cell (densest contiguous bins
    //      starting from highest depth bin)
    //   B: Downward region-grow to find slab bottom, stopping at first gap
    //      larger than gapTolerance — ignores air-gapped fixtures
    //   C: Sanity filter — reject cells outside [expectedMin, expectedMax]
    //   D: 3×3 median filter — kill isolated outliers
    //   E: Connected-component footprint — reject "fat" components below
    //      minComponentArea (handles flush-mounted small fixtures)
    function buildThicknessGrid(positions, count, boxInv, refPlane, refSide, opts) {
      opts = opts || {};
      var gridRes        = opts.gridRes        || 100;
      var binSize        = opts.binSize        || 0.005;
      var gapTol         = opts.gapTolerance   || 0.025;
      var expectedMin    = opts.expectedMin    || 0.05;
      var expectedMax    = opts.expectedMax    || 1.0;
      var minCellPoints  = opts.minCellPoints  || 3;
      var minComponentM2 = opts.minComponentArea || 0.1;

      // Build U, V, N basis. With a refPlane the slab is measured along that
      // plane's normal; without one we fall back to world Z (good for level
      // slabs in surveyed clouds).
      var U, V, N, C;
      if (refPlane) {
        N = refPlane.normal.clone();
        if (refSide && refSide < 0) N.negate();
        var worldUp = Math.abs(N.y) < 0.9 ? new THREE.Vector3(0, 1, 0)
                                          : new THREE.Vector3(1, 0, 0);
        U = new THREE.Vector3().crossVectors(worldUp, N).normalize();
        V = new THREE.Vector3().crossVectors(N, U).normalize();
        C = refPlane.centroid.clone();
      } else {
        U = new THREE.Vector3(1, 0, 0);
        V = new THREE.Vector3(0, 1, 0);
        N = new THREE.Vector3(0, 0, 1);
        C = new THREE.Vector3(0, 0, 0);
      }

      var v3 = new THREE.Vector3();

      // Pass 1 — scan in-box points; find UV / depth ranges. Caller can
      // pre-compute these in onComputeElevation Pass A and pass them via
      // opts.precomputedBounds to skip this entire pass.
      var uMin, uMax, vMin, vMax, dMin, dMax, inBoxTotal;
      if (opts.precomputedBounds) {
        uMin = opts.precomputedBounds.uMin; uMax = opts.precomputedBounds.uMax;
        vMin = opts.precomputedBounds.vMin; vMax = opts.precomputedBounds.vMax;
        dMin = opts.precomputedBounds.dMin; dMax = opts.precomputedBounds.dMax;
        inBoxTotal = opts.precomputedBounds.inBoxTotal != null ? opts.precomputedBounds.inBoxTotal : 1;
      } else {
        uMin = Infinity; uMax = -Infinity;
        vMin = Infinity; vMax = -Infinity;
        dMin = Infinity; dMax = -Infinity;
        inBoxTotal = 0;
        for (var i = 0; i < count; i++) {
          var px = positions[i * 3], py = positions[i * 3 + 1], pz = positions[i * 3 + 2];
          v3.set(px, py, pz).applyMatrix4(boxInv);
          if (v3.x < -0.5 || v3.x > 0.5 || v3.y < -0.5 || v3.y > 0.5 || v3.z < -0.5 || v3.z > 0.5) continue;
          var dx = px - C.x, dy = py - C.y, dz = pz - C.z;
          var u = dx * U.x + dy * U.y + dz * U.z;
          var vv = dx * V.x + dy * V.y + dz * V.z;
          var d = dx * N.x + dy * N.y + dz * N.z;
          if (u < uMin) uMin = u; if (u > uMax) uMax = u;
          if (vv < vMin) vMin = vv; if (vv > vMax) vMax = vv;
          if (d < dMin) dMin = d; if (d > dMax) dMax = d;
          inBoxTotal++;
        }
      }
      if (inBoxTotal === 0 || uMax - uMin < 1e-6 || vMax - vMin < 1e-6) return null;

      var uRange = uMax - uMin, vRange = vMax - vMin;
      var cellU = uRange / gridRes, cellV = vRange / gridRes;

      // Pass 2 — count per cell
      var cellCount = new Uint32Array(gridRes * gridRes);
      for (var i = 0; i < count; i++) {
        var px = positions[i * 3], py = positions[i * 3 + 1], pz = positions[i * 3 + 2];
        v3.set(px, py, pz).applyMatrix4(boxInv);
        if (v3.x < -0.5 || v3.x > 0.5 || v3.y < -0.5 || v3.y > 0.5 || v3.z < -0.5 || v3.z > 0.5) continue;
        var dx = px - C.x, dy = py - C.y, dz = pz - C.z;
        var u = dx * U.x + dy * U.y + dz * U.z;
        var vv = dx * V.x + dy * V.y + dz * V.z;
        var iu = Math.floor((u - uMin) / cellU);
        var iv = Math.floor((vv - vMin) / cellV);
        if (iu >= gridRes) iu = gridRes - 1; if (iu < 0) iu = 0;
        if (iv >= gridRes) iv = gridRes - 1; if (iv < 0) iv = 0;
        cellCount[iv * gridRes + iu]++;
      }

      // Prefix-sum offsets
      var nCells = gridRes * gridRes;
      var cellOffset = new Uint32Array(nCells + 1);
      var s = 0;
      for (var i = 0; i < nCells; i++) { cellOffset[i] = s; s += cellCount[i]; }
      cellOffset[nCells] = s;

      // Pass 3 — fill per-cell depth slices into one packed Float32Array
      var depths = new Float32Array(s);
      var cursor = new Uint32Array(nCells);
      for (var i = 0; i < count; i++) {
        var px = positions[i * 3], py = positions[i * 3 + 1], pz = positions[i * 3 + 2];
        v3.set(px, py, pz).applyMatrix4(boxInv);
        if (v3.x < -0.5 || v3.x > 0.5 || v3.y < -0.5 || v3.y > 0.5 || v3.z < -0.5 || v3.z > 0.5) continue;
        var dx = px - C.x, dy = py - C.y, dz = pz - C.z;
        var u = dx * U.x + dy * U.y + dz * U.z;
        var vv = dx * V.x + dy * V.y + dz * V.z;
        var d = dx * N.x + dy * N.y + dz * N.z;
        var iu = Math.floor((u - uMin) / cellU);
        var iv = Math.floor((vv - vMin) / cellV);
        if (iu >= gridRes) iu = gridRes - 1; if (iu < 0) iu = 0;
        if (iv >= gridRes) iv = gridRes - 1; if (iv < 0) iv = 0;
        var idx = iv * gridRes + iu;
        depths[cellOffset[idx] + cursor[idx]] = d;
        cursor[idx]++;
      }
      // Phase 1 — simple per-cell top/bottom from min/max with constraint.
      // The top surface is "the topmost point in the cell". The bottom is
      // "the deepest point in [topD - expectedMax, topD - expectedMin]".
      // This mirrors how Z mode's surfaceGrid works.
      var topAll      = new Float32Array(nCells);
      var hasTop      = new Uint8Array(nCells);
      var bottomAll   = new Float32Array(nCells);
      var hasBottom   = new Uint8Array(nCells);

      // Also compute a GLOBAL bottom — the deepest depth across the whole
      // box that's at least expectedMin below dMax and within expectedMax.
      // We use this as a fallback for hasTop cells that have no local
      // bottom-scan data, so a single underside-scan-coverage gap doesn't
      // wipe out the entire heat map.
      var globalBottomD = Infinity;
      var globalLowerB = dMax - expectedMax;
      var globalUpperB = dMax - expectedMin;

      for (var ci = 0; ci < nCells; ci++) {
        var cnt = cellCount[ci];
        if (cnt < minCellPoints) continue;

        var off = cellOffset[ci];
        // Pass A: topD = max depth in cell
        var localMax = -Infinity;
        for (var k = 0; k < cnt; k++) {
          var d = depths[off + k];
          if (d > localMax) localMax = d;
        }
        topAll[ci] = localMax;
        hasTop[ci] = 1;

        // Pass B: bottomD = min depth in [topD - expectedMax, topD - expectedMin]
        var bottomThresh = localMax - expectedMin;
        var farthestThresh = localMax - expectedMax;
        var localMinBot = Infinity;
        for (var k = 0; k < cnt; k++) {
          var d = depths[off + k];
          if (d > bottomThresh) continue;
          if (d < farthestThresh) continue;
          if (d < localMinBot) localMinBot = d;
          // Track the global slab-bottom too.
          if (d >= globalLowerB && d <= globalUpperB && d < globalBottomD) {
            globalBottomD = d;
          }
        }
        if (localMinBot === Infinity) continue;
        bottomAll[ci] = localMinBot;
        hasBottom[ci] = 1;
      }

      // Fallback seeding: any hasTop cell still without a local bottom gets
      // the global bottom value. Ensures cells in regions with no underside
      // scan still get a thickness reading (assuming any underside was
      // scanned anywhere in the box). Per-cell measurements take priority.
      if (globalBottomD < Infinity) {
        for (var ci = 0; ci < nCells; ci++) {
          if (hasTop[ci] && !hasBottom[ci]) {
            bottomAll[ci] = globalBottomD;
            hasBottom[ci] = 1;
          }
        }
      }

      depths = null;
      cellOffset = null;
      cellCount = null;

      // Phase 2 — bottom-surface infill via iterative neighbor averaging.
      // The slab underside is mostly continuous, so cells with a top scan
      // but no detected bottom can borrow a bottom estimate from valid
      // neighbors. Drop panels and slab steps survive because their cells
      // have their own measured bottom that overrides the infill.
      var bottomFilled = new Float32Array(bottomAll);
      var hasBottomF = new Uint8Array(hasBottom);
      var pending = new Float32Array(nCells);
      var pendingMask = new Uint8Array(nCells);
      var maxIters = Math.max(gridRes, 50); // enough to cross the box
      for (var iter = 0; iter < maxIters; iter++) {
        var changed = false;
        for (var iy = 0; iy < gridRes; iy++) {
          for (var ix = 0; ix < gridRes; ix++) {
            var ci = iy * gridRes + ix;
            if (hasBottomF[ci]) continue;
            if (!hasTop[ci]) continue; // only fill cells that have a top
            var sum = 0, n = 0;
            if (ix > 0)            { var nci = ci - 1;       if (hasBottomF[nci]) { sum += bottomFilled[nci]; n++; } }
            if (ix < gridRes - 1)  { var nci = ci + 1;       if (hasBottomF[nci]) { sum += bottomFilled[nci]; n++; } }
            if (iy > 0)            { var nci = ci - gridRes; if (hasBottomF[nci]) { sum += bottomFilled[nci]; n++; } }
            if (iy < gridRes - 1)  { var nci = ci + gridRes; if (hasBottomF[nci]) { sum += bottomFilled[nci]; n++; } }
            if (n > 0) {
              pending[ci] = sum / n;
              pendingMask[ci] = 1;
              changed = true;
            }
          }
        }
        if (!changed) break;
        for (var i = 0; i < nCells; i++) {
          if (pendingMask[i]) {
            bottomFilled[i] = pending[i];
            hasBottomF[i] = 1;
            pendingMask[i] = 0;
          }
        }
      }
      pending = null; pendingMask = null;

      // Phase 3 — Pass C sanity filter on (top, infilled-bottom) pairs.
      // Free originals once we've used them for infill seeding.
      var thickness = new Float32Array(nCells);
      var topD      = new Float32Array(nCells);
      var bottomD   = new Float32Array(nCells);
      var valid     = new Uint8Array(nCells);
      for (var ci = 0; ci < nCells; ci++) {
        if (!hasTop[ci] || !hasBottomF[ci]) continue;
        var t = topAll[ci] - bottomFilled[ci];
        if (t < expectedMin || t > expectedMax) continue;
        thickness[ci] = t;
        topD[ci] = topAll[ci];
        bottomD[ci] = bottomFilled[ci];
        valid[ci] = 1;
      }
      topAll = null; hasTop = null;
      bottomAll = null; hasBottom = null;
      bottomFilled = null; hasBottomF = null;

      // Pass D — 3×3 median filter; reject cells differing > 30% from median
      var thicknessF = new Float32Array(nCells);
      var validF     = new Uint8Array(nCells);
      var topF       = new Float32Array(nCells);
      var botF       = new Float32Array(nCells);
      var nbrBuf     = new Float32Array(9);
      for (var iy = 0; iy < gridRes; iy++) {
        for (var ix = 0; ix < gridRes; ix++) {
          var ci = iy * gridRes + ix;
          if (!valid[ci]) continue;
          var nN = 0;
          for (var dy = -1; dy <= 1; dy++) {
            var ny = iy + dy; if (ny < 0 || ny >= gridRes) continue;
            for (var dx = -1; dx <= 1; dx++) {
              var nx = ix + dx; if (nx < 0 || nx >= gridRes) continue;
              var nci = ny * gridRes + nx;
              if (valid[nci]) nbrBuf[nN++] = thickness[nci];
            }
          }
          if (nN < 3) {
            // Too few neighbours to validate — keep as-is
            thicknessF[ci] = thickness[ci];
            validF[ci] = 1;
            topF[ci] = topD[ci]; botF[ci] = bottomD[ci];
            continue;
          }
          // Insertion sort on small array
          for (var ii = 1; ii < nN; ii++) {
            var x = nbrBuf[ii], jj = ii - 1;
            while (jj >= 0 && nbrBuf[jj] > x) { nbrBuf[jj + 1] = nbrBuf[jj]; jj--; }
            nbrBuf[jj + 1] = x;
          }
          var med = nbrBuf[nN >> 1];
          if (med > 0 && Math.abs(thickness[ci] - med) / med <= 0.50) {
            thicknessF[ci] = thickness[ci];
            validF[ci] = 1;
            topF[ci] = topD[ci]; botF[ci] = bottomD[ci];
          }
        }
      }
      thickness = null; valid = null; topD = null; bottomD = null; nbrBuf = null;

      // Pass E — connected-component footprint rejection.
      // Find global median of valid cells; mark "fat" cells (> median*1.3),
      // flood-fill components, drop components below minComponentM2.
      var sortBuf = [];
      for (var i = 0; i < nCells; i++) if (validF[i]) sortBuf.push(thicknessF[i]);
      if (sortBuf.length > 0) {
        sortBuf.sort(function(a, b) { return a - b; });
        var medAll = sortBuf[sortBuf.length >> 1];
        var fatLimit = medAll * 1.30;
        var cellArea = cellU * cellV;
        var minCellsKeep = Math.max(2, Math.ceil(minComponentM2 / cellArea));

        var component = new Int32Array(nCells); // 0 = not visited
        var stack = [];
        var compId = 1;
        var compSize = [0]; // index 0 unused
        for (var iy = 0; iy < gridRes; iy++) {
          for (var ix = 0; ix < gridRes; ix++) {
            var ci = iy * gridRes + ix;
            if (component[ci] !== 0) continue;
            if (!validF[ci] || thicknessF[ci] <= fatLimit) continue;
            // Flood fill
            stack.length = 0;
            stack.push(ci);
            component[ci] = compId;
            var sz = 0;
            while (stack.length > 0) {
              var cci = stack.pop();
              sz++;
              var cy = (cci / gridRes) | 0;
              var cx = cci - cy * gridRes;
              // 4-connected neighbours
              if (cx > 0) {
                var nci = cci - 1;
                if (component[nci] === 0 && validF[nci] && thicknessF[nci] > fatLimit) {
                  component[nci] = compId; stack.push(nci);
                }
              }
              if (cx < gridRes - 1) {
                var nci = cci + 1;
                if (component[nci] === 0 && validF[nci] && thicknessF[nci] > fatLimit) {
                  component[nci] = compId; stack.push(nci);
                }
              }
              if (cy > 0) {
                var nci = cci - gridRes;
                if (component[nci] === 0 && validF[nci] && thicknessF[nci] > fatLimit) {
                  component[nci] = compId; stack.push(nci);
                }
              }
              if (cy < gridRes - 1) {
                var nci = cci + gridRes;
                if (component[nci] === 0 && validF[nci] && thicknessF[nci] > fatLimit) {
                  component[nci] = compId; stack.push(nci);
                }
              }
            }
            compSize[compId] = sz;
            compId++;
          }
        }
        for (var i = 0; i < nCells; i++) {
          var cid = component[i];
          if (cid > 0 && compSize[cid] < minCellsKeep) {
            validF[i] = 0;
          }
        }
        component = null; sortBuf = null;
      }

      return {
        grid:     thicknessF,
        valid:    validF,
        topD:     topF,
        bottomD:  botF,
        gridRes:  gridRes,
        uMin:     uMin,  vMin: vMin,
        cellU:    cellU, cellV: cellV,
        U:        U,     V: V,    N: N,    C: C,
        binSize:  binSize
      };
    }

    // Look up thickness for a world point. Returns the cell's thickness if
    // valid AND the point is inside the cell's slab band [bottomD, topD]
    // (with a small tolerance). Returns null otherwise so coloring restores
