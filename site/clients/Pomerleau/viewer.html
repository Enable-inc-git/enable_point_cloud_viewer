    // the original RGB — keeps off-slab points uncolored even when their
    // (u,v) cell is valid (e.g. a hanger sticking below a real cell).
    // Look up cell's thickness for a world point. The top-surface filter
    // (cfg.surfaceGrid) already does the spatial gating in the apply loop,
    // so we don't need a depth-band check here — we just need the cell's
    // thickness value to drive the color.
    function getThicknessForPoint(px, py, pz, tg) {
      if (!tg) return null;
      var dx = px - tg.C.x, dy = py - tg.C.y, dz = pz - tg.C.z;
      var u = dx * tg.U.x + dy * tg.U.y + dz * tg.U.z;
      var vv = dx * tg.V.x + dy * tg.V.y + dz * tg.V.z;
      var iu = Math.floor((u - tg.uMin) / tg.cellU);
      var iv = Math.floor((vv - tg.vMin) / tg.cellV);
      if (iu < 0 || iu >= tg.gridRes || iv < 0 || iv >= tg.gridRes) return null;
      var idx = iv * tg.gridRes + iu;
      if (!tg.valid[idx]) return null;
      return tg.grid[idx];
    }

    // ===== MEASUREMENT POINT LABELS =====
    const measurePointLabels = new Map(); // Map<Measure, TextSprite[]>
    const measureLabelScene = new THREE.Scene();
    measureLabelScene.name = "EnableMeasureLabelScene";
    let nextPointNumber = 1;                    // global D-number, never resets
    const measurePointNumbers = new Map();      // Map<Measure, number[]> — D-numbers per measurement

    // ===== SNAP THRESHOLDS (screen pixels) =====
    var SNAP_THRESHOLD_MEMBER = 18;      // for member/constraint picks
    var SNAP_THRESHOLD_MEASUREMENT = 10; // for Potree measurement picks (gentler)

    // ===== UNDO STACK =====
    const undoStack = [];

    // Attach undo tracking to a volume — captures transform before gizmo interaction, pushes on mouseup
    function trackVolumeUndo(volume) {
      var savedPos = null, savedRot = null, savedScale = null;
      var armed = false; // skip the initial insertion drag

      // After a short delay, arm the tracker (avoids capturing the initial sizing drag)
      setTimeout(function() { armed = true; }, 1500);

      function captureState() {
        if (!armed) return;
        if (!savedPos) {
          savedPos = volume.position.clone();
          savedRot = volume.rotation.clone();
          savedScale = volume.scale.clone();
        }
      }

      function pushUndo() {
        if (!savedPos) return;
        var posChanged = !volume.position.equals(savedPos);
        var rotChanged = volume.rotation.x !== savedRot.x || volume.rotation.y !== savedRot.y || volume.rotation.z !== savedRot.z;
        var scaleChanged = !volume.scale.equals(savedScale);
        if (posChanged || rotChanged || scaleChanged) {
          var sp = savedPos, sr = savedRot, ss = savedScale;
          var vol = volume;
          undoStack.push({
            type: 'volume-transform',
            apply: function() {
              vol.position.copy(sp);
              vol.rotation.copy(sr);
              vol.scale.copy(ss);
            }
          });
        }
        savedPos = null;
        savedRot = null;
        savedScale = null;
      }

      // Listen for transform changes from Potree's TransformationTool gizmo
      volume.addEventListener('position_changed', captureState);
      volume.addEventListener('orientation_changed', captureState);
      volume.addEventListener('scale_changed', captureState);

      // Also capture on raw drag events (body drag, not gizmo)
      volume.addEventListener('drag', captureState);
      volume.addEventListener('drop', pushUndo);

      // Push undo when mouse is released (covers gizmo handle drops)
      document.addEventListener('mouseup', function() {
        if (savedPos) {
          // Delay slightly so the final transform is applied before we compare
          setTimeout(pushUndo, 50);
        }
      });
    }

    // -- Undo last action --
    function performUndo() {
      if (undoStack.length === 0) { showToast('Nothing to undo'); return; }
      var action = undoStack.pop();

      if (action.type === 'mark') {
        // Remove the specific marker by id
        deleteMarker(action.id);
        showToast('Undid mark (' + markedPoints.length + ' remaining)');
      } else if (action.type === 'constraint-point') {
        // Remove last picked constraint point
        if (constraintPickMode && constraintPickPoints.length > 0) {
          constraintPickPoints.pop();
          if (constraintPickMarkers.length > 0) {
            var m = constraintPickMarkers.pop();
            m.traverse(function(obj) {
              if (obj.geometry) obj.geometry.dispose();
              if (obj.material) obj.material.dispose();
            });
            constraintScene.remove(m);
          }
          if (constraintPickPoints.length === 0) {
            cancelConstraintPick();
            showToast('Undid constraint pick — cancelled');
          } else {
            showToast('Pick point (' + (constraintPickPoints.length + 1) + '/' + constraintPickTarget + ') for ' + constraintPickType, 5000);
          }
        }
      } else if (action.type === 'constraint') {
        deleteConstraint(action.id);
        showToast('Undid constraint');
      } else if (action.type === 'member-point') {
        // Remove last picked member point
        if (memberPickMode && memberPickPoints.length > 0) {
          memberPickPoints.pop();
          if (memberPickMarkers.length > 0) {
            var m = memberPickMarkers.pop();
            m.traverse(function(obj) {
              if (obj.geometry) obj.geometry.dispose();
              if (obj.material) obj.material.dispose();
            });
            memberScene.remove(m);
          }
          if (memberPickPoints.length === 0) {
            cancelMemberPick();
            showToast('Undid member pick — cancelled');
          } else {
            showToast('Pick endpoint (2/2) for member', 5000);
          }
        }
      } else if (action.type === 'member') {
        deleteMember(action.id);
        showToast('Undid member');
      } else if (action.type === 'measurement-point') {
        var meas = action.measure;
        if (meas && meas.points && meas.points.length > 0) {
          var minReq = _measureMinPoints(meas);
          // If removing the last point would leave the measurement below its
          // required minimum, remove the entire measurement (no orphan
          // 1-point distance/height or <3-point area/angle measurements).
          if (meas.points.length - 1 < minReq) {
            // If this measurement is in-progress, also cancel the Potree tool
            // so we don't leave a dangling cursor-follow sphere + drag.
            if (pendingMeasurement === meas) cancelPotreeInsertion();
            viewer.scene.removeMeasurement(meas);
            showToast('Undid measurement');
          } else {
            meas.removeMarker(meas.points.length - 1);
            showToast('Undid measurement point');
          }
        }
      } else if (action.type === 'volume-transform') {
        action.apply();
        showToast('Undid box transform');
      }
    }

    // -- Monkey-patch point picking to apply active constraint --
    const _origPick = Potree.Utils.getMousePointCloudIntersection;
    Potree.Utils.getMousePointCloudIntersection = function(mouse, camera, viewer, pointclouds, params) {
      const result = _origPick.call(this, mouse, camera, viewer, pointclouds, params);
      if (result && result.location && activeConstraintId && !constraintPickMode && !constraintDragActive) {
        var _ac0 = constraints.find(function(con) { return con.id === activeConstraintId; });
        var _hasPrior0 = !!(pendingMeasurement && pendingMeasurement.points.length >= 2);
        if (!_ac0) {
          // no-op
        } else if (_ac0.type !== 'plane') {
          // Axis: project onto axis as before.
          result.location = projectPoint(result.location);
        } else if (_orthoParallelMode && _orthoMeasureMode && _hasPrior0 && _ac0.basis) {
          // Parallel + ortho with a prior: do NOT project here; the ortho block
          // below will snap to whichever of X / Y / Z is dominant. Projecting
          // first would zero out the Z (normal) component and prevent Z snap.
        } else if (_orthoParallelMode && _hasPrior0) {
          // Parallel without ortho (or ortho without basis): lock the pick to a
          // plane parallel to the active plane through the prior committed
          // point so elevation tracks the chain.
          var _n0 = _ac0.normal;
          var _priorPt0 = pendingMeasurement.points[pendingMeasurement.points.length - 2];
          var _p0 = _priorPt0.position || _priorPt0;
          var _d0 = (result.location.x - _p0.x) * _n0.x +
                    (result.location.y - _p0.y) * _n0.y +
                    (result.location.z - _p0.z) * _n0.z;
          result.location = result.location.clone().addScaledVector(_n0, -_d0);
        } else {
          // Plane-locked, or parallel mode without a prior: project onto the
          // active plane (offset 0).
          result.location = projectPoint(result.location);
        }
      }
      // Ortho-measure: lock the pick to whichever of the active plane's basis
      // axes is most aligned with the cursor's *screen-space* motion from the
      // previous committed measurement point. We can't compare world-space
      // components of the raw cloud pick because the cloud is a surface, not
      // a free 3D space — moving the cursor "up" on a side view still lands
      // on the floor, killing dz. Screen-space alignment + projection on the
      // chosen axis line gives the natural ortho behaviour.
      if (result && result.location && _orthoMeasureMode && pendingMeasurement &&
          pendingMeasurement.points.length >= 2 && !constraintPickMode &&
          !memberPickMode && !constraintDragActive && !memberDragActive) {
        var ac = constraints.find(function(con) { return con.id === activeConstraintId; });
        if (ac && ac.type === 'plane' && ac.basis) {
          var _priorPt = pendingMeasurement.points[pendingMeasurement.points.length - 2];
          var prior = _priorPt.position || _priorPt;
          var bx = ac.basis.X, by = ac.basis.Y, bz = ac.basis.Z;
          var _cam = viewer.scene.getActiveCamera();
          var _rect = renderArea.getBoundingClientRect();
          var _pNDC = prior.clone().project(_cam);
          var _pPxX = (_pNDC.x + 1) * 0.5 * _rect.width;
          var _pPxY = (1 - _pNDC.y) * 0.5 * _rect.height;
          var _cdx = mouse.x - _pPxX;
          var _cdy = mouse.y - _pPxY;
          // For each axis, compute its screen-space pixel direction (per 1
          // world unit) and the signed projection of the cursor delta onto it.
          function _axisInfo(axis) {
            var tip = prior.clone().add(axis);
            var tNDC = tip.project(_cam);
            var sx = ((tNDC.x + 1) * 0.5 * _rect.width) - _pPxX;
            var sy = ((1 - tNDC.y) * 0.5 * _rect.height) - _pPxY;
            var slen = Math.sqrt(sx * sx + sy * sy);
            if (slen < 1e-3) return { score: 0, t: 0 };
            var proj = (_cdx * sx + _cdy * sy) / slen; // pixels along axis
            return { score: Math.abs(proj), t: proj / slen }; // t in world units (1 unit ≈ slen px)
          }
          var rx = _axisInfo(bx);
          var ry = _axisInfo(by);
          var rz = _orthoParallelMode ? _axisInfo(bz) : { score: -1, t: 0 };

          if (ry.score > bestScore) { bestAxis = by; bestT = ry.t; bestScore = ry.score; }

      if (result && result.location && !constraintPickMode && !memberPickMode && !constraintDragActive && !memberDragActive) {
        var snap = findSnapTarget(mouse, SNAP_THRESHOLD_MEASUREMENT);
        if (snap) {
          result.location = snap.position;
          showToast('Snapped to ' + snap.label, 1000);
        }
      }
      return result;
    };

    // -- Project a point onto the active constraint --
    function projectPoint(point) {
      const c = constraints.find(function(con) { return con.id === activeConstraintId; });
      if (!c) return point;
      if (c.type === 'plane') {
        const target = new THREE.Vector3();
        c.plane.projectPoint(point, target);
        return target;
      } else if (c.type === 'axis') {
        const v = new THREE.Vector3().subVectors(point, c.origin);
        const t = v.dot(c.direction);
        return new THREE.Vector3().copy(c.origin).addScaledVector(c.direction, t);
      }
      return point;

    // -- Start constraint pick mode --

        var btn = document.getElementById('btn-fit-plane');

    // -- Place a temporary neon-green concentric ring marker during picking --

    // -- Remove all temporary pick markers --
    function clearPickMarkers() {
      for (var i = 0; i < constraintPickMarkers.length; i++) {
        var m = constraintPickMarkers[i];
        m.traverse(function(obj) {
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) obj.material.dispose();

        constraintScene.remove(m);

      constraintPickMarkers.length = 0;

    // -- Handle a picked point during constraint definition --
    function handleConstraintPick(position) {
      // After 2 X-axis picks, additional clicks are ignored — the user drags
      // the existing markers to refine.
      if (constraintPickType === 'plane-x-axis' && constraintPickPoints.length >= 2) {
        showToast('+X already set — drag a marker to refine, Enter to accept', 4000);
        return;
      }
      // X-axis picks are stored at the actual scan-geometry location. Projection
      // onto the plane happens only inside computePlaneBasis when deriving X/Y.
      constraintPickPoints.push(position.clone());

      undoStack.push({ type: 'constraint-point' });

        showToast(status, 5000);

        if (count < 2) {
          showToast('Pick +X end point (2/2) \u2014 left \u2192 right on screen', 5000);
        } else {
          showToast('+X line set \u2014 drag a marker to refine, Enter to accept, Esc to cancel', 6000);
        }

    // -- Cancel constraint pick mode --
    function cancelConstraintPick() {

      constraintPickType = null;
      constraintPickTarget = 0;
