      if (vol.label) vol.label.visible = false;
    }

    // Per-box state drives whether a box is highlighted (green preview) or heat-mapped
    var _elevationComputed = false; // legacy; retained for save/load compatibility

    // Push elevation box transforms to highlight boxes (green point tint).
    // A box gets the green highlight if it's enabled AND either:
    //   - cfg.active is false (never computed → preview mode), OR
    //   - cfg.active is true BUT the user has moved/resized the box since
    //     compute (current transform != cfg.computedBoxMatrix). The whole
    //     current OBB tints green, signalling "this is the new region";
    //     the heat map still paints inside (modulated by current bounds via
    //     applyElevationColors, see boxTransformChanged below).
    function _matricesDiffer(a, b) {
      if (!a || !b) return !!a !== !!b;
      var ae = a.elements, be = b.elements;
      for (var k = 0; k < 16; k++) {
        if (Math.abs(ae[k] - be[k]) > 1e-6) return true;
      }
      return false;
    }
    function syncHighlightBoxes() {
      var matrixList = [];
      for (var i = 0; i < elevationCropVolumes.length; i++) {
        var vol = elevationCropVolumes[i];
        if (vol._disabled) continue;
        var cfg = getBoxConfig(vol);
        vol.updateMatrixWorld(true);
        var modifiedSinceCompute = cfg.active && cfg.computedBoxMatrix &&
          _matricesDiffer(vol.matrixWorld, cfg.computedBoxMatrix);
        if (cfg.active && !modifiedSinceCompute) continue;
        matrixList.push({ inverse: new THREE.Matrix4().copy(vol.matrixWorld).invert() });
      }
      viewer.scene.pointclouds.forEach(function(pc) {
        pc.material.setHighlightBoxes(matrixList);
      });
    }

    function addElevationBox() {
      var volume = viewer.volumeTool.startInsertion({ clip: false });
      _elevBoxCounter++;
      volume.name = 'Elev Box ' + _elevBoxCounter;
      volume.clip = false;

      styleElevationBox(volume);
      setTimeout(function() { styleElevationBox(volume); }, 500);

      elevationCropVolumes.push(volume);
      trackVolumeUndo(volume);
      // New box starts as inactive (cfg.active=false) so it shows the green preview.
      // Already-active boxes retain their heat map colors.
      syncHighlightBoxes();
      rebuildElevationBoxList();
      showToast('Click and drag on the point cloud to place elevation box.');
    }

    function removeElevationBox(index) {
      if (index < 0 || index >= elevationCropVolumes.length) return;
      var vol = elevationCropVolumes[index];
      var cfg = getBoxConfig(vol);
      if (cfg.contourGroup) {
        disposeContourGroup(cfg.contourGroup);
        cfg.contourGroup = null;
      }
      elevationBoxConfigs.delete(vol);
      if (_selectedElevBox === vol) _selectedElevBox = null;
      viewer.scene.removeVolume(vol);
      elevationCropVolumes.splice(index, 1);
      if (elevationActive) {
        applyElevationColors(elevationPositions, elevationNodeMap);
      }
      syncHighlightBoxes();
      rebuildElevationBoxList();
      showToast('Elevation box removed');
    }

    function clearAllElevationBoxes() {
      for (var i = 0; i < elevationCropVolumes.length; i++) {
        var cfg = getBoxConfig(elevationCropVolumes[i]);
        if (cfg.contourGroup) disposeContourGroup(cfg.contourGroup);
        elevationBoxConfigs.delete(elevationCropVolumes[i]);
        viewer.scene.removeVolume(elevationCropVolumes[i]);
      }
      elevationCropVolumes = [];
      _elevBoxCounter = 0;
      _selectedElevBox = null;
      if (elevationActive) onClearElevation();
      rebuildElevationBoxList();
    }

    function rebuildElevationBoxList() {
      var list = document.getElementById('enable-elevation-box-list');
      if (!list) return;
      list.innerHTML = '';

      var clearBtn = document.getElementById('btn-clear-all-elev-boxes');
      if (clearBtn) clearBtn.style.display = elevationCropVolumes.length > 0 ? '' : 'none';

      var btnStyle = 'padding:3px 6px;border:1px solid var(--border,#333);border-radius:3px;font:11px sans-serif;cursor:pointer;background:var(--panel-bg,#6b6b6b);color:var(--sidebar-text,#fbfbfb)';
      var iconBtnStyle = 'background:none;border:none;color:var(--sidebar-text,#fbfbfb);cursor:pointer;font-size:14px;padding:2px 4px';

      // Distinct accent color per box — cycles through a palette so each row is visually unique.
      var _elevBoxPalette = ['#4db6ff', '#ff9f43', '#d66bff', '#4ee6a0', '#ffd54f', '#ff6b9d', '#4de1e6', '#b0ff4d'];

      for (var i = 0; i < elevationCropVolumes.length; i++) {
        (function(idx) {
          var vol = elevationCropVolumes[idx];
          var cfg = getBoxConfig(vol);
          var accent = _elevBoxPalette[idx % _elevBoxPalette.length];

          var wrapper = document.createElement('div');
          wrapper.style.cssText =
            'margin:10px 0;background:rgba(255,255,255,0.04);' +
            'border:1px solid rgba(255,255,255,0.08);' +
            'border-left:4px solid ' + accent + ';' +
            'border-radius:4px;padding:8px 10px;' +
            'box-shadow:0 1px 2px rgba(0,0,0,0.2)';

          // Header row: colored dot + name + status badge + eye/outline/delete
          var row = document.createElement('div');
          row.style.cssText = 'display:flex;align-items:center;gap:6px;font:13px/1.3 sans-serif;color:var(--sidebar-text,#fbfbfb)';

          var dot = document.createElement('span');
          dot.style.cssText = 'display:inline-block;width:10px;height:10px;border-radius:50%;background:' + accent + ';flex:none';

          var nameSpan = document.createElement('span');
          nameSpan.style.cssText = 'flex:1;font-weight:700;letter-spacing:0.2px';
          nameSpan.textContent = vol.name;

          var badge = document.createElement('span');
          var badgeText, badgeBg, badgeColor;
          if (cfg.heatmapHidden) { badgeText = 'Hidden'; badgeBg = 'rgba(255,255,255,0.08)'; badgeColor = '#bbb'; }
          else if (cfg.active)    { badgeText = 'Active'; badgeBg = 'rgba(78,230,160,0.2)'; badgeColor = '#4ee6a0'; }
          else                    { badgeText = 'Draft';  badgeBg = 'rgba(255,255,255,0.08)'; badgeColor = '#bbb'; }
          badge.textContent = badgeText;
          badge.style.cssText = 'font:10px/1 sans-serif;font-weight:600;padding:2px 6px;border-radius:10px;background:' + badgeBg + ';color:' + badgeColor + ';text-transform:uppercase';

          // Eye: toggle heat map + contour visibility for this box only
          var eyeBtn = document.createElement('button');
          eyeBtn.textContent = cfg.heatmapHidden ? '\u{1F441}\u0338' : '\u{1F441}';
          eyeBtn.title = cfg.heatmapHidden ? 'Show heat map' : 'Hide heat map';
          eyeBtn.style.cssText = iconBtnStyle + ';opacity:' + (cfg.heatmapHidden ? '0.45' : '1');
          eyeBtn.addEventListener('click', function() {
            cfg.heatmapHidden = !cfg.heatmapHidden;
            if (cfg.contourGroup) cfg.contourGroup.visible = !cfg.heatmapHidden;
            if (elevationActive && elevationPositions && elevationNodeMap) {
              applyElevationColors(elevationPositions, elevationNodeMap);
              elevationColoredNodes.clear();
              for (var ni = 0; ni < elevationNodeMap.length; ni++) {
                elevationColoredNodes.add(elevationNodeMap[ni].geometryNode);
              }
            }
            rebuildElevationBoxList();
          });

          // Outline: toggle the 3D wireframe around the box (not its heat map)
          var frameVisible = vol.frame ? vol.frame.visible : !vol._outlineHidden;
          var outlineBtn = document.createElement('button');
          outlineBtn.textContent = frameVisible ? '\u25A1' : '\u25A0';
          outlineBtn.title = frameVisible ? 'Hide box outline' : 'Show box outline';
          outlineBtn.style.cssText = iconBtnStyle;
          outlineBtn.addEventListener('click', function() {
            vol._outlineHidden = !vol._outlineHidden;
            if (vol.frame) vol.frame.visible = !vol._outlineHidden;
            if (vol.box) vol.box.visible = true; // keep clickable fill available
            outlineBtn.textContent = vol._outlineHidden ? '\u25A0' : '\u25A1';
            outlineBtn.title = vol._outlineHidden ? 'Show box outline' : 'Hide box outline';
          });

          var delBtn = document.createElement('button');
          delBtn.textContent = '\u2715';
          delBtn.title = 'Remove';
          delBtn.style.cssText = iconBtnStyle + ';color:#f44';
          delBtn.addEventListener('click', function() { removeElevationBox(idx); });

          row.appendChild(dot);
          row.appendChild(nameSpan);
          row.appendChild(badge);
          row.appendChild(eyeBtn);
          row.appendChild(outlineBtn);
          row.appendChild(delBtn);
          wrapper.appendChild(row);

          // Expandable settings panel
          var panel = document.createElement('div');
          panel.style.cssText = 'margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,255,255,0.08);font:11px/1.4 sans-serif;color:var(--sidebar-text,#fbfbfb)';

          // Mode selector

    // ===== COMPUTE PROGRESS OVERLAY =====
    function showComputeOverlay(text) {
      var ov = document.getElementById('enable-compute-overlay');
      var st = document.getElementById('enable-compute-status-text');
      if (st) st.textContent = text || 'Computing...';
      if (ov) ov.classList.add('show');
    }
    function setComputeProgress(text) {
      var st = document.getElementById('enable-compute-status-text');
      if (st) st.textContent = text;
    }
    function hideComputeOverlay() {
      var ov = document.getElementById('enable-compute-overlay');
      if (ov) ov.classList.remove('show');
    }
    // Yield to the browser between phases so paint flushes (status text
    // updates and the animated bar stay smooth even though the heavy work
    // is synchronous JS).
    function _yieldToPaint() {
      return new Promise(function(r) { requestAnimationFrame(function() { setTimeout(r, 0); }); });
    }

    function onComputeElevation() {
      var pc = viewer.scene.pointclouds[0];
      if (!pc) { showToast('No point cloud loaded'); return; }
      if (!_selectedElevBox) {
        showToast('Select a box to compute');
        return;
      }
      var targetVol = _selectedElevBox;
      var selCfg = getBoxConfig(targetVol);
      if (targetVol._disabled) { showToast('Box is hidden'); return; }
      if (selCfg.mode === 'plane' && !selCfg.refPlane) { showToast('Select a reference plane first'); return; }
      if (selCfg.mode === 'plane' && !selCfg.sideSet) { showToast('Pick the viewing side first'); return; }

      showComputeOverlay('Preparing region...');

      // This box's own crop bounds (OBB AABB)
      var boxBounds = getCropBoxBounds(targetVol);
      selCfg.cropBounds = boxBounds;
      targetVol.updateMatrixWorld(true);
      var boxInv = new THREE.Matrix4().copy(targetVol.matrixWorld).invert();

      // Build the union AABB of every active box plus the one we're about to
      // compute, padded by ~5% so we still see surfaces just outside an edge.
      // forceLoadAllNodes/extractPositions use this filter so we don't load
      // the entire 26M-point cloud just to color a small region.
      var loadAABB = (function() {
        var u = getElevationCropBounds();
        var b = boxBounds;
        var lo = [
          Math.min((u ? u.min[0] : Infinity), b.min[0]),
          Math.min((u ? u.min[1] : Infinity), b.min[1]),
          Math.min((u ? u.min[2] : Infinity), b.min[2])
        ];
        var hi = [
          Math.max((u ? u.max[0] : -Infinity), b.max[0]),
          Math.max((u ? u.max[1] : -Infinity), b.max[1]),
          Math.max((u ? u.max[2] : -Infinity), b.max[2])
        ];
        var pad = [(hi[0] - lo[0]) * 0.05, (hi[1] - lo[1]) * 0.05, (hi[2] - lo[2]) * 0.05];
        return {
          min: [lo[0] - pad[0], lo[1] - pad[1], lo[2] - pad[2]],
          max: [hi[0] + pad[0], hi[1] + pad[1], hi[2] + pad[2]]
        };
      })();

      $('#enable-elevation-status').text('Loading octree nodes for region...');
      setComputeProgress('Loading octree nodes for region...');

      if (elevationOrigBudget === null) elevationOrigBudget = viewer.getPointBudget();
      viewer.setPointBudget(20000000);

      forceLoadAllNodes(pc, loadAABB, {
        // Depth 6 + 1.5M point soft cap keeps web load times bounded without
        // visibly degrading the elevation grid (200×200 = 40K cells; ~10–40
        // points per cell is plenty for stable top-surface detection). Bump
        // these if a particular cloud needs finer resolution.
        maxDepth: 6,
        maxPoints: 1500000,
        onProgress: function(p) {
          setComputeProgress('Loading octree nodes... ' + p.loaded.toLocaleString() + ' pts loaded'
            + (p.inFlight > 0 ? ' (' + p.inFlight + ' in flight)' : ''));
        }
      }).then(function () {
        setComputeProgress('Extracting positions...');
        return _yieldToPaint();
      }).then(function () {
        var data = extractPositions(pc, loadAABB);
        elevationPositions = data.positions;
        elevationNodeMap = data.nodeMap;
        if (!elevationOrigRGBA) {
          elevationOrigRGBA = backupOriginalRGBA(pc);
        }
        $('#enable-elevation-status').text('Building surface grid...');
        setComputeProgress('Building surface grid (' + data.count.toLocaleString() + ' pts)...');
        return _yieldToPaint().then(function() { return data; });
      }).then(function (data) {
        // Build this box's surface grid using only points INSIDE this box (OBB).
        // For Z mode the surface grid is fused into Pass A below — we walk the
        // points only twice total (range/count/grid in Pass A, top-surface
        // refine in Pass B) instead of the previous four times.
        var v = new THREE.Vector3();
        var count = data.count;

        // Hoist mode-specific elev constants once. Avoids per-point function
        // calls (getZBaseZ linearly searched markedPoints) and per-point
        // property lookups (refPlane.normal.x, etc.) inside the inner loops.
        var modeIsThickness = (selCfg.mode === 'thickness');
        var modeIsPlane = (selCfg.mode === 'plane' && !!selCfg.refPlane);
        var zBaseZ = 0;
        var pNx, pNy, pNz, pCx, pCy, pCz, pSide;
        if (modeIsPlane) {
          pNx = selCfg.refPlane.normal.x; pNy = selCfg.refPlane.normal.y; pNz = selCfg.refPlane.normal.z;
          pCx = selCfg.refPlane.centroid.x; pCy = selCfg.refPlane.centroid.y; pCz = selCfg.refPlane.centroid.z;
          pSide = selCfg.refSide || 1;
        } else if (!modeIsThickness) {
          zBaseZ = getZBaseZ(selCfg);
        }

        // Allocate the Z surface grid up front for Z and thickness modes —
        // Pass A populates it inline (eliminates the separate buildSurfaceGrid
        // pass that thickness mode previously did). Plane mode uses
        // planeSurfGrid for its top-surface check, so no Z grid is needed.
        function _allocMaxZGrid() {
          var gxMin = boxBounds.min[0], gxMax = boxBounds.max[0];
          var gyMin = boxBounds.min[1], gyMax = boxBounds.max[1];
          var gxRange = gxMax - gxMin, gyRange = gyMax - gyMin;
          if (gxRange < 1e-6 || gyRange < 1e-6) return null;
          var gridRes = 200;
          var maxZ = new Float32Array(gridRes * gridRes);
          for (var i = 0; i < maxZ.length; i++) maxZ[i] = -Infinity;
          return {
            maxZ: maxZ, gridRes: gridRes,
            xMin: gxMin, yMin: gyMin,
            cellX: gxRange / gridRes, cellY: gyRange / gridRes
          };
        }
        if (modeIsPlane) {
          selCfg.surfaceGrid = null;
          selCfg.planeSurfGrid = null; // populated below, after Pass A
          selCfg.thicknessGrid = null;
        } else {
          // Z + thickness: Z surface grid for top-surface filter.
          selCfg.surfaceGrid = _allocMaxZGrid();
          selCfg.planeSurfGrid = null;
          selCfg.thicknessGrid = null; // populated below, after Pass A (for thickness)
        }

        // Pass A — unified single walk: OBB count + (Z/plane) range scan +
        // (Z/thickness) maxZ-grid populate + (plane/thickness) UV/depth bounds.
        // Sharing the bounds with the plane and thickness grid builders below
        // saves them an entire pass each over the points.
        var rawZMin = Infinity, rawZMax = -Infinity;
        var zMin = Infinity, zMax = -Infinity;
        var countInside = 0;
        // Plane / thickness UV (and thickness depth) bounds, plus their basis.
        // For thickness we negate N when refSide < 0 so the slab "depth" axis
        // points the user's chosen direction (matches buildThicknessGrid's
        // existing convention).
        var planeUMin = Infinity, planeUMax = -Infinity, planeVMin = Infinity, planeVMax = -Infinity;
        var thickUMin = Infinity, thickUMax = -Infinity;
        var thickVMin = Infinity, thickVMax = -Infinity;
        var thickDMin = Infinity, thickDMax = -Infinity;
        var pUx, pUy, pUz, pVx, pVy, pVz; // plane mode UV basis
        var tUx, tUy, tUz, tVx, tVy, tVz, tNx, tNy, tNz, tCx, tCy, tCz; // thickness UV+N basis
        if (modeIsPlane) {
          var pn = selCfg.refPlane.normal;
          var worldUp = Math.abs(pn.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
          var pU = new THREE.Vector3().crossVectors(worldUp, pn).normalize();
          var pV = new THREE.Vector3().crossVectors(pn, pU).normalize();
          pUx = pU.x; pUy = pU.y; pUz = pU.z;
          pVx = pV.x; pVy = pV.y; pVz = pV.z;
        }
        if (modeIsThickness) {
          var tN = selCfg.refPlane ? selCfg.refPlane.normal.clone() : new THREE.Vector3(0, 0, 1);
          if (selCfg.refSide && selCfg.refSide < 0) tN.negate();
          var tWorldUp = Math.abs(tN.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
          var tU = new THREE.Vector3().crossVectors(tWorldUp, tN).normalize();
          var tV = new THREE.Vector3().crossVectors(tN, tU).normalize();
          var tC = selCfg.refPlane ? selCfg.refPlane.centroid : new THREE.Vector3(0, 0, 0);
          tUx = tU.x; tUy = tU.y; tUz = tU.z;
          tVx = tV.x; tVy = tV.y; tVz = tV.z;
          tNx = tN.x; tNy = tN.y; tNz = tN.z;
          tCx = tC.x; tCy = tC.y; tCz = tC.z;
        }
        var sg = selCfg.surfaceGrid;
        var sgMaxZ = sg ? sg.maxZ : null;
        var sgRes = sg ? sg.gridRes : 0;
        var sgXMin = sg ? sg.xMin : 0, sgYMin = sg ? sg.yMin : 0;
        var sgCellX = sg ? sg.cellX : 1, sgCellY = sg ? sg.cellY : 1;
        var bbMinX = boxBounds.min[0], bbMinY = boxBounds.min[1], bbMinZ = boxBounds.min[2];
        var bbMaxX = boxBounds.max[0], bbMaxY = boxBounds.max[1], bbMaxZ = boxBounds.max[2];

        for (var i = 0; i < count; i++) {
          var px = elevationPositions[i * 3];
          var py = elevationPositions[i * 3 + 1];
          var pz = elevationPositions[i * 3 + 2];

          // Z surface grid (Z + thickness): AABB filter, populate maxZ inline.
          if (sgMaxZ &&
              px >= bbMinX && px <= bbMaxX &&
              py >= bbMinY && py <= bbMaxY &&
              pz >= bbMinZ && pz <= bbMaxZ) {
            var ix = Math.floor((px - sgXMin) / sgCellX);
            var iy = Math.floor((py - sgYMin) / sgCellY);
            if (ix >= sgRes) ix = sgRes - 1; else if (ix < 0) ix = 0;
            if (iy >= sgRes) iy = sgRes - 1; else if (iy < 0) iy = 0;
            var idx = iy * sgRes + ix;
            if (pz > sgMaxZ[idx]) sgMaxZ[idx] = pz;
          }

          // OBB filter for everything else.
          v.set(px, py, pz).applyMatrix4(boxInv);
          if (v.x < -0.5 || v.x > 0.5 || v.y < -0.5 || v.y > 0.5 || v.z < -0.5 || v.z > 0.5) continue;

          countInside++;

          if (modeIsThickness) {
            // Accumulate UV and depth bounds for buildThicknessGrid.
            var dx = px - tCx, dy = py - tCy, dz = pz - tCz;
            var u = dx * tUx + dy * tUy + dz * tUz;
            var vu = dx * tVx + dy * tVy + dz * tVz;
            var dn = dx * tNx + dy * tNy + dz * tNz;
            if (u < thickUMin) thickUMin = u; if (u > thickUMax) thickUMax = u;
            if (vu < thickVMin) thickVMin = vu; if (vu > thickVMax) thickVMax = vu;
            if (dn < thickDMin) thickDMin = dn; if (dn > thickDMax) thickDMax = dn;
            // Range comes from thickness grid post-build; skip Z range here.
          } else {
            if (pz < rawZMin) rawZMin = pz;
            if (pz > rawZMax) rawZMax = pz;
            if (modeIsPlane) {
              var pdx = px - pCx, pdy = py - pCy, pdz = pz - pCz;
              var pu = pdx * pUx + pdy * pUy + pdz * pUz;
              var pv = pdx * pVx + pdy * pVy + pdz * pVz;
              if (pu < planeUMin) planeUMin = pu; if (pu > planeUMax) planeUMax = pu;
              if (pv < planeVMin) planeVMin = pv; if (pv > planeVMax) planeVMax = pv;
              var e = (pdx * pNx + pdy * pNy + pdz * pNz) * pSide;
              if (e < zMin) zMin = e;
              if (e > zMax) zMax = e;
            } else {
              var ez = pz - zBaseZ;
              if (ez < zMin) zMin = ez;
              if (ez > zMax) zMax = ez;
            }
          }
        }

        // Build the mode-specific grid AFTER Pass A so it can reuse the
        // bounds we just computed (skips one full pass each).
        if (modeIsPlane) {
          selCfg.planeSurfGrid = buildPlaneSurfaceGrid(
            elevationPositions, boxBounds, 200, selCfg.refPlane, selCfg.refSide,
            { uMin: planeUMin, uMax: planeUMax, vMin: planeVMin, vMax: planeVMax });
        } else if (modeIsThickness) {
          setComputeProgress('Computing slab thickness grid...');
          selCfg.thicknessGrid = buildThicknessGrid(
            elevationPositions, count, boxInv,
            selCfg.refPlane, selCfg.refSide,
            {
              gridRes: 100,
              expectedMin: selCfg.thicknessExpectedMin || 0.10,
              expectedMax: selCfg.thicknessExpectedMax || 0.60,
              gapTolerance: selCfg.thicknessGapTol || 0.025,
              minCellPoints: 3,
              minComponentArea: 0.1,
              precomputedBounds: {
                uMin: thickUMin, uMax: thickUMax,
                vMin: thickVMin, vMax: thickVMax,
                dMin: thickDMin, dMax: thickDMax,
                inBoxTotal: countInside
              }
            }
          );
          // Range comes directly from the thickness grid's valid cells.
          var tg = selCfg.thicknessGrid;
          if (tg) {
            var nC = tg.gridRes * tg.gridRes;
            for (var ci = 0; ci < nC; ci++) {
              if (!tg.valid[ci]) continue;
              var t = tg.grid[ci];
              if (t < zMin) zMin = t;
              if (t > zMax) zMax = t;
            }
          }
        }

        // Pass B — refine range to top-surface points only.
        if (selCfg.surfaceGrid || selCfg.planeSurfGrid) {
          var range = zMax - zMin;
          var tol = range > 0 ? range * 0.10 : (rawZMax - rawZMin) * 0.10;
          var tsMin = Infinity, tsMax = -Infinity;
          var planeGrid = selCfg.planeSurfGrid, zGrid = selCfg.surfaceGrid;
          var thickGrid = selCfg.thicknessGrid;
          for (var i = 0; i < count; i++) {
            var px = elevationPositions[i * 3];
            var py = elevationPositions[i * 3 + 1];
            var pz = elevationPositions[i * 3 + 2];
            v.set(px, py, pz).applyMatrix4(boxInv);
            if (v.x < -0.5 || v.x > 0.5 || v.y < -0.5 || v.y > 0.5 || v.z < -0.5 || v.z > 0.5) continue;
            if (planeGrid) {
              if (!isPlaneTopSurface(px, py, pz, planeGrid, tol)) continue;
            } else if (zGrid) {
              if (!isTopSurface(px, py, pz, zGrid, tol)) continue;
            }
            var e;
            if (modeIsPlane) {
              e = ((px - pCx) * pNx + (py - pCy) * pNy + (pz - pCz) * pNz) * pSide;
            } else if (modeIsThickness) {
              e = getThicknessForPoint(px, py, pz, thickGrid);
              if (e === null) continue;
            } else {
              e = pz - zBaseZ;
            }
            if (e < tsMin) tsMin = e;
            if (e > tsMax) tsMax = e;
          }
          if (tsMin < tsMax) { zMin = tsMin; zMax = tsMax; }
        }

        if (zMin >= zMax) {
          showToast('No elevation range found in box');
          $('#enable-elevation-status').text('');
          if (elevationOrigBudget !== null) { viewer.setPointBudget(elevationOrigBudget); elevationOrigBudget = null; }
          rebuildElevationBoxList();
          hideComputeOverlay();
          return;
        }

        // Respect user-overridden range if set on this box's cfg
        if (selCfg.zMin !== null && selCfg.zMax !== null && selCfg.zMin < selCfg.zMax) {
          zMin = selCfg.zMin;
          zMax = selCfg.zMax;
        } else {
          selCfg.zMin = zMin;
          selCfg.zMax = zMax;
        }
        selCfg.active = true;
        // Snapshot the box transform at compute time. Used by the per-frame
        // syncHighlightBoxes/applyElevationColors logic to detect that a user
        // has resized/moved the box afterward and to live-preview the new region.
        targetVol.updateMatrixWorld(true);
        selCfg.computedBoxMatrix = targetVol.matrixWorld.clone();
        // Fresh compute → heat map is current with the box transform.
        _heatMapStaleForDrag = false;

        // Expose current box's range for legend / global compat
        elevationZMin = zMin;
        elevationZMax = zMax;

        setComputeProgress('Coloring points...');
        applyElevationColors(elevationPositions, elevationNodeMap);
        updateElevationLegend(zMin, zMax);
        elevationActive = true;

        elevationColoredNodes.clear();
        for (var ni = 0; ni < elevationNodeMap.length; ni++) {
          elevationColoredNodes.add(elevationNodeMap[ni].geometryNode);
        }

        // Belt-and-suspenders: also color every loaded node not already in
        // nodeMap (the AABB filter on extractPositions can skip nodes whose
        // bounding box doesn't intersect the elevation AABB but which Potree
        // still chooses to render). For points outside the box OBB this is a
        // cheap no-op that just restores originals.
        (function() {
          var cachedBoxes = buildActiveBoxDrawList();
          var cachedExcl = buildExclusionInvMats();
          function walk(node) {
            if (!node) return;
            if (node.loaded && node.geometry) {
              var ud = node.geometry.userData;
              if (!ud || !ud.elevColored) {
                colorNodeByElevation(node, pc, cachedBoxes, cachedExcl);
                elevationColoredNodes.add(node);
              }
            }
            if (node.children) {
              for (var k = 0; k < 8; k++) if (node.children[k]) walk(node.children[k]);
            }
          }
          walk(pc.pcoGeometry.root);
        })();

        var rangeLabel = selCfg.mode === 'plane' ? 'Deviation' :
                         (selCfg.mode === 'thickness' ? 'Thickness' : 'Z');
        $('#enable-elevation-status').text(
          targetVol.name + ': ' + countInside.toLocaleString() + ' pts | ' + rangeLabel + ': ' +
          zMin.toFixed(3) + ' to ' + zMax.toFixed(3) + ' (' + (zMax - zMin).toFixed(3) + ' m)'
        );
        rebuildElevationBoxList();

        // Rebuild contours for this box if they were visible
        if (selCfg.contoursVisible) buildBoxContours(targetVol);

        _elevBoxTransformCache = '';
        for (var bi = 0; bi < elevationCropVolumes.length; bi++) {
          elevationCropVolumes[bi].updateMatrixWorld(true);
          _elevBoxTransformCache += elevationCropVolumes[bi].matrixWorld.elements.join(',') + '|';
        }
        syncHighlightBoxes();

        // Restore the original point budget. The 20M bump was only needed
        // to make sure all in-region nodes stayed loaded during compute;
        // colored buffers persist after compute, and elevationFrameUpdate
        // re-colors any nodes that get re-loaded as the user navigates.
        if (elevationOrigBudget !== null) {
          viewer.setPointBudget(elevationOrigBudget);
          elevationOrigBudget = null;
        }
        hideComputeOverlay();
      }).catch(function(err) {
        console.error('Elevation compute failed:', err);
        showToast('Elevation compute failed — see console');
        if (elevationOrigBudget !== null) {
          viewer.setPointBudget(elevationOrigBudget);
          elevationOrigBudget = null;
        }
        hideComputeOverlay();
      });
    }

    function onReapplyElevationRange() {
      if (!elevationActive || !elevationPositions || !elevationNodeMap) return;
      var zMin = parseFloat($('#elev-range-min').val());
      var zMax = parseFloat($('#elev-range-max').val());
      if (isNaN(zMin) || isNaN(zMax) || zMin >= zMax) { showToast('Invalid range'); return; }
      // Show updating status, disable button, then do work after a frame so UI refreshes
      var applyBtn = document.getElementById('btn-apply-elevation-range');
      if (applyBtn) { applyBtn.disabled = true; applyBtn.textContent = 'Updating...'; }
      $('#enable-elevation-status').text('Recoloring points...');
      setTimeout(function() {
        elevationZMin = zMin;
        elevationZMax = zMax;
        elevationCropBounds = getElevationCropBounds();
        applyElevationColors(elevationPositions, elevationNodeMap, zMin, zMax, elevationCropBounds);
        // Reset colored nodes so frame listener re-colors with new range
        elevationColoredNodes.clear();
        for (var ni = 0; ni < elevationNodeMap.length; ni++) {
          elevationColoredNodes.add(elevationNodeMap[ni].geometryNode);
        }
        updateElevationLegend(zMin, zMax);
        if (applyBtn) { applyBtn.disabled = false; applyBtn.textContent = 'Apply'; }
        $('#enable-elevation-status').text('');
        showToast('Range updated');
      }, 30);
    }

    function clearBoxElevation(volume) {
      var cfg = getBoxConfig(volume);
      cfg.active = false;
      cfg.surfaceGrid = null;
      cfg.planeSurfGrid = null;
      if (cfg.contourGroup) {
        disposeContourGroup(cfg.contourGroup);
        cfg.contourGroup = null;
      }
      cfg.contoursVisible = false;
      // Recompute any remaining active boxes' coloring; points from this box fall back to originals
      if (elevationActive && elevationPositions && elevationNodeMap) {
        applyElevationColors(elevationPositions, elevationNodeMap);
        elevationColoredNodes.clear();
        for (var ni = 0; ni < elevationNodeMap.length; ni++) {
          elevationColoredNodes.add(elevationNodeMap[ni].geometryNode);
        }
        // If no active boxes remain, tear down fully
        var anyActive = false;
        for (var i = 0; i < elevationCropVolumes.length; i++) {
          if (getBoxConfig(elevationCropVolumes[i]).active) { anyActive = true; break; }
        }
        if (!anyActive) {
          onClearElevation();
          return;
        }
        // Update legend to show a still-active box's range
        for (var i = 0; i < elevationCropVolumes.length; i++) {
          var c2 = getBoxConfig(elevationCropVolumes[i]);
          if (c2.active) {
            updateElevationLegend(c2.zMin, c2.zMax);
            elevationZMin = c2.zMin;
            elevationZMax = c2.zMax;
            break;
          }
        }
      }
      // Update contour visibility flag
      elevationContoursVisible = elevationCropVolumes.some(function(v2) {
        return getBoxConfig(v2).contoursVisible;
      });
      syncHighlightBoxes();
      rebuildElevationBoxList();
      showToast(volume.name + ' cleared');
    }

    function onClearElevation() {
      if (elevationOrigRGBA) {
        restoreOriginalRGBA(elevationOrigRGBA);
        elevationOrigRGBA = null;
      }
      elevationPositions = null;
      elevationNodeMap = null;
      elevationActive = false;
      elevationColoredNodes.clear();
      elevationCropBounds = null;
      elevationSurfaceGrid = null;
      elevationPlaneSurfGrid = null;
      clearElevationContours();
      hideElevationLegend();
      // Restore original point budget
      if (elevationOrigBudget !== null) {
        viewer.setPointBudget(elevationOrigBudget);
        elevationOrigBudget = null;
      }
      _elevBoxTransformCache = '';
      syncHighlightBoxes();
      // Reset all box per-compute state (preserve user config zMin/zMax/contourStep)
      elevationBoxConfigs.forEach(function(cfg) {
        cfg.active = false;
        cfg.surfaceGrid = null;
        cfg.planeSurfGrid = null;
        cfg.contourGroup = null;
        cfg.contoursVisible = false;
      });
      rebuildElevationBoxList();
      // Clear exclusion zones too
      for (var i = 0; i < exclusionBoxes.length; i++) {
        viewer.scene.removeVolume(exclusionBoxes[i]);
      }
      exclusionBoxes = [];
      _lastExclusionHash = '';
      rebuildExclusionList();
      $('#enable-elevation-status').text('');
      showToast('Elevation map cleared');
    }

    function onToggleElevationContours() {
      if (!elevationActive || !elevationPositions) { showToast('Compute elevation map first'); return; }
      if (elevationContoursVisible) {
        clearElevationContours();
        showToast('Contours hidden');
      } else {
        var cropBounds = getElevationCropBounds();
        buildElevationContours(elevationPositions, elevationZMin, elevationZMax, cropBounds);
        showToast('Contours generated');
      }
    }

    function onClearElevationContours() {
      clearElevationContours();
      showToast('Contours cleared');
    }

    // ===== Cut-out Crop Boxes (exclusion-based: hide points inside) =====
    var _cutoutCounter = 0;
    var cutoutBoxes = [];  // array of Potree BoxVolume (clip:false, used as exclusion boxes)

    function styleCutoutBox(vol) {
      // Keep the fill mesh for clicking but make it fully transparent
      if (vol.box) {
        vol.box.visible = true;
        vol.box.material.color.setHex(0x000000);
        vol.box.material.opacity = 0.0;
        vol.box.material.transparent = true;
        vol.box.material.needsUpdate = true;
      }
      // Red frame for cut-out boxes
      if (vol.frame) {
        vol.frame.material.color.setHex(0xff4444);
        vol.frame.material.needsUpdate = true;
      }
      // Hide the volume label
      if (vol.label) vol.label.visible = false;
    }

    // Attach listeners to a cutout box so elevation recolors after any transform
    function trackCutoutForElevation(volume) {
      var dirty = false;
      function markDirty() { dirty = true; }
      volume.addEventListener('position_changed', markDirty);
      volume.addEventListener('orientation_changed', markDirty);
      volume.addEventListener('scale_changed', markDirty);
      volume.addEventListener('drag', markDirty);
      volume.addEventListener('drop', function() {
        if (dirty && elevationActive) {
          setTimeout(function() { forceRecolorElevation(); }, 100);
        }
        dirty = false;
      });
      // Also catch gizmo handle drops via mouseup
      document.addEventListener('mouseup', function() {
        if (dirty && elevationActive) {
          setTimeout(function() {
            if (dirty) { forceRecolorElevation(); dirty = false; }
          }, 150);
        }
      });
    }

    function addCutoutBox() {
      var volume = viewer.volumeTool.startInsertion({ clip: false });
      _cutoutCounter++;
      volume.name = 'Cut-out ' + _cutoutCounter;
      volume.clip = false;

      styleCutoutBox(volume);
      setTimeout(function() { styleCutoutBox(volume); }, 500);

      cutoutBoxes.push(volume);
      trackVolumeUndo(volume);
      trackCutoutForElevation(volume);
      syncExclusionBoxes();
      rebuildCutoutList();
      showToast('Click and drag on the point cloud to place cut-out box.');
    }

    function removeCutoutBox(index) {
      if (index < 0 || index >= cutoutBoxes.length) return;
      var vol = cutoutBoxes[index];
      viewer.scene.removeVolume(vol);
      cutoutBoxes.splice(index, 1);
      syncExclusionBoxes();
      rebuildCutoutList();
      if (elevationActive) forceRecolorElevation();
      showToast('Cut-out box removed');
    }

    function clearAllCutoutBoxes() {
      for (var i = 0; i < cutoutBoxes.length; i++) {
        viewer.scene.removeVolume(cutoutBoxes[i]);
      }
      cutoutBoxes = [];
      syncExclusionBoxes();
      rebuildCutoutList();
      if (elevationActive) forceRecolorElevation();
      showToast('All cut-out boxes removed');
    }

    // Push cutout box transforms to every point cloud material as exclusion boxes
    function syncExclusionBoxes() {
      var activeBoxes = cutoutBoxes.filter(function(v) { return !v._disabled; });
      var matrixList = activeBoxes.map(function(vol) {
        vol.updateMatrixWorld(true);
        var inv = new THREE.Matrix4().copy(vol.matrixWorld).invert();
        return { inverse: inv };
      });
      viewer.scene.pointclouds.forEach(function(pc) {
        pc.material.setExclusionBoxes(matrixList);
      });
    }

    // Keep exclusion + highlight boxes in sync each frame. When an active
    // elevation box is moved/resized after compute, do a ONE-TIME restore of
    // the original RGBA on the first detection — the GPU shader green tint
    // (via syncHighlightBoxes) then shows the current OBB live with zero
    // per-frame CPU work, exactly like the pre-compute preview. The flag
    // resets when the user clicks Recompute and the new heat map paints.
    var _elevBoxTransformCache = '';
    var _heatMapStaleForDrag = false;
    viewer.addEventListener('update', function() {
      if (cutoutBoxes.length > 0) {
        syncExclusionBoxes();
      }
      if (elevationCropVolumes.length > 0) {
        // Always sync highlights (handles dragging in real-time, including
        // the new "active box transform != computedBoxMatrix" case).
        syncHighlightBoxes();
        if (elevationActive && !_heatMapStaleForDrag) {
          var anyModified = false;
          for (var i = 0; i < elevationCropVolumes.length; i++) {
            var v = elevationCropVolumes[i];
            if (v._disabled) continue;
            var cfg = getBoxConfig(v);
            if (!cfg.active || !cfg.computedBoxMatrix) continue;
            v.updateMatrixWorld(true);
            if (_matricesDiffer(v.matrixWorld, cfg.computedBoxMatrix)) {
              anyModified = true;
              break;
            }
          }
          if (anyModified) {
            // First-frame-after-change: clear the stale heat map so the
            // green-tint preview is unambiguous. Subsequent frames are
            // GPU-only via the highlight shader — no per-frame CPU walk.
            if (elevationOrigRGBA) restoreOriginalRGBA(elevationOrigRGBA);
            _heatMapStaleForDrag = true;
          }
        }
      } else {
        _elevBoxTransformCache = '';
      }
    });

    function rebuildCutoutList() {
      var list = document.getElementById('enable-global-crop-list');
      if (!list) return;
      list.innerHTML = '';

      if (cutoutBoxes.length > 0) {
        document.getElementById('btn-clear-all-cutouts').style.display = '';
      } else {
        document.getElementById('btn-clear-all-cutouts').style.display = 'none';
      }

      for (var i = 0; i < cutoutBoxes.length; i++) {
        (function(idx) {
          var vol = cutoutBoxes[idx];
          var row = document.createElement('div');
          row.style.cssText = 'display:flex;align-items:center;gap:6px;margin:2px 0;font:12px/1.3 sans-serif;color:var(--sidebar-text,#fbfbfb)';

          var nameSpan = document.createElement('span');
          nameSpan.style.flex = '1';
          nameSpan.textContent = vol.name;

          var eyeBtn = document.createElement('button');
          eyeBtn.textContent = vol._disabled ? '\u2014' : '\u{1F441}';
          eyeBtn.title = 'Toggle this cut-out on/off';
          eyeBtn.style.cssText = 'background:none;border:none;color:var(--sidebar-text,#fbfbfb);cursor:pointer;font-size:14px;padding:2px 4px';
          eyeBtn.addEventListener('click', function() {
            vol._disabled = !vol._disabled;
            vol.visible = !vol._disabled;
            styleCutoutBox(vol);  // re-apply styling (hide fill/label)
            syncExclusionBoxes();
            rebuildCutoutList();
            if (elevationActive) forceRecolorElevation();
          });

          var outlineBtn = document.createElement('button');
          var outlineVisible = vol.frame ? vol.frame.visible : true;
          outlineBtn.textContent = outlineVisible ? '\u25A1' : '\u25A0';
          outlineBtn.title = 'Toggle outline visibility';
          outlineBtn.style.cssText = 'background:none;border:none;color:var(--sidebar-text,#fbfbfb);cursor:pointer;font-size:14px;padding:2px 4px';
          outlineBtn.addEventListener('click', function() {
            vol._outlineHidden = !vol._outlineHidden;
            vol.visible = !vol._outlineHidden;
            if (!vol._outlineHidden) styleCutoutBox(vol);
            outlineBtn.textContent = vol._outlineHidden ? '\u25A0' : '\u25A1';
          });

          var delBtn = document.createElement('button');
          delBtn.textContent = '\u2715';
          delBtn.title = 'Remove this cut-out box';
          delBtn.style.cssText = 'background:none;border:none;color:#f44;cursor:pointer;font-size:14px;padding:2px 4px';
          delBtn.addEventListener('click', function() { removeCutoutBox(idx); });

          row.appendChild(nameSpan);
          row.appendChild(eyeBtn);
          row.appendChild(outlineBtn);
          row.appendChild(delBtn);
          list.appendChild(row);
        })(i);

    // -- Hover highlight state (persists across mousemove calls) --

        var mouse = { x: e.clientX - rect.left, y: e.clientY - rect.top };
        var camera = viewer.scene.getActiveCamera();
        var pickResult = _origPick(mouse, camera, viewer, viewer.scene.pointclouds, { pickClipped: true });
        if (pickResult && pickResult.location) {

        }
        return;
      }
      // Member endpoint dragging
      if (memberDragActive && memberDragInfo) {

        var camera = viewer.scene.getActiveCamera();

          if (recomputeConstraint(c)) {

      }
      // X-axis pick marker dragging (during plane-x-axis pick mode).
      // Marker follows the actual scan geometry; projection onto the plane

    // -- Hover highlight: scale up glow when cursor is near a custom point --
    var rect2 = renderArea.getBoundingClientRect();

    var cam = viewer.scene.getActiveCamera();
    var bestHoverDist = HOVER_THRESHOLD;
    var bestHoverGroup = null;

    var checkHover = function(worldPos, group) {
      var pt = worldPos.clone().project(cam);

      var sy = (1 - (pt.y * 0.5 + 0.5)) * rect2.height;

    if (_hoveredGroup !== bestHoverGroup) {

    renderArea.addEventListener('mouseup', function(e) {

          var newMark = markedPoints[markedPoints.length - 1];
          if (newMark) assignZBaseMark(targetVol, newMark.id);
        } else {
          showToast('No point found under cursor');
        }
        return;
      }

      const pickResult = Potree.Utils.getMousePointCloudIntersection(
        mouse, camera, viewer, viewer.scene.pointclouds, { pickClipped: true }
      );

      if (pickResult && pickResult.location) {
        var pos = pickResult.location;
        // Snap check for member/constraint picks (aggressive threshold)
        if (memberPickMode || constraintPickMode) {
          var snap = findSnapTarget(mouse, SNAP_THRESHOLD_MEMBER);
          if (snap) {
            pos = snap.position;
            showToast('Snapped to ' + snap.label, 1500);
          }
        }
        if (memberPickMode) {
          handleMemberPick(pos);
        } else if (constraintPickMode) {
          handleConstraintPick(pos);
        } else {
          placeMarker(pos);
        }
      } else {
        showToast("No point found under cursor");
      }
    }, true);

    // ----- load the point cloud -----
    Potree.loadPointCloud(cloudURL, pointCloudID).then((e) => {
      const pc    = e.pointcloud;
      const scene = viewer.scene;
      scene.addPointCloud(pc);

      // material defaults
      pc.material.size = 1.0;
      pc.material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
      pc.material.shape = Potree.PointShape.CIRCLE;

      // Fit camera to content on first load
      viewer.fitToScreen();

      // ===== Auto-scale marker size based on bounding box =====
      try {
        pc.updateMatrixWorld(true);
        let worldBB;
        if (typeof pc.getBoundingBoxWorld === "function") {
          worldBB = pc.getBoundingBoxWorld(new THREE.Box3());
        } else if (pc.pcoGeometry && pc.pcoGeometry.tightBoundingBox) {
          worldBB = pc.pcoGeometry.tightBoundingBox.clone().applyMatrix4(pc.matrixWorld);
        } else {
          worldBB = pc.boundingBox.clone().applyMatrix4(pc.matrixWorld);
        }
        const size = worldBB.getSize(new THREE.Vector3());
        const diagonal = Math.sqrt(size.x * size.x + size.y * size.y + size.z * size.z);
        ringOuterRadius = diagonal * 0.002;      // visible zoomed out
        ringMiddleRadius = diagonal * 0.0005;   // mid-range
        ringInnerRadius = diagonal * 0.00012;    // ~single point sized
        if (ringOuterRadius < 0.02) ringOuterRadius = 0.02;
        if (ringMiddleRadius < 0.005) ringMiddleRadius = 0.005;
        if (ringInnerRadius < 0.001) ringInnerRadius = 0.001;
      } catch (err) {
        console.warn('Marker size auto-scale failed, using default:', err);
      }

      // ===== INITIAL, LOCKED CLIP BOX (robust across forks) =====
      try {
        // World-space AABB of the cloud
        pc.updateMatrixWorld(true);
        // Prefer tightBoundingBox (actual scan extents) over the cubic octree BB
        let worldBB;
        if (pc.pcoGeometry && pc.pcoGeometry.tightBoundingBox) {
          worldBB = pc.pcoGeometry.tightBoundingBox.clone().applyMatrix4(pc.matrixWorld);
        } else if (typeof pc.getBoundingBoxWorld === "function") {
          worldBB = pc.getBoundingBoxWorld(new THREE.Box3());
        } else {
          worldBB = pc.boundingBox.clone().applyMatrix4(pc.matrixWorld);
        }
        const center = worldBB.getCenter(new THREE.Vector3());
        const size   = worldBB.getSize(new THREE.Vector3());

        let clipBox;

        // Preferred: use clippingTool if present
        if (viewer.clippingTool && typeof viewer.clippingTool.addBox === "function") {
          clipBox = viewer.clippingTool.addBox();
          clipBox.clip = true;
          clipBox.setPosition(center);
          clipBox.scale.set(size.x, size.y, size.z);
        } else if (typeof Potree.BoxVolume === "function") {
          // Fallback: plain BoxVolume
          clipBox = new Potree.BoxVolume();
          clipBox.clip = true;
          clipBox.position.copy(center);
          clipBox.scale.set(size.x, size.y, size.z);
          scene.addVolume(clipBox);
        } else {
          console.warn("No BoxVolume/ClippingTool available in this build; skipping clip box.");
        }

        if (clipBox) {
          clipBox.name = "Initial Crop";
          clipBox.visible = true;
          clipBox.userData = clipBox.userData || {};
          clipBox.userData.persistent = true;     // mark as locked
          initialClipBox = clipBox;               // store reference for elevation tool

          // Disallow editing if API exists
          if (typeof clipBox.setEditable === "function") clipBox.setEditable(false);

          viewer.setClipTask(Potree.ClipTask.SHOW_INSIDE);
          viewer.setClipMethod(Potree.ClipMethod.INSIDE_ANY);

          // Prevent deletion through scene API
          const originalRemoveVolume = scene.removeVolume ? scene.removeVolume.bind(scene) : null;
          if (originalRemoveVolume) {
            scene.removeVolume = (vol) => {
              if (vol && vol.userData && vol.userData.persistent) return; // ignore
              return originalRemoveVolume(vol);
            };
          }

          // Prevent Delete/Backspace removal — but NOT when typing in form fields
          document.addEventListener("keydown", (ev) => {
            if (ev.key === "Delete" || ev.key === "Backspace") {
              var t = ev.target;
              var tag = t && t.tagName;
              if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (t && t.isContentEditable)) return;
              const ih = viewer.inputHandler;
              const sel = (ih && (ih.selected || ih.selection)) ? Array.from(ih.selected || ih.selection) : [];
              const hasLocked = sel.some(s => s && s.userData && s.userData.persistent);
              if (hasLocked) { ev.preventDefault(); ev.stopPropagation(); }
            }
          }, true);
        }
      } catch (err) {
        console.warn('Clip box init failed:', err);
      }
    }).catch((err) => {
      console.error(err);
      alert('Failed to load point cloud: ' + cloudURL);
    });

    // ----- keyboard helpers -----
    window.addEventListener('keydown', (ev) => {
      // Existing shortcuts
      if (ev.key === 'e' || ev.key === 'E') viewer.setEDLEnabled(!viewer.getEDLEnabled()); // toggle EDL
      if (ev.key === '+' || ev.key === '=') viewer.setPointBudget(viewer.getPointBudget() + 250000);
      if (ev.key === '-' || ev.key === '_') viewer.setPointBudget(Math.max(250000, viewer.getPointBudget() - 250000));
      if (ev.key === 'f' || ev.key === 'F') viewer.fitToScreen();

      // Mark point shortcuts
      if (ev.key === 'x' || ev.key === 'X') toggleMarkMode();
      if ((ev.key === 'z' || ev.key === 'Z') && !ev.ctrlKey && !ev.metaKey) clearAllMarkers();
      // Member shortcut
      if (ev.key === 'm' || ev.key === 'M') startMemberPick();
      // Ortho-measure toggle (requires an active plane with a basis)
      if (ev.key === 'o' || ev.key === 'O') {
        var _t = ev.target;
        var _typing = _t && (_t.tagName === 'INPUT' || _t.tagName === 'TEXTAREA' || _t.isContentEditable);
        if (!_typing && !constraintPickMode && !memberPickMode && !MARK_MODE) {
          if (!_orthoMeasureMode) {
            var ac = constraints.find(function(con) { return con.id === activeConstraintId; });
            if (!ac || ac.type !== 'plane' || !ac.basis) {
              showToast('Activate a plane first to enable ortho measure', 3000);
            } else {
              _orthoMeasureMode = true;
              var axesLbl = _orthoParallelMode ? 'X/Y/Z' : 'X/Y';
              showToast('Ortho measure ON — picks snap to ' + ac.name + ' ' + axesLbl + ' axes', 3000);
              updateConstraintStatus();
            }
          } else {
            _orthoMeasureMode = false;
            showToast('Ortho measure OFF', 2000);
            updateConstraintStatus();
          }
        }
      }
      // Parallel mode toggle: switch between drawing on the active plane
      // (default) and drawing in a parallel plane that follows the prior pick.
      if (ev.key === 'p' || ev.key === 'P') {
        var _tp = ev.target;
        var _typingP = _tp && (_tp.tagName === 'INPUT' || _tp.tagName === 'TEXTAREA' || _tp.isContentEditable);
        if (!_typingP && !constraintPickMode && !memberPickMode && !MARK_MODE) {
          if (!_orthoParallelMode) {
            var acP = constraints.find(function(con) { return con.id === activeConstraintId; });
            if (!acP || acP.type !== 'plane' || !acP.basis) {
              showToast('Activate a plane first to enable parallel mode', 3000);
            } else {
              _orthoParallelMode = true;
              showToast('Parallel mode ON — drawing tracks last pick’s elevation; ortho includes Z', 3500);
              updateConstraintStatus();
            }
          } else {
            _orthoParallelMode = false;
            showToast('Parallel mode OFF — drawing locked to the active plane', 2500);
            updateConstraintStatus();
          }
        }
      }
      // Undo
      if ((ev.key === 'z' || ev.key === 'Z') && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); performUndo(); }

      // Enter: finalize fit-plane (when in that mode), otherwise restart
      // the last measurement/volume tool used (skip when typing in inputs).
      if (ev.key === 'Enter') {
        if (constraintPickMode && constraintPickType === 'fit-plane') {
          ev.preventDefault();
          finalizeConstraint();
        } else if (constraintPickMode && constraintPickType === 'plane-x-axis' && constraintPickPoints.length >= 2) {
          ev.preventDefault();
          finalizePlaneXAxis();
        } else {
          var t = ev.target;
          var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
          if (!typing && !constraintPickMode && !memberPickMode && !MARK_MODE && !pendingMeasurement) {
            if (restartLastMeasurementTool()) {
              ev.preventDefault();
            }
          }
        }
      }

      if (ev.key === 'Escape') {
        if (zBasePickMode) { cancelZBasePick(); rebuildElevationBoxList(); }
        else if (constraintPickMode) cancelConstraintPick();
        else if (memberPickMode) cancelMemberPick();
        else if (MARK_MODE) toggleMarkMode(true);
        // Hard-cancel any active Potree measurement insertion: dispatches
        // cancel_insertions, stops the InputHandler drag, and removes any
        // orphan measurement that has fewer than the required points.
        cancelPotreeInsertion();
      }
    });
  })();
  </script>
</body>
</html>
